side on a shared task can change how people feel about each other)이고, 둘째 문장의 두 남학생 이야기는 그 원리를 보여 주는 장면이에요. 서로 싫어하던 둘이 과학 대회에 낼 로봇을 함께 만들다가 친해졌어요(became close friends while building a robot for the science fair). 둘은 대회에서 이긴 뒤가 아니라 로봇을 만드는 동안 친해졌고, 성격이 비슷하다는 말도 없어요. 둘을 가깝게 만든 것은 한 가지 일을 나란히 한 것이에요. 그래서 요점은 같이 일해 보면 사이가 좋아질 수 있다는 거예요.","tr":[["대회에서 이기면 → 사이가 좋아짐","science fair 낱말에 끌린 답이에요. 결과는 같지만 까닭이 달라요. 글에는 이겼다는 말이 없고, 두 사람은 대회가 끝난 뒤가 아니라 로봇을 만드는 동안 친해졌어요(became close friends while building a robot for the science fair)."],["성격이 비슷하면 → 사이가 좋아짐","사이가 좋아졌다는 결과는 같지만 까닭이 달라요. 두 사람은 비슷해서 친해진 게 아니라, 서로 싫어하던 사이에서 로봇을 함께 만들며 친해졌어요(who had disliked each other became close friends while building a robot)."],["로봇을 만들면 → 과학 실력이 늚","robot · science 낱말은 같지만 결과가 달라요. 함께 일하며 바뀐 것은 과학 실력이 아니라 서로를 대하는 마음이에요(change how people feel about each other)."],["친한 친구끼리면 → 대회 성적이 좋음","close friends · science fair 낱말은 같지만 앞뒤가 뒤바뀌었어요. 두 사람은 친해서 함께 일한 게 아니라, 함께 일하다가 친해졌어요(became close friends while building a robot for the science fair). 대회 성적 이야기도 없어요."]],"dg":"원리와 장면 나란히"},{"id":"4-4","k":4,"dev":"This + 명사 (앞 문장 받기)","s":"This small habit, she claims, makes her friends feel appreciated rather than annoyed, and they seem to forgive her more easily.","a":"고맙다고 말하면 → 더 너그러워짐","why":"This small habit은 앞 문장에서 사촌이 늦은 날 「늦어서 미안해」 대신 「기다려 줘서 고마워」라고 하는 습관을 받아요(never says 'Sorry I'm late' but 'Thank you for waiting.'). 사촌 말로는 이 습관 덕에 친구들이 짜증 대신 고마움을 받았다고 느끼고(makes her friends feel appreciated rather than annoyed), 더 쉽게 용서해 주는 것 같대요. 친구들의 마음을 바꾼 것은 미리 한 연락이나 선물이 아니라 늦게 와서 하는 그 한마디예요. 그래서 요점은 늦었을 때 고맙다고 말하면 상대가 더 너그러워질 수 있다는 거예요.","tr":[["미리 연락해 두면 → 더 너그러워짐","너그러워졌다는 결과는 같지만 까닭이 달라요. This small habit이 받는 것은 미리 하는 연락이 아니라, 늦게 와서 하는 말이에요(never says 'Sorry I'm late' but 'Thank you for waiting.')."],["작은 선물을 주면 → 더 너그러워짐","너그러워졌다는 결과는 같지만 까닭이 달라요. 글에는 선물 이야기가 없고, 사촌이 건넨 것은 고맙다는 한마디예요(but 'Thank you for waiting.')."],["자주 늦으면 → 친구들이 멀어짐","friends 낱말은 같지만 결과가 거꾸로예요. 친구들은 멀어지기는커녕 더 쉽게 용서해 주는 것 같다고 해요(they seem to forgive her more easily)."],["작은 버릇도 쌓이면 → 친구가 짜증 냄","small habit · friends · annoyed 낱말은 같지만 뜻이 거꾸로예요. 이 작은 습관은 친구들이 짜증 대신 고마움을 느끼게 해요(makes her friends feel appreciated rather than annoyed)."]],"ctx":"On days she is late, my cousin never says 'Sorry I'm late' but 'Thank you for waiting.'","dg":"this + 명사"},{"id":"4-5","k":4,"dev":"It (가장 가까운 명사가 아니라 앞 문장 전체를 받음)","s":"It has made me feel closer to her than any long phone call, because I can keep the notes and read them again on bad days.","a":"손으로 써 주면 → 더 가까워짐","why":"It은 바로 앞의 a text message가 아니라 앞 문장 전체, 곧 엄마가 문자 대신 일주일에 한 번 손으로 쓴 쪽지를 도시락에 넣어 준 일을 받아요. 문자는 쪽지로 바꿨으니 문자가 한 일일 리 없어요(instead of sending me a text message). 그 쪽지가 어떤 긴 통화보다 엄마를 가깝게 느끼게 했고(It has made me feel closer to her than any long phone call), 까닭은 쪽지를 간직해 두었다가 힘든 날 다시 읽을 수 있어서예요(I can keep the notes and read them again on bad days). 그래서 요점은 손으로 써 준 말은 남겨 두고 다시 읽을 수 있어 더 가깝게 느껴질 수 있다는 거예요.","tr":[["문자를 보내면 → 더 가까워짐","가까워졌다는 결과는 같지만 It을 가장 가까운 명사(a text message)로 받은 답이에요. 엄마는 문자 대신 쪽지를 넣어 줬어요(instead of sending me a text message). It은 앞 문장 전체, 곧 손으로 쓴 쪽지를 넣어 준 일을 받아요."],["길게 통화하면 → 더 가까워짐","long phone call · closer 낱말은 같지만 거꾸로예요. 쪽지가 어떤 긴 통화보다 더 가깝게 느끼게 했어요(closer to her than any long phone call)."],["자주 연락하면 → 걱정이 줄어듦","흔히 하는 말이지만 글이 보여 주지 않아요. 쪽지는 일주일에 한 번뿐이었고(once a week), 글이 말하는 것은 걱정이 아니라 엄마를 더 가깝게 느낀 일이에요(It has made me feel closer to her)."],["가끔 연락하면 → 더 반가움","once a week에서 끌어낸 그럴듯한 말이지만 글이 든 까닭이 아니에요. 쪽지가 엄마를 더 가깝게 느끼게 한 까닭으로 글이 든 것은 드물게 와서가 아니라 간직해 두고 다시 읽을 수 있다는 점이에요(because I can keep the notes and read them again on bad days)."]],"ctx":"Last year, my mother started putting a short handwritten note in my lunch box once a week instead of sending me a text message.","dg":"it"},{"id":"4-6","k":4,"dev":"장면 하나 (원리를 스스로 끌어냄)","s":"When the bus driver who had driven our village route for twenty years fell ill, his regular passengers took turns cooking meals for his family.","a":"오래 정을 쌓으면 → 힘들 때 도움 받음","why":"For example 같은 신호 없이 장면 하나만 있어요. 그래서 이 장면이 무엇을 보여 주는지 스스로 끌어내야 해요. 이십 년 동안 마을 길을 몬 기사(the bus driver who had driven our village route for twenty years)가 병이 나자, 도움을 준 것은 그 버스를 타던 승객들이었어요(his regular passengers took turns cooking meals for his family). 오래 오가며 쌓인 정이 어려울 때 도움으로 돌아왔다고 읽을 수 있어요. 그래서 이 장면이 보여 주는 원리는 오래 정을 쌓으면 힘들 때 도움을 받을 수 있다는 거예요.","tr":[["가족이 많으면 → 힘들 때 도움 받음","family 낱말은 같고 결과도 같지만 누가 도왔는지가 바뀌었어요. 밥을 지은 쪽은 가족이 아니라 승객들이고, 가족은 도움을 받은 쪽이에요(his regular passengers took turns cooking meals for his family)."],["보험을 들어 두면 → 힘들 때 도움 받음","도움을 받았다는 결과는 같지만 까닭이 달라요. 글에는 돈이나 보험 이야기가 없고, 도움은 그 기사의 버스를 타던 승객들에게서 왔어요(his regular passengers took turns cooking meals)."],["몸이 아프면 → 가족이 곁을 지킴","fell ill · family 낱말은 같지만 누가 도왔는지가 바뀌었어요. 글에서 밥을 지어 준 쪽은 가족이 아니라 승객들이에요(his regular passengers took turns cooking meals for his family)."],["돌아가며 맡으면 → 일이 덜 힘듦","took turns 낱말을 빌렸지만 요점이 달라요. 돌아가며 했다는 것은 승객들이 도운 방법일 뿐이고, 문장은 일을 나누는 요령이 아니라 오래 마을 길을 몬 기사가 아플 때 승객들이 나선 일을 말해요(When the bus driver who had driven our village route for twenty years fell ill)."]],"dg":"장면 하나"},{"id":"4-7","k":4,"dev":"Such + 명사 (앞 문장의 일부만 받음)","s":"Such small kindnesses are what most of us still talk about, long after the broken elevator itself has been forgotten.","a":"곤란할 때 도우면 → 오래 이야깃거리","why":"Such small kindnesses는 앞 문장 전체도, 바로 앞의 화난 쪽지도 아니고, 그 가운데 친절한 쪽, 곧 나이 든 이웃의 장바구니를 위층까지 들어 준 일(carried groceries upstairs for older neighbors)만 받아요. 화난 쪽지는 친절이 아니니까요. 이 문장은 그런 작은 친절을 고장이 잊힌 뒤에도 사람들이 아직 이야기한다고 해요(long after the broken elevator itself has been forgotten). 오래 남은 것은 고장도 잔치도 아니고, 곤란할 때 건넨 작은 도움이에요. 그래서 요점은 곤란할 때 도운 일이 오래 이야깃거리로 남는다는 거예요.","tr":[["고장이 크면 → 오래 이야깃거리","broken elevator · talk about 낱말은 같지만 거꾸로예요. 고장은 잊혔고(the broken elevator itself has been forgotten), 사람들이 아직 이야기하는 것은 작은 친절이에요(Such small kindnesses are what most of us still talk about)."],["이웃 잔치를 열면 → 오래 이야깃거리","오래 이야깃거리가 됐다는 결과는 같지만 까닭이 달라요. 글에는 잔치 이야기가 없고, 사람들이 아직 이야기하는 것은 장바구니를 들어 준 것 같은 작은 친절이에요(Such small kindnesses)."],["화난 쪽지를 붙이면 → 이웃이 멀어짐","angry notes 낱말을 빌렸지만 Such small kindnesses가 받는 쪽이 아니에요. 화난 쪽지는 친절이 아니고, 이웃이 멀어졌다는 말도 글에 없어요. 이 문장이 받는 것은 장바구니를 들어 준 일 같은 작은 친절이에요(carried groceries upstairs for older neighbors)."],["가까이 살면 → 친척보다 나음","이웃을 두고 흔히 하는 말이지만 글에 없어요. 글은 친척과 견주지 않고, 작은 친절을 사람들이 아직도 이야기한다고 해요(what most of us still talk about)."]],"ctx":"A few winters ago, the elevator in our building broke for a week. Some residents carried groceries upstairs for older neighbors, and others posted angry notes in the lobby.","dg":"such + 명사"},{"id":"4-8","k":4,"dev":"앞 문장 + 장면 (이음말 없음)","s":"She greeted each student by name, and within a month, many students were saying hello to the janitors and cafeteria workers they used to walk past.","a":"인사를 받으면 → 남에게도 건넴","why":"For example 같은 신호는 없지만, 앞 문장과 이 문장이 한 장면을 이루어요. 교장이 학생마다 이름을 불러 인사했더니(She greeted each student by name), 한 달 안에 학생들이 전에는 그냥 지나치던 직원들에게 인사하기 시작했어요(many students were saying hello to the janitors and cafeteria workers they used to walk past). 교장에게서 시작된 인사가 학생들에게서 멈추지 않고 전에 지나치던 사람들에게까지 이어졌다는 점이 열쇠예요. 글이 보여 주는 달라진 점은 학생들의 기분이나 교장과의 사이가 아니라, 그 인사가 다른 사람에게 건너간 일이에요. 그래서 이 장면이 보여 주는 원리는 인사를 받으면 그 인사를 다른 사람에게도 건넬 수 있다는 거예요.","tr":[["인사를 받으면 → 그 사람에게 돌려줌","saying hello 낱말은 같지만 글이 짚은 것은 교장에게 돌려준 인사가 아니라, 전에는 그냥 지나치던 직원들에게 건넨 인사예요(the janitors and cafeteria workers they used to walk past)."],["인사를 받으면 → 기분이 좋아짐","흔히 하는 말이지만 이 장면이 보여 주는 것이 아니에요. 글에는 학생들의 기분 이야기가 없고, 달라진 것은 학생들이 직원들에게 인사하게 된 일이에요(many students were saying hello to the janitors and cafeteria workers)."],["날마다 교문에 서면 → 지각이 줄어듦","school gate · every morning 낱말을 빌렸지만 글에 없는 결과예요. 달라진 것은 지각이 아니라 학생들이 직원들에게 인사하게 된 일이에요(many students were saying hello to the janitors and cafeteria workers)."],["이름을 불러 주면 → 한 달이면 친해짐","by name · within a month 낱말은 같지만 결과를 지어냈어요. 한 달 안에 달라진 것은 누가 친해진 일이 아니라, 학생들이 전에 지나치던 직원들에게 인사하게 된 일이에요(within a month, many students were saying hello to the janitors and cafeteria workers)."]],"ctx":"Last spring, our new principal began standing at the school gate every morning.","dg":"앞 문장 + 장면"},{"id":"4-9","k":4,"dev":"Imagine ~","s":"Imagine two classmates who lend each other a pen, then their notes, and later a laptop: each loan makes the next request a little easier.","a":"조금씩 주고받으면 → 믿음이 쌓임","why":"Imagine ~은 사례를 그려 보이는 신호예요. 두 친구가 펜, 다음에 필기 노트, 나중에는 노트북을 서로 빌려주고(lend each other a pen, then their notes, and later a laptop), 그때마다 다음 부탁이 조금씩 쉬워져요(each loan makes the next request a little easier). 큰 부탁이 먼저 온 것도, 비밀을 나눈 것도 아니에요. 작은 것을 주고받는 일이 쌓이며 다음 부탁이 쉬워지는 것은 둘 사이에 믿음이 자란다는 뜻으로 읽을 수 있어요. 펜 · 노트북이라는 겉을 걷어 내면, 조금씩 주고받으면 믿음이 쌓인다는 원리가 남아요.","tr":[["큰 부탁을 들어주면 → 믿음이 쌓임","request 낱말은 같지만 차례가 뒤바뀌었어요. 두 친구는 펜, 노트, 노트북 차례로 빌려줬어요(a pen, then their notes, and later a laptop). 작은 것부터 차례로 한 빌림이 다음 부탁을 쉽게 만들었고(each loan makes the next request a little easier), 큰 부탁인 노트북은 맨 나중에 왔어요(and later a laptop)."],["비밀을 털어놓으면 → 믿음이 쌓임","믿음이 쌓인다는 결과는 같지만 까닭이 달라요. 두 친구가 주고받은 것은 비밀이 아니라 펜 · 노트 · 노트북 같은 물건이에요(lend each other a pen, then their notes, and later a laptop)."],["자주 빌리면 → 부탁이 귀찮아짐","loan · request 낱말은 같지만 방향이 거꾸로예요. 빌려줄 때마다 다음 부탁이 귀찮아지는 게 아니라 조금씩 쉬워져요(each loan makes the next request a little easier)."],["노트를 빌려 보면 → 공부가 쉬워짐","notes · easier 낱말은 같지만 무엇이 쉬워지는지가 바뀌었어요. 쉬워지는 것은 공부가 아니라 다음 부탁이에요(makes the next request a little easier)."]],"dg":"imagine ~"},{"id":"4-10","k":4,"dev":"장면 하나 (원리를 스스로 끌어냄)","s":"Since my parents let my younger brother buy his own shoes with his allowance, he has taken better care of them than of any pair they bought him.","a":"자기 돈을 들이면 → 더 아껴 씀","why":"For example 같은 신호 없이 한 가족의 장면만 있어요. 부모가 동생에게 제 용돈으로 신발을 사게 했더니(let my younger brother buy his own shoes with his allowance), 동생이 그 신발을 부모가 사 준 어떤 신발보다 잘 챙겨요(he has taken better care of them than of any pair they bought him). 문장이 두 신발을 견주며 짚은 것은 누구 돈으로 샀느냐예요(with his allowance). 값 이야기는 없고, 부모가 사 준 신발은 오히려 덜 챙겼어요. 신발 · 용돈이라는 겉을 걷어 내면, 자기 돈을 들인 물건은 더 아껴 쓸 수 있다는 원리가 남아요.","tr":[["선물로 받으면 → 더 아껴 씀","they bought him 낱말에 끌린 답이에요. 부모가 사 준 신발, 곧 선물로 받은 신발은 오히려 제 돈으로 산 신발보다 덜 챙겼어요(than of any pair they bought him). 그러니 더 아낀 까닭이 선물일 수는 없어요."],["비싼 걸 사면 → 더 아껴 씀","더 아껴 쓴다는 결과는 같지만 까닭이 달라요. 글에는 값 이야기가 없고, 문장이 짚은 것은 동생이 제 용돈으로 샀다는 점이에요(buy his own shoes with his allowance)."],["더 잘 챙기면 → 신발이 오래감","taken better care · shoes 낱말은 같지만 결과를 지어냈어요. 글은 신발이 오래갔다는 말이 아니라, 왜 그 신발을 더 잘 챙기게 됐는지를 보여 줘요(Since my parents let my younger brother buy his own shoes with his allowance)."],["신발을 자주 사면 → 쉽게 싫증 남","신발을 두고 흔히 하는 말이지만 글에 없어요. 글은 신발을 자주 샀다는 게 아니라, 제 돈으로 산 신발을 더 잘 챙긴다고 해요(he has taken better care of them)."]],"dg":"장면 하나"},{"id":"4-11","k":4,"dev":"Picture ~ (장면 그려 보기)","s":"Picture a school library that hides the covers of some books under plain paper: many students end up borrowing kinds of books they have never tried.","a":"겉모습 안 보이면 → 낯선 것도 고름","why":"Picture ~는 「~를 그려 보라」며 장면 하나를 사례로 내놓는 신호예요. 도서관이 몇몇 책의 표지를 수수한 종이로 가리자(hides the covers of some books under plain paper) 많은 학생이 한 번도 안 읽어 본 갈래의 책을 빌려 가요(borrowing kinds of books they have never tried). 표지라는 겉모습으로 고를 수 없게 되자 낯선 책에도 손이 갔다고 읽을 수 있으니, 겉모습이 안 보이면 낯선 것도 골라 본다는 원리로 끌어올려야 해요. 도서관 · 표지 · 빌림 같은 사례 낱말은 원리에 남기지 않아요.","tr":[["새 책 들이면 → 안 읽던 갈래 빌림","빌림 · 안 읽던 갈래 낱말은 같지만 까닭이 달라요. 도서관은 새 책을 들인 게 아니라 있던 책의 표지를 가렸어요(hides the covers of some books under plain paper)."],["사서가 권하면 → 낯선 갈래도 빌림","낯선 갈래를 빌렸다는 결과는 같지만 까닭을 지어냈어요. 글에는 누가 권했다는 말이 없고, 바뀐 것은 표지를 가린 일 하나예요(hides the covers of some books)."],["고를 게 많으면 → 낯선 것도 고름","고를 것이 많으면 새것에도 손이 간다는 그럴듯한 원리지만 이 장면이 보여 주지 않아요. 도서관은 책을 늘리지 않고 몇 권의 표지만 가렸어요(hides the covers of some books under plain paper)."],["친구가 권하면 → 낯선 것도 고름","친구의 추천이 새 책으로 이끈다는 흔한 말이지만 글에 친구 이야기는 없어요. 학생들을 낯선 책으로 이끈 것은 가려진 표지예요(hides the covers of some books)."]],"dg":"imagine ~"},{"id":"4-12","k":4,"dev":"장면만 두 문장 (신호 말 없음)","s":"Every month, the cooks and servers at one busy restaurant trade jobs for a single lunch shift. Angry words between the kitchen and the dining room have become rare there.","a":"남의 일 겪어 보면 → 덜 부딪침","why":"For example 같은 신호 말 없이 한 식당의 장면만 두 문장으로 나와요. 첫 문장은 요리사와 종업원이 달마다 점심 한 번씩 서로 일을 바꿔 맡는다는 것(trade jobs for a single lunch shift), 둘째 문장은 주방과 홀 사이에 화난 말이 드물어졌다는 것(Angry words between the kitchen and the dining room have become rare there)이에요. 두 문장을 이어 읽으면 이것이 사례라는 게 보여요. 서로의 일을 직접 해 보고 덜 부딪치게 됐다고 읽을 수 있으니, 남의 일을 겪어 보면 덜 부딪친다는 원리로 끌어올려야 해요.","tr":[["주방 넓히면 → 큰소리 드물어짐","kitchen · rare 낱말은 같지만 까닭을 지어냈어요. 주방을 넓혔다는 말은 없고, 이 식당이 한 일은 일을 바꿔 맡은 것이에요(trade jobs for a single lunch shift)."],["홀 손님 줄면 → 불평 드물어짐","dining room · rare 낱말은 같지만 까닭을 지어냈어요. 손님이 줄었다는 말은 없고 여전히 바쁜 식당이에요(one busy restaurant). 드물어진 것도 손님 불평이 아니라 주방과 홀 사이의 화난 말이에요(Angry words between the kitchen and the dining room)."],["제 일에 집중하면 → 덜 부딪침","각자 제 일에 집중하면 덜 다툰다는 흔한 말이지만 이 식당은 거꾸로 했어요. 요리사와 종업원이 달마다 점심 한 번씩 서로 일을 바꿔 해 봤어요(the cooks and servers at one busy restaurant trade jobs)."],["자주 모여 말하면 → 덜 부딪침","모여서 이야기하면 덜 다툰다는 그럴듯한 원리지만 글에 모임 이야기는 없어요. 바뀐 것은 점심 한 번 일을 바꿔 맡은 일이에요(trade jobs for a single lunch shift)."]],"dg":"장면만 두 문장"},{"id":"4-13","k":4,"dev":"결과 하나로 끝남 (신호 말 없음)","s":"One language app found that many learners who had studied every day for months stopped using it completely after missing just one day.","a":"흐름이 깨지면 → 다시 잡기 어려움","why":"신호 말 없이 한 앱이 알아낸 결과 하나만 말하고 끝나요. 이 문장이 사례라는 것을 스스로 알아채야 해요. 몇 달을 매일 공부하던 학습자 가운데 많은 수가 단 하루를 빠진 뒤 앱을 아예 쓰지 않게 됐어요(stopped using it completely after missing just one day). 하루가 빠지자 몇 달 이어 온 공부를 다시 잡지 못했으니, 이어 오던 흐름이 한번 깨지면 다시 잡기 어려울 수 있다는 원리로 끌어올려야 해요. 앱 · 하루 같은 사례 낱말은 원리에 남기지 않아요.","tr":[["하루 빠지면 → 실력이 떨어짐","missing just one day 낱말은 같지만 결과를 지어냈어요. 글은 실력 이야기를 하지 않아요. 하루를 빠진 뒤 일어난 일은 앱을 아예 쓰지 않게 된 것이에요(stopped using it completely after missing just one day)."],["몇 달 매일 하면 → 앱이 지겨워짐","every day · for months 낱말은 같지만 까닭을 지어냈어요. 글이 짚은 때는 몇 달이 지나서가 아니라 하루를 빠진 뒤이고(after missing just one day), 지겨웠다는 말도 없어요."],["매일 이어 가면 → 습관이 굳음","매일 하면 습관이 굳는다는 흔한 말이지만 이 사례와 거꾸로예요. 몇 달을 매일 했어도 하루를 빠지자 아예 그만뒀으니(stopped using it completely after missing just one day) 습관이 굳었다고 볼 수 없어요."],["쉬는 날 두면 → 오래 이어 감","그럴듯한 원리지만 이 사례는 쉬는 날이 도움이 된다는 것을 보여 주지 않아요. 이 학습자들에게는 하루 빠진 날이 그만두는 때가 됐어요(stopped using it completely after missing just one day)."]],"dg":"결과 하나로 끝남"},{"id":"4-14","k":4,"dev":"원리 뒤 장면 (이음말 없음)","s":"Stepping back from our own work often helps us catch its mistakes. Members of one school band listened to recordings of their practice and heard wrong notes they had missed while playing.","a":"거리를 두고 보면 → 흠이 더 잘 보임","why":"두 문장 사이에 For example 같은 이음말이 없지만 둘째 문장은 첫 문장의 사례예요. 연습 녹음을 듣다가 연주하는 동안에는 놓친 틀린 음을 찾았다는 일(listened to recordings of their practice and heard wrong notes they had missed while playing)이, 제 일에서 한 걸음 물러서면 실수가 잘 잡힌다는 첫 문장(Stepping back from our own work often helps us catch its mistakes)을 보여 줘요. 그래서 요점은 밴드의 장면이 아니라 그 원리, 곧 거리를 두고 보면 흠이 더 잘 보인다는 거예요.","tr":[["연주하며 들으면 → 틀린 음 잘 잡힘","wrong notes · playing 낱말은 같지만 거꾸로예요. 틀린 음은 연주하는 동안에는 놓쳤고(wrong notes they had missed while playing) 나중에 녹음에서 들렸어요."],["연습 늘리면 → 틀린 음 줄어듦","practice · wrong notes 낱말은 같지만 글에 없는 까닭과 결과예요. 글은 연습을 더 했다는 말이 아니라 녹음을 듣고 틀린 음을 찾았다는 말이에요(listened to recordings of their practice and heard wrong notes)."],["남이 들어 주면 → 제 흠이 잡힘","그럴듯한 원리지만 이 사례와 달라요. 틀린 음을 찾은 것은 남이 아니라 연주한 단원들 자신이에요(Members of one school band listened to recordings of their practice)."],["남과 견줘 보면 → 제 흠이 보임","그럴듯한 원리지만 이 사례에 없어요. 단원들은 남과 견준 게 아니라 제 연습 녹음을 들었어요(listened to recordings of their practice). 첫 문장도 남이 아니라 제 일에서 한 걸음 물러서는 것을 말해요(Stepping back from our own work)."]],"dg":"원리와 장면 나란히"},{"id":"4-15","k":4,"dev":"결과 하나로 끝남 (신호 말 없음)","s":"After one neighborhood food fridge changed its sign from 'One item per person' to 'Take what you need,' its shelves emptied more slowly.","a":"믿고 맡기면 → 알아서 덜 가져감","why":"신호 말 없이 한 동네 나눔 냉장고에서 있었던 일 하나만 말하고 끝나요. 「한 사람에 하나」라는 안내를 「필요한 만큼 가져가세요」로 바꾼 것은 막는 규칙을 거두고 사람들을 믿고 맡긴 일이에요. 그 뒤 선반은 더 빨리가 아니라 더 천천히 비었어요(its shelves emptied more slowly). 필요한 만큼 가져가도 되는데 선반이 더 천천히 비었다는 것은 사람들이 오히려 덜 가져갔다고 읽을 수 있으니, 믿고 맡기면 사람들이 알아서 덜 가져갈 수 있다는 원리로 끌어올려야 해요.","tr":[["안내문 바꾸면 → 음식이 빨리 빔","sign · emptied 낱말은 같지만 거꾸로예요. 안내를 바꾼 뒤 선반은 더 빨리가 아니라 더 천천히 비었어요(its shelves emptied more slowly)."],["음식 더 채우면 → 선반이 늦게 빔","shelves · emptied more slowly 낱말은 같지만 까닭을 지어냈어요. 음식을 더 채웠다는 말은 없고, 바뀐 것은 안내문 하나예요(changed its sign)."],["지켜보는 눈 있으면 → 덜 가져감","덜 가져갔다는 결과는 같지만 까닭이 달라요. 냉장고는 누가 지켜보게 한 게 아니라 「한 사람에 하나」라는 제한을 거두고 믿고 맡겼어요(changed its sign from 'One item per person' to 'Take what you need,')."],["하나씩만 주면 → 고루 돌아감","바꾸기 전 안내(One item per person)의 생각을 옮긴 답이에요. 글은 그 안내를 거두고 믿고 맡긴 뒤에 선반이 더 천천히 비었다고 해요(its shelves emptied more slowly)."]],"dg":"결과 하나로 끝남"},{"id":"4-16","k":4,"dev":"Such + 명사 (앞 문장의 한쪽 물음만 받음)","s":"Such questions can turn a quick chat into a small puzzle, and many children keep guessing and checking until they find an answer that works.","a":"되물어 주면 → 스스로 따져 봄","why":"Such questions는 앞 문장 전체가 아니라 그 한쪽, 곧 부모가 되묻는 말(reply to a child's 'Why?' with 'What do you think?')을 받아요. 아이의 「왜?」는 두 쪽 부모가 다 듣는 물음이라 이 문장의 뒷말과 이어지지 않아요. 많은 아이가 맞는 답을 찾을 때까지 짐작하고 확인한다는 것(keep guessing and checking until they find an answer that works)은 답을 바로 듣지 못했을 때, 곧 부모가 되물었을 때의 일이에요. 짧은 대화(a quick chat)를 작은 수수께끼로 바꾸는 것도 답을 바로 주는 쪽(give the answer right away)이 아니라 되묻는 쪽이고요. 요점은 되물어 주면 아이가 스스로 따져 보게 될 수 있다는 거예요.","tr":[["많이 묻게 두면 → 끝까지 답 찾음","Such questions를 아이가 묻는 「왜?」로 받은 답이에요. questions · answer 낱말은 같지만, 대화를 수수께끼로 바꾸는 물음은 아이의 물음이 아니라 부모가 되묻는 말(What do you think?)이에요."],["짐작하게 두면 → 틀린 답 굳어짐","guessing 낱말은 같지만 뜻이 거꾸로예요. 아이들은 짐작에서 멈추지 않고 맞는 답을 찾을 때까지 짐작하고 확인해요(keep guessing and checking until they find an answer that works). 틀린 답이 굳는다는 말은 없어요."],["스스로 찾게 두면 → 오래 기억함","되묻는 부모가 아이에게 답을 스스로 찾게 둔 것은 맞지만 결과를 지어냈어요. 글은 오래 기억한다는 말을 하지 않고, 아이들이 맞는 답을 찾을 때까지 짐작하고 확인한다고만 해요(keep guessing and checking until they find an answer that works)."],["가만히 지켜보면 → 스스로 깨침","아이가 스스로 깨치게 두라는 흔한 말이지만 이 부모들은 가만히 있지 않았어요. 아이의 「왜?」에 되물어 줬어요(reply to a child's 'Why?' with 'What do you think?')."]],"ctx":"Some parents reply to a child's 'Why?' with 'What do you think?', while others give the answer right away.","dg":"such + 명사"},{"id":"4-17","k":4,"dev":"It (가까운 빵집이 아니라 할아버지가 들려준 일을 받음)","s":"It did more for my brother than any advice, and a week later he was sending out job applications again with a lighter heart.","a":"제 실패를 들려주면 → 큰 위로 됨","why":"It은 바로 앞의 빵집(his own failed bakery)이 아니라 앞 문장 주절의 일, 곧 할아버지가 자기 빵집이 망한 이야기를 들려준 일(our grandfather told him the story of his own failed bakery)을 받아요. 그 이야기가 어떤 조언보다 형에게 힘이 됐고(It did more for my brother than any advice), 형은 한 주 뒤 가벼운 마음으로 다시 지원서를 냈어요. 요점은 자기 실패를 들려주는 것이 큰 위로가 될 수 있다는 거예요.","tr":[["지원서 다시 쓰면 → 마음이 가벼워짐","job applications · lighter heart 낱말은 같지만 앞뒤가 뒤바뀌었어요. 형은 마음이 가벼워진 채로 지원서를 냈어요(sending out job applications again with a lighter heart). 마음을 가볍게 한 것은 할아버지의 이야기예요."],["빵집 일 거들면 → 다시 기운 남","It을 가장 가까운 bakery로 받아 지어낸 답이에요. 빵집은 이미 망했고(his own failed bakery), 형은 빵집 일을 거든 게 아니라 다시 일자리를 찾아 지원서를 냈어요."],["따끔히 조언하면 → 다시 일어섬","advice 낱말은 같지만 거꾸로예요. 형에게 더 힘이 된 것은 조언이 아니라 할아버지의 이야기였어요(It did more for my brother than any advice)."],["말없이 곁에 있으면 → 힘이 되어 줌","위로를 두고 흔히 하는 말이지만 이 사례와 달라요. 할아버지는 말없이 곁에 있지 않고 자기 이야기를 들려줬어요(told him the story of his own failed bakery)."]],"ctx":"When my brother lost his first job, our grandfather told him the story of his own failed bakery.","dg":"it"},{"id":"4-18","k":4,"dev":"Now consider ~ (앞 문장과 반대 쪽 사례)","s":"Now consider one young pitcher who kept adding steps to his routine with every win, until a single skipped step could shake him for a whole game.","a":"틀에 매이면 → 쉽게 흔들림","why":"Now consider는 사례를 꺼내는 신호지만, 이 사례는 앞 문장을 받쳐 주지 않고 반대 쪽을 보여 줘요. 앞 문장은 짧은 경기 전 루틴이 마음을 차분하게 해 준다는 말(a short pre-game routine helps them feel calm)이에요. 그런데 이 투수는 이길 때마다 루틴에 단계를 더하다가, 단계 하나만 빠져도 경기 내내 흔들릴 수 있게 됐어요(a single skipped step could shake him for a whole game). 마음을 잡아 주려던 틀에 매이면 오히려 쉽게 흔들릴 수 있다는 원리로 읽어야 해요.","tr":[["준비를 늘리면 → 마음이 차분해짐","사례가 앞 문장을 받쳐 준다고 보고 앞 문장의 말(helps them feel calm)을 덧씌운 답이에요. 단계를 늘린 이 투수는 차분해지기는커녕 단계 하나에도 흔들렸어요(a single skipped step could shake him)."],["길게 준비하면 → 지쳐서 무너짐","adding steps 낱말에서 끌어낸 그럴듯한 말이지만 글에 지쳤다는 말은 없어요. 이 투수를 흔든 것은 피로가 아니라 빠뜨린 단계 하나예요(a single skipped step could shake him)."],["한 단계 빠뜨리면 → 경기에서 짐","a single skipped step 낱말은 같지만 결과를 지어냈어요. 글은 경기 내내 흔들릴 수 있다(could shake him for a whole game)고 했지 경기에서 졌다고 하지 않았어요."],["짧게 정해 두면 → 마음이 편함","앞 문장의 말(a short pre-game routine helps them feel calm)만 옮긴 답이에요. 이 문장은 짧은 루틴이 아니라 자꾸 늘어난 루틴의 사례예요."]],"ctx":"Many athletes say that a short pre-game routine helps them feel calm.","dg":"consider ~"},{"id":"4-19","k":4,"dev":"these + 명사 (앞 문장 받기)","s":"These short summaries have made the meetings a little longer and far calmer, with almost no shouting since spring.","a":"상대 말 되짚으면 → 언성이 낮아짐","why":"These short summaries는 앞 문장의 규칙, 곧 말하기 전에 앞사람의 말을 제 말로 되풀이하는 일(repeat the last speaker's point in their own words)을 받아요. 그 뒤로 회의는 조금 길어졌지만 훨씬 차분해졌고 고함도 거의 사라졌어요(far calmer, with almost no shouting since spring). 상대의 말을 먼저 되짚어 주면 언성이 낮아질 수 있다는 원리로 읽어야 해요. 회의가 조금 길어진 것은 덧붙은 세부예요.","tr":[["짧게 요약하면 → 회의가 짧아짐","short summaries · meetings 낱말은 같지만 거꾸로예요. 회의는 짧아지지 않고 조금 길어졌어요(made the meetings a little longer)."],["회의 길어지면 → 분위기 차분해짐","longer · calmer 낱말은 같지만 까닭을 바꿨어요. 회의를 차분하게 한 것은 길어진 시간이 아니라 앞사람 말을 되짚는 규칙이에요(These short summaries have made the meetings)."],["요약본을 나눠 주면 → 언성이 낮아짐","summaries 낱말에 끌려 These short summaries를 종이에 적어 나눠 주는 요약으로 받은 답이에요. 이 요약은 말하려는 사람이 먼저 앞사람의 말을 제 말로 되풀이하는 것이에요(must first repeat the last speaker's point in their own words)."],["먼저 칭찬해 주면 → 덜 맞서게 됨","다툼을 줄이는 흔한 방법이지만 글에 칭찬 이야기는 없어요. 규칙은 칭찬이 아니라 앞사람의 말을 제 말로 되풀이하는 것이에요(in their own words)."]],"ctx":"At our town's monthly meeting, anyone who wants to speak must first repeat the last speaker's point in their own words.","dg":"this + 명사"},{"id":"4-20","k":4,"dev":"Look at ~","s":"Look at one science class that took a short quiz on each chapter before studying it and remembered more than a class that took the same quiz afterward.","a":"미리 짐작해 보면 → 머리에 더 남음","why":"Look at ~은 「~를 보라」며 사례를 꺼내는 신호예요. 한 과학 반은 단원을 배우기 전에 짧은 퀴즈를 먼저 풀었고(took a short quiz on each chapter before studying it), 같은 퀴즈를 배운 뒤에 푼 반보다 더 많이 기억했어요. 아직 배우지 않은 것을 먼저 짐작해 본 쪽이 더 많이 기억했으니, 미리 짐작해 보면 배운 것이 머리에 더 남을 수 있다는 원리로 끌어올려야 해요.","tr":[["배운 뒤 풀어 보면 → 더 잘 기억함","quiz · remembered more 낱말은 같지만 때가 거꾸로예요. 이 글에서 더 많이 기억한 쪽은 배우기 전에 퀴즈를 푼 반이에요(before studying it). 배운 뒤에 푼 반(a class that took the same quiz afterward)이 덜 기억했어요."],["퀴즈를 자주 보면 → 공부 시간 줄어듦","quiz · each chapter 낱말은 같지만 글에 없는 결과예요. 글은 공부 시간이 아니라 얼마나 기억했는지를 견줘요(remembered more than a class that took the same quiz afterward)."],["되풀이해 읽으면 → 머리에 더 남음","공부를 두고 흔히 하는 말이지만 이 사례가 보여 주는 원리가 아니에요. 두 반을 가른 것은 몇 번 읽었느냐가 아니라 퀴즈를 언제 풀었느냐예요(before studying it)."],["나눠서 공부하면 → 머리에 더 남음","그럴듯한 공부법이지만 글에 없어요. 두 반이 다른 것은 나눠 공부했느냐가 아니라 같은 퀴즈를 배우기 전에 풀었느냐 뒤에 풀었느냐예요(took the same quiz afterward)."]],"dg":"take ~"},{"id":"5-1","k":5,"dev":"as if (마치 ~처럼)","s":"As the coach read out the names for the final, Seojin sat as if she had turned to stone, waiting for her name.","a":"서진 → 숨죽이며 마음 졸임","why":"as if는 「실제로는 아니지만 마치 ~인 듯」이라는 뜻이에요. 돌이 된 듯 앉아 있었다(Seojin sat as if she had turned to stone)는 것은 꼼짝도 못 하고 굳어 있었다는 비유예요. 그때 서진은 제 이름이 불리기를 기다리고 있었어요(waiting for her name). 그래서 속뜻은 뽑힐지 몰라 숨죽이며 마음을 졸였다는 거예요.","tr":[["서진 → 뽑힌 줄 알고 뛸 듯 기쁨","그럴듯하지만 때가 맞지 않아요. 서진은 아직 제 이름을 기다리는 중이었어요(waiting for her name). 뽑혔는지도 모르는데 기뻐할 수는 없어요."],["서진 → 결승 명단에서 끝내 빠짐","결승 · 명단 낱말은 같지만 일을 지어냈어요. 서진은 아직 제 이름을 기다리는 중이었으니(waiting for her name) 빠졌는지는 알 수 없어요."],["코치 → 명단 읽으며 마음 졸임","코치 · 명단 낱말은 같지만 누구 마음인지 바꿨어요. 돌이 된 듯 앉아 있던 사람은 코치가 아니라 서진이에요(Seojin sat as if she had turned to stone)."],["코치 → 뽑은 선수들 보며 흐뭇함","그럴듯하지만 글에 코치의 마음은 없어요. 돌이 된 듯 앉아 있던 사람은 서진이에요(Seojin sat as if she had turned to stone)."]],"dg":"as if"},{"id":"5-2","k":5,"dev":"동사 비유 (pulls)","s":"The smell of roasted sweet potatoes from the cart by the subway exit pulls tired office workers off their usual route home.","a":"고구마 냄새 → 지나는 이의 발길을 끎","why":"pull은 원래 「손으로 끌어당기다」지만, 여기서 끌어당기는 것은 손이 아니라 냄새예요(The smell of roasted sweet potatoes ... pulls tired office workers). 냄새가 지친 직장인들을 늘 가던 귀갓길에서 벗어나게 한다(off their usual route home)는 것은, 냄새에 끌려 사람들이 수레 쪽으로 발길을 돌린다는 속뜻이에요.","tr":[["고구마 냄새 → 어린 날 추억 떠올림","그럴듯한 말이지만 문장이 말한 냄새의 힘은 사람을 끌어당기는 것이에요(pulls tired office workers off their usual route home). 추억 이야기는 없어요."],["고구마 냄새 → 지친 몸을 달래 줌","그럴듯하지만 문장과 맞지 않아요. 냄새는 지친 직장인들을 달래는 것이 아니라 늘 가던 길에서 끌어내요(pulls tired office workers off their usual route home)."],["직장인들 → 집 가는 길을 헤맴","귀갓길 낱말은 같지만 뜻을 비틀었어요. 늘 가던 길에서 벗어난 것(off their usual route home)은 길을 잃어서가 아니라 냄새에 끌려서예요."],["직장인들 → 퇴근길 지하철 놓침","직장인 · 지하철 낱말은 같지만 일을 지어냈어요. 지하철역 출구는 수레가 있는 곳일 뿐이고(the cart by the subway exit), 직장인들은 냄새에 끌려 발길을 돌렸어요."]],"dg":"동사 비유"},{"id":"5-3","k":5,"dev":"의인화 (coughed out)","s":"After the long winter break, the old piano in the music room coughed out sour notes whenever anyone touched its keys.","a":"피아노 → 음이 많이 틀어짐","why":"피아노를 사람처럼 그렸어요. 기침하듯 틀린 음을 뱉었다(coughed out sour notes)는 것은 감기 이야기가 아니라 음이 맞지 않는다는 말이에요. sour notes는 「음이 틀린 소리」예요. 누가 건반을 눌러도 그랬으니(whenever anyone touched its keys) 치는 사람 탓이 아니에요. 그래서 속뜻은 긴 방학 뒤 피아노 음이 많이 틀어졌다는 거예요(조율할 때가 됐어요).","tr":[["피아노 → 오래 안 쳐서 먼지 쌓임","방학 뒤이니 그럴 법하지만, 탈이 난 것은 겉모습이 아니라 소리예요(coughed out sour notes)."],["피아노 → 건반이 잘 안 눌림","건반 낱말은 같지만 탈을 바꿨어요. 건반을 누르면 소리는 났어요. 다만 그 소리가 틀린 음이었어요(coughed out sour notes whenever anyone touched its keys)."],["학생들 → 방학 동안 실력 줄어듦","방학 · 건반 낱말은 같지만 누구 탓인지 바꿨어요. 누가 눌러도 그랬으니(whenever anyone touched its keys) 학생들 실력이 아니라 피아노가 문제예요."],["학생들 → 건반 만지길 꺼림","학생 · 건반 낱말은 같지만 일을 지어냈어요. 누구든 건반을 눌렀다는 말이고(whenever anyone touched its keys), 학생들이 꺼렸다는 말은 없어요."]],"dg":"의인화"},{"id":"5-4","k":5,"dev":"따옴표 속 말 ↔ 실제 (not too far)","s":"Dad said the new pizza place was 'not too far,' and forty minutes later we were still walking, with my sister begging to be carried.","a":"피자집 → 가도 가도 안 나옴","why":"'not too far'(그리 멀지 않다)는 아빠가 한 말일 뿐이에요. 바로 뒤에 사십 분이 지나도 아직 걷고 있었다(forty minutes later we were still walking)는 일을 나란히 놓아, 아빠 말과 달리 피자집이 가도 가도 나오지 않을 만큼 멀었다는 속뜻을 드러내요. 동생이 업어 달라고 졸랐다는 것(begging to be carried)도 그 증거예요.","tr":[["피자집 → 걸어갈 만큼 가까운 곳","따옴표 속 아빠 말('not too far')을 겉뜻대로 믿은 답이에요. 사십 분이 지나도 아직 걷고 있었어요(forty minutes later we were still walking)."],["피자집 → 문 닫아 헛걸음함","그럴듯하지만 글에 없어요. 사십 분이 지나도 아직 걷는 중이었으니(we were still walking) 가게에 닿지도 않았어요."],["아빠 → 걷는 내내 동생 업어 줌","업다 낱말은 같지만 일을 지어냈어요. 동생은 업어 달라고 졸랐을 뿐(begging to be carried), 아빠가 업어 주었다는 말은 없어요."],["여동생 → 피자 싫다고 떼씀","여동생 · 조르다는 같지만 무엇을 졸랐는지 바꿨어요. 동생이 조른 것은 피자가 싫다는 것이 아니라 업어 달라는 것이었어요(begging to be carried)."]],"dg":"말과 실제가 어긋남"},{"id":"5-5","k":5,"dev":"함축 — 행동으로만","s":"When Grandma tasted my first kimchi, she smiled kindly, put down her chopsticks, and quickly reached for her water.","a":"내 김치 → 너무 짜거나 매웠던 듯","why":"할머니는 맛이 어떻다고 말하지 않았어요. 다정하게 웃고(she smiled kindly), 젓가락을 내려놓고(put down her chopsticks), 얼른 물을 찾았어요(quickly reached for her water). 웃음은 처음 담근 김치를 아껴 주는 마음이고, 젓가락을 놓고 서둘러 물을 찾은 것은 김치 맛이 너무 셌다는 뜻이에요. 그래서 속뜻은 내 김치가 너무 짜거나 매웠던 듯하다는 거예요.","tr":[["내 김치 → 맛이 꽤 좋았던 듯","웃음(she smiled kindly)만 보고 고른 답이에요. 할머니는 젓가락을 내려놓고 얼른 물을 찾았어요(put down her chopsticks, and quickly reached for her water). 맛있었다면 젓가락을 놓을 까닭이 없어요."],["내 김치 → 덜 익어 싱거웠던 듯","그럴듯한 맛 평가지만 문장과 맞지 않아요. 맛보자마자 얼른 물을 찾았으니(quickly reached for her water) 싱거운 것이 아니라 맛이 셌던 거예요."],["할머니 → 손주 솜씨에 감동함","다정한 웃음(she smiled kindly)만 보고 고른 답이에요. 할머니는 젓가락을 내려놓고 얼른 물을 찾았어요(put down her chopsticks, and quickly reached for her water). 감동했다면 더 먹었을 거예요."],["할머니 → 배불러 젓가락 놓음","젓가락 낱말은 같지만 까닭을 지어냈어요. 할머니는 김치를 처음 맛본 참이었고(When Grandma tasted my first kimchi), 배부르다는 말은 없어요."]],"dg":"함축 — 말하지 않은 사실"},{"id":"5-6","k":5,"dev":"절제 표현 (a little lively)","s":"'It's a little lively in here today,' Grandma said with a tired sigh, standing in the doorway where my cousins were having a pillow fight.","a":"할머니 → 그만 좀 하라는 뜻","why":"'a little lively'(조금 활기차다)는 일부러 약하게 한 말이에요. 할머니는 지친 한숨을 쉬며(with a tired sigh) 사촌들이 베개 싸움을 하는 방 문간에 서서(standing in the doorway where my cousins were having a pillow fight) 그 말을 했어요. 반가워서 한 말이 아니라, 이제 그만 좀 하라고 에둘러 한 말이에요.","tr":[["할머니 → 활기차서 반갑다는 뜻","따옴표 속 말('It's a little lively in here today')을 겉뜻대로 믿은 답이에요. 할머니는 지친 한숨을 쉬며(with a tired sigh) 그 말을 했어요."],["할머니 → 방이 너무 덥다는 불평","불평이라는 것은 그럴듯하지만 무엇에 대한 말인지 바꿨어요. 할머니가 서서 그 말을 한 곳은 사촌들이 베개 싸움을 하던 방 문간이에요(standing in the doorway where my cousins were having a pillow fight). 더위가 아니라 소란이 문제예요."],["사촌들 → 할머니 일을 거들어 줌","사촌 낱말은 같지만 일을 지어냈어요. 사촌들은 할머니를 돕고 있던 것이 아니라 베개 싸움을 하고 있었어요(my cousins were having a pillow fight)."],["사촌들 → 베개 싸움에 지쳐 잠듦","베개 싸움 낱말은 같지만 일을 지어냈어요. 지친 한숨을 쉰 사람은 할머니이고(Grandma said with a tired sigh), 사촌들은 아직 베개 싸움 중이었어요(were having a pillow fight)."]],"dg":"에두른 말"},{"id":"5-7","k":5,"dev":"관용구 (cost an arm and a leg)","s":"The concert tickets cost an arm and a leg, so Yuna and her sister listened from the park outside the stadium.","a":"공연표 → 엄두 못 낼 만큼 비쌈","why":"cost an arm and a leg는 「팔 하나 다리 하나 값」, 곧 「엄청나게 비싸다」라는 관용구예요. 그래서(so) 유나 자매는 경기장 밖 공원에서 공연을 들었어요(listened from the park outside the stadium). 표를 살 엄두를 못 낼 만큼 비쌌다는 속뜻이에요.","tr":[["공연표 → 순식간에 다 팔려 나감","공연장에 못 들어간 까닭으로 그럴듯하지만, 글이 말한 것은 표가 남았느냐가 아니라 표 값이에요(The concert tickets cost an arm and a leg)."],["공연표 → 초대받은 사람만 받음","공연장에 못 들어간 까닭으로 그럴듯하지만, 글이 말한 것은 표를 누가 받느냐가 아니라 표 값이에요(The concert tickets cost an arm and a leg)."],["유나 → 공연장 가다 팔다리 다침","an arm and a leg를 겉뜻대로 옮긴 답이에요. 다친 사람은 없고, 표 값이 그만큼 비쌌다는 관용구예요(cost an arm and a leg)."],["유나 자매 → 공원 무대서 노래함","공원 낱말은 같지만 일을 지어냈어요. 자매는 공원에서 노래한 것이 아니라 경기장 밖 공원에서 공연을 들었어요(listened from the park outside the stadium)."]],"dg":"관용구"},{"id":"5-8","k":5,"dev":"like + 쌍점(:) 풀이","s":"Minsu's room is like a museum of his childhood: the shelves still hold the toy cars, comic books, and soccer medals from elementary school.","a":"민수 방 → 옛 물건 고스란히 간직","why":"like a museum of his childhood(어린 시절 박물관 같다)는 비유이고, 쌍점 뒤가 그 풀이예요. 초등학교 때 장난감 자동차 · 만화책 · 축구 메달이 아직 책장에 그대로 있어요(the shelves still hold the toy cars, comic books, and soccer medals from elementary school). 박물관이 옛것을 모아 두듯, 민수 방은 옛 물건을 고스란히 간직하고 있다는 속뜻이에요.","tr":[["민수 방 → 옛 물건 싹 치워 비움","옛 물건 낱말은 같지만 뜻을 뒤집었어요. 책장에는 초등학교 때 물건이 아직 그대로 있어요(the shelves still hold)."],["민수 방 → 최신 물건으로 가득함","그럴듯하지만 쌍점 뒤 풀이와 거꾸로예요. 책장에는 초등학교 때 물건이 아직 그대로 있어요(the shelves still hold the toy cars, comic books, and soccer medals)."],["민수 → 요즘도 장난감 차 모음","장난감 자동차 낱말은 같지만 때를 바꿨어요. 그 물건들은 새로 모은 것이 아니라 초등학교 때 것을 아직 그대로 둔 것이에요(the shelves still hold ... from elementary school)."],["민수 → 축구 메달 자랑 즐김","그럴듯하지만 글에 자랑 이야기는 없어요. 메달은 책장에 그대로 놓여 있을 뿐이에요(the shelves still hold ... soccer medals)."]],"dg":"like"},{"id":"5-9","k":5,"dev":"반어 (Thanks a lot)","s":"'Thanks a lot,' Dami said to her younger brother, holding up the phone he had dropped into the bathtub, its screen now completely black.","a":"다미 → 동생에게 짜증이 남","why":"'Thanks a lot'(정말 고마워)은 겉말과 속뜻이 거꾸로인 반어예요. 다미가 그 말을 하며 들어 보인 것은 동생이 욕조에 빠뜨려(he had dropped into the bathtub) 화면이 아예 까매진 휴대폰이에요(its screen now completely black). 고마울 일이 아니니, 속뜻은 다미가 동생에게 짜증이 났다는 거예요.","tr":[["다미 → 동생에게 진심 고마움","따옴표 속 말('Thanks a lot')을 겉뜻대로 믿은 답이에요. 동생이 욕조에 빠뜨려 화면이 까매진 휴대폰(its screen now completely black)을 들고 한 말이에요."],["다미 → 폰 고장에 겁이 남","그럴듯한 마음이지만 문장과 맞지 않아요. 다미는 그 휴대폰을 동생 앞에 들어 보이며 'Thanks a lot'이라고 했어요(Dami said to her younger brother, holding up the phone). 겁먹은 것이 아니라 동생에게 따지는 거예요."],["동생 → 누나에게 진심 고마움","고맙다는 말은 같지만 누가 한 말인지 바꿨어요. 'Thanks a lot'은 동생이 아니라 다미가 한 말이에요(Dami said to her younger brother)."],["동생 → 욕조 청소를 도맡음","욕조 낱말은 같지만 일을 지어냈어요. 동생은 욕조를 청소한 것이 아니라 휴대폰을 욕조에 빠뜨렸어요(the phone he had dropped into the bathtub)."]],"dg":"반어"},{"id":"5-10","k":5,"dev":"과장 (about a thousand times)","s":"This year our math teacher has told us to check our answers about a thousand times, and Mina still forgets on every test.","a":"선생님 → 검산을 수없이 당부함","why":"about a thousand times(천 번쯤)는 정말 천 번을 센 것이 아니라 「셀 수 없이 많이」라는 과장이에요. 수학 선생님이 올해 답을 확인하라고 그만큼 자주 말했다(has told us to check our answers)는 것이니, 속뜻은 선생님이 검산을 수없이 당부했다는 거예요. 그래도 미나는 시험마다 잊어요(Mina still forgets on every test).","tr":[["선생님 → 검산을 딱 한 번 일러 줌","검산 낱말은 같지만 정도를 뒤집었어요. 한 번이 아니라 천 번쯤이라 할 만큼 여러 번 말했어요(about a thousand times)."],["선생님 → 검산보다 속도를 강조함","시험 요령으로 그럴듯하지만 문장과 맞지 않아요. 선생님이 하라고 한 것은 빨리 풀기가 아니라 답 확인이에요(has told us to check our answers)."],["미나 → 검산을 수없이 해 봄","검산 낱말은 같지만 뜻을 뒤집었어요. 미나는 검산을 하기는커녕 시험마다 잊어요(Mina still forgets on every test)."],["미나 → 검산을 한 번도 안 잊음","미나 · 검산 낱말은 같지만 뜻을 뒤집었어요. 미나는 시험마다 여전히 잊어요(Mina still forgets on every test)."]],"dg":"과장"},{"id":"5-11","k":5,"dev":"은유 (call A B) + 쌍점(:) 풀이","s":"Our art teacher calls an eraser a second pencil: what we remove can shape a drawing as much as what we add.","a":"지우개 → 연필 못지않은 몫을 함","why":"call A B는 「A를 B라고 부르다」예요. 미술 선생님은 지우개를 둘째 연필이라 부르며 빗댔고, 쌍점 뒤가 그 풀이예요. 지우는 것도 더하는 것만큼 그림의 모양을 만든다(what we remove can shape a drawing as much as what we add)고 했으니, 속뜻은 지우개도 연필 못지않게 그림에서 제 몫을 한다는 거예요.","tr":[["지우개 → 연필보다 더 중요함","문장보다 세게 말했어요. 지우는 것이 더하는 것보다 중요하다는 것이 아니라, 더하는 것만큼(as much as what we add) 그림을 만든다는 말이에요."],["지우개 → 실수 감추는 데만 씀","지우개 하면 흔히 하는 생각이지만 문장과 맞지 않아요. 지우는 것도 그림의 모양을 만든다고 했어요(what we remove can shape a drawing)."],["그림 → 지운 자국이 모양 망침","지우다 · 모양 낱말은 같지만 뜻을 뒤집었어요. 지우는 것은 그림을 망치는 것이 아니라 모양을 만들어요(what we remove can shape a drawing)."],["그림 → 덧그릴수록 좋아짐","그리다 · 더하다 낱말은 같지만 뜻을 비틀었어요. 글은 더하는 것만큼 지우는 것도 그림을 만든다는 말이에요(what we remove can shape a drawing as much as what we add)."]],"dg":"은유 + 쌍점 풀이"},{"id":"5-12","k":5,"dev":"동격 은유 (A, the B)","s":"My uncle, the family's walking map, has never once needed his phone to find a restaurant in any city we've visited.","a":"삼촌 → 어디서든 길을 훤히 앎","why":"쉼표 사이 the family's walking map(가족의 걸어 다니는 지도)이 삼촌을 빗댄 동격 은유예요. 어느 도시에 가도 식당을 찾느라 휴대폰이 필요했던 적이 한 번도 없다(has never once needed his phone to find a restaurant in any city we've visited)는 것과 이으면, 삼촌이 어디서든 길을 훤히 안다는 속뜻이에요.","tr":[["삼촌 → 지도 앱을 능숙하게 씀","길을 잘 찾는다는 쪽은 맞지만 방법을 바꿨어요. 삼촌은 식당을 찾을 때 휴대폰이 한 번도 필요 없었어요(has never once needed his phone to find a restaurant)."],["삼촌 → 휴대폰 없이 지냄","휴대폰 낱말은 같지만 범위를 넓혔어요. 식당을 찾을 때 휴대폰이 필요 없었다는 말이지(never once needed his phone to find a restaurant), 휴대폰 없이 산다는 말은 아니에요."],["삼촌 → 식당에 휴대폰 두고 옴","식당 · 휴대폰 낱말은 같지만 일을 지어냈어요. 식당을 찾을 때 휴대폰이 필요 없었다는 말이지(never once needed his phone to find a restaurant), 휴대폰을 두고 왔다는 말은 없어요."],["우리 가족 → 늘 휴대폰에 기댐","그럴듯하지만 글에 없어요. 글은 가족이 아니라 삼촌이 어떤 사람인지를 말해요(My uncle, the family's walking map)."]],"dg":"동격 은유"},{"id":"5-13","k":5,"dev":"절제 표현 (not exactly a success)","s":"Our first practice match was not exactly a success: we lost nine to nothing, and our goalkeeper spent half the game tying his shoes.","a":"첫 연습 경기 → 처참하게 무너짐","why":"not exactly a success(딱히 성공은 아니었다)는 일부러 약하게 한 말이에요. 쌍점 뒤에 9 대 0으로 졌고(we lost nine to nothing) 골키퍼는 경기 절반을 신발 끈만 맸다(spent half the game tying his shoes)는 일을 늘어놓아, 실제로는 처참하게 무너진 경기였다는 속뜻을 드러내요.","tr":[["첫 연습 경기 → 한 골 차로 아깝게 짐","졌다(we lost)는 낱말은 같지만 정도를 비틀었어요. 한 골 차가 아니라 9 대 0이었어요(we lost nine to nothing)."],["첫 연습 경기 → 그럭저럭 무난했음","not exactly a success를 「크게 성공하진 않았지만 그럭저럭」으로 읽은 답이에요. 일부러 약하게 한 말이고, 실제로는 9 대 0이었어요(we lost nine to nothing)."],["첫 연습 경기 → 상대가 너무 강했음","크게 진 까닭으로 그럴듯하지만, 문장이 보여 준 것은 상대가 아니라 우리 쪽 모습이에요. 골키퍼가 경기 절반을 신발 끈 매느라 보냈어요(our goalkeeper spent half the game tying his shoes)."],["첫 연습 경기 → 반칙 탓에 중단됨","엉망이었다는 쪽은 그럴듯하지만 일을 지어냈어요. 경기는 중단되지 않고 9 대 0으로 끝났어요(we lost nine to nothing)."]],"dg":"절제 표현"},{"id":"5-14","k":5,"dev":"동사 비유 (swallows)","s":"The old vending machine by the gym swallows students' coins without giving anything back, so most of us just walk past it now.","a":"자판기 → 고장 나 제구실 못 함","why":"swallow는 원래 「삼키다」예요. 자판기가 동전을 삼키고 아무것도 내주지 않는다(swallows students' coins without giving anything back)는 것은, 돈만 들어가고 아무것도 안 나오는 고장 난 기계라는 비유예요. 그래서 이제 학생 대부분이 그냥 지나친다(most of us just walk past it now)고 했으니, 속뜻은 자판기가 고장 나 제구실을 못 한다는 거예요.","tr":[["자판기 → 거스름돈만 안 내줌","고장이라는 쪽은 맞지만 정도를 줄였어요. 거스름돈만이 아니라 아무것도 내주지 않아요(without giving anything back)."],["자판기 → 동전 대신 카드만 받음","동전 낱말은 같지만 뜻을 바꿨어요. 자판기는 동전을 안 받는 것이 아니라 받기만 하고 아무것도 내주지 않아요(swallows students' coins without giving anything back)."],["학생들 → 동전을 아껴 모음","학생 · 동전 낱말은 같지만 일을 지어냈어요. 학생들이 동전을 모은다는 말은 없고, 자판기가 동전을 삼켜요(swallows students' coins)."],["자판기 → 늘 줄이 길게 늘어섬","학생 낱말에서 끌어냈지만 뜻을 뒤집었어요. 학생 대부분이 이제 그냥 지나쳐요(most of us just walk past it now)."]],"dg":"동사 비유"},{"id":"5-15","k":5,"dev":"직유 (as ~ as)","s":"After one week at the dumpling shop, my aunt's hands were as quick as a pianist's, folding thirty dumplings before the water was even hot.","a":"이모 → 금세 솜씨가 붙음","why":"as quick as a pianist's(피아노 치는 사람 손만큼 빠르다)는 직유예요. 이모가 피아노를 친다는 말이 아니라, 손놀림이 그만큼 빠르고 익숙하다는 비유예요. 겨우 일주일 만에(After one week) 물이 데워지기도 전에 만두 서른 개를 빚었다(folding thirty dumplings before the water was even hot)고 했으니, 속뜻은 이모가 금세 솜씨가 붙었다는 거예요.","tr":[["이모 → 일주일째 손이 서투름","처음 일하면 서툴다는 흔한 말이지만 글과 거꾸로예요. 이모의 손은 피아노 치는 사람만큼 빨랐어요(my aunt's hands were as quick as a pianist's)."],["이모 → 손님들께 칭찬받음","그럴듯하지만 글에 손님 이야기는 없어요. 글은 이모의 손이 얼마나 빨라졌는지를 말해요(my aunt's hands were as quick as a pianist's)."],["이모 → 만두 서른 개를 사 옴","만두 · 서른 개 낱말은 같지만 일을 지어냈어요. 이모는 만두를 사 온 것이 아니라 물이 데워지기도 전에 서른 개를 빚었어요(folding thirty dumplings before the water was even hot)."],["만두 가게 → 하루 서른 개만 팖","서른 개 낱말은 같지만 뜻을 비틀었어요. 서른 개는 하루에 파는 수가 아니라 이모가 물이 데워지기도 전에 빚은 수예요(folding thirty dumplings before the water was even hot)."]],"dg":"직유"},{"id":"5-16","k":5,"dev":"함축 — 말하지 않은 사실","s":"When I asked my little brother if his science project was done, he suddenly remembered the dog needed a walk and grabbed the leash.","a":"동생 → 과제를 아직 못 끝낸 듯","why":"동생은 과제를 끝냈는지 대답하지 않았어요. 묻자마자 갑자기(suddenly) 개 산책이 생각났다며 목줄을 집어 들었어요(grabbed the leash). 질문을 피해 자리를 뜨는 행동이니, 말하지 않았지만 과제를 아직 못 끝낸 듯하다는 속뜻이에요.","tr":[["동생 → 개 산책 당번을 잘 챙김","보이는 행동(the dog needed a walk and grabbed the leash)만 옮긴 답이에요. 과제 이야기를 듣자 갑자기(suddenly) 생각났으니, 산책은 대답을 피하는 핑계로 보여요."],["개 → 산책을 몹시 기다림","개 · 산책 낱말은 같지만 누구 이야기인지 바꿨어요. 문장은 개가 아니라 질문을 받은 동생이 어떻게 했는지를 말해요(he suddenly remembered the dog needed a walk)."],["동생 → 과제를 벌써 다 끝낸 듯","과제 낱말은 같지만 뜻을 뒤집었어요. 다 끝냈다면 그렇다고 대답하면 그만이에요. 묻자마자 갑자기 산책을 핑계로 자리를 떴으니(he suddenly remembered the dog needed a walk) 끝냈다고 보기 어려워요."],["동생 → 과학을 가장 싫어함","그럴듯하지만 글에 없어요. 동생이 피한 것은 과학이라는 과목이 아니라 과제를 끝냈느냐는 질문이에요(if his science project was done)."]],"dg":"함축 — 말하지 않은 사실"},{"id":"5-17","k":5,"dev":"따옴표 속 말이 진심 (반어처럼 보임)","s":"'Oh, great, it's raining,' Grandpa said with a big smile, looking out at the vegetable garden that had been dry for weeks.","a":"할아버지 → 비가 와 진심 반가움","why":"'Oh, great, it's raining'(아, 좋다, 비가 오네)은 흔히 비꼬는 말로 쓰지만, 여기서는 반어가 아니라 진심이에요. 할아버지는 활짝 웃으며(with a big smile) 몇 주째 말라 있던 텃밭을 내다보고 있었어요(looking out at the vegetable garden that had been dry for weeks). 메마른 텃밭에 비가 오니, 속뜻은 할아버지가 비가 와서 진심으로 반가워한다는 거예요.","tr":[["할아버지 → 비가 와서 짜증 남","따옴표 속 말을 비꼬는 말로 읽고 속뜻을 지어낸 답이에요. 할아버지는 활짝 웃었고(with a big smile), 텃밭은 몇 주째 말라 있었어요(had been dry for weeks)."],["할아버지 → 몇 주째 시름에 잠김","몇 주 낱말은 같지만 뜻을 바꿨어요. 몇 주째 그랬던 것은 할아버지 마음이 아니라 말라 있던 텃밭이고(the vegetable garden that had been dry for weeks), 할아버지는 활짝 웃었어요(with a big smile)."],["할아버지 → 우산 없어 걱정함","그럴듯하지만 문장과 맞지 않아요. 할아버지는 걱정스러운 얼굴이 아니라 활짝 웃고 있었어요(with a big smile)."],["할아버지 → 빗소리가 좋아 웃음","반갑다는 쪽은 맞지만 까닭을 바꿨어요. 할아버지는 빗소리가 아니라 몇 주째 말라 있던 텃밭을 내다보며 웃었어요(looking out at the vegetable garden that had been dry for weeks)."]],"dg":"글자 그대로"},{"id":"5-18","k":5,"dev":"은유 + 쌍점(:) 풀이","s":"Our group chat is a train that never stops: messages come all night, and if you get off for an hour, you can't catch up.","a":"단톡방 → 잠깐 쉬면 흐름을 놓침","why":"단톡방을 서지 않는 기차에 빗댔고, 쌍점 뒤가 그 풀이예요. 메시지가 밤새 이어지고(messages come all night), 한 시간만 내려도 따라잡을 수 없다(if you get off for an hour, you can't catch up)고 했으니, 속뜻은 단톡방에서는 잠깐만 쉬어도 대화 흐름을 놓친다는 거예요.","tr":[["단톡방 → 밤에는 조용해짐","밤 · 단톡방 낱말은 같지만 뜻을 뒤집었어요. 메시지는 밤새 이어져요(messages come all night)."],["단톡방 → 금세 다시 따라잡음","따라잡다 낱말은 같지만 뜻을 뒤집었어요. 한 시간만 빠져도 따라잡을 수 없다고 했어요(you can't catch up)."],["단톡방 → 알림이 잦아 성가심","단톡방 하면 떠올릴 만하지만, 문장이 말한 것은 성가심이 아니라 한 시간만 빠져도 따라잡을 수 없다는 거예요(if you get off for an hour, you can't catch up)."],["단톡방 → 다툼이 잦아 피곤함","단톡방 하면 떠올릴 만하지만 글에 다툼 이야기는 없어요. 문장은 한 시간만 빠져도 따라잡을 수 없다는 것을 말해요(you can't catch up)."]],"dg":"은유 + 쌍점 풀이"},{"id":"5-19","k":5,"dev":"관용구 (butterflies in her stomach)","s":"Before her speech in front of the whole school, Hayun had butterflies in her stomach and kept reading the same first line.","a":"하윤 → 몹시 떨리고 초조함","why":"have butterflies in one's stomach는 「배 속에 나비가 있다」가 아니라 「가슴이 떨리고 초조하다」라는 관용구예요. 전교생 앞 연설을 앞두고(Before her speech in front of the whole school) 같은 첫 줄만 자꾸 다시 읽었다(kept reading the same first line)는 것도 초조해서 하는 행동이에요. 그래서 속뜻은 하윤이 몹시 떨리고 초조했다는 거예요.","tr":[["하윤 → 겁이 나 무대를 피함","떨렸다는 쪽은 맞지만 지나치게 말했어요. 하윤은 무대를 피한 것이 아니라 같은 첫 줄을 자꾸 다시 읽으며 연설을 기다렸어요(kept reading the same first line)."],["하윤 → 따분해 하품만 함","같은 줄을 되읽는 것을 따분함으로 읽은 답이에요. 연설을 앞두고 배 속에 나비가 있었다(had butterflies in her stomach)는 것은 떨린다는 말이에요."],["하윤 → 배탈이 나서 아픔","in her stomach를 겉뜻대로 옮긴 답이에요. 배가 아픈 것이 아니라 떨린다는 관용구예요(had butterflies in her stomach)."],["하윤 → 같은 책만 거듭 읽음","같은 · 읽다 낱말은 같지만 일을 바꿨어요. 하윤이 되읽은 것은 책이 아니라 연설의 같은 첫 줄이에요(kept reading the same first line)."]],"dg":"관용구"},{"id":"5-20","k":5,"dev":"반어 (What a lovely surprise)","s":"'What a lovely surprise,' Mom said flatly, staring at the muddy shoes my little brother had left on her freshly cleaned carpet.","a":"엄마 → 꾹 참으며 언짢아함","why":"'What a lovely surprise'(정말 반가운 깜짝 선물이네)는 겉말과 속뜻이 거꾸로인 반어예요. 엄마는 그 말을 무덤덤하게 하며(Mom said flatly) 동생이 막 청소한 카펫 위에 두고 간 진흙 신발을 바라보고 있었어요(staring at the muddy shoes my little brother had left on her freshly cleaned carpet). 반가울 일이 아니니, 속뜻은 엄마가 꾹 참으며 언짢아한다는 거예요.","tr":[["엄마 → 뜻밖의 일이라 반가움","따옴표 속 말('What a lovely surprise')을 겉뜻대로 믿은 답이에요. 엄마는 무덤덤하게 말하며(Mom said flatly) 진흙 신발을 바라보고 있었어요."],["엄마 → 동생에게 크게 소리침","언짢았다는 쪽은 맞지만 지나치게 말했어요. 엄마는 소리친 것이 아니라 무덤덤하게 말했어요(Mom said flatly)."],["동생 → 엄마 몰래 신발 빪","신발 낱말은 같지만 일을 지어냈어요. 동생은 신발을 빤 것이 아니라 진흙 묻은 채로 카펫 위에 두고 갔어요(the muddy shoes my little brother had left on her freshly cleaned carpet)."],["엄마 → 새 카펫을 사려 함","카펫 낱말은 같지만 일을 지어냈어요. 카펫은 새로 살 것이 아니라 엄마가 막 청소한 것이에요(her freshly cleaned carpet)."]],"dg":"반어"}],"write":[{"id":"1-W1","k":1,"dev":"even for as little as","s":"Reading for pleasure, even for as little as twenty minutes a day, can help build the vocabulary that students later need for difficult textbooks.","model":"즐거운 독서 → 어휘력","accept":"꾸준한 독서 → 어휘 늘어남","no":"하루 20분 독서(화제만), 어려운 교과서(세부)","dg":"even for as little as"},{"id":"1-W2","k":1,"dev":"after all (두 문장)","s":"People who sit near a window at work tend to sleep longer at night. Daylight, after all, helps set the body clock.","model":"창가 자리 → 잠 늘어남","accept":"창가에서 일하면 더 오래 잠","no":"햇빛 → 생체 시계(after all 문장의 까닭만), 창문 · 일 · 잠(나열)","dg":"after all"},{"id":"1-W3","k":1,"dev":", when","s":"Small towns that hold a weekly farmers' market often see more people shopping at nearby stores on market days, when visitors tend to stay in town longer.","model":"장날 → 주변 가게 손님 늘어남","accept":"시장이 열리면 동네 가게 이득","no":"농부 · 시장 · 마을(나열), 손님이 오래 머묾(when 뒤 세부만)","dg":", when"},{"id":"1-W4","k":1,"dev":"줄표(—)","s":"Drivers who talk on the phone, even with a hands-free device, react more slowly to sudden dangers — their attention is still divided.","model":"핸즈프리 통화도 → 반응 느려짐","accept":"운전 중 통화 → 반응 늦음","no":"주의가 나뉨(줄표 뒤 까닭만), 휴대폰 → 위험(너무 넓음, 반만 맞음)","dg":"줄표"},{"id":"1-W5","k":1,"dev":"if 조건절","s":"If students keep a water bottle on their desks, they may be less likely to lose focus in the last class, when many feel tired.","model":"책상 위 물병 → 집중 덜 흐트러짐","accept":"물병 곁에 두면 → 마지막 수업도 집중, 물 가까이 두면 → 늦은 수업에도 집중, 물 → 집중에 도움 (반만 맞음: 너무 넓고 「물병을 곁에 둔다」는 조건이 빠짐)","no":"마지막 수업 → 피곤함(when 뒤 세부만), 물 → 건강에 좋음(글에 없는 흔한 말), 물병 · 책상 · 집중(나열)","dg":"if 조건절"},{"id":"1-W6","k":1,"dev":"as a result (두 문장)","s":"One town library began offering free Wi-Fi in its reading room last year. As a result, the number of adults working on laptops there on weekday mornings nearly tripled.","model":"무료 와이파이 → 일하러 오는 어른 늘어남","accept":"도서관 와이파이 → 노트북 쓰는 어른 세 배, 와이파이 생긴 뒤 → 평일 아침 이용자 늘어남","no":"도서관 → 와이파이 시작(첫 문장 화제만), 어른 → 책 더 빌림(글에 없음), 와이파이 · 도서관 · 어른(나열)","dg":"as a result"},{"id":"1-W7","k":1,"dev":"in order to","s":"In order to help families save money, one school collects graduates' uniforms every winter, and now about half its new students wear them.","model":"물려받은 교복 → 신입생 절반 입음","accept":"졸업생 교복 모으기 → 신입생 절반이 입음, 교복 물려주기 → 많은 신입생이 씀, 교복 나눔 → 돈 아낌 (반만 맞음: 신입생 절반이 입는다는 결과 대신 in order to 뒤 목적을 씀)","no":"가정 → 돈 아끼기(목적만, 교복 이야기가 빠짐), 졸업생 · 교복 · 겨울(나열), 새 교복 → 너무 비쌈(목적에서 짐작한 말, 학교가 한 일과 결과가 빠짐)","dg":"in order to"},{"id":"1-W8","k":1,"dev":"줄표(—)","s":"When one neighborhood pharmacy began staying open until midnight, late-night visits to the nearby emergency room fell — many parents had only needed advice about a child's fever.","model":"심야 약국 → 응급실 방문 줄어듦","accept":"밤늦게 여는 약국 → 응급실 덜 감, 약국 심야 운영 → 밤 응급실 손님 줄어듦","no":"부모 → 열 상담 필요(줄표 뒤 까닭만), 약국 → 밤늦게까지 엶(화제만), 약국 · 응급실 · 밤(나열)","dg":"줄표"},{"id":"2-W1","k":2,"dev":"Even so (두 문장)","s":"Social media lets us stay in touch with hundreds of friends. Even so, studies suggest that people who spend hours on it every day are more likely to feel lonely.","model":"SNS 오래 → 더 외로움","accept":"SNS 많이 하면 외로워짐","no":"SNS → 친구와 연결(Even so 앞 문장)","dg":"even so"},{"id":"2-W2","k":2,"dev":"; nevertheless,","s":"Moving to a new city can be lonely at first; nevertheless, many people who move say that within a year they have found a new circle of friends.","model":"이사 → 결국 새 친구 생김","accept":"새 도시에서도 1년 안에 친구 사귐","no":"이사 → 외로움(nevertheless 앞)","dg":"; nevertheless,"},{"id":"2-W3","k":2,"dev":"The saying ~ is misleading:","s":"The saying \"blind as a bat\" is misleading: no species of bat is blind, and many bats also use sound to find their way in the dark.","model":"박쥐 → 볼 수 있음","accept":"박쥐는 눈이 멀지 않음","no":"박쥐 → 앞 못 봄(속담 그대로), 소리로 길 찾기(덧붙인 세부라 반만 맞음)","dg":"the saying ~ is misleading:"},{"id":"2-W4","k":2,"dev":"It is true that ~, but","s":"It is true that online classes save travel time, but many students find it harder to stay focused without classmates around them.","model":"온라인 수업 → 집중 어려움","accept":"혼자 듣는 수업은 집중이 힘듦","no":"온라인 수업 → 시간 절약(It is true that 쪽만)","dg":"it is true that ~, but"},{"id":"2-W5","k":2,"dev":"On the other hand, ~ (두 문장)","s":"Spinach is famous as a food that is rich in iron. On the other hand, the body may take in only a small part of the iron that spinach contains.","model":"시금치 철분 → 몸에 조금만 흡수","accept":"시금치 철분은 잘 흡수 안 됨, 시금치 철분 → 몸이 일부만 받아들임","no":"시금치 → 철분 많음(On the other hand 앞 — 요점은 뒤의 흡수 이야기), 시금치 → 철분 없음(only a small part는 조금은 받아들인다는 말이지 철분이 없다는 말이 아님)","dg":"on the other hand, ~"},{"id":"2-W6","k":2,"dev":"But (문장 머리, 두 문장)","s":"Gray, rainy days are often blamed for bad moods. But in one survey of students, what happened at school that day changed their mood far more than the weather did.","model":"기분 → 날씨보다 학교 일이 좌우","accept":"기분엔 날씨보다 그날 학교 일이 중요, 그날 학교 일 → 기분 바꿈(날씨와 견준 말이 빠져 반만 맞음)","no":"비 오는 날 → 기분 나쁨(첫 문장의 흔한 생각), 날씨 → 기분 안 바꿈(far more than은 날씨가 덜 바꾼다는 말이지 전혀 안 바꾼다는 말이 아님)","dg":"but"},{"id":"2-W7","k":2,"dev":"~ but also ~","s":"Walking a dog twice a day keeps the dog healthy but also gives its owner many chances to chat with neighbors along the way.","model":"개 산책 → 개 건강에 이웃 대화까지","accept":"개 산책 → 이웃과 대화 늘어남, 개 산책하면 이웃과 이야기할 기회 많아짐, 개 산책 → 개 건강(but also 앞만 옮겨 반만 맞음)","no":"개 산책 → 개 건강엔 별로(but을 뒤집는 말로 잘못 읽음), 개 산책 → 이웃과 다툼(neighbors를 엉뚱하게 씀)","dg":"not only a but also b"},{"id":"2-W8","k":2,"dev":"still (부사: ~인데도 여전히)","s":"Even after hearing that crammed facts are quickly forgotten, many students still do most of their studying on the night before an exam.","model":"학생들 → 알면서도 벼락치기","accept":"금방 잊는 걸 알아도 전날 몰아서 공부, 학생들 여전히 벼락치기","no":"벼락치기 → 금방 잊음(Even after 쪽 — 학생들이 들은 말이지 요점이 아님), 학생들 → 벼락치기 그만둠(still을 놓쳐 거꾸로 읽음)","dg":"still"},{"id":"3-W1","k":3,"dev":"Rather, (문장 머리)","s":"Good habits are rarely built through willpower alone. Rather, they grow from small routines that are easy to repeat every day.","model":"좋은 습관 → 작고 쉬운 반복","accept":"작은 일과를 되풀이하면 습관이 됨","no":"의지력 → 습관(Rather 앞 문장만)","dg":"rather,"},{"id":"3-W2","k":3,"dev":"do not simply A; instead, B","s":"Good teachers do not simply hand students the right answers; instead, they ask questions that lead students to find the answers on their own.","model":"좋은 교사 → 질문으로 이끔","accept":"정답 대신 질문, 스스로 찾게 함","no":"교사 → 정답 안 줌(not 쪽만)","dg":"do not simply a; instead, b"},{"id":"3-W3","k":3,"dev":"수사 의문문 + Hardly.","s":"Is a quiet classroom always a classroom where students are learning? Hardly. Silence can just as easily mean that students are lost and afraid to ask.","model":"조용함이 곧 배움은 아님","accept":"침묵 → 몰라서 못 물을 수도","no":"조용한 교실 → 잘 배움(물음 그대로)","dg":"수사 의문문 + hardly."},{"id":"3-W4","k":3,"dev":"was never about A; it was about B","s":"For the old shopkeeper, running the store was never about money; it was about knowing every family in the neighborhood by name.","model":"가게 → 이웃과의 정","accept":"돈보다 이웃 알기","no":"가게 → 돈벌이(never 쪽)","dg":"was never about a; it was about b"},{"id":"3-W5","k":3,"dev":"fail to ~ (부정 동사)","s":"Having a lot of friends often fails to help students through hard times; in one survey, what mattered was having one friend who would just listen.","model":"힘들 때 → 들어 줄 한 친구","accept":"들어 주는 친구 하나가 힘이 됨, 친구 수보다 들어 줄 한 명, 친구는 수보다 깊이(반만 맞음 — 들어 주는 한 친구라는 내용이 빠짐)","no":"친구 많으면 → 힘든 때 견딤(fail to를 놓침), 친구 많으면 소용없음(fail to 쪽만 — 무엇이 중요한지 빠짐), 혼자 견디기(글에 없음)","dg":"fail to ~"},{"id":"3-W6","k":3,"dev":"isn't about A; it's about B","s":"How much a family talks at dinner often isn't about daily phone hours; it's about whether phones stay on the table.","model":"저녁 대화 → 식탁 위 폰이 좌우","accept":"폰을 식탁에 두지 않으면 대화 늘어남, 사용 시간보다 식탁 위 폰이 문제, 폰을 어디 두느냐가 대화 좌우","no":"폰 오래 쓰면 대화 줄어듦(isn't about 쪽 — 이 글은 하루 사용 시간이 아니라 식탁 위 폰을 말함), 가족은 저녁을 함께 먹어야 함(글에 없는 흔한 말)","dg":"was never about a; it was about b"},{"id":"3-W7","k":3,"dev":"the key is not A but B","s":"The key to keeping customers at the corner shop near our school was not big discounts but lending students umbrellas on rainy days.","model":"비 오는 날 우산 → 손님 지킴","accept":"비 올 때 우산 빌려준 것이 비결, 할인보다 우산 빌려주기, 친절이 손님 지킴(반만 맞음 — 무엇을 해 주었는지 빠짐)","no":"큰 할인 → 손님 지킴(not 쪽), 학교 앞이라 손님 많음(near our school에 끌림)","dg":"the key is not a but b"},{"id":"3-W8","k":3,"dev":"never A; instead, B","s":"At this year's sports day, the final relay was never a race between classes; instead, all classes ran it together, passing a single baton.","model":"운동회 → 승패 대신 함께 계주","accept":"모든 반이 함께 마지막 계주, 반 대항 대신 다 같이 뛴 계주, 다 같이 뛴 운동회(반만 맞음 — 다 같이 뛴 것은 마지막 계주인데 운동회 전체로 넓힘)","no":"반끼리 경주(never 쪽을 거꾸로 읽음), 반 대항 아님(never 쪽만 — instead 뒤가 빠짐), 운동회 → 승패가 중요(거꾸로 읽음)","dg":"do not simply a; instead, b"},{"id":"4-W1","k":4,"dev":"For instance","s":"For instance, when a popular café started charging customers for paper cups, the number of people bringing their own mugs nearly tripled within a month.","model":"요금 매기자 → 행동 바뀜","accept":"컵값 받자 → 개인 컵 늘어남(사례 그대로라 반만 맞음)","no":"카페 → 종이컵 돈 받음(결과 빠짐), 작은 요금 → 습관 바뀜(글에 없는 「작은」·「습관」을 붙임), 환경 보호(글에 없는 목적)","dg":"for example"},{"id":"4-W2","k":4,"dev":"To illustrate","s":"To illustrate, a football coach began thanking players for their effort after every game, win or lose, and within a season they were training harder and complaining less.","model":"노력 인정 → 더 열심히 함","accept":"감독이 고마워하자 선수가 열심(사례 그대로라 반만 맞음)","no":"칭찬 → 경기 이김(win or lose에 끌림), 감독 → 매번 감사함(원인만)","dg":"to illustrate"},{"id":"4-W3","k":4,"dev":"A good example is ~","s":"A good example is an old riverside factory that was turned into a concert hall and art studios instead of being destroyed.","model":"옛 건물 → 허물지 않고 다시 씀","accept":"공장 → 공연장·작업실로 바뀜(사례 그대로라 반만 맞음)","no":"공장 → 부서짐(instead of를 놓침), 강 · 공장 · 공연장(나열)","ctx":"Old buildings do not have to be torn down to become useful again.","dg":"for example"},{"id":"4-W4","k":4,"dev":"That is why (앞 문장 받기)","s":"That is why many gardeners turn their pots every few days, so the stems do not lean too far to one side.","model":"빛 쪽으로 휘니 → 화분 돌림","accept":"화분을 돌려 고르게 키움","no":"식물 → 빛 쪽으로 자람(앞 문장만), 정원사 → 화분 돌림(That이 무엇인지 빠져 반만 맞음)","ctx":"Plants on a windowsill grow toward the light.","dg":"that is why"},{"id":"4-W5","k":4,"dev":"Here is an example: ~","s":"Here is an example: one class began using a short checklist, and soon its missing assignments dropped from about ten a week to two.","model":"기억 대신 목록 → 빠뜨림 줄어듦","accept":"목록 확인 → 덜 빠뜨림, 적어서 확인하면 덜 잊음, 체크리스트 쓰자 → 빠진 숙제 열 개에서 두 개(사례 그대로라 반만 맞음), 기억만으로는 → 부족함(원리는 맞지만 이 문장이 보여 준 해결인 목록이 빠져 반만 맞음)","no":"학생 → 체크리스트 씀(결과 빠짐), 숙제 → 너무 많음(글에 없는 말), 목록 → 숙제 늘어남(글과 반대)","ctx":"Memory alone is a poor tool for keeping track of small tasks.","dg":"for example"},{"id":"4-W6","k":4,"dev":"Like ~ (예시를 앞에 둠)","s":"Like a cello student who plays the same piece every afternoon, most learners must practice a hard skill again and again before it feels easy.","model":"어려운 기술 → 되풀이해야 쉬워짐","accept":"반복 연습 → 익숙해짐, 여러 번 해야 쉬워짐, 첼로 학생 → 같은 곡 반복해 익힘(사례 그대로라 반만 맞음)","no":"첼로 학생 → 날마다 같은 곡 연습(예시 장면만, 하는 말 빠짐), 첼로 → 어려운 악기(글에 없는 말), 재능 → 중요(글에 없는 말), 쉬운 기술 → 금방 익힘(hard skill을 놓침)","dg":"like ~"},{"id":"4-W7","k":4,"dev":"That is, ~ (즉)","s":"That is, it should show a simple picture, such as a running child or falling rocks: a picture often tells drivers what to expect faster than words.","model":"표지엔 그림 → 글보다 빨리 알림","accept":"그림이 글보다 빨리 전달됨, 그림 표지 → 한눈에 알아봄, 좋은 표지 → 한눈에 이해(앞 문장만 옮겨 그림 이야기가 빠져 반만 맞음), 아이 · 낙석 그림 → 운전자가 빨리 앎(사례 그대로라 반만 맞음)","no":"아이 · 낙석 조심(사례 낱말 나열), 글 표지 → 없애야 함(글에 없는 지나친 말), 운전자 → 글을 못 읽음(앞 문장의 덧붙은 말을 비튼 말)","ctx":"A good road sign should be understood at a glance, even by people who cannot read the local language.","dg":"that is, ~"},{"id":"4-W8","k":4,"dev":"Doing so","s":"Since it started doing so, complaints that lunch is unfair to some classes have nearly disappeared, yet the line itself is no shorter.","model":"순서 돌리기 → 불공평 불만 사라짐","accept":"먼저 먹는 반 바꾸기 → 불만 줄어듦, 돌아가며 먹자 → 공평하다 느낌, 그렇게 하자 → 불만 사라짐(doing so가 무엇인지 빠져 반만 맞음)","no":"순서 돌리기 → 줄 짧아짐(yet 뒤와 반대), 줄 → 여전히 김(덧붙은 뒷말만 잡음), 늦게 먹는 반 → 불만(바뀌기 전 모습)","ctx":"One school lets a different class go to lunch first each day, so no class is always last in line.","dg":"doing so"},{"id":"5-W1","k":5,"dev":"직유 (A is like B)","s":"Praise is like salt: a little brings out the best in a student, but too much makes every compliment taste the same.","model":"칭찬 → 적당해야 효과","accept":"칭찬 많으면 → 가치 떨어짐, 칭찬은 적당히, 칭찬 → 학생 잘하게 함(앞쪽만 써서 반만 맞음)","no":"칭찬 = 소금(비유 겉말), 칭찬 → 많을수록 좋음(글과 반대)","dg":"직유"},{"id":"5-W2","k":5,"dev":"If A is B, then C is D","s":"If a city is a body, then its parks are its lungs: without them, the whole place struggles to breathe.","model":"공원 → 도시에 꼭 필요","accept":"공원 → 도시의 숨통, 공원 없으면 → 도시가 힘듦, 공원 → 공기 맑게 함(꼭 필요하다는 뜻이 빠져 반만 맞음)","no":"도시 = 몸(비유 겉말)","dg":"if a is b, then c is d"},{"id":"5-W3","k":5,"dev":"빗댄 장면 (우의)","s":"An umbrella that stays folded in the closet will never get wet, but it will also never do the job it was made for.","model":"안전만 찾으면 → 제 역할 못 함","accept":"부딪혀야 제 몫 함, 위험 피하면 → 가치 발휘 못 함, 우산 → 써야 제 역할 함(우산 이야기에 머물러 반만 맞음)","no":"우산 → 옷장에 두면 안 젖음(겉뜻)","dg":"빗댄 장면"},{"id":"5-W4","k":5,"dev":"반어 (겉말과 속뜻이 반대)","s":"'Great timing,' Minho muttered, out of breath, as the bus pulled away the moment he reached the stop.","model":"민호 → 버스 놓쳐 짜증","accept":"운 나빠 속상함, 타이밍 나빠 짜증(반어임을 알면 더 좋음), 버스 놓침(감정이 빠져 반만 맞음)","no":"타이밍 좋음(겉말 그대로), 민호 → 숨참(세부)","dg":"반어"},{"id":"5-W5","k":5,"dev":"동격 은유 (A, the B)","s":"A single drawing class at age nine, the tiny seed of Jiwon's dream, has grown into her plan to study design.","model":"그림 수업 하나 → 디자인 꿈으로 자람","accept":"그림 수업 → 디자인 공부 계획으로 이어짐, 아홉 살 그림 수업 → 디자인 꿈 키움, 어릴 적 그림 수업 → 꿈의 씨앗(비유를 옮기기만 해 반만 맞음), 작은 시작 → 큰 꿈 됨(그림 → 디자인이 빠져 반만 맞음), 지원 → 디자인 공부할 계획(무엇에서 자랐는지가 빠져 반만 맞음)","no":"씨앗 → 자라서 꽃 핌(비유의 겉뜻), 지원 → 아홉 살에 그림 배움(세부만 — 꿈으로 자랐다는 말이 빠짐), 꿈 → 크게 가져야 함(글에 없는 교훈)","dg":"동격 은유"},{"id":"5-W6","k":5,"dev":"속담 인용 (a long journey starts with one step)","s":"Faced with a pile of homework, many students forget the old saying that a long journey starts with one step, and they never begin at all.","model":"숙제 더미 → 한 장부터 시작하면 됨","accept":"많은 숙제 → 조금씩 시작하면 됨, 숙제 더미 → 작은 것부터 손대야 함, 학생들 → 숙제 많으면 시작도 못 함(속담의 뜻이 빠져 반만 맞음)","no":"긴 여행 → 한 걸음부터 시작(속담의 겉뜻 그대로), 학생들 → 숙제를 자주 잊음(forget을 숙제를 잊는다는 말로 잘못 읽음), 숙제 → 양을 줄여야 함(글에 없는 말)","dg":"속담 인용"},{"id":"5-W7","k":5,"dev":"날씨 비유 (a clouded face)","s":"Seoyeon's face had been clouded all week, but the morning her father came home from the hospital, her face finally cleared.","model":"서연 → 아빠 퇴원에 표정 밝아짐","accept":"서연 → 걱정 끝나 밝아짐, 서연 → 우울했다가 기분 풀림, 아빠 퇴원 → 서연 마음 갬, 서연 → 한 주 내내 우울함(앞쪽만 써서 반만 맞음)","no":"날씨 → 한 주 내내 흐림(비유의 겉뜻), 서연 얼굴 → 구름이 걷힘(비유의 겉말 그대로), 아빠 → 병원에서 퇴원함(세부만 — 서연의 마음이 빠짐)","dg":"색 비유"},{"id":"5-W8","k":5,"dev":"반어 (겉말과 속뜻이 반대)","s":"When my little brother came home soaked after forgetting his raincoat again, Mom told him it was a smart way to wash his uniform.","model":"엄마 → 우비 또 잊은 동생 꼬집음","accept":"엄마 → 동생 덜렁댐을 놀림, 엄마 → 또 잊었다고 나무람, 엄마 → 동생을 비꼼(무엇을 꼬집는지가 빠져 반만 맞음)","no":"엄마 → 똑똑하다고 칭찬함(겉말 그대로 — again이 꼬집는 신호), 비 → 교복을 빨아 줌(겉뜻), 동생 → 교복 빨려고 비 맞음(엄마 말을 사실로 믿음), 동생 → 비 맞고 옴(when절의 일만 — 엄마 말뜻이 빠짐)","dg":"반어"}],"paras":[{"id":"P1","title":"길 찾기 앱","sents":[["Most people assume that navigation apps simply make travel easier, and in many ways they do.","반대쪽","앱 → 편리"],["Yet when we follow step-by-step directions on a screen, we pay far less attention to the streets we are actually walking through.","주장","화면 따라가면 → 주변 덜 봄"],["Our eyes stay on the blue line, not on the bakery on the corner or the hill beside the park.","예시","파란 선만 봄"],["As a result, people who always rely on an app may arrive on time but often cannot draw even a rough map of the area afterward.","근거","앱 의존 → 지도 못 그림"],["By contrast, those who find their way by looking at street signs and landmarks gradually build a picture of the neighborhood in their heads.","근거","표지판 보며 → 머릿속 지도"],["This mental map is what lets them take a shortcut or find their way back even without a phone.","근거","머릿속 지도 → 스스로 길 찾음"],["Of course, apps are very useful in an unfamiliar city or in an emergency.","반대쪽","낯선 곳·위급할 땐 유용"],["The real lesson is that convenience has a hidden cost: the less we need to notice, the less we know about the places where we live.","결론","편할수록 → 사는 곳 모름"]],"line":"앱은 편하지만, 화면만 따라가면 주변을 덜 보게 되고, 편할수록 우리가 사는 곳을 모르게 된다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["ways to draw a rough map of a neighborhood","benefits of navigation apps in unfamiliar cities","decline in our knowledge of places as we rely on apps","importance of street signs and landmarks in city planning","role of navigation apps in improving our sense of direction"],"ans":2,"why":"한 줄의 「사는 곳을 모르게 된다」가 정답(decline in our knowledge of places as we rely on apps)과 같아요. 「ways to draw a rough map」은 (4)의 rough map을 빌린 방법 이야기, 「benefits of navigation apps in unfamiliar cities」는 반대쪽 문장 (7), 「importance of street signs and landmarks in city planning」은 (5)의 낱말을 빌렸지만 도시 계획은 글에 없고, 「improving our sense of direction」은 글과 반대예요.","tip":"반대쪽 문장 (1)(7)은 「~지만」으로 접어 두면 뼈대가 바로 보여요."},{"id":"P2","title":"고쳐 쓰기","sents":[["When a toaster or a lamp stops working, most of us simply throw it away and buy a new one, because that often costs less than getting the old one fixed at a shop.","반대쪽","고장 → 버리고 새로 삼"],["Yet fixing something with your own hands can give you more than a working machine.","주장","직접 고치기 → 기계 이상의 것"],["At \"repair cafés,\" now held in many cities, volunteers help visitors open up broken lamps, radios and toys and find out what went wrong.","예시","수리 카페 → 함께 고쳐 봄"],["Many visitors say that the best part is not the repaired item itself but finally understanding how it works.","근거","작동 원리 이해 → 가장 큰 보람"],["Once they discover that a loose wire or a worn-out belt was the only problem, they begin to look at other \"broken\" things at home differently.","근거","원인 알면 → 다른 물건도 달리 봄"],["Fixing things yourself also saves money and keeps useful objects out of the trash, but these are only extra benefits.","근거","돈·쓰레기도 줄임(덤)"],["Of course, not everything can be fixed, and some products are designed to be hard to open.","반대쪽","다 고칠 수는 없음"],["Still, even trying to fix something is a small lesson in curiosity: a broken object is often a question waiting for an answer, not the end of its life.","결론","고장 = 끝 아닌 질문 → 호기심"]],"line":"고장 나면 흔히 새로 사지만, 직접 고치면 작동 원리를 알게 되고 물건을 보는 눈이 바뀐다. 고장은 끝이 아니라 풀어 볼 질문이다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["ways to choose products that are easy to repair","economic benefits of buying new products instead of repairing old ones","how repairing things builds understanding and curiosity","reasons why modern products are designed to be hard to open","role of volunteers in reducing household waste"],"ans":2,"why":"한 줄의 「작동 원리를 알게 되고 … 풀어 볼 질문」이 정답(how repairing things builds understanding and curiosity)과 같아요. 「ways to choose products that are easy to repair」는 글에 없는 고르는 법이고, 「economic benefits of buying new products」는 반대쪽 문장 (1)이에요. 「designed to be hard to open」은 양보 문장 (7)의 세부이고, 「reducing household waste」는 글쓴이가 덤으로 붙인 (6)을 요점으로 잡았어요.","tip":"(6)처럼 「but these are only extra benefits」로 스스로 덤이라고 낮춘 문장은 요점이 아니에요. (8)의 비유가 (2)의 주장을 다시 말해요."},{"id":"P3","title":"도시의 새","sents":[["Human noise is changing the way some birds sing.","주장","소음 → 새 노래 바뀜(화제)"],["In quiet forests, many songbirds use low notes, which carry well through the trees.","근거","숲 → 낮은 음 잘 퍼짐"],["In busy cities, however, the low rumble of traffic can cover those same notes, so a song may never reach the bird it was meant for.","근거","도시 소음 → 노래 묻힘"],["Researchers comparing city and forest birds of the same species have found that city birds often sing higher, louder or earlier in the morning, before traffic builds up.","근거","도시 새 → 높게·크게·일찍",["예시"]],["At first glance, this looks like a happy story of nature adjusting to us.","반대쪽","겉보기엔 → 잘 적응함"],["But a higher song may be less attractive to possible mates, and singing louder takes extra energy.","근거","짝 덜 끌고 힘 더 듦"],["In other words, the birds are not simply adapting; they are paying a price for our noise.","주장","★ 적응 아닌 대가(핵심)"],["A quieter city, then, would be a gift not only to the people who live there but also to the birds that share it with us.","결론","조용한 도시 → 새에게도 선물"]],"line":"소음 때문에 도시 새는 노래를 바꾸는데, 적응처럼 보여도 실은 대가를 치르는 것이니 조용한 도시는 새에게도 선물이다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["how city birds learn new songs from one another","hidden costs that birds pay for adjusting to human noise","reasons why low-pitched songs travel well in forests","advantages of early morning singing for city birds","ways to reduce traffic noise in crowded cities"],"ans":1,"why":"한 줄의 「적응처럼 보여도 실은 대가」가 정답(hidden costs that birds pay for adjusting to human noise)과 같아요. 「learn new songs from one another」는 글에 없고, 「low-pitched songs travel well in forests」는 배경 문장 (2)의 세부예요. 「advantages of early morning singing」은 (4)의 earlier를 좋은 점으로 비튼 말이고, 「ways to reduce traffic noise」는 (8)에서 끌어냈지만 방법은 글에 없어요.","tip":"(1)은 화제를 꺼내는 주장이고, 핵심 주장은 (7)이에요. (5) At first glance는 겉보기, 곧 반대쪽이고, (7) In other words가 (6)까지를 한마디로 묶어요."},{"id":"P4","title":"밤하늘","sents":[["When a small mountain town replaced its bright streetlights with dimmer ones that point downward, something unexpected happened.","예시","가로등 → 덜 밝게·아래로"],["Within a year, visitors began arriving at night, not for restaurants or shops, but simply to look at the stars that were now easy to see.","예시","별 잘 보임 → 사람 옴"],["This is a reminder that darkness, which we usually try to remove, can be something worth keeping.","주장","어둠 → 지킬 가치"],["Today, many people who grow up in cities have never seen the Milky Way, because the glow of artificial light hides all but the brightest stars.","근거","도시 불빛 → 은하수 가림"],["Too much light at night can also confuse animals, such as baby sea turtles, which may crawl toward street lamps instead of the sea.","근거","밤빛 → 동물 헷갈림"],["Of course, streetlights help people feel safe, and no one is asking towns to turn them all off.","반대쪽","가로등 → 안전에 필요"],["The point is to use light more wisely: only where it is needed, and only as bright as it needs to be.","주장","필요한 곳에 알맞게만"],["After all, a dark sky is not an empty space above us but a shared treasure that we are slowly losing.","결론","어두운 하늘 = 잃어 가는 보물"]],"line":"어둠도 지킬 가치가 있다. 밤빛이 별과 동물을 가리니, 안전은 지키되 필요한 만큼만 밝혀 어두운 하늘이라는 보물을 지키자.","q":"윗글의 주제로 가장 적절한 것은?","opts":["role of streetlights in keeping towns safe at night","value of darkness and the need to use light wisely","how stargazing tourism helps small mountain towns grow","ways baby sea turtles find their way to the sea","harmful effects of artificial light on wild animals"],"ans":1,"why":"한 줄의 「어둠도 지킬 가치 … 필요한 만큼만 밝혀」가 정답(value of darkness and the need to use light wisely)과 같아요. 「keeping towns safe at night」는 양보 문장 (6)이고, 「stargazing tourism」은 첫 사례 (2)의 세부만 키운 말이에요. 「sea turtles」와 「harmful effects of artificial light on wild animals」는 근거 (5) 하나만 키운 말이에요.","tip":"글이 사례로 시작하면 (3) This is a reminder처럼 사례를 묶는 문장이 주장이에요."},{"id":"P5","title":"종 없는 학교","sents":[["A school day without bells may teach students something no textbook can: how to manage their own time.","주장","종 없는 학교 → 시간 관리 배움"],["One high school switched off its bells and simply posted a timetable, so students had to check the clocks themselves.","예시","종 끈 학교 → 스스로 시계 봄"],["Within a month, lateness had hardly risen, the hallways were calmer, and many students said they had begun to plan their own breaks.","예시","종 끈 뒤 → 지각 안 늚·스스로 계획",["근거"]],["When a bell decides every move, students never need to glance at the clock, so they rarely practice planning their time.","근거","종이 다 정함 → 계획 연습 드묾"],["It is true that a bell gives a clear signal, and some teachers worry that students will wander the hallways without one.","반대쪽","종 = 분명한 신호·떠돌까 걱정"],["Yet students who always depend on bells may struggle later at university or at work, where no one rings a bell before deadlines.","근거","종에 기대면 → 나중에 고생"],["Being a minute late costs much less in high school than at work, so school is a safe place to practice and learn from small mistakes.","근거","학교 = 실수해도 되는 연습장"],["Turning off the bell, then, is not really about quieter hallways; it is about handing students the clock and trusting them with it.","결론","종 끄기 = 시간을 학생에게 맡김",["주장"]]],"line":"종 없는 학교는 스스로 시간을 관리하는 법을 가르친다. 종이 다 정하면 계획 연습이 드물고 학교는 실수해도 되는 연습장이니, 종을 끄는 것은 시간을 학생에게 맡기는 일이다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["calmer and more orderly school days without bells","need for clear bell signals to keep students on time","importance of being on time at school and later at work","time management skills gained in schools without bells","fewer late arrivals in schools that switch off bells"],"ans":3,"why":"한 줄의 「스스로 시간을 관리하는 법」이 정답(time management skills gained in schools without bells)과 같아요. 「calmer and more orderly school days」는 (3)의 세부(the hallways were calmer)를 주제로 키운 말인데, (8)이 (not really about quieter hallways)로 요점이 아니라고 막아요. 「need for clear bell signals」는 양보 문장 (5)를 주제로 잡은 말인데, (6)의 Yet이 다시 뒤집어요. 「fewer late arrivals」는 (3)을 비튼 말이에요. (lateness had hardly risen)은 지각이 거의 늘지 않았다는 말이지 줄었다는 말이 아니에요. 「importance of being on time」은 그럴듯한 교훈이지만, (7)이 (Being a minute late costs much less in high school than at work)로 제때 오기는 요점이 아니라고 해요. 글은 시간을 스스로 계획하기를 말해요.","tip":"첫 문장이 바로 주장인 글이에요. (5) It is true that은 양보(반대쪽)이고, (6) Yet이 다시 주장 쪽으로 돌아와 근거를 보태요. (8)은 (not really about quieter hallways)로 곁가지를 지우고 (1)을 다시 말해요."},{"id":"P6","title":"동네 서점의 변신","sents":[["In one small city, an old bookstore that was about to close began holding a cozy reading night every Friday.","예시","문 닫을 서점 → 금요 독서 모임 엶"],["Neighbors who came for the readings often stayed to chat, and many went home with a novel the owner had recommended.","예시","모임 온 이웃 → 이야기·추천 책 삼"],["Many people believe small bookstores cannot survive, since online stores often sell the same books for less and deliver them overnight.","반대쪽","온라인 싸고 빠름 → 서점 못 버팀"],["Yet some bookstores are surviving by becoming places where people meet, not just shops where books are sold.","주장","작은 서점 → 만나는 곳 되어 살아남음"],["A website can suggest titles from your past orders, but it cannot give you a conversation with a person who loved the book.","근거","웹사이트 → 사람과의 대화는 못 줌"],["Author talks, story hours and book clubs give people a reason to visit in person, and visitors often buy something before leaving.","근거","행사 → 찾아올 까닭·뭔가 사 감",["예시"]],["Such a store also becomes part of the neighborhood, so people feel they are helping their own community whenever they browse there.","근거","동네 서점 → 들르면 동네 돕는 느낌"],["What keeps a small bookstore alive, then, may be less the books on its shelves than the people it brings together.","결론","서점 살리는 것 = 책보다 모이는 사람",["주장"]]],"line":"문 닫을 뻔한 서점이 독서 모임으로 사람을 모았다. 흔히 온라인 때문에 작은 서점은 못 버틴다고 하지만, 어떤 서점은 사람이 만나는 곳이 되어 살아남고, 서점을 살리는 것은 책보다 모이는 사람이다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["survival of small bookstores as places where people meet","survival of small bookstores through careful book choices","value of supporting local shops over big online stores","decline of small bookstores in the age of online shopping","popularity of Friday reading nights in one small city"],"ans":0,"why":"한 줄의 「어떤 서점은 사람이 만나는 곳이 되어 살아남고」가 정답(survival of small bookstores as places where people meet)과 같아요. 「through careful book choices」는 (2)의 주인이 권한 소설(a novel the owner had recommended)에 끌린 말인데, (8)이 (less the books on its shelves than the people it brings together)로 책보다 사람이라고 막아요. 「decline of small bookstores」는 통념 문장 (3)을 주제로 잡은 말인데 (4)의 Yet이 뒤집어요. 「value of supporting local shops」는 근거 (7) 하나를 흔한 교훈으로 키운 말로, 글은 온라인 대신 동네 가게를 쓰자고 하지 않아요. 「Friday reading nights」는 첫 사례 (1)의 세부예요.","tip":"이야기로 시작하는 글은 사례 뒤의 통념 (3) Many people believe와 그것을 뒤집는 (4) Yet을 찾으면 주장이 보여요. (8)의 (less the books on its shelves than the people it brings together)가 (4)를 다시 말해요."},{"id":"P7","title":"동네 하천 되살리기","sents":[["For much of the last century, many towns covered their small streams with concrete, because a hidden stream seemed cleaner and safer.","반대쪽","하천 덮기 → 깨끗·안전해 보임"],["Covering a stream also made room for roads and parking lots, which growing towns badly needed.","반대쪽","덮으면 → 길·주차장 생김",["근거"]],["But when one town tore up the pavement and let its stream run in the open again, ducks and fish returned within a few years.","예시","덮개 걷은 하천 → 오리·물고기 돌아옴",["근거"]],["Opening a stream is expensive, of course, and some shopkeepers in that town worried about losing their parking spaces.","반대쪽","하천 열기 → 돈 듦·주차 걱정"],["Still, bringing a stream back into the open may give a neighborhood far more than the parking spaces it takes away.","주장","하천 되살리기 → 잃는 것보다 얻는 것 큼"],["An open stream can also hold more rainwater than a narrow underground pipe, so heavy rain may flood fewer nearby streets.","근거","열린 하천 → 큰비에도 덜 넘침"],["In that town, a new footpath along the water soon filled with walkers, and shops that had feared losing parking gained customers.","예시","물가 길 → 걷는 사람·가게 손님 늚",["근거"]],["A stream under concrete is only a drain, but a stream in the open can become the heart of a neighborhood.","결론","열린 하천 → 배수로 아닌 동네 중심",["주장"]]],"line":"흔히 하천은 덮는 편이 깨끗하고 쓸모 있다고 여겼고 되살리는 데는 돈과 주차 걱정이 따르지만, 하천을 되살리면 잃는 것보다 얻는 것이 크다. 오리와 물고기가 돌아오고 큰비에도 덜 넘치며, 열린 하천은 동네의 중심이 된다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["benefits of covering streams for cleaner and safer towns","benefits of open streams for wildlife rather than people","high costs of opening streams for local shop owners","benefits of open streams for shops rather than wildlife","benefits of letting buried streams run in the open again"],"ans":4,"why":"한 줄의 「하천을 되살리면 잃는 것보다 얻는 것이 크다」가 정답(benefits of letting buried streams run in the open again)과 같아요. 「benefits of covering streams」는 통념 (1)(2)를 주제로 잡은 말인데 (5)의 Still이 뒤집어요. 「for wildlife rather than people」는 (3)의 오리와 물고기에 끌린 말인데, 글은 (7)의 걷는 사람 · 손님과 (8)의 (the heart of a neighborhood)처럼 동네 사람이 얻는 것을 말해요. 「high costs of opening streams」는 양보 (4)이고, (7)에서 가게는 오히려 손님을 얻었어요(gained customers). 「for shops rather than wildlife」는 (7)의 가게 손님(gained customers)에 끌린 말인데, (3)에서 오리와 물고기도 돌아왔고(ducks and fish returned) 글은 어느 한쪽을 앞세우지 않아요.","tip":"통념이 두 번 나오는 글이에요. (1)(2)는 하천을 덮던 까닭, (4)는 되살릴 때의 걱정이고, 주장은 다섯째 문장 (5) Still에서야 나와요. 주장이 늦게 나와도 (8)이 비유로 다시 말해 줘요. (3)의 But 뒤는 주장이 아니라 한 마을의 사례(예시)예요."},{"id":"P8","title":"모둠 과제의 무임승차","sents":[["In group projects, one student often stays up late finishing the slides while the others simply add their names at the end.","예시","모둠 과제 → 한 명만 일함(문제)",["근거"]],["A common answer is to grade each member separately or let classmates rate one another in secret, so that free riders lose points.","반대쪽","흔한 해결 → 따로 채점·서로 평가"],["There may be a simpler fix that works better: keeping groups small, with three members instead of five or six.","주장","더 나은 해결 → 모둠을 작게"],["In a group of six, one member can easily stay silent and go unnoticed, since the other five can finish without help.","근거","6명 → 한 명 빠져도 티 안 남"],["In a group of three, however, every missing part is obvious, and even shy members are more likely to be heard.","근거","3명 → 빠지면 바로 보임·말도 들림"],["One teacher who switched from groups of six to groups of three found that nearly every student took part, not just the usual leaders.","예시","3명 모둠 반 → 거의 모두 참여",["근거"]],["Separate grades, by contrast, may catch free riders after a project ends but do little to bring them into the work.","근거","따로 채점 → 참여는 못 끌어냄"],["In other words, free riding is often a sign not of lazy students but of groups in which hiding is too easy.","결론","무임승차 = 게으름 아닌 숨기 쉬운 모둠 탓",["주장"]]],"line":"모둠 과제에서는 흔히 한 명만 일한다. 따로 채점하거나 서로 평가하게 하는 것이 흔한 해결책이지만 모둠을 작게 하는 편이 낫다. 작으면 빠진 몫이 바로 보이고 모두 참여하게 되니, 무임승차는 게으른 학생이 아니라 숨기 쉬운 모둠의 문제인 때가 많다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["separate grades as a fair fix for free riding in projects","clear roles for each member as a cure for free riding","small groups as a simple fix for free riding in projects","habits of lazy students who avoid doing group work","role of the usual leaders in planning group projects"],"ans":2,"why":"한 줄의 「모둠을 작게 하는 편이 낫다」가 정답(small groups as a simple fix for free riding in projects)과 같아요. 「separate grades as a fair fix」는 흔한 해결책 (2)를 주제로 잡은 말인데, (3)이 더 나은 방법을 내놓고 (7)이 따로 채점은 (do little to bring them into the work)라고 막아요. 「clear roles for each member」는 모둠 과제에서 흔히 떠올리는 해결책일 뿐, 글은 역할 나누기를 말하지 않고 모둠의 크기를 말해요(keeping groups small). 「habits of lazy students」는 (8)이 (not of lazy students)로 막는 말이고, 「role of the usual leaders」는 사례 (6)의 세부(not just the usual leaders)를 비튼 말이에요.","tip":"문제 → 흔한 해결책 → 다른 해결책 꼴이에요. (2) A common answer는 남들이 쓰는 방법(반대쪽)이고, 주장 (3)에는 but · yet 같은 신호 말이 없어요. (7)은 흔한 해결책을 다시 꺼내지만 그 한계를 짚는 근거예요. (1)은 문제를 보여 주는 장면이에요(예시 · 근거 둘 다 인정)."}]},"adv":{"choose":[{"id":"S1-1","k":1,"dev":"not least because","s":"In one village, the volunteer fire brigade has become the most trusted institution, not least because its members are neighbors who respond within minutes.","a":"의용 소방대 → 가장 신뢰받는 기관","why":"not이 보여도 뒤집는 말이 아니에요. not least because는 「무엇보다 ~ 때문에」라는 까닭이라, 요점은 그 앞 주절(the volunteer fire brigade has become the most trusted institution)이에요.","tr":[["이웃 대원 → 몇 분 만에 출동","not 뒤가 답이라는 요령에 끌린 답이에요. not least because 뒤는 까닭(its members are neighbors who respond within minutes)일 뿐 앞말을 뒤집지 않아요."],["의용 소방대 → 대원 구하기 힘듦","시골 소방대 이야기에 흔히 나오는 걱정이지만 이 문장에는 없어요."],["의용 소방대 → 가장 바쁜 기관","the most trusted institution을 같은 틀에서 낱말만 바꿨어요. 문장은 가장 신뢰받는 기관이라고 했지 가장 바쁘다고 하지 않았어요."]]},{"id":"S1-2","k":1,"dev":"all but","s":"Lighthouse keepers' logbooks, which recorded the wind every few hours and were all but forgotten for decades, have become essential for researchers studying past storms.","a":"등대 일지 → 옛 폭풍 연구에 필수","why":"all but은 but이 들어 있어도 대조가 아니라 「거의」라는 뜻이에요. which 뒤(all but forgotten for decades)는 일지가 지나온 사정을 덧붙인 말이고, 요점은 주절(have become essential for researchers studying past storms)이에요.","tr":[["등대 일지 → 수십 년간 거의 잊힘","but 뒤가 답이라는 요령에 끌린 답이에요. all but forgotten for decades는 지난 사정일 뿐, 지금 일지가 어떤 대접을 받는지는 주절이 말해요."],["등대 자동화로 등대지기 사라짐","등대에 관해 흔히 듣는 이야기지만 이 문장에는 없어요."],["등대 일지 → 날씨 예보에 쓰임","일지가 쓰이는 곳을 비틀었어요. 문장은 지난 폭풍을 연구하는 사람들(researchers studying past storms)에게 꼭 필요해졌다고 했지 예보 이야기는 없어요."]]},{"id":"S1-3","k":1,"dev":"however + 형용사","s":"In one study, however effective they were at blocking chatter, noise-cancelling headphones helped students concentrate only when working on tasks of their own choosing.","a":"헤드폰은 직접 고른 과제만 도움","why":"however 뒤에 형용사가 바로 오면 「아무리 ~해도」라는 양보예요. 뒤집는 신호가 아니니 요점은 주절(noise-cancelling headphones helped students concentrate only when working on tasks of their own choosing)이에요.","tr":[["헤드폰은 잡담을 잘 막아 줌","however 뒤가 답이라는 요령에 끌린 답이에요. however effective they were at blocking chatter는 양보로 접어 둔 말이에요."],["헤드폰은 어떤 과제든 집중 도움","문장은 스스로 고른 과제를 할 때만 도움이 됐다고 했어요(only when working on tasks of their own choosing). 범위를 넓혔어요."],["헤드폰은 쉬운 과제에만 도움","도움이 된 때를 좁힌 것은 맞지만, 기준은 쉬운 과제가 아니라 학생이 스스로 고른 과제(tasks of their own choosing)예요."]]},{"id":"S1-4","k":1,"dev":"given that","s":"Given that mining rare earth metals often leaves toxic waste behind, some engineers argue that recycling old phones deserves more public support.","a":"폐휴대폰 재활용 더 지원해야","why":"given that은 「~을 생각하면」이라는 바탕을 까는 말이에요. 요점은 주절의 주장(some engineers argue that recycling old phones deserves more public support)이에요.","tr":[["희토류 채굴 → 독성 폐기물 남김","given that 뒤의 바탕(mining rare earth metals often leaves toxic waste behind)만 옮겼어요. 그 바탕 위에서 무엇을 주장하는지가 요점이에요."],["희토류 → 몇몇 나라에 몰려 있음","희토류 이야기에 자주 나오는 말이지만 이 문장에는 없어요."],["채굴 멈추고 재활용으로 대체","문장은 재활용을 더 지원하자고 했을 뿐 채굴을 멈추자고 하지 않았어요. 주장의 정도를 키운 말이에요."]]},{"id":"S1-5","k":1,"dev":"in that","s":"One old timber school survived an earthquake better than the nearby concrete hall, in that the school's wooden joints could flex as the ground shook.","a":"목조 학교 → 지진에 더 잘 버팀","why":"in that은 「~라는 점에서」, 곧 까닭을 붙이는 말이에요. 요점은 주절(One old timber school survived an earthquake better than the nearby concrete hall)이에요.","tr":[["이음새 → 흔들림 따라 휘어짐","in that 뒤의 까닭(the school's wooden joints could flex as the ground shook)만 옮겼어요. 왜 잘 버텼는지 풀어 줄 뿐 요점은 앞 주절이에요."],["오래된 건물 → 보강이 필요함","지진 이야기에 흔히 나오는 교훈이지만 문장에 없어요. 오히려 낡은 목조 학교가 잘 버텼다고 했어요."],["목조 학교 → 지진 뒤 고치기 쉬움","휘는 이음새 이야기에 끌려 그럴듯하게 지어낸 말이에요. 문장은 지진을 더 잘 견뎠다고 했지(survived an earthquake better) 고치기 쉽다는 말은 없어요."]]},{"id":"S1-6","k":1,"dev":"now that","s":"Now that one county archive has scanned its land records, historians who once waited weeks for files can trace a property's history within hours.","a":"땅 내력 찾기 → 몇 시간이면 됨","why":"now that은 「이제 ~했으니」라는 바뀐 사정이에요. 요점은 그래서 무엇이 달라졌는지를 말하는 주절(historians who once waited weeks for files can trace a property's history within hours)이에요.","tr":[["보관소 → 옛 토지 기록 스캔","now that 뒤의 바뀐 사정(one county archive has scanned its land records)만 옮겼어요. 그 덕에 생긴 변화가 요점이에요."],["디지털화가 낡은 원본 지켜 줌","기록을 스캔하는 까닭으로 흔히 드는 말이지만 이 문장에는 없어요."],["땅 내력 찾기 → 누구나 할 수 있음","문장은 역사가들의 일이 빨라졌다고 했지(historians who once waited weeks for files) 누구나 할 수 있게 됐다고 하지 않았어요. 범위를 넓혔어요."]]},{"id":"S1-7","k":1,"dev":"owing to","s":"Clay-jar soybean paste still outsells factory brands at one village market, owing to a distinctive flavor older shoppers associate with childhood.","a":"장독 된장이 공장 된장보다 잘 팔림","why":"owing to는 까닭을 붙이는 말이에요. 요점은 주절(Clay-jar soybean paste still outsells factory brands)이에요.","tr":[["된장 맛 → 어린 시절 떠올리게 해 줌","owing to 뒤의 까닭(a distinctive flavor older shoppers associate with childhood)만 옮겼어요."],["발효 음식은 장 건강을 도와줌","발효 음식에 흔히 붙는 말이지만 이 문장에는 없어요."],["젊은 손님 → 공장 된장 더 찾음","문장에는 나이 든 손님(older shoppers)만 나와요. 젊은 손님 이야기는 글 낱말을 비틀어 지어낸 말이에요."]]},{"id":"S1-8","k":1,"dev":"whereby","s":"A seed bank that lends seeds to farmers may keep old varieties alive better than a sealed vault, through a scheme whereby borrowers return extra seeds.","a":"씨앗 대여 → 옛 품종 더 잘 지킴","why":"whereby는 「그 방식에 따라 ~하는」이라는 꾸밈말이라 제도가 돌아가는 방식을 덧붙여요. 요점은 주절(A seed bank that lends seeds to farmers may keep old varieties alive better than a sealed vault)이에요.","tr":[["씨앗 대여 → 농부 수확 늘려 줌","씨앗을 빌려준다는 데서 그럴듯하게 지어낸 효과예요. 문장이 말한 효과는 옛 품종을 살려 두는 것이에요(keep old varieties alive)."],["빌린 농부 → 씨앗 더 얹어 돌려줌","whereby 뒤의 방식(borrowers return extra seeds)만 옮겼어요. 요점은 그 은행이 무엇을 해내는지예요."],["종자 은행 → 기후 변화 대비책","종자 은행에 흔히 붙는 말이지만 이 문장에는 없어요."]]},{"id":"S1-9","k":1,"dev":"동격 that절 (the finding that ~)","s":"The finding that one damaged reef recovered faster where grazing fish were protected has persuaded several island councils to limit net fishing.","a":"여러 섬 의회 → 그물 어업 제한","why":"The finding that ~ protected까지가 통째로 주어예요. 요점은 그 주어가 무엇을 했는지, 곧 주절의 동사 부분(has persuaded several island councils to limit net fishing)이에요.","tr":[["물고기 보호 → 산호 빨리 회복","the finding that 뒤는 발견의 내용(one damaged reef recovered f
