"id":"S5-3","k":5,"dev":"모순어법 (a deafening silence 같은 꼴)","s":"Since the conductor turned seventy, the orchestra's rehearsals have been guided by an eloquent stillness, which younger conductors, when asked, acknowledge they cannot imitate.","a":"지휘자 → 몸짓 없이도 잘 이끎","why":"eloquent stillness(많은 것을 말해 주는 고요함)는 서로 어긋나는 낱말을 붙인 모순어법이에요. 가만히 있는데도 많은 것을 전한다는 뜻이라, 지휘자가 큰 몸짓 없이 연습을 이끈다(the orchestra's rehearsals have been guided by an eloquent stillness)는 말이에요. 젊은 지휘자들이 따라 하지 못한다(acknowledge they cannot imitate)는 것은 그 고요함이 쇠약이 아니라 솜씨라는 뜻이에요.","tr":[["지휘자 → 나이 들어 기운 빠짐","일흔이 넘었다는 것(Since the conductor turned seventy)과 고요함(stillness)을 겉뜻대로 이어 「늙어서 덜 움직인다」로 읽은 답이에요. eloquent가 붙어 그 고요함이 오히려 많은 것을 전한다는 뜻이고, 젊은 지휘자들도 따라 하지 못한다고 해요."],["단원들 → 지휘를 따르기 힘듦","몸짓이 적으면 따르기 어렵겠다는 짐작이지만 글에 없어요. 연습은 그 고요함으로 이끌려 왔어요(have been guided by an eloquent stillness)."],["지휘 → 단원과의 믿음이 바탕","지휘에 대해 흔히 하는 교훈이지만 글에 없어요."]]},{"id":"S5-4","k":5,"dev":"상황의 아이러니 (소방서가 불탐 같은 꼴)","s":"The committee formed last year to reduce paperwork has so far produced a 300-page report, which every department is now required to read and sign.","a":"위원회 → 서류 일을 더 늘림","why":"서류를 줄이려고 만든 위원회(The committee formed last year to reduce paperwork)가 300쪽 보고서를 내어, 이제 모든 부서가 그것을 읽고 서명해야 해요(every department is now required to read and sign). 목적과 정반대 결과가 나온 상황의 아이러니로, 위원회가 서류 일을 더 늘렸다는 속뜻이에요.","tr":[["위원회 → 꼼꼼한 보고서를 냄","겉뜻만 보면 300쪽 보고서는 꼼꼼한 성과처럼 보여요. 하지만 이 위원회는 서류를 줄이려고 만든 것(formed last year to reduce paperwork)이라, 두꺼운 보고서는 칭찬이 아니라 꼬집는 말이에요."],["부서들 → 보고서에 불만이 큼","그럴듯한 짐작이지만 부서들이 불만을 말했다는 내용은 없어요. 글은 읽고 서명해야 한다(is now required to read and sign)고만 해요."],["행정 → 절차 줄여야 빨라짐","위원회를 만든 목적에서 끌어낸 흔한 교훈이에요. 글이 말하는 것은 그 목적과 반대로 된 결과예요."]]},{"id":"S5-5","k":5,"dev":"제유 (all hands = 일손 같은 꼴)","s":"The village festival drew so many visitors that its organizers, who had anticipated half as many, found themselves with too many mouths to feed and too few hands.","a":"축제 → 일할 사람이 모자람","why":"mouths(입)는 먹을 사람, hands(손)는 일할 사람을 몸의 한 부분으로 가리킨 제유예요. 먹일 입은 너무 많고 시중들 손은 너무 적었다(too many mouths to feed and too few hands)는 것은 손님에 비해 일할 사람이 모자랐다는 뜻이에요.","tr":[["주최 측 → 음식을 덜 준비함","mouths to feed를 겉뜻대로 음식 이야기로 읽은 답이에요. 모자란 쪽은 손(too few hands), 곧 일할 사람이에요. 음식이 모자랐다는 말은 없어요."],["주최 측 → 손님 수를 잘못 짐작함","관계사절의 세부(who had anticipated half as many)예요. 일이 벌어진 까닭일 뿐, 문장이 말하려는 결과는 일손이 모자랐다는 것이에요."],["축제 → 클수록 마을에 이득","축제에 대해 흔히 하는 말이지만 글에 없어요."]]},{"id":"S5-6","k":5,"dev":"온도 비유 (a chilly reception 같은 꼴)","s":"On her first morning, the new manager received a chilly welcome that, as she later learned, came from the office heater, which had apparently stopped functioning over the long weekend.","a":"첫 출근날 → 사무실이 추웠음","why":"chilly welcome은 흔히 「쌀쌀한 대접」이라는 온도 비유로 쓰이지만, 여기서 추위는 진짜 추위예요. 차가운 환영은 사람이 아니라 사무실 난방기에서 왔고(came from the office heater), 그 난방기는 긴 연휴 동안 멈춰 버렸어요(had apparently stopped functioning over the long weekend). 난방기를 사람처럼 「맞이했다」고 재치 있게 말했을 뿐, 첫 출근날 사무실이 정말 추웠다는 뜻이에요.","tr":[["직원들 → 새 관리자를 꺼림","chilly welcome을 무조건 「쌀쌀한 대접」이라는 속뜻으로 읽은 답이에요. 이 차가운 환영은 사람이 아니라 난방기에서 왔어요(came from the office heater). 직원들 이야기는 글에 없어요."],["관리자 → 긴 연휴 뒤 첫 출근","때를 나타내는 덧붙은 세부(over the long weekend)예요. 난방기가 언제 멈췄는지를 말할 뿐, 문장이 하려는 말은 첫날 사무실이 추웠다는 것이에요."],["새 직장 → 첫날은 어색하기 마련","새 직장 첫날에 대한 흔한 이야기지만 글에 없어요."]]},{"id":"S5-7","k":5,"dev":"전이 수식어 (a sleepless night 같은 꼴)","s":"After nineteen days of talks that had collapsed twice, the two delegations signed the agreement over a weary breakfast, which neither side bothered to finish.","a":"양측 → 지친 끝에 서명함","why":"a weary breakfast(지친 아침 식사)는 사람의 상태(지침)를 곁에 있는 물건(아침 식사)에 옮겨 붙인 전이 수식어예요. 열아흐레 협상 끝에(After nineteen days of talks) 양쪽 대표단이 지친 채 서명했고, 아침을 다 먹을 마음도 없었다(which neither side bothered to finish)는 속뜻이에요.","tr":[["양측 → 서명하며 함께 축하함","서명 자리에 아침 식사가 있다고 축하하는 자리로 읽은 답이에요. weary(지친)와, 아무도 아침을 다 먹지 않았다(which neither side bothered to finish)는 모습은 축하와 거리가 멀어요."],["협상 → 두 번이나 깨졌었음","관계사절의 세부(that had collapsed twice)예요. 지금까지의 사정일 뿐, 문장의 중심은 마침내 서명한 장면과 그때의 모습이에요."],["협상 → 양보해야 타결됨","협상에 대해 흔히 하는 교훈이지만 글에 없어요."]]},{"id":"S5-8","k":5,"dev":"역설 (the more ~, the less ~)","s":"The more cautiously the veteran runner, who turned forty last spring, approaches the opening laps, the less often younger rivals finish ahead of her.","a":"노장 → 천천히 시작해 덜 밀림","why":"「The more ~, the less ~」 꼴의 역설이에요. 처음 몇 바퀴를 조심스럽게 달릴수록(The more cautiously the veteran runner ... approaches the opening laps) 젊은 선수들이 그보다 먼저 들어오는 일이 줄어든다(the less often younger rivals finish ahead of her)는 말이에요. 느려 보이는 출발이 오히려 앞서는 길이라는 속뜻이에요.","tr":[["노장 → 나이 들어 조심스러워짐","관계사절(who turned forty last spring)과 cautiously를 겉뜻대로 이은 답이에요. 글은 그 조심스러움이 약점이 아니라 젊은 선수들을 앞서는 길이라고 말해요."],["노장 → 젊은 선수에게 밀려남","나이가 많으면 밀린다는 흔한 짐작이에요. 글은 젊은 선수들이 그를 앞서는 일이 줄어든다(younger rivals finish ahead of her)고, 곧 반대로 말해요."],["노장 → 조심할수록 더 밀림","같은 「~할수록」 꼴에서 방향을 거꾸로 잡았어요. 글은 조심스럽게 시작할수록 젊은 선수들이 그를 앞서는 일이 줄어든다(the less often younger rivals finish ahead of her)고 해요."]]},{"id":"S5-9","k":5,"dev":"우화 인용 (sour grapes · the boy who cried wolf 같은 꼴, 문장 안에서 비유로)","s":"The older lab, which had abandoned the experiment years before its rival finally succeeded, dismissed the result as minor, a reaction colleagues privately called sour grapes.","a":"포기한 쪽 → 샘이 나서 깎아내림","why":"sour grapes(신 포도)는 여우가 닿지 않는 포도를 「어차피 실 거야」 하고 깎아내린 우화에서 온 말이에요. 오래전에 실험을 그만둔 연구실(which had abandoned the experiment years before its rival finally succeeded)이 상대의 성공을 하찮다고 했고(dismissed the result as minor), 동료들이 그 반응을 신 포도라 불렀으니, 자기가 못 해낸 것이 샘나서 깎아내렸다는 속뜻이에요.","tr":[["새 결과 → 학계에 의미가 적음","오래된 연구실의 평가(dismissed the result as minor)를 그대로 믿은 답이에요. 동료들이 그 반응을 신 포도라고 불렀다는 것은, 그 평가가 공정한 판단이 아니라 샘에서 나온 말이라는 뜻이에요."],["경쟁 → 서로를 성장하게 함","두 연구실의 경쟁에 대해 흔히 하는 좋은 교훈이지만 글에 없어요."],["포기한 쪽 → 다시 실험에 나섬","그럴듯한 다음 이야기지만 글에 없어요. 그 연구실이 한 일은 상대의 결과를 하찮다고 한 것(dismissed the result as minor)뿐이에요."]]},{"id":"S5-10","k":5,"dev":"행동으로 드러나는 속뜻 (감정 낱말 없이 행동만으로)","s":"When our team lost the debate final, the captain, who had insisted all season that outcomes hardly mattered, sat alone in the empty hall until dark.","a":"주장 → 실은 패배에 낙담함","why":"슬프다는 낱말 없이 행동만으로 마음을 보여 주는 문장이에요. 시즌 내내 결과는 별것 아니라고 했지만(insisted all season that outcomes hardly mattered), 결승에서 지자 빈 강당에 어두워질 때까지 혼자 앉아 있었어요(sat alone in the empty hall until dark). 겉으로 한 말과 달리 실은 패배에 낙담했다는 속뜻이에요.","tr":[["주장 → 결과에 전혀 개의치 않음","관계사절에 나온 주장의 말(who had insisted all season that outcomes hardly mattered)을 그대로 믿은 답이에요. 진 뒤에 한 행동은 그 말과 다른 속마음을 보여 줘요."],["주장 → 팀원들을 다독여 줌","주장이 할 법한 일이지만 글에 없어요. 주장은 혼자 앉아 있었어요(sat alone)."],["토론 → 결과보다 과정이 중요","주장이 늘 하던 말이자 흔한 교훈이지만, 이 문장이 보여 주는 것은 그 말과 다른 주장의 모습이에요."]]}],"write":[{"id":"S1-W1","k":1,"dev":"by virtue of","s":"By virtue of staying open on Friday nights, one small museum has become a meeting place for teenagers, who had seldom visited it before.","model":"작은 박물관 → 십대 모임터 됨","accept":"야간 개장 박물관 → 십대 만남의 장소, 금요일 밤 개장 → 십대가 모임, 박물관 → 십대가 찾아옴(반만 맞음: 모이는 장소가 됐다는 말이 빠짐)","no":"금요일 밤에 문 엶(by virtue of 뒤 까닭만), 예전엔 십대가 잘 안 옴(who 뒤 세부만), 야간 개장 → 관람료 수입 늘어남(글에 없음)"},{"id":"S1-W2","k":1,"dev":"if only because","s":"Teachers in one district now let pupils answer in dialect, if only because children who are constantly corrected often stop raising their hands.","model":"교사들 → 사투리 대답 허용","accept":"교실에서 사투리로 대답해도 됨, 선생님이 사투리 대답 받아 줌","no":"자꾸 고치면 손 안 듦(if only because 뒤 까닭만), 사투리 → 지켜야 할 문화(글에 없는 교훈), 사투리 → 고쳐 줘야 함(글과 반대)"},{"id":"S1-W3","k":1,"dev":"과거분사 수식 (관계사 생략된 꼴)","s":"Plastic fibers shed by washing machines, small enough to slip through some treatment plants, were detected at nearly every bend of one river sampled by students.","model":"세탁 미세섬유 → 강 곳곳에서 나옴","accept":"강 거의 모든 곳에서 플라스틱 섬유 발견, 세탁기 미세 플라스틱 → 강 전체에 퍼짐, 강에서 미세 플라스틱 나옴(반만 맞음: 거의 모든 곳이라는 범위가 빠짐)","no":"처리장을 빠져나감(덧붙은 세부만), 학생들이 강물 조사(과거분사 꾸밈말만), 세탁기 → 강 오염의 주범(글에 없는 단정)"},{"id":"S1-W4","k":1,"dev":"so + 형용사 + that (결과)","s":"The sign language of one isolated village became so widespread that even hearing residents who had no deaf relatives used it in the fields.","model":"마을 수어 → 듣는 주민도 씀","accept":"외딴 마을 수어 → 마을 전체로 퍼짐, 청인 주민까지 수어 사용, 마을 수어가 널리 퍼짐(반만 맞음: 얼마나 퍼졌는지 결과가 빠짐)","no":"농인 가족이 없음(who 뒤 세부만), 들에서 씀(세부만), 수어 → 외딴 마을에서 생김(화제만)"},{"id":"S1-W5","k":1,"dev":"courtesy of ~ (덕분 — 까닭을 덧붙임)","s":"One rural clinic now keeps most of its newly licensed nurses beyond their second year, courtesy of a mentoring program paid for by former patients.","model":"시골 의원 → 새내기 간호사 오래 남음","accept":"시골 의원 → 신입 간호사가 두 해 넘게 일함, 새 간호사 대부분이 두 해 넘게 남음, 시골 의원 → 간호사가 남음(새로 자격을 딴 간호사라는 점이 빠져 반만 맞음)","no":"옛 환자들이 돈을 댄 멘토 제도(courtesy of 뒤 까닭만), 시골 의원 → 간호사 부족함(글에 없는 흔한 말), 멘토 제도 → 환자가 늘어남(글에 없음)","dg":"courtesy of"},{"id":"S1-W6","k":1,"dev":"In response to ~ (계기를 앞머리에 덧붙임)","s":"In response to a petition signed by commuters, one commuter railroad introduced quiet cars, and its satisfaction ratings have since reached their highest level in a decade.","model":"조용한 객차 도입 → 만족도 10년 새 최고","accept":"조용한 칸 만듦 → 승객 만족도 10년 새 가장 높음, 정숙 객차 → 만족도 크게 좋아짐, 조용한 객차 도입 → 반응 좋아짐(얼마나 좋아졌는지 빠져 반만 맞음)","no":"통근객들이 청원에 서명함(In response to 뒤 계기만), 철도 회사 → 조용한 객차 도입(한 일만 있고 결과가 빠짐), 조용한 객차 → 승객 수 늘어남(글에 없음)","dg":"in response to"},{"id":"S1-W7","k":1,"dev":"쉼표 사이 동격 (itself ~ : 예전 사정을 끼워 넣음)","s":"One river town's flood barrier, itself a controversial investment when voters approved it, has prevented an estimated three evacuations within its first five years.","model":"홍수 방벽 → 다섯 해에 대피 세 번쯤 막음","accept":"홍수 방벽 → 대피할 일을 여러 번 막아 줌, 방벽 덕에 대피 세 차례쯤 피함, 홍수 방벽 → 제구실을 함(무엇을 막았는지 빠져 반만 맞음)","no":"방벽 → 승인 때 논란 많던 투자(쉼표 사이 예전 사정만), 방벽 → 돈만 든 헛된 투자(글과 반대), 홍수 방벽 → 강물 넘침을 다 막음(글보다 세게 말함)","dg":"itself ~"},{"id":"S1-W8","k":1,"dev":"to say nothing of ~ (하나 더 보탤 뿐 뒤집지 않음)","s":"Turning abandoned rail tunnels into bike paths has greatly reduced journey times between two valley towns, to say nothing of the income it brings to cafes along the way.","model":"폐터널 자전거길 → 두 마을 오가는 시간 줆","accept":"버려진 터널을 자전거길로 → 이동 시간 크게 줄어듦, 터널 자전거길 → 두 마을 사이가 빨라짐, 터널 자전거길 → 시간도 줄고 카페 수입도 생김(덧붙은 것까지 써서 반만 맞음)","no":"길가 카페 → 수입 생김(to say nothing of 뒤에 보탠 것만), 자전거길 → 카페에는 도움 안 됨(nothing을 부정으로 잘못 읽음), 폐터널 → 자전거길로 바꿈(한 일만 있고 결과가 빠짐)","dg":"to say nothing of"},{"id":"S2-W1","k":2,"dev":"Once considered ~, X now ~","s":"Once considered little more than places of entertainment, some zoos now run breeding programs that have helped restore endangered species, such as the Arabian oryx, to the wild.","model":"일부 동물원 → 멸종 위기종 되살림","accept":"동물원이 번식시켜 야생으로 돌려보냄, 동물원 → 위기종 보전에 이바지, 동물원 → 구경거리 이상(반만 맞음: 무엇을 하는지 빠짐)","no":"동물원 → 오락 장소(Once considered 쪽의 옛 생각), 아라비아오릭스 → 야생 복귀(예시 세부만), 동물원 → 모든 동물을 야생으로(멸종 위기종을 모든 동물로 키운 말)"},{"id":"S2-W2","k":2,"dev":"Much as ~, ~","s":"Much as adults like to credit the revival of handwritten letters to nostalgia, teenage letter writers in one survey cited another motive: owning something that cannot be deleted.","model":"십대 손편지 → 지울 수 없어서 씀","accept":"십대는 지워지지 않는 물건이라 손편지를 씀, 손편지 → 향수 말고 다른 까닭(반만 맞음: 그 까닭이 빠짐)","no":"손편지 부활 → 향수 때문(Much as 쪽 어른들의 흔한 설명), 십대 → 디지털 싫어함(지울 수 없다는 말을 키운 것), 손편지 → 다시 유행(화제만 있고 하는 말이 빠짐)"},{"id":"S2-W3","k":2,"dev":"Whereas ~, ~","s":"Whereas shared e-scooters are promoted as a green substitute for cars, one lifecycle study found that most riders surveyed would otherwise have walked, cycled or taken a bus.","model":"킥보드 → 차보다 걷기·버스를 대신","accept":"킥보드 이용자 → 원래는 걷거나 버스 탐, 킥보드는 주로 걷기·자전거·버스를 대신함, 킥보드 → 차 대신은 적음(반만 맞음: 무엇을 대신하는지 빠짐)","no":"킥보드 → 친환경 교통(Whereas 쪽의 홍보 문구), 킥보드 → 배출 더 많음(글이 말하지 않은 결론까지 감), 킥보드 → 자동차 줄임(Whereas 쪽을 그대로 믿은 말)"},{"id":"S2-W4","k":2,"dev":"That said, ~","s":"Rooftop farms, which often grow leafy greens in carefully controlled conditions, can achieve remarkable yields per square meter. That said, because in most cities their combined output remains tiny relative to demand, their value may lie mainly in education.","model":"옥상 농장 → 가치는 주로 교육","accept":"옥상 농장은 양이 적어 교육에 쓸모, 옥상 농장 → 도시 수요엔 턱없이 적음(반만 맞음: 결론인 교육이 빠짐)","no":"옥상 농장 → 수확량 놀라움(That said 앞 문장), 옥상 농장 → 도시 식량 해결(앞 문장을 키운 말), 잎채소 → 옥상에서 잘 자람(앞 문장 세부)"},{"id":"S2-W5","k":2,"dev":"On the face of it, ~. (겉으로 보면 ~ — 뒤 문장이 실제)","s":"On the face of it, a library that abolished overdue fines gave up easy income. So many books it had written off as lost came back that it bought far fewer replacements.","model":"연체료 없앤 도서관 → 잃은 책 돌아와 새로 살 책 줆","accept":"연체료 폐지 → 없어진 줄 알았던 책이 많이 돌아옴, 연체료 없앰 → 책 돌아와 다시 사는 책 크게 줄어듦, 연체료 없앤 도서관 → 손해가 아니었음(무엇이 달라졌는지 빠져 반만 맞음)","no":"연체료 없앤 도서관 → 쉬운 수입을 포기함(On the face of it 쪽 — 겉으로 본 것만), 연체료 없앰 → 빌려 가는 사람 늘어남(글에 없음), 도서관 → 잃은 책을 새로 사들임(글과 반대 — 새로 살 책이 줄었음)","dg":"on the face of it"},{"id":"S2-W6","k":2,"dev":"Nominally ~, X is ~ (이름으로는 ~ ↔ 실제 쓰임)","s":"Nominally a rest day, the Sunday that one fishing village sets aside each week is the day its boats are scraped, its nets mended, and its engines stripped down.","model":"어촌의 쉬는 일요일 → 실제론 배 · 그물 손보는 날","accept":"어촌 일요일 → 이름만 쉬는 날이고 배와 그물을 고침, 쉬는 날 → 사실은 배 · 그물 · 엔진 손질하는 날, 어촌의 일요일 → 쉬지 못함(무엇을 하는지 빠져 반만 맞음)","no":"어촌 → 일요일마다 쉬는 날로 정해 둠(Nominally 쪽 — 이름만 옮김), 어촌 일요일 → 고기잡이를 더 많이 나감(글에 없음 — 손질하는 날이지 조업하는 날이 아님), 어촌 → 배가 낡아 자주 고장 남(글에 없음)","dg":"nominally"},{"id":"S2-W7","k":2,"dev":"Although it is tempting to ~, ~ (~하고 싶어지지만 — 그럴듯한 설명을 받아 준 뒤 사실로 맞섬)","s":"Although it is tempting to credit the new bike lanes with the rise, cycling in one city had already doubled in the three years before the first lane was painted.","model":"자전거 이용 → 전용 차로 생기기 전에 이미 갑절","accept":"자전거 타기 → 차로를 그리기 전 세 해 동안 벌써 두 배, 자전거 이용 증가 → 전용 차로 덕이라 보기 어려움, 자전거 이용 → 이미 늘고 있었음(언제인지 빠져 반만 맞음)","no":"새 자전거 차로 → 자전거 이용 두 배로 늘림(it is tempting to credit 쪽 — 글이 물리친 설명), 자전거 차로 → 세 해 만에 다 그림(글에 없음), 자전거 이용 → 차로가 생긴 뒤 줄어듦(글에 없음)","dg":"it is tempting to"},{"id":"S2-W8","k":2,"dev":"~ did little to ~; what ~ was ~ (효과 없던 것 ↔ 정작 효과 낸 것 — 이음말 없음)","s":"Doubling the fine for littering did little to clean up one riverside park; what cleared its lawns of litter was moving the trash cans to the exits.","model":"공원 쓰레기 → 벌금 아닌 쓰레기통 옮기기로 해결","accept":"쓰레기통을 출구로 옮김 → 잔디밭 쓰레기 사라짐, 벌금 두 배는 소용없고 쓰레기통 위치가 해결, 쓰레기통 옮기기 → 공원 깨끗해짐(벌금과 견준 것이 빠졌지만 요점은 맞음)","no":"쓰레기 벌금 두 배 → 공원 깨끗해짐(글과 반대 —  number of regular contributors, which had been shrinking, roughly doubled.","model":"쉬운 첫 일 → 참여자 늘어남","accept":"쉬운 첫 기여 → 기여자 늘어남, 쉬운 일 표시 → 공동체 살아남, 쉬운 버그 표시 → 기여자 두 배(사례 그대로라 반만 맞음)","no":"기여자 → 줄어듦(관계절 which had been shrinking에 끌림), 관리자 → 버그 표시함(원인만 있고 결과가 빠짐), 실력 있는 사람 → 공동체 살림(글에 없는 흔한 생각)","ctx":"A volunteer project tends to last only as long as newcomers can find a small, safe first contribution to make."},{"id":"S4-W2","k":4,"dev":"This is nowhere more evident than in ~ (도치 없이)","s":"This is nowhere more evident than in a concert hall, where a full audience, soaking up sound, can make the music echo far less than at an empty rehearsal.","model":"청중 → 소리 흡수해 덜 울림","accept":"꽉 찬 객석 → 소리 덜 울림, 흡수하는 것 → 방 소리 바꿈, 청중 → 소리 빨아들여 울림 바꿈","no":"벽 → 소리 반사(앞 문장의 반쪽만), 콘서트홀 → 음악 연주(화제만), 빈 연습실 → 울림 적음(거꾸로)","ctx":"How a room sounds depends as much on the surfaces that absorb sound as on those that reflect it."},{"id":"S4-W3","k":4,"dev":"One need only look at ~","s":"One need only look at the medieval churches whose walls some nineteenth-century restorers scraped clean, destroying faded paintings, to see how restoration can erase what it is meant to protect.","model":"복원 → 지키려던 것을 지움","accept":"잘못된 복원 → 문화재 망침, 벽 긁어낸 복원 → 옛 그림 없앰(사례 그대로라 반만 맞음)","no":"복원 → 문화재 지킴(protect만 보고 끌림), 중세 교회 → 그림이 바램(faded에 끌림), 19세기 → 교회 고침(결과가 빠짐)"},{"id":"S4-W4","k":4,"dev":"The same holds for ~","s":"The same holds for many plant diseases, which, if left undisturbed, can linger in the soil, waiting for the next planting of a host that rotation would have kept away.","model":"같은 작물 계속 → 병도 쌓임","accept":"돌려짓기 → 병도 막음, 해충처럼 병도 늘어남, 병균 → 땅속에서 오래 버팀(돌려짓기와 이어지지 않아 반만 맞음)","no":"해충 → 늘어남(앞 문장만), 농부 → 작물 돌림(까닭과 결과가 빠짐), 식물 병 → 저절로 사라짐(거꾸로)","ctx":"Growing one crop in the same field every year allows the pests that feed on it to multiply."},{"id":"S5-W1","k":5,"dev":"환유 (the kitchen = 요리사들 같은 꼴)","s":"When the owner hired a celebrity chef who seldom appeared, the kitchen, which had run smoothly for a decade, fell apart within weeks.","model":"자리 비운 주방장 → 주방 팀 무너짐","accept":"주방 사람들 → 몇 주 만에 무너짐, 요리사들 → 손발이 안 맞게 됨, 새 주방장 뒤 → 요리사들 흐트러짐, 주방 → 엉망이 됨(사람인지 장소인지 드러나지 않아 반만 맞음)","no":"주방 → 설비가 망가짐(kitchen을 겉뜻대로 장소로 읽음), 유명 요리사 → 식당을 살림(글과 반대), 주방 → 10년간 잘 돌아감(관계사절 곁가지)"},{"id":"S5-W2","k":5,"dev":"A is a B, not a C (대조 은유)","s":"My grandfather's watch, which has never been accurate, is a letter, not a clock, and I reread it whenever I wind it.","model":"물려받은 시계 → 할아버지 기억을 전함","accept":"시계 → 시간보다 할아버지 추억, 시계 → 태엽 감을 때마다 할아버지 생각, 시계 → 쓰임보다 마음이 소중(무엇을 전하는지가 빠져 반만 맞음)","no":"시계 → 편지 같음(비유 겉말만 옮김), 시계 → 시간이 안 맞음(관계사절 곁가지), 시계 → 고쳐 써야 함(글에 없음)"},{"id":"S5-W3","k":5,"dev":"양 비유 (a mountain of ~ / a flood of ~)","s":"When the retired teacher was hospitalized, a flood of letters arrived from former students whom she had not heard from in decades.","model":"은퇴한 선생님 → 제자들이 잊지 않음","accept":"제자들 → 오래도록 선생님을 기억함, 선생님 → 많은 제자 마음에 남음, 편지가 많이 옴 · 편지 → 홍수처럼 넘침(양만 쓰고 제자들이 잊지 않았다는 속뜻이 빠져 반만 맞음)","no":"선생님 → 병원에 입원함(때를 나타내는 절의 곁가지), 제자들 → 오래 연락 끊음(관계사절만 옮겨 속뜻과 반대)"},{"id":"S5-W4","k":5,"dev":"동물 비유 (a lone wolf · a guinea pig 같은 꼴)","s":"Unable to afford proper testing, the founder made her own family the guinea pigs for her app's first version, which crashed almost daily.","model":"창업자 → 가족을 시험 대상 삼음","accept":"창업자 → 가족에게 먼저 써 보게 함, 가족 → 첫 앱을 시험해 줌, 돈 없어 → 가족으로 시험함, 돈이 없어 제대로 시험 못 함(앞쪽 까닭만 써서 반만 맞음)","no":"가족 → 기니피그를 키움(비유 겉말), 앱 → 날마다 멈춤(관계사절 곁가지), 창업자 → 가족을 아낌(속뜻을 지어냄)"}],"paras":[{"id":"Q1","title":"발표되지 않은 결과","sents":[["Most of us assume that what appears in scientific journals is a fair sample of what researchers have actually found.","반대쪽","학술지 → 연구 전체 대표(통념)"],["In practice, studies reporting striking effects are considerably more likely to be published than those that find no effect, a pattern known as publication bias.","주장","눈에 띄는 결과 → 훨씬 잘 실림"],["A trial suggesting that a new treatment works may appear in a prominent journal within months, whereas an equally rigorous trial showing no benefit is often left unpublished.","예시","효과 있음 → 실림 · 없음 → 묻힘",["근거"]],["Over time, the published record, which readers naturally trust, comes to resemble a highlight reel rather than a complete recording of the game.","근거","기록 → 하이라이트만",["결론"]],["Missing results, in other words, are not a minor gap but a distortion that shapes what doctors and the public come to believe.","결론","빠진 결과 → 믿음을 비틂(핵심)",["주장"]],["Admittedly, journals have limited space, and editors understandably favor findings that readers are likely to notice.","반대쪽","지면 좁음 → 눈에 띌 결과 고름"],["Some fields have responded by asking researchers to register their studies before collecting data, so that a disappointing outcome cannot quietly vanish.","근거","미리 등록 → 사라짐 막기",["예시"]],["Registration does not guarantee publication, yet it at least renders the absence of a result visible.","근거","등록 → 빠진 것이 보임"],["Knowledge built only from successes, however impressive, is knowledge with its failures quietly erased.","결론","성공만 모은 지식 → 실패가 지워짐"]],"line":"학술지에 실린 것이 연구 전체를 대표한다고들 여기지만, 실은 눈에 띄는 결과가 훨씬 잘 실려, 빠진 결과가 우리의 믿음을 비튼다. 미리 등록하게 하면 빠진 것이 보인다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["why journals should publish fewer but more careful studies","how registration ensures that disappointing results get published","why readers should trust only studies that were registered","how unpublished results distort what we come to believe","why striking findings so often turn out to be wrong"],"ans":3,"why":"한 줄의 「빠진 결과가 우리의 믿음을 비튼다」가 정답(how unpublished results distort what we come to believe)과 같아요. 「publish fewer but more careful studies」는 연구 이야기에 흔한 주장이지만, 글은 연구가 서툴다는 게 아니라 똑같이 꼼꼼한 연구도 효과가 없으면 묻힌다(an equally rigorous trial showing no benefit is often left unpublished)는 거예요. 「registration ensures that disappointing results get published」는 (8)의 (Registration does not guarantee publication)과 어긋나요. 등록은 빠진 것을 보이게 할 뿐(renders the absence of a result visible)이에요. 「trust only studies that were registered」는 (7)(8)을 키운 말인데, 글은 등록된 연구만 믿으라고 하지 않아요. 「striking findings so often turn out to be wrong」은 (2)의 striking을 빌린 그럴듯한 말이지만, 글은 눈에 띄는 결과가 틀렸다는 게 아니라 효과 없는 결과가 빠져서 전체 그림이 비틀린다는 거예요.","tip":"핵심 문장 (5)가 글 가운데에 있어요. (5)의 in other words는 앞의 예시와 비유를 한마디로 묶는 신호예요. 끝 문장만 결론이라고 여기면 놓쳐요.","ko":["우리 대부분은 과학 학술지에 실리는 것이 연구자들이 실제로 알아낸 것을 고르게 보여 주는 표본이라고 여긴다.","실제로는 눈에 띄는 효과를 보고하는 연구가 아무 효과도 찾지 못한 연구보다 실릴 가능성이 훨씬 크며, 이런 경향을 출판 편향이라고 한다.","새 치료법이 효과가 있다는 시험은 몇 달 안에 이름난 학술지에 실릴 수 있는 반면, 똑같이 꼼꼼하게 했어도 효과가 없다고 나온 시험은 실리지 못한 채 남는 일이 많다.","시간이 흐르면 독자가 자연스레 믿는 출판된 기록은 경기 전체를 담은 녹화가 아니라 하이라이트 모음처럼 되어 버린다.","다시 말해, 빠진 결과는 작은 빈틈이 아니라 의사와 일반 사람들이 무엇을 믿게 되는지를 좌우하는 비틀림이다.","물론 학술지는 지면이 한정되어 있고, 편집자가 독자의 눈에 띌 만한 결과를 더 좋아하는 것도 이해할 만하다.","어떤 분야는 연구자에게 자료를 모으기 전에 연구를 미리 등록하게 하는 식으로 대응해, 실망스러운 결과가 조용히 사라지지 못하게 했다.","등록한다고 실리는 것이 보장되지는 않지만, 적어도 결과가 빠졌다는 것을 눈에 보이게 해 준다.","성공만으로 쌓은 지식은 아무리 인상적이어도, 실패가 조용히 지워진 지식이다."],"words":[[["assume","당연히 그렇다고 여기다"],["journals","학술지"],["fair","고른, 치우치지 않은"],["sample","표본(전체를 보여 주는 일부)"]],[["In practice","실제로는"],["striking","눈에 띄는, 두드러진"],["considerably","훨씬, 상당히"],["publication bias","출판 편향(눈에 띄는 결과만 잘 실리는 치우침)"]],[["trial","(효과를 알아보는) 시험"],["prominent","이름난, 유명한"],["whereas","~인 반면"],["rigorous","엄격한, 꼼꼼한"]],[["Over time","시간이 흐르면서"],["resemble","~을 닮다"],["highlight reel","(경기의) 하이라이트 모음 영상"],["rather than","~이 아니라, ~보다는"]],[["in other words","다시 말해"],["minor","작은, 사소한"],["distortion","비틀림, 왜곡"],["the public","일반 사람들, 대중"]],[["Admittedly","물론, 인정하건대"],["limited","한정된"],["understandably","이해할 만하게"],["favor","더 좋아하다, 편들다"]],[["fields","분야"],["responded","대응했다"],["register","등록하다"],["vanish","사라지다"]],[["guarantee","보장하다"],["renders","~하게 만들다"],["absence","없음, 빠짐"],["visible","눈에 보이는"]],[["however impressive","아무리 인상적이어도"],["erased","지워진"]]],"rwhy":["Most of us assume(우리 대부분은 ~라고 여긴다)은 남들 생각(통념)이에요. 바로 다음 문장의 In practice(실제로는)가 뒤집으니 반대쪽이에요.","In practice(실제로는)로 (1)의 통념을 뒤집으며 글쓴이가 말하려는 문제를 내놓아요. 그래서 주장이에요.","효과가 있는 시험과 없는 시험이 어떻게 갈리는지 한 장면으로 보여 주니 예시예요. (2)를 받치는 내용이라 근거로 골라도 맞아요.","(2)(3)이 쌓이면 기록 전체가 어떻게 되는지, 하이라이트 비유로 까닭을 보태요. 주장을 받치니 근거예요. 앞을 한데 모으는 말이라 결론으로 골라도 맞아요.","in other words(다시 말해)로 앞의 예시와 비유를 한마디로 묶어요. 글 가운데 있지만 이 글의 핵심을 정리하니 결론이고, not A but B의 B(비틀림)가 글쓴이의 생각이라 주장으로 골라도 맞아요.","Admittedly(물론, 인정하건대)로 학술지 쪽 사정을 잠깐 인정해요(양보). 글쓴이의 주장과 반대쪽이에요.","빠진 결과를 막는 방법을 들어, 이 문제가 실제로 다뤄야 할 문제임을 받쳐요. 그래서 근거예요. 어떤 분야가 실제로 한 일이라 예시로 골라도 맞아요.","(7)의 등록이 무엇을 해 주는지 까닭을 더해요. 빠진 것을 보이게 한다는 것이 앞의 이야기를 받치니 근거예요.","끝에서 「성공만 모은 지식 = 실패가 지워진 지식」으로 글 전체를 다시 정리하니 결론이에요."]},{"id":"Q2","title":"거꾸로 간 해결책","sents":[["In 1935, about a hundred cane toads were brought to northeastern Australia in the hope that they would eat the beetles damaging the sugar cane crops.","예시","두꺼비 들여옴 → 해충 잡기 기대"],["The toads did little to control the beetles and instead spread across the region, poisoning many native animals that tried to eat them.","예시","해충은 못 잡고 → 퍼져 토종 동물 해침"],["The episode is often cited by ecologists, who see it as a warning about interventions designed with only one goal in mind.","주장","두꺼비 일 = 한 목표 개입의 경고"],["A remedy that solves the problem in front of us can create new ones elsewhere, precisely because complex systems respond in ways that no single plan anticipates.","근거","해결책 → 딴 곳에 새 문제",["주장"]],["Antibiotics given routinely to healthy farm animals, for instance, have been linked to the spread of bacteria that the drugs can no longer kill.","예시","가축 항생제 → 내성균"],["Of course, this does not mean that every intervention is doomed or that doing nothing is the safer choice.","반대쪽","개입 → 다 실패는 아님(손 놓기도 답 아님)"],["Many carefully tested programs have worked well, often because their designers monitored side effects from the very beginning.","근거","부작용 살핀 계획 → 성공",["반대쪽"]],["The lesson, then, is not to stop acting but to treat every solution as an experiment whose results must be monitored.","결론","해결책 = 지켜볼 실험(핵심)"],["A plan that cannot be adjusted once its consequences appear has stopped being a solution and become a gamble.","결론","고칠 수 없는 계획 → 도박"]],"line":"한 목표만 보고 들여온 두꺼비는 해충은 못 잡고 토종 동물을 해쳤다. 복잡한 체계는 예상 밖으로 반응하니, 해결책은 결과를 지켜보며 고치는 실험으로 다뤄야 한다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["the danger of relying on nature to solve human problems","why simple solutions work better than complex plans","the need to monitor solutions for unintended effects","the importance of giving each plan a single clear goal","why doing nothing is often safer than intervening"],"ans":2,"why":"한 줄의 「해결책은 결과를 지켜보며 고치는 실험」이 정답(the need to monitor solutions for unintended effects)과 같아요. 「relying on nature to solve human problems」는 두꺼비 사례만 보고 넓힌 말이에요. 글은 가축 항생제(5)까지 들어 자연이 아니라 한 목표만 본 개입을 문제 삼아요. 「simple solutions work better than complex plans」는 (4)의 complex를 빌렸지만, 글이 말한 것은 복잡한 체계가 예상 밖으로 반응한다는 것이지 단순한 해결책이 낫다는 게 아니에요. 「giving each plan a single clear goal」은 거꾸로예요. (3)은 한 목표만 본 개입(interventions designed with only one goal in mind)을 경고했어요. 「doing nothing is often safer」는 글이 스스로 막은 지나친 해석이에요. (6)이 아무것도 안 하는 편이 낫다는 뜻이 아니라고 하고, (8)이 (not to stop acting)이라고 해요.","tip":"글이 사례로 시작하면 (3)처럼 사례를 묶는 문장을 찾아요. (8)의 not A but B에서 B가 핵심이고, (9)는 그것을 비유로 다시 말해요. (3)은 생태학자의 말을 빌렸지만 글쓴이가 받아들이는 생각이라 반대쪽이 아니라 주장이에요.","ko":["1935년, 사탕수수 농작물을 해치던 딱정벌레를 잡아먹으리라는 기대로 수수두꺼비 약 백 마리가 오스트레일리아 북동부로 들여와졌다.","두꺼비는 딱정벌레를 막는 데 거의 도움이 되지 않았고, 오히려 그 지역 곳곳으로 퍼져 자기를 잡아먹으려던 많은 토종 동물을 독으로 해쳤다.","생태학자들은 이 일을 자주 들어 말하는데, 그들은 이것을 오직 한 가지 목표만 염두에 두고 짠 개입에 대한 경고로 본다.","눈앞의 문제를 푸는 해결책이 다른 곳에 새 문제를 만들 수 있는데, 바로 복잡한 체계는 어떤 한 가지 계획도 내다보지 못하는 방식으로 반응하기 때문이다.","예를 들어, 건강한 가축에게 늘 주던 항생제는 그 약으로 더는 죽일 수 없는 세균이 퍼지는 것과 관련이 있다고 밝혀졌다.","물론 이것이 모든 개입이 실패할 수밖에 없다거나 아무것도 하지 않는 것이 더 안전한 선택이라는 뜻은 아니다.","꼼꼼히 시험한 많은 프로그램은 잘 통했는데, 대개 그것을 짠 사람들이 맨 처음부터 부작용을 지켜보았기 때문이다.","그러니 교훈은 손을 놓으라는 것이 아니라, 모든 해결책을 결과를 지켜봐야 하는 실험으로 다루라는 것이다.","결과가 드러난 뒤에도 고칠 수 없는 계획은 더는 해결책이 아니라 도박이 되어 버린 것이다."],"words":[[["cane toads","수수두꺼비(두꺼비의 한 종류)"],["in the hope that","~하기를 바라며"],["beetles","딱정벌레"],["crops","농작물"]],[["did little","(do little to ~) ~하는 데 거의 도움이 안 되다"],["instead","그 대신, 오히려"],["poisoning","독으로 해치는"],["native","토종의, 그 땅에 원래 사는"]],[["cited","(예로) 들어진, 인용된"],["ecologists","생태학자들"],["interventions","개입(문제에 손을 대는 일)"],["in mind","(with ~ in mind) ~을 염두에 두고"]],[["remedy","해결책, 처방"],["precisely","바로, 정확히"],["complex systems","복잡한 체계"],["anticipates","내다보다, 예상하다"]],[["Antibiotics","항생제"],["routinely","늘, 일상적으로"],["linked to","~과 관련된"],["bacteria","세균"]],[["intervention","개입"],["doomed","실패할 수밖에 없는, 망할 운명인"]],[["monitored","지켜보았다, 살폈다"],["side effects","부작용"],["from the very beginning","맨 처음부터"]],[["lesson","교훈"],["treat","(treat A as B) A를 B로 다루다"],["experiment","실험"],["monitored","지켜봐지는"]],[["adjusted","고쳐지는, 조정되는"],["consequences","결과"],["gamble","도박"]]],"rwhy":["1935년 오스트레일리아에서 실제로 있었던 일 하나로 글을 열어요. 사례라 예시예요.","(1)의 두꺼비 사례가 어떻게 끝났는지 이어 보여 줘요. 같은 사례라 예시예요.","앞의 사례를 묶어 「한 목표만 본 개입은 위험하다」는 생각을 내놓아요. 생태학자의 말을 빌렸지만 글쓴이가 받아들이는 생각이라 반대쪽이 아니라 주장이에요.","precisely because(바로 ~ 때문에)로 (3)의 경고가 왜 옳은지 까닭을 대요. 그래서 근거예요. 글쓴이의 일반적인 생각을 밝히는 문장이라 주장으로 골라도 맞아요.","for instance(예를 들어)로 두꺼비 말고 다른 사례 하나를 들어 (4)를 보여 줘요. 그래서 예시예요.","Of course(물론)로 「그렇다고 손을 놓으라는 말이 아니에요」라며 지나친 해석을 막아요. 글쓴이의 경고와 다른 쪽 생각을 짚고 넘어가는 양보라 반대쪽이에요.","부작용을 지켜본 계획은 성공했다는 까닭을 들어, 결과를 지켜보며 고치자는 (8)을 받쳐요. 그래서 근거예요. 개입도 잘될 수 있다는 (6)에 이어지는 말로 읽으면 반대쪽으로 골라도 맞아요.","The lesson, then(그러니 교훈은)으로 앞의 이야기를 정리해요. not A but B에서 B(해결책을 지켜볼 실험으로 다루기)가 이 글의 핵심이라 결론이에요.","「고칠 수 없는 계획 = 도박」이라는 비유로 (8)을 다시 말하며 끝맺으니 결론이에요."]},{"id":"Q3","title":"지도가 심는 생각","sents":[["No flat map can show the round Earth without some distortion, because a curved surface cannot be flattened without stretching.","근거","평면 지도 → 왜곡은 피할 수 없음"],["The Mercator projection, created in the sixteenth century for sailors, preserves the angles that navigators needed but greatly enlarges regions far from the equator.","근거","메르카토르 → 방향은 정확 · 적도에서 먼 곳 부풀림",["예시"]],["On such a map, Greenland appears roughly as large as Africa, although Africa is in fact about fourteen times larger.","예시","그린란드 ≈ 아프리카처럼 보임"],["For navigation, where accurate direction mattered more than accurate size, this trade-off was entirely reasonable.","반대쪽","항해에는 합리적"],["The trouble began when the same map was hung on classroom walls as a general picture of the world.","주장","교실 벽에 걸면서 문제(핵심)"],["Students who grow up with it may come to regard northern countries as larger, and perhaps more important, than they actually are.","근거","학생 → 북쪽 나라를 크게 · 중요하게 봄"],["Some teachers now pair it with equal-area maps, which show sizes accurately at the cost of distorting shapes.","예시","일부 교사 → 넓이 맞는 지도도 함께 걺",["근거"]],["A map is thus never just a picture; it carries the purposes of the people who designed it.","결론","지도 = 만든 이의 목적"],["Choosing a map for a classroom, therefore, means deciding which impressions students will absorb without noticing, not merely settling a technical detail.","결론","지도 고르기 → 무엇을 심을지 결정"]],"line":"평면 지도는 왜곡을 피할 수 없고 항해용 지도는 적도에서 먼 곳을 부풀린다. 항해에는 합리적이었지만, 그 지도를 교실에 걸면 학생이 세상을 비틀어 보게 되니, 지도 고르기는 무엇을 심을지 정하는 일이다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["how equal-area maps give students a fairer view of nations","why flat maps cannot avoid distorting the Earth's surface","how a map made for sailors can shape our view of the world","how sailors' needs slowed the progress of accurate mapmaking","how northern countries used maps to appear more powerful"],"ans":2,"why":"한 줄의 「항해용 지도를 교실에 걸면 학생이 세상을 비틀어 보게 된다」가 정답(how a map made for sailors can shape our view of the world)과 같아요. 「equal-area maps give students a fairer view」는 (7)에 끌린 말인데, 그 지도도 모양을 비틀고(at the cost of distorting shapes), 글에서는 교사들이 함께 쓰는 한 가지 방법으로만 나와요(pair it with equal-area maps). 「flat maps cannot avoid distorting」은 첫 문장 (1)의 사실 설명으로, 글은 여기서 시작할 뿐이고 (5) The trouble began에서 교실 이야기로 방향을 틀어요. 「sailors' needs slowed the progress of accurate mapmaking」은 글에 없는 말이에요. (4)는 오히려 항해에는 그 맞바꿈이 알맞았다고 해요(this trade-off was entirely reasonable). 「northern countries used maps to appear more powerful」은 (6)에 끌린 말이지만, 그 지도는 선원을 위해 만든 것(for sailors)이고 일부러 크게 그렸다는 말은 글에 없어요.","tip":"(4)처럼 짧게 인정하는 문장 바로 뒤의 (5) The trouble began이 방향을 트는 곳이에요. 앞의 (1)~(3)은 사실 설명일 뿐 핵심이 아니에요.","ko":["어떤 평면 지도도 둥근 지구를 조금도 비틀지 않고 보여 줄 수는 없다. 굽은 면은 늘이지 않고는 평평하게 펼 수 없기 때문이다.","16세기에 뱃사람을 위해 만든 메르카토르 도법은 항해사에게 필요했던 각도는 그대로 지키지만 적도에서 먼 지역은 크게 부풀린다.","그런 지도에서는 그린란드가 아프리카와 거의 같은 크기로 보이지만, 실제로 아프리카는 약 열네 배나 더 크다.","정확한 크기보다 정확한 방향이 더 중요했던 항해에는 이렇게 하나를 얻고 하나를 내주는 것이 아주 합리적이었다.","문제는 같은 지도가 세계를 두루 보여 주는 그림으로 교실 벽에 걸리면서 시작되었다.","그 지도를 보며 자란 학생은 북쪽 나라들을 실제보다 더 크게, 그리고 어쩌면 더 중요하게 여기게 될 수도 있다.","이제 어떤 선생님들은 그 지도를 넓이가 맞는 지도와 짝지어 보여 주는데, 이 지도는 모양을 비트는 대신 크기를 정확히 보여 준다.","그러므로 지도는 결코 그저 그림이 아니다. 지도에는 그것을 만든 사람들의 목적이 담겨 있다.","따라서 교실에 걸 지도를 고르는 것은 그저 기술적인 세부 사항을 정하는 일이 아니라, 학생이 알아차리지 못한 채 어떤 인상을 받아들일지를 정하는 일이다."],"words":[[["distortion","비틀림, 왜곡"],["curved","굽은"],["flattened","평평하게 펴진"],["stretching","늘이기"]],[["projection","도법(둥근 지구를 평면에 옮기는 방법)"],["preserves","그대로 지키다"],["enlarges","크게 하다, 부풀리다"],["equator","적도"]],[["roughly","거의, 대략"],["in fact","실제로는"]],[["navigation","항해"],["accurate","정확한"],["mattered","중요했다"],["trade-off","(하나를 얻고 하나를 내주는) 맞바꿈"]],[["trouble","문제, 말썽"],["general","두루 쓰는, 전체적인"]],[["come to","~하게 되다"],["regard","(regard A as B) A를 B로 여기다"],["northern","북쪽의"]],[["pair it with","(pair A with B) A를 B와 짝지어 두다"],["equal-area maps","넓이가 맞는 지도"],["at the cost of","~을 내주는 대신"]],[["thus","그러므로"],["carries","담고 있다, 지니다"],["purposes","목적"]],[["impressions","인상(받는 느낌)"],["absorb","받아들이다, 흡수하다"],["merely","그저, 단지"],["settling","정하는, 결정하는"]]],"rwhy":["지도는 늘 어딘가를 비튼다는 바탕 사실이에요. 뒤의 주장(교실에 건 지도가 생각을 비튼다)을 받치는 출발점이라 근거예요.","비틀림이 실제로 어떻게 나타나는지 메르카토르 지도를 들어 말해요. (1)을 받치니 근거이고, 지도 하나를 든 것이라 예시로 골라도 맞아요.","그린란드와 아프리카라는 눈에 보이는 장면 하나로 (2)의 부풀림을 보여 주니 예시예요.","메르카토르 지도가 항해에는 합리적이었다고 잠깐 인정해요(양보). 바로 뒤 (5)의 The trouble began이 방향을 트니 반대쪽이에요.","The trouble began(문제는 ~에서 시작되었다)으로 (4)의 인정 뒤에 글쓴이가 문제 삼는 것을 내놓아요. 이 글의 핵심이라 주장이에요.","교실에 건 지도가 왜 문제인지, 학생이 세상을 비틀어 보게 된다는 까닭을 대요. (5)를 받치니 근거예요.","Some teachers(어떤 선생님들)가 실제로 하는 일 하나를 보여 주니 예시예요. 지도를 고르는 일이 중요하다는 것을 받치니 근거로 골라도 맞아요.","thus(그러므로)로 앞의 이야기에서 일반적인 생각을 끌어내 정리하니 결론이에요.","therefore(따라서)로 (8)을 교실 이야기에 맞춰 다시 말하며 끝맺어요. 기술적인 세부를 정하는 일(not merely settling a technical detail)이 아니라 무엇을 심을지 정하는 일이라고 정리하니 결론이에요."]},{"id":"Q4","title":"사라지는 언어","sents":[["Some argue that the disappearance of small languages, although regrettable, is a natural and even convenient result of a connected world.","반대쪽","작은 언어 소멸 → 자연스럽다(남들 생각)"],["If everyone shares a few major languages, the reasoning goes, commerce, scientific collaboration and friendship across borders all become easier.","반대쪽","큰 언어 몇 개 → 교류 쉬움"],["Yet a language is not merely a tool for exchanging messages; it also stores knowledge that may exist nowhere else.","주장","언어 = 지식 창고(핵심)"],["Communities that have lived in one place for centuries often have precise vocabulary for local vegetation, weather patterns and seasonal shifts that outsiders never needed to name.","근거","오래 산 공동체 → 자연을 가리키는 정밀한 말",["예시"]],["When the last fluent speakers die, much of that knowledge can vanish with them, since it was seldom documented.","근거","마지막 화자 죽음 → 지식도 사라짐"],["Linguists estimate that a large share of the world's roughly 7,000 languages, some of which have only a few elderly speakers, could fall silent within this century.","근거","언어 다수 → 이번 세기에 소멸 위기"],["Recording and teaching these languages takes time and money, and not every community wants outside help.","반대쪽","기록 → 돈·시간 들고 원치 않는 곳도"],["Even so, where speakers themselves ask for support, documentation projects can preserve at least part of what would otherwise be lost.","근거","원하는 곳 → 기록으로 일부 지킴",["주장"]],["Losing a language, then, is less like retiring an old tool than like closing a library whose books were never copied.","결론","언어 소멸 = 사본 없는 도서관 닫기"]],"line":"작은 언어가 사라지는 것을 자연스럽다고 보는 이도 있지만, 언어는 그곳에만 있는 지식을 담고 있어 사라지면 지식도 사라진다. 원하는 곳에서는 기록으로 일부를 지킬 수 있다. 언어를 잃는 것은 사본 없는 도서관을 닫는 일이다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["how major languages borrow useful words from disappearing ones","the knowledge that is lost when small languages disappear","how learning a second language changes the way we think","why communities need outside help to record their languages","the cultural identity that fades when a language dies"],"ans":1,"why":"한 줄의 「언어는 그곳에만 있는 지식을 담고 있어 사라지면 지식도 사라진다」가 정답(the knowledge that is lost when small languages disappear)과 같아요. 「major languages borrow useful words from disappearing ones」는 그럴듯하지만 글에 없어요. 글에서 그 지식은 다른 곳에 남지 않고 사라져요(can vanish with them). 「learning a second language changes the way we think」는 언어 이야기에 흔한 주장이지만, 글은 외국어를 배우는 사람이 아니라 사라지는 언어를 말해요. 「communities need outside help」는 (7)(8)의 곁가지이고, (7)은 모두가 바깥 도움을 원하지는 않는다(not every community wants outside help)고 했어요. 「the cultural identity that fades」는 언어가 사라질 때 흔히 드는 까닭이지만, 이 글이 드는 것은 정체성이 아니라 그 언어에만 담긴 지식이에요(stores knowledge that may exist nowhere else).","tip":"반대쪽이 두 문장(1)(2)이나 이어져도 (3) Yet에서 방향이 바뀌어요. 뒤의 (7)도 반대쪽이지만, (8) Even so가 다시 주장 쪽으로 돌려놓아요.","ko":["어떤 이들은 작은 언어가 사라지는 것은 안타깝기는 해도 서로 이어진 세상에서 자연스럽고 심지어 편리하기까지 한 결과라고 주장한다.","그들의 논리에 따르면, 모두가 몇몇 큰 언어를 함께 쓰면 무역도, 과학 협력도, 국경을 넘는 우정도 모두 쉬워진다.","하지만 언어는 그저 말을 주고받는 도구가 아니다. 언어는 다른 어디에도 없을지 모르는 지식을 담아 두기도 한다.","한곳에서 수백 년을 살아온 공동체에는 그 지역의 식물, 날씨의 흐름, 계절의 변화를 가리키는 정밀한 낱말이 있는 때가 많은데, 바깥 사람들은 그런 것에 이름을 붙일 필요가 없었다.","그 말을 유창하게 하는 마지막 사람들이 세상을 떠나면, 그 지식의 많은 부분도 함께 사라질 수 있다. 기록된 적이 거의 없기 때문이다.","언어학자들은 세계의 약 7,000개 언어 가운데 많은 부분이 이번 세기 안에 끊길 수 있다고 내다보는데, 그중 몇몇은 말하는 사람이 나이 든 몇 명뿐이다.","이 언어들을 기록하고 가르치는 데는 시간과 돈이 들고, 모든 공동체가 바깥의 도움을 바라는 것도 아니다.","그렇다 해도, 말하는 사람들이 스스로 도움을 청하는 곳에서는 기록 작업이 그냥 두면 잃어버릴 것의 적어도 일부를 지킬 수 있다.","그러니 언어를 잃는 것은 낡은 도구를 내려놓는 일이라기보다, 책을 한 번도 베껴 두지 않은 도서관의 문을 닫는 일에 가깝다."],"words":[[["argue","주장하다"],["disappearance","사라짐"],["regrettable","안타까운"],["convenient","편리한"]],[["the reasoning goes","그들의 논리에 따르면"],["commerce","무역, 상업"],["collaboration","협력"],["borders","국경"]],[["merely","그저, 단지"],["exchanging","주고받는"],["stores","담아 두다, 저장하다"]],[["precise","정밀한, 정확한"],["vegetation","(한 지역의) 식물"],["seasonal shifts","계절의 변화"],["outsiders","바깥 사람들"]],[["fluent","유창한"],["vanish","사라지다"],["seldom","거의 ~ 않다"],["documented","기록된"]],[["Linguists","언어학자들"],["estimate","어림하다, 내다보다"],["share","몫, 부분"],["fall silent","말이 끊기다(사라지다)"]],[["Recording","기록하기"],["not every","모든 ~가 …인 것은 아니다"],["community","공동체"]],[["Even so","그렇다 해도"],["documentation","기록(하는 일)"],["preserve","지키다, 보존하다"],["otherwise","그렇지 않으면, 그냥 두면"]],[["less like","(less like A than like B) A라기보다 B에 가까운"],["retiring","(쓰던 것을) 그만 쓰는, 내려놓는"],["copied","베껴진"]]],"rwhy":["Some argue(어떤 이들은 ~라고 주장한다)는 남들 생각이에요. 글쓴이는 (3)의 Yet에서 이것을 뒤집으니 반대쪽이에요.","the reasoning goes(그들의 논리로는)로 (1)의 남들 생각을 이어서 풀어요. 여전히 글쓴이가 뒤집으려는 쪽이라 반대쪽이에요.","Yet(하지만)으로 (1)(2)를 뒤집고 글쓴이가 하고 싶은 말을 해요. 언어가 지식 창고라는 것이 이 글의 핵심 주장이에요.","언어에 어떤 지식이 담기는지 구체적으로 보여 줘 (3)을 받치니 근거예요. 식물 · 날씨 · 계절이라는 보기를 들었으니 예시로 골라도 맞아요.","언어가 사라지면 지식도 사라진다는 까닭을 대요. (3)이 왜 중요한지 받치니 근거예요.","숫자로 문제가 얼마나 큰지 보여 줘, 지금 이 일을 걱정해야 하는 까닭을 보태요. 주장을 받치니 근거예요.","언어를 지키는 일의 어려움을 잠깐 인정해요(양보). 바로 뒤 (8)의 Even so가 다시 주장 쪽으로 돌리니 반대쪽이에요.","Even so(그렇다 해도)로 (7)을 넘어, 기록으로 일부를 지킬 수 있다는 까닭을 보태요. 그래서 근거예요. 글쓴이가 바라는 쪽을 밝히는 말이라 주장으로 골라도 맞아요.","then(그러니)으로 끝에서 「언어 = 사본 없는 도서관」이라는 비유로 (3)을 다시 말해요. 그래서 결론이에요."]},{"id":"Q5","title":"조용한 전기차","sents":[["When electric cars first appeared on city streets, their near silence was widely celebrated as a welcome relief from the constant roar of engines.","반대쪽","전기차 조용함 → 반가움(남들 생각)"],["Noise, after all, is usually treated as a form of pollution, something that engineers are expected to reduce wherever they can.","반대쪽","소음 = 공해 → 줄일 것",["근거"]],["Yet pedestrians, it turned out, had been relying on that noise all along, using the sound of an approaching engine to judge when it was safe to cross.","근거","보행자 → 엔진 소리로 건널 때 가늠"],["Some studies have suggested that quiet vehicles are more likely than conventional ones to strike pedestrians at low speeds, particularly in parking lots.","근거","조용한 차 → 느릴 때 보행자 더 침",["예시"]],["Blind pedestrians, who depend on hearing far more than sighted people do, reported being startled by cars they had not heard coming.","예시","시각장애인 → 못 들은 차에 놀람",["근거"]],["In response, regulators in several countries now require electric cars to emit an artificial sound when traveling at low speeds.","예시","규제 → 느릴 때 인공 소리 내기",["근거"]],["The episode illustrates a broader point: a feature that appears to be a mere byproduct of a technology may serve a function that nobody intended or noticed.","주장","부산물처럼 보이는 것 → 아무도 몰랐던 쓸모"],["Because such functions remain invisible until they disappear, removing them can create risks that no one considered at the design stage.","근거","숨은 쓸모 → 없어져야 보임 → 뜻밖 위험",["주장"]],["Before eliminating what looks like waste, then, designers would do well to ask what people may have quietly come to depend on.","결론","없애기 전 → 사람들이 기대던 것 묻기",["주장"]]],"line":"전기차의 조용함은 반가웠지만, 보행자는 엔진 소리로 길 건널 때를 가늠하고 있었다. 부산물처럼 보이는 것에도 아무도 몰랐던 쓸모가 있으니, 없애기 전에 사람들이 무엇에 기대는지 물어야 한다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["pedestrians' reliance on the sound of engines","noise reduction as a goal of modern engineering","simplicity as the safest goal in product design","new safety rules as a response to new technology","hidden uses of features that seem like mere waste"],"ans":4,"why":"한 줄의 「부산물처럼 보이는 것에도 아무도 몰랐던 쓸모가 있다」가 정답(hidden uses of features that seem like mere waste)과 같아요. 「pedestrians' reliance on the sound of engines」는 (3)의 Yet 뒤에 끌린 말인데, 보행자 이야기는 (7)의 더 넓은 요점(a broader point)을 받치는 근거예요. 「noise reduction as a goal of modern engineering」는 (2)의 남들 생각인데, 글쓴이는 쓸데없어 보이는 것을 없애기 전에 먼저 따져 보라고 해요(Before eliminating what looks like waste). 「simplicity as the safest goal in product design」는 설계에 대한 일반 원리라 그럴듯하지만 글에 없어요. 글은 단순하게 만들자는 것이 아니라 없애기 전에 숨은 쓸모를 따져 보라고 해요(ask what people may have quietly come to depend on). 「new safety rules as a response to new technology」는 사례 (6)을 키운 말인데, (7)이 이 사례를 묶어 말하는 것은 규칙이 아니라 아무도 몰랐던 쓸모예요(a function that nobody intended or noticed).","tip":"(3)의 Yet 뒤가 주장처럼 보이지만 새로 드러난 사실(근거)이에요. (4)~(6)이 그것을 받치고, 주장은 일곱째 문장 (7)의 콜론(:) 뒤에서 일반 원리로 나와요. 사례가 길게 이어지면 그것을 묶는 문장을 찾아요.","ko":["전기차가 처음 도시 거리에 나타났을 때, 거의 소리가 없다는 점은 끊임없는 엔진 소음에서 벗어나게 해 주는 반가운 일로 널리 환영받았다.","어쨌든 소음은 흔히 공해의 하나, 곧 기술자가 줄일 수 있는 곳에서는 어디서든 줄여야 하는 것으로 여겨진다.","그런데 알고 보니 보행자들은 줄곧 그 소음에 기대고 있었다. 다가오는 엔진 소리로 언제 길을 건너도 안전한지 가늠했던 것이다.","몇몇 연구는 조용한 차가 보통 차보다 느린 속도에서 보행자를 칠 가능성이 더 크며, 특히 주차장에서 그렇다는 점을 보여 주었다.","앞을 보는 사람보다 훨씬 더 소리에 기대는 시각장애인 보행자들은 다가오는 소리를 못 들은 차에 깜짝 놀랐다고 전했다.","이에 따라 여러 나라의 규제 당국은 이제 전기차가 느린 속도로 달릴 때 인공 소리를 내도록 정해 두고 있다.","이 일은 더 넓은 요점을 보여 준다. 어떤 기술의 단순한 부산물처럼 보이는 특징이 아무도 의도하거나 알아채지 못한 쓸모를 지니고 있을 수 있다는 것이다.","그런 쓸모는 사라지기 전까지는 눈에 보이지 않기 때문에, 그것을 없애면 설계 단계에서 아무도 생각하지 못한 위험이 생길 수 있다.","그러니 설계자는 쓸데없어 보이는 것을 없애기 전에, 사람들이 모르는 사이에 무엇에 기대게 되었는지 묻는 것이 좋다."],"words":[[["near silence","거의 소리 없음"],["celebrated","환영받은, 반겨진"],["relief","(괴로움에서) 벗어남, 안도"],["roar","굉음, 으르렁거리는 소리"]],[["after all","어쨌든, 결국"],["pollution","공해, 오염"],["engineers","기술자"],["wherever","~하는 곳이면 어디든"]],[["pedestrians","보행자"],["it turned out","알고 보니"],["relying on","~에 기대는"],["all along","처음부터 줄곧"]],[["conventional","기존의, 보통의"],["strike","치다, 부딪치다"],["particularly","특히"]],[["Blind","앞을 못 보는"],["sighted","앞을 보는"],["startled","깜짝 놀란"],["heard coming","다가오는 소리를 들은"]],[["In response","이에 따라, 그에 대응하여"],["regulators","규제 당국"],["emit","(소리 · 빛을) 내다"],["artificial","인공의, 꾸며 낸"]],[["illustrates","(예로) 보여 주다"],["byproduct","부산물(덤으로 생기는 것)"],["serve a function","어떤 구실을 하다"],["intended","의도했다"]],[["invisible","눈에 보이지 않는"],["removing","없애는 것"],["considered","고려했다, 생각했다"],["design stage","설계 단계"]],[["eliminating","없애는 것, 제거하는 것"],["would do well to","~하는 것이 좋다"],["come to depend on","~에 기대게 되다"]]],"rwhy":["전기차가 조용한 것은 좋은 일이라는, 처음에 사람들이 널리 받아들인 생각이에요(widely celebrated). (3)의 Yet에서 흔들리니 반대쪽이에요.","after all(어쨌든)로 (1)의 생각이 왜 당연해 보였는지 까닭을 보태요. 글쓴이가 뒤집으려는 쪽의 이야기라 반대쪽이에요. 그쪽 생각을 받치는 까닭이라 근거로 골라도 맞아요.","Yet(그런데) 뒤에 나오지만 글쓴이의 결론이 아니라 새로 드러난 사실(보행자가 엔진 소리에 기댔다)이에요. (1)(2)의 생각을 흔들고 (7)의 주장을 받치니 근거예요.","Some studies(몇몇 연구)의 결과로 (3)을 받쳐요. 자료로 까닭을 대니 근거예요. 연구 하나를 사례로 든 문장으로 읽으면 예시로 골라도 맞아요.","시각장애인 보행자라는 구체적인 사람들의 경험으로 (3)을 보여 줘요. 그래서 예시예요. 조용한 차가 위험하다는 것을 받치니 근거로 골라도 맞아요.","In response(이에 따라)로 여러 나라가 실제로 내놓은 대책 하나를 보여 줘요. 사례라 예시예요. 소리가 정말 필요했다는 것을 받치니 근거로 골라도 맞아요.","The episode illustrates a broader point(이 일은 더 넓은 요점을 보여 준다)로 앞의 전기차 이야기를 묶어 글쓴이의 생각을 밝혀요. 일곱째 문장에야 나오지만 이것이 주장이에요.","(7)의 원리에서 한 걸음 나아가, 그런 쓸모를 없애면 뜻밖의 위험이 생긴다는 까닭을 대어 (9)의 당부를 받쳐요. 그래서 근거예요. (7)의 일반 원리를 이어 말하는 문장으로 읽으면 주장으로 골라도 맞아요.","then(그러니)으로 앞의 이야기에서 설계자가 할 일을 끌어내며 글을 맺어요. 그래서 결론이에요. 설계자에게 바라는 글쓴이의 생각이라 주장으로 골라도 맞아요."]},{"id":"Q6","title":"심은 나무, 남은 숲","sents":[["Tree-planting campaigns are usually judged by how many seedlings go into the ground, a figure that may reveal surprisingly little about whether a forest will ever grow.","주장","심은 그루 수 → 숲이 될지 거의 못 알려 줌"],["The appeal of such counts is easy to understand, since a single large number is simple to report and satisfying for donors to see.","반대쪽","그루 수 → 알리기 쉽고 후원자 흐뭇"],["What a count leaves out, however, is survival: seedlings planted in the wrong season or in unsuitable soil frequently die within a few years.","근거","그루 수에 빠진 것 → 살아남는지"],["In some widely publicized campaigns, follow-up surveys found that many of the young trees had not survived their first dry season.","예시","몇몇 운동 → 첫 건기에 많이 죽음",["근거"]],["A count also treats every tree as equal, ignoring whether the species planted actually belongs in the local ecosystem.","근거","그루 수 → 나무 종이 맞는지 무시"],["Rows of a single fast-growing species, for instance, may add to the total while providing little shelter or food for native wildlife.","예시","한 종 줄 심기 → 수는 늘어도 동물엔 별 도움 없음",["근거"]],["None of this implies that planting is pointless, and many carefully managed projects have restored degraded land over time.","반대쪽","심기가 쓸모없음 X → 잘 관리하면 땅 되살림"],["Tellingly, the records of such projects typically measure how much forest remains standing years later rather than how many seedlings were planted.","근거","잘된 사업 → 남은 숲을 잼",["예시"]],["A campaign deserves praise, in other words, not for the trees it plants but for the forest it leaves behind.","결론","칭찬할 것 = 심은 나무 아닌 남은 숲",["주장"]]],"line":"나무 심기는 심은 그루 수로 평가받지만, 그 수는 살아남는지도 생태계에 맞는지도 알려 주지 않는다. 칭찬할 것은 심은 나무가 아니라 남은 숲이다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["trees still standing years later as the real test","planting fewer trees as the path to larger forests","native species as the key to restoring damaged forests","trees' role in fighting climate change","honest reporting as a duty to donors"],"ans":0,"why":"한 줄의 「칭찬할 것은 심은 나무가 아니라 남은 숲이다」가 정답(trees still standing years later as the real test)과 같아요. 「planting fewer trees as the path to larger forests」는 그럴듯한 반전처럼 들리지만 글에 없어요. 글은 덜 심자는 것이 아니라 살아남는지로 평가하자는 것이고, (7)에서 나무 심기가 쓸모없다는 뜻은 아니라고(None of this implies that planting is pointless) 해요. 「native species as the key to restoring damaged forests」는 (5)(6)의 나무 종 이야기만 키운 말이에요. 그루 수의 약점 하나일 뿐이고, (9)는 남긴 숲(the forest it leaves behind)을 말해요. 「trees' role in fighting climate change」는 나무 심기 하면 떠오르는 흔한 말이지만 글에 없어요. 「honest reporting as a duty to donors」는 (2)의 donors에 끌린 말인데, 글은 후원자에게 정직하라는 것이 아니라 무엇으로 평가할지를 말해요(judged by how many seedlings go into the ground).","tip":"이 글은 첫 문장이 바로 주장이에요. (2)는 그루 수를 쓰는 까닭을 인정하는 반대쪽, (3)의 however 뒤는 주장을 받치는 근거예요. (7)은 지나친 해석을 막는 반대쪽이고, (9)가 (1)을 다시 말해요.","ko":["나무 심기 운동은 대개 땅에 심은 묘목의 수로 평가받는데, 이 숫자는 숲이 정말 자라날지에 대해서는 놀랄 만큼 알려 주는 것이 적을 수 있다.","그런 그루 수가 끌리는 까닭은 이해하기 쉽다. 큰 숫자 하나는 알리기 간단하고 후원자가 보기에도 흐뭇하기 때문이다.","그러나 그루 수가 빠뜨리는 것은 바로 나무가 살아남느냐이다. 철이 맞지 않을 때나 알맞지 않은 흙에 심은 묘목은 몇 해 안에 죽는 일이 잦다.","널리 알려진 몇몇 운동에서는 나중에 다시 조사해 보니 어린나무 가운데 많은 수가 첫 건기를 넘기지 못한 것으로 드러났다.","그루 수는 또 모든 나무를 똑같이 치고, 심은 나무의 종이 실제로 그 지역 생태계에 맞는지는 무시한다.","예를 들어 빨리 자라는 한 종만 줄지어 심으면, 전체 수는 늘어도 토종 야생 동물에게는 쉴 곳도 먹이도 거의 주지 못할 수 있다.","그렇다고 나무 심기가 쓸모없다는 뜻은 아니며, 꼼꼼히 관리한 많은 사업은 시간이 지나며 망가진 땅을 되살려 냈다.","눈여겨볼 점은, 그런 사업의 기록이 대개 묘목을 몇 그루 심었는지가 아니라 몇 해 뒤 숲이 얼마나 남아 있는지를 잰다는 것이다.","다시 말해 나무 심기 운동이 칭찬받을 까닭은 심은 나무가 아니라 남긴 숲에 있다."],"words":[[["campaigns","(사회) 운동, 캠페인"],["seedlings","묘목, 어린나무"],["figure","숫자, 수치"],["reveal","드러내다, 알려 주다"]],[["appeal","끌리는 점, 매력"],["counts","센 수"],["satisfying","흐뭇한, 만족스러운"],["donors","후원자, 기부자"]],[["leaves out","빠뜨리다"],["survival","살아남음, 생존"],["unsuitable","알맞지 않은"],["frequently","자주"]],[["publicized","널리 알려진, 홍보된"],["follow-up surveys","뒤따른 조사, 추적 조사"],["dry season","건기(비가 적은 철)"]],[["treats","(treat A as B) A를 B로 다루다"],["ignoring","무시하면서"],["species","종(생물의 종류)"],["ecosystem","생태계"]],[["for instance","예를 들어"],["add to the total","전체 수를 늘리다"],["shelter","쉴 곳, 피할 곳"],["native wildlife","토종 야생 동물"]],[["implies","뜻하다, 암시하다"],["pointless","쓸모없는"],["restored","되살렸다, 복원했다"],["degraded","망가진, 황폐해진"]],[["Tellingly","눈여겨볼 만하게도"],["typically","대개, 보통"],["remains standing","(쓰러지지 않고) 남아 있다"],["rather than","~이 아니라, ~보다는"]],[["deserves praise","칭찬받을 만하다"],["in other words","다시 말해"],["leaves behind","남기다"]]],"rwhy":["앞쪽은 흔한 평가 방식(심은 그루 수)이지만, a figure that ~ 뒤에서 글쓴이의 판단(그 수로는 숲이 될지 알 수 없다)을 첫 문장부터 밝혀요. 뒤 문장들이 이것을 받치거나 따지니 주장이에요.","그루 수를 쓰는 쪽의 까닭을 잠깐 인정해요(양보). 글쓴이가 넘으려는 쪽의 생각이라 반대쪽이에요.","however(그러나)로 (2)를 넘어 그루 수의 약점을 대요. (1)이 왜 옳은지 까닭이라 근거예요.","In some widely publicized campaigns(널리 알려진 몇몇 운동에서)로 실제로 있었던 일을 들어 (3)을 보여 줘요. 그래서 예시예요. 그루 수가 살아남음을 말해 주지 않는다는 것을 받치니 근거로 골라도 맞아요.","also(또)로 그루 수의 약점을 하나 더 보태 (1)을 받치니 근거예요.","for instance(예를 들어)로 (5)를 장면 하나로 보여 줘요. 그래서 예시예요. 그루 수가 생태계를 놓친다는 것을 받치니 근거로 골라도 맞아요.","None of this implies(그렇다고 ~라는 뜻은 아니에요)로 지나친 해석(나무 심기는 소용없다)을 막아요. 글쓴이의 비판과 다른 쪽 생각을 짚고 넘어가니 반대쪽이에요.","Tellingly(눈여겨볼 점은)로 (7)의 잘된 사업도 그루 수가 아니라 남은 숲을 잰다는 점을 짚어 (1)을 받쳐요. 그래서 근거예요. 잘된 사업들의 기록을 사례로 든 문장으로 읽으면 예시로 골라도 맞아요.","in other words(다시 말해)로 (1)을 「심은 나무가 아니라 남긴 숲」이라는 말로 다시 하며 끝맺어요. 그래서 결론이에요. 글쓴이의 생각을 다시 밝히는 문장이라 주장으로 골라도 맞아요."]},{"id":"Q7","title":"궁전보다 쓰레기 더미","sents":[["An inscription on one ancient royal tomb boasts of victories that, according to other surviving records, were minor or may never have occurred.","예시","왕릉 새긴 글 → 승리 부풀림",["근거"]],["Visitors to ancient sites nonetheless tend to treat such monuments as the clearest record of how past societies lived.","반대쪽","기념물 → 옛 삶의 가장 분명한 기록(남들 생각)"],["These structures were, after all, built to last, and many survive in a condition that makes them easy to study and photograph.","반대쪽","기념물 → 오래가고 연구 쉬움",["근거"]],["Yet monuments were usually commissioned by a small elite, and they preserve mainly what rulers wished later generations to believe about them.","근거","기념물 → 지배층이 남기고 싶은 것"],["A heap of discarded shells and broken pots, by contrast, was never intended to impress anyone, and so it has little reason to exaggerate.","근거","버린 조개·깨진 그릇 더미 → 꾸밈 없음",["예시"]],["From such trash, archaeologists can infer what ordinary households ate, which tools they repaired, and even which illnesses were common among them.","근거","쓰레기 → 보통 집의 음식·연장·병",["예시"]],["Admittedly, such remains are fragmentary and difficult to interpret, since what people threw away is only a part of what they used.","반대쪽","쓰레기 → 조각나 해석 어려움"],["Even so, for anyone hoping to understand how most people actually lived, a trash heap may be a more reliable witness than a palace.","주장","보통 사람 삶 → 쓰레기 더미가 궁전보다 믿을 만함"],["Read with care, the leftovers of daily life can correct the flattering story that monuments were designed to tell.","결론","일상 찌꺼기 → 기념물의 꾸민 이야기 바로잡음",["주장"]]],"line":"사람들은 기념물을 옛 삶의 가장 분명한 기록으로 여기지만, 기념물은 지배층이 남기고 싶은 것을 담았다. 꾸밈없는 쓰레기 더미가 보통 사람의 삶을 더 믿을 만하게 보여 준다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["folk tales as a truer record than royal monuments","rulers' power to shape historical memory","archaeology as a science of patient interpretation","everyday leftovers as a truer picture of ordinary lives","protecting ancient sites for future generations"],"ans":3,"why":"한 줄의 「꾸밈없는 쓰레기 더미가 보통 사람의 삶을 더 믿을 만하게 보여 준다」가 정답(everyday leftovers as a truer picture of ordinary lives)과 같아요. 「folk tales as a truer record than royal monuments」는 기념물을 의심하는 점은 글과 같지만, 글이 더 믿는 것은 옛이야기가 아니라 버려진 쓰레기예요(A heap of discarded shells and broken pots). 「rulers' power to shape historical memory」는 (4)의 Yet 뒤에 끌린 말인데, (4)는 기념물을 믿기 어려운 까닭(근거)일 뿐이에요. 「archaeology as a science of patient interpretation」는 양보 (7)의 해석이 어렵다는 말에 끌린 그럴듯한 말인데, (8)의 Even so가 넘어요. 「protecting ancient sites for future generations」는 유적 하면 떠오르는 흔한 말이지만 글에 없어요.","tip":"사례 (1)로 시작해 남들 생각 (2)(3)을 내놓는 글이에요. (4)의 Yet 뒤는 주장이 아니라 그 생각을 뒤집는 근거이고, 주장은 양보 (7)을 넘는 (8)의 Even so에서야 나와요. Yet 뒤가 늘 주장은 아니에요.","ko":["옛 왕의 무덤 하나에 새겨진 글은 승리를 자랑하는데, 다른 남아 있는 기록에 따르면 그 승리는 하찮았거나 아예 없었을지도 모른다.","그런데도 옛 유적을 찾는 사람들은 그런 기념물을 지난 사회가 어떻게 살았는지 보여 주는 가장 분명한 기록으로 여기는 경향이 있다.","어쨌든 이런 건축물은 오래가도록 지어졌고, 많은 수가 연구하고 사진 찍기 쉬운 상태로 남아 있다.","하지만 기념물은 대개 소수의 지배층이 지으라고 시킨 것이어서, 주로 지배자들이 뒷세대가 자기들에 대해 믿어 주기를 바란 것을 담고 있다.","그와 달리 버려진 조개껍데기와 깨진 그릇 더미는 누구에게 잘 보이려고 만든 것이 아니어서 부풀릴 까닭이 거의 없다.","그런 쓰레기에서 고고학자는 보통 집안이 무엇을 먹었는지, 어떤 연장을 고쳐 썼는지, 심지어 어떤 병이 흔했는지까지 미루어 알 수 있다.","물론 그런 유물은 조각나 있어 해석하기 어렵다. 사람들이 버린 것은 그들이 쓴 것의 일부일 뿐이기 때문이다.","그렇다 해도 대부분의 사람이 실제로 어떻게 살았는지 알고 싶은 이에게는 쓰레기 더미가 궁전보다 더 믿을 만한 증인일 수 있다.","조심스럽게 읽으면, 일상생활의 찌꺼기는 기념물이 들려주도록 지어진, 듣기 좋게 꾸민 이야기를 바로잡을 수 있다."],"words":[[["inscription","새긴 글, 비문"],["tomb","무덤"],["boasts of","~을 자랑하다"],["occurred","일어났다"]],[["nonetheless","그런데도"],["tend to","~하는 경향이 있다"],["monuments","기념물(무덤 · 궁전 · 신전 같은 큰 건축물)"],["societies","사회"]],[["structures","건축물, 구조물"],["built to last","오래가도록 지어진"],["condition","상태"]],[["commissioned","(일을) 맡겨 만들게 한"],["elite","소수의 지배층, 엘리트"],["preserve","간직하다, 보존하다"],["generations","세대"]],[["heap","더미"],["discarded","버려진"],["by contrast","그와 달리"],["exaggerate","부풀리다, 과장하다"]],[["trash","쓰레기"],["archaeologists","고고학자"],["infer","추론하다, 미루어 알다"],["households","가정, 집안"]],[["Admittedly","물론, 인정하건대"],["remains","남은 것, 유물"],["fragmentary","조각난, 단편적인"],["interpret","해석하다"]],[["Even so","그렇다 해도"],["reliable","믿을 만한"],["witness","증인"],["palace","궁전"]],[["Read with care","조심스럽게 읽으면"],["leftovers","남은 것, 찌꺼기"],["correct","바로잡다"],["flattering","듣기 좋게 꾸민, 치켜세우는"]]],"rwhy":["옛 왕의 무덤에 새긴 글 하나라는 구체적인 사례로 글을 열어요. 그래서 예시예요. 기념물이 사실을 꾸민다는 (4)를 받치는 사례로 읽으면 근거로 골라도 맞아요.","많은 사람의 생각(기념물이 가장 분명한 기록이다)이에요. 글쓴이가 뒤에서 뒤집으려는 생각이라 반대쪽이에요.","after all(어쨌든)로 (2)의 생각이 왜 그럴듯한지 까닭을 보태요. 글쓴이가 넘으려는 쪽의 이야기라 반대쪽이에요. 그쪽 생각을 받치는 까닭이라 근거로 골라도 맞아요.","Yet(하지만) 뒤에 나오지만 글쓴이의 주장이 아니라 (2)(3)의 생각이 왜 틀렸는지 까닭이에요. 기념물은 지배층의 바람을 담았다는 것이라 근거예요.","by contrast(그와 달리)로 기념물과 맞서는 쓰레기 더미는 누구에게 잘 보이려고 만든 것이 아니라 부풀릴 까닭이 없다고 해요. 쓰레기가 더 믿을 만하다는 (8)을 받치는 까닭이라 근거예요. 조개껍데기 · 깨진 그릇이라는 눈에 보이는 사례로 읽으면 예시로 골라도 맞아요.","쓰레기에서 무엇을 알 수 있는지 대어 쓰레기 더미가 더 믿을 만하다는 (8)을 받쳐요. 그래서 근거예요. 먹은 것 · 연장 · 병을 늘어놓은 문장으로 읽으면 예시로 골라도 맞아요.","Admittedly(물론)로 쓰레기 더미의 약점을 잠깐 인정해요(양보). 바로 다음 (8)의 Even so가 이것을 넘으니 반대쪽이에요.","Even so(그렇다 해도)로 (7)의 약점을 넘어 글쓴이가 정말 하고 싶은 말을 해요. 여덟째 문장에야 나오지만 이것이 주장이에요.","앞의 이야기를 「일상의 찌꺼기가 기념물의 꾸민 이야기를 바로잡는다」로 정리하며 끝맺어요. 그래서 결론이에요. 글쓴이의 생각을 다시 밝히는 문장이라 주장으로 골라도 맞아요."]},{"id":"Q8","title":"새를 세는 사람들","sents":[["Every winter, tens of thousands of volunteers across North America count the birds they see on a single day and submit their tallies to a shared database.","예시","수천 자원봉사자 → 하루 본 새 세어 올림"],["For decades, many professional ecologists regarded such amateur records with suspicion, doubting that untrained observers could identify species reliably.","반대쪽","전문가 → 아마추어 기록 의심"],["Their concern was not unfounded, since beginners do confuse similar species and tend to report rare birds they hope to see.","반대쪽","초보 → 비슷한 종 헷갈림·희귀종 적음",["근거"]],["However, errors of this kind can be estimated and corrected statistically, provided that the data are collected in a consistent way.","근거","이런 실수 → 통계로 바로잡을 수 있음"],["What volunteers offer in return is coverage that no research team could afford, with observations spread across thousands of locations and many decades.","근거","자원봉사자 → 연구팀이 못 할 넓이·긴 세월"],["Amateur data, when gathered under clear and consistent rules, can therefore answer questions that professional studies alone are too small to address.","주장","규칙 지킨 아마추어 자료 → 전문 연구가 못 푸는 물음 풂"],["Shifts in the winter ranges of many bird species, for example, have been documented largely through such long-running volunteer counts.","예시","새 겨울 서식지 이동 → 자원봉사자 기록으로 처음 앎",["근거"]],["This is not to say that experts are unnecessary, for someone must still design the counting rules and check the results.","반대쪽","전문가 필요 없음 X → 규칙 짜고 확인할 사람"],["The value of citizen science lies less in the precision of any single report than in the size and length of the record as a whole.","결론","시민 과학 가치 → 하나의 정확성보다 전체의 크기·길이",["주장"]]],"line":"전문가는 아마추어 새 기록을 의심했지만, 그 실수는 통계로 바로잡을 수 있고 그 넓이와 세월은 어떤 연구팀도 못 따라간다. 규칙을 지켜 모은 시민 과학 자료는 전문 연구가 못 푸는 물음에 답한다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["statistical tools as a fix for errors by human observers","volunteer counts as data experts alone cannot gather","expert training as the foundation of reliable bird data","public participation as a way to build trust in science","climate change as a growing threat to bird habitats"],"ans":1,"why":"한 줄의 「규칙을 지켜 모은 시민 과학 자료는 전문 연구가 못 푸는 물음에 답한다」가 정답(volunteer counts as data experts alone cannot gather)과 같아요. 「statistical tools as a fix for errors by human observers」는 (4)의 However 뒤에 끌린 말인데, (4)는 (6)을 받치는 근거 하나예요. 「expert training as the foundation of reliable bird data」는 (2)(3)의 의심 쪽 말인데, (4)의 However가 넘고 (8)도 전문가는 규칙을 짜고 확인하는 몫이라고 해요(design the counting rules and check the results). 「public participation as a way to build trust in science」는 시민 과학 하면 떠오르는 말이지만 글에 없어요. 글은 믿음이 아니라 자료의 크기와 길이를 말해요(the size and length of the record as a whole). 「climate change as a growing threat to bird habitats」는 (7)의 겨울 서식 범위에 끌린 말인데, 그것은 자원봉사자 기록으로 밝혀진 사례 하나이고 글에 기후 이야기는 없어요.","tip":"사례 (1)로 시작해 전문가의 의심 (2)와 그 의심이 옳은 면 (3)을 인정한 뒤, (4)의 However로 넘어가요. However 뒤는 근거이고 주장은 (6)의 therefore에서 나와요. (8)은 지나친 해석을 막는 반대쪽이에요.","ko":["겨울마다 북아메리카 곳곳의 자원봉사자 수만 명이 하루 동안 본 새를 세어, 센 수를 함께 쓰는 자료 모음에 올린다.","수십 년 동안 많은 전문 생태학자는 이런 아마추어 기록을 의심스럽게 보며, 훈련받지 않은 관찰자가 종을 믿을 만하게 알아볼 수 있을지 미심쩍어했다.","그 걱정은 근거 없는 것이 아니었다. 초보자는 실제로 비슷한 종을 헷갈리고, 보고 싶은 희귀한 새를 보았다고 적는 경향이 있기 때문이다.","그러나 이런 종류의 실수는 자료를 한결같은 방식으로 모으기만 하면 통계로 어림하고 바로잡을 수 있다.","그 대신 자원봉사자가 주는 것은 어떤 연구팀도 감당할 수 없는 넓은 범위로, 관찰이 수천 곳, 수십 년에 걸쳐 있다.","그러므로 아마추어 자료는 분명하고 한결같은 규칙 아래 모으면, 전문 연구만으로는 규모가 너무 작아 다룰 수 없는 물음에 답할 수 있다.","예를 들어 많은 새 종의 겨울 서식 범위가 옮겨 간 것은 주로 이렇게 오래 이어진 자원봉사자들의 세기를 통해 밝혀졌다.","그렇다고 전문가가 필요 없다는 말은 아니다. 누군가는 여전히 세는 규칙을 짜고 결과를 확인해야 하기 때문이다.","시민 과학의 가치는 보고 하나하나의 정확함보다 기록 전체의 크기와 길이에 있다."],"words":[[["volunteers","자원봉사자"],["submit","내다, 제출하다"],["tallies","센 수, 집계"],["database","자료 모음, 데이터베이스"]],[["regarded","(regard A with B) A를 B의 눈으로 보았다"],["suspicion","의심"],["untrained","훈련받지 않은"],["reliably","믿을 만하게"]],[["not unfounded","근거 없지 않은, 일리 있는"],["confuse","헷갈리다, 혼동하다"],["rare","드문, 희귀한"]],[["estimated","어림된, 추정된"],["statistically","통계로"],["provided that","~하기만 하면"],["consistent","한결같은, 일관된"]],[["in return","그 대신, 그 보답으로"],["coverage","(다루는) 범위, 넓이"],["afford","(돈 · 힘을) 감당하다"],["observations","관찰(한 것)"]],[["gathered","모인, 모아진"],["therefore","그러므로"],["alone","~만으로는"],["address","다루다"]],[["Shifts","옮겨 감, 변화"],["ranges","(사는) 범위"],["documented","기록되어 밝혀진"],["long-running","오래 이어진"]],[["This is not to say","그렇다고 ~라는 말은 아니다"],["unnecessary","필요 없는"],["design","짜다, 설계하다"]],[["citizen science","시민 과학(일반인이 함께하는 과학 연구)"],["lies less in","(lie less in A than in B) A보다 B에 있다"],["precision","정확함, 정밀함"],["as a whole","전체로서"]]],"rwhy":["겨울마다 새를 세는 자원봉사자들이라는 구체적인 사례로 글을 열어요. 그래서 예시예요.","전문가들이 오래 품어 온 생각(아마추어 기록은 믿기 어렵다)이에요. 글쓴이가 뒤에서 넘으려는 쪽이라 반대쪽이에요.","not unfounded(근거 없지 않다)로 (2)의 걱정이 옳은 면을 인정해요. 글쓴이가 넘으려는 쪽의 이야기라 반대쪽이에요. 그쪽 생각을 받치는 까닭이라 근거로 골라도 맞아요.","However(그러나)로 (2)(3)의 걱정을 넘는 까닭을 대요. 실수는 바로잡을 수 있다는 것이 (6)을 받치니 근거예요.","자원봉사자 자료의 강점(어떤 연구팀도 못 할 넓이와 긴 세월)을 대어 (6)을 받치니 근거예요.","therefore(그러므로)로 앞의 까닭을 모아 글쓴이의 생각을 밝혀요. 여섯째 문장에야 나오지만 이것이 주장이에요.","for example(예를 들어)로 아마추어 자료가 실제로 답한 물음 하나를 보여 줘요. 그래서 예시예요. (6)을 받치니 근거로 골라도 맞아요.","This is not to say(그렇다고 ~라는 말은 아니에요)로 지나친 해석(전문가는 필요 없다)을 막아요. 글쓴이의 생각과 다른 쪽 생각을 짚고 넘어가니 반대쪽이에요.","시민 과학의 가치가 어디에 있는지 정리하며 끝맺어요. (6)을 다른 말로 다시 하니 결론이에요. 글쓴이의 생각을 다시 밝히는 문장이라 주장으로 골라도 맞아요."]},{"id":"Q9","title":"너무 많은 경보","sents":[["It seems only sensible for a hospital to set its monitors to sound an alarm whenever a patient's heart rate or oxygen level moves even slightly outside a safe range.","반대쪽","조금만 벗어나도 경보(당연해 보임)"],["On a single ward, however, such settings can produce hundreds of alarms a day, most of which, studies suggest, call for no action at all.","예시","한 병동 → 하루 수백 번, 대부분 할 일 없음",["근거"]],["Many are triggered not by any danger but by a loose sensor or by a patient who has simply shifted position in bed.","예시","헛경보 → 느슨한 감지기·자세 바꿈",["근거"]],["Nurses exposed to such false warnings again and again tend to respond more slowly over time, a pattern known as alarm fatigue.","근거","헛경보 반복 → 간호사 반응 느려짐(경보 피로)"],["A monitoring system, then, becomes safer not by multiplying its warnings but by reserving them for changes that truly demand attention.","주장","경보 → 늘리기 아닌 꼭 필요한 것만"],["Otherwise, when a genuine emergency finally occurs, its alarm may be lost among the many that staff members have learned to treat as noise.","근거","진짜 위급 → 경보 묻힘"],["Some hospitals that widened their alarm limits slightly and added brief delays have reported far fewer alarms without any rise in missed emergencies.","예시","기준 넓힌 병원 → 경보 줄고 놓친 위급 안 늚",["근거"]],["Setting limits too loosely, of course, carries its own danger, which is why such changes require careful testing before they are adopted.","반대쪽","너무 느슨한 기준 → 그것도 위험(시험 필요)"],["A warning that sounds all the time ends up telling its listeners almost nothing, which defeats the very purpose it was created to serve.","결론","늘 울리는 경보 → 아무것도 못 알림",["주장"]]],"line":"작은 변화마다 경보를 울리면 헛경보가 쌓여 간호사의 반응이 느려진다. 경보는 늘릴 때가 아니라 꼭 필요한 변화에만 남길 때 환자를 더 지킨다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["human judgment as a safer guide than machine alarms","faulty sensors as the main cause of false alarms","fewer, better-chosen alarms as safer patient care","nurse shortages as a growing danger to patient safety","advanced monitoring devices as a safeguard for patients"],"ans":2,"why":"한 줄의 「경보는 늘릴 때가 아니라 꼭 필요한 변화에만 남길 때 환자를 더 지킨다」가 정답(fewer, better-chosen alarms as safer patient care)과 같아요. 「human judgment as a safer guide than machine alarms」는 그럴듯하지만 글에 없어요. 글은 기계를 버리자는 것이 아니라 경보 기준을 손보자고 해요(widened their alarm limits slightly). 「faulty sensors as the main cause of false alarms」는 (3)의 사례에 끌린 말인데, 느슨한 감지기는 헛경보가 울리는 까닭의 예 하나일 뿐이에요. 「nurse shortages as a growing danger to patient safety」는 병원 하면 떠오르는 흔한 말이지만 글에 없어요. 「advanced monitoring devices as a safeguard for patients」도 글에 없어요. 글은 더 좋은 기계가 아니라 경보를 가려 울리자고 해요(reserving them for changes that truly demand attention).","tip":"(2)의 however 뒤가 주장처럼 보이지만 한 병동의 사례예요. (3)의 not ~ but도 주장이 아니라 헛경보가 울리는 까닭을 보여 주는 예시예요. 주장은 다섯째 문장 (5)의 then에서 나와요. 신호 말 뒤가 늘 주장은 아니에요.","ko":["환자의 심장 박동이나 산소 수치가 안전한 범위를 조금이라도 벗어날 때마다 병원이 감시 기계를 경보가 울리도록 맞춰 두는 것은 너무나 당연해 보인다.","그러나 병동 하나에서만도 그런 설정은 하루에 수백 번의 경보를 낼 수 있고, 연구에 따르면 그 대부분은 아무 조치도 필요 없다.","많은 경보는 어떤 위험 때문이 아니라 느슨해진 감지기나, 그저 침대에서 자세를 바꾼 환자 때문에 울린다.","이런 헛경보를 거듭 겪은 간호사는 시간이 지나며 반응이 느려지는 경향이 있는데, 이를 경보 피로라고 부른다.","그러니 감시 체계는 경보를 늘려서가 아니라, 정말 주의가 필요한 변화에만 경보를 아껴 둘 때 더 안전해진다.","그러지 않으면 정말 위급한 일이 마침내 일어났을 때, 그 경보가 직원들이 소음으로 여기게 된 수많은 경보 사이에 묻혀 버릴 수 있다.","경보 기준을 조금 넓히고 잠깐 기다렸다 울리게 한 몇몇 병원은, 놓친 위급 상황이 늘지 않으면서도 경보가 훨씬 줄었다고 전했다.","물론 기준을 너무 느슨하게 잡는 것도 그 나름의 위험이 있으며, 그래서 이렇게 기준을 바꾸려면 먼저 꼼꼼히 시험해 보아야 한다.","늘 울리는 경보는 결국 듣는 사람에게 거의 아무것도 알려 주지 못하며, 이는 그것이 만들어진 바로 그 목적을 무너뜨린다."],"words":[[["sensible","현명한, 당연한"],["monitors","감시 기계, 모니터"],["oxygen level","산소 수치"],["range","범위"]],[["ward","병동"],["settings","설정"],["call for","~을 필요로 하다"]],[["triggered","(경보가) 울리게 된"],["loose","느슨한, 헐거운"],["sensor","감지기, 센서"],["shifted","바꿨다, 옮겼다"]],[["exposed to","~을 겪은, ~에 드러난"],["false","거짓의, 헛된"],["pattern","(되풀이되는) 모습, 패턴"],["fatigue","피로"]],[["multiplying","늘리는 것, 불리는 것"],["reserving","(~을 위해) 남겨 두는 것"],["demand attention","주의를 요구하다"]],[["Otherwise","그러지 않으면"],["genuine","진짜의"],["emergency","위급한 일, 비상"],["staff","직원"]],[["widened","넓혔다"],["limits","한계, 기준"],["delays","늦춤, 기다리는 시간"],["missed","놓친"]],[["loosely","느슨하게"],["of course","물론"],["require","필요로 하다, 요구하다"],["adopted","받아들여진, 채택된"]],[["ends up","결국 ~하게 되다"],["defeats","(목적을) 무너뜨리다, 헛되게 하다"],["purpose","목적"]]],"rwhy":["It seems only sensible(너무나 당연해 보인다)로 누구나 옳다고 여길 생각을 먼저 내놓아요. 글쓴이가 뒤에서 뒤집으려는 생각이라 반대쪽이에요.","however가 있지만 주장이 아니라 On a single ward(병동 하나에서) 벌어지는 일이에요. 사례라 예시예요. 경보가 너무 많다는 것을 받치니 근거로 골라도 맞아요.","not ~ but이 있지만 주장이 아니라, 헛경보가 어떻게 울리는지 느슨한 감지기 · 자세 바꾸기 같은 장면으로 보여 줘요. 그래서 예시예요. 경보 대부분이 쓸데없다는 것을 받치니 근거로 골라도 맞아요.","헛경보가 많으면 왜 문제인지 까닭(간호사의 반응이 느려진다)을 대요. (5)의 주장을 받치니 근거예요.","then(그러니)으로 앞의 이야기를 모아 글쓴이의 생각을 밝혀요. not A but B에서 B(꼭 필요한 변화에만 경보 남기기)가 핵심이라 주장이에요.","Otherwise(그러지 않으면)로 (5)대로 하지 않을 때 생기는 일을 대어 (5)를 받쳐요. 그래서 근거예요.","Some hospitals(몇몇 병원)에서 실제로 해 본 일을 들어요. 사례라 예시예요. 경보를 줄여도 안전하다는 것을 받치니 근거로 골라도 맞아요.","of course(물론)로 경보를 줄이는 쪽의 위험을 잠깐 인정해요(양보). 글쓴이의 주장과 다른 쪽을 짚고 넘어가니 반대쪽이에요.","「늘 울리는 경보는 아무것도 알려 주지 못한다」는 말로 앞의 이야기를 정리하며 끝맺어요. 그래서 결론이에요. 글쓴이의 생각을 다시 밝히는 문장이라 주장으로 골라도 맞아요."]},{"id":"Q10","title":"서로 돕는 숲?","sents":[["In one popular documentary, a towering mother tree is shown passing sugar through underground fungi to the young trees growing in its shade.","예시","다큐 → 어미 나무가 균류로 어린나무에 당분 줌",["반대쪽"]],["Images like this have helped spread the view that forests are cooperative communities in which trees deliberately support one another.","반대쪽","숲 = 나무가 일부러 서로 돕는 공동체(남들 생각)"],["A recent review of field studies on these fungal links, however, concluded that few of them actually showed trees transferring meaningful amounts of resources through the links.","근거","연구 다시 보기 → 의미 있게 옮긴 증거 거의 없음",["예시"]],["The popular picture, it appears, has run well ahead of the evidence that is supposed to support it.","주장","널리 퍼진 그림 → 증거보다 앞서 나감"],["Many of the experiments behind the story were conducted in pots or greenhouses, where conditions differ sharply from those of a mature forest.","근거","실험 → 화분·온실(숲과 다름)"],["In several field studies, the small amounts of carbon that moved between trees could just as well have traveled by other routes, such as leaking from roots into the soil.","예시","숲 연구 → 옮긴 탄소 적고 다른 길일 수도",["근거"]],["None of this suggests that these fungi are unimportant, since they clearly help individual trees take up water and nutrients.","반대쪽","균류 쓸모없음 X → 물·양분 흡수 도움"],["What remains in doubt is the further claim that trees use these networks to care for one another, a claim that would require far stronger evidence.","근거","의심스러운 것 → 서로 돌본다는 주장(증거 더 필요)",["주장"]],["Until such evidence appears, the cooperative forest is better treated as an attractive hypothesis than as an established fact.","결론","서로 돕는 숲 → 사실 아닌 가설",["주장"]]],"line":"다큐멘터리는 나무가 균류로 서로 돕는 숲을 보여 주지만, 연구를 다시 보면 그 증거는 약하다. 서로 돕는 숲은 아직 사실이 아니라 가설로 다뤄야 한다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["trees' secret cooperation beneath the forest floor","weak evidence behind the idea of caring trees","root fungi as helpers in water and nutrient uptake","forests as models of cooperation for human society","documentaries as a powerful way to teach science"],"ans":1,"why":"한 줄의 「서로 돕는 숲은 아직 사실이 아니라 가설로 다뤄야 한다」가 정답(weak evidence behind the idea of caring trees)과 같아요. 「trees' secret cooperation beneath the forest floor」는 (1)(2)의 널리 퍼진 생각을 옮긴 말인데, 글쓴이는 (4)에서 그런 그림이 증거보다 앞서 나갔다고(has run well ahead of the evidence) 해요. 「root fungi as helpers in water and nutrient uptake」는 양보 (7)에서 인정한 사실일 뿐이에요. 「forests as models of cooperation for human society」는 그럴듯한 교훈이지만 글에 없어요. 「documentaries as a powerful way to teach science」는 (1)의 다큐멘터리에 끌린 말인데, 글은 오히려 그런 장면이 증거보다 앞서 나갔다고 해요.","tip":"사례 (1)과 널리 퍼진 생각 (2)로 시작해요. (3)의 however 뒤는 연구 결과(근거)이고, 그것을 묶은 글쓴이의 판단이 (4)예요. (7)의 None of this suggests는 지나친 해석을 막는 반대쪽이고, (9)가 (4)를 다시 말해요.","ko":["한 인기 다큐멘터리에서는 우뚝 솟은 어미 나무가 땅속 균류를 통해 자기 그늘에서 자라는 어린나무들에게 당분을 건네주는 모습이 나온다.","이런 장면은 숲이 나무들이 일부러 서로를 돕는 협력 공동체라는 생각을 퍼뜨리는 데 한몫했다.","그러나 이 균류 연결을 다룬 현장 연구들을 최근에 다시 살펴본 결과, 나무가 이런 연결을 통해 의미 있는 양의 양분을 실제로 옮긴다는 것을 보여 준 연구는 거의 없다는 결론이 나왔다.","널리 퍼진 그림은 그것을 받쳐야 할 증거보다 한참 앞서 나간 것으로 보인다.","그 이야기를 받치는 실험 가운데 많은 수가 화분이나 온실에서 이루어졌는데, 그곳은 다 자란 숲과 조건이 크게 다르다.","숲에서 한 몇몇 연구에서는 나무 사이를 오간 적은 양의 탄소가 뿌리에서 흙으로 새어 나가는 것 같은 다른 길로 옮겨 갔을 수도 있었다.","그렇다고 이 균류가 중요하지 않다는 뜻은 아니다. 균류가 나무 하나하나가 물과 양분을 빨아들이도록 돕는 것은 분명하기 때문이다.","의심스러운 것은 나무가 이 그물망으로 서로를 돌본다는 한 걸음 더 나아간 주장이며, 그런 주장에는 훨씬 더 강한 증거가 필요할 것이다.","그런 증거가 나올 때까지 협력하는 숲은 확립된 사실이라기보다 매력적인 가설로 다루는 편이 낫다."],"words":[[["documentary","다큐멘터리, 기록 영화"],["towering","우뚝 솟은"],["fungi","균류(버섯 · 곰팡이 무리, fungus의 복수)"],["shade","그늘"]],[["helped spread","퍼뜨리는 데 한몫했다"],["cooperative","협력하는"],["communities","공동체"],["deliberately","일부러, 의도적으로"]],[["review","(연구들을) 다시 살펴봄, 검토"],["concluded","결론지었다"],["transferring","옮기는"],["resources","자원, 양분"]],[["it appears","~인 것으로 보인다"],["run well ahead of","~보다 한참 앞서 나가다"],["evidence","증거"],["is supposed to","~하기로 되어 있다"]],[["conducted","(실험 · 조사가) 이루어진"],["greenhouses","온실"],["sharply","크게, 뚜렷하게"],["mature","다 자란"]],[["carbon","탄소"],["could just as well have","~했을 수도 있었다"],["routes","길, 경로"],["leaking","새어 나가는 것"]],[["suggests","뜻하다, 암시하다"],["fungi","균류(버섯 · 곰팡이 무리)"],["take up","빨아들이다"],["nutrients","양분, 영양소"]],[["remains in doubt","여전히 의심스럽다"],["further","한 걸음 더 나아간"],["care for","돌보다"],["require","필요로 하다"]],[["is better treated as","~으로 다루는 편이 낫다"],["attractive","매력적인"],["hypothesis","가설"],["established","확립된, 굳어진"]]],"rwhy":["다큐멘터리 한 장면이라는 구체적인 사례로 글을 열어요. 그래서 예시예요. 글쓴이가 뒤에서 의심하는 이야기를 보여 주니 반대쪽으로 골라도 맞아요.","널리 퍼진 생각(숲은 나무가 서로 돕는 공동체다)을 소개해요. 글쓴이가 뒤에서 따지려는 생각이라 반대쪽이에요.","however(그러나) 뒤에 연구를 다시 살펴본 결과를 대요. (2)의 생각이 증거보다 앞서 나갔다는 (4)를 받치는 자료라 근거예요. 연구 하나를 사례로 든 문장으로 읽으면 예시로 골라도 맞아요.","앞의 연구 결과를 묶어 글쓴이의 판단(널리 퍼진 그림이 증거보다 앞서 나갔다)을 밝혀요. 뒤 문장들이 이것을 받치니 주장이에요.","증거가 왜 약한지 까닭(실험이 화분 · 온실에서 이루어졌다)을 대어 (4)를 받치니 근거예요.","In several field studies(숲에서 한 몇몇 연구에서)로 실제 연구 결과를 사례로 들어요. 그래서 예시예요. 증거가 약하다는 것을 받치니 근거로 골라도 맞아요.","None of this suggests(그렇다고 ~라는 뜻은 아니에요)로 지나친 해석(이 균류는 쓸모없다)을 막아요. 글쓴이의 의심과 다른 쪽을 인정하고 넘어가니 반대쪽이에요.","(7)에서 인정한 것과 의심스러운 것을 가르며, 왜 아직 믿기 어려운지(훨씬 강한 증거가 필요하다) 까닭을 대요. 그래서 근거예요. 글쓴이가 의심하는 핵심을 다시 짚는 말로 읽으면 주장으로 골라도 맞아요.","Until(~할 때까지)으로 지금은 어떻게 받아들여야 하는지 정리하며 끝맺어요. (4)를 「사실이 아니라 가설」로 다시 말하니 결론이에요. 글쓴이의 생각을 다시 밝히는 문장이라 주장으로 골라도 맞아요."]}]}};

// 기록 꼴: c · w · p(문항별 {c 마지막 결과, n 푼 횟수, k 맞힌 횟수, f 첫 결과, t 때}) · d(날짜별 [고르기 푼 수, 고르기 맞힌 수, 쓰기 수, 단락 수, 공부 초])
//          · x(최근 틀린 고르기 [때, 문항, 고른 답]) · set(고른 묶음) · ts(마지막 기록 때) · la(마지막으로 답한 때)
const MN_SHEET_URL = 'https://script.google.com/macros/s/AKfycbxDOZbcQhJa72ROS23_el4w1_430ipHJWQ7IS74yUwiksWFsvJhrCHSSAfFiD_9gWhJkg/exec';
const MN_KIND = 'marginnote';
const MN_X_MAX = 30, MN_DAY_KEEP = 120, MN_GAP_MAX = 180000, MN_CELL_MAX = 45000;
function mnDay(ts) { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
// 답 하나를 셀 때마다 부름: 날짜별 수 · 공부 시간(앞 답과 3분 안이면 그 사이를 더함, 그 날 첫 답은 30초로 셈)
function mnTally(kind, ok) {
  const now = Date.now(), day = mnDay(now);
  const d = sumState.d = sumState.d || {};
  const row = d[day] = d[day] || [0, 0, 0, 0, 0];
  if (kind === 'c') { row[0]++; if (ok) row[1]++; } else if (kind === 'w') row[2]++; else row[3]++;
  const gap = sumState.la ? now - sumState.la : -1;
  row[4] += (gap > 0 && gap <= MN_GAP_MAX) ? Math.round(gap / 1000) : 30;
  sumState.la = now; sumState.ts = now;
  const keys = Object.keys(d).sort();
  while (keys.length > MN_DAY_KEEP) delete d[keys.shift()];
}
function mnRecordChoose(it, ok, chosenText) {
  const prev = sumState.c[it.id];
  const k0 = prev ? (prev.k != null ? prev.k : (prev.c ? 1 : 0)) : 0;
  const f0 = prev ? (prev.f != null ? prev.f : (prev.c ? 1 : 0)) : (ok ? 1 : 0);
  sumState.c[it.id] = { c: ok, n: ((prev && prev.n) || 0) + 1, k: k0 + (ok ? 1 : 0), f: f0, t: Date.now() };
  if (!ok) { const x = sumState.x = sumState.x || []; x.push([Date.now(), it.id, String(chosenText || '').slice(0, 60)]); if (x.length > MN_X_MAX) x.splice(0, x.length - MN_X_MAX); }
  mnTally('c', ok); sumSave();
}
function mnPayload() {
  const o = { v: 1, set: sumState.set || sumSet, ts: sumState.ts || 0, la: sumState.la || 0, c: sumState.c, w: sumState.w, p: sumState.p, d: sumState.d || {}, x: sumState.x || [] };
  let j = JSON.stringify(o);
  while (j.length > MN_CELL_MAX && o.x.length) { o.x = o.x.slice(Math.ceil(o.x.length / 2)); j = JSON.stringify(o); }
  while (j.length > MN_CELL_MAX && Object.keys(o.d).length > 14) { const ks = Object.keys(o.d).sort(); const d2 = {}; ks.slice(Math.floor(ks.length / 2)).forEach(k => d2[k] = o.d[k]); o.d = d2; j = JSON.stringify(o); }
  return j;
}
let _mnPushTimer = null, _mnPushPending = false;
function mnCanSync() { return !!(MN_SHEET_URL && MN_SHEET_URL.indexOf('http') === 0 && studentName && sumState && sumState.ts); }
function mnPushSoon() { if (!mnCanSync()) return; _mnPushPending = true; clearTimeout(_mnPushTimer); _mnPushTimer = setTimeout(mnPushNow, 2500); }
function mnPushNow() {
  if (!_mnPushPending || !mnCanSync()) return;
  _mnPushPending = false; clearTimeout(_mnPushTimer);
  try {
    const body = JSON.stringify({ action: 'save_session_state', kind: MN_KIND, name: studentName, school: studentSchool, grade: studentGrade, number: studentNumber, stateJson: mnPayload() });
    const small = (typeof Blob !== 'undefined' ? new Blob([body]).size : body.length * 3) < 60000; // 페이지를 닫을 때도 보내지게(keepalive)는 64KB까지만 됨
    fetch(MN_SHEET_URL, { method: 'POST', mode: 'no-cors', keepalive: small, headers: { 'Content-Type': 'text/plain' }, body }).catch(() => { _mnPushPending = true; });
  } catch (e) { /* 보내지 못해도 이 기기 기록은 남아 있음 — 다음 기록 때 다시 보냄 */ _mnPushPending = true; }
}
addEventListener('pagehide', mnPushNow);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') mnPushNow(); });
async function mnSheetPost(body, ms) {
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), ms || 8000) : null;
  try {
    const res = await fetch(MN_SHEET_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined });
    return await res.json();
  } finally { if (timer) clearTimeout(timer); }
}

function sumStat(list, rec) {

// 안 푼 문항 먼저, 그다음 틀린 문항, 그다음 맞힌 문항. 같은 묶음 안에서는 깊이를 가리지 않고 섞는다.
// 같은 전환 표현을 쓴 두 문항(device 끝의 「(다시)」를 뗀 이름이 같음)은 한 판에 같이 내지 않는다(2026-11-07 선생님 결정).
// 같은 갈래 전환 표현(dg — 자료에 있을 때)은 한 판에 하나만. dg가 없으면 괄호 설명을 뗀 이름으로 견줌
function sumDevKey(it) { return String(it.dg || String(it.dev || '').replace(/\([^()]*\)/g, '')).replace(/\s+/g, ' ').trim().toLowerCase(); }
function sumPick(list, rec, n) {
  const unseen = shuffleArr(list.filter(it => !rec[it.id]));
  const wrong = shuffleArr(list.filter(it => rec[it.id] && !rec[it.id].c));
  const right = shuffleArr(list.filter(it => rec[it.id] && rec[it.id].c));
  const order = unseen.concat(wrong, right), out = [], used = {};
  order.forEach(it => { if (out.length < n && !used[sumDevKey(it)]) { out.push(it); used[sumDevKey(it)] = 1; } });
  order.forEach(it => { if (out.length < n && out.indexOf(it) < 0) out.push(it); });
  return out;
}

function sumWordRanges(text, words) {
  const taken = [];
  (words || []).slice().sort((a, b) => b[0].length - a[0].length).forEach(([w, m]) => {
    const esc = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const mt = new RegExp((/^\w/.test(w) ? '\\b' : '') + esc + (/\w$/.test(w) ? '\\b' : ''), 'i').exec(text);
    if (!mt) return;
    const s = mt.index, e = s + mt[0].length;
    if (taken.some(r => s < r.e && e > r.s)) return;
    taken.push({ s, e, w, m });
  });
  return taken.sort((a, b) => a.s - b.s);
}
function sumMarkWords(host, text, words, onTap) {
  let pos = 0;
  sumWordRanges(text, words).forEach(r => {
    if (r.s > pos) host.append(document.createTextNode(text.slice(pos, r.s)));
    const sp = myEl('span', 'border-bottom:2px dotted #2563EB;cursor:pointer;', text.slice(r.s, r.e));
    sp.setAttribute('role', 'button'); sp.tabIndex = 0; sp.className = 'sumWord';
    const go = () => onTap(r.w, r.m);
    sp.onclick = go; sp.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } };
    host.append(sp); pos = r.e;
  });
  if (pos < text.length) host.append(document.createTextNode(text.slice(pos)));
}

  const vals = days.map(d => { const x = S.d[d] || [0, 0, 0, 0, 0]; return { d, n: (x[0] || 0) + (x[2] || 0) + (x[3] || 0), sec: x[4] || 0 }; });
  const mx = Math.max(1, ...vals.map(v => v.n));
  const cal = myEl('div', 'border:1px solid #E5E7EB;border-radius:10px;padding:10px 12px;margin-bottom:12px;');
  cal.append(myEl('div', 'font-size:13px;font-weight:700;color:#111827;margin-bottom:6px;', '최근 14일 — 날마다 푼 문항'));
  const bars = myEl('div', 'display:flex;align-items:flex-end;gap:3px;height:70px;');
  vals.forEach(v => { const col = myEl('div', 'flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;'); col.title = `${v.d} · ${v.n}문항 · ${mnMin(v.sec)}`; if (v.n) col.append(myEl('div', 'font-size:9.5px;color:#374151;', String(v.n))); col.append(myEl('div', `width:100%;height:${Math.round(v.n / mx * 52)}px;min-height:${v.n ? 3 : 1}px;background:${v.n ? '#2563EB' : '#E5E7EB'};border-radius:3px 3px 0 0;`)); bars.append(col); });
  cal.append(bars);
  const lab = myEl('div', 'display:flex;justify-content:space-between;font-size:10.5px;color:#9CA3AF;margin-top:3px;'); lab.append(myEl('span', null, days[0].slice(5)), myEl('span', null, '오늘')); cal.append(lab);
  cal.append(myEl('div', 'font-size:12px;color:#4B5563;margin-top:6px;', `최근 7일: ${S.week.days}일 공부 · ${S.week.n}문항 · ${mnMin(S.week.sec)}`));
  card.append(cal);
  // 연습 2 · 3
  const ws = myEl('div', 'border:1px solid #E5E7EB;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;color:#374151;line-height:1.7;');
  ws.append(myEl('div', 'font-size:13px;font-weight:700;color:#111827;margin-bottom:2px;', '연습 2 직접 쓰기 · 연습 3 단락'));
  ws.append(myEl('div', null, S.writes ? `쓰기 ${S.writes}문항 — 학생 스스로 매김: 맞게 썼어요 ${S.wg[0]} · 반만 맞았어요 ${S.wg[1]} · 다시 볼래요 ${S.wg[2]}` : '쓰기는 아직 안 했어요.'));
  if (S.paras) {
    ws.append(myEl('div', null, `단락 ${S.paras}개 — 주제 문제 ${S.paraOk}/${S.paras} 맞힘 · 문장 역할 ${S.roleOk}/${S.roleAll} 맞힘`));
    Object.entries(st.p || {}).forEach(([id, e]) => { const m = MN_ITEM[id]; if (!m) return; ws.append(myEl('div', 'font-size:12px;color:#6B7280;', `· ${SUM_SET_NAME[m.set]} 「${m.it.title}」: 주제 ${e.c ? '맞힘' : '틀림'} · 역할 ${e.roles || 0}/${e.of || m.it.sents.length} · ${e.n || 1}번 풂`)); });
  } else ws.append(myEl('div', null, '단락은 아직 안 했어요.'));
  card.append(ws);
  // 자주 틀리는 문항 · 최근 틀린 답
  const wrongOf = e => (e.n || 1) - (e.k != null ? e.k : (e.c ? 1 : 0));
  const hard = Object.entries(st.c || {}).filter(([id, e]) => MN_ITEM[id] && wrongOf(e) >= 2).sort((a, b) => wrongOf(b[1]) - wrongOf(a[1])).slice(0, 6);
  const xs = (st.x || []).slice().reverse().slice(0, 10);
  const wr = myEl('div', 'border:1px solid #E5E7EB;border-radius:10px;padding:10px 12px;margin-bottom:12px;');
  wr.append(myEl('div', 'font-size:13px;font-weight:700;color:#111827;margin-bottom:4px;', '틀린 문항 (고르기)'));
  const itemLine = (id, extra) => { const m = MN_ITEM[id]; const it = m.it; const box = myEl('div', 'border-top:1px dashed #E5E7EB;padding:7px 0 5px;font-size:12.5px;line-height:1.6;color:#374151;');
    box.append(myEl('div', 'font-size:11px;color:#6B7280;', `${SUM_SET_NAME[m.set]} · 깊이 ${m.k} · ${it.dev || ''}`), myEl('div', 'color:#111827;', it.s.length > 150 ? it.s.slice(0, 150) + '…' : it.s), myEl('div', null, extra)); return box; };
  if (hard.length) { wr.append(myEl('div', 'font-size:12px;font-weight:600;color:#B42318;margin:2px 0;', '두 번 이상 틀린 문항')); hard.forEach(([id, e]) => wr.append(itemLine(id, `${e.n}번 풀어 ${wrongOf(e)}번 틀림 · 정답 「${MN_ITEM[id].it.a}」`))); }
  if (xs.length) { wr.append(myEl('div', 'font-size:12px;font-weight:600;color:#374151;margin:8px 0 2px;', '최근 틀린 답 (고른 보기)')); xs.forEach(([t, id, chosen]) => { if (MN_ITEM[id]) wr.append(itemLine(id, `${new Date(t).toLocaleDateString('ko-KR')} · 고른 답 「${chosen}」 → 정답 「${MN_ITEM[id].it.a}」`)); }); }
  if (!hard.length && !xs.length) wr.append(myEl('p', 'font-size:12.5px;color:#9CA3AF;margin:2px 0 0;', '틀린 고르기 문항이 없어요.'));
  card.append(wr);
  const bk = myEl('button', null, '학생 목록으로'); bk.className = 'secondary'; bk.onclick = back.onclick; card.append(bk);
}
// ⓒ 정세형. 무단 복제 및 배포를 금지합니다.
mnStart();
</script>
</body>
</html>
