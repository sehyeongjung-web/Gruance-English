의사가 가슴에 귀를 대고 듣는 모습에 견줬어요(the way a doctor listens to a chest). 의사는 그 소리로 어디가 아픈지 알아내요. 정비사도 소리가 충분히 알려 줄 때까지 아무 말 없이 들어요(saying nothing until the noise has told him enough). 그래서 속뜻은 노련한 정비사가 소리로 탈을 가려낸다는 거예요.","tr":[["노련한 정비사 → 손님 말에 귀 기울임","listens 낱말은 같지만 듣는 것이 달라요. 정비사가 듣는 것은 손님 말이 아니라 엔진 소리예요(listens to an engine)."],["노련한 정비사 → 소음에 넌더리를 냄","noise 낱말은 같지만 마음을 지어냈어요. 정비사는 소리를 싫어하는 것이 아니라 그 소리가 알려 주기를 기다려요(until the noise has told him enough)."],["가슴 진찰하는 의사 → 엔진까지 고침","doctor · engine 낱말을 섞었어요. 의사는 정비사가 듣는 모습을 견주려고 데려온 그림일 뿐이에요(the way a doctor listens to a chest)."],["가슴 진찰하는 의사 → 말수 적은 사람","saying nothing 낱말은 같지만 주인이 달라요. 아무 말 없이 듣는 사람은 의사가 아니라 정비사예요(The veteran mechanic listens to an engine)."]],"dg":"the way ~"},{"id":"M5-5","k":5,"dev":"요리 비유 (half-baked)","s":"The city's half-baked plan for the weekend market named a date and a street but said nothing about power, toilets, or waste.","a":"시의 주말 장터 계획 → 덜 다듬어져 엉성함","why":"비유를 알리는 말 없이 half-baked(반쯤만 구운)라는 낱말 자체가 비유예요. 빵이 아니라 계획이 덜 익었다는 뜻이에요. 주말 장터 계획은 날짜와 거리는 정했지만(named a date and a street) 전기 · 화장실 · 쓰레기에 대해서는 아무 말이 없었어요(said nothing about power, toilets, or waste). 꼭 있어야 할 것이 빠진 채 내놓은 거예요. 그래서 속뜻은 시의 주말 장터 계획이 덜 다듬어져 엉성했다는 거예요.","tr":[["시의 주말 장터 계획 → 날짜조차 못 정함","date 낱말은 같지만 거꾸로예요. 날짜와 거리는 정했어요(named a date and a street). 빠진 것은 전기 · 화장실 · 쓰레기예요."],["시의 주말 장터 계획 → 주민 반대에 막힘","그럴듯하지만 글에 주민 이야기는 없어요. 글이 말한 흠은 빠진 것이 많다는 점이에요(said nothing about power, toilets, or waste)."],["거리 주말 장터 → 쓰레기 없이 치러짐","waste 낱말은 같지만 일을 지어냈어요. 쓰레기에 대해서는 계획에 아무 말이 없었을 뿐이에요(said nothing about power, toilets, or waste)."],["거리 주말 장터 → 먹거리 장터로 바뀜","half-baked를 음식 이야기로 잘못 읽었어요. 빵이 아니라 계획이 덜 익었다는 비유예요(The city's half-baked plan)."]],"dg":"요리 비유"},{"id":"M5-6","k":5,"dev":"인사치레 말 ↔ 행동 (We'll certainly be in touch)","s":"'We'll certainly be in touch,' the landlord said, closing the door before the young couple had finished writing down their number.","a":"집주인 → 이 부부는 안 받을 셈","why":"말은 꼭 연락하겠다는 것이지만('We'll certainly be in touch') 행동이 달라요. 집주인은 젊은 부부가 전화번호를 다 적기도 전에(before the young couple had finished writing down their number) 문을 닫았어요(closing the door). 번호도 받지 않고서는 연락할 수 없어요. 연락하겠다는 말은 인사치레였던 거예요. 그래서 속뜻은 집주인이 이 부부는 받지 않을 셈이라는 거예요.","tr":[["집주인 → 곧 연락할 작정임","따옴표 속 말('We'll certainly be in touch')을 겉뜻대로 믿은 답이에요. 집주인은 번호를 다 받기도 전에 문을 닫았어요(closing the door before the young couple had finished writing down their number)."],["집주인 → 번호를 챙겨 받음","number 낱말은 같지만 거꾸로예요. 부부가 번호를 다 적기도 전에 문이 닫혔어요(before the young couple had finished writing down their number)."],["젊은 부부 → 집이 탐탁지 않음","그럴듯하지만 행동과 맞지 않아요. 부부는 연락을 받으려고 번호를 적고 있었어요(writing down their number)."],["젊은 부부 → 계약서를 다 씀","finished writing 낱말은 같지만 일을 지어냈어요. 적던 것은 계약서가 아니라 전화번호이고, 그것도 다 적지 못했어요(before the young couple had finished writing down their number)."]],"dg":"인사치레 말"},{"id":"M5-7","k":5,"dev":"might as well have been ~ing (~한 것이나 다름없었다)","s":"With the projector broken and no handouts, the consultant might as well have been speaking to an empty room; nobody followed a single figure.","a":"컨설턴트의 발표 → 아무에게도 안 가닿음","why":"might as well have been ~ing은 「~하고 있던 것이나 다름없었다」라며 실제가 아닌 그림에 견주는 말이에요. 빈 방에 대고 말한 것이나 다름없었다고 했어요(might as well have been speaking to an empty room). 방이 정말 비었다는 말이 아니에요. 프로젝터도 고장 나고 나눠 준 자료도 없어서(With the projector broken and no handouts) 듣는 사람 누구도 숫자 하나 따라가지 못했어요(nobody followed a single figure). 그래서 속뜻은 컨설턴트의 발표가 아무에게도 가닿지 않았다는 거예요.","tr":[["컨설턴트의 발표 → 청중 한 명 없이 함","empty room을 글자 그대로 읽었어요. 방이 빈 것이 아니라 빈 것이나 다름없었다는 비유예요. 듣는 사람은 있었지만 따라가지 못했어요(nobody followed a single figure)."],["컨설턴트의 발표 → 숫자 하나가 틀림","a single figure 낱말은 같지만 뜻이 달라요. 숫자가 틀린 것이 아니라 아무도 숫자 하나 따라가지 못했어요(nobody followed a single figure)."],["발표를 듣던 사람들 → 자료를 받아 읽음","handouts 낱말은 같지만 거꾸로예요. 나눠 준 자료는 없었어요(no handouts)."],["발표를 듣던 사람들 → 내용에 반대함","그럴듯하지만 글에 반대했다는 말은 없어요. 사람들은 맞서기는커녕 숫자 하나 따라가지 못했어요(nobody followed a single figure)."]],"dg":"might as well have been"},{"id":"M5-8","k":5,"dev":"연료 비유 (running on empty)","s":"By the third week of the harvest, the crew was running on empty, and the manager began sending half of them home early to rest.","a":"수확 일꾼들 → 기운이 바닥남","why":"비유를 알리는 말 없이 running on empty(빈 연료통으로 달린다)라는 말 자체가 비유예요. 차가 아니라 사람의 기운이 다 떨어졌다는 뜻이에요. 수확 셋째 주가 되자(By the third week of the harvest) 일꾼들이 그렇게 됐고, 현장 관리자는 절반을 일찍 집으로 보내 쉬게 하기 시작했어요(sending half of them home early to rest). 쉬게 했다는 데서 지쳤다는 것이 드러나요. 그래서 속뜻은 수확 일꾼들의 기운이 바닥났다는 거예요.","tr":[["수확 일꾼들 → 일감이 바닥남","empty 낱말에 끌려 무엇이 바닥났는지를 바꿨어요. 일이 없어서가 아니라 쉬게 하려고 집에 보냈어요(sending half of them home early to rest)."],["수확 일꾼들 → 셋째 주에 끝냄","the third week 낱말은 같지만 일을 지어냈어요. 셋째 주에 수확이 끝난 것이 아니라 그때쯤 기운이 다했어요(By the third week of the harvest, the crew was running on empty)."],["현장 관리자 → 절반을 해고함","sending half of them home 낱말은 같지만 뜻이 달라요. 내쫓은 것이 아니라 쉬라고 일찍 집에 보냈어요(home early to rest)."],["현장 관리자 → 기름을 못 구함","running on empty를 글자 그대로 읽었어요. 연료가 아니라 사람의 기운이 다했다는 비유예요(the crew was running on empty)."]],"dg":"연료 비유"},{"id":"M5-9","k":5,"dev":"투덜대는 말 ↔ 속마음 (I'll have to clear another shelf)","s":"'I suppose I'll have to clear another shelf,' sighed the coach, setting the third trophy of the season beside the others.","a":"감독 → 속으로는 몹시 뿌듯함","why":"투덜대는 말처럼 들리지만 속마음은 달라요. 선반을 또 하나 치워야겠다고 한숨을 쉬었지만('I suppose I'll have to clear another shelf,' sighed the coach), 그때 감독이 하던 일은 팀이 이번 시즌에 받은 세 번째 우승컵을 다른 것들 곁에 놓는 것이었어요(setting the third trophy of the season beside the others). 선반이 모자랄 만큼 우승컵이 늘었다는 자랑이에요. 그래서 속뜻은 감독이 속으로는 몹시 뿌듯했다는 거예요.","tr":[["감독 → 속으로는 퍽 성가심","따옴표 속 말('I suppose I'll have to clear another shelf')을 겉뜻대로 믿은 답이에요. 치울 까닭은 세 번째 우승컵을 놓을 자리예요(setting the third trophy of the season)."],["감독 → 속으로는 못내 서운함","속마음이 따로 있다는 것은 맞지만 방향이 반대예요. 감독은 이번 시즌 세 번째 우승컵을 놓고 있었으니(setting the third trophy of the season) 서운할 일이 아니에요."],["선수들 → 세 번째로 우승 놓침","third 낱말은 같지만 거꾸로예요. 세 번째는 놓친 횟수가 아니라 받은 우승컵이에요(the third trophy of the season)."],["선수들 → 감독 꾸중에 풀 죽음","sighed 낱말에 끌려 장면을 지어냈어요. 감독의 한숨은 꾸중이 아니라 우승컵을 놓으며 한 말에 붙은 거예요(setting the third trophy of the season)."]],"dg":"투덜대는 말"},{"id":"M5-10","k":5,"dev":"관용구 (the tip of the iceberg)","s":"The engineer warned that the cracked beams found in the entrance hall were only the tip of the iceberg in a building of that age.","a":"금 간 들보들 → 숨은 흠의 일부","why":"비유를 알리는 말 없이 the tip of the iceberg(빙산의 끝)라는 관용구가 나와요. 빙산은 물 위로 보이는 부분보다 물 밑에 잠긴 부분이 훨씬 커요. 기술자는 현관 홀에서 찾은 금 간 들보(기둥 위에 가로로 놓인 나무나 쇠)들이(the cracked beams found in the entrance hall) 그 빙산의 끝일 뿐이라고 경고했어요(were only the tip of the iceberg). 그만큼 오래된 건물이니(in a building of that age) 보이지 않는 흠이 더 있다는 말이에요. 그래서 속뜻은 금 간 들보들이 숨은 흠의 일부이라는 거예요.","tr":[["금 간 들보들 → 건물서 가장 큰 흠","only 낱말을 놓쳤어요. 가장 큰 흠이 아니라 겨우 끝자락일 뿐이라고 했어요(were only the tip of the iceberg)."],["금 간 들보들 → 갈아 끼우면 그만","그럴듯하지만 경고와 맞지 않아요. 기술자는 그것들이 끝자락일 뿐이라고 경고했으니(were only the tip of the iceberg) 그것들만 고쳐서는 끝나지 않아요."],["건물 기술자 → 현관만 보고 돌아감","entrance hall 낱말은 같지만 일을 지어냈어요. 현관 홀은 금 간 들보를 찾은 곳일 뿐이에요(found in the entrance hall)."],["건물 기술자 → 지은 해를 못 밝힘","age 낱말은 같지만 일을 지어냈어요. 기술자는 건물이 그만큼 오래됐다는 것을 알고 말했어요(in a building of that age)."]],"dg":"관용구"}],"write":[{"id":"M1-W1","k":1,"dev":"Following ~ (계기를 덧붙임)","s":"Following complaints from night-shift nurses, one hospital began dimming its hallway lights after ten o'clock, and patients on those floors now report sleeping far better.","model":"밤 복도 불 낮춤 → 환자 잠 나아짐","accept":"병원 복도 조명 줄이기 → 환자가 더 잘 잠, 밤에 복도 어둡게 → 푹 잠, 복도 불 낮춤 → 환자에게 좋아짐(무엇이 나아졌는지 빠져 반만 맞음)","no":"야간 간호사 → 불만 제기(Following 뒤 계기만), 병원 → 밤 10시 뒤 불 낮춤(한 일만 있고 결과가 빠짐), 어두운 복도 → 간호사 일하기 편해짐(글에 없음)","dg":"following"},{"id":"M1-W2","k":1,"dev":"as measured by ~ (무엇으로 쟀는지 덧붙임)","s":"A tire shop that began sending customers photos of their worn parts has seen the share of customers approving recommended repairs rise significantly, as measured by its own service records.","model":"닳은 부품 사진 보내기 → 수리 승낙 늘어남","accept":"부품 사진 보여 주기 → 손님이 수리에 더 동의, 사진으로 보여 주니 → 권해 준 수리 받아들임, 사진 보내기 → 손님 반응 좋아짐(무엇이 늘었는지 빠져 반만 맞음)","no":"가게 정비 기록으로 잼(as measured by 뒤 덧붙은 말만), 타이어 가게 → 사진 보냄(한 일만 있고 결과가 빠짐), 사진 보내기 → 수리비 내려감(글에 없음)","dg":"as measured by"},{"id":"M1-W3","k":1,"dev":"down from ~ (예전 값을 덧붙임)","s":"Since a seaside town installed free drinking fountains along its main beach, sales of bottled water at nearby stands have declined to 300 a day, down from 500.","model":"해변 식수대 → 생수 판매 줄어듦","accept":"무료 식수대 설치 → 생수 덜 팔림, 물 마실 곳 생기자 → 병 생수 덜 삼, 식수대 → 생수 하루 300병(줄었다는 말이 빠져 반만 맞음)","no":"생수 → 하루 500병 팔림(down from 뒤 예전 값만), 바닷가 마을 → 식수대 설치(한 일만 있고 결과가 빠짐), 식수대 → 해변 쓰레기 줄어듦(글에 없는 흔한 말)","dg":"down from"},{"id":"M1-W4","k":1,"dev":"as did ~ (같은 흐름을 하나 더 보탬)","s":"After one supermarket placed chairs at its cash registers so that cashiers could sit, scanning errors fell by a third, as did sick days.","model":"계산대 의자 → 계산 실수 줄어듦","accept":"앉아서 일하게 함 → 실수도 병가도 줄어듦, 계산원 의자 → 실수 3분의 1 줄어듦, 의자 놓기 → 병가 줄어듦(as did 뒤 덧붙은 쪽만 옮겨 반만 맞음)","no":"계산원 → 앉을 수 있음(so that 뒤 목적만 — 결과가 빠짐), 슈퍼마켓 · 의자 · 계산대(나열), 의자 놓기 → 손님 줄이 짧아짐(글에 없음)","dg":"as did"},{"id":"M2-W1","k":2,"dev":"At first glance, ~ (둘째 문장의 though가 뒤집음)","s":"At first glance, open offices seem certain to encourage conversation. When one firm tracked its staff after removing the walls, though, face-to-face talk fell while emails multiplied.","model":"벽 없앤 사무실 → 마주 보는 대화 줄어듦","accept":"벽 없애자 → 직접 대화 줄고 이메일 늘어남, 열린 사무실 → 말 대신 이메일, 열린 사무실 → 이메일 늘어남(while 뒤만 옮겨 반만 맞음)","no":"열린 사무실 → 대화 북돋움(At first glance 쪽 겉보기), 한 회사 → 벽 없앰(한 일만 있고 결과가 빠짐), 열린 사무실 → 시끄러워 집중 못 함(글에 없는 흔한 말)","dg":"at first glance"},{"id":"M2-W2","k":2,"dev":"As it turned out, ~ (두 문장)","s":"Shop owners feared that the new bike lanes, by removing parking spaces, would drive customers away. As it turned out, sales along the street rose, since cyclists stopped more often than drivers had.","model":"자전거 도로 → 가게 매출 늘어남","accept":"주차 자리 대신 자전거 도로 → 장사 더 잘됨, 자전거 도로 생기자 → 거리 매출 오름, 자전거 탄 사람 → 더 자주 들름(since 뒤 까닭만 옮겨 반만 맞음)","no":"자전거 도로 → 손님 쫓음(As it turned out 앞 — 가게 주인들의 걱정), 자전거 도로 → 주차 자리 없어짐(끼움말 세부만), 자전거 도로 → 사고 줄어듦(글에 없음)","dg":"as it turned out"},{"id":"M2-W3","k":2,"dev":"have yet to ~ (yet이 있어도 「아직 ~하지 못했다」 — 맞섬 신호 아님)","s":"Researchers have yet to find a single office plant that cleans indoor air to any noticeable degree, even in rooms crowded with dozens of pots.","model":"실내 화분 → 눈에 띄는 정화 효과 못 찾음","accept":"사무실 식물 → 공기 눈에 띄게 못 맑힘, 화분 많아도 → 공기 정화 안 드러남, 식물 → 공기 전혀 못 맑힘(「눈에 띌 만큼은 아직 못 찾았다」를 잘라 말해 반만 맞음)","no":"사무실 식물 → 공기 맑게 함(have yet to를 놓쳐 거꾸로 읽음), 화분 수십 개 → 방이 붐빔(even 뒤 세부만), 연구자 → 곧 찾아낼 것(yet을 「머지않아」로 잘못 읽음)","dg":"have yet to"},{"id":"M2-W4","k":2,"dev":"Whatever ~ gained in A, ~ lost in B (얻은 만큼 잃음)","s":"Whatever the factory gained in speed by running its machines through the night, it lost in repairs: breakdowns doubled, and output for the year barely changed.","model":"밤샘 가동 → 고장 늘어 얻은 것 거의 없음","accept":"밤새 기계 돌리기 → 한 해 생산량 그대로, 빨라진 만큼 → 고장으로 잃음, 밤샘 가동 → 고장 두 배(잃은 쪽만 옮겨 반만 맞음 — 결국 제자리라는 말이 빠짐)","no":"밤샘 가동 → 속도 빨라짐(Whatever 쪽 얻은 것만), 밤샘 가동 → 생산량 크게 늚(barely를 놓쳐 거꾸로 읽음), 밤 근무 → 직원 건강 해침(글에 없는 흔한 말)","dg":"whatever ~ gained in a, ~ lost in b"},{"id":"M3-W1","k":3,"dev":"did away with A and brought in B (부정 말 없이 대체)","s":"One hotel did away with printed comment cards and brought in a single question at checkout, and the share of guests giving feedback climbed from a tenth to a half.","model":"나갈 때 질문 하나 → 의견 주는 손님 늘어남","accept":"의견 카드 대신 질문 하나 → 응답 늘어남, 퇴실 때 한마디 묻기 → 손님 반이 답함, 호텔 → 카드 없애고 질문으로 바꿈(결과가 빠져 반만 맞음)","no":"인쇄한 의견 카드 → 응답 늘어남(없앤 쪽을 잡음), 질문 하나 → 손님 만족 높아짐(늘어난 것은 만족이 아니라 의견을 준 손님 몫), 호텔 → 의견 받기 그만둠(did away with만 읽음)","dg":"did away with a and brought in b"},{"id":"M3-W2","k":3,"dev":"Forget A: ~ only when B (명령문으로 버림)","s":"Forget expensive standing desks: in one trial, office workers' back pain eased only when a timer reminded them to get up and walk every half hour.","model":"30분마다 일어나 걷기 → 허리 통증 줄어듦","accept":"자주 일어나 걷기 → 허리 덜 아픔, 비싼 책상보다 걷기 알림, 알림 시계 → 허리 통증 줄어듦(무엇을 알리는지 빠져 반만 맞음)","no":"서서 쓰는 책상 → 허리 통증 줄어듦(Forget으로 버린 쪽), 서서 쓰는 책상 → 너무 비쌈(꾸밈말 expensive만 잡음), 사무직 → 운동이 모자람(글에 없는 흔한 말)","dg":"forget a: ~ only when b"},{"id":"M3-W3","k":3,"dev":"No sooner ~ than (no가 있어도 「~하자마자」)","s":"No sooner had the town lowered the speed limit on its main street than cafes began setting tables outside; within a year, evening foot traffic had doubled.","model":"제한 속도 낮춤 → 거리에 사람 늘어남","accept":"속도 낮추자 → 저녁에 걷는 사람 두 배, 차 느려지자 → 거리 살아남, 속도 낮추자 → 카페가 바깥 자리 냄(끝 결과인 사람 발길이 빠져 반만 맞음)","no":"마을 → 제한 속도 못 낮춤(No를 부정으로 읽음), 속도 낮춤 → 사람 발길 줄어듦(No · than에 끌려 거꾸로 읽음), 속도 낮춤 → 교통사고 줄어듦(글에 없는 흔한 말)","dg":"no sooner ~ than"},{"id":"M3-W4","k":3,"dev":"not because A but because B","s":"Residents keep returning to one hardware store not because its prices are lower, which they are not, but because staff will cut a board or a key while they wait.","model":"기다리는 동안 잘라 줌 → 손님 다시 옴","accept":"그 자리에서 잘라 주기 → 주민들 발길 이어짐, 값보다 바로 해 주는 일손, 좋은 서비스 → 손님 다시 옴(무엇을 해 주는지 빠져 반만 맞음)","no":"싼 값 → 손님 다시 옴(not because 쪽 — 값은 싸지도 않음), 철물점 → 값이 더 비쌈(which절은 「더 싸지 않다」일 뿐), 직원 → 손님 오래 기다리게 함(while they wait를 비틂)","dg":"not because a but because b"},{"id":"M4-W1","k":4,"dev":"That is exactly what happened when ~ (앞 문장 원리의 사례)","s":"That is exactly what happened when one furniture store let customers assemble a small table themselves: they priced it higher than the identical table sold ready-made.","model":"제 손 들인 것 → 더 값지게 여김","accept":"직접 수고하면 → 더 아낌, 스스로 만든 것 → 값 더 쳐줌, 손수 조립한 탁자 → 완제품보다 비싸게 매김(사례 그대로라 반만 맞음)","no":"가구점 → 손님에게 조립시킴(한 일만 있고 결과가 빠짐), 완제품 → 품질이 더 좋음(글에 없음), 조립식 가구 → 값이 쌈(글에 없는 흔한 생각)","ctx":"People tend to value a thing more once they have put their own effort into it.","dg":"that is exactly what happened when"},{"id":"M4-W2","k":4,"dev":"Think of ~ (떠올릴 물건 하나 — 원리는 쌍점 뒤)","s":"Think of a bicycle pump, which grows warm in your hand after a few strokes: the air inside heats up largely because it is being squeezed into less space.","model":"공기 → 눌리면 뜨거워짐","accept":"기체를 좁은 데로 누르면 → 온도 오름, 눌린 공기 → 열 남, 자전거 펌프 → 몇 번 누르면 따뜻해짐(사례 그대로라 반만 맞음)","no":"펌프 → 손과 비벼져 따뜻해짐(because 뒤 까닭은 눌림), 자전거 · 펌프 · 손(나열), 공기 → 뜨거워지면 부풂(글에 없는 다른 원리)","dg":"think of"},{"id":"M4-W3","k":4,"dev":"Hence ~ (앞 문장의 원리에서 나온 장면)","s":"Hence fresh bread can be smelled from across the street while it is still hot, but hardly at all once the loaves have cooled on the shelf.","model":"따뜻할수록 → 냄새 잘 퍼짐","accept":"뜨거우면 → 냄새 멀리 감, 식으면 → 냄새 거의 안 남, 갓 구운 빵 → 길 건너까지 냄새(사례 그대로라 반만 맞음)","no":"빵 → 선반에서 식음(끝 세부만), 빵집 → 길 건너에 있음(across the street를 잘못 읽음), 갓 구운 빵 → 맛이 더 좋음(글에 없는 흔한 말)","ctx":"Smells travel on tiny molecules that escape into the air more easily from warm things than from cold ones.","dg":"hence"},{"id":"M4-W4","k":4,"dev":"The same cannot be said of ~ (요점은 앞 문장이 아니라 반대쪽인 이 문장)","s":"The same cannot be said of tasks that involve reading or writing: at one publisher, songs with words slowed editors down and doubled their errors.","model":"글 다루는 일 → 노래가 방해","accept":"읽고 쓰는 일엔 → 음악이 걸림돌, 말 있는 노래 → 글 일 느려지고 실수 늚, 편집자 → 노래 들으면 실수 두 배(사례 그대로라 반만 맞음)","no":"배경 음악 → 일에 도움(앞 문장만 — 이 문장은 그 반대쪽), 음악 → 어떤 일에나 방해(지루한 되풀이 일에는 돕는다는 앞 문장을 지움), 편집자 → 음악 즐겨 들음(글에 없음)","ctx":"Background music tends to help people get through dull, repetitive work.","dg":"the same cannot be said of"},{"id":"M5-W1","k":5,"dev":"경기 비유 (moved the goalposts)","s":"Each time the team reached its sales target, the head office moved the goalposts, and by spring nobody even bothered to check the monthly figures.","model":"본사 → 목표를 자꾸 바꿔 의욕 꺾음","accept":"채우면 기준 또 올림 → 팀이 손 놓음, 기준 자꾸 바뀜 → 실적 볼 마음 사라짐, 본사 → 목표를 자꾸 바꿈(그래서 팀이 어찌 됐는지 빠져 반만 맞음)","no":"본사 → 골대를 옮김(비유 겉말 그대로), 팀 → 판매 목표 채움(Each time절 앞머리만), 팀 → 월 실적을 꼼꼼히 챙김(nobody even bothered와 반대)","dg":"경기 비유"},{"id":"M5-W2","k":5,"dev":"병 비유 (bottleneck)","s":"With six cooks sharing one oven, the oven was the bottleneck, so the seventh cook the owner wanted to hire would not have sent out a single extra dish.","model":"오븐이 막힘 → 요리사 늘려도 소용없음","accept":"오븐 하나가 병목 → 사람 더 뽑아도 그대로, 오븐이 모자람 → 요리사 늘려 봐야 헛일, 요리사 더 뽑기 → 소용없음(왜 그런지 — 오븐 — 가 빠져 반만 맞음), 오븐 → 병목(뜻은 통하지만 그래서 어떻다는 말이 빠져 반만 맞음)","no":"오븐 → 병의 목(비유를 낱말 그대로 옮김), 주인 → 일곱째 요리사 뽑음(wanted to hire — 뽑고 싶어 했을 뿐), 요리사 여섯 → 일손 모자람(주인의 생각 쪽 — 글과 반대)","dg":"병 비유"},{"id":"M5-W3","k":5,"dev":"따져 묻는 말 ↔ 속뜻 (And who exactly ~?)","s":"'And who exactly is going to pay for all this?' asked the treasurer, closing her notebook before the plan for a new clubhouse had even been read out.","model":"회계 담당 → 새 건물 계획에 반대","accept":"회계 → 돈 없다며 퇴짜, 회계 → 계획은 들어 볼 것도 없다는 태도, 회계 → 못마땅해함(무엇에 그런지 빠져 반만 맞음)","no":"회계 → 돈 낼 사람이 누군지 궁금함(물음을 겉뜻대로 읽음), 회계 → 공책을 덮음(행동만 — 뜻이 빠짐), 회계 → 계획을 끝까지 들음(before ~ had even been read out과 반대)","dg":"따져 묻는 말 ↔ 속뜻"},{"id":"M5-W4","k":5,"dev":"관용구 (the last straw)","s":"When the manager announced that Saturday shifts would start an hour earlier, it was the last straw for three of the longest-serving workers, who handed in their keys that afternoon.","model":"앞당긴 토요 근무 → 쌓인 불만 터져 그만둠","accept":"한 시간 당긴 것 → 참던 끝에 떠남, 토요 근무 바뀜 → 더는 못 참고 그만둠, 오래 일한 직원 셋 → 그만둠(쌓인 끝에 터졌다는 뜻이 빠져 반만 맞음)","no":"마지막 지푸라기(비유 겉말 그대로), 토요 근무 변경 → 그것 하나 때문에 그만둠(the last straw는 그 전에 쌓인 것이 있었다는 말), 직원 셋 → 열쇠 냄(행동만 — 뜻이 빠짐)","dg":"관용구"}],"paras":[{"id":"MP1","title":"별점 평균의 함정","sents":[["Most online buyers begin by checking a product's average star rating, assuming that a higher number means a better purchase.","반대쪽","구매자 → 평균 별점 높으면 좋은 물건(남들 생각)"],["When one consumer group examined several hundred kitchen products, however, the ones returned most often were not those with the lowest averages.","예시","가장 많이 반품된 물건 → 평균 꼴찌가 아님",["근거"]],["They were items whose ratings were split between five stars and one star, a pattern that often signals uneven quality from one unit to the next.","예시","많이 반품된 물건 → 별 다섯과 하나로 갈림",["근거"]],["A single average, in other words, can hide as much as it reveals about what buyers actually experienced.","주장","평균 하나 → 보여 주는 만큼 가림"],["Two products can share an identical rating of four stars even when one satisfies nearly everyone and the other divides its buyers into fans and critics.","근거","같은 별 넷 → 고른 만족일 수도, 갈린 평가일 수도"],["Ratings also come mainly from people who feel strongly, so an average often mixes delight and anger into a middle score that few buyers actually gave.","근거","평균 → 센 느낌들이 섞인 가운데 점수"],["None of this makes ratings useless, and an item that almost everyone rates poorly is still best avoided.","반대쪽","별점 → 쓸모없진 않음(모두 낮게 준 것은 피하기)"],["Buyers would nevertheless do better to look at how the ratings are distributed than to rely on where the average happens to fall.","결론","평균 자리보다 → 별점이 퍼진 모양 보기",["주장"]]],"line":"흔히 평균 별점이 높으면 좋은 물건이라 여기지만, 평균은 평가가 크게 갈린 물건을 가려 주지 못하고, 센 평가들이 섞여 아무도 주지 않은 가운데 점수가 되기도 한다. 그러니 평균이 어디인지보다 별점이 어떻게 퍼져 있는지를 보아야 한다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["fake reviews as a growing risk for online shoppers","poorly rated products as the ones returned most often","written reviews as a more honest guide than star scores","the spread of ratings as more telling than their average","strong opinions as proof that ratings cannot be trusted"],"ans":3,"why":"한 줄의 「평균이 어디인지보다 별점이 어떻게 퍼져 있는지를 보아야 한다」가 정답(the spread of ratings as more telling than their average)과 같아요. 「fake reviews as a growing risk for online shoppers」는 온라인 쇼핑 하면 떠오르는 그럴듯한 말이지만 글에 없어요. 글은 가짜 평가가 아니라 진짜 평가의 평균이 무엇을 가리는지를 말해요. 「poorly rated products as the ones returned most often」는 (2)의 however 뒤 낱말을 옮겼지만 거꾸로예요. 가장 많이 반품된 것은 평균이 가장 낮은 물건이 아니었어요(were not those with the lowest averages). 「written reviews as a more honest guide than star scores」는 그럴듯한 반전처럼 들리지만 글은 글로 쓴 후기와 별점을 견주지 않아요. 별점을 버리자는 것이 아니라 별점이 퍼진 모양을 보자는 거예요(how the ratings are distributed). 「strong opinions as proof that ratings cannot be trusted」는 (6)에 끌린 말인데 너무 세요. (7)이 별점이 쓸모없는 것은 아니라고(None of this makes ratings useless) 분명히 말해요.","tip":"남들 생각 (1) 바로 뒤 (2)에 however가 나오지만, 그 뒤는 주장이 아니라 한 소비자 단체가 살펴본 사례예요. 주장은 (4)의 in other words에서 사례를 풀어 말할 때 나와요. (7)에서 한 걸음 물러섰다가 (8)의 nevertheless로 다시 돌아와 끝맺어요.","ko":["온라인으로 물건을 사는 사람들은 대부분 먼저 제품의 평균 별점부터 확인하는데, 숫자가 높을수록 더 잘 사는 것이라고 여기기 때문이다.","그러나 한 소비자 단체가 주방 제품 수백 가지를 살펴보았더니, 가장 자주 반품된 것은 평균이 가장 낮은 제품들이 아니었다.","그것들은 별점이 별 다섯 개와 별 한 개로 갈린 물건들이었는데, 이런 모양은 흔히 물건 하나하나의 품질이 고르지 않다는 신호다.","다시 말해 평균 하나는 산 사람들이 실제로 겪은 것을 드러내는 만큼 가릴 수도 있다.","하나는 거의 모든 사람을 만족시키고 다른 하나는 산 사람들을 팬과 비판하는 사람으로 갈라놓더라도, 두 제품은 똑같이 별 넷을 받을 수 있다.","별점은 또 주로 느낌이 강한 사람들에게서 나오기 때문에, 평균은 흔히 큰 기쁨과 분노를 섞어 실제로 그 점수를 준 구매자는 거의 없는 가운데 점수로 만든다.","그렇다고 별점이 쓸모없다는 말은 아니며, 거의 모든 사람이 낮게 매긴 물건은 여전히 피하는 것이 가장 좋다.","그렇더라도 물건을 사는 사람은 평균이 어쩌다 어디에 놓였는지에 기대기보다 별점이 어떻게 퍼져 있는지를 보는 편이 더 낫다."],"words":[[["average","평균(의)"],["rating","평점, 별점"],["assuming","~라고 여기며(assume)"],["purchase","구매, 산 물건"]],[["consumer group","소비자 단체"],["examined","살펴보았다, 조사했다"],["returned","반품된"],["the lowest averages","가장 낮은 평균"]],[["split","갈린, 나뉜"],["pattern","(되풀이되는) 모양, 양상"],["signals","~라는 신호가 되다"],["uneven","고르지 않은"],["unit","(제품) 한 개"]],[["in other words","다시 말해"],["hide","가리다, 숨기다"],["reveals","드러내다"],["experienced","겪었다"]],[["share","함께 갖다"],["identical","똑같은"],["satisfies","만족시키다"],["divides","(divide A into B) A를 B로 가르다"],["critics","비판하는 사람들"]],[["come mainly from","주로 ~에게서 나오다"],["feel strongly","느낌이 강하다"],["mixes","(mix A into B) A를 섞어 B로 만들다"],["delight","큰 기쁨"],["middle score","가운데 점수"]],[["None of this","이 가운데 어느 것도 ~않다"],["useless","쓸모없는"],["rates","평가하다, 점수를 매기다"],["best avoided","피하는 것이 가장 좋은"]],[["nevertheless","그렇더라도"],["do better to","~하는 편이 더 낫다"],["distributed","퍼져 있는, 분포된"],["rely on","~에 기대다"],["happens to","어쩌다 ~하다"]]],"rwhy":["Most online buyers(온라인으로 사는 사람들 대부분)가 하는 일과 그 속 생각(assuming ~)을 먼저 내놓아요. 글쓴이가 뒤에서 넘어서려는 생각이라 반대쪽이에요.","however가 있지만 주장이 아니라 one consumer group(한 소비자 단체)이 살펴본 일이에요. 사례라 예시예요. (1)의 생각과 어긋나는 결과로 주장을 받치니 근거로 골라도 맞아요.","They는 (2)의 가장 자주 반품된 물건들이에요. 같은 조사에서 이어지는 내용이라 예시예요. 평균이 가리는 것이 무엇인지 보여 주어 주장을 받치니 근거로 골라도 맞아요.","in other words(다시 말해)로 (2)(3)의 사례를 한마디로 풀어 글쓴이의 생각을 밝혀요. 평균 하나가 드러내는 만큼 가린다는 이 말이 주장이에요.","같은 별 넷이라도 속은 전혀 다를 수 있다는 까닭을 대요. 평균이 가린다는 주장을 받치니 근거예요.","also(또)로 까닭을 하나 더 대요. 평균이 실제로는 거의 아무도 주지 않은 가운데 점수가 될 수 있다는 점이 주장을 받치니 근거예요.","None of this makes ratings useless(그렇다고 별점이 쓸모없다는 것은 아니다)로 한 걸음 물러서요. 별점을 믿는 쪽의 옳은 면을 인정하는 말이라 반대쪽이에요.","nevertheless(그렇더라도)로 (7)의 인정을 넘어 글을 끝맺어요. 평균보다 퍼진 모양을 보라는 말로 (4)를 행동으로 옮겨 마무리하니 결론이에요. 글쓴이의 생각을 다시 밝히는 말이라 주장으로 골라도 맞아요."]},{"id":"MP2","title":"헌 옷 기부의 행방","sents":[["Many people who drop a bag of old clothes at a thrift store assume that someone in their own town will soon be wearing them.","반대쪽","헌 옷 기부 → 이웃이 입을 것(흔한 생각)"],["In fact, shops in wealthy countries can sell only a small share of what they receive, because donations arrive far faster than local buyers appear.","근거","가게 → 받은 것의 일부만 팖"],["Most of the rest is sold by weight to dealers, who ship it abroad or turn it into cleaning material.","근거","나머지 → 무게로 팔려 수출 · 걸레"],["One charity in a port city, for instance, reported that barely a tenth of its donated clothing ever reached the shelves of its own store.","예시","한 단체 → 열에 하나만 매장에 놓임",["근거"]],["Donating, then, is less a gift to a neighbor than a way of passing the problem of excess clothing to someone else.","주장","기부 → 선물보다 남는 옷 떠넘기기"],["This is not to say that a donated coat is wasted, since even exported clothing is often worn again, which is more than can be said for clothing thrown in the trash.","반대쪽","기부한 옷 → 버리는 것보다는 나음"],["But the sheer volume of donations shows that the trouble begins earlier, at the moment people purchase clothes they will wear only a few times.","근거","문제의 시작 → 몇 번 안 입을 옷을 살 때",["주장"]],["The most generous act, therefore, may be to buy fewer clothes in the first place and to keep each one in use for years.","결론","가장 좋은 일 → 덜 사고 오래 입기",["주장"]]],"line":"헌 옷을 기부하면 이웃이 입을 것 같지만, 가게는 받은 것의 일부만 팔고 나머지는 무게로 팔려 나간다. 기부는 남는 옷 문제를 남에게 넘기는 일에 가까우니, 처음부터 덜 사고 오래 입는 것이 가장 좋다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["buying fewer clothes as a better gift than donating them","selling clothes abroad as a fairer use than local resale","donating to small local shops as a way to reach neighbors","recycling worn clothes into cloth as a cure for waste","giving only one's best clothes as the mark of real charity"],"ans":0,"why":"한 줄의 「처음부터 덜 사고 오래 입는 것이 가장 좋다」가 정답(buying fewer clothes as a better gift than donating them)과 같아요. 「selling clothes abroad as a fairer use than local resale」는 (3)의 낱말을 옮겼지만 글은 수출이 더 낫다고 하지 않아요. 수출은 팔리지 않은 나머지가 가는 길일 뿐이에요(ship it abroad). 「donating to small local shops as a way to reach neighbors」는 (1)의 흔한 생각 쪽이에요. 가게는 받은 것의 적은 몫만 팔 수 있어요(can sell only a small share of what they receive). 「recycling worn clothes into cloth as a cure for waste」는 (3)의 cleaning material에 끌린 말인데, 글은 그것을 해결책으로 내놓지 않아요. 문제는 옷을 사는 순간에 시작된다고 해요(the trouble begins earlier). 「giving only one's best clothes as the mark of real charity」는 그럴듯한 말이지만 글에 없어요. 글은 좋은 옷을 골라 주라는 것이 아니라 덜 사라고 해요(buy fewer clothes in the first place).","tip":"(2)의 In fact와 (3)은 주장이 아니라 사실을 대는 근거예요. 주장은 (5)의 then(그러니)에서 나와요. (6)에서 한 걸음 물러섰다가 (7)의 But으로 돌아와, (8)의 therefore로 덜 사고 오래 입자는 결론을 맺어요.","ko":["중고품 자선 가게에 헌 옷 한 봉지를 가져다 놓는 사람들은 대개 자기 동네의 누군가가 곧 그 옷을 입게 될 것이라고 여긴다.","사실 부유한 나라의 가게들은 받은 것의 적은 몫만 팔 수 있는데, 기부 물품이 동네에서 살 사람이 나타나는 것보다 훨씬 빨리 들어오기 때문이다.","나머지의 대부분은 무게로 달아 상인들에게 팔리고, 상인들은 그것을 외국으로 실어 보내거나 청소용 재료로 만든다.","예를 들어 한 항구 도시의 자선 단체는 기부받은 옷 가운데 겨우 10분의 1만이 자기 매장의 진열대에 놓였다고 밝혔다.","그러니 기부는 이웃에게 주는 선물이라기보다 남아도는 옷이라는 문제를 다른 누군가에게 넘기는 방법이다.","그렇다고 기부한 외투가 헛되이 버려진다는 말은 아닌데, 수출된 옷도 흔히 다시 입히니 쓰레기통에 버린 옷보다는 낫기 때문이다.","그러나 기부 물품의 그 엄청난 양은 문제가 더 일찍, 곧 사람들이 몇 번밖에 입지 않을 옷을 사는 순간에 시작된다는 것을 보여 준다.","따라서 가장 너그러운 행동은 애초에 옷을 덜 사고 한 벌 한 벌을 여러 해 동안 입는 것일지 모른다."],"words":[[["drop","가져다 놓다"],["thrift store","중고품 자선 가게(기부받은 물건을 파는 가게)"],["assume","~라고 여기다"]],[["wealthy","부유한"],["share","몫, 부분"],["donations","기부 물품"],["local","그 지역의"]],[["the rest","나머지"],["by weight","무게로 달아"],["dealers","상인들"],["ship","(배 등으로) 실어 보내다"],["cleaning material","청소용 재료(걸레 따위)"]],[["port city","항구 도시"],["for instance","예를 들어"],["barely","겨우"],["a tenth","10분의 1"],["shelves","진열대, 선반"]],[["less","(less A than B) A라기보다 B"],["passing","넘기기(pass)"],["excess","남아도는"]],[["This is not to say that","그렇다고 ~라는 말은 아니다"],["wasted","헛되이 버려진"],["exported","수출된"],["trash","쓰레기(통)"]],[["sheer","엄청난, 순전한"],["volume","양"],["purchase","사다"],["at the moment","~하는 순간에"]],[["generous","너그러운"],["therefore","따라서"],["in the first place","애초에"],["in use","쓰이는"]]],"rwhy":["Many people(많은 사람)이 품는 생각(assume ~)을 먼저 내놓아요. 글쓴이가 뒤에서 바로잡으려는 생각이라 반대쪽이에요.","In fact(사실)로 (1)의 생각과 어긋나는 사실을 대요. 가게가 적은 몫만 판다는 이 사실이 뒤에 나올 주장을 받치니 근거예요.","팔리지 않은 나머지가 어디로 가는지 이어서 밝혀요. 옷이 이웃에게 가지 않는다는 점을 받치는 사실이라 근거예요.","for instance(예를 들어)로 One charity(한 자선 단체)의 숫자를 들어요. 사례라 예시예요. 주장을 받치는 자료이니 근거로 골라도 맞아요.","then(그러니)으로 (2)~(4)의 사실에서 글쓴이의 생각을 끌어내요. 기부는 선물이라기보다 문제를 넘기는 일이라는 이 말이 주장이에요.","This is not to say that(그렇다고 ~라는 말은 아니다)으로 한 걸음 물러서요. 기부가 쓸모없지는 않다고 인정하는 말이라 반대쪽이에요.","But으로 (6)의 인정을 넘어, 문제가 옷을 사는 순간에 시작된다는 까닭을 대요. 뒤의 결론을 받치니 근거예요. 글쓴이의 생각을 밝히는 말이라 주장으로 골라도 맞아요.","therefore(따라서)로 글을 맺어요. 덜 사고 오래 입자는 말로 (5)의 주장을 행동으로 옮겨 마무리하니 결론이에요. 글쓴이의 생각을 다시 밝히니 주장으로 골라도 맞아요."]},{"id":"MP3","title":"항균 비누의 값어치","sents":[["For everyday handwashing at home, ordinary soap does the job just as well as soap sold as antibacterial.","주장","집 손 씻기 → 보통 비누로 충분"],["Buyers often reach for the antibacterial label anyway, reasoning that a product designed to kill germs must protect a family better.","반대쪽","소비자 → 항균 제품이 더 지켜 줄 거라 여김"],["Yet soap of any kind works mainly by lifting dirt and germs from the skin so that running water can carry them away.","근거","비누 → 죽이기보다 떼어 내 씻어 냄"],["The added chemicals, moreover, need far more contact time to kill bacteria than the few seconds most people spend at the sink.","근거","항균 성분 → 오래 닿아야 효과"],["When researchers compared households that were given one type or the other for a year, they found no difference in how often family members fell ill.","예시","두 비누 쓴 가정 → 아픈 횟수 차이 없음",["근거"]],["Stronger products do have a place in hospitals, where staff clean their hands before surgery under strict procedures.","반대쪽","센 제품 → 병원 수술 전엔 쓸모"],["At home, however, what matters is the washing itself: rubbing every surface of the hands for about twenty seconds.","근거","집에서는 → 20초 꼼꼼히 문지르기가 중요",["주장"]],["Families would therefore gain more from washing carefully with plain soap than from paying extra for a label.","결론","비싼 표시보다 → 보통 비누로 꼼꼼히",["주장"]]],"line":"항균 비누가 더 잘 지켜 줄 것 같지만, 비누는 균을 떼어 내 씻어 내는 것이고 항균 성분은 손 씻는 몇 초로는 효과가 없다. 집에서는 보통 비누로 꼼꼼히 씻는 것으로 충분하다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["washing hands more often as better protection than washing well","hospital-style hand cleaning as a habit worth copying at home","thorough washing with ordinary soap as all a home needs","a longer time at the sink as the price of truly clean hands","warm water rather than the kind of soap as the key to clean hands"],"ans":2,"why":"한 줄의 「집에서는 보통 비누로 꼼꼼히 씻는 것으로 충분하다」가 정답(thorough washing with ordinary soap as all a home needs)과 같아요. 「washing hands more often as better protection than washing well」는 그럴듯하지만 글에 없어요. 글이 중요하다고 한 것은 횟수가 아니라 씻는 일 자체, 곧 꼼꼼히 문지르는 것이에요(what matters is the washing itself). 「hospital-style hand cleaning as a habit worth copying at home」는 (6)에 끌린 말인데 거꾸로예요. 센 제품이 맞는 곳은 병원이고(do have a place in hospitals), (7)의 however 뒤는 집은 다르다고 해요. 「a longer time at the sink as the price of truly clean hands」는 (4)의 contact time에 끌린 말이지만 글은 더 오래 씻으라고 하지 않아요. 20초쯤 문지르면 된다고 해요(for about twenty seconds). 「warm water rather than the kind of soap as the key to clean hands」는 (3)의 running water에 끌린 말인데 글은 물의 온도를 말하지 않아요. 비누가 떼어 낸 것을 흐르는 물이 씻어 간다고 했을 뿐이에요(so that running water can carry them away).","tip":"이 글은 (1)에서 주장을 먼저 내놓아요. (2)의 사람들 생각을 (3)의 Yet이 뒤집지만, Yet 뒤는 새 주장이 아니라 (1)을 받치는 까닭이에요. (6)에서 병원 이야기로 한 걸음 물러섰다가 (7)의 however로 집 이야기로 돌아와 (8)에서 맺어요.","ko":["집에서 날마다 하는 손 씻기에는 보통 비누가 항균이라고 파는 비누만큼 제 몫을 해낸다.","그런데도 물건을 사는 사람들은 흔히 항균 표시가 붙은 것에 손을 뻗는데, 균을 죽이도록 만든 제품이 가족을 더 잘 지켜 줄 것이 틀림없다고 여기기 때문이다.","그러나 어떤 비누든 주로 때와 균을 살갗에서 떼어 내어 흐르는 물이 그것들을 씻어 갈 수 있게 하는 방식으로 일한다.","게다가 더해 넣은 화학 성분이 세균을 죽이려면, 대부분의 사람이 세면대에서 보내는 몇 초보다 훨씬 오래 닿아 있어야 한다.","연구자들이 한 해 동안 이쪽 또는 저쪽 비누를 받아 쓴 가정들을 견주었더니, 가족이 얼마나 자주 앓았는지에서 아무 차이도 찾지 못했다.","더 센 제품은 병원에서는 분명히 쓸모가 있는데, 그곳에서는 직원들이 엄격한 절차에 따라 수술 전에 손을 씻는다.","그러나 집에서 중요한 것은 씻는 일 그 자체, 곧 손의 모든 면을 20초쯤 문지르는 것이다.","따라서 가족들은 표시 하나에 돈을 더 내는 것보다 보통 비누로 꼼꼼히 씻는 데서 더 많은 것을 얻을 것이다."],"words":[[["ordinary","보통의"],["does the job","제 몫을 해내다"],["antibacterial","항균의"]],[["reach for","~에 손을 뻗다"],["label","표시, 상표"],["reasoning that","~라고 여기며"],["germs","균"]],[["lifting","떼어 내기, 들어 올리기"],["dirt","때"],["running water","흐르는 물"],["carry","(carry ~ away) ~을 씻어 가다"]],[["chemicals","화학 성분"],["moreover","게다가"],["contact time","닿아 있는 시간"],["bacteria","세균"],["sink","세면대"]],[["researchers","연구자들"],["households","가정"],["type","종류"],["fell ill","앓았다, 병이 났다"]],[["have a place","쓸모 있는 자리가 있다"],["surgery","수술"],["strict","엄격한"],["procedures","절차"]],[["what matters","중요한 것"],["rubbing","문지르기"],["surface","면, 겉"]],[["gain","얻다"],["plain","보통의, 아무것도 더하지 않은"],["paying extra","돈을 더 내기"]]],"rwhy":["글 첫머리에서 글쓴이의 생각을 바로 밝혀요. 집에서는 보통 비누가 항균 비누만큼 한다는 이 말이 주장이에요.","Buyers(물건을 사는 사람들)가 하는 일과 그 속 생각(reasoning that ~)이에요. 글쓴이가 넘어서려는 생각이라 반대쪽이에요.","Yet(그러나)으로 (2)의 생각에 맞서 비누가 일하는 방식을 대요. 주로 균을 죽이기보다 떼어 내 씻어 낸다는 이 사실이 (1)을 받치니 근거예요.","moreover(게다가)로 까닭을 하나 더 대요. 항균 성분이 일하려면 훨씬 오래 닿아야 한다는 점이 (1)을 받치니 근거예요.","researchers(연구자들)가 가정들을 견준 일이에요. 실제로 살펴본 사례라 예시예요. 차이가 없었다는 결과로 주장을 받치니 근거로 골라도 맞아요.","do have a place(쓸모 있는 자리가 분명히 있다)로 한 걸음 물러서요. 항균 제품 쪽의 옳은 면을 인정하는 말이라 반대쪽이에요.","however(그러나)로 (6)의 인정을 넘어 집에서는 씻는 일 자체가 중요하다는 까닭을 대요. 뒤의 결론을 받치니 근거예요. 글쓴이의 생각을 밝히는 말이라 주장으로 골라도 맞아요.","therefore(따라서)로 글을 맺어요. 표시에 돈을 더 내기보다 보통 비누로 꼼꼼히 씻으라는 말로 (1)을 다시 밝혀 마무리하니 결론이에요. 주장으로 골라도 맞아요."]},{"id":"MP4","title":"교대 시간의 빈틈","sents":[["At one chemical plant, a night operator noticed a small leak, meant to mention it, and went home; by the next afternoon the leak had shut down the whole line.","예시","야간 직원이 말 안 한 누출 → 이튿날 라인 멈춤"],["Incidents like this suggest that the most dangerous minutes in any workplace that runs day and night are those when one shift hands over to the next.","주장","가장 위험한 때 → 교대하며 넘겨주는 시간"],["The worker who is leaving carries hours of observations in memory, and whatever is not passed on leaves the building with that person.","근거","안 전한 정보 → 사람과 함께 떠남"],["The arriving worker, meanwhile, cannot ask about a problem that he or she does not know exists.","근거","새 근무자 → 모르는 문제는 못 물음"],["Managers sometimes argue that written logs already cover this gap and that a spoken handover only takes time away from the job.","반대쪽","관리자 → 기록지로 충분, 말로 넘기기는 시간 낭비"],["But when one hospital unit required nurses to go through a short list of fixed questions at every change of shift, medication errors fell by a quarter.","예시","정해진 질문으로 넘겨주기 → 투약 실수 4분의 1 줄어듦",["근거"]],["An aircraft maintenance crew that adopted a similar routine found that repeated repairs on the same part became rare.","예시","정비팀도 같은 방식 → 같은 부품 재수리 드묾",["근거"]],["A few structured minutes at the handover, in short, are not time lost but the cheapest safety measure a workplace can introduce.","결론","짜인 넘겨주기 몇 분 → 가장 값싼 안전 대책",["주장"]]],"line":"24시간 돌아가는 일터에서 가장 위험한 때는 근무조가 바뀌는 시간이다. 전하지 않은 정보는 사람과 함께 떠나기 때문이다. 정해진 틀로 몇 분 넘겨주는 것이 가장 값싼 안전 대책이다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["detailed written logs as the best bridge between two shifts","overlapping shifts by an hour as a guard against lost details","one worker's memory as a risk that machines should take over","fewer shift changes as the simplest way to prevent errors","a few fixed questions as the safest way to change shifts"],"ans":4,"why":"한 줄의 「정해진 틀로 몇 분 넘겨주는 것이 가장 값싼 안전 대책이다」가 정답(a few fixed questions as the safest way to change shifts)과 같아요. 「detailed written logs as the best bridge between two shifts」는 (5)의 관리자들 말 쪽이에요(written logs already cover this gap). (6)의 But 뒤가 그 생각을 되받아요. 「overlapping shifts by an hour as a guard against lost details」는 그럴듯한 해결책이지만 글에 없어요. 글이 내놓은 것은 시간을 겹치는 것이 아니라 정해진 질문 몇 가지예요(a short list of fixed questions). 「one worker's memory as a risk that machines should take over」는 (3)의 in memory에 끌린 말인데, 글은 기계에 맡기자고 하지 않아요. 사람이 짜임새 있게 전하게 하자는 거예요(A few structured minutes at the handover). 「fewer shift changes as the simplest way to prevent errors」는 (2)에서 짐작할 만하지만 글에 없어요. 글은 교대를 줄이자는 것이 아니라 교대하는 몇 분이 잃는 시간이 아니라고 해요(are not time lost).","tip":"(1)은 주장이 아니라 주장을 이끌어 내는 사례예요. 주장은 (2)의 Incidents like this suggest that 뒤에 나와요. (5)에서 관리자들의 반론을 들려준 뒤 (6)의 But과 두 사례로 되받고, (8)의 in short로 맺어요.","ko":["한 화학 공장에서 야간 운전원이 작은 누출을 알아차리고 말해 주려 했으나 그냥 집에 갔고, 이튿날 오후 무렵 그 누출은 생산 라인 전체를 멈춰 세웠다.","이런 사고들은 24시간 돌아가는 어느 일터에서든 가장 위험한 몇 분은 한 근무조가 다음 근무조에게 일을 넘겨주는 때임을 보여 준다.","떠나는 근무자는 몇 시간 동안 살핀 것을 기억 속에 담고 있고, 전해지지 않은 것은 무엇이든 그 사람과 함께 건물을 떠난다.","한편 도착하는 근무자는 있는 줄도 모르는 문제에 대해서는 물어볼 수가 없다.","관리자들은 때때로 글로 적은 기록지가 이미 이 틈을 메워 주며 말로 하는 인계는 일할 시간만 빼앗는다고 주장한다.","그러나 한 병동이 간호사들에게 근무조가 바뀔 때마다 정해진 질문 몇 가지를 차례로 짚게 하자, 투약 실수가 4분의 1 줄었다.","비슷한 절차를 받아들인 한 항공기 정비팀은 같은 부품을 되풀이해 수리하는 일이 드물어졌음을 알게 되었다.","요컨대 인계 때 틀을 갖춘 몇 분은 잃어버리는 시간이 아니라 일터가 들일 수 있는 가장 값싼 안전 대책이다."],"words":[[["chemical plant","화학 공장"],["operator","운전원, 기계를 다루는 사람"],["leak","누출, 새는 곳"],["meant to","~하려고 했다(mean to)"],["shut down","멈춰 세우다"]],[["incidents","사고, 사건"],["runs day and night","밤낮으로 돌아가다"],["shift","근무조, 교대 근무"],["hands over","(일을) 넘겨주다"]],[["carries","담고 있다, 지니다"],["observations","살핀 것, 관찰"],["passed on","전해진(pass on)"]],[["arriving","도착하는"],["meanwhile","한편"],["exists","있다, 존재하다"]],[["argue","주장하다"],["logs","기록지, 일지"],["cover this gap","이 틈을 메우다"],["handover","인계, 넘겨주기"]],[["unit","(병원의) 병동, 부서"],["required","~하게 했다, 요구했다"],["go through","차례로 짚다"],["medication errors","투약 실수"],["a quarter","4분의 1"]],[["maintenance crew","정비팀"],["adopted","받아들였다"],["routine","늘 하는 절차"],["rare","드문"]],[["structured","틀을 갖춘"],["in short","요컨대"],["safety measure","안전 대책"]]],"rwhy":["one chemical plant(한 화학 공장)에서 일어난 일을 들려줘요. 글쓴이의 생각이 아니라 장면 하나라 예시예요.","Incidents like this suggest that(이런 사고들은 ~을 보여 준다)으로 (1)의 사례에서 글쓴이의 생각을 끌어내요. 가장 위험한 때는 근무조가 바뀌는 때라는 이 말이 주장이에요.","왜 그때가 위험한지 까닭을 대요. 전하지 않은 것은 떠나는 사람과 함께 사라진다는 점이 (2)를 받치니 근거예요.","meanwhile(한편)로 받는 쪽의 사정을 까닭으로 하나 더 대요. 모르는 문제는 물을 수 없다는 점이 (2)를 받치니 근거예요.","Managers sometimes argue that(관리자들은 때때로 ~라고 주장한다)으로 다른 쪽 생각을 들려줘요. 글쓴이가 뒤에서 되받는 생각이라 반대쪽이에요.","But으로 (5)에 맞서 one hospital unit(한 병동)에서 있었던 일을 들어요. 사례라 예시예요. 실수가 줄었다는 결과로 주장을 받치니 근거로 골라도 맞아요.","An aircraft maintenance crew(한 항공기 정비팀)의 일을 하나 더 들어요. 사례라 예시예요. 주장을 받치는 결과이니 근거로 골라도 맞아요.","in short(요컨대)로 글을 맺어요. 틀을 갖춘 몇 분이 가장 값싼 안전 대책이라는 말로 (2)를 해결책으로 옮겨 마무리하니 결론이에요. 주장으로 골라도 맞아요."]},{"id":"MP5","title":"헷갈리면 넣지 않기","sents":[["When they are not sure whether an item can be recycled, many residents drop it in the recycling bin, trusting that the sorting plant will work it out.","반대쪽","헷갈리면 → 일단 재활용 통에(흔한 버릇)"],["This hopeful habit, however well meant, does more harm than throwing the doubtful item in the trash.","주장","일단 넣기 → 그냥 버리는 것보다 해로움"],["A single food-covered container or half-full bottle can soil a whole load of clean paper, which then has to be burned or buried.","근거","더러운 것 하나 → 깨끗한 종이 한 무더기 못 씀"],["Workers at one regional plant say that plastic bags wrapped around the machines force them to stop the line several times a shift.","예시","한 처리장 → 비닐봉지 탓에 라인 자주 멈춤",["근거"]],["Every such delay raises the cost of recycling, and a town that finds the bill too high may abandon the program altogether.","근거","멈출 때마다 비용 → 재활용 자체를 접을 수도"],["Admittedly, the rules differ from place to place and are rarely printed anywhere a busy person would look.","반대쪽","규칙 → 곳마다 다르고 찾기 어려움(인정)"],["Even so, a recycling bin is useful only when what goes into it is what the plant can actually process.","주장","재활용 통 → 처리할 수 있는 것만 담겨야 쓸모",["근거"]],["The safest rule for a household is therefore a plain one: when in doubt, leave it out.","결론","헷갈리면 → 넣지 않기",["주장"]]],"line":"재활용이 되는지 헷갈릴 때 일단 통에 넣는 버릇은 좋은 뜻이어도 해롭다. 깨끗한 것까지 못 쓰게 만들고 처리 비용을 올리기 때문이다. 헷갈리면 넣지 않는 것이 재활용을 돕는 길이다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["clearer labels on bins as the fix for well-meant mistakes","throwing doubtful items in the trash as a service to recycling","washing every container as the duty of a careful recycler","sorting by hand at the plant as the answer to mixed loads","recycling less often but more carefully as a way to cut costs"],"ans":1,"why":"한 줄의 「헷갈리면 넣지 않는 것이 재활용을 돕는 길이다」가 정답(throwing doubtful items in the trash as a service to recycling)과 같아요. 「clearer labels on bins as the fix for well-meant mistakes」는 (6)에서 짐작할 만한 해결책이지만 글에 없어요. 글쓴이는 규칙이 찾기 어렵다고 인정한 뒤(Admittedly), (7)의 Even so로 그래도 넣는 사람이 가려야 한다고 해요. 「washing every container as the duty of a careful recycler」는 (3)의 더러운 용기와 병에 끌린 말이지만 글은 씻으라고 하지 않아요. 헷갈리면 빼라고 해요(when in doubt, leave it out). 「sorting by hand at the plant as the answer to mixed loads」는 (1)의 믿음 쪽이에요. 선별장이 알아서 해 주리라는 믿음이 바로 글이 바로잡으려는 버릇이에요(trusting that the sorting plant will work it out). 「recycling less often but more carefully as a way to cut costs」는 (5)의 cost에 끌린 말인데 글에 없어요. 비용을 올리는 것은 재활용 횟수가 아니라 잘못 넣은 것 때문에 늦어지는 일이에요(Every such delay raises the cost of recycling).","tip":"(2)의 however는 「그러나」가 아니라 however well meant(아무리 좋은 뜻이라도)로 쓰였어요. however가 있어도 뜻이 다르니, (2)가 그대로 주장이에요. (6)의 Admittedly에서 한 걸음 물러섰다가 (7)의 Even so로 돌아와, (8)의 therefore로 맺어요.","ko":["어떤 물건이 재활용되는지 확실하지 않을 때, 많은 주민은 선별장이 알아서 가려 줄 것이라 믿고 그것을 재활용 통에 넣는다.","이 희망 섞인 버릇은 아무리 좋은 뜻에서 나왔더라도, 미심쩍은 물건을 쓰레기통에 버리는 것보다 더 큰 해를 끼친다.","음식물이 묻은 용기 하나나 반쯤 찬 병 하나가 깨끗한 종이 한 무더기 전체를 더럽힐 수 있고, 그러면 그 종이는 태우거나 묻어야 한다.","한 지역 처리장의 일꾼들은 기계에 감긴 비닐봉지 때문에 한 근무 동안 여러 번 라인을 세워야 한다고 말한다.","그렇게 늦어질 때마다 재활용 비용이 오르고, 청구서가 너무 비싸다고 여기는 마을은 그 사업을 아예 그만둘 수도 있다.","인정하건대 규칙은 곳마다 다르고, 바쁜 사람이 볼 만한 곳에는 좀처럼 적혀 있지 않다.","그렇더라도 재활용 통은 그 안에 들어가는 것이 처리장이 실제로 처리할 수 있는 것일 때에만 쓸모가 있다.","따라서 가정에서 지킬 가장 안전한 규칙은 간단하다. 헷갈리면 넣지 않는 것이다."],"words":[[["not sure","확실하지 않은"],["residents","주민들"],["recycling bin","재활용 통"],["sorting plant","선별장"],["work it out","알아서 해결하다"]],[["however well meant","아무리 좋은 뜻이라도"],["harm","해"],["doubtful","미심쩍은"]],[["food-covered","음식물이 묻은"],["container","용기, 그릇"],["soil","더럽히다"],["load","한 무더기, 한 짐"],["buried","묻힌(bury)"]],[["regional","지역의"],["wrapped around","~에 감긴"],["machines","기계"],["force","(어쩔 수 없이) ~하게 하다"]],[["delay","늦어짐"],["bill","청구서, 비용"],["abandon","그만두다, 버리다"],["altogether","아예, 완전히"]],[["Admittedly","인정하건대"],["differ","다르다"],["rarely","좀처럼 ~않다"]],[["Even so","그렇더라도"],["actually","실제로"],["process","처리하다"]],[["household","가정"],["plain","간단한, 꾸밈없는"],["when in doubt","헷갈릴 때는"],["leave it out","빼 두다, 넣지 않다"]]],"rwhy":["many residents(많은 주민)가 하는 일과 그 속 믿음(trusting that ~)을 먼저 내놓아요. 글쓴이가 바로잡으려는 버릇이라 반대쪽이에요.","(1)의 버릇을 This hopeful habit으로 받아 글쓴이의 판단을 밝혀요. 그냥 버리는 것보다 더 해롭다는 이 말이 주장이에요. however는 여기서 「그러나」가 아니라 「아무리 ~라도」예요.","왜 해로운지 까닭을 대요. 더러운 것 하나가 깨끗한 종이 한 무더기를 못 쓰게 한다는 점이 (2)를 받치니 근거예요.","one regional plant(한 지역 처리장)의 일꾼들이 겪는 일이에요. 사례라 예시예요. 해롭다는 주장을 받치는 일이니 근거로 골라도 맞아요.","Every such delay(그렇게 늦어질 때마다)로 (4)를 받아 까닭을 하나 더 대요. 비용이 올라 재활용 자체가 사라질 수 있다는 점이 (2)를 받치니 근거예요.","Admittedly(인정하건대)로 한 걸음 물러서요. 규칙이 헷갈린다는, 일단 넣는 사람 쪽의 사정을 인정하는 말이라 반대쪽이에요.","Even so(그렇더라도)로 (6)의 인정을 넘어 글쓴이의 생각을 다시 밝혀요. 통은 처리할 수 있는 것만 담겨야 쓸모 있다는 말이라 주장이에요. 결론을 받치는 까닭이기도 하니 근거로 골라도 맞아요.","therefore(따라서)로 글을 맺어요. 헷갈리면 넣지 말라는 규칙으로 (2)를 행동으로 옮겨 마무리하니 결론이에요. 주장으로 골라도 맞아요."]},{"id":"MP6","title":"벌통보다 풀밭 한 뼘","sents":[["Alarmed by reports that bees are disappearing, companies and schools have begun placing honeybee hives on their roofs.","반대쪽","벌 줄어든다는 소식 → 옥상에 꿀벌 통 놓기"],["The gesture seems obviously helpful, since more hives mean more bees.","반대쪽","벌통 늘면 벌 늘어 → 도움 될 듯(겉보기)"],["The bees in real trouble, however, are not honeybees, which farmers raise by the million, but the hundreds of wild species, most of which live alone in soil and dead wood.","주장","위기인 벌 → 꿀벌 아닌 야생 벌"],["Because a single hive holds tens of thousands of workers, it can strip nearby flowers of the pollen that wild bees depend on.","근거","벌통 하나 → 야생 벌 먹이 꽃가루 쓸어 감"],["In one city park, the number of wild bee species recorded fell after the number of hives on nearby roofs increased sharply.","예시","한 공원 → 옥상 벌통 늘자 야생 벌 종 줄어듦",["근거"]],["Wild bees also need things a hive cannot offer: bare ground, hollow stems, and flowers that open from early spring to late fall.","근거","야생 벌 → 맨땅 · 빈 줄기 · 철마다 피는 꽃 필요"],["A school that left one corner of its grounds uncut and planted native flowers counted twice as many kinds of bees within two summers.","예시","한쪽 안 깎고 토종 꽃 심은 학교 → 벌 종류 두 배",["근거"]],["Anyone hoping to help bees, then, should start not with a hive but with a piece of ground left a little wild.","결론","벌 도우려면 → 벌통보다 야생으로 둔 땅",["주장"]]],"line":"벌이 사라진다며 옥상에 꿀벌 통을 놓지만, 정작 위기인 것은 꿀벌이 아니라 야생 벌이고 벌통은 오히려 그 먹이를 빼앗는다. 벌을 도우려면 벌통보다 야생으로 둔 땅 한 뼘이 필요하다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["more rooftop hives as the quickest way to bring bees back","moving hives out of cities as protection for honeybees","planting flowers beside hives as food for every kind of bee","leaving a corner of ground untended as the best aid to bees","raising wild bees in hives as a new task for beekeepers"],"ans":3,"why":"한 줄의 「벌을 도우려면 벌통보다 야생으로 둔 땅 한 뼘이 필요하다」가 정답(leaving a corner of ground untended as the best aid to bees)과 같아요. 「more rooftop hives as the quickest way to bring bees back」는 (1)(2)의 겉보기 생각 쪽이에요. (3)의 however 뒤가 뒤집어요(The bees in real trouble, however, are not honeybees). 「moving hives out of cities as protection for honeybees」는 지킬 대상이 바뀌었어요. 어려움에 놓인 것은 꿀벌이 아니라 야생 벌이에요(the hundreds of wild species). 「planting flowers beside hives as food for every kind of bee」는 (7)의 꽃 심기에 끌린 말인데, 벌통 곁이면 꿀벌이 꽃가루를 쓸어 가요(strip nearby flowers of the pollen). 「raising wild bees in hives as a new task for beekeepers」는 그럴듯하지만 글과 어긋나요. 야생 벌은 홀로 흙과 죽은 나무에 살고(live alone in soil and dead wood), 벌통이 줄 수 없는 것이 필요해요(things a hive cannot offer).","tip":"(1)(2)는 사람들이 하는 일과 그 겉보기 생각이에요. (3)의 however 뒤에서 not A but B로 주장이 나와요(꿀벌이 아니라 야생 벌). 그 뒤는 까닭과 사례가 번갈아 나오고, (8)의 then에서 다시 not A but B로 맺어요.","ko":["벌이 사라지고 있다는 보도에 놀라, 회사와 학교들이 옥상에 꿀벌 통을 놓기 시작했다.","이런 행동은 분명히 도움이 될 것처럼 보이는데, 벌통이 많아지면 벌도 많아지기 때문이다.","그러나 정말로 어려움에 놓인 벌은 농부들이 수백만 마리씩 기르는 꿀벌이 아니라, 대부분 흙과 죽은 나무에서 홀로 사는 수백 종의 야생 벌이다.","벌통 하나가 수만 마리의 일벌을 품고 있기 때문에, 벌통은 야생 벌이 기대어 사는 꽃가루를 가까운 꽃들에서 쓸어 갈 수 있다.","한 도시 공원에서는 가까운 옥상들의 벌통 수가 크게 늘어난 뒤 기록된 야생 벌 종의 수가 줄었다.","야생 벌에게는 벌통이 줄 수 없는 것들도 필요하다. 맨땅, 속이 빈 줄기, 그리고 이른 봄부터 늦가을까지 피는 꽃이다.","마당 한쪽 구석의 풀을 깎지 않고 두고 토종 꽃을 심은 어느 학교에서는 두 번의 여름 안에 벌의 종류가 두 배로 세어졌다.","그러니 벌을 돕고 싶은 사람은 누구나 벌통이 아니라 조금 야생으로 남겨 둔 땅 한 뼘에서 시작해야 한다."],"words":[[["Alarmed by","~에 놀라"],["disappearing","사라지고 있는"],["honeybee hives","꿀벌 통"]],[["gesture","(뜻을 보이는) 행동"],["obviously","분명히"],["hives","벌통"]],[["in real trouble","정말로 어려움에 놓인"],["raise","기르다"],["by the million","수백만 마리씩"],["species","(생물의) 종"],["dead wood","죽은 나무"]],[["holds","품고 있다"],["strip","(strip A of B) A에서 B를 쓸어 가다"],["pollen","꽃가루"],["depend on","~에 기대어 살다"]],[["recorded","기록된"],["nearby roofs","가까운 옥상들"],["sharply","크게, 가파르게"]],[["bare ground","맨땅"],["hollow stems","속이 빈 줄기"],["open","(꽃이) 피다"]],[["grounds","(학교) 터, 마당"],["uncut","(풀을) 깎지 않은"],["native","토종의"],["counted","세었다"]],[["then","그러니"],["hoping to","~하고 싶은"],["piece","(땅) 한 뼘, 조각"]]],"rwhy":["companies and schools(회사와 학교들)가 벌을 도우려고 하는 일이에요. 글쓴이가 뒤에서 넘어서려는 쪽의 행동이라 반대쪽이에요.","seems obviously helpful(분명히 도움이 될 것처럼 보인다)로 그 행동 뒤의 생각을 들려줘요. 겉보기 생각이라 반대쪽이에요.","however(그러나)로 (1)(2)를 뒤집어 글쓴이의 생각을 밝혀요. 위기인 것은 꿀벌이 아니라 야생 벌이라는 이 말이 주장이에요.","Because로 까닭을 대요. 벌통 하나가 야생 벌의 먹이인 꽃가루를 쓸어 갈 수 있다는 점이 (3)을 받치니 근거예요.","one city park(한 도시 공원)에서 기록된 일이에요. 사례라 예시예요. 벌통이 늘자 야생 벌 종이 줄었다는 결과로 주장을 받치니 근거로 골라도 맞아요.","also(또)로 까닭을 하나 더 대요. 야생 벌에게는 벌통이 줄 수 없는 살 곳과 꽃이 필요하다는 점이 (3)을 받치니 근거예요.","A school(어느 학교)에서 있었던 일이에요. 사례라 예시예요. (6)을 실제로 보여 주어 주장을 받치니 근거로 골라도 맞아요.","then(그러니)으로 글을 맺어요. 벌통이 아니라 야생으로 둔 땅에서 시작하라는 말로 (3)을 행동으로 옮겨 마무리하니 결론이에요. 주장으로 골라도 맞아요."]},{"id":"MP7","title":"면접 5분의 착각","sents":[["A hiring manager once admitted that she usually knew within five minutes whether she would offer a candidate the job.","예시","한 채용 담당자 → 5분 안에 마음 정함",["반대쪽"]],["Many employers share her confidence, believing that a relaxed conversation reveals character better than any test.","반대쪽","고용주들 → 편한 대화가 사람됨 드러낸다고 믿음"],["Decades of research, however, show that such unplanned interviews predict later job performance only weakly.","근거","연구 → 짜이지 않은 면접은 성과 잘 못 맞힘"],["Interviewers tend to favor people who resemble themselves, and a first impression colors everything they hear later.","근거","면접관 → 닮은 사람 좋아함 · 첫인상이 뒤를 물들임"],["A fairer and more accurate method is to ask every candidate the same questions and to have them perform a sample of the actual work.","주장","더 나은 방법 → 같은 질문 + 실제 일 시켜 보기"],["One software firm that replaced open conversation with a two-hour trial task found that its new employees stayed longer and needed less extra training.","예시","시험 과제로 바꾼 회사 → 신입이 오래 다니고 추가 교육 줄어듦",["근거"]],["Some managers object that such a process feels cold and gives them no sense of whether a person will fit the team.","반대쪽","일부 관리자 → 차갑고 팀에 맞는지 모름"],["Yet a feeling of fit is exactly what misleads interviewers, and a job should go to the person who has shown the ability to do it.","결론","「맞는 느낌」이 오판의 씨 → 일할 수 있는 사람에게",["주장"]]],"line":"많은 고용주가 편한 대화로 사람을 알아본다고 믿지만, 짜이지 않은 면접은 첫인상과 닮은 사람에게 끌려 성과를 잘 맞히지 못한다. 모두에게 같은 질문을 하고 실제 일을 시켜 보는 것이 더 공정하고 정확하다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["identical questions and a work sample as the fairest way to hire","a longer, friendlier conversation as the best test of character","several interviewers instead of one as a check on first impressions","team fit before skill as the wiser order in hiring","a trial month on the job as the only honest interview"],"ans":0,"why":"한 줄의 「모두에게 같은 질문을 하고 실제 일을 시켜 보는 것이 더 공정하고 정확하다」가 정답(identical questions and a work sample as the fairest way to hire)과 같아요. 「a longer, friendlier conversation as the best test of character」는 (2)의 고용주들 믿음 쪽이에요. (3)의 연구는 그런 면접이 성과를 약하게만 맞힌다고 해요(predict later job performance only weakly). 「several interviewers instead of one as a check on first impressions」는 (4)에서 짐작할 만한 해결책이지만 글에 없어요. 글이 내놓은 방법은 면접관 수가 아니라 같은 질문과 실제 일이에요(a sample of the actual work). 「team fit before skill as the wiser order in hiring」는 (7)의 일부 관리자들 쪽이에요. (8)이 맞는 느낌이야말로 판단을 그르친다고 해요(a feeling of fit is exactly what misleads). 「a trial month on the job as the only honest interview」는 (6)의 trial task에 끌려 부풀린 말이에요. 그 회사가 쓴 것은 두 시간짜리 과제였어요(a two-hour trial task).","tip":"(3)에 however가 있지만 그 뒤는 주장이 아니라 연구가 보여 준 사실, 곧 근거예요. 주장은 까닭을 다 댄 뒤 (5)에서 신호 말 없이 나와요. (7)의 반론을 (8)의 Yet으로 되받으며 맺어요.","ko":["한 채용 담당자는 지원자에게 그 일자리를 줄지 말지를 대개 5분 안에 안다고 털어놓은 적이 있다.","많은 고용주가 그녀와 같은 자신감을 갖고 있으며, 편안한 대화가 어떤 시험보다 사람됨을 더 잘 드러낸다고 믿는다.","그러나 수십 년의 연구는 그렇게 미리 짜이지 않은 면접이 나중의 업무 성과를 약하게만 맞힌다는 것을 보여 준다.","면접관은 자기와 닮은 사람을 좋게 보는 경향이 있고, 첫인상은 그 뒤에 듣는 모든 것을 물들인다.","더 공정하고 더 정확한 방법은 모든 지원자에게 같은 질문을 하고 실제 업무의 한 부분을 직접 해 보게 하는 것이다.","자유로운 대화를 두 시간짜리 시험 과제로 바꾼 한 소프트웨어 회사는 새 직원들이 더 오래 다니고 추가 교육이 덜 필요하다는 것을 알게 되었다.","일부 관리자는 그런 과정이 차갑게 느껴지고, 어떤 사람이 팀에 맞을지에 대한 감을 전혀 주지 못한다고 반대한다.","하지만 맞는다는 느낌이야말로 바로 판단을 그르치는 것이며, 일자리는 그 일을 해낼 능력을 보여 준 사람에게 돌아가야 한다."],"words":[[["hiring manager","채용 담당자"],["admitted","털어놓았다, 인정했다"],["candidate","지원자"]],[["employers","고용주들"],["confidence","자신감"],["reveals","드러내다"],["character","사람됨, 성격"]],[["Decades","수십 년"],["unplanned","미리 짜이지 않은"],["predict","맞히다, 예측하다"],["performance","성과"]],[["favor","좋게 보다"],["resemble","닮다"],["first impression","첫인상"],["colors","물들이다"]],[["accurate","정확한"],["method","방법"],["perform","해 보이다, 수행하다"],["sample","(실제 일의) 일부, 맛보기"]],[["replaced","(replace A with B) A를 B로 바꾸었다"],["trial task","시험 과제"],["extra training","추가 교육"]],[["object","반대하다"],["process","과정"],["sense","감, 느낌"],["fit","~에 맞다"]],[["fit","맞음, 어울림"],["misleads","판단을 그르치다"],["ability","능력"]]],"rwhy":["A hiring manager(한 채용 담당자)가 한 말을 들려줘요. 글쓴이의 생각이 아니라 한 사람의 이야기라 예시예요. 바로 뒤 (2)가 받는 믿음(her confidence)을 보여 주는 말이니 반대쪽으로 골라도 맞아요.","Many employers(많은 고용주)가 품은 믿음(believing that ~)이에요. 글쓴이가 넘어서려는 생각이라 반대쪽이에요.","however(그러나)가 있지만 글쓴이의 주장이 아니라 연구가 보여 준 사실이에요. (2)의 믿음이 틀렸음을 받치고 뒤의 주장을 떠받치니 근거예요.","왜 그런 면접이 잘 맞히지 못하는지 까닭을 대요. 닮은 사람에게 끌리고 첫인상에 물든다는 점이 뒤의 주장을 받치니 근거예요.","신호 말 없이 글쓴이가 내놓는 방법이에요(A fairer and more accurate method is ~). 같은 질문과 실제 일의 맛보기로 뽑자는 이 말이 주장이에요.","One software firm(한 소프트웨어 회사)에서 있었던 일이에요. 사례라 예시예요. 그 방법이 통했다는 결과로 주장을 받치니 근거로 골라도 맞아요.","Some managers object that(일부 관리자는 ~라고 반대한다)으로 다른 쪽 생각을 들려줘요. 글쓴이가 바로 뒤에서 되받는 생각이라 반대쪽이에요.","Yet(하지만)으로 (7)을 되받으며 글을 맺어요. 일자리는 해낼 수 있는 사람에게 가야 한다는 말로 (5)를 다시 밝혀 마무리하니 결론이에요. 주장으로 골라도 맞아요."]},{"id":"MP8","title":"무료 반품의 값","sents":[["Free returns, which online stores advertise as a favor to customers, carry costs that someone eventually has to pay.","주장","무료 반품 → 누군가 치르는 비용 있음"],["One clothing retailer found that a third of its packages came back, many from shoppers who had ordered three sizes intending to keep one.","예시","한 의류 업체 → 셋 중 하나 반품(여러 치수 주문)",["근거"]],["Each returned item must be shipped, inspected, cleaned and packed again, which often costs more than the item can be sold for.","근거","반품 처리비 → 되팔 값보다 큼"],["Many returns therefore never go back on sale but are sold off cheaply in bulk or simply destroyed.","근거","반품된 것 → 헐값 처분 · 폐기"],["Retailers defend the policy on the grounds that shoppers who cannot touch a product need some protection against a poor choice.","반대쪽","업체 → 못 만져 보고 사니 보호 필요"],["That is reasonable, but the expense does not disappear; it is quietly built into the prices that every customer pays, including those who return nothing.","근거","비용 → 모두의 값에 얹힘(안 돌려보내는 사람도)",["주장"]],["When one store began charging a small fee per return, returns fell by half while sales barely moved.","예시","반품 수수료 조금 → 반품 반으로, 매출 그대로",["근거"]],["A small charge, it seems, would make shoppers choose more carefully and spare everyone the price of a service that was never really free.","결론","적은 수수료 → 신중히 고르게, 모두의 부담 덜어 줌",["주장"]]],"line":"무료 반품은 공짜가 아니다. 돌아온 물건은 처리비가 되팔 값보다 커서 버려지기도 하고, 그 비용은 모든 손님의 값에 얹힌다. 적은 수수료를 받으면 신중히 고르게 되어 모두의 부담이 준다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["longer return periods as a way to make shoppers choose calmly","store credit instead of refunds as a brake on careless orders","reselling returned goods at a discount as an end to waste","higher prices for all as the fair cost of generous returns","a small charge per return as a relief for every customer"],"ans":4,"why":"한 줄의 「적은 수수료를 받으면 신중히 고르게 되어 모두의 부담이 준다」가 정답(a small charge per return as a relief for every customer)과 같아요. 「longer return periods as a way to make shoppers choose calmly」는 그럴듯한 해결책이지만 글에 없어요. 글이 내놓은 것은 기간이 아니라 수수료예요(charging a small fee per return). 「store credit instead of refunds as a brake on careless orders」도 글에 없는 방법이에요. 글에서 반품을 절반으로 줄인 것은 적은 수수료였어요(returns fell by half). 「reselling returned goods at a discount as an end to waste」는 (4)의 sold off에 끌린 말인데, 글은 되파는 값보다 처리비가 더 든다고 해요(costs more than the item can be sold for). 「higher prices for all as the fair cost of generous returns」는 (6)의 낱말을 옮겼지만 거꾸로예요. 글은 아무것도 돌려보내지 않는 사람까지 그 값을 내는 것을 문제로 봐요(including those who return nothing).","tip":"이 글은 (1)에서 주장을 먼저 내놓아요. (4)의 therefore는 결론이 아니라 (3)에서 이어지는 사실이에요. (5)의 업체 쪽 말을 (6)에서 That is reasonable, but으로 받아넘기고, (8)의 it seems로 조심스럽게 맺어요.","ko":["온라인 가게들이 손님에게 베푸는 친절이라고 광고하는 무료 반품에는 결국 누군가가 치러야 하는 비용이 따른다.","한 의류 소매업체는 보낸 소포의 3분의 1이 되돌아온다는 것을 알게 되었는데, 그 가운데 많은 것은 하나만 가질 생각으로 세 가지 치수를 주문한 손님들에게서 왔다.","반품된 물건은 하나하나 실어 나르고, 살펴보고, 손질하고, 다시 포장해야 하는데, 여기에는 흔히 그 물건을 되팔아 받을 수 있는 값보다 더 많은 돈이 든다.","그래서 많은 반품은 다시 진열되지 못하고 한꺼번에 헐값에 넘겨지거나 그냥 폐기된다.","소매업체들은 제품을 만져 볼 수 없는 손님에게는 잘못된 선택을 막아 줄 보호가 얼마간 필요하다는 까닭을 들어 이 정책을 옹호한다.","그 말은 일리가 있지만 비용이 사라지는 것은 아니다. 그 비용은 아무것도 돌려보내지 않는 사람을 포함해 모든 손님이 내는 값에 조용히 얹힌다.","한 가게가 반품 한 건마다 적은 수수료를 받기 시작하자, 매출은 거의 움직이지 않은 채 반품이 절반으로 줄었다.","적은 수수료는 손님들이 더 신중하게 고르게 하고, 실은 한 번도 공짜인 적이 없던 서비스의 값을 모두가 치르지 않게 해 줄 것으로 보인다."],"words":[[["returns","반품"],["advertise","광고하다"],["carry costs","비용이 따르다"],["eventually","결국"]],[["retailer","소매업체"],["a third","3분의 1"],["packages","소포"],["intending to","~할 생각으로"]],[["shipped","실어 나른"],["inspected","살펴본(검사된)"],["packed again","다시 포장된"]],[["go back on sale","다시 진열되다, 다시 팔리다"],["sold off","헐값에 넘겨진"],["in bulk","한꺼번에, 대량으로"],["destroyed","폐기된"]],[["defend","옹호하다"],["policy","정책"],["on the grounds that","~라는 까닭으로"],["protection","보호"]],[["reasonable","일리 있는"],["expense","비용"],["disappear","사라지다"],["built into","~에 얹힌, 포함된"]],[["charging","(돈을) 받기"],["fee","수수료"],["barely","거의 ~않다"]],[["charge","요금, 수수료"],["it seems","~인 것으로 보인다"],["spare","(spare A B) A가 B를 겪지 않게 해 주다"]]],"rwhy":["글 첫머리에서 글쓴이의 생각을 바로 밝혀요. 무료 반품에는 누군가 치러야 할 비용이 따른다는 이 말이 주장이에요.","One clothing retailer(한 의류 소매업체)가 알게 된 일이에요. 사례라 예시예요. 반품이 얼마나 많은지 보여 주어 주장을 받치니 근거로 골라도 맞아요.","왜 비용이 드는지 까닭을 대요. 반품 하나하나를 처리하는 값이 되팔 값보다 크다는 점이 (1)을 받치니 근거예요.","therefore(그래서)가 있지만 글의 결론이 아니라 (3)에서 이어지는 사실이에요. 많은 반품이 처분되거나 폐기된다는 점이 (1)을 받치니 근거예요.","Retailers defend the policy(소매업체들은 이 정책을 옹호한다)로 다른 쪽 생각을 들려줘요. 글쓴이가 뒤에서 받아넘기는 생각이라 반대쪽이에요.","That is reasonable, but(일리가 있지만)으로 (5)를 받아넘기고 비용이 모든 손님의 값에 얹힌다는 까닭을 대요. (1)을 받치니 근거예요. 글쓴이의 생각을 밝히는 말이라 주장으로 골라도 맞아요.","one store(한 가게)에서 있었던 일이에요. 사례라 예시예요. 수수료가 통했다는 결과로 결론을 받치니 근거로 골라도 맞아요.","it seems(~인 것으로 보인다)로 조심스럽게 글을 맺어요. 적은 수수료가 모두의 부담을 던다는 말로 (1)의 문제에 답을 내놓아 마무리하니 결론이에요. 주장으로 골라도 맞아요."]},{"id":"MP9","title":"아차 사고를 말하게 하라","sents":[["A forklift driver at one warehouse nearly struck a fellow worker who stepped out from behind a stack of boxes, and neither of them reported it.","예시","지게차 아차 사고 → 둘 다 보고 안 함"],["Safety researchers have long estimated that for every serious injury there are hundreds of such near misses, each one a warning of how the injury could happen.","근거","큰 부상 하나 뒤 → 아차 사고 수백 건(경고)"],["A workplace that wants fewer accidents should therefore treat near misses as its most valuable information and make them easy to report.","주장","사고 줄이려면 → 아차 사고를 값진 정보로, 쉽게 보고"],["Workers usually stay silent, however, because they expect to be blamed, and some managers do see each report as proof of carelessness.","반대쪽","직원 → 탓 들을까 봐 침묵 · 일부 관리자는 부주의로 봄"],["But a report punished is a report never repeated, and the danger it described stays exactly where it was.","근거","벌주면 → 보고 끊기고 위험은 그대로"],["After one airline promised that no one would be disciplined for reporting an honest mistake, reports tripled and serious incidents declined.","예시","벌 안 준다 약속한 항공사 → 보고 세 배, 큰 사고 줄어듦",["근거"]],["The mistakes had not multiplied; they had only become visible, and visible problems could be fixed.","근거","실수가 는 게 아니라 → 보여서 고칠 수 있게 됨"],["Rewarding people for speaking up, rather than for a perfect record, is thus what makes a workplace safer.","결론","깨끗한 기록보다 말한 사람 칭찬 → 더 안전",["주장"]]],"line":"큰 사고 뒤에는 수백 건의 아차 사고가 있으니, 일터는 그것을 값진 정보로 여겨 쉽게 보고하게 해야 한다. 보고한 사람을 탓하면 보고가 끊기고 위험은 그대로 남는다. 탓하지 않고 말한 사람을 칭찬할 때 일터가 안전해진다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["a full inquiry into each serious injury as the surest path to safety","regular safety training as the best defense against close calls","praise for workers who report close calls as a path to safety","rewards for accident-free months as a spur to careful work","clear written rules as the reason accidents become rare"],"ans":2,"why":"한 줄의 「탓하지 않고 말한 사람을 칭찬할 때 일터가 안전해진다」가 정답(praise for workers who report close calls as a path to safety)과 같아요. 「a full inquiry into each serious injury as the surest path to safety」는 그럴듯하지만 글이 눈여겨보라는 것은 큰 부상이 아니라 그 앞에 있는 수백 건의 아차 사고예요(hundreds of such near misses). 「regular safety training as the best defense against close calls」는 안전 하면 떠오르는 말이지만 글에 없어요. 글이 내놓은 방법은 교육이 아니라 쉽게 보고하게 하는 것이에요(make them easy to report). 「rewards for accident-free months as a spur to careful work」는 (8)과 반대예요. 글은 흠 없는 기록이 아니라 나서서 말한 것에 상을 주라고 해요(rather than for a perfect record). 「clear written rules as the reason accidents become rare」는 글에 없어요. 항공사에서 사고를 줄인 것은 규칙이 아니라 벌주지 않겠다는 약속과 늘어난 보고였어요(reports tripled and serious incidents declined).","tip":"(3)의 therefore에서 주장이 나와요. (4)의 however 뒤는 주장이 아니라 일꾼들이 입을 다무는 사정, 곧 반대쪽이에요. 그것을 (5)의 But으로 되받고, 항공사 사례와 그 풀이를 거쳐 (8)의 thus로 맺어요.","ko":["한 창고의 지게차 운전자가 상자 더미 뒤에서 걸어 나온 동료를 칠 뻔했는데, 두 사람 누구도 그 일을 보고하지 않았다.","안전 연구자들은 심각한 부상 한 건마다 이런 아차 사고가 수백 건 있다고 오래전부터 어림해 왔는데, 그 하나하나가 부상이 어떻게 일어날 수 있는지 알려 주는 경고다.","따라서 사고를 줄이고 싶은 일터는 아차 사고를 가장 값진 정보로 다루고 그것을 보고하기 쉽게 만들어야 한다.","그러나 일꾼들은 대개 입을 다무는데, 탓을 들을 것이라 여기기 때문이고, 실제로 일부 관리자는 보고 하나하나를 부주의의 증거로 본다.","하지만 벌을 받은 보고는 다시는 되풀이되지 않는 보고이고, 그 보고가 알린 위험은 있던 자리에 그대로 남는다.","한 항공사가 정직한 실수를 보고했다고 징계받는 사람은 없을 것이라고 약속한 뒤, 보고는 세 배로 늘고 심각한 사고는 줄었다.","실수가 크게 늘어난 것이 아니었다. 그저 눈에 보이게 되었을 뿐이고, 눈에 보이는 문제는 고칠 수 있었다.","그러므로 흠 없는 기록이 아니라 나서서 말한 것을 두고 사람들에게 상을 주는 것이 일터를 더 안전하게 만든다."],"words":[[["forklift","지게차"],["warehouse","창고"],["struck","쳤다(strike)"],["fellow worker","동료"],["stack","더미"]],[["estimated","어림했다, 추정했다"],["injury","부상"],["near misses","아차 사고(사고가 날 뻔한 일)"],["warning","경고"]],[["therefore","따라서"],["treat","(treat A as B) A를 B로 다루다"],["valuable","값진"]],[["stay silent","입을 다물다"],["blamed","탓을 듣는"],["managers","관리자"],["carelessness","부주의"]],[["punished","벌을 받은"],["danger","위험"],["described","알렸다, 설명했다"]],[["airline","항공사"],["disciplined","징계받는"],["tripled","세 배가 되었다"],["declined","줄었다"]],[["multiplied","크게 늘어났다"],["visible","눈에 보이는"],["fixed","고쳐진"]],[["Rewarding","상을 주기"],["speaking up","나서서 말하기"],["perfect record","흠 없는 기록"],["thus","그러므로"]]],"rwhy":["one warehouse(한 창고)에서 있었던 일을 들려줘요. 글쓴이의 생각이 아니라 장면 하나라 예시예요.","Safety researchers have long estimated that(안전 연구자들은 오래전부터 ~라고 어림해 왔다)으로 자료를 대요. 아차 사고가 큰 부상의 경고라는 이 사실이 뒤의 주장을 받치니 근거예요.","therefore(따라서)와 should로 글쓴이의 생각을 밝혀요. 아차 사고를 값진 정보로 다루고 쉽게 보고하게 하라는 이 말이 주장이에요.","however(그러나)가 있지만 글쓴이의 주장이 아니에요. 일꾼들이 입을 다무는 사정과 보고를 부주의로 보는 관리자들의 생각이라 반대쪽이에요.","But(하지만)으로 (4)를 되받아 까닭을 대요. 벌을 주면 보고가 끊기고 위험은 그대로 남는다는 점이 (3)을 받치니 근거예요.","one airline(한 항공사)에서 있었던 일이에요. 사례라 예시예요. 보고가 늘고 사고가 줄었다는 결과로 주장을 받치니 근거로 골라도 맞아요.","(6)의 결과가 왜 그런지 풀어 줘요. 실수가 는 것이 아니라 보이게 되어 고칠 수 있었다는 까닭이 (3)을 받치니 근거예요.","thus(그러므로)로 글을 맺어요. 흠 없는 기록보다 말한 사람에게 상을 주라는 말로 (3)을 다시 밝혀 마무리하니 결론이에요. 주장으로 골라도 맞아요."]},{"id":"MP10","title":"단것과 들뜬 아이","sents":[["Ask parents what happens after a birthday party, and most will say that sugar sends children bouncing off the walls.","반대쪽","부모들 → 단것이 아이를 날뛰게 한다(흔한 믿음)"],["In one well-known experiment, though, mothers were told that their sons had just had a sugary drink when the drink in fact contained none.","예시","실험 → 단것 먹었다고 알림(실제론 설탕 없음)",["근거"]],["What the experiment points to is that the excitement adults notice lies largely in their own expectations rather than in the sugar.","주장","어른이 보는 흥분 → 설탕보다 어른의 기대 탓"],["The mothers who believed the false report rated their sons as more restless and stayed closer to them, criticizing them more often.","근거","속은 엄마들 → 아들을 더 산만하다 봄",["예시"]],["Carefully controlled trials, in which neither children nor observers know who received sugar, have repeatedly found no change in behavior.","근거","통제된 실험들 → 행동 변화 없음"],["A party, after all, offers games, friends and a break from routine, any of which could explain a lively child better than a slice of cake.","근거","잔치 → 놀이 · 친구 · 색다른 하루가 들뜬 까닭"],["Sweets are hardly harmless, of course: too much sugar clearly damages teeth and contributes to weight gain.","반대쪽","단것 → 해롭긴 함(이 · 몸무게)"],["But parents who blame the cake for a noisy afternoon are probably seeing what they have been taught to expect.","결론","케이크 탓하는 부모 → 기대한 대로 보는 것",["주장"]]],"line":"단것을 먹으면 아이가 날뛴다고들 하지만, 설탕을 먹었다고 믿은 엄마들이 아이를 더 산만하게 보았고 통제된 실험에서는 행동 변화가 없었다. 어른이 보는 흥분은 설탕이 아니라 어른의 기대에서 온다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["hidden sugar in drinks as a greater worry than party cake","what parents expect to see as the root of the sugar rush","a child's age rather than diet as the key to restless behavior","mothers' closer watch as a way to settle excited sons","blind trials as proof that sugar calms rather than excites"],"ans":1,"why":"한 줄의 「어른이 보는 흥분은 설탕이 아니라 어른의 기대에서 온다」가 정답(what parents expect to see as the root of the sugar rush)과 같아요. 「hidden sugar in drinks as a greater worry than party cake」는 (2)의 sugary drink에 끌린 말이지만 글에 없어요. 실험의 음료에는 설탕이 아예 없었어요(the drink in fact contained none). 「a child's age rather than diet as the key to restless behavior」는 그럴듯하지만 글은 나이를 말하지 않아요. 글이 든 까닭은 어른의 기대예요(in their own expectations). 「mothers' closer watch as a way to settle excited sons」는 (4)의 낱말을 옮겼지만 뜻이 달라요. 곁에 더 가까이 머문 것은 아이를 가라앉히는 방법이 아니라 속은 엄마들이 보인 반응이에요(stayed closer to them). 「blind trials as proof that sugar calms rather than excites」는 (5)를 부풀렸어요. 실험이 찾은 것은 가라앉힌다는 것이 아니라 변화가 없다는 거예요(have repeatedly found no change in behavior).","tip":"(2)에 though가 있지만 그 뒤는 주장이 아니라 실험, 곧 사례예요. 주장은 (3)의 What the experiment points to is that 뒤에 나와요. (7)에서 of course로 한 걸음 물러섰다가 (8)의 But으로 돌아와 맺어요.","ko":["부모들에게 생일잔치 뒤에 무슨 일이 일어나는지 물어보면, 대부분은 설탕이 아이들을 정신없이 날뛰게 만든다고 말할 것이다.","그러나 잘 알려진 한 실험에서는 엄마들에게 아들이 방금 단 음료를 마셨다고 알려 주었는데, 사실 그 음료에는 설탕이 전혀 들어 있지 않았다.","이 실험이 가리키는 것은 어른들이 알아차리는 흥분이 설탕보다는 주로 어른들 자신의 기대 속에 있다는 점이다.","그 거짓 알림을 믿은 엄마들은 아들을 더 가만있지 못한다고 평가했고, 아들 곁에 더 가까이 머물며 더 자주 나무랐다.","누가 설탕을 받았는지 아이도 관찰자도 모르게 한, 꼼꼼히 통제된 실험들은 행동에 아무 변화가 없다는 것을 거듭 확인했다.","따지고 보면 잔치에는 놀이와 친구들과 평소와 다른 하루가 있고, 그 가운데 어느 것이든 케이크 한 조각보다 들뜬 아이를 더 잘 설명할 수 있다.","물론 단것이 해롭지 않은 것은 결코 아니다. 지나친 설탕은 분명히 이를 상하게 하고 몸무게를 늘린다.","그러나 시끄러운 오후를 케이크 탓으로 돌리는 부모는 아마도 자기가 기대하도록 배운 것을 보고 있는 것이다."],"words":[[["sends","(send ~ -ing) ~을 …하게 만들다"],["bouncing off the walls","(들떠서) 정신없이 날뛰는"]],[["experiment","실험"],["though","그러나"],["sugary","단, 설탕이 든"],["contained","들어 있었다"]],[["points to","가리키다"],["excitement","흥분"],["lies","(lie in) ~에 있다"],["largely","주로"],["expectations","기대"]],[["false","거짓의"],["rated","(rate A as B) A를 B라고 평가했다"],["restless","가만있지 못하는"],["criticizing","나무라며"]],[["controlled trials","통제된 실험"],["observers","관찰자"],["repeatedly","거듭"],["behavior","행동"]],[["after all","따지고 보면"],["a break from routine","평소와 다른 하루, 일상에서 벗어남"],["lively","들뜬, 활기찬"],["slice","조각"]],[["hardly","결코 ~아닌"],["harmless","해롭지 않은"],["damages","상하게 하다"],["contributes to","~의 한 원인이 되다"]],[["blame","(blame A for B) B를 A 탓으로 돌리다"],["probably","아마도"],["taught to expect","기대하도록 배운"]]],"rwhy":["parents(부모들) 대부분이 할 말을 먼저 내놓아요. 글쓴이가 뒤에서 넘어서려는 흔한 믿음이라 반대쪽이에요.","though(그러나)가 있지만 주장이 아니라 one well-known experiment(잘 알려진 한 실험)에서 한 일이에요. 사례라 예시예요. (1)의 믿음을 흔드는 자료이니 근거로 골라도 맞아요.","What the experiment points to is that(이 실험이 가리키는 것은 ~이다)으로 사례에서 글쓴이의 생각을 끌어내요. 흥분은 설탕보다 어른의 기대에 있다는 이 말이 주장이에요.","실험의 결과를 대요. 설탕을 먹었다고 믿은 엄마들이 아들을 더 산만하게 보았다는 점이 (3)을 받치니 근거예요. (2)의 실험에서 이어지는 내용이라 예시로 골라도 맞아요.","다른 실험들이 거듭 확인한 사실을 대요. 누가 설탕을 받았는지 모르게 하면 행동 변화가 없다는 점이 (3)을 받치니 근거예요.","after all(따지고 보면)로 까닭을 하나 더 대요. 잔치의 놀이 · 친구 · 색다른 하루가 들뜬 아이를 더 잘 설명한다는 점이 (3)을 받치니 근거예요.","of course(물론)로 한 걸음 물러서요. 단것이 해롭다는 쪽의 옳은 면을 인정하는 말이라 반대쪽이에요.","But으로 (7)의 인정을 넘어 글을 맺어요. 케이크를 탓하는 부모는 기대한 것을 보는 것이라는 말로 (3)을 다시 밝혀 마무리하니 결론이에요. 주장으로 골라도 맞아요."]}]},"adv":{"choose":[{"id":"S1-1","k":1,"dev":"not least because ~ (not이 있어도 뒤집지 않고 까닭을 덧붙임)","s":"In one village, the volunteer fire department has become the most trusted institution, not least because its members are neighbors who respond within minutes.","a":"의용 소방대 → 마을에서 가장 믿는 기관 됨","why":"① 먼저 「무엇이 → 어떻게 됐다」만 남겨 보세요. the volunteer fire department(의용 소방대)가 '무엇'이고, has become the most trusted institution(가장 믿는 기관이 됐다)이 '어떻게 됐다'예요. 쉼표 앞에서 할 말이 이미 다 나왔어요.\n② 쉼표 뒤 not least because에는 not이 보여서 「앞말을 뒤집나?」 싶지만 그렇지 않아요. not least는 「적지 않게, 특히」라는 뜻이라, not least because는 「특히 ~ 때문에」예요. 까닭을 덧붙이는 말이에요.\n③ 그 뒤의 its members are neighbors who respond within minutes(대원들이 몇 분 안에 달려오는 이웃이다)는 '왜 믿게 됐는지'예요. 이 부분을 손으로 가리고 읽어도 앞 문장은 그대로 서요.\n④ 그래서 여백에는 「의용 소방대 → 마을에서 가장 믿는 기관 됨」이라고 적으면 돼요.","tr":[["의용 소방대 → 출동이 전보다 몇 분 빨라짐","within minutes(몇 분 안에)를 보고 「출동이 빨라졌구나」 하고 이었다면 이 보기예요. 그런데 문장은 대원들이 몇 분 안에 달려온다고 했을 뿐(respond within minutes), 전보다 빨라졌다고 하지 않았어요. 달라진 것은 속도가 아니라 마을 사람들의 믿음이에요."],["이웃 자율 방범대 → 마을에서 가장 믿는 기관 됨","neighbors(이웃)라는 낱말이 눈에 남아 「이웃들이 꾸린 모임」을 떠올렸다면 이 보기예요. 그런데 가장 믿는 기관이 된 것은 방범대가 아니라 소방대예요(the volunteer fire department). 이웃은 그 소방대의 대원이 누구인지를 말할 때 나오는 낱말이에요."],["이웃 자율 방범대 → 출동이 전보다 몇 분 빨라짐","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 문장에 나오는 것은 방범대가 아니라 소방대이고, 달라진 것은 출동 속도가 아니라 믿음이에요."],["소방대원인 이웃들 → 몇 분 안에 달려와 줌","문장 맨 끝이 기억에 남아 그 부분을 옮겼다면 이 보기예요. 틀린 말은 아니에요. 대원들이 몇 분 안에 달려오는 이웃이라는 말은 문장에 있어요(its members are neighbors who respond within minutes). 하지만 그것은 '왜'예요. 이 문장이 하려는 말은, 그래서 소방대가 마을에서 가장 믿는 기관이 됐다는 거예요."]],"dg":"not least because","ko":"한 마을에서는 의용 소방대가 가장 믿음을 받는 기관이 되었는데, 무엇보다도 대원들이 몇 분 안에 달려오는 이웃들이기 때문이다.","voc":[["volunteer","스스로 나서서 하는(사람), 자원봉사의"],["fire department","소방대, 소방서"],["trusted","믿음을 받는"],["institution","기관, 단체"],["not least because ~","무엇보다도 ~ 때문에"],["respond","(부름에) 응하다, 출동하다"],["within minutes","몇 분 안에"]]},{"id":"S1-2","k":1,"dev":"all but ~ (but이 있어도 대조가 아니라 「거의」)","s":"Lighthouse keepers' logbooks, which recorded the wind every few hours and were all but forgotten for decades, have become essential for researchers studying past storms.","a":"등대지기 일지 → 옛 폭풍 연구에 꼭 필요해짐","why":"① 이 문장은 쉼표 두 개 사이에 긴 말이 끼어 있어요. 먼저 그 끼어든 말을 손으로 가리고 앞뒤만 이어 읽어 보세요. Lighthouse keepers' logbooks(등대지기 일지)가 '무엇'이고, have become essential for researchers studying past storms(옛 폭풍을 연구하는 사람들에게 꼭 필요해졌다)가 '어떻게 됐다'예요.\n② 쉼표 사이의 which ~는 그 일지가 '어떤 일지인지'를 꾸며 주는 말이에요. 몇 시간마다 바람을 적었고, 수십 년 동안 거의 잊혀 있었다는 지난 사정이에요.\n③ all but에는 but이 보여서 「여기서 뒤집히나?」 싶지만 그렇지 않아요. all but은 두 낱말이 합쳐서 「거의」라는 뜻이에요. all but forgotten은 「거의 잊힌」이에요.\n④ 그래서 여백에는 「등대지기 일지 → 옛 폭풍 연구에 꼭 필요해짐」이라고 적으면 돼요.","tr":[["등대지기 일지 → 수십 년 새 거의 다 없어짐","all but forgotten for decades를 보고 「수십 년 사이에 거의 사라졌구나」 하고 읽었다면 이 보기예요. 그런데 forgotten은 '없어진'이 아니라 '잊힌'이에요. 일지는 남아 있었고, 그래서 지금 연구에 쓰이고 있어요(have become essential)."],["등대 풍속 측정기 → 옛 폭풍 연구에 꼭 필요해짐","recorded the wind(바람을 기록했다)를 보고 「바람을 재는 기계」를 떠올렸다면 이 보기예요. 그런데 바람을 적어 둔 것도, 연구에 꼭 필요해진 것도 기계가 아니라 등대지기들의 일지예요(Lighthouse keepers' logbooks)."],["등대 풍속 측정기 → 수십 년 새 거의 다 없어짐","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 문장에 나오는 것은 측정기가 아니라 일지이고, 그 일지는 없어진 것이 아니라 잊혀 있다가 지금 꼭 필요한 것이 됐어요."],["등대지기 일지 → 몇 시간마다 바람을 적어 둠","쉼표 사이의 말이 자세해서 그 부분을 옮겼다면 이 보기예요. 틀린 말은 아니에요. 일지가 몇 시간마다 바람을 적었다는 말은 문장에 있어요(recorded the wind every few hours). 하지만 그것은 '어떤 일지인지'예요. 이 문장이 하려는 말은, 그 일지가 지금 옛 폭풍 연구에 꼭 필요해졌다는 거예요."]],"dg":"all but","ko":"몇 시간마다 바람을 적어 두었고 수십 년 동안 거의 잊혀 있던 등대지기들의 일지가, 지난날의 폭풍을 연구하는 사람들에게 꼭 필요한 것이 되었다.","voc":[["lighthouse keeper","등대지기"],["logbook","(날마다 적는) 일지"],["record","적어 두다, 기록하다"],["all but ~","거의 ~"],["for decades","수십 년 동안"],["essential","꼭 필요한"],["researcher","연구하는 사람"]]},{"id":"S1-3","k":1,"dev":"however + 형용사 (「그러나」가 아니라 「아무리 ~해도」)","s":"In one study, however effective they were at blocking chatter, noise-canceling headphones helped students concentrate only when working on tasks of their own choosing.","a":"헤드폰 → 직접 고른 과제일 때만 집중 도움","why":"① 먼저 「무엇이 → 어떻게 했다」만 남겨 보세요. noise-canceling headphones(소음 차단 헤드폰)가 '무엇'이고, helped students concentrate(학생들이 집중하도록 도왔다)가 '어떻게 했다'예요. 그런데 바로 뒤에 only when(~할 때에만)이 붙어 있어요. 이 조건까지가 하려는 말이에요.\n② 쉼표 사이의 however effective they were at blocking chatter는 잠깐 끼어든 말이에요. however는 보통 「그러나」지만, 바로 뒤에 effective 같은 말이 붙으면 「아무리 ~해도」가 돼요. 「잡담을 아무리 잘 막아도」라고 한 발 물러서 주는 말이지, 뒤집는 말이 아니에요.\n③ 끝의 tasks of their own choosing은 「자기가 직접 고른 과제」예요. 헤드폰이 도움이 된 때는 이때뿐이에요.\n④ 그래서 여백에는 「헤드폰 → 직접 고른 과제일 때만 집중 도움」이라고 적으면 돼요.","tr":[["헤드폰 → 잡담이 심한 곳일 때만 집중 도움","chatter(잡담)가 눈에 들어와 「시끄러운 곳에서만 도움이 되는구나」 하고 이었다면 이 보기예요. 그런데 only when 뒤에 오는 조건은 장소가 아니라 과제예요(only when working on tasks of their own choosing). 잡담은 헤드폰이 '무엇을 막는지'를 말할 때 나오는 낱말이에요."],["헤드폰 → 직접 고른 과제일 때만 잡담 막음","blocking chatter(잡담 막기)와 only when을 한데 이었다면 이 보기예요. 그런데 문장은 잡담 막기에는 조건을 달지 않았어요. only when(~할 때에만)이 붙은 것은 '막기'가 아니라 '집중을 돕기'예요(helped students concentrate only when)."],["헤드폰 → 잡담이 심한 곳일 때만 잡담 막음","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 조건은 장소가 아니라 스스로 고른 과제이고, 그 조건에서 달라지는 것은 잡담 막기가 아니라 집중이에요."],["헤드폰 → 잡담 막는 데는 효과가 좋음","however를 「그러나」로 읽고 그 뒤를 요점으로 잡았다면 이 보기예요. 문장도 「잡담을 아무리 잘 막아도」라고 했으니 아주 먼 말은 아니에요(however effective they were at blocking chatter). 하지만 그것은 '한 발 물러서 준 말'이에요. 이 문장이 하려는 말은, 그래도 집중에는 스스로 고른 과제일 때만 도움이 됐다는 거예요."]],"dg":"however + 형용사","ko":"한 연구에서, 소음 차단 헤드폰은 잡담 소리를 아무리 잘 막아 주어도, 학생들이 스스로 고른 과제를 할 때에만 집중하는 데 도움이 되었다.","voc":[["however effective ~","아무리 효과가 좋아도"],["block","막다"],["chatter","잡담 (소리)"],["noise-canceling","소음을 없애 주는"],["concentrate","집중하다"],["only when ~","~할 때에만"],["of their own choosing","자기가 직접 고른"]]},{"id":"S1-4","k":1,"dev":"Given that ~ (~을 생각하면 — 바탕을 깔아 줌)","s":"Given that mining rare earth metals often leaves toxic waste behind, some engineers argue that recycling old phones deserves more public support.","a":"헌 휴대폰 재활용 → 공공 지원 더 받아야 함","why":"① 이 문장은 쉼표를 사이에 두고 두 덩어리로 나뉘어요. 앞 덩어리는 Given that으로 시작해요. Given that은 「~라는 점을 생각하면」이라는 뜻으로, 이야기의 바탕을 먼저 깔아 주는 말이에요.\n② 바탕 위에 올린 말이 쉼표 뒤에 있어요. some engineers argue that ~(몇몇 공학자들은 ~라고 주장한다)이 뼈대이고, 주장의 알맹이는 recycling old phones deserves more public support(헌 휴대폰 재활용은 공공 지원을 더 받을 만하다)예요.\n③ 앞 덩어리의 mining rare earth metals often leaves toxic waste behind(희토류를 캐면 독성 폐기물이 남기 쉽다)는 '왜 그렇게 주장하는지'예요. 사실처럼 또렷해서 눈길이 가지만, 공학자들이 여기서 멈추지 않고 그다음 말을 하려고 꺼낸 이야기예요.\n④ 그래서 여백에는 「헌 휴대폰 재활용 → 공공 지원 더 받아야 함」이라고 적으면 돼요.","tr":[["헌 휴대폰 재활용 → 독성 폐기물 남기기 쉬움","toxic waste(독성 폐기물)와 recycling old phones(헌 휴대폰 재활용)를 한데 이었다면 이 보기예요. 그런데 독성 폐기물을 남기는 쪽은 재활용이 아니라 희토류를 캐는 일이에요(mining rare earth metals often leaves toxic waste behind). 재활용은 오히려 그 때문에 더 밀어주자는 쪽이에요."],["희토류 금속 채굴 → 공공 지원 더 받아야 함","문장 앞머리의 mining(채굴)과 문장 끝의 more public support(더 많은 공공 지원)를 이었다면 이 보기예요. 그런데 지원을 더 받아야 한다는 것은 채굴이 아니라 헌 휴대폰 재활용이에요(recycling old phones deserves more public support)."],["희토류 금속 채굴 → 법으로 금지해야 마땅함","「독성 폐기물이 남는다니 캐지 말아야겠네」 하고 한 걸음 더 나갔다면 이 보기예요. 그럴듯하지만 문장에는 채굴을 금지하자는 말이 없어요. 공학자들이 주장한 것은 재활용을 더 지원하자는 것뿐이에요(deserves more public support)."],["희토류 금속 채굴 → 독성 폐기물 남기기 쉬움","문장 앞 덩어리를 그대로 옮겼다면 이 보기예요. 틀린 말은 아니에요. 문장에 그대로 있어요(mining rare earth metals often leaves toxic waste behind). 하지만 그것은 Given that이 깔아 준 '바탕'이에요. 이 문장이 하려는 말은, 그러니 헌 휴대폰 재활용을 더 지원해야 한다는 주장이에요."]],"dg":"given that","ko":"희토류 금속을 캐내면 독성 폐기물이 남는 일이 많다는 점을 생각하면, 헌 휴대폰을 재활용하는 일이 공공의 지원을 더 받아야 마땅하다고 몇몇 공학자들은 주장한다.","voc":[["given that ~","~라는 점을 생각하면"],["mine","(땅에서) 캐내다"],["rare earth metals","희토류 금속 (휴대폰 같은 전자 제품에 꼭 들어가는 금속)"],["leave ~ behind","~을 뒤에 남기다"],["toxic waste","독성 폐기물"],["argue","주장하다"],["deserve","~을 받을 만하다"],["public support","공공의 지원"]]},{"id":"S1-5","k":1,"dev":"in that ~ (~라는 점에서 — 까닭을 덧붙임)","s":"One old timber school fared better than the nearby concrete hall during an earthquake, in that the school's wooden joints could flex as the ground shook.","a":"낡은 목조 학교 → 옆 콘크리트 강당보다 지진 잘 견딤","why":"① 먼저 「무엇이 → 어떻게 됐다」만 남겨 보세요. One old timber school(한 낡은 목조 학교)이 '무엇'이고, fared better than the nearby concrete hall during an earthquake(지진 때 옆 콘크리트 강당보다 더 잘 견뎠다)이 '어떻게 됐다'예요. 쉼표 앞에서 할 말이 다 나왔어요.\n② better than(~보다 더 잘)이 있으니 누가 누구보다 잘 견뎠는지 꼭 확인하세요. 더 잘 견딘 쪽이 목조 학교, 견주는 상대가 콘크리트 강당이에요.\n③ 쉼표 뒤의 in that은 「~라는 점에서」라는 뜻으로 까닭을 덧붙여요. the school's wooden joints could flex as the ground shook(땅이 흔들릴 때 나무 이음새가 휘어질 수 있었다)은 '왜 잘 견뎠는지'예요. 여기서 flex(휘다)는 망가졌다는 뜻이 아니라, 부러지지 않고 휘어졌다는 뜻이에요. 그래서 버틸 수 있었어요.\n④ 그래서 여백에는 「낡은 목조 학교 → 옆 콘크리트 강당보다 지진 잘 견딤」이라고 적으면 돼요.","tr":[["낡은 목조 학교 → 지진에 나무 이음새부터 휘어 망가짐","flex(휘다)와 the ground shook(땅이 흔들렸다)을 보고 「지진에 휘어서 상했구나」 하고 읽었다면 이 보기예요. 그런데 이음새가 휜 것은 망가진 것이 아니라 잘 견딘 까닭이에요. 문장은 학교가 더 잘 견뎠다고 했어요(fared better than the nearby concrete hall)."],["옆 콘크리트 강당 → 낡은 목조 학교보다 지진 잘 견딤","「콘크리트가 나무보다 튼튼하지」 하는 생각으로 better than의 앞뒤를 바꿔 읽었다면 이 보기예요. 그런데 문장에서 더 잘 견딘 쪽은 목조 학교예요(One old timber school fared better than the nearby concrete hall)."],["옆 콘크리트 강당 → 지진에 나무 이음새부터 휘어 망가짐","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 나무 이음새는 강당이 아니라 학교의 것이고(the school's wooden joints), 휜 것은 망가진 것이 아니라 버틴 까닭이에요."],["학교의 나무 이음새 → 땅이 흔들릴 때 함께 휘어 줌","문장 뒤쪽이 눈에 그려져서 그 부분을 옮겼다면 이 보기예요. 틀린 말은 아니에요. 문장에 그대로 있어요(the school's wooden joints could flex as the ground shook). 하지만 그것은 in that이 덧붙인 '왜'예요. 이 문장이 하려는 말은, 그래서 낡은 목조 학교가 콘크리트 강당보다 지진을 잘 견뎠다는 거예요."]],"dg":"in that","ko":"한 낡은 목조 학교는 가까이 있는 콘크리트 강당보다 지진을 더 잘 견뎠는데, 땅이 흔들릴 때 학교의 나무 이음새가 휘어질 수 있었기 때문이다.","voc":[["timber","목재, 나무로 지은"],["fare better than ~","~보다 더 잘 견디다(더 잘 해내다)"],["nearby","가까이 있는"],["concrete hall","콘크리트 강당"],["in that ~","~라는 점에서, ~이기 때문에"],["joint","이음새 (나무와 나무가 만나는 곳)"],["flex","(부러지지 않고) 휘다"]]},{"id":"S1-6","k":1,"dev":"Now that ~ (이제 ~했으니 — 바뀐 사정을 먼저)","s":"Now that one county archive has scanned its land records, historians who once waited weeks for files can trace a property's history within hours.","a":"토지 기록 스캔 → 땅 내력 몇 시간이면 찾음","why":"① 이 문장은 쉼표를 사이에 두고 두 덩어리로 나뉘어요. 앞 덩어리의 Now that은 「이제 ~했으니」라는 뜻으로, 바뀐 사정을 먼저 알려 줘요. one county archive has scanned its land records(한 군 보관소가 토지 기록을 스캔했다)가 '한 일'이에요.\n② 쉼표 뒤가 '그래서 달라진 것'이에요. 뼈대는 historians ... can trace a property's history within hours(역사가들이 땅의 내력을 몇 시간 안에 찾아낼 수 있다)예요.\n③ historians 바로 뒤의 who once waited weeks for files는 '어떤 역사가들인지'를 꾸며 주는 말이에요. once(예전에)가 보이죠? 서류를 몇 주씩 기다린 것은 예전 일이에요. 지금은 within hours(몇 시간 안에)예요. weeks와 hours 가운데 어느 쪽이 '지금'인지 놓치지 마세요.\n④ 화살표 왼쪽에는 '무엇 덕분에'를, 오른쪽에는 '그래서 달라진 것'을 짧게 적으면 돼요. 그래서 여백에는 「토지 기록 스캔 → 땅 내력 몇 시간이면 찾음」이라고 적으면 돼요.","tr":[["토지 기록 스캔 → 서류 받는 데 몇 주씩 걸림","waited weeks for files(서류를 몇 주 기다렸다)를 보고 「스캔하느라 서류가 늦어지는구나」 하고 이었다면 이 보기예요. 그런데 그 앞에 once(예전에)가 있어요. 몇 주씩 기다린 것은 스캔하기 전의 일이고, 지금은 몇 시간이면 돼요(within hours)."],["역사가 인원 보강 → 땅 내력 몇 시간이면 찾음","historians(역사가들)가 눈에 들어와 「역사가가 늘어서 빨라졌구나」 하고 이었다면 이 보기예요. 그런데 달라진 까닭은 역사가를 늘린 것이 아니라 보관소가 토지 기록을 스캔한 것이에요(has scanned its land records). 역사가는 그 덕을 본 사람들이에요."],["역사가 인원 보강 → 서류 받는 데 몇 주씩 걸림","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 보관소가 한 일은 기록을 스캔한 것이고, 몇 주씩 걸린 것은 예전 일이에요. 지금은 몇 시간이면 돼요."],["군 기록 보관소 → 토지 기록을 스캔해 둠","문장 앞 덩어리를 그대로 옮겼다면 이 보기예요. 틀린 말은 아니에요. 보관소가 토지 기록을 스캔했다는 말은 문장에 있어요(one county archive has scanned its land records). 하지만 그것은 Now that이 알려 준 '바뀐 사정'까지예요. 이 문장이 하려는 말은, 그래서 땅의 내력을 몇 시간이면 찾게 됐다는 거예요. 여백에는 '그래서 어떻게 됐는지'까지 적어야 해요."]],"dg":"now that","ko":"한 군(郡)의 기록 보관소가 토지 기록을 스캔해 둔 덕분에, 예전에는 서류를 받으려고 몇 주씩 기다리던 역사가들이 이제는 어떤 땅의 내력을 몇 시간 안에 찾아낼 수 있다.","voc":[["now that ~","이제 ~했으니"],["county","군(郡) — 미국의 행정 구역"],["archive","기록 보관소"],["scan","스캔하다 (컴퓨터 파일로 옮기다)"],["land records","토지 기록"],["historian","역사가"],["trace","(자취를) 따라가 찾아내다"],["property","땅, 부동산"]]},{"id":"S1-7","k":1,"dev":"쉼표 사이에 끼어든 덧말 (its ~ flavor reminding ~ : 신호 말 없이 사정을 끼워 넣음)","s":"Clay-jar soybean paste, its distinctive flavor reminding many older shoppers of their childhood, still outsells factory brands at one village market.","a":"장독 된장 → 장터에서 공장 된장보다 여전히 잘 팔림","why":"① 이 문장은 쉼표 두 개 사이에 긴 말이 끼어 있어요. 그 끼어든 말을 손으로 가리고 앞뒤만 이어 읽어 보세요. Clay-jar soybean paste(장독 된장)가 '무엇'이고, still outsells factory brands at one village market(한 마을 장터에서 여전히 공장 된장보다 더 많이 팔린다)이 '어떻다'예요.\n② outsell은 out(~보다 더) + sell(팔리다)이에요. 「A outsells B」는 「A가 B보다 더 많이 팔린다」예요. 더 팔리는 쪽이 앞에 오는 장독 된장이라는 것을 꼭 확인하세요.\n③ 쉼표 사이의 its distinctive flavor reminding many older shoppers of their childhood는 「그 독특한 맛이 나이 든 손님 여럿에게 어린 시절을 떠올리게 한다」는 덧말이에요. because 같은 말은 없지만 '왜 잘 팔리는지' 짐작하게 해 줘요. 나이 든 손님은 맛을 설명할 때 나올 뿐, 「나이 든 손님만 산다」는 말은 없어요.\n④ 그래서 여백에는 「장독 된장 → 장터에서 공장 된장보다 여전히 잘 팔림」이라고 적으면 돼요.","tr":[["장독 된장 → 장터에서 나이 든 손님에게만 겨우 팔림","older shoppers(나이 든 손님)를 보고 「옛날 사람들만 찾는 물건이구나」 하고 이었다면 이 보기예요. 그런데 문장은 장독 된장이 공장 된장보다 더 많이 팔린다고 했어요(still outsells factory brands). '겨우'가 아니에요. 나이 든 손님은 그 맛이 어떤 맛인지를 말할 때 나오는 낱말이에요."],["공장 된장 → 장터에서 장독 된장보다 여전히 잘 팔림","「요즘은 공장 제품이 더 팔리지」 하는 생각으로 outsells의 앞뒤를 바꿔 읽었다면 이 보기예요. 그런데 「A outsells B」는 A가 더 팔린다는 뜻이에요. 문장의 맨 앞에 있는 장독 된장이 더 팔리는 쪽이에요(still outsells factory brands)."],["공장 된장 → 장터에서 나이 든 손님에게만 겨우 팔림","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 나이 든 손님이 어린 시절을 떠올리는 맛은 공장 된장이 아니라 장독 된장의 맛이고, 문장에 '겨우 팔린다'는 말은 어느 쪽에도 없어요."],["장독 된장 맛 → 나이 든 손님에게 어린 시절 떠올림","쉼표 사이의 말이 정겨워서 그 부분을 옮겼다면 이 보기예요. 틀린 말은 아니에요. 문장에 그대로 있어요(reminding many older shoppers of their childhood). 하지만 그것은 끼어든 덧말이에요. 손으로 가려도 문장이 서요. 이 문장이 하려는 말은, 장독 된장이 공장 된장보다 여전히 잘 팔린다는 거예요."]],"dg":"쉼표 사이 덧말","ko":"장독에서 익힌 된장은, 그 독특한 맛이 나이 든 손님 여럿에게 어린 시절을 떠올리게 하는데, 한 마을 장터에서 여전히 공장 상표 된장보다 더 많이 팔린다.","voc":[["clay jar","(흙으로 빚은) 장독, 항아리"],["soybean paste","된장"],["distinctive","독특한, 남다른"],["remind A of B","A에게 B를 떠올리게 하다"],["childhood","어린 시절"],["outsell","~보다 더 많이 팔리다"],["factory brand","공장에서 만든 상표 제품"]]},{"id":"S1-8","k":1,"dev":"an arrangement whereby ~ (그에 따라 ~하는 방식 — 돌아가는 방식을 덧붙임)","s":"A seed bank that lends seeds to farmers may keep old varieties alive better than a sealed vault, through an arrangement whereby borrowers return extra seeds.","a":"씨앗 빌려주는 은행 → 옛 품종 더 잘 살려 둘 수 있음","why":"① 먼저 「무엇이 → 어떻다」만 남겨 보세요. A seed bank that lends seeds to farmers(농부에게 씨앗을 빌려주는 종자 은행)가 '무엇'이고, may keep old varieties alive better than a sealed vault(봉해 둔 금고보다 옛 품종을 더 잘 살려 둘 수도 있다)가 '어떻다'예요.\n② better than(~보다 더 잘)이 있으니 어느 쪽이 더 나은지 확인하세요. 더 나은 쪽이 '빌려주는 은행', 견주는 상대가 '봉해 둔 금고'예요. may가 있으니 「그럴 수 있다」 정도로 말한 것도 봐 두세요.\n③ 쉼표 뒤의 through an arrangement whereby ~는 '어떤 방식으로'를 덧붙인 말이에요. whereby는 낯설지만 「그 방식에 따라 ~한다」는 뜻이에요. borrowers return extra seeds, 곧 빌려 간 사람이 씨앗을 더 얹어 돌려준다는 거예요. 씨앗을 더 얹어 주는 쪽은 은행이 아니라 빌려 간 농부예요.\n④ 그래서 여백에는 「씨앗 빌려주는 은행 → 옛 품종 더 잘 살려 둘 수 있음」이라고 적으면 돼요.","tr":[["씨앗 빌려주는 은행 → 농부에게 씨앗 더 얹어 줄 수 있음","extra seeds(여분의 씨앗)를 보고 「은행이 씨앗을 넉넉히 주는구나」 하고 이었다면 이 보기예요. 그런데 씨앗을 더 얹어 주는 쪽은 은행이 아니라 빌려 간 사람이에요(borrowers return extra seeds). 주고받는 방향이 거꾸로예요."],["씨앗 봉해 두는 금고 → 옛 품종 더 잘 살려 둘 수 있음","「꽉 봉해 두어야 오래 가지」 하는 생각으로 better than의 앞뒤를 바꿔 읽었다면 이 보기예요. 그런데 문장에서 더 나은 쪽은 금고가 아니라 씨앗을 빌려주는 은행이에요(better than a sealed vault)."],["씨앗 봉해 두는 금고 → 농부에게 씨앗 더 얹어 줄 수 있음","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 농부와 씨앗을 주고받는 곳은 금고가 아니라 빌려주는 은행이고, 씨앗을 더 얹는 쪽은 농부예요."],["씨앗 빌려 간 농부 → 여분 씨앗 얹어 은행에 되갚음","문장 맨 끝이 구체적이라 그 부분을 옮겼다면 이 보기예요. 틀린 말은 아니에요. 빌려 간 사람이 씨앗을 더 얹어 돌려준다는 말은 문장에 있어요(borrowers return extra seeds). 하지만 그것은 '어떤 방식으로'예요. 이 문장이 하려는 말은, 그렇게 빌려주는 은행이 옛 품종을 더 잘 살려 둘 수 있다는 거예요."]],"dg":"whereby","ko":"농부들에게 씨앗을 빌려주는 종자 은행은, 빌려 간 사람이 씨앗을 더 얹어 돌려주는 방식을 통해, 꽉 봉해 둔 금고보다 옛 품종을 더 잘 살려 둘 수도 있다.","voc":[["seed bank","종자 은행 (씨앗을 모아 지키는 곳)"],["lend","빌려주다"],["variety","품종"],["keep ~ alive","~을 살려 두다"],["sealed vault","꽉 봉해 둔 금고(저장고)"],["arrangement","(미리 정해 둔) 방식, 약속"],["whereby ~","그에 따라 ~하는"],["borrower","빌려 간 사람"]]},{"id":"S1-9","k":1,"dev":"The finding that ~ (긴 주어 — 발견의 내용이 주어 안에 들어 있음)","s":"The finding that one damaged reef recovered faster where grazing fish were protected has persuaded several island councils to limit net fishing.","a":"산호 회복 연구 결과 → 섬 의회들 그물 어업 제한","why":"① 이 문장은 쉼표가 하나도 없어서 어디서 끊어야 할지 어려워요. 문장 전체의 동사를 먼저 찾아보세요. has persuaded(설득했다)예요. 그 앞 전체, 곧 The finding that ~ protected까지가 통째로 '무엇이'예요.\n② The finding that ~은 「~라는 발견」이에요. that 뒤의 one damaged reef recovered faster where grazing fish were protected(바닷말을 뜯어 먹는 물고기를 보호한 곳에서 상한 산호초가 더 빨리 회복됐다)는 '무슨 발견인지'를 알려 주는 속 내용이에요. 내용이 또렷해서 여기가 요점처럼 보이지만, 아직 '무엇이' 부분일 뿐이에요.\n③ 문장이 하려는 말은 동사 뒤에 있어요. 그 발견이 has persuaded several island
