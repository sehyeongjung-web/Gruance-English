<style>
  * { box-sizing: border-box; }

<body>
<div class="wrap">
  <div style="display:flex; align-items:center; gap:8px; margin:0 0 6px;">
    <svg width="19" height="16" viewBox="0 0 140 116" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="flex:none;">
      <path d="M23 0 h37 v48 h-37 v20 h37 v48 h-37 a23 23 0 0 1 -23 -23 v-70 a23 23 0 0 1 23 -23 z" fill="#0F6E56"/>
      <path d="M117 0 h-37 v48 h37 v20 h-37 v48 h37 a23 23 0 0 0 23 -23 v-70 a23 23 0 0 0 -23 -23 z" fill="#E8752A"/>
    </svg>
    <span style="font-size:12px; font-weight:700; letter-spacing:1.3px;"><span style="color:#0F6E56">G</span><span style="color:#3DA88C">RU</span><span style="color:#E8752A">ANCE</span></span>
  </div>
  <h1>여백 노트 — 두 낱말로 잡는 해석력</h1>
  <p class="sub">문장마다 여백에 두세 낱말로 핵심을 적고, 적은 말만 이어 읽어 글 전체의 요지를 잡는 연습입니다.</p>
  <div id="app"></div>
  <footer style="text-align:center;padding:16px 0 8px;margin-top:10px;">
    <p style="font-size:11px;color:#9CA3AF;letter-spacing:0.3px;">그루앙스 AI 수능영어코치 · 여백 노트 · ⓒ 정세형. 무단 복제 및 배포를 금지합니다.</p>
  </footer>
</div>
<script>
// ===== 여백 노트 페이지 받침 =====
// 앱(index.html)과 같은 주소에 있으므로, 앱이 이 기기에 기억해 둔 학생 정보(이름 · 학교 · 학년 · 번호)를 그대로 읽어 쓴다.
// 앱이 쓰는 저장 이름 앞머리(grouance_fallback_)를 똑같이 써서, 나중에 앱에서도 이 기록을 읽을 수 있게 한다.
const MN_PREFIX = 'grouance_fallback_';
const _mnMem = {};
const appStorage = {
  async get(k) { try { const v = localStorage.getItem(MN_PREFIX + k); if (v != null) return { value: v }; } catch (e) { /* 저장 막힘 */ } return _mnMem[k] != null ? { value: _mnMem[k] } : null; },
  async set(k, v) { _mnMem[k] = v; try { localStorage.setItem(MN_PREFIX + k, v); } catch (e) { /* 저장 막힘 — 이번 접속 동안만 기억 */ } }
};
let studentName = '', studentSchool = '', studentGrade = '', studentNumber = '';
function myEl(tag, css, text){ const e=document.createElement(tag); if(css) e.style.cssText=css; if(text!=null) e.textContent=text; return e; }
function shuffleArr(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// 앱과 같은 문지기: 이 기기에서 앱 접속 코드를 넣었거나, 선생님 주소(?admin=…)로 들어왔을 때만 연다.
const MN_TEACHER = new URLSearchParams(location.search).get('admin') === 'grouance-teacher-key';
function mnAppHref() { return 'index.html' + (MN_TEACHER ? location.search : ''); }
function mnGate() {
  const app = document.getElementById('app'); app.innerHTML = '';
  const card = myEl('div'); card.className = 'card';
  card.append(myEl('p', 'font-size:15px;font-weight:700;margin:0 0 8px;', '🔑 먼저 그루앙스 앱에서 접속 코드를 넣어 주세요'));
  card.append(myEl('p', 'font-size:13px;color:#6B7280;line-height:1.6;margin:0 0 4px;', '여백 노트는 그루앙스 앱에 등록한 학생이 쓰는 연습입니다. 앱에서 접속 코드를 한 번 넣으면 이 기기에서는 다시 묻지 않아요.'));
  const go = myEl('a', 'display:block;text-align:center;text-decoration:none;', '그루앙스 앱으로 가기'); go.className = 'secondary'; go.href = mnAppHref();
  card.append(go); app.append(card);
}
function mnSetProfile(p) {
  studentName = p.name || ''; studentSchool = p.school || '-'; studentGrade = p.grade || '-'; studentNumber = p.number || '-';
}
async function mnStart() {
  let open = MN_TEACHER;
  if (!open) { try { const r = await appStorage.get('access-code-verified'); open = !!(r && r.value === 'true'); } catch (e) { open = false; } }
  if (!open) { mnGate(); return; }
  let p = null;
  try { const r = await appStorage.get('margin-note-profile'); if (r && r.value) p = JSON.parse(r.value); } catch (e) { p = null; }
  if (!p || !p.name) { try { const r = await appStorage.get('device-last-profile'); if (r && r.value) p = JSON.parse(r.value); } catch (e) { p = null; } }
  if (p && p.name) mnSetProfile(p);
  if (MN_TEACHER && location.hash === '#teacher') { renderMnTeacher(); return; } // 앱 선생님 화면의 「여백 노트 학생 기록」 단추로 들어온 경우
  if (p && p.name) renderSumMenu(); else mnAskName();
}
function mnAskName() {
  const app = document.getElementById('app'); app.innerHTML = '';
  const card = myEl('div'); card.className = 'card';
  card.append(myEl('p', 'font-size:14px;font-weight:700;color:#16324F;margin:0 0 4px;', '이름을 넣어 주세요'));
  card.append(myEl('p', 'font-size:12.5px;color:#6B7280;margin:0 0 12px;line-height:1.55;', '푼 기록을 이름별로 이 기기에 남깁니다. 앱에서 쓰는 이름 · 학교 · 학년 · 번호를 똑같이 넣으면 좋아요.'));
  const field = (id, label, ph, val) => {
    const l = myEl('label', 'display:block;font-size:13px;font-weight:600;color:#4B5563;margin-top:10px;', label); l.htmlFor = id;
    const i = myEl('input', 'width:100%;padding:11px 12px;border-radius:10px;border:1px solid #D1D5DB;margin-top:6px;font-size:14px;');
    i.id = id; i.type = 'text'; i.placeholder = ph; i.value = val && val !== '-' ? val : '';
    card.append(l, i); return i;
  };
  const n = field('mnName', '이름 (꼭)', '예: 김민준', studentName);
  const s = field('mnSchool', '학교 (넣으면 좋아요)', '예: OO고등학교', studentSchool);
  const g = field('mnGrade', '학년', '예: 2', studentGrade);
  const no = field('mnNumber', '반 / 번호', '예: 3반 12번', studentNumber);
  const msg = myEl('p', 'font-size:12.5px;color:#B42318;margin:8px 0 0;min-height:1em;', '');
  const go = myEl('button', null, '시작하기'); go.className = 'primary';
  go.onclick = async () => {
    const p = { name: n.value.trim(), school: s.value.trim(), grade: g.value.trim(), number: no.value.trim() };
    if (!p.name) { msg.textContent = '이름을 넣어 주세요.'; n.focus(); return; }
    await appStorage.set('margin-note-profile', JSON.stringify(p));
    mnSetProfile(p); sumState = null; renderSumMenu();
  };
  card.append(msg, go); app.append(card);
  const back = myEl('a', 'display:block;text-align:center;font-size:12.5px;color:#16324F;font-weight:600;text-decoration:none;margin-top:4px;', '← 그루앙스 앱으로'); back.href = mnAppHref();
  app.append(back);
}
</script>
<script>
// ===== 여백 노트 — 두 낱말로 잡는 해석력 (별도 페이지 margin-note.html, 2026-11-06, 문장 축약 방) =====
// 영어 문장을 읽고 「무엇에 대해 무엇을 말하는지」를 우리말 낱말 1~3개로 줄이는 연습. 앱(index.html)과 문제 · 기록이 완전히 따로다.
// 핵심이 숨은 깊이(1~5)를 섞어서 내고, 풀자마자 정답과 해설을 보여 준다(깊이 이름은 다 푼 뒤에만 보여 줌). 기본 · 도약 · 심화 세 묶음을 학생이 단추로 고른다(도약은 2026-11-11에 더함 — 인계문서 532 · 533 · 534번).
// 보기는 낼 때마다 섞으므로, 해설은 보기 번호가 아니라 보기 글(「…」)로 가리킨다.
// 자료는 SUM_SETS 하나: 기본(basic, 앱 레벨 5~6) · 도약(mid, 앱 레벨 6~7) · 심화(adv, 앱 레벨 7~8). 묶음마다 고르기 choose · 직접 쓰기 write · 단락 paras.
// 학생은 언제든 묶음을 바꿀 수 있다(선생님 결정 2026-11-06). 문항이 아직 없는 연습은 단추에 「준비 중」이라 보인다.
// 진행 기록은 이 기기에 두고, 앱과 같은 구글 시트 「진행상태」 탭에도 종류 marginnote 한 줄로 보낸다(2026-11-07, 선생님 화면용).
// 앱의 활동로그 · 진단결과 · 오답원인 탭에는 쓰지 않으므로 앱의 통계 · 리포트에는 섞이지 않는다.
const SUM_SETS = {"basic":{"choose":[{"id":"1-1","k":1,"dev":"mainly because (까닭)","s":"Our school moved its bike racks to the front gate, and more students now ride to school, mainly because the guard can watch their bikes.","a":"거치대 교문 곁으로 → 자전거 통학 인기","why":"mainly because 뒤는 까닭을 덧붙인 말이에요. 요점은 그 앞의 두 주절이에요. 학교가 자전거 보관대(거치대)를 정문(교문)으로 옮기자(moved its bike racks to the front gate) 자전거를 타고 오는 학생이 늘었어요(more students now ride to school). 경비원이 자전거를 지켜볼 수 있다는 것(the guard can watch their bikes)은 그 까닭일 뿐이에요. 그래서 요점은 거치대를 교문 곁으로 옮기자 자전거 통학이 인기를 끈다는 거예요.","tr":[["거치대 교문 곁으로 → 자전거 도난 줄어듦","거치대를 교문 쪽으로 옮긴 것은 맞지만 결과를 바꿨어요. 도난 이야기는 글에 없고, 늘어난 것은 자전거를 타고 오는 학생이에요(more students now ride to school)."],["정문 보관대 CCTV → 자전거 통학 인기","카메라로 지켜보면 안심하고 탄다는 그럴듯한 말이지만, 학교가 한 일은 보관대를 정문으로 옮긴 거예요(moved its bike racks to the front gate)."],["정문 보관대 CCTV → 자전거 도난 줄어듦","정문 · 보관대 · 자전거 낱말은 같지만 글에는 둘 다 없어요. 학교는 보관대를 정문으로 옮겼고(moved its bike racks to the front gate), 자전거로 오는 학생이 늘었어요(more students now ride to school)."],["경비원 → 정문의 자전거를 지켜봐 줌","mainly because 뒤의 까닭(the guard can watch their bikes)만 옮겼어요. 왜 늘었는지일 뿐, 요점은 보관대를 옮기자 자전거로 오는 학생이 늘었다는 거예요(more students now ride to school)."]],"dg":"because"},{"id":"1-2","k":1,"dev":"덧붙은 세부 (most of them ~)","s":"Our laundromat's owner put up a shelf of used books, most of them from a retired teacher, and customers now chat with each other far more.","a":"읽을거리 비치 → 이용객끼리 담소 활발","why":"쉼표 사이 most of them from a retired teacher는 책이 어디서 왔는지 덧붙인 세부예요. 요점은 그것을 빼고 이은 두 주절이에요. 빨래방 주인이 헌책 책장을 들여놓자(Our laundromat's owner put up a shelf of used books) 손님들이 서로 훨씬 더 많이 이야기해요(customers now chat with each other far more). 그래서 요점은 읽을거리를 갖춰 두자 이용객끼리 담소(이야기)가 활발해졌다는 거예요.","tr":[["읽을거리 비치 → 손님 기다림 덜 지루함","읽을거리를 갖춰 둔 것은 맞지만 결과를 바꿨어요. 지루함 이야기는 글에 없고, 늘어난 것은 손님들끼리 나누는 이야기예요(customers now chat with each other far more)."],["헌책 판매대 → 이용객끼리 담소 활발","헌책을 팔면 손님이 모여 이야기한다는 그럴듯한 말이지만, 주인은 헌책을 판 게 아니라 헌책 책장을 들여놓았어요(put up a shelf of used books)."],["헌책 판매대 → 손님 기다림 덜 지루함","헌책 · 손님 낱말은 같지만 글에는 둘 다 없어요. 주인은 헌책 책장을 들여놓았고(put up a shelf of used books), 손님들끼리 이야기가 늘었어요(customers now chat with each other far more)."],["헌책 → 대부분 퇴직 교사가 내놓음","쉼표 사이 덧붙은 세부(most of them from a retired teacher)만 옮겼어요. 책이 어디서 왔는지일 뿐, 요점은 손님들이 서로 훨씬 많이 이야기하게 됐다는 거예요(customers now chat with each other far more)."]],"dg":"덧붙은 세부"},{"id":"1-3","k":1,"dev":"so that (목적)","s":"Our last bus now waits five extra minutes so that students finishing club activities can catch it, and far fewer parents drive to school in the evening.","a":"하교 버스 늦춤 → 데리러 오는 차 뜸해짐","why":"so that 뒤는 버스를 기다리게 한 목적이에요. 요점은 그것을 빼고 이은 두 주절이에요. 막차가 5분 더 기다렸다 떠나자(Our last bus now waits five extra minutes) 저녁에 차로 학교에 오는 학부모가 훨씬 줄었어요(far fewer parents drive to school in the evening). 동아리를 마친 학생도 탈 수 있게 하려는 것(so that students finishing club activities can catch it)은 목적일 뿐이에요. 그래서 요점은 하교 버스 출발을 늦추자 데리러 오는 차가 뜸해졌다는 거예요.","tr":[["하교 버스 늦춤 → 학부모 저녁 걱정 줄어듦","버스 출발을 늦춘 것은 맞지만 결과를 바꿨어요. 걱정 이야기는 글에 없고, 줄어든 것은 저녁에 차로 학교에 오는 학부모예요(far fewer parents drive to school in the evening)."],["버스 한 대 더 → 데리러 오는 차 뜸해짐","버스를 한 대 더 넣으면 차로 데리러 올 일이 준다는 그럴듯한 말이지만, 학교가 바꾼 것은 막차가 5분 더 기다리는 거예요(Our last bus now waits five extra minutes)."],["버스 한 대 더 → 학부모 저녁 걱정 줄어듦","버스 · 더 · 학부모 · 저녁 낱말은 같지만 글에는 둘 다 없어요. 막차가 5분 더 기다리게 됐고(Our last bus now waits five extra minutes), 저녁에 차로 오는 학부모가 줄었어요(far fewer parents drive to school in the evening)."],["동아리 마친 학생 → 막차를 탈 수 있게 됨","so that 뒤의 목적(so that students finishing club activities can catch it)만 옮겼어요. 버스를 왜 기다리게 했는지일 뿐, 요점은 저녁에 차로 오는 학부모가 줄었다는 거예요(far fewer parents drive to school in the evening)."]],"dg":"so that"},{"id":"1-4","k":1,"dev":"쌍점(:) 뒤 세부 (수를 덧붙임)","s":"A short recipe card on every eggplant has made eggplants the top seller at our market's vegetable stand: about three hundred sold last month.","a":"요리법 쪽지 → 가지가 가장 잘 팔림","why":"쌍점(:) 뒤가 늘 요점은 아니에요. 이 문장에서 쌍점 뒤는 얼마나 팔렸는지 수를 덧붙였을 뿐이에요(about three hundred sold last month). 요점은 앞의 주절이에요. 가지마다 짧은 요리법 쪽지를 붙였더니(A short recipe card on every eggplant) 가지가 채소 가게에서 가장 잘 팔리는 물건이 됐어요(has made eggplants the top seller). 그래서 요점은 요리법 쪽지 덕에 가지가 가장 잘 팔린다는 거예요.","tr":[["요리법 쪽지 → 단골손님 늘어남","요리법 쪽지는 맞지만 결과를 바꿨어요. 단골 이야기는 글에 없고, 가지가 가장 잘 팔리는 물건이 됐어요(has made eggplants the top seller)."],["할인 스티커 → 가지가 가장 잘 팔림","값을 깎아 주면 잘 팔린다는 그럴듯한 말이지만, 가지에 붙인 것은 할인 스티커가 아니라 짧은 요리법 쪽지예요(A short recipe card on every eggplant)."],["할인 스티커 → 단골손님 늘어남","싸게 팔면 단골이 는다는 흔한 말이지만, 글에는 둘 다 없어요. 가지에 요리법 쪽지를 붙였고(A short recipe card on every eggplant), 가지가 가장 잘 팔리게 됐어요(has made eggplants the top seller)."],["가지 → 지난달 삼백 개쯤 팔림","쌍점 뒤의 수(about three hundred sold last month)만 옮겼어요. 얼마나 팔렸는지 덧붙인 세부일 뿐, 요점은 요리법 쪽지로 가지가 가장 잘 팔리게 됐다는 거예요(has made eggplants the top seller)."]],"dg":"쌍점"},{"id":"1-5","k":1,"dev":"두 문장 (둘째는 덧붙인 모습)","s":"Our cafeteria now posts the whole week's menu every Monday, and fewer students skip lunch. Some even plan their snacks around the days with the meals they like least.","a":"식단 미리 공개 → 급식 먹는 학생 늘어남","why":"요점은 첫 문장의 두 주절이에요. 급식실이 월요일마다 한 주 식단을 미리 붙이자(Our cafeteria now posts the whole week's menu every Monday) 점심을 거르는 학생이 줄었어요(fewer students skip lunch). 점심을 거르는 학생이 줄었다는 것은 급식을 먹는 학생이 늘었다는 뜻이에요. 둘째 문장은 일부 학생의 모습을 덧붙였을 뿐이에요(Some even plan their snacks around the days with the meals they like least). 그래서 요점은 식단을 미리 공개하자 급식 먹는 학생이 늘었다는 거예요.","tr":[["식단 미리 공개 → 음식 남기는 양 줄어듦","식단을 미리 붙이는 것은 맞지만 결과를 바꿨어요. 남기는 양 이야기는 글에 없고, 줄어든 것은 점심을 거르는 학생이에요(fewer students skip lunch)."],["인기 메뉴 추가 → 급식 먹는 학생 늘어남","좋아하는 메뉴를 늘리면 급식을 먹는다는 그럴듯한 말이지만, 급식실이 한 일은 한 주 식단을 미리 붙이는 거예요(Our cafeteria now posts the whole week's menu every Monday)."],["인기 메뉴 추가 → 음식 남기는 양 줄어듦","좋아하는 메뉴가 많으면 덜 남긴다는 흔한 말이지만, 글에는 둘 다 없어요. 급식실은 식단을 미리 붙였고(Our cafeteria now posts the whole week's menu every Monday), 점심을 거르는 학생이 줄었어요(fewer students skip lunch)."],["일부 학생 → 싫은 메뉴 날엔 간식 챙김","둘째 문장의 세부(Some even plan their snacks around the days with the meals they like least)만 옮겼어요. 몇몇 학생의 모습일 뿐, 요점은 점심을 거르는 학생이 줄었다는 거예요(fewer students skip lunch)."]],"dg":"두 문장"},{"id":"1-6","k":1,"dev":"with + 명사 + 분사 (덧붙은 세부)","s":"Most umbrellas lent out at our school's front door come back within two days, with many returned neatly folded by younger students.","a":"대여 우산 → 대부분 이틀 새 반납","why":"with 뒤는 어떤 모습으로 돌아오는지 덧붙인 세부예요. 요점은 앞의 주절이에요. 학교 현관에서 빌려준 우산은 대부분 이틀 안에 돌아와요(Most umbrellas lent out at our school's front door come back within two days). 후배들이 곱게 접어 돌려준다는 것(with many returned neatly folded by younger students)은 덧붙인 모습일 뿐이에요. 그래서 요점은 빌려준(대여) 우산이 대부분 이틀 사이에 돌아온다(반납된다)는 거예요.","tr":[["현관 → 우산 빌리는 줄 길어짐","현관 · 우산 낱말을 빌렸지만 글에 없는 말이에요. 글은 빌리는 줄이 길다고 하지 않고, 빌려준 우산이 대부분 돌아온다고 해요(come back within two days)."],["빌려준 우산 → 이틀 넘겨 돌아옴","우산 · 이틀 · 돌아오다 낱말은 같지만 뜻을 비틀었어요. 이틀을 넘겨 오는 게 아니라 이틀 안에 돌아와요(come back within two days)."],["빌려준 우산 → 절반은 안 돌아옴","빌려준 우산은 다 돌아오지 않는다는 흔한 걱정이지만, 대부분이 돌아와요(Most umbrellas lent out at our school's front door come back within two days)."],["후배들 → 우산 곱게 접어 돌려줌","with 뒤에 덧붙은 세부(with many returned neatly folded by younger students)만 옮겼어요. 어떤 모습으로 돌아오는지일 뿐, 요점은 우산이 대부분 이틀 안에 돌아온다는 거예요(Most umbrellas lent out ... come back within two days)."]],"dg":"with"},{"id":"1-7","k":1,"dev":"such as (예) · used to (예 속 옛 모습)","s":"Water refill stations have cut our school store's sales of bottled drinks, such as sports drinks that used to sell out by noon.","a":"급수대 설치 → 병 음료 판매 줄어듦","why":"such as 뒤는 어떤 음료인지 예를 든 것이고, 그 안의 used to는 예전 모습을 덧붙일 뿐이에요. 요점은 앞의 주절이에요. 학교에 물을 받아 마시는 급수대가 생기자(Water refill stations) 학교 매점의 병 음료 판매가 줄었어요(have cut our school store's sales of bottled drinks). 그래서 요점은 급수대가 생기자 병 음료 판매가 줄었다는 거예요.","tr":[["급수대 설치 → 페트병 쓰레기 줄어듦","급수대가 생긴 것은 맞지만 결과를 바꿨어요. 쓰레기 이야기는 글에 없고, 줄어든 것은 매점의 병 음료 판매예요(have cut our school store's sales of bottled drinks)."],["물병 나눔 → 병 음료 판매 줄어듦","물병을 나눠 주면 음료를 덜 산다는 그럴듯한 말이지만, 병 음료 판매를 줄인 것은 학교에 생긴 급수대예요(Water refill stations)."],["물병 나눔 → 페트병 쓰레기 줄어듦","물병을 쓰면 페트병 쓰레기가 준다는 흔한 말이지만, 글에는 둘 다 없어요. 학교에 급수대가 생겼고(Water refill stations), 매점의 병 음료 판매가 줄었어요(have cut our school store's sales of bottled drinks)."],["스포츠 음료 → 예전엔 정오 전 품절","such as 뒤의 예(sports drinks that used to sell out by noon)만 옮겼어요. 어떤 음료인지 예를 든 것일 뿐, 요점은 병 음료 판매가 줄었다는 거예요(have cut our school store's sales of bottled drinks)."]],"dg":"such as"},{"id":"1-8","k":1,"dev":"which means (결과를 한 번 더 덧붙임)","s":"Our school replaced its loud bell with a short song, and more students now get to class on time, which means lessons start without scolding.","a":"종 대신 노래 → 늦는 학생 줄어듦","why":"which means(그 말은 곧) 뒤가 늘 요점은 아니에요. 여기서는 그 결과로 생긴 일을 한 번 더 덧붙였을 뿐이에요(lessons start without scolding). 요점은 앞의 두 주절이에요. 학교가 시끄러운 종 대신 짧은 노래를 틀자(replaced its loud bell with a short song) 제시간에 교실로 돌아오는 학생이 늘었어요(more students now get to class on time). 그래서 요점은 종 대신 노래를 틀자 늦는 학생이 줄었다는 거예요.","tr":[["종 대신 노래 → 복도 소음 줄어듦","종 대신 노래를 튼 것은 맞지만 결과를 바꿨어요. 소음 이야기는 글에 없고, 늘어난 것은 제시간에 교실로 돌아오는 학생이에요(more students now get to class on time)."],["작은 종소리 → 늦는 학생 줄어듦","종소리를 부드럽게 하면 덜 늦는다는 그럴듯한 말이지만, 학교는 종소리를 줄인 게 아니라 종을 짧은 노래로 바꿨어요(replaced its loud bell with a short song)."],["작은 종소리 → 복도 소음 줄어듦","종소리를 줄이면 시끄러움이 준다는 흔한 말이지만, 글에는 둘 다 없어요. 학교는 종을 짧은 노래로 바꿨고(replaced its loud bell with a short song), 제시간에 돌아오는 학생이 늘었어요(more students now get to class on time)."],["수업 → 이제 꾸중 없이 시작함","which means 뒤의 덧붙은 결과(lessons start without scolding)만 옮겼어요. 요점은 제시간에 교실로 돌아오는 학생이 늘었다는 거예요(more students now get to class on time)."]],"dg":"which means that"},{"id":"1-9","k":1,"dev":"분사구문 앞머리 (Hoping ~, )","s":"Hoping to make the park friendlier, our town turned some benches to face each other, and older residents now sit there twice as long.","a":"의자 배치 바꿈 → 머무는 시간 길어짐","why":"앞머리 분사구문(Hoping to make the park friendlier)은 마을이 바란 것을 덧붙인 배경이에요. 요점은 뒤의 두 주절이에요. 마을이 벤치 몇 개를 서로 마주 보게 돌려놓자(turned some benches to face each other) 어르신들이 그곳에 앉아 있는 시간이 두 배로 길어졌어요(older residents now sit there twice as long). 그래서 요점은 의자(벤치) 배치를 바꾸자 머무는 시간이 길어졌다는 거예요.","tr":[["의자 배치 바꿈 → 어르신 산책 두 배","의자 배치를 바꾼 것은 맞지만 결과를 바꿨어요. 산책 이야기는 글에 없고, 두 배가 된 것은 어르신들이 앉아 있는 시간이에요(older residents now sit there twice as long)."],["벤치 그늘막 → 머무는 시간 길어짐","그늘을 만들면 오래 머문다는 그럴듯한 말이지만, 마을이 한 일은 벤치를 서로 마주 보게 돌려놓은 거예요(turned some benches to face each other)."],["벤치 그늘막 → 어르신 산책 두 배","벤치 · 어르신 · 두 배 낱말은 같지만 글에는 둘 다 없어요. 마을은 벤치를 마주 보게 돌렸고(turned some benches to face each other), 두 배가 된 것은 앉아 있는 시간이에요(older residents now sit there twice as long)."],["마을 → 공원을 더 정겹게 하려 함","앞머리 분사구문의 바람(Hoping to make the park friendlier)만 옮겼어요. 왜 그렇게 했는지일 뿐, 요점은 어르신들이 앉아 있는 시간이 늘었다는 거예요(older residents now sit there twice as long)."]],"dg":"분사구문 앞머리"},{"id":"1-10","k":1,"dev":"괄호 ( ) 속 세부","s":"The ice cream shop by our school added a half-size cup (about the size of an egg), and its weekday sales are now the best ever.","a":"미니 사이즈 등장 → 주중 매상 최고","why":"괄호 속(about the size of an egg)은 컵이 얼마나 작은지 덧붙인 세부예요. 요점은 괄호를 빼고 이은 두 주절이에요. 학교 옆 아이스크림 가게가 절반 크기 컵을 내놓자(added a half-size cup) 평일 판매가 그 어느 때보다 많아요(its weekday sales are now the best ever). 그래서 요점은 미니 사이즈가 나오자 주중(평일) 매상이 가장 많아졌다는 거예요.","tr":[["미니 사이즈 등장 → 평일 아이 손님 증가","작은 사이즈가 나온 것은 맞지만 결과를 바꿨어요. 아이 손님 이야기는 글에 없고, 평일 판매가 그 어느 때보다 많아요(its weekday sales are now the best ever)."],["컵 할인 이벤트 → 주중 매상 최고","컵 값을 깎아 주면 잘 팔린다는 그럴듯한 말이지만, 가게가 새로 한 것은 절반 크기 컵을 내놓은 거예요(added a half-size cup)."],["컵 할인 이벤트 → 평일 아이 손님 증가","컵 · 평일 낱말은 같지만 글에는 둘 다 없어요. 가게는 절반 크기 컵을 내놓았고(added a half-size cup), 평일 판매가 그 어느 때보다 많아요(its weekday sales are now the best ever)."],["절반 크기 컵 → 달걀 하나만 한 크기","괄호 속 세부(about the size of an egg)만 옮겼어요. 얼마나 작은지일 뿐, 요점은 평일 판매가 그 어느 때보다 많다는 거예요(its weekday sales are now the best ever)."]],"dg":"괄호 속 세부"},{"id":"1-11","k":1,"dev":"mostly because (까닭)","s":"Our teacher put a box for unsigned questions on her desk, and shy students now ask far more questions, mostly because no one knows who asked.","a":"익명 메모함 → 숫기 없는 아이 물음 늘어남","why":"mostly because 뒤는 까닭을 덧붙인 말이에요. 요점은 그 앞의 두 주절이에요. 선생님이 책상 위에 이름 없는 질문 쪽지 상자를 두자(put a box for unsigned questions on her desk) 수줍은 학생들이 훨씬 많이 묻게 됐어요(shy students now ask far more questions). 누가 물었는지 아무도 모른다는 것(no one knows who asked)은 그 까닭일 뿐이에요. 그래서 요점은 익명 메모함을 두자 숫기 없는(수줍은) 아이들의 물음이 늘었다는 거예요.","tr":[["익명 메모함 → 수줍은 학생 고민 상담 늘어남","이름 없는 쪽지 상자는 맞지만 결과를 바꿨어요. 고민 상담 이야기는 글에 없고, 늘어난 것은 수줍은 학생들의 질문이에요(shy students now ask far more questions)."],["질문 게시판 → 숫기 없는 아이 물음 늘어남","게시판에 올리면 묻기 쉽다는 그럴듯한 말이지만, 선생님이 둔 것은 책상 위의 이름 없는 질문 쪽지 상자예요(put a box for unsigned questions on her desk)."],["질문 게시판 → 수줍은 학생 고민 상담 늘어남","질문 · 수줍은 학생 낱말은 같지만 글에는 둘 다 없어요. 선생님은 질문 쪽지 상자를 두었고(put a box for unsigned questions on her desk), 수줍은 학생들의 질문이 늘었어요(shy students now ask far more questions)."],["질문 → 누가 했는지 아무도 알 수 없음","mostly because 뒤의 까닭(no one knows who asked)만 옮겼어요. 왜 늘었는지일 뿐, 요점은 수줍은 학생들이 훨씬 많이 묻게 됐다는 거예요(shy students now ask far more questions)."]],"dg":"because"},{"id":"1-12","k":1,"dev":"관계절 덧붙임 (, which ~ ,)","s":"Our apartment complex opened a tool library, which two college students run on weekends, and neighbors now buy far fewer drills for one-time jobs.","a":"연장 빌려주는 곳 → 드릴 장만 뜸해짐","why":"쉼표 사이의 which 절(which two college students run on weekends)은 누가 운영하는지 덧붙인 말이에요. 요점은 which 절을 빼고 이은 두 주절이에요. 아파트 단지에 공구 대여소가 생기자(Our apartment complex opened a tool library) 이웃들이 한 번 쓰려고 드릴을 사는 일이 훨씬 줄었어요(neighbors now buy far fewer drills for one-time jobs). 그래서 요점은 연장(공구)을 빌려주는 곳이 생기자 드릴 장만(구매)이 뜸해졌다는 거예요.","tr":[["연장 빌려주는 곳 → 이웃 주말 수리 늘어남","연장을 빌려주는 곳은 맞지만 결과를 바꿨어요. 수리 이야기는 글에 없고, 줄어든 것은 한 번 쓰려고 사는 드릴이에요(neighbors now buy far fewer drills for one-time jobs)."],["공구 수리 교실 → 드릴 장만 뜸해짐","수리를 배우면 공구를 덜 산다는 그럴듯한 말이지만, 아파트 단지에 생긴 것은 공구를 빌려주는 곳이에요(Our apartment complex opened a tool library)."],["공구 수리 교실 → 이웃 주말 수리 늘어남","공구 · 이웃 · 주말 낱말은 같지만 글에는 둘 다 없어요. 아파트 단지에 공구 대여소가 생겼고(Our apartment complex opened a tool library), 이웃들이 드릴을 훨씬 덜 사요(neighbors now buy far fewer drills for one-time jobs)."],["대학생 둘 → 주말마다 맡아서 운영","쉼표 사이 which 절(which two college students run on weekends)만 옮겼어요. 누가 운영하는지일 뿐, 요점은 이웃들이 드릴을 덜 사게 됐다는 거예요(neighbors now buy far fewer drills for one-time jobs)."]],"dg":"관계절 덧붙임"},{"id":"1-13","k":1,"dev":"세미콜론(;) 뒤 세부","s":"The town pool cut its price for the last hour each day, and families now fill it after dinner; most, the staff say, walk there.","a":"마감 할인 → 저녁 가족 손님 북적","why":"세미콜론(;) 뒤가 늘 요점은 아니에요. 여기서 세미콜론 뒤는 손님들이 어떻게 오는지 직원 말을 덧붙였을 뿐이에요(most, the staff say, walk there). 요점은 앞의 두 주절이에요. 동네 수영장이 하루 마지막 한 시간 값을 내리자(cut its price for the last hour each day) 저녁을 먹은 가족들이 수영장을 채워요(families now fill it after dinner). 그래서 요점은 마감 할인으로 저녁에 가족 손님이 북적인다는 거예요.","tr":[["마감 할인 → 퇴근길 직장인 북적","마감 할인은 맞지만 누가 오는지 바꿨어요. 직장인 이야기는 글에 없고, 저녁을 먹은 가족들이 수영장을 채워요(families now fill it after dinner)."],["수영 강습 → 저녁 가족 손님 북적","강습을 열면 손님이 몰린다는 그럴듯한 말이지만, 수영장이 바꾼 것은 하루 마지막 한 시간의 값이에요(cut its price for the last hour each day)."],["수영 강습 → 퇴근길 직장인 북적","저녁 강습에 직장인이 몰린다는 그럴듯한 말이지만, 글에는 둘 다 없어요. 수영장은 마지막 한 시간 값을 내렸고(cut its price for the last hour each day), 저녁을 먹은 가족들이 수영장을 채워요(families now fill it after dinner)."],["가족 손님 → 대부분 걸어서 옴","세미콜론 뒤의 세부(most, the staff say, walk there)만 옮겼어요. 손님들이 어떻게 오는지일 뿐, 요점은 마감 할인 뒤 저녁에 가족 손님이 수영장을 채운다는 거예요(families now fill it after dinner)."]],"dg":"세미콜론 뒤 세부"},{"id":"1-14","k":1,"dev":"especially when (효과가 큰 때 덧붙임)","s":"Our class now votes on the Friday sport, and fewer students sit out PE, especially when the vote picks a game nobody has played before.","a":"반이 경기 결정 → 참여 안 하는 아이 감소","why":"especially when 뒤는 효과가 특히 클 때를 덧붙인 말이에요. 요점은 앞의 두 주절이에요. 반이 금요일 종목을 투표로 정하자(Our class now votes on the Friday sport) 체육 시간에 빠져 앉아 있는 학생이 줄었어요(fewer students sit out PE). 아무도 해 보지 않은 경기가 뽑힐 때(especially when the vote picks a game nobody has played before) 더 그렇다는 것은 덧붙임일 뿐이에요. 그래서 요점은 반이 경기를 직접 정하자 참여하지 않는 아이가 줄었다는 거예요.","tr":[["반이 경기 결정 → 체육 시간 학생 다툼 줄어듦","반이 경기를 정하는 것은 맞지만 결과를 바꿨어요. 다툼 이야기는 글에 없고, 줄어든 것은 체육 시간에 빠져 앉아 있는 학생이에요(fewer students sit out PE)."],["금요일 종목 추첨 → 참여 안 하는 아이 감소","금요일 · 종목 낱말은 같지만 정하는 방법을 바꿨어요. 금요일 종목은 제비뽑기가 아니라 반 투표로 정해요(Our class now votes on the Friday sport)."],["금요일 종목 추첨 → 체육 시간 학생 다툼 줄어듦","금요일 · 종목 · 체육 · 학생 낱말은 같지만 글에는 둘 다 없어요. 반은 투표로 종목을 정하고(Our class now votes on the Friday sport), 빠지는 학생이 줄었어요(fewer students sit out PE)."],["모두 처음 하는 경기 → 더 잘 참여하게 됨","especially when 뒤의 덧붙임(especially when the vote picks a game nobody has played before)만 옮겼어요. 특히 그럴 때일 뿐, 요점은 체육 시간에 빠지는 학생이 줄었다는 거예요(fewer students sit out PE)."]],"dg":"especially when"},{"id":"1-15","k":1,"dev":"동격 (쉼표 사이 명사구)","s":"Our school put up a hallway photo wall, a row of class trip pictures going back to 1990, and graduates now visit far more often during vacations.","a":"추억 사진 전시 → 선배들 발길 잦아짐","why":"쉼표 사이의 명사구(a row of class trip pictures going back to 1990)는 사진 벽이 어떤 것인지 다시 풀어 준 말이에요. 요점은 그것을 빼고 이은 두 주절이에요. 학교가 복도에 사진 벽을 만들자(put up a hallway photo wall) 졸업생들이 방학에 학교를 훨씬 자주 찾아와요(graduates now visit far more often during vacations). 그래서 요점은 추억이 담긴 사진을 전시하자 졸업한 선배들의 발길이 잦아졌다는 거예요.","tr":[["추억 사진 전시 → 졸업생 학교 기부 늘어남","사진을 전시한 것은 맞지만 결과를 바꿨어요. 기부 이야기는 글에 없고, 졸업생들이 학교를 훨씬 자주 찾아와요(graduates now visit far more often during vacations)."],["복도 벽화 그리기 → 선배들 발길 잦아짐","벽화를 그리면 졸업생이 찾아온다는 그럴듯한 말이지만, 학교가 만든 것은 수학여행 사진을 건 사진 벽이에요(put up a hallway photo wall)."],["복도 벽화 그리기 → 졸업생 학교 기부 늘어남","복도 · 졸업생 · 학교 낱말은 같지만 글에는 둘 다 없어요. 학교는 복도에 사진 벽을 만들었고(put up a hallway photo wall), 졸업생들이 학교를 훨씬 자주 찾아와요(graduates now visit far more often during vacations)."],["여행 사진 → 1990년 것부터 있음","쉼표 사이 명사구(a row of class trip pictures going back to 1990)만 옮겼어요. 사진 벽이 어떤 것인지 다시 풀어 준 말일 뿐, 요점은 졸업생들이 학교를 훨씬 자주 찾아온다는 거예요(graduates now visit far more often during vacations)."]],"dg":"동격"},{"id":"1-16","k":1,"dev":"줄표(—) 사이에 끼운 말","s":"Selling single pencils — something the owner tried after a supplier sent too many — has brought younger kids into the stationery store by our school.","a":"연필 낱개 판매 → 어린 손님 늘어남","why":"줄표(—) 사이는 주인이 그렇게 해 본 사정을 끼워 넣은 말이에요(something the owner tried after a supplier sent too many). 줄표로 끼운 말이 눈에 띈다고 요점은 아니에요. 요점은 줄표를 빼고 이은 주절이에요. 연필을 한 자루씩 팔기 시작하자(Selling single pencils) 학교 옆 문구점에 어린아이들이 들어오게 됐어요(has brought younger kids into the stationery store by our school). 그래서 요점은 연필을 낱개로 팔자 어린 손님이 늘었다는 거예요.","tr":[["연필 낱개 판매 → 연필 재고 줄어듦","연필을 낱개로 판 것은 맞지만 결과를 바꿨어요. 재고가 줄었다는 말은 글에 없고, 어린아이들이 문구점에 들어오게 됐어요(has brought younger kids into the stationery store by our school)."],["연필 묶음 할인 → 어린 손님 늘어남","묶음으로 싸게 팔면 아이들이 온다는 그럴듯한 말이지만, 문구점은 연필을 한 자루씩 팔았어요(Selling single pencils)."],["연필 묶음 할인 → 연필 재고 줄어듦","묶음으로 싸게 팔면 재고가 준다는 흔한 말이지만, 글에는 둘 다 없어요. 문구점은 연필을 한 자루씩 팔았고(Selling single pencils), 어린아이들이 들어오게 됐어요(has brought younger kids into the stationery store by our school)."],["주인 → 연필을 너무 많이 받음","줄표 사이에 끼운 말(something the owner tried after a supplier sent too many)만 옮겼어요. 낱개로 팔아 본 사정일 뿐, 요점은 어린아이들이 문구점에 들어오게 됐다는 거예요(has brought younger kids into the stationery store by our school)."]],"dg":"줄표"},{"id":"1-17","k":1,"dev":"to부정사 앞머리 (목적)","s":"To make room for wheelchairs, our town widened the sidewalks on Market Street, and the shops there now get far more weekend shoppers.","a":"보행로 확장 → 휴일 장사 활기","why":"앞머리 To make room for wheelchairs는 마을이 왜 그렇게 했는지 목적을 밝힌 말이에요. 요점은 뒤의 두 주절이에요. 마을이 시장 거리 인도(보행로)를 넓히자(our town widened the sidewalks on Market Street) 그 거리 가게들에 주말 손님이 훨씬 늘었어요(the shops there now get far more weekend shoppers). 그래서 요점은 보행로를 넓히자 휴일(주말) 장사에 활기가 돌았다는 거예요.","tr":[["보행로 확장 → 가게 임대료 오름","보행로를 넓힌 것은 맞지만 결과를 바꿨어요. 임대료 이야기는 글에 없고, 그 거리 가게들에 주말 손님이 훨씬 늘었어요(the shops there now get far more weekend shoppers)."],["인도 꽃길 조성 → 휴일 장사 활기","인도 낱말은 같지만 한 일을 바꿨어요. 꽃길을 꾸민 게 아니라 시장 거리 인도를 넓혔어요(our town widened the sidewalks on Market Street)."],["인도 꽃길 조성 → 가게 임대료 오름","인도 · 가게 낱말은 같지만 글에는 둘 다 없어요. 마을은 인도를 넓혔고(our town widened the sidewalks on Market Street), 가게들에 주말 손님이 늘었어요(the shops there now get far more weekend shoppers)."],["마을 → 휠체어가 다니게 하려 함","앞머리 to부정사의 목적(To make room for wheelchairs)만 옮겼어요. 왜 인도를 넓혔는지일 뿐, 요점은 인도를 넓히자 그 거리 가게들에 주말 손님이 늘었다는 거예요(the shops there now get far more weekend shoppers)."]],"dg":"to부정사 목적"},{"id":"1-18","k":1,"dev":"perhaps because (까닭)","s":"First-year students grew tomatoes in the school garden, and they now eat more vegetables at lunch than other students, perhaps because they know how hard farming is.","a":"직접 작물 재배 → 남보다 야채 많이 먹음","why":"perhaps because 뒤는 그럴 법한 까닭을 덧붙여요. 요점은 앞의 두 주절이에요. 1학년 학생들이 학교 텃밭에서 토마토를 길렀는데(First-year students grew tomatoes in the school garden) 이제 다른 학생들보다 급식에서 채소를 더 많이 먹어요(they now eat more vegetables at lunch than other students). 농사가 얼마나 힘든지 안다는 것(they know how hard farming is)은 짐작한 까닭일 뿐이에요. 그래서 요점은 작물을 직접 길러 본 학생들이 다른 학생들보다 야채(채소)를 많이 먹는다는 거예요.","tr":[["직접 작물 재배 → 다른 반도 채소 더 먹음","직접 길러 본 것은 맞지만 누가 먹는지 바꿨어요. 채소를 더 먹는 것은 다른 반이 아니라 토마토를 기른 1학년이에요(they now eat more vegetables at lunch than other students)."],["토마토 급식 → 남보다 야채 많이 먹음","토마토 낱말은 같지만 한 일을 바꿨어요. 급식에 토마토를 낸 게 아니라 학생들이 학교 텃밭에서 토마토를 직접 길렀어요(First-year students grew tomatoes in the school garden)."],["토마토 급식 → 다른 반도 채소 더 먹음","토마토 · 다른 반 · 채소 낱말은 같지만 글에는 둘 다 없어요. 1학년이 토마토를 길렀고(First-year students grew tomatoes in the school garden), 그 학생들이 다른 학생들보다 채소를 더 먹어요(they now eat more vegetables at lunch than other students)."],["1학년 학생들 → 아마 농사 고생을 앎","perhaps because 뒤의 까닭(they know how hard farming is)만 옮겼어요. 짐작한 까닭일 뿐, 요점은 토마토를 기른 학생들이 채소를 더 많이 먹는다는 거예요(they now eat more vegetables at lunch than other students)."]],"dg":"because"},{"id":"1-19","k":1,"dev":"actually (곁가지 절 안에 있음)","s":"The new bench outside the principal's office, which students actually voted against last year, is now the most popular spot for meeting friends before school.","a":"새 벤치 → 아침 만남 장소 1위","why":"actually가 늘 요점을 가리키지는 않아요. 여기서 actually는 쉼표 사이 which 절(which students actually voted against last year) 안에 있어서, 작년 일을 덧붙인 말일 뿐이에요. 요점은 주어와 동사를 이은 주절이에요. 교장실 앞 새 벤치(The new bench outside the principal's office)가 이제 등교 전에 친구를 만나는 가장 인기 있는 자리예요(is now the most popular spot for meeting friends before school). 그래서 요점은 새 벤치가 아침에 친구를 만나는 장소 1위가 됐다는 거예요.","tr":[["새 벤치 → 점심시간 수다 명소","새 벤치는 맞지만 언제인지 바꿨어요. 점심시간 이야기는 글에 없고, 등교 전에 친구를 만나는 가장 인기 있는 자리예요(the most popular spot for meeting friends before school)."],["새 정자 → 아침 만남 장소 1위","새로 생긴 쉼터라는 것은 같지만 무엇인지 바꿨어요. 가장 인기 있는 곳은 정자가 아니라 교장실 앞 새 벤치예요(The new bench outside the principal's office)."],["새 정자 → 점심시간 수다 명소","새 쉼터에 모여 이야기한다는 그럴듯한 말이지만, 글에는 둘 다 없어요. 가장 인기 있는 곳은 교장실 앞 새 벤치이고(The new bench outside the principal's office), 등교 전에 친구를 만나는 자리예요(meeting friends before school)."],["학생들 → 작년엔 설치 반대","actually가 든 which 절(which students actually voted against last year)만 옮겼어요. 작년 일을 덧붙인 말일 뿐, 요점은 그 벤치가 이제 친구를 만나는 가장 인기 있는 자리라는 거예요(is now the most popular spot for meeting friends before school)."]],"dg":"actually"},{"id":"1-20","k":1,"dev":"두 문장 (둘째는 누가 했는지 덧붙임)","s":"The bus stop near our school got a small roof, and parents have stopped complaining about kids waiting in the rain. Students in the woodworking club built the roof.","a":"정류장 지붕 → 학부모 불평 그침","why":"요점은 첫 문장의 두 주절이에요. 학교 앞 버스 정류장에 작은 지붕이 생기자(The bus stop near our school got a small roof) 아이들이 비를 맞으며 기다린다는 학부모들의 불평이 그쳤어요(parents have stopped complaining about kids waiting in the rain). 둘째 문장은 지붕을 누가 만들었는지 덧붙였을 뿐이에요(Students in the woodworking club built the roof). 그래서 요점은 정류장에 지붕이 생기자 학부모 불평이 그쳤다는 거예요.","tr":[["정류장 지붕 → 버스 이용 늘어남","정류장 지붕은 맞지만 결과를 바꿨어요. 버스 이용 이야기는 글에 없고, 학부모들의 불평이 그쳤어요(parents have stopped complaining about kids waiting in the rain)."],["정류장 벤치 → 학부모 불평 그침","앉을 곳이 생기면 불만이 준다는 그럴듯한 말이지만, 정류장에 생긴 것은 벤치가 아니라 작은 지붕이에요(The bus stop near our school got a small roof)."],["정류장 벤치 → 버스 이용 늘어남","정류장이 편해지면 버스를 더 탄다는 흔한 말이지만, 글에는 둘 다 없어요. 정류장에 작은 지붕이 생겼고(The bus stop near our school got a small roof), 학부모들의 불평이 그쳤어요(parents have stopped complaining about kids waiting in the rain)."],["목공반 학생들 → 지붕 손수 지음","둘째 문장(Students in the woodworking club built the roof)만 옮겼어요. 누가 만들었는지 덧붙인 말일 뿐, 요점은 지붕이 생긴 뒤 학부모들의 불평이 그쳤다는 거예요(parents have stopped complaining about kids waiting in the rain)."]],"dg":"두 문장"},{"id":"2-1","k":2,"dev":"두 무리 방식 + 실제 기록 (이음말 없음)","s":"Some teachers start the day with quiet reading, others with a game. At our school, classes that played first arrived on time more often, read as many books, and behaved about as well as the rest.","a":"아침 놀이 → 지각을 줄여 줌","why":"이음말 없이 두 방식과 실제 기록이 나란히 있어요. 첫 문장은 하루를 조용한 독서로 여는 교사들과 놀이로 여는 교사들이 있다는 말이에요(start the day with quiet reading, others with a game). 둘째 문장은 놀이로 먼저 시작한 학급의 기록이에요. 시간에 맞춰 온 날은 더 많았고(arrived on time more often), 읽은 책 수는 나머지 학급과 같은 만큼이었고 행동도 비슷했어요(read as many books, and behaved about as well as the rest). 놀이로 열어도 독서나 태도는 밀리지 않았고, 달라진 것은 지각이 줄었다는 점이에요. 그래서 요점은 아침 놀이가 지각을 줄여 준다는 거예요.","tr":[["아침 놀이 → 책을 더 읽게 해 줌","books 낱말은 같지만 정도를 부풀렸어요. 놀이로 먼저 시작한 학급이 읽은 책은 더 많은 게 아니라 나머지 학급과 같은 만큼이에요(read as many books, and behaved about as well as the rest)."],["아침 놀이 → 말을 더 잘 듣게 함","behaved 낱말은 같지만 정도를 부풀렸어요. 놀이로 먼저 시작한 학급의 행동은 더 나아진 게 아니라 나머지 학급과 비슷한 정도예요(behaved about as well as the rest)."],["아침 독서 → 읽는 양을 늘려 줌","독서로 여는 쪽을 지지하는 생각을 옮긴 답이에요(start the day with quiet reading). 놀이로 먼저 시작한 학급도 나머지 학급만큼 책을 읽었으니(read as many books, and behaved about as well as the rest) 독서로 열어야 읽는 양이 는다고 보기 어려워요."],["아침 독서 → 지각을 줄여 줌","arrived on time 이야기는 같지만 누구 이야기인지 바뀌었어요. 시간에 맞춰 온 날이 더 많았던 쪽은 독서로 연 학급이 아니라 놀이로 먼저 시작한 학급이에요(classes that played first arrived on time more often)."]],"dg":"두 무리 ↔ 실제 기록"},{"id":"2-2","k":2,"dev":"while = 「~하는 동안」 (양보 아님)","s":"While a salad bar was being planned, our cafeteria manager worried that students would waste more food. A month later, the trash bins held about as much food as before, and more students were eating vegetables.","a":"샐러드 바 → 낭비 안 늘고 채소 먹기 늘림","why":"While은 여기서 맞섬이 아니라 「계획을 짜는 동안」이라는 때를 말해요(While a salad bar was being planned). 앞 문장의 주절은 관리자의 걱정, 곧 학생들이 음식을 더 버릴 거라는 생각이에요(our cafeteria manager worried that students would waste more food). 맞섬은 이음말 없이 두 문장 사이에 있어요. 한 달 뒤 쓰레기통의 음식은 전과 비슷했고, 채소를 먹는 학생은 늘었어요(the trash bins held about as much food as before, and more students were eating vegetables). 걱정과 달리 버리는 양은 그대로이면서 채소 먹는 학생만 늘었으니, 요점은 샐러드 바가 손해 없이 득을 가져왔다는 거예요.","tr":[["샐러드 바 → 쓰레기통이 더 가벼워짐","food 낱말은 같지만 정도가 달라요. 쓰레기통의 음식은 줄어든 게 아니라 전과 비슷했어요(the trash bins held about as much food as before)."],["샐러드 바 → 채소 먹는 학생은 그대로","vegetables 낱말은 같지만 정도가 달라요. 채소를 먹는 학생은 그대로가 아니라 늘었어요(more students were eating vegetables)."],["샐러드 바 → 버려지는 음식이 늘어남","While 절을 양보로 보고 주절로 가면 닿는 관리자의 걱정(our cafeteria manager worried that students would waste more food)을 결과처럼 옮긴 답이에요. 한 달 뒤 쓰레기통의 음식은 전과 비슷했어요(the trash bins held about as much food as before)."],["샐러드 바 → 골라 먹다 편식이 심해짐","골라 먹게 하면 편식이 는다는 흔한 걱정이지만 글과 달라요. 오히려 채소를 먹는 학생이 늘었어요(more students were eating vegetables)."]],"dg":"때를 나타내는 while"},{"id":"2-3","k":2,"dev":"겉보기와 실제 (한 문장, 이음말 없음)","s":"What sounds like an argument between two grandfathers in our park every morning is a game of yut, in which shouting is half the fun.","a":"공원의 고함 → 놀이하며 내는 소리","why":"이음말 없이 한 문장 안에서 겉보기와 실제가 맞서요. 주어 What sounds like an argument는 「다툼처럼 들리는 것」, 곧 겉보기예요. is 뒤(a game of yut, in which shouting is half the fun)가 실제예요. 두 할아버지는 다투는 게 아니라 윷놀이를 하는 중이고, 그 놀이에서는 소리치는 것이 재미의 절반이에요. 그래서 요점은 공원의 고함이 싸움이 아니라 놀이를 하며 나는 소리, 곧 놀이의 흥을 돋우는 소리라는 거예요.","tr":[["공원의 고함 → 아침 운동의 구령","every morning 낱말은 같지만 하는 일이 달라요. 아침마다 들리는 소리는 운동 구령이 아니라 윷놀이 소리예요(a game of yut)."],["공원의 고함 → 구경꾼들의 응원 소리","shouting 낱말은 같지만 소리를 내는 사람이 달라요. 소리를 내는 쪽은 구경꾼이 아니라 윷놀이를 하는 두 할아버지예요(an argument between two grandfathers ... a game of yut)."],["공원의 고함 → 두 노인의 말다툼","주어 부분, 곧 귀에 들리는 겉보기(What sounds like an argument)를 옮긴 답이에요. 문장은 그것이 다툼이 아니라 윷놀이라고 해요(is a game of yut)."],["공원의 고함 → 귀가 어두운 탓","나이 든 분이 크게 말할 때 흔히 하는 말이지만 글에 없어요. 소리가 큰 까닭은 귀가 아니라 놀이에 있어요(in which shouting is half the fun)."]],"dg":"겉보기 ↔ 실제 (한 문장)"},{"id":"2-4","k":2,"dev":"Despite (양보)","s":"Despite having no air conditioning, the old stone houses in one village stay cool all summer, thanks to their thick walls and small windows.","a":"옛 돌집 → 집 짓는 법 덕에 시원","why":"Despite 뒤는 「에어컨이 없는데도」라는 양보예요(Despite having no air conditioning). 에어컨이 없으면 더울 거라는 예상과 실제가 맞서요. 주절을 뜻으로 보면, 옛 돌집은 여름 내내 시원하고(stay cool all summer), 그 까닭은 두꺼운 벽과 작은 창이에요(thanks to their thick walls and small windows). 그래서 요점은 옛 돌집이 기계가 아니라 집 짓는 법 덕분에 시원하다는 거예요.","tr":[["옛 돌집 → 창이 커서 바람 잘 듦","windows 낱말은 같지만 거꾸로예요. 옛 돌집의 창은 큰 게 아니라 작아요(thick walls and small windows)."],["옛 돌집 → 돌이라 한여름엔 찜통","stone houses 낱말은 같지만 거꾸로예요. 돌집은 한여름에 찜통이 되는 게 아니라 여름 내내 시원해요(stay cool all summer)."],["옛 돌집 → 에어컨 없어 무더움","Despite 쪽(having no air conditioning)에 깔린 예상을 옮긴 답이에요. 주절은 그 예상과 달리 옛 돌집이 여름 내내 시원하다고 해요(stay cool all summer)."],["옛 돌집 → 나무 그늘 덕에 시원","옛집이 시원한 까닭을 두고 흔히 하는 말이지만 글과 달라요. 글이 드는 까닭은 나무 그늘 같은 둘레가 아니라 집 자체, 곧 두꺼운 벽과 작은 창이에요(thanks to their thick walls and small windows)."]],"dg":"despite"},{"id":"2-5","k":2,"dev":"요점 먼저, 남들 생각 뒤 (이음말 없음)","s":"At one noodle shop, customers returned their own trays more often after the tray-return sign was taken down. Many owners assume that a clear sign is the best way to teach tidy habits.","a":"안내판 → 떼자 스스로 치우는 일 늘어남","why":"이음말이 없으니 두 문장이 어떤 사이인지 뜻으로 봐야 해요. 첫 문장은 한 가게의 결과예요. 안내판을 떼고 나니 손님이 자기 쟁반을 제자리에 돌려놓는 일이 더 잦아졌어요(customers returned their own trays more often after the tray-return sign was taken down). 둘째 문장은 Many owners assume으로 시작해, 분명한 안내판이 습관을 가르치는 가장 좋은 방법이라는 것이 주인들의 생각임을 밝혀요(a clear sign is the best way to teach tidy habits). 남들 생각을 뒤에 붙여 가게의 결과와 맞세운 꼴이니, 글쓴이가 내세우는 것은 앞의 결과예요. 그래서 요점은 안내판을 떼자 손님이 스스로 치우는 일이 오히려 늘었다는 거예요.","tr":[["안내판 → 떼도 정리는 전과 같음","sign taken down 이야기는 같지만 정도가 달라요. 안내판을 뗀 뒤 손님이 쟁반을 돌려놓는 일은 전과 같은 게 아니라 더 잦아졌어요(returned their own trays more often)."],["안내판 → 떼자 직원이 쟁반을 걷어 감","trays 낱말은 같지만 치우는 사람이 달라요. 쟁반을 돌려놓은 것은 직원이 아니라 손님 자신이에요(customers returned their own trays)."],["안내판 → 분명할수록 습관이 잡힘","둘째 문장의 주인들 생각(a clear sign is the best way to teach tidy habits)을 옮긴 답이에요. 뒤에 나왔다고 요점이 아니에요. 글쓴이는 첫 문장의 결과, 곧 안내판을 뗀 뒤 정리가 더 잘 된 일로 이 생각에 맞서요(after the tray-return sign was taken down)."],["안내판 → 벌칙이 따라야 효과 있음","벌을 주어야 규칙이 지켜진다는 흔한 말이지만 글에 없어요. 글에는 벌칙 이야기가 없고, 안내판을 뗀 뒤에 오히려 손님이 쟁반을 돌려놓는 일이 더 잦아졌어요(returned their own trays more often after the tray-return sign was taken down)."]],"dg":"요점 먼저 ↔ 남들 생각"},{"id":"2-6","k":2,"dev":"nothing but (「~일 뿐」 — 맞섬 신호 아님)","s":"To most residents, our building's quiet guard is nothing but a man who sorts packages. Ask him about any poem, and he will talk about it for an hour like a teacher.","a":"경비원 → 시를 훤히 꿰고 있는 사람","why":"but이 보이지만 nothing but은 「~일 뿐」이라는 뜻이라 맞섬 신호가 아니에요(nothing but a man who sorts packages). 이 부분은 주민들 눈에 비친 겉보기예요. 맞섬은 이음말 없이 두 문장 사이에 있어요. 둘째 문장에서 어떤 시를 물어도 선생님처럼 한 시간이나 이야기한다니(he will talk about it for an hour like a teacher), 택배만 나누는 사람이 아니라 시를 훤히 꿰고 있는 사람이에요. 글쓴이가 힘주는 것은 겉보기를 뒤집는 둘째 문장이에요.","tr":[["경비원 → 시는 알아도 말솜씨 서투름","poem 낱말은 같지만 정도가 달라요. 어떤 시를 물어도 선생님처럼 한 시간이나 이야기한다니 말솜씨가 서투른 사람이 아니에요(he will talk about it for an hour like a teacher)."],["경비원 → 주민에게 시 선생으로 통함","residents 낱말은 같지만 범위가 달라요. 대부분의 주민 눈에 그는 택배를 나누는 사람일 뿐이니(To most residents ... nothing but a man who sorts packages) 주민에게 시 선생으로 통한다고 할 수 없어요."],["경비원 → 택배 정리가 전부인 사람","주민들 눈에 비친 겉보기(nothing but a man who sorts packages)를 옮긴 답이에요. 둘째 문장에서 시 이야기를 한 시간이나 한다니(talk about it for an hour) 택배 정리가 전부라고 할 수 없어요."],["경비원 → 시인이 되려고 일하는 사람","시 이야기를 빌렸지만 글에 없는 일을 지어냈어요. 어떤 시를 물어도 선생님처럼 한 시간이나 이야기한다는 것(he will talk about it for an hour like a teacher)은 시를 잘 안다는 말이지, 시인이 되려고 일한다는 말이 아니에요."]],"dg":"nothing but"},{"id":"2-7","k":2,"dev":"however (두 문장)","s":"Many neighbors expected the new playground to be crowded all day. On weekday afternoons, however, it stayed almost empty, and children came mostly after dinner.","a":"새 놀이터 → 아이들은 주로 저녁에 옴","why":"however가 맞섬을 알려 줘요. 첫 문장은 이웃들의 예상, 곧 새 놀이터가 하루 종일 붐빌 거라는 말이에요(expected the new playground to be crowded all day). however가 든 둘째 문장은 실제 모습이에요. 평일 오후에는 거의 비어 있었고(it stayed almost empty), 아이들은 대부분 저녁을 먹은 뒤에 왔어요(children came mostly after dinner). 글쓴이는 실제 모습 쪽이에요. 놀이터가 안 쓰인다는 게 아니라, 아이들이 오는 때가 하루 종일이 아니라 주로 저녁 무렵이라는 것이 요점이에요.","tr":[["새 놀이터 → 아이들은 아침에 몰림","몰리는 때를 바꿨어요. 아이들이 대부분 온 때는 아침이 아니라 저녁을 먹은 뒤예요(children came mostly after dinner)."],["새 놀이터 → 아이들이 거의 안 옴","however 뒤 낱말(almost empty)을 잡고 범위를 넓혔어요. 거의 비어 있던 때는 평일 오후뿐이고(On weekday afternoons ... it stayed almost empty), 아이들은 저녁을 먹은 뒤에 대부분 왔어요(children came mostly after dinner)."],["새 놀이터 → 하루 종일 북적거림","however 앞, 이웃들의 예상(expected the new playground to be crowded all day)을 옮긴 답이에요. 실제로는 평일 오후에 거의 비어 있었어요(it stayed almost empty)."],["새 놀이터 → 평일 오후에 가장 붐빔","weekday afternoons 낱말은 같지만 거꾸로예요. 평일 오후는 가장 붐빈 때가 아니라 거의 비어 있던 때예요(On weekday afternoons, however, it stayed almost empty)."]],"dg":"however"},{"id":"2-8","k":2,"dev":"처음과 나중 (때 말로만)","s":"In the first summer after one city stopped cutting the grass along its roads, many residents complained that the roadsides looked messy. By the third summer, the same roadsides were full of wildflowers and bees.","a":"풀베기 멈춤 → 시간 지나 생기 넘침","why":"이음말 없이 때를 나타내는 말(In the first summer ... By the third summer)만으로 처음과 나중이 맞서요. 풀을 베지 않은 첫해 여름에는 많은 주민이 길가가 지저분해 보인다고 불평했어요(many residents complained that the roadsides looked messy). 그런데 셋째 해 여름에는 같은 길가가 들꽃과 벌로 가득했어요(the same roadsides were full of wildflowers and bees). 나중 모습이 처음 불평을 뒤집는 흐름이에요. 그래서 요점은 풀베기를 멈춘 길가가 처음엔 지저분해 보였지만 시간이 지나 생기가 넘치게 됐다는 거예요.","tr":[["풀베기 멈춤 → 처음부터 꽃이 가득","first summer 이야기를 거꾸로 읽었어요. 첫해 여름에는 주민들이 길가가 지저분해 보인다고 불평했어요(many residents complained that the roadsides looked messy). 들꽃이 가득해진 것은 셋째 해 여름이에요(By the third summer)."],["풀베기 멈춤 → 꽃은 피어도 벌은 안 옴","wildflowers · bees 낱말은 같지만 하는 말이 달라요. 셋째 해 여름의 길가는 들꽃뿐 아니라 벌로도 가득했어요(full of wildflowers and bees)."],["풀베기 멈춤 → 길가가 지저분해짐","첫해 여름 주민들의 불평(complained that the roadsides looked messy)을 옮긴 답이에요. 셋째 해 여름에는 같은 길가가 들꽃과 벌로 가득했어요(the same roadsides were full of wildflowers and bees)."],["풀베기 멈춤 → 길가는 늘 손봐야 함","길가 풀은 늘 베어 줘야 한다는 흔한 결론이지만 글과 달라요. 풀베기를 멈추자 첫해에는 지저분해 보였어도, 셋째 해 여름에는 같은 길가가 들꽃과 벌로 가득했어요(the same roadsides were full of wildflowers and bees)."]],"dg":"예전과 지금"},{"id":"2-9","k":2,"dev":"바람과 결과 (동사로만 — hoping · ended up)","s":"Hoping to cut down on plastic, one town banned thin plastic shopping bags. Shoppers there ended up buying more thick plastic bags for their kitchen trash cans.","a":"봉지 금지 → 다른 비닐을 더 사게 됨","why":"이음말은 없지만 앞 문장의 바람과 뒤 문장의 결과가 동사로 맞서요. 한 마을은 비닐을 줄이려고(Hoping to cut down on plastic) 얇은 비닐봉지를 막았는데, 그곳 사람들은 결국 부엌 쓰레기통에 쓸 두꺼운 비닐봉투를 더 사게 됐어요(ended up buying more thick plastic bags for their kitchen trash cans). ended up이 바람과 다르게 끝난 결과를 알려 줘요. 요점은 봉지를 막자 다른 비닐을 더 사는 뜻밖의 결과가 나왔다는 거예요. 글은 전체 비닐 양이 어떻게 됐는지까지는 말하지 않아요. 글쓴이는 바람이 아니라 결과 쪽이에요.","tr":[["봉지 금지 → 두꺼운 장바구니 팔림","thick · buying 낱말은 같지만 쓰임이 달라요. 사람들이 더 산 것은 장 볼 때 드는 가방이 아니라 부엌 쓰레기통에 쓸 비닐봉투예요(for their kitchen trash cans)."],["봉지 금지 → 얇은 봉지를 사재기함","thin plastic shopping bags 낱말은 같지만 하는 일이 달라요. 얇은 봉지는 막혔고(banned thin plastic shopping bags), 사람들이 더 산 것은 얇은 봉지가 아니라 두꺼운 비닐봉투예요(buying more thick plastic bags)."],["봉지 금지 → 비닐 쓰레기 줄어듦","앞쪽의 바람(Hoping to cut down on plastic)을 결과처럼 옮긴 답이에요. 글은 비닐이 줄었다고 말하지 않아요. 결과로 나온 것은 두꺼운 비닐봉투를 더 산 일이에요(ended up buying more thick plastic bags)."],["봉지 금지 → 비닐 대신 종이가 늘어남","비닐봉지를 막으면 종이봉투로 옮겨 간다는 흔한 말이지만 글이 보여 주는 것은 달라요. 글에서 사람들이 더 샀다고 하는 것은 종이가 아니라 두꺼운 비닐봉투예요(buying more thick plastic bags)."]],"dg":"기대 ↔ 결과 (동사)"},{"id":"2-10","k":2,"dev":"남의 말 속 actually (요점 아님)","s":"In a class survey, students who had eaten two low-fat cookies said they felt hungry again sooner than those who had eaten two regular ones. The box claims that low-fat cookies actually keep you full longer.","a":"저지방 과자 → 양이 같아도 더 빨리 출출","why":"actually가 보이지만 이 말은 상자 문구 속에 있어요(The box claims that low-fat cookies actually keep you full longer). 곧 actually 뒤는 글쓴이의 요점이 아니라 상자가 하는 주장이에요. 이 글은 요점을 먼저 내놓아요. 한 반의 설문에서 저지방 과자를 두 개 먹은 학생들은 보통 과자를 두 개 먹은 학생들보다 더 빨리 다시 배고파졌다고 말했어요(felt hungry again sooner than those who had eaten two regular ones). 그 뒤에 더 오래 배부르다는 상자 문구를 이음말 없이 나란히 놓아 설문 결과와 문구가 맞서게 했어요. 글쓴이는 설문 결과 쪽이라, 요점은 저지방 과자를 먹은 학생들이 같은 양을 먹고도 더 빨리 배고파졌다고 느꼈다는 거예요. 두 쪽이 두 개씩 먹었다는 점도 짚어 두세요(two low-fat cookies ... two regular ones).","tr":[["저지방 과자 → 배부른 시간이 보통과 같음","regular ones 낱말은 같지만 정도가 달라요. 저지방 과자를 먹은 학생들이 보통 과자를 먹은 학생들보다 더 빨리 다시 배고파졌다고 했으니(felt hungry again sooner than those who had eaten two regular ones) 배부른 시간이 같다고 할 수 없어요."],["저지방 과자 → 덜 먹어서 일찍 배고파짐","two 낱말을 빌렸지만 까닭을 바꿨어요. 두 쪽 모두 과자를 두 개씩 먹었으니(two low-fat cookies ... two regular ones) 저지방 쪽이 덜 먹어서 일찍 배고파진 게 아니에요."],["저지방 과자 → 배부름이 더 오래 감","상자가 내세우는 주장(low-fat cookies actually keep you full longer)을 옮긴 답이에요. 뒤에 나왔다고 요점이 아니에요. 앞 문장의 설문에서는 저지방 과자를 먹은 학생들이 오히려 더 빨리 다시 배고파졌다고 했어요(felt hungry again sooner)."],["저지방 과자 → 군것질 버릇을 줄여 줌","과자를 바꾸면 군것질이 준다는 흔한 기대지만 글에 없어요. 저지방 과자를 먹은 학생들은 오히려 더 빨리 다시 배고파졌다고 했어요(felt hungry again sooner)."]],"dg":"남의 말 속 actually"},{"id":"2-11","k":2,"dev":"~ may seem ~, but ~","s":"A big prize may seem like the best way to draw students to a contest, but at one school, more students signed up once friends could enter as a team.","a":"대회 → 상보다 함께할 친구","why":"앞쪽 may seem은 「그래 보인다」는 겉보기예요. 큰 상(A big prize)으로 학생을 모으는 길과 친구와 팀으로 나가게 하는 길이 맞서고, 글쓴이는 but 뒤의 실제 일(more students signed up once friends could enter as a team)로 친구 쪽 손을 들어요. 그래서 요점은 학생을 대회로 이끈 것이 상보다 함께 나갈 친구였다는 거예요.","tr":[["대회 → 신청 많아 팀으로 나눔","signed up · team 낱말은 같지만 앞뒤가 뒤바뀌었어요. 신청이 많아서 팀으로 나눈 게 아니라, 팀으로 나갈 수 있게 되자 신청이 늘었어요(more students signed up once friends could enter as a team)."],["대회 → 상 없애자 신청 늘어남","signed up · more 낱말은 같지만 학교가 바꾼 것이 달라요. 글에는 상을 없앴다는 말이 없고, 신청이 는 것은 친구와 팀으로 나갈 수 있게 된 뒤예요(once friends could enter as a team). 상 이야기는 but 앞의 겉보기에만 있어요."],["대회 → 상이 클수록 신청 늘어남","may seem 쪽의 겉보기(A big prize may seem like the best way to draw students to a contest)를 옮긴 답이에요. 글쓴이는 but 뒤의 실제 일로 이 생각에 맞서요."],["대회 → 상보다 실력 쌓기","대회를 두고 흔히 하는 말이지만 글에 없어요. 이 학교에서 학생을 더 모은 것은 실력 쌓기가 아니라 친구와 팀으로 나갈 수 있게 한 일이에요(once friends could enter as a team)."]],"dg":"~ may seem ~, but ~"},{"id":"2-12","k":2,"dev":"남들 생각 ↔ 실제 결과 (이음말 없음)","s":"Many people think goldfish forget things within seconds. In one classroom tank, the goldfish learned to swim to the front at the sound of a bell and kept doing so after a two-week break.","a":"금붕어 → 신호를 오래 기억","why":"이음말은 없지만 두 문장이 맞서요. 첫 문장은 사람들의 생각(goldfish forget things within seconds)이고, 둘째 문장은 한 교실에서 실제로 본 일이에요. 종소리를 신호로 앞쪽으로 헤엄쳐 오는 법을 익히고, 두 주를 쉰 뒤에도 그대로 했으니(kept doing so after a two-week break) 몇 초 만에 잊기는커녕 오래 기억한 거예요. 글쓴이는 관찰 쪽이에요.","tr":[["금붕어 → 종소리 배우는 데 두 주","bell · two-week 낱말은 같지만 뜻이 달라요. 두 주는 배우는 데 걸린 시간이 아니라, 다 익힌 뒤 쉰 기간(after a two-week break)이에요."],["금붕어 → 두 주 쉬면 잊어버림","two-week break 낱말은 같지만 거꾸로예요. 두 주를 쉰 뒤에도 그대로 했어요(kept doing so after a two-week break)."],["금붕어 → 몇 초 만에 잊음","첫 문장의 사람들 생각(goldfish forget things within seconds)을 옮긴 답이에요. 둘째 문장의 관찰이 이 생각을 뒤집어요."],["금붕어 → 주인 얼굴 알아봄","금붕어가 영리하다며 흔히 하는 말이지만 글에 없어요. 이 금붕어가 기억한 것은 사람 얼굴이 아니라 종소리(at the sound of a bell)예요."]],"dg":"남들 생각 ↔ 실제 결과"},{"id":"2-13","k":2,"dev":"남들 생각 ↔ 실제 결과 (이음말 없음)","s":"Drivers in one city said heavy storms scared them most. The city's records showed more crashes on days of light rain, when many drivers did not bother to slow down.","a":"약한 비 → 방심해 사고 잦음","why":"두 문장 사이에 이음말이 없지만, 운전자들의 말(heavy storms scared them most)과 시의 기록이 맞서요. 기록으로는 폭우가 아니라 약한 비가 오는 날 사고가 더 많았고, 그날 많은 운전자가 속도를 줄이지도 않았어요(did not bother to slow down). 무섭지 않다고 여긴 약한 비에 마음을 놓아(방심해) 사고가 더 잦았다는 것이 요점이에요. 글쓴이는 운전자들의 말보다 기록 쪽이에요.","tr":[["약한 비 → 사고가 더 크게 남","crashes · more 낱말은 같지만 뜻이 달라요. 기록(more crashes on days of light rain)은 사고가 더 「많았다」는 수의 말이지, 더 「크게」 났다는 말이 아니에요."],["약한 비 → 운전자들 속도 줄임","slow down 낱말은 같지만 not을 빠뜨려 거꾸로 읽었어요. 많은 운전자가 속도를 줄이지 않았어요(did not bother to slow down)."],["폭우 날 → 사고가 더 많이 남","첫 문장의 운전자들 생각(heavy storms scared them most)을 옮긴 답이에요. 기록은 약한 비가 오는 날 사고가 더 많았다고 해요(more crashes on days of light rain)."],["약한 비 → 길이 더 미끄러움","약한 비에 길이 미끄럽다는 흔한 말이지만 글에 없어요. 글이 짚은 것은 길이 아니라 속도를 줄이지 않은 운전자들(many drivers did not bother to slow down)이에요."]],"dg":"남들 생각 ↔ 실제 결과"},{"id":"2-14","k":2,"dev":"관계사절 속 but (요점은 주절)","s":"E-books often seem like the smarter choice. In one study, readers of paper books, which are heavier but easier to flip back through, remembered the order of a story's events better than e-book readers.","a":"종이책 → 줄거리 흐름 잘 잡음","why":"but은 which 절 안에서 종이책이 어떤지 덧붙일 뿐이에요(which are heavier but easier to flip back through). 진짜 맞섬은 두 문장 사이에 있어요. 첫 문장은 전자책이 더 나아 보인다는 겉보기이고, 둘째 문장의 주절은 종이책 독자가 이야기 속 일의 차례를 더 잘 기억했다는 결과(remembered the order of a story's events better than e-book readers)예요. 글쓴이는 결과 쪽이라, 요점은 줄거리 흐름을 잡는 데는 종이책이 낫다는 거예요.","tr":[["전자책 → 사건 순서 더 잘 기억","the order of a story's events · better 낱말은 같지만 누가 그랬는지가 바뀌었어요. 차례를 더 잘 기억한 쪽은 종이책 독자예요(readers of paper books ... remembered the order of a story's events better than e-book readers)."],["종이책 → 넘기기 쉬워 빨리 읽힘","but 뒤 낱말(easier to flip back through)을 빌렸지만 빨리 읽힌다는 말은 없어요. 이 부분은 종이책이 어떤지 덧붙인 말이고, 주절은 기억을 견줘요."],["전자책 → 더 똑똑한 선택","첫 문장의 겉보기(E-books often seem like the smarter choice)를 옮긴 답이에요. 둘째 문장의 결과가 이 생각에 맞서요."],["종이책 → 낱말 뜻 더 잘 익힘","종이책이 공부에 좋다며 흔히 하는 말이지만 글에 없어요. 글이 견준 것은 낱말이 아니라 이야기 속 일의 차례(the order of a story's events)예요."]],"dg":"관계사절 속 but"},{"id":"2-15","k":2,"dev":"뒤에 붙은 even though (요점은 앞 주절)","s":"Many children in one town kept their reading skills over the summer break, even though a survey showed they spent far less time reading than during the school year.","a":"여름 방학 → 덜 읽어도 실력 그대로","why":"even though 절은 문장 뒤에 붙었어도 양보예요. 책을 훨씬 덜 읽었다는 것(spent far less time reading)을 인정하면서, 그래도 실력은 지켰다는 앞 주절(kept their reading skills over the summer break)에 힘을 줘요. 덜 읽었으니 실력이 떨어졌으리라는 예상과 실제가 맞서고, 글쓴이는 실제 쪽이에요.","tr":[["여름 방학 → 많이 읽어 실력 유지","reading skills · kept 낱말은 같지만 까닭을 지어냈어요. 많이 읽은 게 아니라 오히려 훨씬 덜 읽었어요(spent far less time reading)."],["여름 방학 → 읽기 실력 늘어남","reading skills 낱말은 같지만 정도를 부풀렸어요. 실력을 지켰다(kept their reading skills)는 말이지 늘었다는 말이 아니에요."],["여름 방학 → 독서 시간 줄어듦","even though 절의 내용(they spent far less time reading)만 옮긴 답이에요. 사실이긴 하지만 양보로 인정하고 넘어간 부분이고, 요점은 그런데도 실력을 지켰다는 주절이에요."],["여름 방학 → 실력 떨어지기 쉬움","방학에는 실력이 떨어진다는 흔한 말이지만, 이 글의 아이들은 실력을 지켰어요(kept their reading skills)."]],"dg":"although"},{"id":"2-16","k":2,"dev":"예전과 지금 (때 말로만)","s":"People used to believe that left-handed children should be trained to write with their right hand. Now many teachers simply give them scissors made for left-handers.","a":"왼손잡이 → 고치지 않고 도움","why":"but 같은 이음말 없이 used to(예전)와 Now(지금)만으로 두 생각이 맞서요. 예전에는 왼손잡이 아이가 오른손으로 쓰도록 고쳐야 한다고 믿었고(trained to write with their right hand), 지금은 왼손잡이에게 맞는 가위를 줘요(give them scissors made for left-handers). 손을 바꾸게 하는 대신 왼손잡이 그대로 돕는다는 것이 요점이고, 글쓴이는 지금 쪽이에요.","tr":[["왼손잡이 → 가위 직접 만듦","scissors made 낱말은 같지만 뜻이 달라요. 누가 가위를 직접 만든 게 아니라, 선생님들이 왼손잡이를 위해 만들어진 가위를 줘요(give them scissors made for left-handers)."],["왼손잡이 → 오른손 가위 쥐여 줌","give them scissors 낱말은 같지만 거꾸로예요. 선생님들이 주는 것은 오른손용이 아니라 왼손잡이용 가위(scissors made for left-handers)예요."],["왼손잡이 → 오른손 쓰게 함","첫 문장의 예전 생각(trained to write with their right hand)을 옮긴 답이에요. used to는 예전에는 그랬지만 지금은 아니라는 말이에요."],["왼손잡이 → 양손 쓰기 연습","그럴듯한 가르침이지만 글에 없어요. 지금 선생님들은 손을 바꾸게 하지 않고 왼손잡이용 도구를 줘요(many teachers simply give them scissors made for left-handers)."]],"dg":"예전과 지금"},{"id":"2-17","k":2,"dev":"~, but only when ~","s":"Walking a lot during the day can help people sleep deeply at night, but only when most of the walking is done outdoors, one small study found.","a":"숙면 → 어디서 걷느냐가 중요","why":"앞쪽은 「낮에 많이 걸으면 잘 잔다」고 넓게 말하고, but only when이 그 말에 조건을 달아 좁혀요. 많이 걷기만 해서는 모자라고, 걷기의 대부분을 밖에서 해야 한다(most of the walking is done outdoors)는 거예요. 넓은 말과 좁힌 조건이 맞서고, 글쓴이가 힘주는 것은 조건 쪽이에요. 그래서 요점은 많이 걷되 밖에서 걸어야 한다는 것, 곧 어디서 걷느냐가 중요하다는 거예요.","tr":[["숙면 → 밖에서 잠깐 걸으면 됨","outdoors 낱말은 같지만 정도가 달라요. 글은 잠깐이 아니라 많이 걷되 그 대부분을 밖에서 하라고 해요(Walking a lot ... most of the walking is done outdoors)."],["숙면 → 밖에서 자야 깊이 잠","outdoors · deeply 낱말을 빌렸지만 뜻이 달라요. 밖에서 해야 하는 것은 잠이 아니라 걷기예요(most of the walking is done outdoors)."],["숙면 → 많이 걸으면 그만","but 앞의 넓은 말(Walking a lot during the day can help people sleep deeply at night)만 보고 조건을 뺀 답이에요. but only when이 붙어, 많이 걷기만으로는 안 된다고 해요."],["숙면 → 언제 자느냐가 중요","잠에 대해 흔히 하는 말이지만 글에 없어요. 글이 단 조건은 잠드는 때가 아니라 걷는 곳(done outdoors)이에요."]],"dg":"~, but only when ~"},{"id":"2-18","k":2,"dev":"남들 생각 ↔ 실제 결과 (이음말 없음)","s":"Many restaurant owners believe that red walls make diners feel hungry and order more. When one restaurant painted its red walls white, its sales stayed about the same.","a":"벽 색 → 바꿔도 차이 없음","why":"이음말은 없지만 첫 문장의 믿음(red walls make diners feel hungry and order more)과 둘째 문장의 결과가 맞서요. 빨간 벽을 흰색으로 바꿨는데도 매출이 거의 그대로였으니(its sales stayed about the same), 벽 색이 믿는 만큼 차이를 만들지 못했다는 것이 요점이에요. 글쓴이는 해 본 결과 쪽이에요.","tr":[["흰 벽 → 매출 줄어 다시 칠함","white · sales · painted 낱말은 같지만 결과를 바꾸고 뒷일까지 지어냈어요. 흰색으로 칠한 뒤 매출은 줄지 않고 거의 그대로였어요(its sales stayed about the same)."],["흰 벽 → 매출 더 늘어남","white · sales 낱말은 같지만 결과가 달라요. 매출은 늘지 않고 거의 그대로였어요(its sales stayed about the same)."],["빨간 벽 → 주문 늘려 줌","첫 문장의 식당 주인들 믿음(red walls make diners feel hungry and order more)을 옮긴 답이에요. 둘째 문장의 결과가 이 믿음에 맞서요."],["식당 → 음식 맛이 먼저","식당을 두고 흔히 하는 말이지만 글에 없어요. 글은 맛이 아니라 벽 색을 바꿨을 때의 매출(its sales stayed about the same)을 말해요."]],"dg":"남들 생각 ↔ 실제 결과"},{"id":"2-19","k":2,"dev":"not only A but also B (둘 다 살아 있음)","s":"Many students expect that studying with a partner will slow them down. In one class, students working in pairs not only finished their homework faster but also made fewer mistakes.","a":"짝 공부 → 빠르고 정확해짐","why":"첫 문장은 학생들의 예상(expect that studying with a partner will slow them down)이고, 둘째 문장은 한 반에서 실제로 일어난 일이에요. 이음말 없이 예상과 결과가 맞서요. but also가 보이지만 not only A but also B는 A도 B도 살려 두는 말이라, 더 빨리 끝냈다(finished their homework faster)는 것과 실수가 줄었다(made fewer mistakes)는 것이 둘 다 요점이에요. 특히 「더 빨리」가 첫 문장의 예상을 뒤집어요.","tr":[["짝 공부 → 실수 줄지만 느려짐","made fewer mistakes 낱말은 같지만, but을 「하지만」으로 읽어 앞쪽을 뒤집었어요. not only 쪽도 살아 있어 더 빨리 끝냈어요(finished their homework faster)."],["짝 공부 → 실수가 사라짐","mistakes 낱말은 같지만 정도를 부풀렸어요. 실수가 줄었다(made fewer mistakes)는 말이지 없어졌다는 말이 아니에요."],["짝 공부 → 속도가 느려짐","첫 문장의 예상(slow them down)을 옮긴 답이에요. 실제로는 더 빨리 끝냈어요(finished their homework faster)."],["짝 공부 → 빠르지만 덜 정확","not only 쪽(finished their homework faster)만 살리고 but also 뒤를 뒤집은 답이에요. 실수는 늘지 않고 줄었어요(made fewer mistakes)."]],"dg":"not only a but also b"},{"id":"2-20","k":2,"dev":"남들 생각 ↔ 실제 결과 (이음말 없음)","s":"Many teachers ban gum because they believe it distracts students. In one long reading test, students who chewed gum answered more of the last questions correctly than those who did not.","a":"껌 → 막판에 힘이 됨","why":"이음말은 없지만 첫 문장의 선생님들 생각(they believe it distracts students)과 둘째 문장의 시험 결과가 맞서요. 긴 시험에서 껌을 씹은 학생이 마지막 문제를 더 많이 맞혔으니(answered more of the last questions correctly), 껌이 방해는커녕 시험이 끝나 갈 무렵 힘이 될 수 있다는 것이 요점이에요. 글쓴이는 결과 쪽이에요.","tr":[["껌 → 앞쪽 문제 더 맞힘","questions · correctly · more 낱말은 같지만 어느 문제인지가 바뀌었어요. 더 맞힌 것은 앞쪽이 아니라 마지막 문제(more of the last questions)예요."],["껌 → 긴 지문 빨리 읽게 함","long reading test 낱말을 빌렸지만 빨리 읽는다는 말은 없어요. 글은 속도가 아니라 마지막 문제를 더 맞혔다(answered more of the last questions correctly)고 해요."],["껌 → 학생 집중 흐트림","첫 문장의 선생님들 생각(they believe it distracts students)을 옮긴 답이에요. 둘째 문장의 결과가 이 생각에 맞서요."],["껌 → 시험 긴장 풀어 줌","껌을 두고 흔히 하는 말이지만 글에 없어요. 글은 긴장이 아니라 마지막 문제를 더 맞혔다는 결과(answered more of the last questions correctly)만 말해요."]],"dg":"남들 생각 ↔ 실제 결과"},{"id":"3-1","k":3,"dev":"not A but B","s":"According to its owner, what keeps people lining up at the corner kimbap shop is not a secret sauce but rice cooked in small pots every two hours.","a":"갓 지은 밥 → 가게가 붐빔","why":"not A but B에서 글쓴이는 A를 지우고 B를 내세워요. 사람들이 줄을 서게 하는 것(what keeps people lining up at the corner kimbap shop)은 비밀 양념이 아니라 두 시간마다 작은 솥에 새로 짓는 밥이에요(rice cooked in small pots every two hours). 두 시간마다 새로 지으니 늘 갓 지은 밥이 나온다는 뜻이에요. 그래서 요점은 갓 지은 밥이 가게를 붐비게 한다는 거예요.","tr":[["비밀 양념 → 가게가 붐빔","not 쪽을 요점으로 잡았어요. 주인은 줄을 세우는 것이 비밀 양념이 아니라고 했어요(not a secret sauce)."],["손으로 마는 김밥 → 가게가 붐빔","정성껏 손으로 말면 손님이 몰린다는 그럴듯한 말이지만, 주인이 꼽은 까닭은 밥이에요(not a secret sauce but rice cooked in small pots every two hours)."],["두 시간 줄 서야 → 밥을 먹음","두 시간 · 줄 · 밥 낱말은 같지만 누구의 시간인지 바꿨어요. 두 시간은 손님이 기다리는 시간이 아니라 밥을 새로 짓는 간격이에요(rice cooked in small pots every two hours)."],["작은 솥 밥 → 줄 서는 손님 줄어듦","작은 솥 · 밥 · 줄 낱말은 같지만 방향을 뒤집었어요. 작은 솥에 지은 밥은 줄을 줄이는 게 아니라 사람들을 줄 서게 하는 까닭이에요(what keeps people lining up ... is not a secret sauce but rice cooked in small pots)."]],"dg":"not a but b"},{"id":"3-2","k":3,"dev":"stopped A and began B (부정 말 없이 대체)","s":"Our school stopped announcing lost items over the speaker and began displaying them by the cafeteria door. Most items are now claimed within a week.","a":"눈앞에 두기 → 곧 주인 품으로","why":"but이나 instead 같은 이음말 없이, 동사 stopped와 began이 옛 방법을 지우고 새 방법을 들여요. 학교는 분실물을 방송으로 알리던 일을 멈추고(stopped announcing lost items over the speaker) 식당 문 옆에 늘어놓기 시작했어요(began displaying them by the cafeteria door). 귀로 듣는 알림 대신 눈으로 보이는 곳에 둔 거예요. 그 뒤 대부분의 물건이 일주일 안에 주인에게 돌아가요(Most items are now claimed within a week). 그래서 요점은 눈앞에 두자 곧 주인에게 돌아간다는 거예요.","tr":[["급식 때 방송 → 곧 주인 품으로","점심시간에 방송하면 모두 듣는다는 그럴듯한 말이지만, 학교는 분실물을 방송으로 알리는 일을 멈췄어요(stopped announcing lost items over the speaker)."],["담임에게 맡기기 → 곧 주인 품으로","담임 선생님께 맡기면 주인을 찾아 준다는 그럴듯한 말이지만, 학교는 분실물을 식당 문 옆에 늘어놓았어요(began displaying them by the cafeteria door)."],["분실물 → 일주일 넘게 쌓임","분실물 · 일주일 낱말은 같지만 뜻을 뒤집었어요. 일주일은 쌓여 있는 기간이 아니라 대부분이 주인에게 돌아가는 기간이에요(Most items are now claimed within a week)."],["식당 문 옆 → 물건 더 잃어버림","식당 문 옆 낱말은 같지만 결과를 지어냈어요. 식당 문 옆에 늘어놓은 뒤로 대부분의 물건이 주인에게 돌아가요(Most items are now claimed within a week)."]],"dg":"stopped a, began b"},{"id":"3-3","k":3,"dev":"It was not until A that B (not이 있어도 B는 일어남)","s":"It was not until our soccer team let the youngest players choose the warm-up music that those players started showing up early for practice.","a":"고를 권한 주기 → 일찍 나타남","why":"It was not until A that B는 not이 있어도 B를 부정하지 않아요. 「A가 있고 나서야 비로소 B가 일어났다」는 뜻이에요. 축구부가 가장 어린 선수들에게 준비 운동 음악을 고르게 하고 나서야(let the youngest players choose the warm-up music) 그 선수들이 연습에 일찍 나오기 시작했어요(those players started showing up early for practice). 고르는 일을 맡겨 준 것이 행동을 바꿨으니, 요점은 고를 권한을 주자 일찍 나타났다는 거예요.","tr":[["음악 틀어 주기 → 일찍 나타남","음악을 틀어 주면 신이 나서 일찍 온다는 그럴듯한 말이지만, 바뀐 것은 음악을 틀어 준 게 아니라 어린 선수들에게 고르게 한 일이에요(let the youngest players choose the warm-up music)."],["경기 출전 약속 → 일찍 나타남","경기에 내보내 준다면 열심히 나온다는 그럴듯한 말이지만, 바뀐 것은 음악을 고르게 한 일이에요(let the youngest players choose the warm-up music)."],["준비 운동 음악 → 연습 일찍 끝남","준비 운동 · 음악 · 일찍 · 연습 낱말은 같지만 무엇이 일찍인지 바꿨어요. 일찍 끝난 것은 연습이 아니라, 선수들이 일찍 나온 거예요(those players started showing up early for practice)."],["막내 선수들 → 연습에 늦게 옴","not을 보고 「일찍 나오지 않았다」로 읽었어요. not until은 「~하고 나서야」라는 뜻이라, 음악을 고르게 한 뒤 어린 선수들은 일찍 나오기 시작했어요(those players started showing up early for practice)."]],"dg":"not until"},{"id":"3-4","k":3,"dev":"The last thing ~ was A (부정 말 없이 부정)","s":"The last thing our tired choir needed before the contest was one more full rehearsal. An afternoon of board games did more to lift its spirits than any extra practice could have.","a":"함께 놀며 쉬기 → 다시 힘이 솟음","why":"The last thing ~ needed는 not 없이 「가장 필요 없던 것」이라는 부정이에요. 지친 합창단에게 대회 전 가장 필요 없던 것은 전체 연습 한 번 더였어요(The last thing our tired choir needed before the contest was one more full rehearsal). 보드게임으로 보낸 오후가 어떤 추가 연습보다 기운을 더 북돋웠어요(An afternoon of board games did more to lift its spirits than any extra practice could have). 연습을 더 하지 않고 함께 놀며 쉬었더니 힘이 났다는 것이 요점이에요.","tr":[["놀이 삼아 연습 → 다시 힘이 솟음","연습을 놀이처럼 하면 힘이 난다는 그럴듯한 말이지만, 기운을 북돋운 것은 연습이 아니라 보드게임 그 자체예요(An afternoon of board games did more to lift its spirits than any extra practice could have)."],["응원 편지 읽기 → 다시 힘이 솟음","응원을 받으면 힘이 난다는 그럴듯한 말이지만, 글에 나온 것은 보드게임으로 보낸 오후예요(An afternoon of board games did more to lift its spirits)."],["보드게임 → 연습할 기운 빼앗음","보드게임 · 연습 · 기운 낱말은 같지만 방향을 뒤집었어요. 보드게임은 기운을 빼앗은 게 아니라 어떤 추가 연습보다 더 북돋웠어요(did more to lift its spirits than any extra practice could have)."],["지친 합창단 → 연습 한 번 더 함","지친 합창단 · 연습 한 번 더 낱말은 같지만 거꾸로예요. 연습 한 번 더는 합창단에게 가장 필요 없던 것이에요(The last thing our tired choir needed before the contest was one more full rehearsal)."]],"dg":"the last thing"},{"id":"3-5","k":3,"dev":"Rather than","s":"Rather than buying a new projector, our class spent the money on curtains, since the old projector's image was fine in a dark room.","a":"빛 가리기 → 새로 살 필요 없음","why":"Rather than A, B는 A를 버리고 B를 골랐다는 말이에요. 반은 새 프로젝터를 사는 대신(Rather than buying a new projector) 그 돈으로 커튼을 샀어요(our class spent the money on curtains). 방이 어두우면 옛 프로젝터 화면도 괜찮았기 때문이에요(the old projector's image was fine in a dark room). 탈은 기계가 아니라 빛이었던 셈이라, 요점은 빛을 가리니 새로 살 필요가 없었다는 거예요.","tr":[["새 전구 끼우기 → 새로 살 필요 없음","전구만 바꾸면 화면이 밝아진다는 그럴듯한 말이지만, 반이 돈을 쓴 곳은 커튼이에요(our class spent the money on curtains)."],["화면 키우기 → 새로 살 필요 없음","화면을 크게 하면 잘 보인다는 그럴듯한 말이지만, 반이 돈을 쓴 곳은 커튼이에요(our class spent the money on curtains)."],["어두운 방 → 화면이 흐려짐","어두운 방 · 화면 낱말은 같지만 방향을 뒤집었어요. 방이 어두우면 옛 프로젝터 화면은 흐려지는 게 아니라 괜찮았어요(the old projector's image was fine in a dark room)."],["옛 프로젝터 → 화면이 안 나옴","옛 프로젝터 · 화면 낱말은 같지만 결과를 뒤집었어요. 옛 프로젝터 화면은 어두운 방에서 괜찮았어요(the old projector's image was fine in a dark room)."]],"dg":"rather than"},{"id":"3-6","k":3,"dev":"can't help -ing (not이 있어도 긍정)","s":"Shoppers at the fruit stand near our school can't help taking a second look, since every price tag carries a short note about the farm the fruit came from.","a":"어디서 왔는지 → 저절로 눈길 감","why":"can't help -ing는 not이 있어도 부정이 아니라 「저절로 ~하게 된다」는 뜻이에요. 손님들은 과일 가게에서 저도 모르게 한 번 더 보게 되는데(can't help taking a second look), 가격표마다 그 과일을 기른 농장 이야기가 짧게 적혀 있기 때문이에요(every price tag carries a short note about the farm the fruit came from). 그래서 요점은 과일이 어디서 왔는지 알려 주니 저절로 눈길이 간다는 거예요.","tr":[["맛보기 한 조각 → 저절로 눈길 감","맛을 보여 주면 손님이 멈춘다는 그럴듯한 말이지만, 손님이 다시 보는 까닭은 가격표의 농장 이야기예요(every price tag carries a short note about the farm the fruit came from)."],["값 크게 적기 → 저절로 눈길 감","값을 크게 써 두면 눈에 띈다는 그럴듯한 말이지만, 가격표에 적힌 것은 값이 아니라 과일을 기른 농장 이야기예요(a short note about the farm the fruit came from)."],["가격표 쪽지 → 값을 두 번 확인함","가격표 · 쪽지 · 두 번 낱말은 같지만 무엇을 보는지 바꿨어요. 손님이 다시 보는 까닭은 값이 아니라 과일을 기른 농장 이야기예요(a short note about the farm the fruit came from)."],["작은 과일 가게 → 다시 보지 않음","can't를 보고 부정으로 읽었어요. 「한 번 더 보지 않을 수 없다」, 곧 저절로 다시 보게 된다는 뜻이에요(can't help taking a second look)."]],"dg":"can't help -ing"},{"id":"3-7","k":3,"dev":"traded A for B (부정 말 없이 대체)","s":"Our town's summer festival traded its fireworks show for a lantern walk along the river this year, and far more families with small children came.","a":"걷는 행사 → 아이 동반 가족 늘어남","why":"but이나 instead 같은 이음말 없이, traded A for B가 「A를 내주고 B를 들였다」며 옛것을 지우고 새것을 들여요. 축제는 불꽃놀이를 강가 등불 걷기와 맞바꿨고(traded its fireworks show for a lantern walk along the river), 그러자 어린아이를 데려온 가족이 훨씬 많이 왔어요(far more families with small children came). 그래서 요점은 걷는 행사로 바꾸자 아이를 데려온 가족이 늘었다는 거예요.","tr":[["푸드 트럭 → 아이 동반 가족 늘어남","먹을거리가 많으면 가족이 온다는 그럴듯한 말이지만, 올해 바뀐 것은 불꽃놀이를 걷기 행사로 바꾼 일이에요(traded its fireworks show for a lantern walk along the river)."],["물총 놀이 → 아이 동반 가족 늘어남","아이들 놀이를 열면 가족이 온다는 그럴듯한 말이지만, 축제가 들인 것은 강가 등불 걷기예요(traded its fireworks show for a lantern walk along the river)."],["강가 등불 → 가족 손님이 줄어듦","강가 · 등불 · 가족 낱말은 같지만 방향을 뒤집었어요. 가족 손님은 줄지 않고 훨씬 많이 왔어요(far more families with small children came)."],["불꽃놀이 → 어린아이 가족 몰림","불꽃놀이 · 어린아이 · 가족 낱말은 같지만 공을 잘못 돌렸어요. 올해 축제는 불꽃놀이를 걷기 행사와 맞바꿨어요(traded its fireworks show for a lantern walk)."]],"dg":"traded a for b"},{"id":"3-8","k":3,"dev":"not so much A as B","s":"For our school's quiz team, winning depends not so much on knowing more facts as on agreeing quickly on whose answer to trust with seconds left.","a":"빠른 합의 → 승부를 가름","why":"not so much A as B는 「A라기보다 B」라는 뜻으로 무게가 B에 실려요. 퀴즈 팀이 이기느냐는 사실을 더 많이 아는 것보다(not so much on knowing more facts) 몇 초밖에 안 남았을 때 누구의 답을 믿을지 재빨리 합의하는 데 달렸어요(as on agreeing quickly on whose answer to trust with seconds left). 그래서 요점은 빠른 합의가 승부를 가른다는 거예요.","tr":[["침착한 마음 → 승부를 가름","떨지 않아야 이긴다는 그럴듯한 말이지만, 글이 꼽은 것은 누구 답을 믿을지 빨리 정하는 일이에요(agreeing quickly on whose answer to trust)."],["손 빠른 버저 → 승부를 가름","버저를 먼저 누르면 이긴다는 그럴듯한 말이지만, 글이 꼽은 것은 답을 두고 빨리 합의하는 일이에요(agreeing quickly on whose answer to trust)."],["남의 답 믿기 → 실수가 늘어남","답 · 믿다 낱말은 같지만 방향을 뒤집었어요. 누구의 답을 믿을지 빨리 정하는 것은 실수를 늘리는 게 아니라 이기는 길이에요(winning depends not so much on knowing more facts as on agreeing quickly on whose answer to trust)."],["몇 초 남으면 → 답을 자주 틀림","몇 초 · 답 낱말은 같지만 뜻을 비틀었어요. 몇 초밖에 없을 때 답을 틀린다는 게 아니라, 그때 누구 답을 믿을지 빨리 정해야 이긴다는 거예요(agreeing quickly on whose answer to trust with seconds left)."]],"dg":"not so much a as b"},{"id":"3-9","k":3,"dev":"관계사절 never + because (부정 말 없이 대체)","s":"Our street's barber, who never hangs a sign outside, says most of his new customers find him because the kids whose hair he cuts tell their friends at school.","a":"아이들 입소문 → 가게가 알려짐","why":"never는 관계사절 안에서 간판을 지우고(who never hangs a sign outside), 주절의 because가 새 손님이 오는 진짜 까닭을 내세워요. 새 손님 대부분은 그가 머리를 깎아 준 아이들이 학교 친구들에게 말해 줘서 찾아와요(most of his new customers find him because the kids whose hair he cuts tell their friends at school). 간판 대신 아이들의 말이 가게를 알린 셈이라, 요점은 아이들의 입소문으로 가게가 알려진다는 거예요.","tr":[["동네 단골 할인 → 가게가 알려짐","단골에게 값을 깎아 주면 소문이 난다는 그럴듯한 말이지만, 이발사가 꼽은 까닭은 아이들의 말이에요(because the kids whose hair he cuts tell their friends at school)."],["학교 앞 전단 → 가게가 알려짐","학교 앞에 전단을 돌리면 알려진다는 그럴듯한 말이지만, 새 손님을 데려오는 것은 아이들이 친구들에게 하는 말이에요(the kids whose hair he cuts tell their friends at school)."],["간판 없는 가게 → 새 손님 못 찾음","간판 · 새 손님 · 찾다 낱말은 같지만 결과를 뒤집었어요. 간판이 없어도 새 손님 대부분은 그를 찾아와요(most of his new customers find him)."],["학교 친구들 → 아이들 머리 깎아 줌","학교 · 친구 · 머리 낱말은 같지만 누가 무엇을 하는지 바꿨어요. 머리를 깎는 것은 이발사이고, 아이들은 친구들에게 이발사 이야기를 해요(the kids whose hair he cuts tell their friends at school)."]],"dg":"never + because"},{"id":"3-10","k":3,"dev":"took down A and put up B (부정 말 없이 대체)","s":"Our apartment building's management took down the posters warning about fines for noise and put up photos of the families living on each floor. Within a month, complaints about noise had dropped.","a":"이웃 얼굴 알리기 → 항의가 뜸해짐","why":"but이나 instead 없이, took down(떼어 냄)과 put up(붙임)이 옛것을 지우고 새것을 들여요. 아파트 관리실은 소음 벌금을 경고하는 포스터를 떼고(took down the posters warning about fines for noise) 층마다 사는 가족들의 사진을 붙였어요(put up photos of the families living on each floor). 한 달 안에 소음 불평이 줄었어요(complaints about noise had dropped). 벌금으로 겁주는 대신 이웃 얼굴을 알렸더니 항의가 뜸해졌다는 것이 요점이에요.","tr":[["층별 소음 표 → 항의가 뜸해짐","층마다 소음을 적어 붙이면 조심한다는 그럴듯한 말이지만, 층마다 붙인 것은 소음 표가 아니라 그 층에 사는 가족들의 사진이에요(put up photos of the families living on each floor)."],["이웃 잔치 열기 → 항의가 뜸해짐","잔치로 가까워지면 덜 다툰다는 그럴듯한 말이지만, 글에 나온 것은 잔치가 아니라 층마다 붙인 가족사진이에요(put up photos of the families living on each floor)."],["소음 불평 → 벌금이 늘어남","소음 · 불평 · 벌금 낱말은 같지만 뜻을 비틀었어요. 벌금 이야기는 떼어 낸 포스터에만 있었고(took down the posters warning about fines for noise), 그 뒤 불평은 줄었어요(complaints about noise had dropped)."],["층마다 사진 → 불평이 늘어남","층 · 사진 · 불평 낱말은 같지만 방향을 뒤집었어요. 사진을 붙인 뒤 소음 불평은 늘지 않고 줄었어요(complaints about noise had dropped)."]],"dg":"took down a, put up b"},{"id":"3-11","k":3,"dev":"Instead of","s":"Instead of handing out a list of rules when the year began, our new homeroom teacher had us write three promises together, and we kept every one.","a":"함께 만든 다짐 → 하나도 안 어김","why":"Instead of A, B는 A를 하지 않고 B를 했다는 말이라 무게가 B에 실려요. 새 담임 선생님은 학기 초에 규칙 목록을 나눠 주는 대신(Instead of handing out a list of rules when the year began) 우리에게 약속 세 가지를 함께 쓰게 했고(had us write three promises together), 우리는 하나도 빠짐없이 지켰어요(we kept every one). 남이 준 규칙이 아니라 함께 만든 다짐이어서 하나도 어기지 않았다는 것이 요점이에요.","tr":[["날마다 규칙 읽기 → 하나도 안 어김","규칙을 날마다 읽으면 지킨다는 그럴듯한 말이지만, 선생님은 규칙 목록을 나눠 주지 않고 우리가 약속을 함께 쓰게 했어요(Instead of handing out a list of rules when the year began, our new homeroom teacher had us write three promises together)."],["부모님 서명 → 하나도 안 어김","부모님께 서명을 받으면 지킨다는 그럴듯한 말이지만, 글에 나온 것은 우리가 함께 쓴 약속이에요(had us write three promises together)."],["세 가지 약속 → 지키기 버거움","세 · 약속 · 지키다 낱말은 같지만 결과를 뒤집었어요. 우리는 약속을 모두 지켰어요(we kept every one)."],["담임 선생님 → 규칙 세 개 정해 줌","담임 선생님 · 세 · 규칙 낱말은 같지만 누가 정했는지 바꿨어요. 선생님은 규칙을 정해 준 게 아니라 우리가 약속을 함께 쓰게 했어요(had us write three promises together)."]],"dg":"instead of"},{"id":"3-12","k":3,"dev":"failed to ~. B did. (부정 동사)","s":"The principal's repeated warnings failed to stop students from running in the halls. A line of footprints painted on the floor did.","a":"보이는 길잡이 → 뛰던 발이 멈춤","why":"failed to는 not 없이 「~하지 못했다」는 부정이에요. 교장 선생님의 거듭된 훈화는 복도에서 뛰는 학생들을 막지 못했어요(The principal's repeated warnings failed to stop students from running in the halls). 막아 낸 것은 바닥에 그린 발자국 한 줄이에요(A line of footprints painted on the floor did). 말로 꾸짖는 대신 걸을 자리를 눈에 보이게 해 주자 덜 뛰었으니, 요점은 눈에 보이는 길잡이가 뛰던 발을 멈췄다는 거예요.","tr":[["복도 음악 → 뛰던 발이 멈춤","느린 음악을 틀면 천천히 걷는다는 그럴듯한 말이지만, 학생들을 멈춘 것은 바닥에 그린 발자국이에요(A line of footprints painted on the floor did)."],["벽의 거울 → 뛰던 발이 멈춤","제 모습이 보이면 조심한다는 그럴듯한 말이지만, 글에 나온 것은 거울이 아니라 바닥의 발자국이에요(A line of footprints painted on the floor did)."],["발자국 → 바닥이 더러워짐","발자국 · 바닥 낱말은 같지만 뜻을 비틀었어요. 발자국은 신발 자국이 아니라 바닥에 그려 넣은 것이고, 뛰는 학생을 막아 냈어요(A line of footprints painted on the floor did)."],["복도 바닥 → 뛰다 미끄러짐","복도 · 바닥 · 뛰다 낱말은 같지만 결과를 지어냈어요. 바닥에 그린 발자국은 뛰는 학생을 막아 냈어요(A line of footprints painted on the floor did)."]],"dg":"fail to"},{"id":"3-13","k":3,"dev":"No wonder ~ (no가 있어도 부정이 아님)","s":"A tiny bakery near us bakes just one kind of bread a day and posts tomorrow's choice by the door. No wonder people stop by every evening to check.","a":"내일 빵 예고 → 발길이 이어짐","why":"No wonder는 no가 있어도 부정이 아니라 「~하는 게 당연하다」는 뜻이에요. 작은 빵집은 하루에 한 가지 빵만 굽고, 내일 구울 빵을 문 옆에 미리 붙여 둬요(posts tomorrow's choice by the door). 그러니 사람들이 저녁마다 들러 확인하는 게 당연하다는 거예요(No wonder people stop by every evening to check). 내일 빵을 미리 알려 주니 사람들의 발길이 날마다 이어진다는 것이 요점이에요.","tr":[["작은 시식 → 발길이 이어짐","맛보기를 주면 손님이 온다는 그럴듯한 말이지만, 사람들이 들러서 확인하는 것은 내일 구울 빵이에요(posts tomorrow's choice by the door)."],["빵 종류 늘리기 → 발길이 이어짐","빵 종류가 많으면 자주 온다는 그럴듯한 말이지만, 이 빵집은 하루에 한 가지만 구워요(bakes just one kind of bread a day)."],["저녁마다 → 아무도 안 들름","No를 부정으로 읽었어요. No wonder는 「당연하다」는 뜻이라, 사람들은 저녁마다 들러요(No wonder people stop by every evening to check)."],["한 가지 빵 → 금방 질려 함","한 가지 빵 낱말은 같지만 결과를 지어냈어요. 사람들은 질려 하지 않고 저녁마다 들러 내일 빵을 확인해요(people stop by every evening to check)."]],"dg":"no wonder"},{"id":"3-14","k":3,"dev":"chose B (A를 두고 B를 고름)","s":"When offered a choice between a theme park and a day of work on a nearby farm, our class chose the farm, and it is the trip we remember best.","a":"땀 흘린 하루 → 가장 또렷한 추억","why":"but이나 instead 없이, chose(골랐다)가 한쪽을 버리고 다른 쪽을 들여요. 놀이공원과 근처 농장에서 일하는 하루 가운데(a choice between a theme park and a day of work on a nearby farm) 반은 농장을 골랐고(our class chose the farm), 그것이 가장 잘 기억나는 여행이 됐어요(it is the trip we remember best). 놀이 대신 땀 흘려 일한 하루가 가장 잘 기억난다는 것이 요점이에요.","tr":[["밤새운 캠프 → 가장 또렷한 추억","밤새 함께 지내면 오래 기억난다는 그럴듯한 말이지만, 가장 잘 기억나는 여행은 농장에서 일한 하루예요(our class chose the farm, and it is the trip we remember best)."],["농장 구경 → 가장 또렷한 추억","농장 이야기는 같지만, 반이 보낸 하루는 구경이 아니라 농장에서 일한 하루예요(a day of work on a nearby farm)."],["가까운 농장 → 금방 잊힌 여행","농장 · 여행 낱말은 같지만 결과를 뒤집었어요. 농장 여행은 가장 잘 기억나는 여행이에요(it is the trip we remember best)."],["반 투표 → 놀이공원 뽑힘","반 · 고르다 낱말은 같지만 고른 것을 바꿨어요. 반이 고른 것은 농장이에요(our class chose the farm)."]],"dg":"chose b over a"},{"id":"3-15","k":3,"dev":"less A than B","s":"Whether a class pet stays healthy seems to depend less on how much food it gets than on whether one student is clearly in charge each week.","a":"돌볼 사람 정하기 → 탈 없이 지냄","why":"less A than B는 「A보다 B에 더」라는 뜻으로 무게가 B에 실려요. 반에서 기르는 동물이 건강하게 지내느냐는 먹이를 얼마나 받느냐보다(less on how much food it gets) 매주 한 학생이 분명하게 맡느냐에 달린 듯하다고 해요(than on whether one student is clearly in charge each week). 그래서 요점은 돌볼 사람을 정해 두어야 탈 없이 지낸다는 거예요.","tr":[["다 함께 돌보기 → 탈 없이 지냄","여럿이 함께 돌보면 잘 지낸다는 그럴듯한 말이지만, 글은 한 학생이 분명하게 맡아야 한다고 해요(whether one student is clearly in charge each week)."],["먹이 일지 쓰기 → 탈 없이 지냄","먹이를 적어 두면 잘 돌본다는 그럴듯한 말이지만, 글은 먹이보다 맡은 학생이 분명한지가 중요하다고 해요(less on how much food it gets than on whether one student is clearly in charge each week)."],["매주 한 학생 → 먹이 주기 잊음","매주 · 한 학생 · 먹이 낱말은 같지만 결과를 지어냈어요. 한 학생이 분명히 맡는 것은 건강을 지키는 쪽이에요(whether one student is clearly in charge each week)."],["먹이 양 → 교실 동물 건강 좌우","먹이 · 건강 낱말은 같지만 무게를 거꾸로 실었어요. 먹이의 양은 건강을 덜 좌우하는 쪽이에요(depend less on how much food it gets)."]],"dg":"less a than b"},{"id":"3-16","k":3,"dev":"never fails to ~ (늘 ~한다는 뜻)","s":"Our science teacher never fails to open a new unit with a question that sounds silly, and by the end of the unit, the whole class can explain the answer.","a":"엉뚱한 첫 물음 → 모두 깨우침","why":"never fails to ~는 never가 있어도 부정이 아니라 「~하는 것을 한 번도 거르지 않는다」, 곧 늘 ~한다는 뜻이에요. 과학 선생님은 새 단원을 늘 엉뚱하게 들리는 질문으로 열어요(never fails to open a new unit with a question that sounds silly). 그리고 단원이 끝날 무렵이면 반 전체가 그 답을 설명할 수 있어요(the whole class can explain the answer). 그래서 요점은 엉뚱한 첫 물음으로 시작하면 모두가 깨우친다는 거예요.","tr":[["어려운 첫 질문 → 모두 깨우침","질문으로 연다는 것은 같지만, 선생님의 첫 질문은 어려운 게 아니라 엉뚱하게 들리는 것이에요(a question that sounds silly)."],["직접 해 본 실험 → 모두 깨우침","직접 해 보면 깨친다는 그럴듯한 말이지만, 글은 실험이 아니라 단원을 여는 질문 이야기예요(open a new unit with a question that sounds silly)."],["새 단원 → 질문 없이 시작","never를 부정으로 읽었어요. never fails to는 「거르지 않는다」는 뜻이라, 선생님은 새 단원을 늘 질문으로 열어요(never fails to open a new unit with a question)."],["반 전체 → 답을 설명 못 함","반 전체 · 답 · 설명 낱말은 같지만 never · fails를 부정으로 읽고 결과를 뒤집었어요. 단원 끝에는 반 전체가 답을 설명할 수 있어요(the whole class can explain the answer)."]],"dg":"never fails to"},{"id":"3-17","k":3,"dev":"few ~. What worked was B. (부정 말 없이 부정)","s":"The new speed limit signs on our street turned out to slow few drivers. What worked was a row of flower pots that made the road look narrower.","a":"좁아진 느낌 → 천천히 달림","why":"few는 not 없이 「거의 ~않다」는 부정이에요. 새 속도 제한 표지판으로 속도를 줄인 운전자는 거의 없었고(turned out to slow few drivers), 효과를 낸 것은 길을 좁아 보이게 만든 화분 한 줄이에요(What worked was a row of flower pots that made the road look narrower). 길을 실제로 좁힌 게 아니라 좁아 보이게만 했는데도 차가 느려졌으니, 요점은 길이 좁아진 느낌이 들면 천천히 달린다는 거예요.","tr":[["도로 위 그림 → 천천히 달림","길에 그림을 그리면 속도를 줄인다는 그럴듯한 말이지만, 효과를 낸 것은 길가의 화분이에요(a row of flower pots that made the road look narrower)."],["깜빡이는 불빛 → 천천히 달림","불빛이 깜빡이면 조심한다는 그럴듯한 말이지만, 글에 나온 것은 길을 좁아 보이게 한 화분이에요(a row of flower pots that made the road look narrower)."],["화분 늘어선 길 → 차가 더 빨라짐","화분 · 길 낱말은 같지만 방향을 뒤집었어요. 화분은 차를 빠르게 한 게 아니라 속도를 줄이는 효과를 냈어요(What worked was a row of flower pots)."],["속도 표지판 → 차가 느려짐","표지판 · 느려지다 낱말은 같지만 공을 잘못 돌렸어요. 새 속도 제한 표지판으로 속도를 줄인 운전자는 거의 없었어요(turned out to slow few drivers)."]],"dg":"few ~, what worked"},{"id":"3-18","k":3,"dev":"it is A, not B, that ~","s":"In our school's drama club, it is the habit of clapping for every mistake during practice, not the director's strict notes, that gets shy members to take on bolder roles.","a":"틀려도 반겨 줌 → 수줍음 이겨 냄","why":"it is A, not B, that ~은 A를 힘주어 내세우고 B를 지우는 꼴이에요. 연극 동아리에서 수줍은 단원들이 더 과감한 역을 맡게 만드는 것은(that gets shy members to take on bolder roles) 감독의 엄한 지적이 아니라(not the director's strict notes) 연습 때 실수마다 박수를 쳐 주는 버릇이에요(the habit of clapping for every mistake during practice). 틀려도 반겨 주니 수줍음을 이겨 낸다는 것이 요점이에요.","tr":[["짝 연기 연습 → 수줍음 이겨 냄","둘씩 연습하면 덜 떨린다는 그럴듯한 말이지만, 글이 꼽은 것은 실수에 치는 박수예요(the habit of clapping for every mistake during practice)."],["잘할 때 박수 → 수줍음 이겨 냄","박수 이야기는 같지만 언제 치는지 바꿨어요. 박수는 잘할 때가 아니라 실수할 때마다 쳐 줘요(clapping for every mistake during practice)."],["박수 소리 → 연습이 늘어짐","박수 · 연습 낱말은 같지만 결과를 지어냈어요. 실수에 치는 박수는 수줍은 단원들이 더 과감한 역을 맡게 해요(that gets shy members to take on bolder roles)."],["수줍은 단원 → 작은 역 맡음","수줍은 단원 · 역 낱말은 같지만 결과를 뒤집었어요. 수줍은 단원들은 더 과감한 역을 맡아요(gets shy members to take on bolder roles)."]],"dg":"it is a, not b, that"},{"id":"3-19","k":3,"dev":"not only A but also B (둘 다 살아 있음)","s":"The weekly cooking club not only teaches students simple dishes but also gets them talking with classmates they might never have talked to otherwise.","a":"동아리 → 손맛도 말벗도 얻음","why":"not only A but also B는 not이 있어도 A를 지우지 않아요. A도 살아 있고 B가 더해진다는 뜻이에요. 요리 동아리는 학생들에게 간단한 요리를 가르치기도 하고(teaches students simple dishes), 그러지 않았다면 말 한마디 안 했을 반 친구들과 이야기하게도 만들어요(gets them talking with classmates they might never have talked to otherwise). 그래서 요점은 요리 솜씨와 이야기 나눌 친구를 둘 다 얻는다는 거예요.","tr":[["동아리 → 손맛도 상장도 얻음","솜씨는 맞지만 둘째 것을 바꿨어요. 동아리가 더해 주는 것은 상장이 아니라 반 친구들과 나누는 이야기예요(gets them talking with classmates they might never have talked to otherwise)."],["동아리 → 손맛도 건강도 얻음","요리를 배우면 몸에도 좋다는 그럴듯한 말이지만, 글이 더한 것은 반 친구들과 나누는 이야기예요(but also gets them talking with classmates)."],["동아리 → 요리보다 반 친구와 수다","not A but B처럼 B만 살렸어요. not only A but also B는 A도 살아 있어서, 요리를 가르치는 것도 동아리가 하는 일이에요(not only teaches students simple dishes)."],["동아리 → 간단한 요리만 배움","간단한 요리 낱말은 같지만 범위를 줄였어요. 동아리는 요리만이 아니라 반 친구들과 이야기하게도 만들어요(but also gets them talking with classmates they might never have talked to otherwise)."]],"dg":"not only a but also b"},{"id":"3-20","k":3,"dev":"skipped A and put B (부정 말 없이 대체)","s":"Our student council skipped the usual energy-saving poster and put a small card by every light switch in the school. Since then, lights in empty rooms are almost always off.","a":"손 닿는 곳 알림 → 잊지 않고 끔","why":"but이나 instead 없이, skipped(건너뛰었다)와 put(두었다)이 옛 방법을 지우고 새 방법을 들여요. 학생회는 늘 하던 절전 포스터를 건너뛰고(skipped the usual energy-saving poster) 학교의 모든 전등 스위치 옆에 작은 쪽지를 붙였어요(put a small card by every light switch in the school). 그 뒤로 빈 교실의 불은 거의 늘 꺼져 있어요(lights in empty rooms are almost always off). 불을 끄는 바로 그 자리, 손 닿는 곳에서 알려 주니 잊지 않고 끈다는 것이 요점이에요.","tr":[["스위치 덮개 → 잊지 않고 끔","스위치에 덮개를 씌우면 챙긴다는 그럴듯한 말이지만, 학생회가 스위치 옆에 둔 것은 작은 쪽지예요(put a small card by every light switch in the school)."],["절전 당번 두기 → 잊지 않고 끔","당번을 정하면 챙긴다는 그럴듯한 말이지만, 글에 나온 것은 당번이 아니라 스위치 옆 쪽지예요(put a small card by every light switch)."],["빈 교실 → 불이 켜진 채 남음","빈 교실 · 불 낱말은 같지만 방향을 뒤집었어요. 빈 교실의 불은 거의 늘 꺼져 있어요(lights in empty rooms are almost always off)."],["작은 쪽지 → 눈에 잘 안 띔","작은 쪽지 낱말은 같지만 결과를 지어냈어요. 쪽지를 둔 뒤로 빈 교실 불은 거의 늘 꺼져 있어요(Since then, lights in empty rooms are almost always off)."]],"dg":"skipped a, put b"},{"id":"4-1","k":4,"dev":"For example","s":"For example, when one town's electric bills began showing how much power similar homes nearby used, families on average started using a little less.","a":"남과 견줘 보면 → 아껴 쓰게 됨","why":"For example 뒤는 사례예요. 한 마을의 전기 요금표에 비슷한 이웃 집들이 쓴 양이 함께 나오기 시작하자(began showing how much power similar homes nearby used), 집들이 평균적으로 전기를 조금 덜 쓰기 시작했어요(families on average started using a little less). 글에는 요금이 올랐다거나 상을 걸었다는 말이 없어요. 바뀐 것은 우리 집이 쓴 양을 남의 집과 견줘 볼 수 있게 된 일 하나예요. 전기 · 요금표라는 겉을 걷어 내면, 남과 견줘 보면 아껴 쓰게 될 수 있다는 원리가 남아요.","tr":[["요금을 올리면 → 아껴 쓰게 됨","electric bills 낱말은 같고 결과도 같지만 까닭이 달라요. 글에는 요금이 올랐다는 말이 없어요. 요금표에 새로 나온 것은 값이 아니라 비슷한 이웃 집들이 쓴 양이에요(how much power similar homes nearby used)."],["상을 걸면 → 아껴 쓰게 됨","아껴 쓰게 됐다는 결과는 같지만 까닭이 달라요. 글에는 상 이야기가 없고, 바뀐 것은 요금표에 남의 집이 쓴 양이 함께 나온 일뿐이에요(began showing how much power similar homes nearby used)."],["전기를 덜 쓰면 → 요금이 줄어듦","using a little less · electric bills 낱말은 같지만 덜 쓴 일을 까닭으로 삼고 글에 없는 결과를 붙였어요. 이 문장에서 덜 쓴 것은 결과이고(families on average started using a little less), 그 까닭은 요금표에 이웃 집들이 쓴 양이 나온 일이에요(began showing how much power similar homes nearby used)."],["자세히 알려 주면 → 더 믿게 됨","요금표에 새 내용이 생긴 것은 맞지만 결과를 지어냈어요. 글에는 믿음 이야기가 없고, 그 뒤 일어난 일은 집들이 전기를 조금 덜 쓰게 된 것이에요(started using a little less)."]],"dg":"for example"},{"id":"4-2","k":4,"dev":"the former (앞의 것 — 가장 가까운 쪽이 아님)","s":"Most of those who choose the former, the manager noticed, quit within a month, often saying they never felt part of the team.","a":"지켜보기만 하면 → 정 못 붙이고 떠남","why":"the former는 앞 문장에 나온 두 길 가운데 앞의 것, 곧 한 주 동안 다른 봉사자들을 지켜보기만 하는 쪽(watch the others for a week)이에요. 이 문장은 그쪽을 고른 사람 대부분이 한 달 안에 그만두고, 그때 흔히 팀의 일원이라고 느낀 적이 없다고 말한다고 해요(they never felt part of the team). 그래서 요점은 지켜보기만 하면 정을 못 붙이고 떠나기 쉽다는 거예요.","tr":[["첫날부터 뛰어들면 → 정 못 붙이고 떠남","결과는 같지만 the former를 가장 가까운 쪽(start helping patients on their first day)으로 받은 답이에요. the former는 앞의 것, 곧 한 주 동안 지켜보는 쪽(watch the others for a week)이에요."],["한 달만 버티면 → 팀의 일원이 됨","within a month · part of the team 낱말은 같지만 뜻이 거꾸로예요. 글에서 한 달은 버텨 낸 때가 아니라 그만둔 때이고(quit within a month), 그만둔 사람들은 팀의 일원이라고 느낀 적이 없다고 했어요(they never felt part of the team)."],["먼저 다가가 주면 → 새 사람이 남음","흔히 하는 말이지만 글에 없어요. 글은 먼저 온 사람들이 할 일이 아니라, 지켜보기만 한 사람이 팀의 일원이라고 느낀 적이 없다고 해요(they never felt part of the team)."],["시작 방법을 고르게 하면 → 덜 그만둠","앞 문장(new volunteers can either watch the others for a week or start helping patients on their first day)에서 끌어낸 말이지만 글이 보여 주지 않아요. 고를 수 있었는데도 지켜보는 쪽을 고른 사람 대부분이 그만뒀어요(quit within a month)."]],"ctx":"At one hospital, new volunteers can either watch the others for a week or start helping patients on their first day.","dg":"the former"},{"id":"4-3","k":4,"dev":"원리와 장면 나란히 (이음말 없음)","s":"Working side by side on a shared task can change how people feel about each other. Two boys who had disliked each other became close friends while building a robot for the science fair.","a":"같이 일해 보면 → 사이가 좋아짐","why":"두 문장 사이에 For example 같은 이음말이 없어요. 첫 문장은 원리(Working side by
