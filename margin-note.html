councils to limit net fishing, 곧 여러 섬 의회를 움직여 그물 어업을 제한하게 했어요.\n④ 그래서 여백에는 「산호 회복 연구 결과 → 섬 의회들 그물 어업 제한」이라고 적으면 돼요.","tr":[["산호 회복 연구 결과 → 섬 의회들 물고기 방류 확대","fish were protected(물고기를 보호했다)를 보고 「의회가 물고기를 늘리는 일을 했구나」 하고 이었다면 이 보기예요. 그런데 의회가 하기로 한 일은 물고기를 풀어 놓는 것이 아니라 그물 어업을 제한하는 것이에요(to limit net fishing)."],["그물 어획 감소 소식 → 섬 의회들 그물 어업 제한","net fishing(그물 어업)을 보고 「고기가 덜 잡혀서 제한했구나」 하고 까닭을 지어 이었다면 이 보기예요. 그런데 의회를 움직인 것은 어획량 이야기가 아니라 산호초가 더 빨리 회복됐다는 발견이에요(The finding that one damaged reef recovered faster)."],["그물 어획 감소 소식 → 섬 의회들 물고기 방류 확대","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 의회를 움직인 것은 산호초 회복에 관한 발견이고, 의회가 한 일은 그물 어업을 제한한 것이에요."],["바닷말 뜯는 물고기 보호 → 상한 산호초 더 빨리 회복","문장 앞쪽이 길고 또렷해서 그 부분을 옮겼다면 이 보기예요. 틀린 말은 아니에요. 문장에 그대로 있어요(one damaged reef recovered faster where grazing fish were protected). 하지만 그것은 '무슨 발견인지'예요. 이 문장이 하려는 말은, 그 발견 때문에 섬 의회들이 그물 어업을 제한하게 됐다는 거예요."]],"dg":"the finding that","ko":"바닷말을 뜯어 먹는 물고기를 보호한 곳에서 상한 산호초 하나가 더 빨리 회복됐다는 발견이 여러 섬 의회를 움직여 그물 어업을 제한하게 했다.","voc":[["finding","(연구로) 알아낸 것, 발견"],["damaged reef","상한 산호초"],["recover","회복하다"],["grazing fish","(바닷말을) 뜯어 먹는 물고기"],["persuade A to ~","A를 설득해 ~하게 하다"],["council","의회"],["limit","제한하다"],["net fishing","그물 어업"]]},{"id":"S1-10","k":1,"dev":"with + 명사 + having p.p. (곁들인 사실을 덧붙임)","s":"In one hospital trial, night nurses who ate before midnight reported fewer stomach complaints, with many of them having also slept longer after their shifts.","a":"자정 전 식사한 야간 간호사 → 속 불편 호소 더 적음","why":"① 먼저 「누가 → 어떻게 됐다」만 남겨 보세요. night nurses who ate before midnight(자정 전에 식사한 야간 간호사들)이 '누가'이고, reported fewer stomach complaints(속이 불편하다는 호소가 더 적었다)가 '어떻게 됐다'예요. 쉼표 앞에서 할 말이 다 나왔어요.\n② nurses 뒤의 who ate before midnight는 '어떤 간호사인지'를 정해 주는 말이라 빼면 안 돼요. 언제 먹었는지가 이 실험의 알맹이예요. before midnight(자정 전)이에요.\n③ 쉼표 뒤의 with many of them having also slept longer after their shifts는 곁들인 사실이에요. also(~도)가 보이죠? 「잠도 더 오래 잤다」고 하나 더 얹은 말이에요. after their shifts(근무 뒤)는 '언제 잤는지'이지 '언제 먹었는지'가 아니에요.\n④ 그래서 여백에는 「자정 전 식사한 야간 간호사 → 속 불편 호소 더 적음」이라고 적으면 돼요.","tr":[["자정 전 식사한 야간 간호사 → 근무 중 졸음 더 적음","slept(잤다)와 shifts(근무)를 보고 「근무 때 덜 졸렸구나」 하고 이었다면 이 보기예요. 그런데 잠 이야기는 근무 중의 졸음이 아니라 근무를 마친 뒤에 더 오래 잤다는 것이에요(slept longer after their shifts). 그리고 더 적었던 것은 속 불편 호소예요(fewer stomach complaints)."],["근무 뒤에 식사한 야간 간호사 → 속 불편 호소 더 적음","문장 끝의 after their shifts(근무 뒤)를 '먹은 때'로 이었다면 이 보기예요. 그런데 먹은 때는 자정 전이에요(who ate before midnight). 근무 뒤는 잠을 잔 때예요."],["근무 뒤에 식사한 야간 간호사 → 근무 중 졸음 더 적음","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 간호사들이 먹은 때는 자정 전이고, 더 적었던 것은 졸음이 아니라 속 불편 호소예요."],["자정 전 식사한 야간 간호사 → 근무 뒤에 더 오래 잠","문장 맨 끝이 기억에 남아 그 부분을 옮겼다면 이 보기예요. 틀린 말은 아니에요. 많은 간호사가 근무 뒤에 더 오래 잤다는 말은 문장에 있어요(slept longer after their shifts). 하지만 also(~도)가 알려 주듯 그것은 '곁들인 사실'이에요. 이 문장이 먼저 하려는 말은 속 불편 호소가 더 적었다는 거예요."]],"dg":"with ~ having","ko":"한 병원의 실험에서, 자정 전에 식사를 한 야간 근무 간호사들은 속이 불편하다는 호소가 더 적었고, 그들 가운데 많은 이는 근무를 마친 뒤 잠도 더 오래 잤다.","voc":[["trial","(효과를 알아보는) 실험"],["night nurse","야간 근무 간호사"],["midnight","자정 (밤 12시)"],["report","(겪은 것을) 말하다, 알리다"],["stomach complaint","속이 불편한 증상"],["shift","(교대) 근무 시간"],["with many of them having slept ~","그들 가운데 많은 이가 ~ 잤는데 (곁들인 사실을 덧붙이는 말)"]]},{"id":"S1-11","k":1,"dev":"on the grounds that ~ (그렇게 정한 까닭)","s":"One district court began letting rural witnesses testify by video call, on the grounds that travel to the courthouse could consume two working days, and postponed hearings have become rare.","a":"시골 증인 화상 증언 허용 → 재판 미뤄지는 일 드묾","why":"① 「무엇을 했더니 → 어떻게 됐다」를 찾아보세요. began letting rural witnesses testify by video call(시골 증인이 화상으로 증언하게 해 주기 시작했다)이 '한 일'이고, 맨 끝의 postponed hearings have become rare(미뤄지는 재판이 드물어졌다)가 '달라진 것'이에요.\n② 가운데 쉼표 사이의 on the grounds that ~은 「~라는 까닭으로」예요. 왜 그렇게 정했는지를 끼워 넣은 말이에요. 이 부분을 손으로 가리고 읽어도 「화상 증언을 허락했고, 미뤄지는 재판이 드물어졌다」로 문장이 이어져요.\n③ 까닭 속에 two working days(일하는 날 이틀) 같은 또렷한 숫자가 있어 눈길이 가요. 하지만 그것은 증인이 법원까지 오가는 데 들던 시간이에요. 까닭은 요점을 받쳐 주는 말이지 요점이 아니에요.\n④ 그래서 여백에는 「시골 증인 화상 증언 허용 → 재판 미뤄지는 일 드묾」이라고 적으면 돼요.","tr":[["시골 증인 화상 증언 허용 → 재판 날짜 이틀 당겨짐","two working days(이틀)라는 숫자가 눈에 띄어 「재판이 이틀 빨라졌구나」 하고 이었다면 이 보기예요. 그런데 이틀은 증인이 법원까지 오가는 데 들던 시간이에요(travel to the courthouse could consume two working days). 달라진 것은 재판이 미뤄지는 일이 드물어졌다는 거예요."],["시골 증인 오가는 차비 지원 → 재판 미뤄지는 일 드묾","travel(오가는 길)을 보고 「오가기 힘드니 차비를 대 줬겠지」 하고 짐작했다면 이 보기예요. 법원이 한 일은 차비를 주는 것이 아니라, 아예 오지 않고 화상으로 증언하게 한 거예요(letting rural witnesses testify by video call)."],["시골 증인 오가는 차비 지원 → 재판 날짜 이틀 당겨짐","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 법원은 차비가 아니라 화상 증언을 허락했고, 이틀은 재판이 당겨진 날수가 아니라 오가는 데 들던 시간이에요."],["법원까지 오가는 먼 길 → 일하는 날 이틀을 잡아먹음","on the grounds that 뒤를 그대로 옮겼다면 이 보기예요. 틀린 말은 아니에요(travel to the courthouse could consume two working days). 하지만 그것은 '왜 허락했는지'예요. 이 문장이 하려는 말은, 허락하고 나니 미뤄지는 재판이 드물어졌다는 거예요."]],"dg":"on the grounds that","ko":"한 지방 법원이 시골에 사는 증인들에게 화상 통화로 증언할 수 있게 해 주기 시작했다. 법원까지 오가는 데 일하는 날 이틀이 들 수 있다는 까닭에서였다. 그 뒤로 미뤄지는 재판이 드물어졌다.","voc":[["district court","지방 법원"],["witness","증인"],["testify","증언하다"],["on the grounds that ~","~라는 까닭으로"],["consume","(시간을) 잡아먹다"],["postponed hearing","미뤄진 재판"]]},{"id":"S1-12","k":1,"dev":"Notwithstanding ~ (사정을 덧붙일 뿐 뒤집지 않음)","s":"Notwithstanding its modest budget, one municipal orchestra that began rehearsing in public libraries has attracted a markedly younger audience to its subsequent concerts.","a":"도서관에서 연습 시작 → 객석 나이대 눈에 띄게 낮아짐","why":"① 맨 앞 Notwithstanding its modest budget은 「예산이 넉넉지 않은데도」예요. '~에도 불구하고'라는 말이라 뒤에서 무언가 뒤집힐 것 같지만, 여기서는 관현악단의 사정을 한마디 덧붙였을 뿐이에요. 쉼표까지 손으로 가리고 읽어 보세요.\n② 남은 문장의 뼈대는 one municipal orchestra ... has attracted a markedly younger audience(한 시립 관현악단이 눈에 띄게 젊은 관객을 끌어들였다)예요. 이것이 '달라진 것'이에요.\n③ 그 관현악단이 '한 일'은 orchestra 바로 뒤에 붙어 있어요. that began rehearsing in public libraries(공공 도서관에서 연습하기 시작한)예요. 도서관에서 한 것은 연습(rehearsing)이고, 연주회(concerts)는 그 뒤에 따로 열렸다는 점을 놓치지 마세요.\n④ 그래서 여백에는 「도서관에서 연습 시작 → 객석 나이대 눈에 띄게 낮아짐」이라고 적으면 돼요.","tr":[["도서관에서 연습 시작 → 빠듯하던 살림 눈에 띄게 펴짐","맨 앞의 budget(예산)이 기억에 남아 「그래서 살림이 나아졌구나」 하고 이었다면 이 보기예요. 그런데 예산 이야기는 '넉넉지 않다'는 사정으로 한 번 나올 뿐이에요(its modest budget). 살림이 나아졌다는 말은 문장 어디에도 없고, 달라진 것은 관객의 나이예요(a markedly younger audience)."],["도서관에서 무료 연주 → 객석 나이대 눈에 띄게 낮아짐","libraries(도서관)와 concerts(연주회)를 한데 묶어 「도서관에서 연주회를 열었구나」 하고 읽었다면 이 보기예요. 도서관에서 한 것은 연주회가 아니라 연습이에요(began rehearsing in public libraries). 연주회는 그 뒤에 따로 열렸고(its subsequent concerts), '무료'라는 말도 없어요."],["도서관에서 무료 연주 → 빠듯하던 살림 눈에 띄게 펴짐","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 도서관에서 한 것은 연주회가 아니라 연습이고, 달라진 것은 살림이 아니라 관객의 나이예요."],["어느 시립 관현악단 → 넉넉지 못한 예산으로 꾸려 감","Notwithstanding을 「여기가 중요하다」는 신호로 읽고 그 뒤를 옮겼다면 이 보기예요. 틀린 말은 아니에요(its modest budget). 하지만 그것은 덧붙은 사정이에요. 이 문장이 하려는 말은, 그런 사정에서도 더 젊은 관객을 끌어들였다는 거예요."]],"dg":"notwithstanding","ko":"예산이 넉넉지 않은데도, 공공 도서관에서 연습하기 시작한 한 시립 관현악단은 그 뒤에 연 연주회에 눈에 띄게 젊은 관객을 끌어들였다.","voc":[["notwithstanding ~","~에도 불구하고"],["modest budget","넉넉지 않은 예산"],["municipal","시립의(시에서 꾸리는)"],["rehearse","(공연을 앞두고) 연습하다"],["markedly","눈에 띄게"],["subsequent","그 뒤의"]]},{"id":"S1-13","k":1,"dev":"as evidenced by ~ (증거를 덧붙임)","s":"Staggering the start times of its three shifts has greatly eased the congestion at one factory's gates, as evidenced by traffic counts the firm commissioned from an independent consultant.","a":"근무조 출근 시각 엇갈리게 → 정문 앞 혼잡 크게 풀림","why":"① 맨 앞의 긴 덩어리 Staggering the start times of its three shifts(세 근무조의 시작 시각을 엇갈리게 한 것)가 '한 일'이에요. stagger는 여럿이 한꺼번에 몰리지 않게 시각을 조금씩 달리한다는 뜻이에요.\n② 바로 뒤의 has greatly eased the congestion at one factory's gates(한 공장 정문의 혼잡을 크게 풀었다)가 '달라진 것'이에요. 여기까지가 이 문장이 하려는 말이에요.\n③ 쉼표 뒤의 as evidenced by ~는 「~이 보여 주듯」이에요. 무엇으로 확인했는지를 덧붙인 말이에요. 자문가(consultant)는 교통량을 세어 준 사람으로 나올 뿐이에요.\n④ 그래서 여백에는 「근무조 출근 시각 엇갈리게 → 정문 앞 혼잡 크게 풀림」이라고 적으면 돼요.","tr":[["근무조 출근 시각 엇갈리게 → 외부 자문 비용 크게 줄임","문장 끝의 consultant(자문가)가 기억에 남아 「자문 비용이 줄었구나」 하고 이었다면 이 보기예요. 비용 이야기는 문장에 없어요. 자문가는 교통량을 세어 준 사람이고(traffic counts the firm commissioned from an independent consultant), 달라진 것은 정문의 혼잡이에요(eased the congestion)."],["근무조 하나 더 늘려 셋으로 → 정문 앞 혼잡 크게 풀림","three shifts(세 근무조)를 보고 「근무조를 셋으로 늘렸구나」 하고 읽었다면 이 보기예요. its three shifts는 이미 있던 세 근무조예요. 공장이 한 일은 수를 늘린 것이 아니라 시작 시각을 엇갈리게 한 거예요(Staggering the start times of its three shifts)."],["근무조 하나 더 늘려 셋으로 → 외부 자문 비용 크게 줄임","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 공장은 근무조를 늘린 것이 아니라 시작 시각을 엇갈리게 했고, 달라진 것은 자문 비용이 아니라 정문의 혼잡이에요."],["회사 밖의 자문가 → 의뢰를 받고 교통량을 세어 봄","문장 끝을 그대로 옮겼다면 이 보기예요. 틀린 말은 아니에요(traffic counts the firm commissioned from an independent consultant). 하지만 그것은 '무엇으로 확인했는지'예요. 이 문장이 하려는 말은, 시각을 엇갈리게 하자 혼잡이 크게 풀렸다는 거예요."]],"dg":"as evidenced by","ko":"세 근무조의 시작 시각을 서로 엇갈리게 했더니 한 공장 정문의 혼잡이 크게 풀렸다. 이는 회사가 외부 자문가에게 맡긴 교통량 조사로 확인된 것이다.","voc":[["stagger","(시각을) 서로 엇갈리게 하다"],["shift","근무조(교대로 일하는 조)"],["ease","덜다, 풀다"],["congestion","혼잡, 붐빔"],["as evidenced by ~","~이 보여 주듯"],["commission","(일을) 맡기다"],["consultant","자문가"]]},{"id":"S1-14","k":1,"dev":"lest ~ (~하지 않도록 — 목적)","s":"One pharmacy chain now prints dosage instructions in large type, lest elderly customers misread them, and calls to its hotline about dosing mistakes have dropped sharply.","a":"복약 안내 글씨 키움 → 용량 실수 문의 전화 줄어듦","why":"① 「무엇을 했더니 → 어떻게 됐다」를 찾아보세요. now prints dosage instructions in large type(이제 복용량 안내를 큰 글씨로 찍는다)이 '한 일'이고, 맨 끝의 calls to its hotline about dosing mistakes have dropped sharply(용량 실수를 묻는 전화가 크게 줄었다)가 '달라진 것'이에요.\n② 가운데의 lest는 낯선 말이지만 뜻은 간단해요. 「~하지 않도록」이에요. lest elderly customers misread them은 「나이 든 손님이 잘못 읽지 않도록」, 곧 왜 글씨를 키웠는지를 끼워 넣은 말이에요.\n③ 이 부분을 손으로 가리고 읽어도 「큰 글씨로 찍는다, 그리고 전화가 크게 줄었다」로 문장이 이어져요. 목적은 요점을 받쳐 주는 말이지 요점이 아니에요.\n④ 그래서 여백에는 「복약 안내 글씨 키움 → 용량 실수 문의 전화 줄어듦」이라고 적으면 돼요.","tr":[["복약 안내 글씨 키움 → 나이 든 단골손님 늘어남","elderly customers(나이 든 손님)가 눈에 들어와 「나이 든 손님이 좋아해서 더 많이 오겠구나」 하고 이었다면 이 보기예요. 그럴듯하지만 문장에 없는 말이에요. 나이 든 손님은 글씨를 키운 목적에만 나오고(lest elderly customers misread them), 달라진 것은 용량 실수를 묻는 전화예요(calls to its hotline about dosing mistakes)."],["복약 안내에 그림 넣음 → 용량 실수 문의 전화 줄어듦","instructions(안내)를 알아보기 쉽게 고쳤다는 것까지만 읽고 '어떻게' 고쳤는지를 놓쳤다면 이 보기예요. 약국이 한 일은 그림을 넣은 것이 아니라 글씨를 키운 거예요(prints dosage instructions in large type)."],["복약 안내에 그림 넣음 → 나이 든 단골손님 늘어남","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 약국은 그림을 넣은 것이 아니라 글씨를 키웠고, 달라진 것은 단골손님이 아니라 용량 실수를 묻는 전화예요."],["나이 든 손님 → 깨알 같은 안내문 잘못 읽기 쉬움","lest 뒤를 옮겼다면 이 보기예요. 글씨를 키운 까닭으로는 맞는 말이에요(lest elderly customers misread them). 하지만 그것은 '왜 그렇게 했는지'예요. 이 문장이 하려는 말은, 글씨를 키우고 나니 문의 전화가 크게 줄었다는 거예요(have dropped sharply)."]],"dg":"lest","ko":"한 약국 체인은 나이 든 손님이 잘못 읽지 않도록 이제 복용량 안내를 큰 글씨로 찍는다. 그러자 약 먹는 양을 틀린 일로 상담 전화에 걸려 오는 전화가 크게 줄었다.","voc":[["dosage instructions","복용량(약 먹는 양) 안내"],["in large type","큰 글씨로"],["lest ~","~하지 않도록"],["misread","잘못 읽다"],["hotline","상담 전화"],["dosing mistake","약 먹는 양을 틀리는 실수"],["drop sharply","크게 줄다"]]},{"id":"S1-15","k":1,"dev":"albeit ~ (단서를 덧붙일 뿐 뒤집지 않음)","s":"A coastal town that moved its weekly market indoors has seen vendors' income stabilize across the seasons, albeit at the cost of tourists who once wandered in from the beach.","a":"장터 실내로 옮김 → 상인 벌이 철 타지 않게 됨","why":"① 뼈대는 A coastal town ... has seen vendors' income stabilize(한 바닷가 마을에서 상인들의 수입이 고르게 됐다)예요. 이것이 '달라진 것'이에요. stabilize는 '늘어나다'가 아니라 '출렁이지 않게 되다'라는 뜻이에요.\n② 그 마을이 '한 일'은 town 바로 뒤에 붙어 있어요. that moved its weekly market indoors(주마다 서는 장을 실내로 옮긴)예요.\n③ 쉼표 뒤의 albeit는 「비록 ~이기는 하지만」이에요. 뒤집는 말처럼 보이지만, 앞에서 한 말을 무르지는 않아요. 「다만 이런 값은 치렀다」고 단서를 하나 덧붙일 뿐이에요. 치른 값은 해변에서 걸어 들어오던 관광객이에요(at the cost of tourists).\n④ 그래서 여백에는 「장터 실내로 옮김 → 상인 벌이 철 타지 않게 됨」이라고 적으면 돼요.","tr":[["장터 실내로 옮김 → 관광객 손님 더 몰려듦","tourists(관광객)가 눈에 들어와 「실내로 옮기니 관광객이 더 왔구나」 하고 이었다면 이 보기예요. 그런데 at the cost of는 「~을 잃고」라는 뜻이에요. 관광객은 늘어난 쪽이 아니라 잃은 쪽이에요(at the cost of tourists who once wandered in from the beach)."],["장 서는 날 늘림 → 상인 벌이 철 타지 않게 됨","weekly market(주마다 서는 장)을 보고 「장 서는 날을 손봤구나」 하고 짐작했다면 이 보기예요. 마을이 바꾼 것은 날이 아니라 자리예요. 장터를 실내로 옮겼어요(moved its weekly market indoors)."],["장 서는 날 늘림 → 관광객 손님 더 몰려듦","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 마을은 날을 늘린 것이 아니라 장터를 실내로 옮겼고, 관광객은 오히려 잃은 쪽이에요."],["해변서 오던 관광객 → 장터 쪽으로는 발길 끊음","albeit를 「여기서부터가 진짜 하려는 말」이라는 신호로 읽고 그 뒤를 옮겼다면 이 보기예요. 틀린 말은 아니에요(at the cost of tourists who once wandered in from the beach). 하지만 그것은 덧붙은 단서예요. 이 문장이 하려는 말은, 실내로 옮기자 상인들의 수입이 고르게 됐다는 거예요."]],"dg":"albeit","ko":"주마다 서는 장을 실내로 옮긴 한 바닷가 마을에서는 상인들의 수입이 철에 따라 출렁이지 않게 되었다. 다만 해변에서 슬슬 걸어 들어오던 관광객은 잃었다.","voc":[["coastal","바닷가의"],["vendor","상인"],["stabilize","고르게 되다, 안정되다"],["across the seasons","사철 내내"],["albeit ~","비록 ~이기는 하지만"],["at the cost of ~","~을 잃는 값을 치르고"],["wander in","슬슬 걸어 들어오다"]]},{"id":"S1-16","k":1,"dev":"as is often the case with ~ (끼워 넣은 한마디)","s":"One dairy cooperative's decision to publish every member's milk yield has, as is often the case with such transparency programs, narrowed the gap between its most and least productive farms.","a":"조합원별 산유량 공개 → 농가 사이 격차 좁혀짐","why":"① 문장 한가운데 쉼표 두 개 사이에 as is often the case with such transparency programs가 끼어 있어요. 「이런 제도에서 흔히 그렇듯」이라는 한마디예요. 먼저 이 부분을 손으로 가려 보세요.\n② 그러면 has와 narrowed the gap이 바로 이어져요. 뼈대는 「조합의 결정이 차이를 좁혔다」예요. 이것이 '달라진 것'이에요.\n③ 어떤 결정인지는 decision 바로 뒤에 있어요. to publish every member's milk yield(조합원마다의 우유 생산량을 공개하기로 한)가 '한 일'이에요. 좁혀진 것은 가장 많이 짜는 농가와 가장 적게 짜는 농가 사이의 차이예요(between its most and least productive farms).\n④ 그래서 여백에는 「조합원별 산유량 공개 → 농가 사이 격차 좁혀짐」이라고 적으면 돼요.","tr":[["조합원별 산유량 공개 → 앞선 농가 더욱 앞서감","「가장 많이 짜는 농가」라는 말이 눈에 들어와 「잘하는 농가가 더 잘하게 됐구나」 하고 이었다면 이 보기예요. 문장은 거꾸로예요. 앞선 농가가 달아난 것이 아니라 앞선 농가와 뒤처진 농가의 차이가 좁혀졌어요(narrowed the gap between its most and least productive farms)."],["조합원별 우윳값 공개 → 농가 사이 격차 좁혀짐","member(조합원)와 milk(우유)까지만 보고 '우유의 무엇'을 공개했는지 놓쳤다면 이 보기예요. 공개한 것은 값이 아니라 양이에요. yield는 '생산량'이에요(publish every member's milk yield)."],["조합원별 우윳값 공개 → 앞선 농가 더욱 앞서감","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 공개한 것은 값이 아니라 생산량이고, 농가 사이의 차이는 벌어진 것이 아니라 좁혀졌어요."],["투명하게 밝히는 제도 → 어디서나 흔히 쓰이는 편","쉼표 사이에 끼어든 말에서 often과 transparency programs를 이어 붙였다면 이 보기예요. 그런데 '흔하다'는 것은 제도가 흔하다는 말이 아니라, 이런 제도에서 이런 결과가 흔하다는 말이에요(as is often the case with such transparency programs). 게다가 그것은 끼어든 한마디예요. 이 문장이 하려는 말은 차이가 좁혀졌다는 거예요."]],"dg":"as is often the case with","ko":"조합원마다 우유를 얼마나 짜는지 공개하기로 한 어느 낙농 조합의 결정은, 이런 투명성 제도에서 흔히 그렇듯, 가장 많이 짜는 농가와 가장 적게 짜는 농가의 차이를 좁혔다.","voc":[["dairy cooperative","낙농 조합(젖소 농가들의 모임)"],["publish","공개하다"],["milk yield","우유 생산량"],["as is often the case with ~","~에서 흔히 그렇듯"],["transparency","투명성(숨기지 않고 드러냄)"],["narrow the gap","차이를 좁히다"],["productive","많이 생산하는"]]},{"id":"S1-17","k":1,"dev":"Much to the surprise of ~ (반응을 덧붙일 뿐 뒤집지 않음)","s":"Much to the surprise of its own managers, a university cafeteria that eliminated trays has recorded a substantial decline in the food diners discard.","a":"쟁반 없앤 구내식당 → 버려지는 음식 크게 줆","why":"① 맨 앞 Much to the surprise of its own managers는 「운영진 스스로도 무척 놀랐는데」예요. '놀랐다'는 말이 있어 뒤에서 무언가 뒤집힐 것 같지만, 누가 놀랐는지를 덧붙였을 뿐이에요. 쉼표까지 손으로 가리고 읽어 보세요.\n② 남은 문장의 뼈대는 a university cafeteria ... has recorded a substantial decline(한 대학 구내식당에서 크게 줄었다)이에요.\n③ 무엇이 줄었는지가 중요해요. in the food diners discard, 곧 「식사하는 사람들이 버리는 음식」이에요. 식사하는 사람들(diners)이 준 것이 아니라 그들이 버리는(discard) 음식이 줄었어요. 그 식당이 '한 일'은 that eliminated trays(쟁반을 없앤)예요.\n④ 그래서 여백에는 「쟁반 없앤 구내식당 → 버려지는 음식 크게 줆」이라고 적으면 돼요.","tr":[["쟁반 없앤 구내식당 → 찾아오는 손님 크게 줆","decline(줄어듦) 뒤에서 diners(식사하는 사람들)만 보고 「손님이 줄었구나」 하고 읽었다면 이 보기예요. 끝의 discard(버리다)까지 읽어야 해요. 준 것은 손님이 아니라 손님들이 버리는 음식이에요(a substantial decline in the food diners discard)."],["반찬 줄인 구내식당 → 버려지는 음식 크게 줆","버려지는 음식이 줄었다는 결과에서 거꾸로 「음식 가짓수를 줄였겠지」 하고 짐작했다면 이 보기예요. 식당이 없앤 것은 음식이 아니라 쟁반이에요(a university cafeteria that eliminated trays)."],["반찬 줄인 구내식당 → 찾아오는 손님 크게 줆","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 식당이 없앤 것은 반찬이 아니라 쟁반이고, 준 것은 손님이 아니라 버려지는 음식이에요."],["구내식당 운영진 → 예상과 다른 결과에 놀람","surprise(놀람)를 「여기가 중요하다」는 신호로 읽고 그 부분을 옮겼다면 이 보기예요. 틀린 말은 아니에요(Much to the surprise of its own managers). 하지만 그것은 '누가 놀랐는지'예요. 이 문장이 하려는 말은 무엇에 놀랐는지, 곧 버려지는 음식이 크게 줄었다는 거예요."]],"dg":"much to the surprise of","ko":"운영진 스스로도 무척 놀랐는데, 쟁반을 없앤 한 대학 구내식당에서 식사하는 사람들이 버리는 음식이 크게 줄었다.","voc":[["much to the surprise of ~","~에게는 무척 놀랍게도"],["eliminate","없애다"],["tray","쟁반"],["substantial","꽤 큰"],["decline","줄어듦"],["diner","식사하는 사람"],["discard","버리다"]]},{"id":"S1-18","k":1,"dev":"a rise ~ attribute to ~ (동격 + 관계절로 까닭을 덧붙임)","s":"Enrollment in one college's evening courses has doubled since lectures were condensed into four-week units, a rise instructors attribute to how well short units suit students' irregular working hours.","a":"강의 넉 주 단위로 압축 → 야간 과정 수강생 갑절","why":"① 앞부분의 뼈대는 Enrollment ... has doubled(등록자가 두 배가 됐다)예요. 이것이 '달라진 것'이에요. 누가 두 배가 됐는지 눈여겨보세요. 강사가 아니라 등록한 학생이에요.\n② since 뒤가 '한 일'이에요. lectures were condensed into four-week units(강의를 넉 주짜리 단위로 압축했다)예요. 여기까지가 이 문장이 하려는 말이에요.\n③ 쉼표 뒤의 a rise는 방금 말한 「두 배가 된 것」을 한 낱말로 다시 받은 거예요. 그 뒤에 강사들이 생각하는 까닭이 덧붙어요. attribute A to B는 「A의 까닭을 B라고 보다」예요. 까닭은 요점을 받쳐 주는 말이지 요점이 아니에요.\n④ 그래서 여백에는 「강의 넉 주 단위로 압축 → 야간 과정 수강생 갑절」이라고 적으면 돼요.","tr":[["강의 넉 주 단위로 압축 → 야간 과정 강사진 갑절","doubled(두 배가 됐다)와 뒤에 나오는 instructors(강사들)를 이어 「강사가 두 배가 됐구나」 하고 읽었다면 이 보기예요. 두 배가 된 것은 문장 맨 앞의 Enrollment, 곧 등록한 학생 수예요(Enrollment in one college's evening courses has doubled). 강사들은 까닭을 말하는 사람으로 나와요."],["강의 저녁 시간대로 옮김 → 야간 과정 수강생 갑절","evening(저녁)을 보고 「강의를 저녁으로 옮겼구나」 하고 짐작했다면 이 보기예요. 야간 과정은 원래 저녁에 있었어요. 대학이 바꾼 것은 시간대가 아니라 길이예요. 강의를 넉 주짜리 단위로 압축했어요(lectures were condensed into four-week units)."],["강의 저녁 시간대로 옮김 → 야간 과정 강사진 갑절","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 대학은 시간대를 옮긴 것이 아니라 강의를 넉 주 단위로 압축했고, 두 배가 된 것은 강사가 아니라 등록한 학생이에요."],["수강생 가운데 다수 → 일하는 시간 들쭉날쭉함","문장 끝을 옮겼다면 이 보기예요. 틀린 말은 아니에요(students' irregular working hours). 하지만 그것은 강사들이 든 '까닭'의 한 부분이에요. 이 문장이 하려는 말은, 강의를 압축하자 등록자가 두 배가 됐다는 거예요."]],"dg":"a rise ~ attribute to","ko":"강의를 넉 주짜리 단위로 압축한 뒤로 한 대학 야간 과정의 등록자가 두 배가 되었다. 강사들은 짧은 단위가 수강생들의 들쭉날쭉한 근무 시간에 잘 맞기 때문이라고 본다.","voc":[["enrollment","등록(한 사람 수)"],["condense","압축하다"],["unit","단위(한 묶음)"],["attribute A to B","A의 까닭을 B라고 보다"],["suit","~에 맞다"],["irregular","들쭉날쭉한, 일정하지 않은"]]},{"id":"S1-19","k":1,"dev":"if not ~ (not이 있어도 뒤집지 않고 정도를 덧붙임)","s":"Requiring builders to submit photographs of each completed stage has largely, if not entirely, ended the payment disputes that used to delay road repairs in one city.","a":"공사 단계마다 사진 제출 → 대금 시비 거의 사라짐","why":"① 먼저 「무엇을 했더니 → 어떻게 됐다」만 남겨 보세요. 맨 앞의 긴 덩어리 Requiring builders to submit photographs of each completed stage(업체에게 단계마다 사진을 내게 한 것)가 '한 일'이고, has ... ended the payment disputes(공사비 다툼을 끝냈다)가 '달라진 것'이에요.\n② 쉼표 사이의 if not entirely는 잠깐 끼어든 말이에요. not이 보여서 「끝내지 못했다」로 읽기 쉬운데, 그렇지 않아요. largely, if not entirely는 「대부분, 어쩌면 전부」라는 뜻으로 '얼마나'를 알려 줄 뿐이에요. 이 부분을 손으로 가리고 읽어도 문장이 그대로 이어져요.\n③ 끝의 that used to delay road repairs in one city는 '어떤 다툼인지'를 꾸며 주는 말이에요. 예전에 그 다툼 때문에 도로 보수가 늦어지곤 했다는 사정일 뿐, 이 문장이 새로 알려 주는 소식은 아니에요.\n④ 그래서 여백에는 「공사 단계마다 사진 제출 → 대금 시비 거의 사라짐」이라고 적으면 돼요.","tr":[["공사 단계마다 사진 제출 → 대금 시비 줄지 않음","if not의 not을 보고 「~하지 않았다」로 읽었다면 이 보기에 끌려요. 하지만 if not entirely는 「전부는 아닐지 몰라도」라는 뜻이에요. 바로 앞의 largely(대부분)가 말해 주듯, 다툼은 크게 없어졌어요."],["공사 단계마다 대금 지급 → 대금 시비 거의 사라짐","stage(단계)와 payment(대금)가 눈에 들어와 「단계마다 돈을 줬구나」 하고 이었다면 이 보기예요. 그런데 업체가 단계마다 낸 것은 돈이 아니라 사진이에요(submit photographs of each completed stage). payment는 '무엇을 두고 다퉜는지'를 말할 때 나오는 낱말이에요."],["공사 단계마다 대금 지급 → 대금 시비 줄지 않음","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 시가 시킨 것은 돈 주기가 아니라 사진 내기이고, 다툼은 줄지 않은 것이 아니라 대부분 없어졌어요."],["대금 둘러싼 시비 → 도로 보수 늦추곤 했음","문장 맨 끝이 기억에 남아 그 부분을 옮겼다면 이 보기예요. 틀린 말은 아니에요. 다툼이 도로 보수를 늦추곤 했다는 말은 문장에 있어요(used to delay road repairs in one city). 하지만 그것은 '예전 사정'이에요. 이 문장이 하려는 말은, 사진을 내게 하자 그 다툼이 없어졌다는 거예요."]],"dg":"if not","ko":"시공 업체에게 공사를 한 단계 끝낼 때마다 사진을 내게 했더니, 한 도시의 도로 보수를 늦추곤 하던 공사비 다툼이 (전부는 아닐지 몰라도) 대부분 없어졌다.","voc":[["require A to ~","A에게 ~하라고 요구하다"],["submit","내다, 제출하다"],["completed stage","끝낸 (공사) 단계"],["largely","대부분, 크게"],["if not entirely","전부는 아닐지 몰라도"],["payment dispute","돈(대금)을 둘러싼 다툼"],["used to ~","예전에 ~하곤 했다"]]},{"id":"S1-20","k":1,"dev":"whether A or B (누구든 가리지 않음을 덧붙임)","s":"Since one local bank assigned all its customers, whether retirees or first-time borrowers, a single named adviser, repeat calls about unresolved queries have fallen markedly.","a":"고객마다 담당 상담원 지정 → 같은 일로 또 거는 전화 줆","why":"① 문장이 Since(~한 뒤로)로 시작해요. Since 뒤가 '한 일'이고, 그다음이 '달라진 것'이에요.\n② '한 일'은 assigned all its customers ... a single named adviser(모든 고객에게 전담 상담원을 한 사람씩 정해 주었다)예요. 그런데 그 사이에 whether retirees or first-time borrowers가 끼어 있어요. 「은퇴한 사람이든 처음 돈을 빌리는 사람이든」, 곧 누구든 가리지 않았다는 덧말이에요. 손으로 가리고 읽으면 앞뒤가 바로 이어져요.\n③ '달라진 것'은 repeat calls about unresolved queries have fallen markedly(풀리지 않은 문의로 다시 걸려 오는 전화가 눈에 띄게 줄었다)예요.\n④ 그래서 여백에는 「고객마다 담당 상담원 지정 → 같은 일로 또 거는 전화 줆」이라고 적으면 돼요.","tr":[["고객마다 담당 상담원 지정 → 첫 대출 고객 상담 시간 줆","first-time borrowers(처음 돈을 빌리는 사람)가 눈에 들어와 「그 사람들 상담이 빨라졌구나」 하고 이었다면 이 보기예요. 그 낱말은 '누구든 가리지 않았다'는 덧말 속에 있어요(whether retirees or first-time borrowers). 줄어든 것은 상담 시간이 아니라 다시 걸려 오는 전화예요(repeat calls about unresolved queries have fallen markedly)."],["은퇴한 고객 전용 창구 마련 → 같은 일로 또 거는 전화 줆","retirees(은퇴한 사람)를 보고 「은퇴한 고객을 따로 챙겼구나」 하고 읽었다면 이 보기예요. whether A or B는 「A든 B든」이라 어느 한쪽만이 아니에요. 은행은 모든 고객에게 상담원을 정해 주었어요(assigned all its customers ... a single named adviser)."],["은퇴한 고객 전용 창구 마련 → 첫 대출 고객 상담 시간 줆","앞쪽과 뒤쪽을 둘 다 잘못 이은 보기예요. 은행은 한 무리만이 아니라 모든 고객에게 상담원을 정해 주었고, 줄어든 것은 상담 시간이 아니라 다시 걸려 오는 전화예요."],["은퇴한 고객과 첫 대출 고객 → 양쪽에 모두 똑같이 적용","쉼표 사이에 끼어든 말을 옮겼다면 이 보기예요. 틀린 말은 아니에요(whether retirees or first-time borrowers). 하지만 그것은 '누구에게 해당하는지'예요. 이 문장이 하려는 말은, 상담원을 정해 주자 다시 걸려 오는 전화가 줄었다는 거예요."]],"dg":"whether A or B","ko":"한 동네 은행이 은퇴한 사람이든 처음 돈을 빌리는 사람이든 모든 고객에게 전담 상담원을 한 사람씩 정해 준 뒤로, 풀리지 않은 문의 때문에 다시 걸려 오는 전화가 눈에 띄게 줄었다.","voc":[["assign A B","A에게 B를 정해 주다"],["whether A or B","A든 B든"],["retiree","은퇴한 사람"],["first-time borrower","처음 돈을 빌리는 사람"],["named adviser","(이름이 정해진) 전담 상담원"],["repeat call","다시 거는 전화"],["unresolved query","풀리지 않은 문의"],["markedly","눈에 띄게"]]},{"id":"S2-1","k":2,"dev":"Granted, ~. Still, ~ (물론 ~. 그래도 ~)","s":"Granted, in many comparisons organic farms harvest less per hectare than conventional ones. Still, the gap appears to shrink considerably when growers plant several crops together in one field, a practice which tends to keep pests in check.","a":"여러 작물 섞어 심기 → 유기농 수확 격차 크게 주는 듯","why":"① 문장이 둘이에요. 첫 문장은 Granted(물론)로 시작해요. Granted는 「그건 인정할게」 하고 먼저 받아 주는 말이에요. 받아 준 내용은 유기농 농장이 같은 넓이에서 수확이 더 적다는 거예요.\n② 둘째 문장은 Still(그래도)로 시작해요. 받아 준 다음에 「그래도 내가 하려는 말은 이거야」 하고 꺼내는 자리예요. the gap appears to shrink considerably(그 격차가 크게 줄어드는 것으로 보인다)가 하려는 말이고, when growers plant several crops together in one field(한 밭에 여러 작물을 함께 심을 때)가 그 조건이에요.\n③ shrink는 「줄어들다」예요. 격차가 없어지거나 뒤집힌다는 말이 아니에요. 끝의 a practice which tends to keep pests in check(해충을 억누르는 경향이 있는 방법)은 섞어 심기에 덧붙인 설명이에요.\n④ 그래서 여백에는 「여러 작물 섞어 심기 → 유기농 수확 격차 크게 주는 듯」이라고 적으면 돼요.","tr":[["여러 작물 섞어 심기 → 유기농 수확이 관행농과 같아지는 듯","Still 뒤가 요점이라는 것까지는 맞게 잡았는데, 「격차가 줄었다」를 「격차가 없어졌다」로 한 걸음 더 읽었다면 이 보기예요. 문장은 격차가 크게 줄어드는 것으로 보인다고 했을 뿐이에요(the gap appears to shrink considerably). 같아진다는 말은 없어요."],["밭 하나에 한 작물만 → 유기농 수확 격차 크게 주는 듯","in one field(한 밭에)가 눈에 남아 「한 밭에 한 가지」로 이었다면 이 보기예요. 그런데 문장은 한 밭에 여러 작물을 함께 심는다고 했어요(plant several crops together in one field). 조건이 거꾸로예요."],["유기농 농장 → 헥타르당 수확이 관행농보다 적은 편","첫 문장을 그대로 옮겼다면 이 보기예요. 틀린 말은 아니에요. 문장도 그렇다고 받아 줘요(organic farms harvest less per hectare than conventional ones). 하지만 그것은 Granted로 '먼저 받아 준 말'이에요. 글쓴이가 하려는 말은 Still 뒤, 곧 섞어 심으면 그 격차가 크게 줄어든다는 거예요."],["여러 작물 섞어 심기 → 해충이 늘지 않게 눌러 주는 편","문장 맨 끝이 기억에 남아 그 부분을 옮겼다면 이 보기예요. 틀린 말은 아니에요. 문장에 있어요(a practice which tends to keep pests in check). 하지만 그것은 섞어 심기가 '어떤 방법인지'를 덧붙인 설명이에요. 이 글이 하려는 말은 수확 격차가 줄어든다는 거예요."]],"dg":"Granted ~ Still","ko":"물론 여러 비교에서 유기농 농장은 일반(관행) 농장보다 헥타르당 수확이 적다. 그래도 농부들이 한 밭에 여러 작물을 함께 심으면 그 격차는 크게 줄어드는 것으로 보이는데, 이 방법은 해충을 억누르는 경향이 있다.","voc":[["granted","물론, 인정하건대"],["organic farm","유기농 농장"],["conventional","일반적인, 관행의 (여기서는 농약 · 화학 비료를 쓰는 보통 농장)"],["per hectare","헥타르당 (같은 넓이마다)"],["still","그래도, 그럼에도"],["gap","격차, 차이"],["shrink considerably","크게 줄어들다"],["keep ~ in check","~을 억누르다, 늘지 못하게 하다"]]},{"id":"S2-2","k":2,"dev":"Admittedly ~; yet ~ (인정하건대 ~, 하지만 ~)","s":"Admittedly, early risers in one survey rated themselves as more productive; yet when output was measured, theirs proved virtually identical to that of late risers, who saved demanding tasks for the evening.","a":"아침형 인간 → 재 보니 성과는 저녁형과 거의 같음","why":"① 세미콜론(;)을 사이에 두고 앞뒤로 나뉘어요. 앞은 Admittedly(인정하건대)로 시작해요. 「그건 사실이야」 하고 먼저 받아 주는 말이에요. 받아 준 내용은 아침형 사람들이 '스스로' 더 생산적이라고 평가했다는 거예요. rated themselves(스스로 평가했다)라는 말을 놓치지 마세요. 실제로 그랬다는 게 아니라 본인 생각이에요.\n② 뒤는 yet(하지만)으로 시작해요. 여기서 뒤집혀요. when output was measured(성과를 재 보니), theirs proved virtually identical to that of late risers(그들의 것은 저녁형의 것과 사실상 같았다)예요. theirs는 「아침형 사람들의 성과」, that은 「성과」를 가리켜요.\n③ 끝의 who saved demanding tasks for the evening은 바로 앞의 late risers(저녁형)를 꾸며 주는 말이에요. 힘든 일을 저녁으로 아껴 둔 사람은 아침형이 아니라 저녁형이에요.\n④ 그래서 여백에는 「아침형 인간 → 재 보니 성과는 저녁형과 거의 같음」이라고 적으면 돼요.","tr":[["아침형 인간 → 재 보니 성과는 저녁형에 조금 못 미침","yet 뒤에서 뒤집힌다는 것까지는 맞게 잡았는데, 「더 낫지 않았다」를 「조금 못했다」로 읽었다면 이 보기예요. 문장은 두 무리의 성과가 사실상 같았다고 했어요(virtually identical). 아침형이 못 미쳤다는 말은 없어요."],["아침형 인간 → 어려운 일은 저녁으로 미뤄 둠","문장 끝의 demanding tasks(힘든 일)와 evening(저녁)을 문장의 주인공인 아침형에게 이었다면 이 보기예요. 그런데 who 바로 앞에 있는 말은 late risers예요. 힘든 일을 저녁으로 아껴 둔 사람은 저녁형이에요(late risers, who saved demanding tasks for the evening)."],["아침형 인간 → 재 보니 힘든 일에서만 저녁형을 앞섬","demanding tasks(힘든 일)를 보고 「힘든 일에서는 차이가 났구나」 하고 이었다면 이 보기예요. 그런데 문장은 성과를 일의 종류로 나눠 재지 않았어요. 잰 성과는 통틀어 사실상 같았고(virtually identical), 힘든 일은 저녁형이 그 일을 언제 했는지를 말할 때 나와요."],["아침형 인간 → 일찍 일어난 만큼 성과 더 높음","세미콜론 앞의 more productive(더 생산적인)를 실제 결과로 읽었다면 이 보기예요. 그런데 그것은 아침형 사람들이 스스로 매긴 평가예요(rated themselves as more productive). Admittedly로 먼저 받아 준 말이고, yet 뒤에서 실제로 재 보니 저녁형과 사실상 같았다고 해요."]],"dg":"Admittedly ~ yet","ko":"인정하건대 한 조사에서 일찍 일어나는 사람들은 자기가 더 생산적이라고 스스로 평가했다. 하지만 성과를 실제로 재 보니, 그들의 성과는 늦게 일어나는 사람들의 성과와 사실상 같았는데, 늦게 일어나는 사람들은 힘든 일을 저녁으로 아껴 두었다.","voc":[["admittedly","인정하건대, 사실"],["early riser","일찍 일어나는 사람 (아침형 인간)"],["rate oneself as ~","스스로를 ~라고 평가하다"],["productive","생산적인, 일을 많이 해내는"],["output","(해낸 일의) 성과, 결과물"],["virtually identical","사실상 똑같은"],["demanding task","힘든 일, 까다로운 일"]]},{"id":"S2-3","k":2,"dev":"For all ~ (~에도 불구하고 — all이 있어도 「모든」이 아님, 신호로 잘 안 보임)","s":"For all the warnings issued after the last eruption, most farmers in one valley returned within a year, drawn back by soil which, they claimed, the ash had enriched.","a":"골짜기 농부 대부분 → 경고에도 한 해 안에 돌아옴","why":"① 맨 앞의 For all은 「모든 ~을 위해」가 아니에요. For all + 명사는 「~에도 불구하고」라는 뜻이에요. 그러니 For all the warnings는 「그 많은 경고에도 불구하고」예요. 경고가 있었으니 보통은 「안 돌아왔겠지」 하고 짐작하게 되죠? 그 짐작과 맞서는 일이 쉼표 뒤에 나와요.\n② 쉼표 뒤가 하려는 말이에요. most farmers in one valley returned within a year(한 골짜기의 농부 대부분이 한 해 안에 돌아왔다)예요.\n③ 그 뒤의 drawn back by soil ~은 '왜 돌아왔는지'를 덧붙인 말이에요. 흙에 이끌려 돌아왔다는 거예요. 가운데 낀 they claimed(그들이 주장하기로는)도 봐 두세요. 화산재가 흙을 기름지게 했다는 것은 농부들의 말이지, 글쓴이가 사실이라고 한 것은 아니에요.\n④ 그래서 여백에는 「골짜기 농부 대부분 → 경고에도 한 해 안에 돌아옴」이라고 적으면 돼요.","tr":[["골짜기 농부 대부분 → 경고 풀린 한 해 뒤 돌아옴","warnings(경고)와 within a year(한 해 안에)를 「경고가 풀리고 나서 돌아왔구나」 하고 순하게 이었다면 이 보기예요. 그런데 문장에는 경고가 풀렸다는 말이 없어요. For all은 「~에도 불구하고」라서, 농부들은 경고가 있는데도 돌아온 거예요."],["골짜기 농부 대부분 → 경고 듣고 한 해 안에 떠남","For all the warnings를 「경고 때문에」로 읽고, 경고와 어울리는 쪽으로 이었다면 이 보기예요. 그런데 문장에서 농부들이 한 일은 떠난 것이 아니라 돌아온 것이에요(returned within a year)."],["골짜기 농부 대부분 → 경고에도 끝내 떠나지 않음","For all을 「~에도 불구하고」로 맞게 읽었는데, returned를 놓쳤다면 이 보기예요. returned는 「돌아왔다」예요. 농부들은 떠나지 않은 것이 아니라, 떠났다가 한 해 안에 돌아온 거예요(returned within a year)."],["분화 때 내린 화산재 → 골짜기 흙 기름지게 함","문장 맨 끝이 기억에 남아 그 부분을 옮겼다면 이 보기예요. 문장에 비슷한 말이 있기는 해요(the ash had enriched). 하지만 그것은 농부들이 한 말이고(they claimed), 돌아온 까닭으로 덧붙은 말이에요. 이 문장이 하려는 말은 농부들이 경고에도 돌아왔다는 거예요."]],"dg":"for all","ko":"지난번 분화 뒤에 내려진 그 많은 경고에도 불구하고, 한 골짜기의 농부 대부분은 한 해 안에 돌아왔는데, 화산재 덕분에 기름져졌다고 그들이 말하는 흙에 이끌려서였다.","voc":[["for all ~","~에도 불구하고"],["warning","경고"],["issue","(경고 · 명령을) 내리다"],["eruption","(화산) 분화"],["drawn back by ~","~에 이끌려 되돌아온"],["claim","주장하다, ~라고 말하다"],["ash","(화산)재"],["enrich","(땅을) 기름지게 하다"]]},{"id":"S2-4","k":2,"dev":"What was long dismissed as A turns out to be B (A로 넘겨 온 것이 알고 보니 B — 이음말 없음)","s":"What was long dismissed as a natural scatter of stones on one desert plateau turns out to be part of an ancient road network, which may have linked oases several days' walk apart.","a":"고원의 흩어진 돌 → 알고 보니 고대 도로망의 일부","why":"① 이 문장에는 but이나 however가 없어요. 대신 동사 두 개가 맞서요. was long dismissed as ~(오랫동안 ~로 여겨 무시됐다)와 turns out to be ~(알고 보니 ~이다)예요. 앞은 '예전에 사람들이 본 것', 뒤는 '이제 밝혀진 것'이에요.\n② 맨 앞의 What ~ plateau까지가 통째로 '무엇이'예요. 「한 사막 고원에서 자연히 흩어진 돌로 여겨져 온 것」, 곧 그 돌들이에요.\n③ 하려는 말은 turns out to be 뒤에 있어요. part of an ancient road network(고대 도로망의 일부)예요. 쉼표 뒤의 which may have linked oases ~는 그 도로망이 '어떤 길이었을지'를 덧붙인 말이에요. may have(~였을지도 모른다)라고 조심스럽게 말했어요.\n④ 그래서 여백에는 「고원의 흩어진 돌 → 알고 보니 고대 도로망의 일부」라고 적으면 돼요.","tr":[["고원의 흩어진 돌 → 알고 보니 고대 수로망의 일부","「알고 보니」 쪽이 요점이라는 것까지는 맞게 잡았는데, 문장 끝의 oases(오아시스)에서 물을 떠올려 「물길」로 이었다면 이 보기예요. 그런데 돌의 정체는 물길이 아니라 길이에요(part of an ancient road network). 오아시스는 그 길이 이어 주던 곳이에요."],["고원의 흩어진 돌 → 알고 보니 고대 성벽의 일부","ancient(고대의)와 stones(돌)만 보고 「옛 돌 구조물」로 어림했다면 이 보기예요. 그런데 문장은 무엇의 일부인지 또렷이 말해요. 성벽이 아니라 도로망이에요(part of an ancient road network)."],["고원의 흩어진 돌 → 알고 보니 오아시스 옛 마을의 일부","「알고 보니」 쪽이 요점이라는 것까지는 맞게 잡았는데, 문장 끝의 oases(오아시스)를 돌의 정체로 이었다면 이 보기예요. 그런데 돌은 오아시스의 터가 아니라 길의 일부예요(part of an ancient road network). 오아시스는 그 길이 이어 주던 곳이에요."],["고원의 흩어진 돌 → 알고 보니 자연이 흩어 놓은 것","natural scatter(자연히 흩어진 것)를 turns out to be(알고 보니) 뒤에 붙여 거꾸로 이었다면 이 보기예요. 자연히 흩어진 돌이라는 것은 오랫동안 사람들이 그렇게 여기고 넘겨 온 생각이고(long dismissed as a natural scatter of stones), 알고 보니 사람이 만든 길의 일부였어요."]],"dg":"dismissed as ~ turns out to be","ko":"한 사막 고원에서 오랫동안 자연히 흩어진 돌들로 여겨져 무시되던 것이 알고 보니 고대 도로망의 일부인데, 그 도로망은 걸어서 며칠 떨어진 오아시스들을 이어 주었을지도 모른다.","voc":[["dismiss A as B","A를 B라고 여겨 무시하다(넘겨 버리다)"],["scatter","흩어져 있는 것"],["plateau","고원 (높고 평평한 땅)"],["turn out to be ~","알고 보니 ~이다"],["ancient","고대의"],["road network","도로망 (그물처럼 이어진 길)"],["oasis (복수 oases)","오아시스"],["several days' walk apart","걸어서 며칠 걸리는 거리만큼 떨어진"]]},{"id":"S2-5","k":2,"dev":"~, or so the story goes. In fact, ~ (~라고들 한다. 실제로는 ~)","s":"Medieval townspeople rarely washed, regarding water as a source of disease, or so the story goes. In fact, records from several cities list many public bathhouses, which were apparently popular enough that local authorities regulated their opening hours.","a":"중세 도시 기록 → 공중목욕탕 많고 인기도 높았던 듯","why":"① 문장이 둘이에요. 첫 문장은 중세 사람들이 거의 씻지 않았다는 이야기예요. 그런데 맨 끝에 or so the story goes가 붙어 있어요. 「~라고들 하지」라는 뜻이에요. 글쓴이가 「이건 내 말이 아니라 떠도는 이야기야」 하고 한 발 빼는 말이에요.\n② 둘째 문장은 In fact(실제로는)로 시작해요. 떠도는 이야기와 맞서는 '실제'가 여기 나와요. records from several cities list many public bathhouses(여러 도시의 기록에 공중목욕탕이 많이 올라 있다)예요.\n③ 쉼표 뒤의 which were apparently popular enough that ~은 그 목욕탕이 얼마나 인기 있었는지를 덧붙여요. 당국이 문 여는 시간을 규제할 만큼이었다는 거예요. 규제했다는 것은 '그만큼 손님이 많았다'는 증거로 나온 말이지, 목욕탕을 닫게 했다는 말이 아니에요.\n④ 그래서 여백에는 「중세 도시 기록 → 공중목욕탕 많고 인기도 높았던 듯」이라고 적으면 돼요.","tr":[["중세 도시 기록 → 목욕탕 영업시간 규제로 문 닫은 듯","In fact 뒤가 요점이라는 것까지는 맞게 잡았는데, regulated(규제했다)를 「못 하게 막았다」로 읽었다면 이 보기예요. 그런데 규제는 목욕탕이 그만큼 인기 있었다는 증거로 나온 말이에요(popular enough that local authorities regulated their opening hours). 문을 닫았다는 말은 없어요."],["중세 도시 기록 → 당국이 공중목욕탕 직접 지은 듯","local authorities(지역 당국)와 public bathhouses(공중목욕탕)를 「당국이 지었구나」 하고 이었다면 이 보기예요. 그런데 당국이 한 일은 문 여는 시간을 정한 것뿐이에요(regulated their opening hours). 누가 지었는지는 문장에 없어요."],["중세 도시 기록 → 집집마다 목욕통 두고 씻은 듯","「목욕탕이 많았다니 집에서도 씻었겠지」 하고 한 걸음 더 나갔다면 이 보기예요. 그럴듯하지만 문장에 나오는 것은 집 안의 목욕통이 아니라 여럿이 쓰는 공중목욕탕이에요(many public bathhouses)."],["중세 도시 기록 → 물을 병으로 여겨 거의 안 씻은 듯","첫 문장을 기록의 내용으로 옮겼다면 이 보기예요. 그런데 그 문장 끝에 or so the story goes(~라고들 한다)가 붙어 있어요. 글쓴이는 그 이야기를 사실로 내세우지 않아요. 기록이 보여 주는 것은 In fact(실제로는) 뒤, 곧 공중목욕탕이 많았고 인기도 있었던 듯하다는 거예요."]],"dg":"or so the story goes ~ In fact","ko":"중세 도시 사람들은 물을 병의 근원으로 여겨 거의 씻지 않았다고들 한다. 실제로는, 여러 도시의 기록에 공중목욕탕이 많이 올라 있고, 그 목욕탕들은 지역 당국이 문 여는 시간을 규제할 만큼 인기가 있었던 듯하다.","voc":[["medieval","중세의"],["townspeople","도시 사람들"],["regard A as B","A를 B로 여기다"],["or so the story goes","~라고들 한다 (그런 이야기가 전해진다)"],["in fact","실제로는"],["public bathhouse","공중목욕탕"],["apparently","~인 듯하다, 보아하니"],["regulate","규제하다, 규칙으로 정하다"]]},{"id":"S2-6","k":2,"dev":"신호 말 없는 대조 (첫 문장 한때 퍼진 수치, 둘째 문장 나중 추정 — but/however 없이)","s":"Half an hour of video streaming, according to figures once widely shared, emitted as much carbon as driving several kilometers. Later estimates, which accounted for more efficient data centers and networks, put the figure at a small fraction of that.","a":"영상 스트리밍 탄소 → 새 추정치는 옛 수치의 작은 일부","why":"① 문장이 둘인데, but이나 however 같은 이음말이 없어요. 대신 때를 알려 주는 말 두 개가 맞서요. 첫 문장의 once(한때)와 둘째 문장의 Later(나중의)예요.\n② 첫 문장은 '한때 퍼졌던 수치'예요. 쉼표 사이의 according to figures once widely shared(한때 널리 퍼진 수치에 따르면)가 「이건 예전에 돌던 숫자야」 하고 알려 줘요. 스트리밍 30분이 몇 킬로미터 운전만큼 탄소를 낸다는 거였어요.\n③ 둘째 문장이 '나중에 다시 계산한 값'이에요. 쉼표 사이의 which ~ networks를 손으로 가리면 뼈대가 보여요. Later estimates ... put the figure at a small fraction of that(나중 추정치들은 그 수치를 그것의 작은 일부로 잡았다)이에요. 끝의 that은 첫 문장의 옛 수치를 가리켜요. 훨씬 적다는 거예요.\n④ 그래서 여백에는 「영상 스트리밍 탄소 → 새 추정치는 옛 수치의 작은 일부」라고 적으면 돼요.","tr":[["영상 스트리밍 탄소 → 새 추정치는 옛 수치의 절반 남짓","둘째 문장이 요점이고 수치가 내려갔다는 것까지는 맞게 잡았는데, 얼마나 내려갔는지를 어림했다면 이 보기예요. 문장은 절반쯤이 아니라 작은 일부라고 했어요(a small fraction of that). fraction은 「조각, 일부」예요."],["영상 스트리밍 탄소 → 새 추정치는 옛 수치를 조금 웃돎","둘째 문장의 data centers(데이터 센터)를 보고 「센터가 늘었으니 탄소도 늘었겠지」 하고 이었다면 이 보기예요. 그런데 문장은 데이터 센터가 더 효율적이 됐다고 했고(more efficient data centers and networks), 그래서 수치는 올라간 것이 아니라 작은 일부로 내려갔어요."],["영상 스트리밍 탄소 → 효율 높아져도 옛 수치와 엇비슷","more efficient(더 효율적인)까지는 읽었는데, 끝의 a small fraction of that을 흘려 읽었다면 이 보기예요. 새 추정치는 옛 수치와 비슷한 것이 아니라 그것의 작은 일부예요."],["영상 스트리밍 탄소 → 30분에 몇 km 운전만큼 내뿜음","첫 문장을 그대로 옮겼다면 이 보기예요. 그런데 그 문장 안에 once widely shared(한때 널리 퍼졌던)가 있어요. 예전에 돌던 수치라는 뜻이에요. 글쓴이가 하려는 말은 둘째 문장, 곧 나중에 다시 계산하니 그것의 작은 일부였다는 거예요."]],"dg":"once widely shared ↔ Later estimates","ko":"한때 널리 퍼진 수치에 따르면, 영상 스트리밍 30분은 차로 몇 킬로미터를 달리는 것만큼 탄소를 내보냈다. 더 효율적인 데이터 센터와 통신망을 계산에 넣은 나중의 추정치들은 그 수치를 옛 수치의 작은 일부로 잡았다.","voc":[["video streaming","영상 스트리밍 (인터넷으로 영상 보기)"],["figure","수치, 숫자"],["once widely shared","한때 널리 퍼졌던"],["emit","(가스를) 내보내다, 배출하다"],["carbon","탄소"],["estimate","추정치, 어림한 값"],["account for ~","~을 계산에 넣다"],["a small fraction of ~","~의 작은 일부"]]},{"id":"S2-7","k":2,"dev":"Paradoxically, ~ (역설적이게도 — 앞 문장의 좋은 점이 탈이 됨)","s":"Paradoxically, the very water that sustained those harvests may have hastened their decline, since the salts it carried gradually accumulated in fields that drained poorly.","a":"농사 살린 운하 물 → 소금 쌓아 쇠퇴 앞당겼을 수도","why":"① 앞 문장부터 보세요. 운하 덕분에 비가 적은 땅에서도 밀을 길렀다는, 좋은 이야기예요.\n② 이 문장은 Paradoxically(역설적이게도)로 시작해요. 「좋은 줄 알았던 그것이 거꾸로」라고 미리 알려 주는 말이에요. 뼈대는 the very water ... may have hastened their decline(바로 그 물이 그 쇠퇴를 앞당겼을지도 모른다)이에요. water 뒤의 that sustained those harvests(그 수확을 떠받치던)는 '어떤 물인지'를 꾸며 주는 말이에요. 농사를 살린 물이 농사를 기울게 했다는 거예요.\n③ 쉼표 뒤의 since는 여기서 「~ 때문에」예요. the salts it carried gradually accumulated(물이 실어 온 소금이 서서히 쌓였다)가 그 까닭이에요. it은 물이에요. may have(~했을지도 모른다)라고 조심스럽게 말한 것도 봐 두세요.\n④ 그래서 여백에는 「농사 살린 운하 물 → 소금 쌓아 쇠퇴 앞당겼을 수도」라고 적으면 돼요.","tr":[["농사 살린 운하 물 → 물 빠짐 좋게 해 수확 늘림","문장 끝의 drained(물이 빠졌다)를 보고 좋은 쪽으로 이었다면 이 보기예요. 그런데 문장은 물이 잘 빠지지 않는 밭이라고 했고(fields that drained poorly), 그 물은 수확을 늘린 것이 아니라 쇠퇴를 앞당겼을지도 몰라요(may have hastened their decline)."],["농사 살린 운하 물 → 소금 씻어 내 밭을 지켜 줌","salts(소금)를 보고 「물이 소금을 씻어 냈겠지」 하고 이었다면 이 보기예요. 거꾸로예요. 소금은 물에 실려 와서 밭에 쌓였어요(the salts it carried gradually accumulated). 그래서 Paradoxically(역설적이게도)라고 한 거예요."],["메소포타미아 운하 → 비 적은 땅에 밀농사 가능케 함","앞 문장을 그대로 옮겼다면 이 보기예요. 틀린 말은 아니에요. 앞 문장에 그대로 있어요(allowed farmers to grow wheat). 하지만 이 문장은 Paradoxically로 시작해 그 좋은 이야기를 뒤집어요. 여백에는 뒤집힌 쪽, 곧 그 물이 쇠퇴를 앞당겼을지도 모른다는 말을 적어야 해요."],["오래 이어진 가뭄 → 고대 밀농사의 쇠퇴 앞당김","「옛 농업이 무너진 까닭은 가뭄」이라는 흔한 이야기에 끌렸다면 이 보기예요. 그런데 이 글에서 쇠퇴를 앞당긴 것은 가뭄이 아니라 농사를 살리던 바로 그 물이에요(the very water that sustained those harvests). 가뭄 이야기는 글에 없어요."]],"ctx":"In parts of ancient Mesopotamia, networks of canals allowed farmers to grow wheat on land that received very little rain.","dg":"paradoxically","ko":"(앞 문장) 고대 메소포타미아의 일부 지역에서는 그물처럼 이어진 운하 덕분에 농부들이 비가 거의 오지 않는 땅에서 밀을 기를 수 있었다. (이 문장) 역설적이게도, 그 수확을 떠받치던 바로 그 물이 수확의 쇠퇴를 앞당겼을지도 모르는데, 그 물에 실려 온 소금이 물이 잘 빠지지 않는 밭에 서서히 쌓였기 때문이다.","voc":[["canal","운하, (농사용) 물길"],["paradoxically","역설적이게도 (좋을 줄 알았던 것이 거꾸로)"],["the very ~","바로 그 ~"],["sustain","떠받치다, 이어 가게 하다"],["hasten","앞당기다, 재촉하다"],["decline","쇠퇴, 기울어 감"],["accumulate","쌓이다"],["drain poorly","물이 잘 빠지지 않다"]]},{"id":"S2-8","k":2,"dev":"두 번 뒤집기 (but으로 한 번, 다시 however로 범위를 좁혀 한 번 — but 뒤가 끝이 아님)","s":"Wind turbines are often blamed for killing birds, but estimates suggest they cause far fewer deaths than glass windows or cats. For some large birds of prey, however, turbines built where those birds hunt or migrate may still pose a serious threat.","a":"풍력 발전기 → 새 덜 죽여도 일부 큰 맹금류엔 위협일 수도","why":"① 이 글은 두 번 꺾여요. 첫 문장 안에 but이 있고, 둘째 문장 안에 however가 있어요. 「but 뒤가 답」이라고 외워 두었다면 첫 문장에서 멈추게 되는데, 글은 거기서 끝나지 않아요.\n② 첫 문장: 발전기가 새를 죽인다고 비난받는다(남들 말) → but → 추정치로는 유리창이나 고양이보다 훨씬 덜 죽인다(they cause far fewer deaths than glass windows or cats). 여기까지 읽으면 「별로 해롭지 않네」가 돼요.\n③ 둘째 문장: 가운데 낀 however(그러나)가 그 말에 단서를 달아요. For some large birds of prey(일부 큰 맹금류에게는)라고 범위를 정하고, turbines ... may still pose a serious threat(발전기가 여전히 심각한 위협이 될 수 있다)고 해요. still(여전히)은 「앞에서 덜 해롭다고 했지만 그래도」라는 뜻이에요. may(~일 수 있다)라고 조심스럽게 말한 것도 봐 두세요.\n④ 이렇게 두 번 꺾이는 글은 앞의 것을 버리지 말고 둘을 이어서 적으면 돼요. 「덜 죽이기는 한다, 그래도 일부에게는 위협일 수 있다」예요. 그래서 여백에는 「풍력 발전기 → 새 덜 죽여도 일부 큰 맹금류엔 위협일 수도」라고 적으면 돼요.","tr":[["풍력 발전기 → 새 덜 죽여도 일부 철새 무리엔 위협일 수도","두 번 꺾인다는 것까지는 맞게 잡았는데, 둘째 문장의 migrate(이동하다)를 보고 위협받는 새를 「철새」로 이었다면 이 보기예요. 문장이 짚은 새는 일부 큰 맹금류예요(For some large birds of prey). migrate는 그 맹금류가 지나다니는 곳을 말할 때 나와요."],["풍력 발전기 → 새 덜 죽이고 큰 맹금류에도 위협 안 될 듯","첫 문장의 「훨씬 덜 죽인다」를 둘째 문장까지 밀고 갔다면 이 보기예요. 그런데 둘째 문장은 however로 꺾여요. 일부 큰 맹금류에게는 여전히 심각한 위협이 될 수 있다고 해요(may still pose a serious threat)."],["풍력 발전기 → 유리창·고양이보다 새 훨씬 덜 죽이는 듯","「but 뒤가 답」이라고 읽고 첫 문장에서 멈췄다면 이 보기예요. 틀린 말은 아니에요. 문장에 있어요(far fewer deaths than glass windows or cats). 하지만 글의 절반이에요. 둘째 문장이 however로 단서를 다니, 그 단서까지 담아야 이 글을 다 줄인 거예요."],["풍력 발전기 → 유리창·고양이보다 새 훨씬 많이 죽이는 듯","글 첫머리의 blamed for killing birds(새를 죽인다고 비난받는)를 글의 결론으로 읽었다면 이 보기예요. 그런데 그것은 남들이 하는 비난이고, 바로 뒤 but에서 추정치로는 유리창이나 고양이보다 훨씬 적다고 해요(far fewer deaths than glass windows or cats). 많다는 것이 아니라 적다는 거예요."]],"dg":"but ~ however","ko":"풍력 발전기는 새를 죽인다는 비난을 자주 받지만, 추정치를 보면 유리창이나 고양이보다 훨씬 적은 죽음을 일으킨다. 그러나 일부 큰 맹금류에게는, 그 새들이 사냥하거나 이동하는 곳에 세워진 발전기가 여전히 심각한 위협이 될 수 있다.","voc":[["wind turbine","풍력 발전기"],["be blamed for ~","~했다고 비난받다"],["estimate","추정치, 어림한 값"],["bird of prey","맹금류 (매 · 독수리처럼 사냥하는 새)"],["migrate","(철 따라) 이동하다"],["still","여전히"],["pose a threat","위협이 되다"]]},{"id":"S2-9","k":2,"dev":"It is true that ~ — and ~ (뒤에 but이 오지 않음: 받아 준 말을 뒤집지 않고 더 밀고 나감)","s":"It is true that pesticides can harm honeybees — and the harm may be greatest when the chemicals reach colonies whose defenses have already been weakened by parasitic mites and poor nutrition.","a":"농약의 꿀벌 피해 → 이미 약해진 무리에서 가장 클 수도","why":"① It is true that ~(~은 사실이다)으로 시작해요. 이 말 뒤에는 보통 but이 와서 「사실이긴 하지만…」 하고 뒤집죠? 그래서 「뒤에서 뒤집히겠구나」 하고 기다리게 돼요.\n② 그런데 줄표(—) 뒤에 온 말은 but이 아니라 and(그리고)예요. 뒤집지 않고 같은 쪽으로 한 걸음 더 나가요. 「해를 끼친다. 그리고 그 해는 이럴 때 가장 크다」예요.\n③ 그러니 하려는 말은 and 뒤에 있어요. the harm may be greatest when ~(그 해는 ~할 때 가장 클지도 모른다)이고, 그때란 농약이 '이미 약해진 벌 무리'에 닿을 때예요. colonies whose defenses have already been weakened(방어력이 이미 약해진 무리)예요. 끝의 by parasitic mites and poor nutrition(기생 진드기와 영양 부족 때문에)은 '무엇 때문에 약해졌는지'예요. 진드기 탓이 농약 탓보다 크다는 말이 아니에요.\n④ 그래서 여백에는 「농약의 꿀벌 피해 → 이미 약해진 무리에서 가장 클 수도」라고 적으면 돼요.","tr":[["농약의 꿀벌 피해 → 실제로는 진드기 탓이 훨씬 클 수도","It is true that을 보고 「사실이긴 하지만, 진짜 범인은 따로 있다」로 뒤집어 읽었다면 이 보기예요. 그런데 줄표 뒤는 but이 아니라 and예요. 농약의 해를 깎아내리는 것이 아니라, 그 해가 언제 가장 큰지를 말해요. 진드기는 벌 무리를 미리 약하게 만든 것으로 나올 뿐이에요."],["농약의 꿀벌 피해 → 영양 좋은 무리에서 가장 클 수도","nutrition(영양)과 greatest(가장 큰)를 이었는데 poor(부족한)를 놓쳤다면 이 보기예요. 문장에서 해가 가장 큰 곳은 영양이 부족해 이미 약해진 무리예요(weakened by parasitic mites and poor nutrition)."],["농약의 꿀벌 피해 → 사실이라 해도 걱정할 수준 아닐 수도","It is true that 뒤에는 늘 「하지만 별것 아니다」가 온다고 짐작했다면 이 보기예요. 그런데 이 문장은 뒤집지 않아요. and 뒤에서 오히려 그 해가 가장 클 때를 말해요(the harm may be greatest). 걱정할 것 없다는 말은 어디에도 없어요."],["기생 진드기와 영양 부족 → 벌 무리의 방어력 약화","문장 맨 끝이 기억에 남아 그 부분을 옮겼다면 이 보기예요. 틀린 말은 아니에요. 문장에 있어요(weakened by parasitic mites and poor nutrition). 하지만 그것은 '어떤 무리인지'를 꾸며 주는 말이에요. 이 문장이 하려는 말은, 농약의 해가 그런 무리에서 가장 클지도 모른다는 거예요."]],"dg":"It is true that ~ and","ko":"농약이 꿀벌에게 해를 끼칠 수 있다는 것은 사실이다. 그리고 그 해는, 기생 진드기와 영양 부족 때문에 방어력이 이미 약해진 벌 무리에 그 화학 물질이 닿을 때 가장 클지도 모른다.","voc":[["pesticide","농약, 살충제"],["harm","해를 끼치다; 해, 피해"],["chemical","화학 물질 (여기서는 농약)"],["colony","(벌 · 개미의) 무리, 집단"],["defenses","방어력, 스스로 지키는 힘"],["parasitic mite","기생 진드기 (벌에 붙어 사는 진드기)"],["nutrition","영양"]]},{"id":"S2-10","k":2,"dev":"Even if ~, ~ (설령 ~라 해도 — 받아 준 뒤 주절에서 맞섬)","s":"Even if daylight saving time trims evening lighting use slightly, some regional studies suggest that this saving is largely offset by greater demand for heating and air conditioning.","a":"서머타임의 조명 절약 → 냉난방 수요 늘어 대부분 상쇄되는 듯","why":"① 쉼표를 사이에 두고 두 덩어리로 나뉘어요. 앞 덩어리는 Even if(설령 ~라 해도)로 시작해요. 「그렇다고 쳐도」 하고 먼저 받아 주는 말이에요. 받아 준 내용은 서머타임이 저녁 조명 사용을 조금 줄인다는 거예요. slightly(조금)라는 말도 봐 두세요.\n② 쉼표 뒤가 하려는 말이에요. some regional studies suggest that ~(몇몇 지역 연구는 ~라고 시사한다)이 뼈대이고, 알맹이는 this saving is largely offset(이 절약분은 대부분 상쇄된다)예요. offset은 낯설지만 「더한 만큼 빼서 없던 것으로 만든다」는 뜻이에요.\n③ 무엇이 상쇄하느냐 하면 by greater demand for heating and air conditioning(난방과 냉방 수요가 더 늘어나서)예요. 조명에서 아낀 전기를 냉난방이 도로 써 버린다는 거예요. largely(대부분)이니 「전기를 오히려 훨씬 더 쓴다」까지 간 것은 아니에요.\n④ 그래서 여백에는 「서머타임의 조명 절약 → 냉난방 수요 늘어 대부분 상쇄되는 듯」라고 적으면 돼요.","tr":[["서머타임의 조명 절약 → 냉난방 절약과 더해져 더욱 커지는 듯","saving(절약)과 heating and air conditioning(난방과 냉방)을 같은 쪽으로 이었다면 이 보기예요. 그런데 냉난방은 아끼는 쪽이 아니라 더 쓰는 쪽이에요(greater demand for heating and air conditioning). 그래서 절약이 커지는 것이 아니라 상쇄돼요."],["서머타임의 조명 절약 → 냉난방 늘어 전기 사용 조금 늘어난 듯","쉼표 뒤가 요점이라는 것까지는 맞게 잡았는데, 「상쇄된다」를 「결국 더 쓰게 된다」로 한 걸음 더 읽었다면 이 보기예요. 문장은 아낀 것이 대부분 없던 일이 된다고 했을 뿐이에요(this saving is largely offset). 전체 사용이 늘었다는 말은 없어요."],["서머타임의 조명 절약 → 지역마다 달라 가려내기 어려운 듯","regional(지역의)을 보고 「지역마다 다르다는 말이구나」 하고 이었다면 이 보기예요. 그런데 regional studies는 '어느 지역을 조사한 연구'라는 뜻일 뿐이에요. 그 연구들이 내놓은 말은 「알기 어렵다」가 아니라 「대부분 상쇄된다」예요."],["서머타임의 조명 절약 → 적어도 그만큼은 전기를 아껴 주는 듯","쉼표 앞의 「조명 사용을 조금 줄인다」를 글의 결론으로 읽었다면 이 보기예요. 문장도 그럴 수 있다고 받아 주기는 해요(trims evening lighting use slightly). 하지만 Even if는 「설령 그렇다 해도」예요. 글쓴이가 하려는 말은 쉼표 뒤, 곧 그 절약이 냉난방 때문에 대부분 상쇄된다는 거예요. 그만큼 고스란히 남는 것이 아니에요."]],"dg":"even if","ko":"설령 서머타임이 저녁 조명 사용을 조금 줄여 준다 해도, 몇몇 지역 연구는 이 절약분이 난방과 냉방 수요가 늘어나는 것으로 대부분 상쇄된다고 시사한다.","voc":[["even if ~","설령 ~라 해도"],["daylight saving time","서머타임 (여름에 시계를 한 시간 앞당기는 제도)"],["trim","조금 줄이다, 깎다"],["regional study","(어느) 지역을 대상으로 한 연구"],["saving","절약한 것, 절약분"],["largely","대부분, 크게"],["offset","상쇄하다 (더하고 빼서 없던 것으로 만들다)"],["demand","수요, 쓰려는 양"]]},{"id":"S2-11","k":2,"dev":"ostensibly ~; in effect ~ (겉으로 내세운 뜻 ↔ 실제로 벌어진 일)","s":"A rule restricting street vendors to four hours a day was ostensibly meant to ease sidewalk crowding; in effect, it has squeezed the same vendors into the busiest lunchtime hours.","a":"노점 영업시간 제한 → 가장 붐비는 점심때로 노점 몰림","why":"① 세미콜론(;)을 사이에 두고 앞뒤로 나뉘어요. but은 없지만, 낱말 두 개가 맞서요. 앞의 ostensibly(겉으로는)와 뒤의 in effect(실제로는)예요.\n② 앞은 '내세운 뜻'이에요. 규칙는 인도의 혼잡을 덜려고 만든 것이었다(was ostensibly meant to ease sidewalk crowding)고 해요. ostensibly가 붙으면 「말은 그렇게 했지만」이라는 뜻이 깔려요.\n③ 뒤가 '실제로 벌어진 일'이에요. it has squeezed the same vendors into the busiest lunchtime hours, 곧 같은 노점상들을 가장 붐비는 점심시간대로 몰아넣었어요. the same(같은)이라는 말을 보세요. 노점상 수가 줄었다는 말이 아니라, 그 사람들이 한 시간대에 몰렸다는 거예요.\n④ 그래서 여백에는 「노점 영업시간 제한 → 가장 붐비는 점심때로 노점 몰림」이라고 적으면 돼요.","tr":[["노점 영업시간 제한 → 붐비는 점심때 노점 수 크게 줄임","in effect 뒤가 요점이라는 것까지는 맞게 잡았는데, 「제한했으니 줄었겠지」 하고 이었다면 이 보기예요. 그런데 문장은 같은 노점상들이 점심시간대로 몰렸다고 했어요(squeezed the same vendors into the busiest lunchtime hours). 줄어든 것이 아니라 한데 몰린 거예요."],["노점 영업시간 제한 → 노점이 하루 내내 고르게 흩어짐","four hours(네 시간)를 보고 「시간을 나눠 흩어졌구나」 하고 이었다면 이 보기예요. 거꾸로예요. 노점상들은 흩어진 것이 아니라 가장 붐비는 시간대로 몰렸어요(into the busiest lunchtime hours)."],["노점 영업시간 제한 → 노점을 한산한 오후 시간대로 옮김","in effect 뒤가 요점이고 노점이 어느 시간대로 옮겨 갔다는 것까지는 맞게 잡았는데, 어느 시간대인지를 놓쳤다면 이 보기예요. 한산한 오후가 아니라 가장 붐비는 점심시간대예요(into the busiest lunchtime hours)."],["노점 영업시간 제한 → 인도 혼잡을 눈에 띄게 덜어 줌","세미콜론 앞의 ease sidewalk crowding(인도 혼잡을 덜다)을 실제 결과로 읽었다면 이 보기예요. 그런데 그 앞에 ostensibly(겉으로는)와 meant to(~하려던)가 있어요. 그것은 '내세운 뜻'이에요. 실제로는(in effect) 노점상들이 가장 붐비는 시간대로 몰렸어요."]],"dg":"ostensibly ~ in effect","ko":"노점상의 영업을 하루 네 시간으로 제한한 규칙은 겉으로는 인도의 혼잡을 덜려는 것이었다. 실제로는, 그 규칙이 같은 노점상들을 가장 붐비는 점심시간대로 몰아넣었다.","voc":[["restrict A to B","A를 B로 제한하다"],["street vendor","노점상"],["ostensibly","겉으로는, 내세우기로는"],["be meant to ~","~하려는 것이다, ~하도록 만든 것이다"],["ease","덜다, 누그러뜨리다"],["sidewalk crowding","인도(보도)의 혼잡"],["in effect","실제로는, 사실상"],["squeeze A into B","A를 B 안으로 몰아넣다(욱여넣다)"]]},{"id":"S2-12","k":2,"dev":"남의 경고 속 still (still이 요점 쪽이 아니라 빗나간 경고 안에 있음)","s":"Engineers who had warned that a patched-up, century-old seawall would still give way within a decade have since watched it outlast two newer barriers built alongside it.","a":"백 년 된 방파제 → 옆의 새 방벽 둘보다 오래 버팀","why":"① 문장이 길지만 뼈대는 짧아요. Engineers ... have since watched it outlast two newer barriers(기술자들은 그 뒤로 그것이 더 새로운 방벽 둘보다 오래 버티는 것을 지켜보았다)예요. it은 방파제예요.\n② Engineers 바로 뒤의 who had warned that ~ within a decade는 '어떤 기술자들인지'를 꾸며 주는 말이에요. 「십 년 안에 무너질 거라고 경고했던」 기술자들이에요. had warned(경고했었다)라고 더 옛날 일로 말한 것을 보세요. 예전에 한 말이에요.\n③ 그 경고 안에 still(그래도)이 있어요. 「때워도 그래도 무너진다」는 뜻이에요. still이 눈에 띄지만, 이것은 빗나간 경고 속의 말이에요. 실제로 일어난 일은 since(그 뒤로) 다음에 나와요. 방파제는 지금까지 무너지지 않았고, 오히려 새 방벽 둘보다 오래 갔어요.\n④ 그래서 여백에는 「백 년 된 방파제 → 옆의 새 방벽 둘보다 오래 버팀」이라고 적으면 돼요.","tr":[["백 년 된 방파제 → 옆의 새 방벽 둘 덕분에 겨우 버팀","alongside(옆에 나란히)를 보고 「새 방벽이 받쳐 줬구나」 하고 이었다면 이 보기예요. 그런데 outlast는 「~보다 오래 버티다」예요. 새 방벽 덕을 본 것이 아니라, 새 방벽보다 방파제가 더 오래 갔어요(outlast two newer barriers)."],["백 년 된 방파제 → 십 년 만에 새 방벽 둘로 교체됨","decade(십 년)와 newer barriers(더 새로운 방벽)를 「십 년 뒤 새것으로 바꿨구나」 하고 이었다면 이 보기예요. 그런데 방파제는 바뀌지 않았어요. 새 방벽은 옆에 따로 지은 것이고(built alongside it), 방파제가 그것들보다 오래 버텼어요."],["백 년 된 방파제 → 옆의 새 방벽 둘과 비슷하게 버팀","since 뒤가 실제라는 것까지는 맞게 잡았는데, outlast를 「함께 버티다」쯤으로 어림했다면 이 보기예요. outlast는 out(~보다 더) + last(오래 가다), 곧 「~보다 오래 버티다」예요. 방파제는 새 방벽 둘과 비슷했던 것이 아니라 그것들보다 오래 갔어요(outlast two newer barriers)."],["백 년 된 방파제 → 십 년을 못 넘기고 무너져 버림","still(그래도) 뒤의 give way within a decade(십 년 안에 무너진다)를 실제로 일어난 일로 읽었다면 이 보기예요. 그런데 그것은 기술자들이 예전에 한 경고예요(had warned that). 실제로는 무너지지 않고 새 방벽 둘보다 오래 버텼어요."]],"dg":"warned that ~ would still ~","ko":"여기저기 때운 백 년 된 방파제가 그래도 십 년 안에 무너질 것이라고 경고했던 기술자들은, 그 뒤로 그 방파제가 옆에 나란히 지은 더 새로운 방벽 둘보다 오래 버티는 것을 지켜보았다.","voc":[["warn","경고하다"],["patched-up","여기저기 때운(땜질한)"],["century-old","백 년 된"],["seawall","방파제"],["give way","무너지다, 버티지 못하다"],["within a decade","십 년 안에"],["outlast","~보다 오래 가다(버티다)"],["alongside","~ 옆에 나란히"]]},{"id":"S2-13","k":2,"dev":"Expected to ~, X has ~ (맨 앞 덩어리가 남들 예상 — 이음말 없음)","s":"Expected to drain customers from nearby bookstores, the reading room one publisher opened beside its warehouse has instead sent visitors to those shops with lists of titles to buy.","a":"출판사 열람실 → 방문객을 근처 서점 손님으로 보냄","why":"① 문장이 Expected to ~(~할 것으로 예상된)로 시작해요. 맨 앞 쉼표까지의 덩어리는 '남들이 예상한 것'이에요. 열람실이 근처 서점의 손님을 빼 갈 거라는 예상이에요. 「예상은 이랬다」로 시작하면 뒤에 「실제는 달랐다」가 오기 쉬워요.\n② 쉼표 뒤가 실제로 일어난 일이에요. '무엇이'는 the reading room(열람실)이에요. 그 뒤의 one publisher opened beside its warehouse(한 출판사가 창고 옆에 연)는 '어떤 열람실인지'를 꾸며 주는 말이에요.\n③ '어떻게 했다'는 has instead sent visitors to those shops(오히려 방문객을 그 가게들로 보냈다)예요. instead(오히려)가 「예상과 달리」라고 알려 줘요. those shops는 앞에 나온 nearby bookstores(근처 서점들)를 가리켜요. 손님을 빼 가기는커녕 보내 준 거예요. with lists of titles to buy(살 책 목록을 들고)는 그 방문객들의 모습이에요. 책을 살 곳은 열람실이 아니라 서점이에요.\n④ 그래서 여백에는 「출판사 열람실 → 방문객을 근처 서점 손님으로 보냄」이라고 적으면 돼요.","tr":[["출판사 열람실 → 방문객에게 책 목록대로 직접 판매","lists of titles to buy(살 책 목록)를 보고 「열람실에서 책을 팔았구나」 하고 이었다면 이 보기예요. 그런데 방문객들은 그 목록을 들고 서점으로 갔어요(sent visitors to those shops). 책을 살 곳은 열람실이 아니라 근처 서점이에요."],["출판사 열람실 → 창고 옆이라 찾는 방문객이 드묾","beside its warehouse(창고 옆에)를 보고 「외진 곳이라 손님이 없겠네」 하고 이었다면 이 보기예요. 그런데 문장에는 방문객이 적다는 말이 없어요. 오히려 방문객들이 서점으로 이어졌다고 해요."],["출판사 열람실 → 근처 서점 책을 빌려다 진열함","bookstores(서점)와 titles(책)를 「서점 책을 가져다 놓았구나」 하고 이었다면 이 보기예요. 그런데 문장에서 서점 쪽으로 간 것은 책이 아니라 방문객이에요(sent visitors to those shops). 열람실이 서점 책을 빌렸다는 말은 없어요."],["출판사 열람실 → 근처 서점 손님을 조금씩 빼 감","앞머리의 drain customers(손님을 빼 가다)를 실제로 일어난 일로 읽었다면 이 보기예요. 그런데 그것은 예상이에요(Expected to drain customers from nearby bookstores). 실제로는 instead(오히려), 방문객을 그 서점들로 보냈어요."]],"dg":"Expected to ~","ko":"근처 서점들에서 손님을 빼 갈 것으로 예상되었지만, 한 출판사가 창고 옆에 연 열람실은 오히려 방문객들이 살 책의 목록을 들고 그 서점들로 가게 만들었다.","voc":[["be expected to ~","~할 것으로 예상되다"],["drain A from B","B에서 A를 빼 가다"],["reading room","열람실 (책을 읽는 방)"],["publisher","출판사"],["warehouse","창고"],["instead","(그러기는커녕) 오히려, 그 대신"],["send A to B","A를 B로 보내다"],["title","(책) 제목, 책 한 종"]]},{"id":"S2-14","k":2,"dev":"but a fraction (but이 「그러나」가 아니라 「겨우 ~뿐」)","s":"The designers of one banking app assumed retirees would be but a fraction of its users. Within a year, people over sixty-five accounted for most of its daily logins.","a":"은행 앱 → 한 해 만에 65세 넘는 이가 접속의 대부분","why":"① 문장이 둘이에요. 첫 문장의 동사는 assumed(짐작했다)예요. 그러니 첫 문장은 통째로 '설계자들의 짐작'이에요.\n② 첫 문장 안의 but을 조심하세요. 여기서 but은 「그러나」가 아니에요. would be but a fraction은 「겨우 작은 일부일 뿐일 것이다」예요. but을 only로 바꿔 읽으면 돼요. 그러니 but 뒤의 a fraction of its users(이용자의 작은 일부)는 요점이 아니라 짐작의 내용이에요.\n③ 둘째 문장에는 이음말이 없지만, 여기가 '실제로 일어난 일'이에요. Within a year(한 해 안에), people over sixty-five accounted for most of its daily logins(예순다섯 살 넘은 사람들이 날마다의 접속 대부분을 차지했다)예요. 작은 일부일 거라던 사람들이 대부분이 된 거예요.\n④ 그래서 여백에는 「은행 앱 → 한 해 만에 65세 넘는 이가 접속의 대부분」이라고 적으면 돼요.","tr":[["은행 앱 → 한 해 만에 65세 넘는 이용자가 거의 떠남","둘째 문장이 요점이라는 것까지는 맞게 잡았는데, 「나이 든 사람은 앱을 어려워하지」 하는 생각으로 이었다면 이 보기예요. 거꾸로예요. 예순다섯 살 넘은 사람들은 떠난 것이 아니라 접속의 대부분을 차지했어요(accounted for most of its daily logins)."],["은행 앱 → 한 해 만에 날마다 접속하는 이가 드물어짐","daily logins(날마다의 접속)와 Within a year(한 해 안에)를 이었는데 most(대부분)를 놓쳤다면 이 보기예요. 문장은 접속이 줄었다고 하지 않았어요. 접속 가운데 누가 대부분을 차지했는지를 말해요."],["은행 앱 → 한 해 만에 은퇴자용 화면을 따로 내놓음","retirees(은퇴자)와 designers(설계자)를 「은퇴자를 위해 새로 만들었구나」 하고 이었다면 이 보기예요. 그런데 문장에는 앱을 고쳤다는 말이 없어요. 한 해 안에 달라진 것은 누가 접속하느냐예요(people over sixty-five accounted for most of its daily logins)."],["은행 앱 → 은퇴자는 이용자의 작은 일부에 그치고 맒","but을 「그러나」로 읽고 그 뒤 a fraction of its users(이용자의 작은 일부)를 요점으로 잡았다면 이 보기예요. 그런데 여기서 but은 「겨우 ~뿐」이고, 그 말은 설계자들의 짐작 안에 있어요(assumed retirees would be but a fraction of its users). 실제로는 둘째 문장처럼 접속의 대부분을 차지했어요."]],"dg":"but a fraction","ko":"한 은행 앱의 설계자들은 은퇴자가 이용자 가운데 아주 작은 일부에 지나지 않을 것이라고 짐작했다. 한 해도 안 되어, 예순다섯 살이 넘은 사람들이 날마다의 접속 가운데 대부분을 차지했다.","voc":[["designer","설계자, 만든 사람"],["assume","(당연히 그럴 거라고) 짐작하다"],["retiree","은퇴자"],["but a fraction","겨우 작은 일부일 뿐 (여기서 but = only)"],["within a year","한 해 안에"],["account for ~","~을 차지하다"],["daily login","날마다의 접속(로그인)"]]},{"id":"S2-15","k":2,"dev":"X sits uneasily with the notion that ~ (요점이 앞 · 통념이 뒤 — 이음말 없음)","s":"One county's records show clinic visits rising after a highway reached town, a pattern that sits uneasily with the notion that rural clinics lose patients once such roads arrive.","a":"고속도로 뚫린 뒤 시골 의원 → 찾는 환자 도리어 늘어남","why":"① 이 문장은 하려는 말이 앞에 있어요. 쉼표 앞을 보세요. One county's records show clinic visits rising after a highway reached town(한 군의 기록은 고속도로가 마을에 닿은 뒤 의원 방문이 늘어났음을 보여 준다)이에요. 기록이 보여 주는 '실제'예요.\n② 쉼표 뒤의 a pattern that ~은 앞에서 말한 것을 「이런 흐름」이라고 받아서 한마디 덧붙여요. sits uneasily with ~는 「~와 불편하게 놓인다」, 쉽게 말해 「~와 잘 맞지 않는다」예요. but은 없지만 여기서 기록과 생각이 맞서요.\n③ 무엇과 맞지 않느냐 하면 the notion that rural clinics lose patients once such roads arrive(그런 도로가 들어오면 시골 의원이 환자를 잃는다는 생각)예요. The notion that ~은 「~라는 생각」이에요. 문장 맨 끝에 있고 사실처럼 쓰여 있지만 '사람들의 생각'일 뿐이에요. 한 군의 기록에서는 환자를 잃기는커녕 찾아오는 환자가 늘었어요.\n④ 문장 끝에 온 말이 늘 요점은 아니에요. 그래서 여백에는 「고속도로 뚫린 뒤 시골 의원 → 찾는 환자 도리어 늘어남」이라고 적으면 돼요.","tr":[["고속도로 뚫린 뒤 시골 의원 → 찾는 환자 수 전과 다름없음","「환자를 잃는다는 생각과 맞지 않는다」는 것까지는 맞게 잡았는데, 「그럼 그대로였겠지」 하고 멈췄다면 이 보기예요. 기록은 그대로가 아니라 늘었다고 해요(clinic visits rising after a highway reached town)."],["고속도로 뚫린 뒤 시골 의원 → 찾는 환자 늘다가 도로 줄어듦","rising(늘어나는)과 lose patients(환자를 잃다)를 차례대로 「늘었다가 잃었다」로 이었다면 이 보기예요. 그런데 환자를 잃는다는 것은 나중에 일어난 일이 아니라 사람들의 생각이에요(the notion that rural clinics lose patients). 기록에는 늘었다는 것만 있어요."],["고속도로 뚫린 뒤 시골 의원 → 군의 진료 기록 더 꼼꼼해짐","records(기록)를 보고 「기록이 달라졌다는 말이구나」 하고 이었다면 이 보기예요. 그런데 기록은 달라진 대상이 아니라 증거예요. 그 기록이 보여 주는 것은 방문이 늘었다는 거예요(records show clinic visits rising)."],["고속도로 뚫린 뒤 시골 의원 → 환자가 큰 도시로 빠져나감","문장 끝의 lose patients(환자를 잃는다)를 실제로 일어난 일로 읽었다면 이 보기예요. 그런데 그것은 the notion(생각)의 내용이고, 문장은 기록이 그 생각과 맞지 않는다고 해요(sits uneasily with the notion). 큰 도시 이야기는 문장에 없어요."]],"dg":"sits uneasily with the notion that","ko":"한 군(郡)의 기록은 고속도로가 마을에 닿은 뒤 의원 방문이 늘어났음을 보여 주는데, 이런 흐름은 그런 도로가 들어오면 시골 의원이 환자를 잃는다는 생각과 잘 맞지 않는다.","voc":[["county","군(郡) — 미국의 행정 구역"],["records","기록"],["clinic visit","의원 방문 (환자가 의원을 찾아옴)"],["highway","고속도로"],["pattern","흐름, 되풀이되는 모습"],["sit uneasily with ~","~와 잘 맞지 않다 (불편하게 놓이다)"],["notion","생각, 통념"],["once ~","일단 ~하면"]]},{"id":"S2-16","k":2,"dev":"Even so 뒤가 요점이 아님 (Even so 뒤는 「그래도 해 봤다」 — 요점은 그다음 and 뒤 결과)","s":"Tutors at one writing center feared that sharing model essays would breed imitation. Even so, they tried it, and the drafts students later submitted varied more widely than before.","a":"모범 글 보여 주기 → 학생 초고 전보다 더 다양해짐","why":"① 문장이 둘이에요. 첫 문장의 동사는 feared(걱정했다)예요. 모범 글을 보여 주면 베끼기가 생길 거라는 '걱정'이에요. 아직 일어난 일이 아니에요.\n② 둘째 문장은 Even so(그래도)로 시작해요. 「Even so 뒤가 답」이라고 생각하기 쉬운데, 바로 뒤에 온 말은 they tried it(그들은 그것을 해 보았다)이에요. 걱정했지만 해 봤다는 말이지, 아직 결과가 아니에요.\n③ 결과는 그다음 and 뒤에 있어요. the drafts students later submitted varied more widely than before(학생들이 나중에 낸 초고는 전보다 더 폭넓게 달랐다)예요. vary는 「서로 다르다」예요. 베껴서 비슷해질 거라던 걱정과 달리, 글들이 더 다양해진 거예요. later(나중에)는 초고를 '언제' 냈는지일 뿐, 늦게 냈다는 뜻이 아니에요.\n④ 그래서 여백에는 「모범 글 보여 주기 → 학생 초고 전보다 더 다양해짐」이라고 적으면 돼요.","tr":[["모범 글 보여 주기 → 학생 초고 전보다 더 늦게 들어옴","later submitted(나중에 낸)를 보고 「늦게 냈구나」 하고 이었다면 이 보기예요. 그런데 later는 모범 글을 본 '그 뒤에' 냈다는 뜻이에요. 달라진 것은 내는 때가 아니라 글이 얼마나 서로 다른지예요(varied more widely than before)."],["모범 글 보여 주기 → 학생 초고 전보다 더 널리 읽힘","more widely(더 널리)만 보고 「널리 퍼졌구나」 하고 이었다면 이 보기예요. 그런데 widely는 varied(서로 달랐다)에 붙은 말이에요. varied more widely는 「더 폭넓게 달랐다」, 곧 더 다양했다는 뜻이에요."],["모범 글 보여 주기 → 학생 초고 전보다 더 길어짐","more ... than before(전보다 더)까지는 읽었는데, 무엇이 「더」인지를 어림했다면 이 보기예요. 문장이 말한 것은 길이가 아니라 글들이 서로 얼마나 다른지예요(varied more widely than before)."],["모범 글 보여 주기 → 학생 초고 서로 비슷비슷해짐","첫 문장의 breed imitation(베끼기를 낳다)을 실제로 일어난 일로 읽었다면 이 보기예요. 그런데 그것은 교사들의 걱정이에요(feared that sharing model essays would breed imitation). 실제로 나온 초고는 전보다 더 다양했어요."]],"dg":"Even so ~ and","ko":"한 글쓰기 센터의 지도 교사들은 모범 글을 보여 주면 베끼기가 생길까 걱정했다. 그래도 그들은 그것을 해 보았고, 학생들이 나중에 낸 초고는 전보다 훨씬 다양했다.","voc":[["tutor","지도 교사"],["fear that ~","~할까 걱정하다"],["model essay","모범 글"],["breed","(나쁜 것을) 낳다, 생기게 하다"],["imitation","베끼기, 흉내"],["even so","그래도, 그렇기는 해도"],["draft","초고 (처음 쓴 글)"],["vary widely","폭넓게 서로 다르다"]]},{"id":"S2-17","k":2,"dev":"Billed as ~, X now ~ (내세운 이름 ↔ 지금 실제 쓰임 — 이음말 없음)","s":"Billed as a shortcut for commuters, the tunnel one city bored under its harbor now carries mostly delivery trucks, which use it to avoid weight limits on the bridges.","a":"항구 밑 터널 → 지금은 주로 배달 트럭이 다니는 길","why":"① 문장이 Billed as ~(~라고 홍보된)로 시작해요. 맨 앞 쉼표까지는 '내세운 이름'이에요. 통근자를 위한 지름길이라고 했다는 거예요. but은 없지만, 「이렇게 홍보됐다」로 시작하면 뒤에 「실제는 이렇다」가 오기 쉬워요.\n② 쉼표 뒤가 실제예요. '무엇이'는 the tunnel(터널)이고, 뒤의 one city bored under its harbor(한 도시가 항구 밑으로 뚫은)는 '어떤 터널인지'를 꾸며 줘요. '어떻다'는 now carries mostly delivery trucks(이제 주로 배달 트럭을 실어 나른다)예요. now(이제)가 「홍보하던 그때와 달리 지금은」이라는 뜻을 실어 줘요.\n③ 쉼표 뒤의 which use it to avoid weight limits on the bridges는 트럭들이 '왜 터널로 다니는지'를 덧붙인 말이에요. 무게 제한이 있는 곳은 터널이 아니라 다리예요(on the bridges).\n④ 그래서 여백에는 「항구 밑 터널 → 지금은 주로 배달 트럭이 다니는 길」이라고 적으면 돼요.","tr":[["항구 밑 터널 → 지금은 트럭 무게 제한이 걸려 있는 길","weight limits(무게 제한)를 터널에 이었다면 이 보기예요. 그런데 무게 제한이 있는 곳은 다리예요(weight limits on the bridges). 트럭들은 그 제한을 피하려고 터널로 다녀요."],["항구 밑 터널 → 지금은 다리 막힐 때만 돌아가는 길","bridges(다리)를 보고 「다리 대신 쓰는 길이구나」 하고 이었다면 이 보기예요. 그런데 문장에는 다리가 막힌다는 말이 없어요. 다리 이야기는 트럭이 다리의 무게 제한을 피한다는 데서만 나오고(to avoid weight limits on the bridges), 터널은 지금 주로 배달 트럭이 다녀요."],["항구 밑 터널 → 지금은 배달 트럭이 피해 다니는 길","delivery trucks(배달 트럭)와 avoid(피하다)를 「트럭이 터널을 피한다」로 이었다면 이 보기예요. 거꾸로예요. 트럭이 피하는 것은 다리의 무게 제한이고(to avoid weight limits on the bridges), 그러려고 터널을 써요(use it)."],["항구 밑 터널 → 지금은 주로 통근자가 질러 다니는 길","문장 앞머리의 a shortcut for commuters(통근자를 위한 지름길)를 지금의 모습으로 읽었다면 이 보기예요. 그런데 그것은 홍보할 때 내세운 말이에요(Billed as a shortcut for commuters). 지금 터널을 주로 다니는 것은 배달 트럭이에요(now carries mostly delivery trucks)."]],"dg":"Billed as ~","ko":"통근자를 위한 지름길이라고 홍보되었지만, 한 도시가 항구 밑으로 뚫은 터널은 이제 주로 배달 트럭을 실어 나르는데, 그 트럭들은 다리의 무게 제한을 피하려고 터널을 쓴다.","voc":[["bill A as B","A를 B라고 홍보하다(내세우다)"],["shortcut","지름길"],["commuter","통근자 (출퇴근하는 사람)"],["bore","(굴을) 뚫다 — 여기 bored는 bore의 과거형이에요. '지루한'이 아니에요"],["harbor","항구"],["carry","실어 나르다, 다니게 하다"],["delivery truck","배달 트럭"],["weight limit","무게 제한"]]},{"id":"S2-18","k":2,"dev":"끝에 붙은 though (though 뒤는 작은 예외 — 요점은 그 앞)","s":"Planners promised the stadium would revive nearby shops; seven seasons later, most storefronts on the block stand empty, though the parking lots do fill on game days.","a":"새 경기장 옆 상가 → 일곱 시즌 지나도 대부분 비어 있음","why":"① 세미콜론(;) 앞은 '약속'이에요. Planners promised(계획가들이 약속했다)이고, 약속한 내용은 경기장이 근처 가게를 되살린다는 거예요.\n② 세미콜론 뒤가 '실제'예요. seven seasons later(일곱 시즌 뒤), most storefronts on the block stand empty(그 구역 가게 자리 대부분이 비어 있다)예요. 약속과 정반대죠. 이음말은 없지만 promised(약속했다)와 stand empty(비어 있다)가 맞서요.\n③ 끝에 though가 붙어 있어요. though를 보면 「여기서 뒤집히나?」 싶지만, 문장 끝에 붙은 though는 「다만 ~이긴 하다」 하고 작은 예외를 덧붙이는 말이에요. 주차장은 경기 날에 찬다는 거예요. 가득 차는 것은 가게가 아니라 주차장이에요(the parking lots).\n④ 그래서 여백에는 「새 경기장 옆 상가 → 일곱 시즌 지나도 대부분 비어 있음」이라고 적으면 돼요.","tr":[["새 경기장 옆 상가 → 경기 있는 날이면 손님으로 가득 참","though 뒤의 fill on game days(경기 날에 가득 찬다)를 가게에 이었다면 이 보기예요. 그런데 가득 차는 것은 가게가 아니라 주차장이에요(the parking lots do fill on game days). 가게 자리는 대부분 비어 있어요."],["새 경기장 옆 상가 → 일곱 시즌 만에 주차장으로 바뀌어 감","seven seasons(일곱 시즌)와 parking lots(주차장)를 「가게가 주차장이 됐구나」 하고 이었다면 이 보기예요. 그런데 문장은 가게 자리가 비어 있다고 했을 뿐이에요(stand empty). 주차장으로 바뀌었다는 말은 없어요."],["새 경기장 옆 상가 → 주차장만은 경기 날마다 가득 참","though를 「뒤가 답」이라는 신호로 읽고 그 뒤를 옮겼다면 이 보기예요. 틀린 말은 아니에요. 문장에 있어요(the parking lots do fill on game days). 하지만 그것은 끝에 덧붙인 '작은 예외'예요. 이 문장이 하려는 말은 그 앞, 곧 가게 자리 대부분이 비어 있다는 거예요."],["새 경기장 옆 상가 → 일곱 시즌 사이 가게 다시 살아남","세미콜론 앞의 revive nearby shops(근처 가게를 되살리다)를 실제로 일어난 일로 읽었다면 이 보기예요. 그런데 그것은 약속이에요(Planners promised the stadium would revive nearby shops). 일곱 시즌 뒤의 실제는 가게 자리 대부분이 비어 있다는 거예요(stand empty)."]],"dg":"~, though ~","ko":"계획을 세운 사람들은 그 경기장이 근처 가게들을 되살릴 것이라고 약속했다. 일곱 시즌이 지난 뒤, 그 구역의 가게 자리 대부분은 비어 있다. 다만 주차장은 경기 날이면 정말로 가득 찬다.","voc":[["planner","(도시) 계획을 세우는 사람"],["revive","되살리다"],["seven seasons later","일곱 시즌 뒤"],["storefront","(길가의) 가게 자리, 점포"],["block","(길로 둘러싸인) 한 구역"],["stand empty","비어 있다"],["parking lot","주차장"],["do fill","정말로 가득 차다 (do는 힘주는 말)"]]},{"id":"S2-19","k":2,"dev":"X began as a temporary fix (지금의 자리 ↔ 처음의 쓰임 — 요점이 앞 · 이음말 없음)","s":"The route most residents of one island now prefer began as a temporary fix: a ferry brought in while the bridge, long since reopened, was being repaired.","a":"임시로 들인 연락선 → 주민 대부분이 더 좋아하는 길 됨","why":"① 이 문장에는 but이 없어요. 대신 때를 알려 주는 말 두 개가 맞서요. now(지금)와 began as ~(~로 시작했다)예요. '지금'과 '처음'이에요.\n② 콜론(:) 앞의 뼈대는 The route ... began as a temporary fix(그 길은 임시방편으로 시작했다)예요. route 뒤의 most residents of one island now prefer(한 섬의 주민 대부분이 지금 더 좋아하는)는 '어떤 길인지'를 꾸며 줘요. 잠깐 쓰려던 것이 지금은 주민 대부분이 더 좋아하는 길이 되어 있다는 거예요. '지금'의 모습이 문장 맨 앞에 있어요.\n③ 콜론 뒤는 그 임시방편이 무엇이었는지 풀어 줘요. a ferry brought in while the bridge ... was being repaired(다리를 고치는 동안 들여온 연락선)이에요. 쉼표 사이의 long since reopened(다시 열린 지 오래인)도 보세요. 다리는 벌써 다시 열렸어요. 그런데도 주민들은 연락선을 더 좋아해요.\n④ 문장 끝에 온 말이 늘 요점은 아니에요. 그래서 여백에는 「임시로 들인 연락선 → 주민 대부분이 더 좋아하는 길 됨」이라고 적으면 돼요.","tr":[["임시로 들인 연락선 → 다리보다 빨라 주민 모두가 타는 길","「주민들이 더 좋아한다」는 것까지는 맞게 잡았는데, 까닭과 범위를 보탰다면 이 보기예요. 문장은 주민 대부분이라고 했고(most residents of one island now prefer), 왜 좋아하는지는 말하지 않았어요. 빠르다는 말도, 모두라는 말도 없어요."],["임시로 들인 연락선 → 다리 열린 뒤로는 관광객만 타는 배","long since reopened(다시 열린 지 오래인)를 보고 「주민은 이제 다리로 다니겠지」 하고 이었다면 이 보기예요. 그런데 문장은 주민 대부분이 지금 그 길을 더 좋아한다고 해요(most residents of one island now prefer). 관광객 이야기는 없어요."],["임시로 들인 연락선 → 다리 고치는 동안 쓰려고 들여온 배","콜론 뒤를 그대로 옮겼다면 이 보기예요. 틀린 말은 아니에요. 문장에 있어요(a ferry brought in while the bridge). 하지만 그것은 '처음에 어떻게 시작됐는지'예요. 이 문장이 하려는 말은, 그 배가 지금은 주민 대부분이 더 좋아하는 길이라는 거예요."],["임시로 들인 연락선 → 다리가 다시 열리자 운항을 멈춤","temporary fix(임시방편)와 reopened(다시 열린)를 「다리가 열렸으니 끝났겠네」 하고 이었다면 이 보기예요. 임시로 쓰려던 것이니 그럴 법하지만, 문장은 거꾸로예요. 다리가 다시 열린 지 오래인데도 연락선은 주민 대부분이 지금 더 좋아하는 길이에요(now prefer)."]],"dg":"now prefer ↔ began as","ko":"한 섬의 주민 대부분이 지금 더 좋아하는 길은 임시방편으로 시작되었다. 곧, 다리를 고치는 동안 들여온 연락선인데, 그 다리는 다시 열린 지 오래다.","voc":[["route","(다니는) 길, 노선"],["resident","주민"],["prefer","더 좋아하다"],["begin as ~","~로 시작하다"],["temporary fix","임시방편 (급한 대로 잠깐 쓰는 것)"],["ferry","연락선 (사람 · 차를 건네주는 배)"],["bring in","들여오다"],["long since ~","오래전에 이미 ~한"]]},{"id":"S2-20","k":2,"dev":"The steady average ~ conceals a split (겉의 고른 평균 ↔ 속의 갈림 — 이음말 없음)","s":"The steady average one hospital reports for emergency waiting times conceals a split: morning patients are seen quickly, while those arriving after dark wait nearly three times as long.","a":"응급실 평균 대기 시간 → 고른 듯해도 시간대별 격차 숨김","why":"① 콜론(:)을 사이에 두고 앞뒤로 나뉘어요. 콜론은 「곧, 다시 말해」예요. 이 문장에서는 콜론 앞이 하려는 말이고, 뒤는 그 풀이예요.\n② 콜론 앞의 뼈대는 The steady average ... conceals a split(그 고른 평균이 갈림 하나를 숨기고 있다)이에요. average 뒤의 one hospital reports for emergency waiting times(한 병원이 응급실 대기 시간으로 발표하는)는 '어떤 평균인지'를 꾸며 줘요. but은 없지만 steady(고른)와 split(갈림)이 맞서요. 겉은 고른데 속은 갈려 있다는 거예요.\n③ 콜론 뒤는 그 갈림이 무엇인지 보여 줘요. 아침 환자는 빨리 진료받고(morning patients are seen quickly), 어두워진 뒤에 오는 환자는 거의 세 배나 오래 기다려요(wait nearly three times as long). 갈리는 기준은 하루 가운데 '언제 오느냐'이고, 오래 기다리는 쪽은 밤이에요.\n④ 그래서 여백에는 「응급실 평균 대기 시간 → 고른 듯해도 시간대별 격차 숨김」이라고 적으면 돼요.","tr":[["응급실 평균 대기 시간 → 고른 듯해도 요일별 격차 숨김","평균이 격차를 숨긴다는 것까지는 맞게 잡았는데, 무엇에 따라 갈리는지를 어림했다면 이 보기예요. 문장에서 갈리는 기준은 요일이 아니라 하루 가운데 언제 오느냐예요. 아침 환자와 어두워진 뒤에 오는 환자예요(those arriving after dark)."],["응급실 평균 대기 시간 → 아침 환자가 밤의 세 배 가까이 김","콜론 뒤의 숫자 three times(세 배)가 눈에 남았는데 아침과 밤을 바꿔 이었다면 이 보기예요. 세 배 가까이 오래 기다리는 쪽은 어두워진 뒤에 오는 환자예요(those arriving after dark wait nearly three times as long). 아침 환자는 빨리 진료받아요."],["응급실 평균 대기 시간 → 지난 세 해 동안 꾸준히 줄어 옴","steady(꾸준한, 고른)와 three(셋)를 「세 해 동안 꾸준히」로 이었다면 이 보기예요. 그런데 steady는 평균이 '고르다'는 뜻이고, three times는 '세 배'예요. 대기 시간이 줄어 왔다는 말은 문장에 없어요."],["응급실 평균 대기 시간 → 아침이든 밤이든 거의 차이 없음","steady average(고른 평균)를 「언제 가도 비슷하다」로 읽었다면 이 보기예요. 평균만 보면 그렇게 보여요. 하지만 문장은 그 평균이 갈림을 숨긴다고 했어요(conceals a split). 실제로는 밤에 오는 환자가 훨씬 오래 기다려요."]],"dg":"conceals a split","ko":"한 병원이 응급실 대기 시간으로 발표하는 고른 평균값은 갈림 하나를 숨기고 있다. 아침 환자는 빨리 진료받는 반면, 어두워진 뒤에 오는 환자들은 거의 세 배나 오래 기다린다.","voc":[["steady","고른, 한결같은"],["average","평균(값)"],["report","발표하다, 알리다"],["emergency","응급(실)"],["waiting time","대기 시간"],["conceal","숨기다, 가리다"],["split","(둘로) 갈림, 큰 차이"],["three times as long","세 배나 오래"]]},{"id":"S3-1","k":3,"dev":"anything but (= 전혀 ~아니다)","s":"One airline's logbooks suggest its first pilots, though perceived as daring heroes, were anything but reckless, refusing to fly whenever an engine sounded abnormal.","a":"첫 조종사들 → 위험하면 안 날았음","why":"anything but은 「전혀 ~아니다」라는 뜻이라, but 뒤의 reckless는 오히려 부정당하는 말이에요. 요점은 무모하지 않았다는 것과 그 증거(refusing to fly whenever an engine sounded abnormal)예요.","tr":[["첫 조종사들 → 무모하게 날았음","「but 뒤가 답」 버릇으로 but 뒤의 낱말(reckless)을 그대로 요점으로 잡았어요. anything but은 그 말을 부정해요."],["첫 조종사들 → 엔진을 손수 고침","engine을 빌려 지어낸 말이에요. 글은 엔진 소리가 이상하면 날지 않았다고 할 뿐, 고쳤다는 말은 없어요."],["초기 비행기 → 추락 사고가 잦았음","초기 비행기에 대한 흔한 이야기지만, 이 문장은 사고가 아니라 조종사들의 태도를 말해요."]]},{"id":"S3-2","k":3,"dev":"~ is beside the point; what counts is ~","s":"Whether it burned is, for some historians, beside the point; what counts is that funding for recopying its fragile scrolls had ceased generations earlier.","a":"장서 손실 → 베껴 쓸 돈 끊긴 탓","why":"beside the point는 「핵심에서 벗어난다」는 뜻이라 앞쪽(불에 탔는지)은 버리고, what counts 뒤가 요점(funding for recopying its fragile scrolls had ceased generations earlier)이에요.","tr":[["장서 손실 → 큰불이 난 탓","beside the point 쪽(Whether it burned)을 요점으로 잡았어요. 불이 났는지는 중요하지 않다는 말이에요."],["장서 손실 → 전쟁 중 약탈당한 탓","옛 도서관이 사라진 까닭으로 그럴듯하지만 글에 없어요."],["후대 작가 → 화재 이야기 꾸밈","앞 문장(Later writers claimed)을 비튼 말이에요. 글은 그 주장이 거짓이라고 하지 않고, 핵심이 아니라고 할 뿐이에요."]],"ctx":"Later writers claimed that one ancient library, which held thousands of scrolls, had vanished in a single fire."},{"id":"S3-3","k":3,"dev":"To call A B is to miss ~","s":"To call the centuries after Rome's collapse a 'Dark Age', historians argue, is to miss the trade which, recent excavations suggest, still linked distant ports.","a":"중세 → 항구 잇는 교역 계속됨","why":"To call A B is to miss C는 「A를 B라고 부르면 C를 놓친다」는 말이라, 요점은 놓친 쪽 C(the trade which, recent excavations suggest, still linked distant ports)예요. 「암흑 시대」라는 이름은 비판받는 쪽이에요.","tr":[["중세는 학문이 끊긴 어둠의 시대","글이 비판하는 이름(a 'Dark Age')을 그대로 요점으로 잡았어요."],["중세 수도원이 학문을 이어 감","중세를 다시 보자는 이야기로 가장 흔히 듣는 말이지만, 이 문장이 놓치지 말라고 한 것은 학문이 아니라 먼 항구를 잇던 교역(the trade ... still linked distant ports)이에요."],["발굴 → 옛 항구 터를 새로 찾음","삽입구(recent excavations suggest)를 빌려 지어낸 말이에요. 발굴은 교역이 이어졌다는 근거로 나올 뿐, 항구를 새로 찾았다는 말은 없어요."]]},{"id":"S3-4","k":3,"dev":"Not that ~; ~","s":"Not that such creatures never existed; their soft bodies, which lacked shells or bones, tended to decay before sediment could bury them.","a":"화석 공백 → 무른 몸이 먼저 썩음","why":"Not that A; B는 「A라는 말은 아니고, B」라는 뜻이에요. 부정당한 쪽(such creatures never existed)을 버리면 요점은 뒤(their soft bodies, which lacked shells or bones, tended to decay before sediment could bury them)예요.","tr":[["화석 공백 → 그런 생물은 없었음","Not that이 부정한 쪽(such creatures never existed)을 요점으로 잡았어요. 글은 그런 생물이 있었다고 봐요."],["화석 공백 → 지층이 깎여 사라짐","화석이 드문 까닭으로 그럴듯하지만, 글은 땅이 깎인 이야기를 하지 않아요."],["화석 공백 → 발굴이 덜 돼서 생김","앞 문장(Researchers have found almost no fossils)에 끌려 연구자 탓으로 돌렸어요. 글은 화석이 처음부터 잘 생기지 않았다고 말해요."]],"ctx":"Researchers have found almost no fossils of the creatures which, according to their hypothesis, once linked two groups of sea animals."},{"id":"S3-5","k":3,"dev":"A matters little; what matters is B","s":"For one island considering desalination, the equipment's price, which a grant would cover, matters little; what matters is the electricity it would consume for decades.","a":"담수화 → 오래 쓸 전기가 관건","why":"A matters little; what matters is B에서 A(the equipment's price)는 덜 중요한 쪽이고, 요점은 B(the electricity it would consume for decades)예요.","tr":[["담수화 → 장비 사는 값이 관건","matters little 쪽(the equipment's price)을 요점으로 잡았어요."],["담수화 → 짠물 처리가 관건","담수화의 흔한 걱정거리지만 글에 없어요."],["장비값 → 섬 예산으로 치름","관계사절(which a grant would cover)을 거꾸로 읽었어요. 장비값은 보조금이 대 준다고 했어요."]]},{"id":"S3-6","k":3,"dev":"neither A nor B; it is C","s":"Peer review's chief benefit, some editors argue, is neither exposing fraud nor ranking studies; it is that authors, when challenged, state their evidence more precisely.","a":"동료 심사 → 근거가 또렷해짐","why":"neither A nor B; it is C는 「A도 B도 아니고 C」라는 말이라, 요점은 C(authors, when challenged, state their evidence more precisely)예요.","tr":[["동료 심사 → 연구 부정 잡아냄","neither 쪽(exposing fraud)을 요점으로 잡았어요. 글은 그것이 가장 큰 이점이 아니라고 해요."],["동료 심사 → 저자의 실수를 찾아냄","동료 심사의 흔한 역할로 그럴듯하지만, 글은 실수 찾기를 말하지 않아요."],["저자 → 반박받으면 물러섬","when challenged를 「반박받으면 물러선다」로 비틀었어요. 글은 오히려 근거를 더 정확히 댄다고 해요."]]},{"id":"S3-7","k":3,"dev":"It was not until ~ that ~ (not이 대체가 아니라 때를 말함 — 리듬 깨기)","s":"In one town, it was not until buses ran on a printed timetable that the square's clock, inaccurate for decades, was adjusted.","a":"버스 시간표 → 비로소 시계 고침","why":"It was not until A that B는 「A가 되고서야 B했다」는 뜻이에요. not은 무엇을 지우는 말이 아니라 때를 말해요. 그래서 요점은 A(buses ran on a printed timetable) 뒤에야 비로소 B(the square's clock ... was adjusted)가 일어났다는 것이에요.","tr":[["시계 수리 → 버스와는 상관없음","it was not … that을 「버스 때문이 아니다」로 읽어 버스 시간표를 지워 버렸어요. not until은 「버스가 시간표대로 다니고서야」라는 말이라, 둘은 오히려 이어져 있어요."],["광장 시계 → 수십 년 부정확","삽입구(inaccurate for decades)의 곁가지예요. 사실이지만 요점은 언제, 무엇을 계기로 고쳤는가예요."],["기차 시대 → 표준 시각 생김","기차가 표준 시각을 퍼뜨렸다는 흔한 이야기지만, 이 글은 한 마을의 버스 이야기예요."]]},{"id":"S3-8","k":3,"dev":"not without reason (= 까닭이 있다, 이중 부정 — 리듬 깨기)","s":"Belief in many weather sayings, which modern forecasts have largely replaced, is not without reason, since the sayings derive from farmers who watched the sky for generations.","a":"날씨 속담엔 관찰의 근거 있음","why":"not without reason은 「까닭이 없지 않다」, 곧 근거가 있다는 이중 부정이에요. 그 근거는 since 뒤(derive from farmers who watched the sky for generations)예요.","tr":[["날씨 속담은 근거 없는 미신","not을 보고 「근거 없음」으로 읽었어요. not without reason은 「까닭이 없지 않다」, 곧 근거가 있다는 말이에요."],["날씨 속담은 요즘엔 안 맞음","관계사절(which modern forecasts have largely replaced)에 끌렸어요. 예보가 속담 자리를 대신했다는 말이지, 속담이 틀렸다는 말은 아니에요."],["날씨 속담 → 일부만 들어맞음","글은 속담이 얼마나 들어맞는지 따지지 않아요. 그 믿음에 근거가 있는 까닭으로 농부들의 오랜 관찰(derive from farmers who watched the sky for generations)을 들 뿐이에요."]]},{"id":"S3-9","k":3,"dev":"nothing short of (= 그야말로, 부정처럼 보이지만 강조 — 리듬 깨기)","s":"For one club's players, the chess engine which their previous coach banned has proved nothing short of an ideal tutor, explaining why natural-looking moves fail.","a":"체스 엔진 → 좋은 선생 노릇","why":"nothing short of는 「그야말로 ~이다」라는 강조예요. 부정이 아니에요. 요점은 엔진이 선생 노릇을 한다는 것(has proved nothing short of an ideal tutor, explaining why natural-looking moves fail)이에요.","tr":[["체스 엔진 → 선생엔 못 미침","nothing과 short of를 부정으로 읽었어요. nothing short of는 「~에 못 미치는 데가 없다」, 곧 그야말로 선생이라는 뜻이에요."],["체스 엔진 → 생각할 힘 빼앗음","엔진을 걱정하는 흔한 말이지만 글에 없어요."],["체스 엔진 → 자연스러운 수 권함","natural-looking moves를 빌렸지만 뜻이 거꾸로예요. 엔진은 자연스러워 보이는 수가 왜 실패하는지 알려 줘요."]]},{"id":"S3-10","k":3,"dev":"A gives way to B (부정 말 없이 대체)","s":"On some footbridges, the slight sway generated by a few walkers can give way to strong shaking once a crowd unconsciously falls into step.","a":"다리 흔들림 → 발맞추면 커짐","why":"A gives way to B는 「A가 B에게 자리를 내준다」, 곧 B로 바뀐다는 말이에요. 부정 말이 없어도 대체예요. 요점은 B(strong shaking once a crowd unconsciously falls into step)예요.","tr":[["다리 흔들림 → 적은 인원엔 약함","자리를 내주는 쪽 A(the slight sway generated by a few walkers)만 옮겼어요."],["다리 흔들림 → 강풍 탓에 커짐","다리가 흔들리는 흔한 까닭이지만, 글은 바람을 말하지 않아요."],["군중 → 흔들림 느끼고 멈춤","unconsciously(저도 모르게)를 거꾸로 읽었어요. 군중은 알아채지 못한 채 발을 맞춰요."]]},{"id":"S4-1","k":4,"dev":"Witness ~ (예시를 들이밂)","s":"Witness the director who, to make a farewell scene feel lonelier, left the actor's light unchanged and let the darkness around her expand until she seemed alone.","a":"어둠 넓히자 → 쓸쓸함 커짐","why":"Witness ~는 「~를 보라」며 사례를 들이미는 신호예요. 배우를 비추는 빛은 그대로 두고 둘레의 어둠만 넓혔더니 배우가 혼자처럼 보였다는 사례(left the actor's light unchanged and let the darkness around her expand)이니, 어둠을 넓히면 쓸쓸함이 커진다는 원리로 끌어올려야 해요.","tr":[["푸른빛 쓰자 → 쓸쓸함 커짐","쓸쓸한 장면에 흔히 떠올리는 방법이지만, 감독은 배우를 비추는 빛을 그대로 두었어요(left the actor's light unchanged)."],["역광 비추자 → 쓸쓸함 커짐","그럴듯한 무대 기법이지만 글에 없어요. 감독은 빛을 바꾸지 않고 둘레의 어둠만 넓혔어요(let the darkness around her expand)."],["배우 혼자 세우자 → 쓸쓸함 커짐","혼자처럼 보인 것(until she seemed alone)은 어둠을 넓힌 결과예요. 무대에 배우를 혼자 세운 것이 아니에요."]]},{"id":"S4-2","k":4,"dev":"It is precisely this ~ that ~","s":"It is precisely this lack of a buffer that some managers value, since defects which a large stockpile would have concealed become visible at once.","a":"여유분 없음 → 결함 일찍 드러남","why":"It is precisely this ~ that ...은 「바로 이 ~를 ...한다」며 앞 문장의 한 부분을 콕 집는 짜임이에요. this lack of a buffer는 앞 문장의 여유 부품이 거의 없다는 것(keeps almost no spare parts)을 받고, 요점은 그 덕에 결함이 곧바로 드러난다는 것(defects which a large stockpile would have concealed become visible at once)이에요.","tr":[["여유분 없음 → 공장 멈추기 쉬움","앞 문장의 내용(one faulty batch can halt the whole line)이에요. 이 문장은 그 약점이 아니라 관리자들이 좋게 보는 점(some managers value)을 말해요."],["여유분 없음 → 보관 비용 줄어듦","적시 생산의 흔한 장점이지만 이 글에는 비용 이야기가 없어요."],["여유분 없음 → 결함 숨기 쉬움","concealed를 빌렸지만 거꾸로예요. 결함을 감추는 쪽은 재고가 넉넉할 때(which a large stockpile would have concealed)이고, 여유분이 없으면 결함이 곧바로 드러나요(become visible at once)."]],"ctx":"Under just-in-time production, a factory keeps almost no spare parts, so one faulty batch can halt the whole line."},{"id":"S4-3","k":4,"dev":"The former (앞의 것)","s":"The former, though it spares speakers any effort of invention, often drifts from its original meaning, since borrowers seldom import every sense the word carried at home.","a":"통째로 빌린 말 → 뜻이 달라짐","why":"The former는 앞 문장의 두 길 가운데 앞의 것, 곧 외국어를 통째로 빌려 쓰는 쪽(a foreign word taken whole)이에요. 양보절(though it spares speakers any effort of invention)을 넘기면 요점은 그렇게 빌린 말이 본래 뜻에서 멀어진다는 것(often drifts from its original meaning)이에요.","tr":[["새로 지은 말 → 뜻이 달라짐","The former를 뒤의 것(a new one built from native roots)으로 잘못 받은 답이에요. 「늘 뒤의 것」이라는 버릇에 낚였어요."],["오래 쓴 말 → 뜻이 달라짐","말은 오래 쓰면 뜻이 바뀐다는 흔한 이야기지만, 글이 든 까닭은 세월이 아니라 빌릴 때 뜻을 다 가져오지 않는다는 것(borrowers seldom import every sense the word carried at home)이에요."],["통째로 빌린 말 → 만들기 수월함","though가 이끄는 양보 부분(though it spares speakers any effort of invention)만 옮겼어요. 맞는 말로 접어 두고, 글이 말하려는 것은 그래도 본래 뜻에서 멀어진다는 주절이에요."]],"ctx":"When a language meets a new concept, speakers may choose between a foreign word taken whole and a new one built from native roots."},{"id":"S4-4","k":4,"dev":"These findings (자료 받기)","s":"These findings imply that the benefit may stem less from the activity itself than from a sense of autonomy, which vanishes once helping becomes an obligation.","a":"스스로 고른 일 → 건강 좋아짐","why":"These findings는 앞 문장의 조사 결과, 곧 역할을 스스로 고른 사람만 건강이 좋았다는 것(only among those who had chosen their roles)을 받아요. 요점은 이득이 활동 자체보다 스스로 정했다는 느낌에서 온다는 것(from a sense of autonomy)이에요.","tr":[["몸 움직이는 일 → 건강 좋아짐","봉사가 몸을 움직이게 해서 건강해진다는 흔한 생각이지만, 글은 활동 자체 때문이 아니라고 해요(less from the activity itself)."],["사람 만나는 일 → 건강 좋아짐","봉사하며 사람을 만나 건강해진다는 말도 그럴듯하지만 글에는 만남 이야기가 없어요."],["남 돕는 일 → 건강 좋아짐","봉사가 남을 도와서 건강해진다는 흔한 생각이지만, 글은 그 이로움이 활동 자체보다(less from the activity itself) 스스로 골랐다는 느낌(a sense of autonomy)에서 온다고 해요."]],"ctx":"In one survey of retirees, volunteering was linked to better health, but only among those who had chosen their roles."},{"id":"S4-5","k":4,"dev":"In much the same way, ~ (비유 예시)","s":"In much the same way, parents, who cannot hand a child confidence directly, can only arrange the conditions under which small successes accumulate.","a":"여건 마련해 주면 → 자신감 자람","why":"In much the same way는 앞 문장(치즈 만드는 사람)과 같은 이치를 다른 데 옮기는 신호예요. 치즈 만드는 사람이 맛을 넣기보다 미생물이 일할 여건을 맞추듯(adjust the conditions under which microbes inside it work), 부모도 자신감을 직접 줄 수는 없고 작은 성공이 쌓일 여건을 마련할 수 있을 뿐이라는 것(can only arrange the conditions under which small successes accumulate)이 요점이에요.","tr":[["칭찬해 주면 → 자신감 자람","흔한 교훈이지만 글은 자신감을 직접 건넬 수 없다고 해요(cannot hand a child confidence directly). 칭찬 이야기는 없어요."],["본보기 보여 주면 → 자신감 자람","그럴듯한 육아 교훈이지만 글에 없어요. 글이 말한 부모의 몫은 여건 마련뿐이에요."],["큰 과제 맡기면 → 자신감 자람","글은 큰 일이 아니라 작은 성공이 쌓이는 것(small successes accumulate)을 말해요."]],"ctx":"A cheesemaker does not so much add flavor to an aging cheese as adjust the conditions under which microbes inside it work."},{"id":"S4-6","k":4,"dev":"두 문장 앞 받기 (ctx에 두 문장, This가 첫 문장을 가리킴 — 리듬 깨기)","s":"This, a limitation of the observers rather than of the forest, is probably why early estimates of canopy insect diversity were so low.","a":"땅에서만 관찰 → 곤충 적게 셈","why":"This는 바로 앞 문장이 아니라 두 문장 앞을 받아요. 실마리는 This 뒤에 붙은 말이에요. 숲의 한계가 아니라 관찰하는 사람의 한계(a limitation of the observers rather than of the forest)라고 했으니, This는 땅에서만 연구했다는 첫 문장(worked mostly from the ground)이에요. 그래서 요점은 땅에서만 본 탓에 곤충 종류를 적게 셌다는 거예요.","tr":[["밤에만 활동 → 곤충 적게 셈","This를 바로 앞 문장(feed only at night)으로 받은 답이에요. 곤충의 습성은 숲 쪽의 사정이라 관찰자의 한계라는 말(a limitation of the observers rather than of the forest)과 맞지 않아요."],["실제로 종 적음 → 곤충 적게 셈","This 뒤에 붙은 말이 막아요. 낮은 추정치는 숲이 아니라 관찰하는 사람 쪽의 한계 탓이라고 했어요(a limitation of the observers rather than of the forest)."],["연구비 부족 → 곤충 적게 셈","그럴듯한 까닭이지만 글에는 돈 이야기가 없어요."]],"ctx":"For decades, rainforest scientists worked mostly from the ground, since the canopy far overhead was nearly impossible to reach. Some canopy insects, moreover, feed only at night and spend the daylight hours hidden beneath leaves."},{"id":"S4-7","k":4,"dev":"To take one case, ~","s":"To take one case, when a city stopped charging bus fares, ridership jumped by a third, a rise which officials celebrated and which surveys traced mostly to people who had previously walked.","a":"무료 버스 → 걷던 사람 끌어옴","why":"To take one case는 앞 문장(원리)의 사례를 드는 신호예요. 앞 문장이 중요한 것은 몇 명이 더 타느냐가 아니라 어디서 왔느냐라고 했으니(not how many more people ride but where they come from), 이 사례의 요점은 주절의 승객 증가가 아니라 문장 끝 관계절, 늘어난 승객 대부분이 원래 걷던 사람이었다는 것(traced mostly to people who had previously walked)이에요.","tr":[["무료 버스 → 승객 수 늘어남","주절(ridership jumped by a third)에 끌린 답이에요. 글에 있는 사실이지만 앞 문장이 중요하지 않다고 한 쪽(how many more people ride)이에요."],["무료 버스 → 차 타던 사람 끌어옴","무료 교통이라면 흔히 기대하는 결과지만, 늘어난 승객은 대부분 걷던 사람이었어요(people who had previously walked)."],["무료 버스 → 자전거족 끌어옴","걷던 사람과 함께 떠올리기 쉬운 쪽이지만 글에는 자전거 이야기가 없어요. 늘어난 승객은 대부분 원래 걷던 사람이었어요(people who had previously walked)."]],"ctx":"What matters in a fare-free transit experiment, some planners argue, is not how many more people ride but where they come from."},{"id":"S4-8","k":4,"dev":"the phenomenon (범주 명사로 받기)","s":"The phenomenon, familiar to anyone who maintains old software, often arises when other parts of a program have quietly come to rely on the original error.","a":"수정 뒤 오류 → 옛 실수에 기댄 탓","why":"The phenomenon은 앞 문장의 일, 곧 작은 실수를 고쳤더니 멀쩡하던 보고서가 망가진 일을 하나의 「현상」으로 묶어 받아요. 요점은 그 까닭, 프로그램의 다른 부분이 원래의 실수에 기대어 있었다는 것(other parts of a program have quietly come to rely on the original error)이에요.","tr":[["수정 뒤 오류 → 작다고 방심한 탓","앞 문장의 tiny에서 끌어낸 그럴듯한 까닭이지만, 글은 고친 사람의 방심을 말하지 않아요."],["수정 뒤 오류 → 시험 안 해 본 탓","프로그램 오류에 흔히 떠올리는 까닭이지만 글에 없어요. 글이 든 까닭은 다른 부분이 옛 실수에 기댄 것이에요."],["수정 뒤 오류 → 다른 곳 건드린 탓","other parts of a program을 빌렸지만 관계를 뒤집은 말이에요. 고칠 때 다른 곳을 건드린 것이 아니라, 다른 곳이 원래의 실수에 기대고 있었어요(have quietly come to rely on the original error)."]],"ctx":"After a programmer fixed a tiny rounding error in a salary program, several reports that had worked for years began to fail."},{"id":"S4-9","k":4,"dev":"Which is why ~ (문장 머리)","s":"Which is why some engineers, when asked whether roundabouts reduce accidents, reply that their main benefit lies in how mild the remaining crashes become.","a":"회전 교차로 → 사고가 가벼워짐","why":"Which is why는 「그래서 ~하다」라며 앞 문장 전체를 까닭으로 받아요. 앞 문장(사고가 나도 옆으로 스치는 정도라는 것)이 까닭이고, 요점은 엔지니어들이 꼽는 가장 큰 이점이 남은 사고가 가벼워진다는 것(their main benefit lies in how mild the remaining crashes become)이에요.","tr":[["회전 교차로 → 사고가 줄어듦","질문(whether roundabouts reduce accidents)에 끌린 답이에요. 엔지니어들은 사고 수가 아니라 사고가 얼마나 가벼워지는지로 답해요."],["회전 교차로 → 차 속도가 느려짐","회전 교차로의 장점으로 흔히 드는 말이지만 글에는 속도 이야기가 없어요."],["회전 교차로 → 큰 사고 잦아짐","글은 큰 충돌이 아니라 옆으로 스치는 사고가 난다고 했어요(rather than violent right-angle impacts)."]],"ctx":"Because all cars at a roundabout move in one direction, the crashes that occur tend to be side scrapes rather than violent right-angle impacts."},{"id":"S4-10","k":4,"dev":"By way of illustration, ~","s":"By way of illustration, children at one forest kindergarten, where sticks and stones replaced store-bought toys, quarreled far less over playthings, apparently because no single object had an obvious use.","a":"정해진 쓰임 없으면 → 덜 다툼","why":"By way of illustration은 「예를 들어 보이자면」이라는 신호예요. 사서 쓰는 장난감 대신 나뭇가지와 돌로 논 숲 유치원 아이들이 덜 다퉜다는 사례(sticks and stones replaced store-bought toys, quarreled far less over playthings)를, because 뒤의 까닭(no single object had an obvious use)과 함께 쓰임이 정해지지 않은 놀잇감이면 덜 다툰다는 원리로 끌어올려야 해요.","tr":[["자연 속에서 놀면 → 덜 다툼","숲이라는 장면에 끌린 흔한 생각이에요. 글이 든 까닭은 자연의 힘이 아니라 놀잇감의 쓰임이 정해지지 않았다는 것(no single object had an obvious use)이에요."],["모양 단순하면 → 덜 다툼","나뭇가지와 돌의 겉모습에 끌린 답이에요. 글이 든 까닭은 모양이 아니라 어느 것도 쓰임이 정해지지 않았다는 것(no single object had an obvious use)이에요."],["장난감 넉넉하면 → 덜 다툼","store-bought toys를 비튼 말이에요. 글은 장난감이 많아서가 아니라, 사서 쓰는 장난감을 나뭇가지와 돌로 바꾸어 쓰임이 정해지지 않아서라고 해요."]]},{"id":"S5-1","k":5,"dev":"두 문장에 걸친 확장 은유 (풀이 없이)","s":"A translator spends her working life moving furniture between two houses whose doorways were built to different sizes. Guests who later relax in the second house rarely notice which legs she quietly trimmed so that each piece would fit.","a":"번역가 → 남몰래 손봐 맞춤","why":"번역가의 일을 문 크기가 다른 두 집 사이로 가구를 옮기는 일에 빗대고, 풀이 없이 둘째 문장까지 비유를 이어 갔어요. 두 집은 두 언어, 가구는 글, 손님은 독자예요. 문에 맞게 들어가도록 다리를 몰래 깎았다(which legs she quietly trimmed so that each piece would fit)는 것은, 언어의 틀이 달라서 번역가가 독자 모르게 글을 손봐 맞춘다는 속뜻이에요.","tr":[["번역가 → 평생 고된 일을 함","첫 문장의 겉뜻(spends her working life moving furniture)만 읽은 답이에요. 가구를 옮기는 것은 번역을 빗댄 말이고, 글은 일이 힘들다는 데 무게를 두지 않아요."],["번역 → 원문을 그대로 살림","좋은 번역에 대한 흔한 생각이지만 글과 반대예요. 문에 맞추려고 다리를 깎았다는 것은 원문을 그대로 두지 않고 고쳤다는 뜻이에요."],["독자 → 번역서를 편히 즐김","관계사절의 배경(who later relax in the second house)을 옮긴 답이에요. 문장이 하려는 말은 그 손님들이 어느 다리를 깎았는지 알아채지 못한다(rarely notice)는 것, 곧 번역가가 남몰래 손봤다는 것이에요."]]},{"id":"S5-2","k":5,"dev":"완곡어 (let go = 해고 같은 꼴)","s":"Shortly after the two firms merged, roughly forty employees, most of whom had worked in overlapping departments, were encouraged to pursue opportunities elsewhere.","a":"합병 → 직원들을 내보냄","why":"pursue opportunities elsewhere(다른 곳에서 기회를 찾다)는 해고를 부드럽게 돌려 말하는 완곡어예요. 합병하자마자 마흔 명쯤이 이런 권유를 받았다(roughly forty employees ... were encouraged to pursue opportunities elsewhere)는 것은 회사가 그들을 내보냈다는 뜻이에요.","tr":[["직원들 → 더 나은 자리로 옮김","완곡어(were encouraged to pursue opportunities elsewhere)를 겉뜻대로 「다른 곳에서 더 나은 기회를 찾아갔다」고 읽은 답이에요. 합병하자마자 겹치는 부서의 마흔 명쯤이 한꺼번에 이런 권유를 받았다는 것은, 회사가 떠나 달라고 한 것을 부드럽게 바꿔 말한 것이에요."],["합병 → 겹치는 부서가 생김","관계사절의 세부(most of whom had worked in overlapping departments)예요. 누가 나가게 됐는지를 덧붙인 말일 뿐, 문장이 하려는 말은 아니에요."],["합병 → 두 회사 문화 충돌","합병에 대해 흔히 하는 말이지만 글에 없어요."]]},{
