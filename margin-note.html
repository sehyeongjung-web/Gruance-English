":"3-W3","k":3,"dev":"수사 의문문 + Hardly.","s":"Is a quiet classroom always a classroom where students are learning? Hardly. Silence can just as easily mean that students are lost and afraid to ask.","model":"조용함이 곧 배움은 아님","accept":"침묵 → 몰라서 못 물을 수도","no":"조용한 교실 → 잘 배움(물음 그대로)","dg":"수사 의문문 + hardly."},{"id":"3-W4","k":3,"dev":"was never about A; it was about B","s":"For the old shopkeeper, running the store was never about money; it was about knowing every family in the neighborhood by name.","model":"가게 → 이웃과의 정","accept":"돈보다 이웃 알기","no":"가게 → 돈벌이(never 쪽)","dg":"was never about a; it was about b"},{"id":"3-W5","k":3,"dev":"fail to ~ (부정 동사)","s":"Having a lot of friends often fails to help students through hard times; in one survey, what mattered was having one friend who would just listen.","model":"힘들 때 → 들어 줄 한 친구","accept":"들어 주는 친구 하나가 힘이 됨, 친구 수보다 들어 줄 한 명, 친구는 수보다 깊이(반만 맞음 — 들어 주는 한 친구라는 내용이 빠짐)","no":"친구 많으면 → 힘든 때 견딤(fail to를 놓침), 친구 많으면 소용없음(fail to 쪽만 — 무엇이 중요한지 빠짐), 혼자 견디기(글에 없음)","dg":"fail to ~"},{"id":"3-W6","k":3,"dev":"isn't about A; it's about B","s":"How much a family talks at dinner often isn't about daily phone hours; it's about whether phones stay on the table.","model":"저녁 대화 → 식탁 위 폰이 좌우","accept":"폰을 식탁에 두지 않으면 대화 늘어남, 사용 시간보다 식탁 위 폰이 문제, 폰을 어디 두느냐가 대화 좌우","no":"폰 오래 쓰면 대화 줄어듦(isn't about 쪽 — 이 글은 하루 사용 시간이 아니라 식탁 위 폰을 말함), 가족은 저녁을 함께 먹어야 함(글에 없는 흔한 말)","dg":"was never about a; it was about b"},{"id":"3-W7","k":3,"dev":"the key is not A but B","s":"The key to keeping customers at the corner shop near our school was not big discounts but lending students umbrellas on rainy days.","model":"비 오는 날 우산 → 손님 지킴","accept":"비 올 때 우산 빌려준 것이 비결, 할인보다 우산 빌려주기, 친절이 손님 지킴(반만 맞음 — 무엇을 해 주었는지 빠짐)","no":"큰 할인 → 손님 지킴(not 쪽), 학교 앞이라 손님 많음(near our school에 끌림)","dg":"the key is not a but b"},{"id":"3-W8","k":3,"dev":"never A; instead, B","s":"At this year's sports day, the final relay was never a race between classes; instead, all classes ran it together, passing a single baton.","model":"운동회 → 승패 대신 함께 계주","accept":"모든 반이 함께 마지막 계주, 반 대항 대신 다 같이 뛴 계주, 다 같이 뛴 운동회(반만 맞음 — 다 같이 뛴 것은 마지막 계주인데 운동회 전체로 넓힘)","no":"반끼리 경주(never 쪽을 거꾸로 읽음), 반 대항 아님(never 쪽만 — instead 뒤가 빠짐), 운동회 → 승패가 중요(거꾸로 읽음)","dg":"do not simply a; instead, b"},{"id":"4-W1","k":4,"dev":"For instance","s":"For instance, when a popular café started charging customers for paper cups, the number of people bringing their own mugs nearly tripled within a month.","model":"요금 매기자 → 행동 바뀜","accept":"컵값 받자 → 개인 컵 늘어남(사례 그대로라 반만 맞음)","no":"카페 → 종이컵 돈 받음(결과 빠짐), 작은 요금 → 습관 바뀜(글에 없는 「작은」·「습관」을 붙임), 환경 보호(글에 없는 목적)","dg":"for example"},{"id":"4-W2","k":4,"dev":"To illustrate","s":"To illustrate, a football coach began thanking players for their effort after every game, win or lose, and within a season they were training harder and complaining less.","model":"노력 인정 → 더 열심히 함","accept":"감독이 고마워하자 선수가 열심(사례 그대로라 반만 맞음)","no":"칭찬 → 경기 이김(win or lose에 끌림), 감독 → 매번 감사함(원인만)","dg":"to illustrate"},{"id":"4-W3","k":4,"dev":"A good example is ~","s":"A good example is an old riverside factory that was turned into a concert hall and art studios instead of being destroyed.","model":"옛 건물 → 허물지 않고 다시 씀","accept":"공장 → 공연장·작업실로 바뀜(사례 그대로라 반만 맞음)","no":"공장 → 부서짐(instead of를 놓침), 강 · 공장 · 공연장(나열)","ctx":"Old buildings do not have to be torn down to become useful again.","dg":"for example"},{"id":"4-W4","k":4,"dev":"That is why (앞 문장 받기)","s":"That is why many gardeners turn their pots every few days, so the stems do not lean too far to one side.","model":"빛 쪽으로 휘니 → 화분 돌림","accept":"화분을 돌려 고르게 키움","no":"식물 → 빛 쪽으로 자람(앞 문장만), 정원사 → 화분 돌림(That이 무엇인지 빠져 반만 맞음)","ctx":"Plants on a windowsill grow toward the light.","dg":"that is why"},{"id":"4-W5","k":4,"dev":"Here is an example: ~","s":"Here is an example: one class began using a short checklist, and soon its missing assignments dropped from about ten a week to two.","model":"기억 대신 목록 → 빠뜨림 줄어듦","accept":"목록 확인 → 덜 빠뜨림, 적어서 확인하면 덜 잊음, 체크리스트 쓰자 → 빠진 숙제 열 개에서 두 개(사례 그대로라 반만 맞음), 기억만으로는 → 부족함(원리는 맞지만 이 문장이 보여 준 해결인 목록이 빠져 반만 맞음)","no":"학생 → 체크리스트 씀(결과 빠짐), 숙제 → 너무 많음(글에 없는 말), 목록 → 숙제 늘어남(글과 반대)","ctx":"Memory alone is a poor tool for keeping track of small tasks.","dg":"for example"},{"id":"4-W6","k":4,"dev":"Like ~ (예시를 앞에 둠)","s":"Like a cello student who plays the same piece every afternoon, most learners must practice a hard skill again and again before it feels easy.","model":"어려운 기술 → 되풀이해야 쉬워짐","accept":"반복 연습 → 익숙해짐, 여러 번 해야 쉬워짐, 첼로 학생 → 같은 곡 반복해 익힘(사례 그대로라 반만 맞음)","no":"첼로 학생 → 날마다 같은 곡 연습(예시 장면만, 하는 말 빠짐), 첼로 → 어려운 악기(글에 없는 말), 재능 → 중요(글에 없는 말), 쉬운 기술 → 금방 익힘(hard skill을 놓침)","dg":"like ~"},{"id":"4-W7","k":4,"dev":"That is, ~ (즉)","s":"That is, it should show a simple picture, such as a running child or falling rocks: a picture often tells drivers what to expect faster than words.","model":"표지엔 그림 → 글보다 빨리 알림","accept":"그림이 글보다 빨리 전달됨, 그림 표지 → 한눈에 알아봄, 좋은 표지 → 한눈에 이해(앞 문장만 옮겨 그림 이야기가 빠져 반만 맞음), 아이 · 낙석 그림 → 운전자가 빨리 앎(사례 그대로라 반만 맞음)","no":"아이 · 낙석 조심(사례 낱말 나열), 글 표지 → 없애야 함(글에 없는 지나친 말), 운전자 → 글을 못 읽음(앞 문장의 덧붙은 말을 비튼 말)","ctx":"A good road sign should be understood at a glance, even by people who cannot read the local language.","dg":"that is, ~"},{"id":"4-W8","k":4,"dev":"Doing so","s":"Since it started doing so, complaints that lunch is unfair to some classes have nearly disappeared, yet the line itself is no shorter.","model":"순서 돌리기 → 불공평 불만 사라짐","accept":"먼저 먹는 반 바꾸기 → 불만 줄어듦, 돌아가며 먹자 → 공평하다 느낌, 그렇게 하자 → 불만 사라짐(doing so가 무엇인지 빠져 반만 맞음)","no":"순서 돌리기 → 줄 짧아짐(yet 뒤와 반대), 줄 → 여전히 김(덧붙은 뒷말만 잡음), 늦게 먹는 반 → 불만(바뀌기 전 모습)","ctx":"One school lets a different class go to lunch first each day, so no class is always last in line.","dg":"doing so"},{"id":"5-W1","k":5,"dev":"직유 (A is like B)","s":"Praise is like salt: a little brings out the best in a student, but too much makes every compliment taste the same.","model":"칭찬 → 적당해야 효과","accept":"칭찬 많으면 → 가치 떨어짐, 칭찬은 적당히, 칭찬 → 학생 잘하게 함(앞쪽만 써서 반만 맞음)","no":"칭찬 = 소금(비유 겉말), 칭찬 → 많을수록 좋음(글과 반대)","dg":"직유"},{"id":"5-W2","k":5,"dev":"If A is B, then C is D","s":"If a city is a body, then its parks are its lungs: without them, the whole place struggles to breathe.","model":"공원 → 도시에 꼭 필요","accept":"공원 → 도시의 숨통, 공원 없으면 → 도시가 힘듦, 공원 → 공기 맑게 함(꼭 필요하다는 뜻이 빠져 반만 맞음)","no":"도시 = 몸(비유 겉말)","dg":"if a is b, then c is d"},{"id":"5-W3","k":5,"dev":"빗댄 장면 (우의)","s":"An umbrella that stays folded in the closet will never get wet, but it will also never do the job it was made for.","model":"안전만 찾으면 → 제 역할 못 함","accept":"부딪혀야 제 몫 함, 위험 피하면 → 가치 발휘 못 함, 우산 → 써야 제 역할 함(우산 이야기에 머물러 반만 맞음)","no":"우산 → 옷장에 두면 안 젖음(겉뜻)","dg":"빗댄 장면"},{"id":"5-W4","k":5,"dev":"반어 (겉말과 속뜻이 반대)","s":"'Great timing,' Minho muttered, out of breath, as the bus pulled away the moment he reached the stop.","model":"민호 → 버스 놓쳐 짜증","accept":"운 나빠 속상함, 타이밍 나빠 짜증(반어임을 알면 더 좋음), 버스 놓침(감정이 빠져 반만 맞음)","no":"타이밍 좋음(겉말 그대로), 민호 → 숨참(세부)","dg":"반어"},{"id":"5-W5","k":5,"dev":"동격 은유 (A, the B)","s":"A single drawing class at age nine, the tiny seed of Jiwon's dream, has grown into her plan to study design.","model":"그림 수업 하나 → 디자인 꿈으로 자람","accept":"그림 수업 → 디자인 공부 계획으로 이어짐, 아홉 살 그림 수업 → 디자인 꿈 키움, 어릴 적 그림 수업 → 꿈의 씨앗(비유를 옮기기만 해 반만 맞음), 작은 시작 → 큰 꿈 됨(그림 → 디자인이 빠져 반만 맞음), 지원 → 디자인 공부할 계획(무엇에서 자랐는지가 빠져 반만 맞음)","no":"씨앗 → 자라서 꽃 핌(비유의 겉뜻), 지원 → 아홉 살에 그림 배움(세부만 — 꿈으로 자랐다는 말이 빠짐), 꿈 → 크게 가져야 함(글에 없는 교훈)","dg":"동격 은유"},{"id":"5-W6","k":5,"dev":"속담 인용 (a long journey starts with one step)","s":"Faced with a pile of homework, many students forget the old saying that a long journey starts with one step, and they never begin at all.","model":"숙제 더미 → 한 장부터 시작하면 됨","accept":"많은 숙제 → 조금씩 시작하면 됨, 숙제 더미 → 작은 것부터 손대야 함, 학생들 → 숙제 많으면 시작도 못 함(속담의 뜻이 빠져 반만 맞음)","no":"긴 여행 → 한 걸음부터 시작(속담의 겉뜻 그대로), 학생들 → 숙제를 자주 잊음(forget을 숙제를 잊는다는 말로 잘못 읽음), 숙제 → 양을 줄여야 함(글에 없는 말)","dg":"속담 인용"},{"id":"5-W7","k":5,"dev":"날씨 비유 (a clouded face)","s":"Seoyeon's face had been clouded all week, but the morning her father came home from the hospital, her face finally cleared.","model":"서연 → 아빠 퇴원에 표정 밝아짐","accept":"서연 → 걱정 끝나 밝아짐, 서연 → 우울했다가 기분 풀림, 아빠 퇴원 → 서연 마음 갬, 서연 → 한 주 내내 우울함(앞쪽만 써서 반만 맞음)","no":"날씨 → 한 주 내내 흐림(비유의 겉뜻), 서연 얼굴 → 구름이 걷힘(비유의 겉말 그대로), 아빠 → 병원에서 퇴원함(세부만 — 서연의 마음이 빠짐)","dg":"색 비유"},{"id":"5-W8","k":5,"dev":"반어 (겉말과 속뜻이 반대)","s":"When my little brother came home soaked after forgetting his raincoat again, Mom told him it was a smart way to wash his uniform.","model":"엄마 → 우비 또 잊은 동생 꼬집음","accept":"엄마 → 동생 덜렁댐을 놀림, 엄마 → 또 잊었다고 나무람, 엄마 → 동생을 비꼼(무엇을 꼬집는지가 빠져 반만 맞음)","no":"엄마 → 똑똑하다고 칭찬함(겉말 그대로 — again이 꼬집는 신호), 비 → 교복을 빨아 줌(겉뜻), 동생 → 교복 빨려고 비 맞음(엄마 말을 사실로 믿음), 동생 → 비 맞고 옴(when절의 일만 — 엄마 말뜻이 빠짐)","dg":"반어"}],"paras":[{"id":"P1","title":"길 찾기 앱","sents":[["Most people assume that navigation apps simply make travel easier, and in many ways they do.","반대쪽","앱 → 편리"],["Yet when we follow step-by-step directions on a screen, we pay far less attention to the streets we are actually walking through.","주장","화면 따라가면 → 주변 덜 봄"],["Our eyes stay on the blue line, not on the bakery on the corner or the hill beside the park.","예시","파란 선만 봄"],["As a result, people who always rely on an app may arrive on time but often cannot draw even a rough map of the area afterward.","근거","앱 의존 → 지도 못 그림"],["By contrast, those who find their way by looking at street signs and landmarks gradually build a picture of the neighborhood in their heads.","근거","표지판 보며 → 머릿속 지도"],["This mental map is what lets them take a shortcut or find their way back even without a phone.","근거","머릿속 지도 → 스스로 길 찾음"],["Of course, apps are very useful in an unfamiliar city or in an emergency.","반대쪽","낯선 곳·위급할 땐 유용"],["The real lesson is that convenience has a hidden cost: the less we need to notice, the less we know about the places where we live.","결론","편할수록 → 사는 곳 모름"]],"line":"앱은 편하지만, 화면만 따라가면 주변을 덜 보게 되고, 편할수록 우리가 사는 곳을 모르게 된다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["ways to draw a rough map of a neighborhood","benefits of navigation apps in unfamiliar cities","decline in our knowledge of places as we rely on apps","importance of street signs and landmarks in city planning","role of navigation apps in improving our sense of direction"],"ans":2,"why":"한 줄의 「사는 곳을 모르게 된다」가 정답(decline in our knowledge of places as we rely on apps)과 같아요. 「ways to draw a rough map」은 (4)의 rough map을 빌린 방법 이야기, 「benefits of navigation apps in unfamiliar cities」는 반대쪽 문장 (7), 「importance of street signs and landmarks in city planning」은 (5)의 낱말을 빌렸지만 도시 계획은 글에 없고, 「improving our sense of direction」은 글과 반대예요.","tip":"반대쪽 문장 (1)(7)은 「~지만」으로 접어 두면 뼈대가 바로 보여요."},{"id":"P2","title":"고쳐 쓰기","sents":[["When a toaster or a lamp stops working, most of us simply throw it away and buy a new one, because that often costs less than getting the old one fixed at a shop.","반대쪽","고장 → 버리고 새로 삼"],["Yet fixing something with your own hands can give you more than a working machine.","주장","직접 고치기 → 기계 이상의 것"],["At \"repair cafés,\" now held in many cities, volunteers help visitors open up broken lamps, radios and toys and find out what went wrong.","예시","수리 카페 → 함께 고쳐 봄"],["Many visitors say that the best part is not the repaired item itself but finally understanding how it works.","근거","작동 원리 이해 → 가장 큰 보람"],["Once they discover that a loose wire or a worn-out belt was the only problem, they begin to look at other \"broken\" things at home differently.","근거","원인 알면 → 다른 물건도 달리 봄"],["Fixing things yourself also saves money and keeps useful objects out of the trash, but these are only extra benefits.","근거","돈·쓰레기도 줄임(덤)"],["Of course, not everything can be fixed, and some products are designed to be hard to open.","반대쪽","다 고칠 수는 없음"],["Still, even trying to fix something is a small lesson in curiosity: a broken object is often a question waiting for an answer, not the end of its life.","결론","고장 = 끝 아닌 질문 → 호기심"]],"line":"고장 나면 흔히 새로 사지만, 직접 고치면 작동 원리를 알게 되고 물건을 보는 눈이 바뀐다. 고장은 끝이 아니라 풀어 볼 질문이다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["ways to choose products that are easy to repair","economic benefits of buying new products instead of repairing old ones","how repairing things builds understanding and curiosity","reasons why modern products are designed to be hard to open","role of volunteers in reducing household waste"],"ans":2,"why":"한 줄의 「작동 원리를 알게 되고 … 풀어 볼 질문」이 정답(how repairing things builds understanding and curiosity)과 같아요. 「ways to choose products that are easy to repair」는 글에 없는 고르는 법이고, 「economic benefits of buying new products」는 반대쪽 문장 (1)이에요. 「designed to be hard to open」은 양보 문장 (7)의 세부이고, 「reducing household waste」는 글쓴이가 덤으로 붙인 (6)을 요점으로 잡았어요.","tip":"(6)처럼 「but these are only extra benefits」로 스스로 덤이라고 낮춘 문장은 요점이 아니에요. (8)의 비유가 (2)의 주장을 다시 말해요."},{"id":"P3","title":"도시의 새","sents":[["Human noise is changing the way some birds sing.","주장","소음 → 새 노래 바뀜(화제)"],["In quiet forests, many songbirds use low notes, which carry well through the trees.","근거","숲 → 낮은 음 잘 퍼짐"],["In busy cities, however, the low rumble of traffic can cover those same notes, so a song may never reach the bird it was meant for.","근거","도시 소음 → 노래 묻힘"],["Researchers comparing city and forest birds of the same species have found that city birds often sing higher, louder or earlier in the morning, before traffic builds up.","근거","도시 새 → 높게·크게·일찍",["예시"]],["At first glance, this looks like a happy story of nature adjusting to us.","반대쪽","겉보기엔 → 잘 적응함"],["But a higher song may be less attractive to possible mates, and singing louder takes extra energy.","근거","짝 덜 끌고 힘 더 듦"],["In other words, the birds are not simply adapting; they are paying a price for our noise.","주장","★ 적응 아닌 대가(핵심)"],["A quieter city, then, would be a gift not only to the people who live there but also to the birds that share it with us.","결론","조용한 도시 → 새에게도 선물"]],"line":"소음 때문에 도시 새는 노래를 바꾸는데, 적응처럼 보여도 실은 대가를 치르는 것이니 조용한 도시는 새에게도 선물이다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["how city birds learn new songs from one another","hidden costs that birds pay for adjusting to human noise","reasons why low-pitched songs travel well in forests","advantages of early morning singing for city birds","ways to reduce traffic noise in crowded cities"],"ans":1,"why":"한 줄의 「적응처럼 보여도 실은 대가」가 정답(hidden costs that birds pay for adjusting to human noise)과 같아요. 「learn new songs from one another」는 글에 없고, 「low-pitched songs travel well in forests」는 배경 문장 (2)의 세부예요. 「advantages of early morning singing」은 (4)의 earlier를 좋은 점으로 비튼 말이고, 「ways to reduce traffic noise」는 (8)에서 끌어냈지만 방법은 글에 없어요.","tip":"(1)은 화제를 꺼내는 주장이고, 핵심 주장은 (7)이에요. (5) At first glance는 겉보기, 곧 반대쪽이고, (7) In other words가 (6)까지를 한마디로 묶어요."},{"id":"P4","title":"밤하늘","sents":[["When a small mountain town replaced its bright streetlights with dimmer ones that point downward, something unexpected happened.","예시","가로등 → 덜 밝게·아래로"],["Within a year, visitors began arriving at night, not for restaurants or shops, but simply to look at the stars that were now easy to see.","예시","별 잘 보임 → 사람 옴"],["This is a reminder that darkness, which we usually try to remove, can be something worth keeping.","주장","어둠 → 지킬 가치"],["Today, many people who grow up in cities have never seen the Milky Way, because the glow of artificial light hides all but the brightest stars.","근거","도시 불빛 → 은하수 가림"],["Too much light at night can also confuse animals, such as baby sea turtles, which may crawl toward street lamps instead of the sea.","근거","밤빛 → 동물 헷갈림"],["Of course, streetlights help people feel safe, and no one is asking towns to turn them all off.","반대쪽","가로등 → 안전에 필요"],["The point is to use light more wisely: only where it is needed, and only as bright as it needs to be.","주장","필요한 곳에 알맞게만"],["After all, a dark sky is not an empty space above us but a shared treasure that we are slowly losing.","결론","어두운 하늘 = 잃어 가는 보물"]],"line":"어둠도 지킬 가치가 있다. 밤빛이 별과 동물을 가리니, 안전은 지키되 필요한 만큼만 밝혀 어두운 하늘이라는 보물을 지키자.","q":"윗글의 주제로 가장 적절한 것은?","opts":["role of streetlights in keeping towns safe at night","value of darkness and the need to use light wisely","how stargazing tourism helps small mountain towns grow","ways baby sea turtles find their way to the sea","harmful effects of artificial light on wild animals"],"ans":1,"why":"한 줄의 「어둠도 지킬 가치 … 필요한 만큼만 밝혀」가 정답(value of darkness and the need to use light wisely)과 같아요. 「keeping towns safe at night」는 양보 문장 (6)이고, 「stargazing tourism」은 첫 사례 (2)의 세부만 키운 말이에요. 「sea turtles」와 「harmful effects of artificial light on wild animals」는 근거 (5) 하나만 키운 말이에요.","tip":"글이 사례로 시작하면 (3) This is a reminder처럼 사례를 묶는 문장이 주장이에요."},{"id":"P5","title":"종 없는 학교","sents":[["A school day without bells may teach students something no textbook can: how to manage their own time.","주장","종 없는 학교 → 시간 관리 배움"],["One high school switched off its bells and simply posted a timetable, so students had to check the clocks themselves.","예시","종 끈 학교 → 스스로 시계 봄"],["Within a month, lateness had hardly risen, the hallways were calmer, and many students said they had begun to plan their own breaks.","예시","종 끈 뒤 → 지각 안 늚·스스로 계획",["근거"]],["When a bell decides every move, students never need to glance at the clock, so they rarely practice planning their time.","근거","종이 다 정함 → 계획 연습 드묾"],["It is true that a bell gives a clear signal, and some teachers worry that students will wander the hallways without one.","반대쪽","종 = 분명한 신호·떠돌까 걱정"],["Yet students who always depend on bells may struggle later at university or at work, where no one rings a bell before deadlines.","근거","종에 기대면 → 나중에 고생"],["Being a minute late costs much less in high school than at work, so school is a safe place to practice and learn from small mistakes.","근거","학교 = 실수해도 되는 연습장"],["Turning off the bell, then, is not really about quieter hallways; it is about handing students the clock and trusting them with it.","결론","종 끄기 = 시간을 학생에게 맡김",["주장"]]],"line":"종 없는 학교는 스스로 시간을 관리하는 법을 가르친다. 종이 다 정하면 계획 연습이 드물고 학교는 실수해도 되는 연습장이니, 종을 끄는 것은 시간을 학생에게 맡기는 일이다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["calmer and more orderly school days without bells","need for clear bell signals to keep students on time","importance of being on time at school and later at work","time management skills gained in schools without bells","fewer late arrivals in schools that switch off bells"],"ans":3,"why":"한 줄의 「스스로 시간을 관리하는 법」이 정답(time management skills gained in schools without bells)과 같아요. 「calmer and more orderly school days」는 (3)의 세부(the hallways were calmer)를 주제로 키운 말인데, (8)이 (not really about quieter hallways)로 요점이 아니라고 막아요. 「need for clear bell signals」는 양보 문장 (5)를 주제로 잡은 말인데, (6)의 Yet이 다시 뒤집어요. 「fewer late arrivals」는 (3)을 비튼 말이에요. (lateness had hardly risen)은 지각이 거의 늘지 않았다는 말이지 줄었다는 말이 아니에요. 「importance of being on time」은 그럴듯한 교훈이지만, (7)이 (Being a minute late costs much less in high school than at work)로 제때 오기는 요점이 아니라고 해요. 글은 시간을 스스로 계획하기를 말해요.","tip":"첫 문장이 바로 주장인 글이에요. (5) It is true that은 양보(반대쪽)이고, (6) Yet이 다시 주장 쪽으로 돌아와 근거를 보태요. (8)은 (not really about quieter hallways)로 곁가지를 지우고 (1)을 다시 말해요."},{"id":"P6","title":"동네 서점의 변신","sents":[["In one small city, an old bookstore that was about to close began holding a cozy reading night every Friday.","예시","문 닫을 서점 → 금요 독서 모임 엶"],["Neighbors who came for the readings often stayed to chat, and many went home with a novel the owner had recommended.","예시","모임 온 이웃 → 이야기·추천 책 삼"],["Many people believe small bookstores cannot survive, since online stores often sell the same books for less and deliver them overnight.","반대쪽","온라인 싸고 빠름 → 서점 못 버팀"],["Yet some bookstores are surviving by becoming places where people meet, not just shops where books are sold.","주장","작은 서점 → 만나는 곳 되어 살아남음"],["A website can suggest titles from your past orders, but it cannot give you a conversation with a person who loved the book.","근거","웹사이트 → 사람과의 대화는 못 줌"],["Author talks, story hours and book clubs give people a reason to visit in person, and visitors often buy something before leaving.","근거","행사 → 찾아올 까닭·뭔가 사 감",["예시"]],["Such a store also becomes part of the neighborhood, so people feel they are helping their own community whenever they browse there.","근거","동네 서점 → 들르면 동네 돕는 느낌"],["What keeps a small bookstore alive, then, may be less the books on its shelves than the people it brings together.","결론","서점 살리는 것 = 책보다 모이는 사람",["주장"]]],"line":"문 닫을 뻔한 서점이 독서 모임으로 사람을 모았다. 흔히 온라인 때문에 작은 서점은 못 버틴다고 하지만, 어떤 서점은 사람이 만나는 곳이 되어 살아남고, 서점을 살리는 것은 책보다 모이는 사람이다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["survival of small bookstores as places where people meet","survival of small bookstores through careful book choices","value of supporting local shops over big online stores","decline of small bookstores in the age of online shopping","popularity of Friday reading nights in one small city"],"ans":0,"why":"한 줄의 「어떤 서점은 사람이 만나는 곳이 되어 살아남고」가 정답(survival of small bookstores as places where people meet)과 같아요. 「through careful book choices」는 (2)의 주인이 권한 소설(a novel the owner had recommended)에 끌린 말인데, (8)이 (less the books on its shelves than the people it brings together)로 책보다 사람이라고 막아요. 「decline of small bookstores」는 통념 문장 (3)을 주제로 잡은 말인데 (4)의 Yet이 뒤집어요. 「value of supporting local shops」는 근거 (7) 하나를 흔한 교훈으로 키운 말로, 글은 온라인 대신 동네 가게를 쓰자고 하지 않아요. 「Friday reading nights」는 첫 사례 (1)의 세부예요.","tip":"이야기로 시작하는 글은 사례 뒤의 통념 (3) Many people believe와 그것을 뒤집는 (4) Yet을 찾으면 주장이 보여요. (8)의 (less the books on its shelves than the people it brings together)가 (4)를 다시 말해요."},{"id":"P7","title":"동네 하천 되살리기","sents":[["For much of the last century, many towns covered their small streams with concrete, because a hidden stream seemed cleaner and safer.","반대쪽","하천 덮기 → 깨끗·안전해 보임"],["Covering a stream also made room for roads and parking lots, which growing towns badly needed.","반대쪽","덮으면 → 길·주차장 생김",["근거"]],["But when one town tore up the pavement and let its stream run in the open again, ducks and fish returned within a few years.","예시","덮개 걷은 하천 → 오리·물고기 돌아옴",["근거"]],["Opening a stream is expensive, of course, and some shopkeepers in that town worried about losing their parking spaces.","반대쪽","하천 열기 → 돈 듦·주차 걱정"],["Still, bringing a stream back into the open may give a neighborhood far more than the parking spaces it takes away.","주장","하천 되살리기 → 잃는 것보다 얻는 것 큼"],["An open stream can also hold more rainwater than a narrow underground pipe, so heavy rain may flood fewer nearby streets.","근거","열린 하천 → 큰비에도 덜 넘침"],["In that town, a new footpath along the water soon filled with walkers, and shops that had feared losing parking gained customers.","예시","물가 길 → 걷는 사람·가게 손님 늚",["근거"]],["A stream under concrete is only a drain, but a stream in the open can become the heart of a neighborhood.","결론","열린 하천 → 배수로 아닌 동네 중심",["주장"]]],"line":"흔히 하천은 덮는 편이 깨끗하고 쓸모 있다고 여겼고 되살리는 데는 돈과 주차 걱정이 따르지만, 하천을 되살리면 잃는 것보다 얻는 것이 크다. 오리와 물고기가 돌아오고 큰비에도 덜 넘치며, 열린 하천은 동네의 중심이 된다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["benefits of covering streams for cleaner and safer towns","benefits of open streams for wildlife rather than people","high costs of opening streams for local shop owners","benefits of open streams for shops rather than wildlife","benefits of letting buried streams run in the open again"],"ans":4,"why":"한 줄의 「하천을 되살리면 잃는 것보다 얻는 것이 크다」가 정답(benefits of letting buried streams run in the open again)과 같아요. 「benefits of covering streams」는 통념 (1)(2)를 주제로 잡은 말인데 (5)의 Still이 뒤집어요. 「for wildlife rather than people」는 (3)의 오리와 물고기에 끌린 말인데, 글은 (7)의 걷는 사람 · 손님과 (8)의 (the heart of a neighborhood)처럼 동네 사람이 얻는 것을 말해요. 「high costs of opening streams」는 양보 (4)이고, (7)에서 가게는 오히려 손님을 얻었어요(gained customers). 「for shops rather than wildlife」는 (7)의 가게 손님(gained customers)에 끌린 말인데, (3)에서 오리와 물고기도 돌아왔고(ducks and fish returned) 글은 어느 한쪽을 앞세우지 않아요.","tip":"통념이 두 번 나오는 글이에요. (1)(2)는 하천을 덮던 까닭, (4)는 되살릴 때의 걱정이고, 주장은 다섯째 문장 (5) Still에서야 나와요. 주장이 늦게 나와도 (8)이 비유로 다시 말해 줘요. (3)의 But 뒤는 주장이 아니라 한 마을의 사례(예시)예요."},{"id":"P8","title":"모둠 과제의 무임승차","sents":[["In group projects, one student often stays up late finishing the slides while the others simply add their names at the end.","예시","모둠 과제 → 한 명만 일함(문제)",["근거"]],["A common answer is to grade each member separately or let classmates rate one another in secret, so that free riders lose points.","반대쪽","흔한 해결 → 따로 채점·서로 평가"],["There may be a simpler fix that works better: keeping groups small, with three members instead of five or six.","주장","더 나은 해결 → 모둠을 작게"],["In a group of six, one member can easily stay silent and go unnoticed, since the other five can finish without help.","근거","6명 → 한 명 빠져도 티 안 남"],["In a group of three, however, every missing part is obvious, and even shy members are more likely to be heard.","근거","3명 → 빠지면 바로 보임·말도 들림"],["One teacher who switched from groups of six to groups of three found that nearly every student took part, not just the usual leaders.","예시","3명 모둠 반 → 거의 모두 참여",["근거"]],["Separate grades, by contrast, may catch free riders after a project ends but do little to bring them into the work.","근거","따로 채점 → 참여는 못 끌어냄"],["In other words, free riding is often a sign not of lazy students but of groups in which hiding is too easy.","결론","무임승차 = 게으름 아닌 숨기 쉬운 모둠 탓",["주장"]]],"line":"모둠 과제에서는 흔히 한 명만 일한다. 따로 채점하거나 서로 평가하게 하는 것이 흔한 해결책이지만 모둠을 작게 하는 편이 낫다. 작으면 빠진 몫이 바로 보이고 모두 참여하게 되니, 무임승차는 게으른 학생이 아니라 숨기 쉬운 모둠의 문제인 때가 많다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["separate grades as a fair fix for free riding in projects","clear roles for each member as a cure for free riding","small groups as a simple fix for free riding in projects","habits of lazy students who avoid doing group work","role of the usual leaders in planning group projects"],"ans":2,"why":"한 줄의 「모둠을 작게 하는 편이 낫다」가 정답(small groups as a simple fix for free riding in projects)과 같아요. 「separate grades as a fair fix」는 흔한 해결책 (2)를 주제로 잡은 말인데, (3)이 더 나은 방법을 내놓고 (7)이 따로 채점은 (do little to bring them into the work)라고 막아요. 「clear roles for each member」는 모둠 과제에서 흔히 떠올리는 해결책일 뿐, 글은 역할 나누기를 말하지 않고 모둠의 크기를 말해요(keeping groups small). 「habits of lazy students」는 (8)이 (not of lazy students)로 막는 말이고, 「role of the usual leaders」는 사례 (6)의 세부(not just the usual leaders)를 비튼 말이에요.","tip":"문제 → 흔한 해결책 → 다른 해결책 꼴이에요. (2) A common answer는 남들이 쓰는 방법(반대쪽)이고, 주장 (3)에는 but · yet 같은 신호 말이 없어요. (7)은 흔한 해결책을 다시 꺼내지만 그 한계를 짚는 근거예요. (1)은 문제를 보여 주는 장면이에요(예시 · 근거 둘 다 인정)."}]},"adv":{"choose":[{"id":"S1-1","k":1,"dev":"not least because","s":"In one village, the volunteer fire brigade has become the most trusted institution, not least because its members are neighbors who respond within minutes.","a":"의용 소방대 → 가장 신뢰받는 기관","why":"not이 보여도 뒤집는 말이 아니에요. not least because는 「무엇보다 ~ 때문에」라는 까닭이라, 요점은 그 앞 주절(the volunteer fire brigade has become the most trusted institution)이에요.","tr":[["이웃 대원 → 몇 분 만에 출동","not 뒤가 답이라는 요령에 끌린 답이에요. not least because 뒤는 까닭(its members are neighbors who respond within minutes)일 뿐 앞말을 뒤집지 않아요."],["의용 소방대 → 대원 구하기 힘듦","시골 소방대 이야기에 흔히 나오는 걱정이지만 이 문장에는 없어요."],["의용 소방대 → 가장 바쁜 기관","the most trusted institution을 같은 틀에서 낱말만 바꿨어요. 문장은 가장 신뢰받는 기관이라고 했지 가장 바쁘다고 하지 않았어요."]]},{"id":"S1-2","k":1,"dev":"all but","s":"Lighthouse keepers' logbooks, which recorded the wind every few hours and were all but forgotten for decades, have become essential for researchers studying past storms.","a":"등대 일지 → 옛 폭풍 연구에 필수","why":"all but은 but이 들어 있어도 대조가 아니라 「거의」라는 뜻이에요. which 뒤(all but forgotten for decades)는 일지가 지나온 사정을 덧붙인 말이고, 요점은 주절(have become essential for researchers studying past storms)이에요.","tr":[["등대 일지 → 수십 년간 거의 잊힘","but 뒤가 답이라는 요령에 끌린 답이에요. all but forgotten for decades는 지난 사정일 뿐, 지금 일지가 어떤 대접을 받는지는 주절이 말해요."],["등대 자동화로 등대지기 사라짐","등대에 관해 흔히 듣는 이야기지만 이 문장에는 없어요."],["등대 일지 → 날씨 예보에 쓰임","일지가 쓰이는 곳을 비틀었어요. 문장은 지난 폭풍을 연구하는 사람들(researchers studying past storms)에게 꼭 필요해졌다고 했지 예보 이야기는 없어요."]]},{"id":"S1-3","k":1,"dev":"however + 형용사","s":"In one study, however effective they were at blocking chatter, noise-cancelling headphones helped students concentrate only when working on tasks of their own choosing.","a":"헤드폰은 직접 고른 과제만 도움","why":"however 뒤에 형용사가 바로 오면 「아무리 ~해도」라는 양보예요. 뒤집는 신호가 아니니 요점은 주절(noise-cancelling headphones helped students concentrate only when working on tasks of their own choosing)이에요.","tr":[["헤드폰은 잡담을 잘 막아 줌","however 뒤가 답이라는 요령에 끌린 답이에요. however effective they were at blocking chatter는 양보로 접어 둔 말이에요."],["헤드폰은 어떤 과제든 집중 도움","문장은 스스로 고른 과제를 할 때만 도움이 됐다고 했어요(only when working on tasks of their own choosing). 범위를 넓혔어요."],["헤드폰은 쉬운 과제에만 도움","도움이 된 때를 좁힌 것은 맞지만, 기준은 쉬운 과제가 아니라 학생이 스스로 고른 과제(tasks of their own choosing)예요."]]},{"id":"S1-4","k":1,"dev":"given that","s":"Given that mining rare earth metals often leaves toxic waste behind, some engineers argue that recycling old phones deserves more public support.","a":"폐휴대폰 재활용 더 지원해야","why":"given that은 「~을 생각하면」이라는 바탕을 까는 말이에요. 요점은 주절의 주장(some engineers argue that recycling old phones deserves more public support)이에요.","tr":[["희토류 채굴 → 독성 폐기물 남김","given that 뒤의 바탕(mining rare earth metals often leaves toxic waste behind)만 옮겼어요. 그 바탕 위에서 무엇을 주장하는지가 요점이에요."],["희토류 → 몇몇 나라에 몰려 있음","희토류 이야기에 자주 나오는 말이지만 이 문장에는 없어요."],["채굴 멈추고 재활용으로 대체","문장은 재활용을 더 지원하자고 했을 뿐 채굴을 멈추자고 하지 않았어요. 주장의 정도를 키운 말이에요."]]},{"id":"S1-5","k":1,"dev":"in that","s":"One old timber school survived an earthquake better than the nearby concrete hall, in that the school's wooden joints could flex as the ground shook.","a":"목조 학교 → 지진에 더 잘 버팀","why":"in that은 「~라는 점에서」, 곧 까닭을 붙이는 말이에요. 요점은 주절(One old timber school survived an earthquake better than the nearby concrete hall)이에요.","tr":[["이음새 → 흔들림 따라 휘어짐","in that 뒤의 까닭(the school's wooden joints could flex as the ground shook)만 옮겼어요. 왜 잘 버텼는지 풀어 줄 뿐 요점은 앞 주절이에요."],["오래된 건물 → 보강이 필요함","지진 이야기에 흔히 나오는 교훈이지만 문장에 없어요. 오히려 낡은 목조 학교가 잘 버텼다고 했어요."],["목조 학교 → 지진 뒤 고치기 쉬움","휘는 이음새 이야기에 끌려 그럴듯하게 지어낸 말이에요. 문장은 지진을 더 잘 견뎠다고 했지(survived an earthquake better) 고치기 쉽다는 말은 없어요."]]},{"id":"S1-6","k":1,"dev":"now that","s":"Now that one county archive has scanned its land records, historians who once waited weeks for files can trace a property's history within hours.","a":"땅 내력 찾기 → 몇 시간이면 됨","why":"now that은 「이제 ~했으니」라는 바뀐 사정이에요. 요점은 그래서 무엇이 달라졌는지를 말하는 주절(historians who once waited weeks for files can trace a property's history within hours)이에요.","tr":[["보관소 → 옛 토지 기록 스캔","now that 뒤의 바뀐 사정(one county archive has scanned its land records)만 옮겼어요. 그 덕에 생긴 변화가 요점이에요."],["디지털화가 낡은 원본 지켜 줌","기록을 스캔하는 까닭으로 흔히 드는 말이지만 이 문장에는 없어요."],["땅 내력 찾기 → 누구나 할 수 있음","문장은 역사가들의 일이 빨라졌다고 했지(historians who once waited weeks for files) 누구나 할 수 있게 됐다고 하지 않았어요. 범위를 넓혔어요."]]},{"id":"S1-7","k":1,"dev":"owing to","s":"Clay-jar soybean paste still outsells factory brands at one village market, owing to a distinctive flavor older shoppers associate with childhood.","a":"장독 된장이 공장 된장보다 잘 팔림","why":"owing to는 까닭을 붙이는 말이에요. 요점은 주절(Clay-jar soybean paste still outsells factory brands)이에요.","tr":[["된장 맛 → 어린 시절 떠올리게 해 줌","owing to 뒤의 까닭(a distinctive flavor older shoppers associate with childhood)만 옮겼어요."],["발효 음식은 장 건강을 도와줌","발효 음식에 흔히 붙는 말이지만 이 문장에는 없어요."],["젊은 손님 → 공장 된장 더 찾음","문장에는 나이 든 손님(older shoppers)만 나와요. 젊은 손님 이야기는 글 낱말을 비틀어 지어낸 말이에요."]]},{"id":"S1-8","k":1,"dev":"whereby","s":"A seed bank that lends seeds to farmers may keep old varieties alive better than a sealed vault, through a scheme whereby borrowers return extra seeds.","a":"씨앗 대여 → 옛 품종 더 잘 지킴","why":"whereby는 「그 방식에 따라 ~하는」이라는 꾸밈말이라 제도가 돌아가는 방식을 덧붙여요. 요점은 주절(A seed bank that lends seeds to farmers may keep old varieties alive better than a sealed vault)이에요.","tr":[["씨앗 대여 → 농부 수확 늘려 줌","씨앗을 빌려준다는 데서 그럴듯하게 지어낸 효과예요. 문장이 말한 효과는 옛 품종을 살려 두는 것이에요(keep old varieties alive)."],["빌린 농부 → 씨앗 더 얹어 돌려줌","whereby 뒤의 방식(borrowers return extra seeds)만 옮겼어요. 요점은 그 은행이 무엇을 해내는지예요."],["종자 은행 → 기후 변화 대비책","종자 은행에 흔히 붙는 말이지만 이 문장에는 없어요."]]},{"id":"S1-9","k":1,"dev":"동격 that절 (the finding that ~)","s":"The finding that one damaged reef recovered faster where grazing fish were protected has persuaded several island councils to limit net fishing.","a":"여러 섬 의회 → 그물 어업 제한","why":"The finding that ~ protected까지가 통째로 주어예요. 요점은 그 주어가 무엇을 했는지, 곧 주절의 동사 부분(has persuaded several island councils to limit net fishing)이에요.","tr":[["물고기 보호 → 산호 빨리 회복","the finding that 뒤는 발견의 내용(one damaged reef recovered faster where grazing fish were protected)이에요. 문장이 말하려는 것은 그 발견 때문에 일어난 일이에요."],["산호초는 바다 온도 오르면 죽음","산호초에 관해 흔히 듣는 이야기지만 이 문장에는 없어요."],["섬 의회 → 물고기 방류 늘림","의회가 한 일은 그물 어업을 줄인 것이에요(limit net fishing). 물고기를 풀어 놓았다는 말은 없고, 물고기 보호라는 글의 흐름을 빌려 지어낸 말이에요."]]},{"id":"S1-10","k":1,"dev":"with + 독립분사구문 (with X having done)","s":"In one hospital trial, night nurses who ate before midnight reported fewer stomach complaints, with many of them having also slept longer after their shifts.","a":"자정 전 식사 → 속 불편 줄어듦","why":"with + 명사 + having p.p.는 덧붙이는 세부예요. 요점은 주절(night nurses who ate before midnight reported fewer stomach complaints)이에요.","tr":[["야간 근무 뒤 → 더 오래 자게 됨","with 뒤에 덧붙은 세부(many of them having also slept longer after their shifts)만 옮겼어요. also가 보여 주듯 곁들인 이야기예요."],["야간 근무는 건강을 해침","야간 근무에 흔히 붙는 말이지만 이 문장에는 없어요."],["자정 전 식사 → 피로를 덜 느낌","그럴듯하지만 문장에 없어요. 문장이 말한 효과는 속 불편이 줄어든 것이에요(fewer stomach complaints)."]]},{"id":"S2-1","k":2,"dev":"Granted, ~. Still, ~","s":"Granted, in many comparisons organic farms harvest less per hectare than conventional ones. Still, the gap appears to shrink considerably when growers plant several crops together in one field, a practice which tends to keep pests in check.","a":"섞어짓기 → 수확 차이 줄어듦","why":"Granted로 앞 문장은 인정만 하고, 요점은 Still 뒤(the gap appears to shrink considerably when growers plant several crops together)예요. 수확이 적다는 사실은 그대로 두고, 그 차이가 줄어든다고 말해요.","tr":[["유기농 농장 → 수확량 더 적음","Granted로 인정하고 넘어간 앞 문장(organic farms harvest less per hectare)만 옮겼어요. 맞는 말로 남지만, 글이 하려는 말은 Still 뒤예요."],["퇴비 쓰기 → 수확 차이 줄어듦","같은 틀에서 조건만 바꿨어요. 글이 든 조건은 퇴비가 아니라 여러 작물을 한 밭에 섞어 심는 것(when growers plant several crops together)이에요."],["섞어짓기 → 해충을 막아 줌","which 뒤 세부(tends to keep pests in check)만 옮겼어요. 맞는 말로 나오지만, 요점은 그 방법을 쓰면 수확 차이가 줄어든다는 거예요."]]},{"id":"S2-2","k":2,"dev":"Admittedly ~; yet ~","s":"Admittedly, early risers in one survey rated themselves as more productive; yet when output was measured, theirs proved virtually identical to that of late risers, who saved demanding tasks for the evening.","a":"아침형 인간 → 성과는 차이 없음","why":"Admittedly 쪽은 인정하고 넘어간 말이고, 요점은 yet 뒤(theirs proved virtually identical to that of late risers)예요.","tr":[["아침형 인간 → 생산성 더 높음","Admittedly 쪽(rated themselves as more productive)은 스스로 매긴 점수예요. 성과를 재 보니(when output was measured) 저녁형과 같았어요."],["저녁형 인간 → 성과 더 뛰어남","아침형이 낫다는 생각을 거꾸로 뒤집었지만, 글은 둘이 거의 같다(virtually identical)고 해요."],["저녁형 인간 → 어려운 일에 강함","who 뒤 세부(saved demanding tasks for the evening)는 저녁형이 어려운 일을 몰아 둔 시간일 뿐이에요. 어려운 일에 강하다는 말은 없어요."]]},{"id":"S2-3","k":2,"dev":"For all ~ (= ~에도 불구하고), ~","s":"For all the warnings issued after the last eruption, most farmers in one valley returned within a year, drawn back by soil which, they claimed, the ash had enriched.","a":"농부들 → 경고에도 돌아옴","why":"For all은 「~에도 불구하고」예요. 앞은 경고 이야기이고, 요점은 주절(most farmers in one valley returned within a year)이에요.","tr":[["분화 경고 → 농부들 안 돌아옴","For all 쪽의 경고(the warnings issued after the last eruption)에 끌린 답이에요. 경고가 있었는데도 한 해 안에 돌아왔어요(returned within a year)."],["화산재 → 땅 기름지게 함","drawn back by 뒤는 돌아온 까닭이고, 그것도 농부들의 주장(they claimed)이에요. 흔히 아는 말이라 끌리지만 요점이 아니에요."],["분화 뒤 → 인구 전보다 늘어남","돌아왔다(returned within a year)는 말을 인구가 늘었다는 말로 키웠어요. 전보다 사람이 많아졌다는 말은 없어요."]]},{"id":"S2-4","k":2,"dev":"What was long dismissed as ~ turns out to be ~","s":"What was long dismissed as a natural scatter of stones on one desert plateau turns out to be part of an ancient road network, which may have linked oases several days' walk apart.","a":"흩어진 돌 → 고대 도로 흔적","why":"What was long dismissed as 쪽은 오래 잘못 여겨 온 생각이고, 요점은 turns out to be 뒤(part of an ancient road network)예요.","tr":[["흩어진 돌 → 자연이 만든 것","What was long dismissed as 쪽(a natural scatter of stones)은 오래 잘못 여겨 온 생각이에요."],["흩어진 돌 → 옛 별자리 지도","뜻밖의 정체라 그럴듯하지만, 글이 밝힌 정체는 길(an ancient road network)이에요."],["흩어진 돌 → 오아시스 잇던 물길","linked oases를 빌려 정체를 바꿨어요. 오아시스를 이었을 수 있는 것은 물길이 아니라 길(an ancient road network)이에요."]]},{"id":"S2-5","k":2,"dev":"~, or so the story goes. In fact, ~","s":"Medieval townspeople rarely washed, regarding water as a source of disease, or so the story goes. In fact, records from several cities list many public bathhouses, which were apparently popular enough that local authorities regulated their opening hours.","a":"중세 도시엔 목욕탕이 인기","why":"or so the story goes는 「~라고들 하지만」이라는 뜻이에요. 요점은 In fact 뒤(records from several cities list many public bathhouses ... apparently popular)예요.","tr":[["중세 사람은 거의 안 씻음","or so the story goes가 붙은 앞 문장(Medieval townspeople rarely washed)은 떠도는 이야기일 뿐이에요."],["중세 사람 → 집에서 대야로 씻음","옛이야기를 뒤집는 말이라 그럴듯하지만, 글이 든 증거는 집이 아니라 공중목욕탕(public bathhouses)이에요."],["목욕탕 → 시간 규제로 쇠퇴","시간 규제(regulated their opening hours)를 빌려 쇠퇴했다는 말을 지어냈어요. 규제는 인기가 많았다는 표시로 나와요."]]},{"id":"S2-6","k":2,"dev":"신호 말 없는 대조 (첫 문장 통념, 둘째 문장 자료로 반박 — but/however/yet 없이)","s":"Half an hour of video streaming, according to figures once widely shared, emitted as much carbon as driving several kilometers. Later estimates, which accounted for more efficient data centers and networks, put the figure at a small fraction of that.","a":"스트리밍 → 운전보다 탄소 적음","why":"but · however 같은 신호 말은 없지만, 첫 문장은 한때 널리 퍼진 수치(figures once widely shared)이고 둘째 문장이 그 수치를 바로잡아요. 요점은 둘째 문장(put the figure at a small fraction of that)이에요.","tr":[["스트리밍 → 운전만큼 탄소 배출","첫 문장은 한때 널리 퍼진 수치(as much carbon as driving several kilometers)예요. 둘째 문장이 이 수치를 바로잡아요."],["효율 개선 → 오히려 배출 늘림","효율(more efficient data centers)을 빌려 뜻밖의 반전을 지어냈어요. 글에서 효율은 수치를 낮춘 까닭으로 나와요."],["스트리밍 → 운전보다 탄소 많음","처음 수치를 바로잡은 방향을 거꾸로 잡았어요. 나중 추정은 수치를 아주 작게(a small fraction of that) 줄였어요."]]},{"id":"S2-7","k":2,"dev":"Paradoxically, ~","s":"Paradoxically, the very water that sustained those harvests may have hastened their decline, since the salts it carried gradually accumulated in fields that drained poorly.","a":"관개용수 → 오히려 쇠퇴 부름","why":"Paradoxically는 거꾸로 된 일을 알리는 말이에요. 요점은 그 뒤(the very water that sustained those harvests may have hastened their decline)이고, since 뒤는 그 까닭이에요.","tr":[["운하 → 메마른 땅에 밀 농사","앞 문장(allowed farmers to grow wheat on land that received very little rain)의 내용이에요. 이 문장은 그 물이 낳은 거꾸로 된 결과를 말해요."],["오랜 가뭄 → 고대 농업 무너뜨림","흔히 떠올리는 까닭이지만, 글은 비가 모자란 것이 아니라 물이 실어 온 소금(the salts it carried)을 탓해요."],["운하 → 오히려 홍수 일으킴","운하가 거꾸로 해를 끼쳤다는 꼴은 같지만, 글이 말하는 해는 홍수가 아니라 밭에 쌓인 소금(gradually accumulated in fields that drained poorly)이에요."]],"ctx":"In parts of ancient Mesopotamia, networks of canals allowed farmers to grow wheat on land that received very little rain."},{"id":"S2-8","k":2,"dev":"두 번 뒤집기 (but ... 그리고 다시 however로 범위를 좁힘)","s":"Wind turbines are often blamed for killing birds, but estimates suggest they cause far fewer deaths than glass windows or cats. For some large birds of prey, however, turbines built where those birds hunt or migrate may still pose a serious threat.","a":"피해 적어도 맹금류엔 위험","why":"but으로 한 번 뒤집고(they cause far fewer deaths than glass windows or cats), however로 다시 범위를 좁혀요. 요점은 마지막(For some large birds of prey ... may still pose a serious threat)이에요. 피해가 적다는 것과 맹금류에게는 위험하다는 것을 함께 담아야 해요.","tr":[["풍력 발전기 → 새 피해 적음","but 뒤까지만 읽은 답이에요. however로 다시 좁힌 말(may still pose a serious threat)을 놓쳤어요."],["풍력 발전기가 새를 많이 죽임","첫머리의 흔한 탓(are often blamed for killing birds)에 끌린 답이에요. 바로 but으로 뒤집혀요."],["피해 적어도 바닷새엔 위험","바다 풍력과 바닷새 걱정은 흔히 듣는 말이지만, 글이 위험을 남겨 둔 쪽은 큰 맹금류(some large birds of prey)예요."]]},{"id":"S2-9","k":2,"dev":"It is true that ~ — and (뒤집지 않는 It is true that: 양보가 아니라 긍정 — 리듬 깨기)","s":"It is true that pesticides can harm honeybees — and the harm may be greatest when the chemicals reach colonies whose defenses have already been weakened by parasitic mites and poor nutrition.","a":"약해진 벌 무리 → 농약 피해 커짐","why":"It is true that 뒤에 but이 오지 않고 and로 이어져요. 앞말을 뒤집지 않고 더 보태는 거예요. 요점은 뒤(the harm may be greatest when the chemicals reach colonies whose defenses have already been weakened)예요.","tr":[["꿀벌 감소 → 농약보다 진드기 탓","It is true that을 양보로 보고 뒤집힐 거라 짐작한 답이에요. 글은 농약 피해를 그대로 인정하고(pesticides can harm honeybees), 진드기는 무리를 약하게 만드는 것으로만 나와요."],["진드기 → 벌 무리 약하게 함","whose 뒤 세부(weakened by parasitic mites and poor nutrition)만 옮겼어요. 맞는 말이지만, 문장이 말하려는 것은 그렇게 약해진 무리에서 농약 피해가 커진다는 거예요(the harm may be greatest)."],["들꽃 심기 → 벌 무리 되살림","흔히 듣는 해결책이지만 글에 없어요."]]},{"id":"S2-10","k":2,"dev":"Even if ~, ~ (양보절 뒤 주절이 핵심이지만 양보절이 사실로 인정되는 꼴)","s":"Even if daylight saving time trims evening lighting use slightly, some regional studies suggest that this saving is largely offset by greater demand for heating and air conditioning.","a":"조명 절약 → 냉난방에 상쇄됨","why":"Even if 쪽(trims evening lighting use slightly)을 주절이 this saving으로 다시 받아 인정해요. 요점은 주절(this saving is largely offset by greater demand for heating and air conditioning)이에요. 아낀 것과 그것이 상쇄되는 것을 함께 담아야 해요.","tr":[["서머타임 → 조명 전기 아낌","Even if 쪽만 옮겼어요. 맞는 말이지만, 그 절약이 거의 상쇄된다(largely offset)는 요점을 빠뜨렸어요."],["서머타임 → 전기 더 많이 씀","상쇄된다(largely offset)는 말은 거의 비긴다는 뜻이지, 전보다 더 쓴다는 뜻이 아니에요."],["서머타임 → 냉난방 수요 늘림","주절 끝(greater demand for heating and air conditioning)만 옮겼어요. 문장은 그 수요가 조명에서 아낀 것을 거의 지운다(this saving is largely offset)는 말이에요."]]},{"id":"S3-1","k":3,"dev":"anything but (= 전혀 ~아니다)","s":"One airline's logbooks suggest its first pilots, though perceived as daring heroes, were anything but reckless, refusing to fly whenever an engine sounded abnormal.","a":"첫 조종사들 → 위험하면 안 날았음","why":"anything but은 「전혀 ~아니다」라는 뜻이라, but 뒤의 reckless는 오히려 부정당하는 말이에요. 요점은 무모하지 않았다는 것과 그 증거(refusing to fly whenever an engine sounded abnormal)예요.","tr":[["첫 조종사들 → 무모하게 날았음","「but 뒤가 답」 버릇으로 but 뒤의 낱말(reckless)을 그대로 요점으로 잡았어요. anything but은 그 말을 부정해요."],["첫 조종사들 → 엔진을 손수 고침","engine을 빌려 지어낸 말이에요. 글은 엔진 소리가 이상하면 날지 않았다고 할 뿐, 고쳤다는 말은 없어요."],["초기 비행기 → 추락 사고가 잦았음","초기 비행기에 대한 흔한 이야기지만, 이 문장은 사고가 아니라 조종사들의 태도를 말해요."]]},{"id":"S3-2","k":3,"dev":"~ is beside the point; what counts is ~","s":"Whether it burned is, for some historians, beside the point; what counts is that funding for recopying its fragile scrolls had ceased generations earlier.","a":"장서 손실 → 베껴 쓸 돈 끊긴 탓","why":"beside the point는 「핵심에서 벗어난다」는 뜻이라 앞쪽(불에 탔는지)은 버리고, what counts 뒤가 요점(funding for recopying its fragile scrolls had ceased generations earlier)이에요.","tr":[["장서 손실 → 큰불이 난 탓","beside the point 쪽(Whether it burned)을 요점으로 잡았어요. 불이 났는지는 중요하지 않다는 말이에요."],["장서 손실 → 전쟁 중 약탈당한 탓","옛 도서관이 사라진 까닭으로 그럴듯하지만 글에 없어요."],["후대 작가 → 화재 이야기 꾸밈","앞 문장(Later writers claimed)을 비튼 말이에요. 글은 그 주장이 거짓이라고 하지 않고, 핵심이 아니라고 할 뿐이에요."]],"ctx":"Later writers claimed that one ancient library, which held thousands of scrolls, had vanished in a single fire."},{"id":"S3-3","k":3,"dev":"To call A B is to miss ~","s":"To call the centuries after Rome's collapse a 'Dark Age', historians argue, is to miss the trade which, recent excavations suggest, still linked distant ports.","a":"중세 → 항구 잇는 교역 계속됨","why":"To call A B is to miss C는 「A를 B라고 부르면 C를 놓친다」는 말이라, 요점은 놓친 쪽 C(the trade which, recent excavations suggest, still linked distant ports)예요. 「암흑 시대」라는 이름은 비판받는 쪽이에요.","tr":[["중세는 학문이 끊긴 어둠의 시대","글이 비판하는 이름(a 'Dark Age')을 그대로 요점으로 잡았어요."],["중세 수도원이 학문을 이어 감","중세를 다시 보자는 이야기로 가장 흔히 듣는 말이지만, 이 문장이 놓치지 말라고 한 것은 학문이 아니라 먼 항구를 잇던 교역(the trade ... still linked distant ports)이에요."],["발굴 → 옛 항구 터를 새로 찾음","삽입구(recent excavations suggest)를 빌려 지어낸 말이에요. 발굴은 교역이 이어졌다는 근거로 나올 뿐, 항구를 새로 찾았다는 말은 없어요."]]},{"id":"S3-4","k":3,"dev":"Not that ~; ~","s":"Not that such creatures never existed; their soft bodies, which lacked shells or bones, tended to decay before sediment could bury them.","a":"화석 공백 → 무른 몸이 먼저 썩음","why":"Not that A; B는 「A라는 말은 아니고, B」라는 뜻이에요. 부정당한 쪽(such creatures never existed)을 버리면 요점은 뒤(their soft bodies, which lacked shells or bones, tended to decay before sediment could bury them)예요.","tr":[["화석 공백 → 그런 생물은 없었음","Not that이 부정한 쪽(such creatures never existed)을 요점으로 잡았어요. 글은 그런 생물이 있었다고 봐요."],["화석 공백 → 지층이 깎여 사라짐","화석이 드문 까닭으로 그럴듯하지만, 글은 땅이 깎인 이야기를 하지 않아요."],["화석 공백 → 발굴이 덜 돼서 생김","앞 문장(Researchers have found almost no fossils)에 끌려 연구자 탓으로 돌렸어요. 글은 화석이 처음부터 잘 생기지 않았다고 말해요."]],"ctx":"Researchers have found almost no fossils of the creatures which, according to their hypothesis, once linked two groups of sea animals."},{"id":"S3-5","k":3,"dev":"A matters little; what matters is B","s":"For one island considering desalination, the equipment's price, which a grant would cover, matters little; what matters is the electricity it would consume for decades.","a":"담수화 → 오래 쓸 전기가 관건","why":"A matters little; what matters is B에서 A(the equipment's price)는 덜 중요한 쪽이고, 요점은 B(the electricity it would consume for decades)예요.","tr":[["담수화 → 장비 사는 값이 관건","matters little 쪽(the equipment's price)을 요점으로 잡았어요."],["담수화 → 짠물 처리가 관건","담수화의 흔한 걱정거리지만 글에 없어요."],["장비값 → 섬 예산으로 치름","관계사절(which a grant would cover)을 거꾸로 읽었어요. 장비값은 보조금이 대 준다고 했어요."]]},{"id":"S3-6","k":3,"dev":"neither A nor B; it is C","s":"Peer review's chief benefit, some editors argue, is neither exposing fraud nor ranking studies; it is that authors, when challenged, state their evidence more precisely.","a":"동료 심사 → 근거가 또렷해짐","why":"neither A nor B; it is C는 「A도 B도 아니고 C」라는 말이라, 요점은 C(authors, when challenged, state their evidence more precisely)예요.","tr":[["동료 심사 → 연구 부정 잡아냄","neither 쪽(exposing fraud)을 요점으로 잡았어요. 글은 그것이 가장 큰 이점이 아니라고 해요."],["동료 심사 → 저자의 실수를 찾아냄","동료 심사의 흔한 역할로 그럴듯하지만, 글은 실수 찾기를 말하지 않아요."],["저자 → 반박받으면 물러섬","when challenged를 「반박받으면 물러선다」로 비틀었어요. 글은 오히려 근거를 더 정확히 댄다고 해요."]]},{"id":"S3-7","k":3,"dev":"It was not until ~ that ~ (not이 대체가 아니라 때를 말함 — 리듬 깨기)","s":"In one town, it was not until buses ran on a printed timetable that the square's clock, inaccurate for decades, was adjusted.","a":"버스 시간표 → 비로소 시계 고침","why":"It was not until A that B는 「A가 되고서야 B했다」는 뜻이에요. not은 무엇을 지우는 말이 아니라 때를 말해요. 그래서 요점은 A(buses ran on a printed timetable) 뒤에야 비로소 B(the square's clock ... was adjusted)가 일어났다는 것이에요.","tr":[["시계 수리 → 버스와는 상관없음","it was not … that을 「버스 때문이 아니다」로 읽어 버스 시간표를 지워 버렸어요. not until은 「버스가 시간표대로 다니고서야」라는 말이라, 둘은 오히려 이어져 있어요."],["광장 시계 → 수십 년 부정확","삽입구(inaccurate for decades)의 곁가지예요. 사실이지만 요점은 언제, 무엇을 계기로 고쳤는가예요."],["기차 시대 → 표준 시각 생김","기차가 표준 시각을 퍼뜨렸다는 흔한 이야기지만, 이 글은 한 마을의 버스 이야기예요."]]},{"id":"S3-8","k":3,"dev":"not without reason (= 까닭이 있다, 이중 부정 — 리듬 깨기)","s":"Belief in many weather sayings, which modern forecasts have largely replaced, is not without reason, since the sayings derive from farmers who watched the sky for generations.","a":"날씨 속담엔 관찰의 근거 있음","why":"not without reason은 「까닭이 없지 않다」, 곧 근거가 있다는 이중 부정이에요. 그 근거는 since 뒤(derive from farmers who watched the sky for generations)예요.","tr":[["날씨 속담은 근거 없는 미신","not을 보고 「근거 없음」으로 읽었어요. not without reason은 「까닭이 없지 않다」, 곧 근거가 있다는 말이에요."],["날씨 속담은 요즘엔 안 맞음","관계사절(which modern forecasts have largely replaced)에 끌렸어요. 예보가 속담 자리를 대신했다는 말이지, 속담이 틀렸다는 말은 아니에요."],["날씨 속담 → 일부만 들어맞음","글은 속담이 얼마나 들어맞는지 따지지 않아요. 그 믿음에 근거가 있는 까닭으로 농부들의 오랜 관찰(derive from farmers who watched the sky for generations)을 들 뿐이에요."]]},{"id":"S3-9","k":3,"dev":"nothing short of (= 그야말로, 부정처럼 보이지만 강조 — 리듬 깨기)","s":"For one club's players, the chess engine which their previous coach banned has proved nothing short of an ideal tutor, explaining why natural-looking moves fail.","a":"체스 엔진 → 좋은 선생 노릇","why":"nothing short of는 「그야말로 ~이다」라는 강조예요. 부정이 아니에요. 요점은 엔진이 선생 노릇을 한다는 것(has proved nothing short of an ideal tutor, explaining why natural-looking moves fail)이에요.","tr":[["체스 엔진 → 선생엔 못 미침","nothing과 short of를 부정으로 읽었어요. nothing short of는 「~에 못 미치는 데가 없다」, 곧 그야말로 선생이라는 뜻이에요."],["체스 엔진 → 생각할 힘 빼앗음","엔진을 걱정하는 흔한 말이지만 글에 없어요."],["체스 엔진 → 자연스러운 수 권함","natural-looking moves를 빌렸지만 뜻이 거꾸로예요. 엔진은 자연스러워 보이는 수가 왜 실패하는지 알려 줘요."]]},{"id":"S3-10","k":3,"dev":"A gives way to B (부정 말 없이 대체)","s":"On some footbridges, the slight sway generated by a few walkers can give way to strong shaking once a crowd unconsciously falls into step.","a":"다리 흔들림 → 발맞추면 커짐","why":"A gives way to B는 「A가 B에게 자리를 내준다」, 곧 B로 바뀐다는 말이에요. 부정 말이 없어도 대체예요. 요점은 B(strong shaking once a crowd unconsciously falls into step)예요.","tr":[["다리 흔들림 → 적은 인원엔 약함","자리를 내주는 쪽 A(the slight sway generated by a few walkers)만 옮겼어요."],["다리 흔들림 → 강풍 탓에 커짐","다리가 흔들리는 흔한 까닭이지만, 글은 바람을 말하지 않아요."],["군중 → 흔들림 느끼고 멈춤","unconsciously(저도 모르게)를 거꾸로 읽었어요. 군중은 알아채지 못한 채 발을 맞춰요."]]},{"id":"S4-1","k":4,"dev":"Witness ~ (예시를 들이밂)","s":"Witness the director who, to make a farewell scene feel lonelier, left the actor's light unchanged and let the darkness around her expand until she seemed alone.","a":"어둠 넓히자 → 쓸쓸함 커짐","why":"Witness ~는 「~를 보라」며 사례를 들이미는 신호예요. 배우를 비추는 빛은 그대로 두고 둘레의 어둠만 넓혔더니 배우가 혼자처럼 보였다는 사례(left the actor's light unchanged and let the darkness around her expand)이니, 어둠을 넓히면 쓸쓸함이 커진다는 원리로 끌어올려야 해요.","tr":[["푸른빛 쓰자 → 쓸쓸함 커짐","쓸쓸한 장면에 흔히 떠올리는 방법이지만, 감독은 배우를 비추는 빛을 그대로 두었어요(left the actor's light unchanged)."],["역광 비추자 → 쓸쓸함 커짐","그럴듯한 무대 기법이지만 글에 없어요. 감독은 빛을 바꾸지 않고 둘레의 어둠만 넓혔어요(let the darkness around her expand)."],["배우 혼자 세우자 → 쓸쓸함 커짐","혼자처럼 보인 것(until she seemed alone)은 어둠을 넓힌 결과예요. 무대에 배우를 혼자 세운 것이 아니에요."]]},{"id":"S4-2","k":4,"dev":"It is precisely this ~ that ~","s":"It is precisely this lack of a buffer that some managers value, since defects which a large stockpile would have concealed become visible at once.","a":"여유분 없음 → 결함 일찍 드러남","why":"It is precisely this ~ that ...은 「바로 이 ~를 ...한다」며 앞 문장의 한 부분을 콕 집는 짜임이에요. this lack of a buffer는 앞 문장의 여유 부품이 거의 없다는 것(keeps almost no spare parts)을 받고, 요점은 그 덕에 결함이 곧바로 드러난다는 것(defects which a large stockpile would have concealed become visible at once)이에요.","tr":[["여유분 없음 → 공장 멈추기 쉬움","앞 문장의 내용(one faulty batch can halt the whole line)이에요. 이 문장은 그 약점이 아니라 관리자들이 좋게 보는 점(some managers value)을 말해요."],["여유분 없음 → 보관 비용 줄어듦","적시 생산의 흔한 장점이지만 이 글에는 비용 이야기가 없어요."],["여유분 없음 → 결함 숨기 쉬움","concealed를 빌렸지만 거꾸로예요. 결함을 감추는 쪽은 재고가 넉넉할 때(which a large stockpile would have concealed)이고, 여유분이 없으면 결함이 곧바로 드러나요(become visible at once)."]],"ctx":"Under just-in-time production, a factory keeps almost no spare parts, so one faulty batch can halt the whole line."},{"id":"S4-3","k":4,"dev":"The former (앞의 것)","s":"The former, though it spares speakers any effort of invention, often drifts from its original meaning, since borrowers seldom import every sense the word carried at home.","a":"통째로 빌린 말 → 뜻이 달라짐","why":"The former는 앞 문장의 두 길 가운데 앞의 것, 곧 외국어를 통째로 빌려 쓰는 쪽(a foreign word taken whole)이에요. 양보절(though it spares speakers any effort of invention)을 넘기면 요점은 그렇게 빌린 말이 본래 뜻에서 멀어진다는 것(often drifts from its original meaning)이에요.","tr":[["새로 지은 말 → 뜻이 달라짐","The former를 뒤의 것(a new one built from native roots)으로 잘못 받은 답이에요. 「늘 뒤의 것」이라는 버릇에 낚였어요."],["오래 쓴 말 → 뜻이 달라짐","말은 오래 쓰면 뜻이 바뀐다는 흔한 이야기지만, 글이 든 까닭은 세월이 아니라 빌릴 때 뜻을 다 가져오지 않는다는 것(borrowers seldom import every sense the word carried at home)이에요."],["통째로 빌린 말 → 만들기 수월함","though가 이끄는 양보 부분(though it spares speakers any effort of invention)만 옮겼어요. 맞는 말로 접어 두고, 글이 말하려는 것은 그래도 본래 뜻에서 멀어진다는 주절이에요."]],"ctx":"When a language meets a new concept, speakers may choose between a foreign word taken whole and a new one built from native roots."},{"id":"S4-4","k":4,"dev":"These findings (자료 받기)","s":"These findings imply that the benefit may stem less from the activity itself than from a sense of autonomy, which vanishes once helping becomes an obligation.","a":"스스로 고른 일 → 건강 좋아짐","why":"These findings는 앞 문장의 조사 결과, 곧 역할을 스스로 고른 사람만 건강이 좋았다는 것(only among those who had chosen their roles)을 받아요. 요점은 이득이 활동 자체보다 스스로 정했다는 느낌에서 온다는 것(from a sense of autonomy)이에요.","tr":[["몸 움직이는 일 → 건강 좋아짐","봉사가 몸을 움직이게 해서 건강해진다는 흔한 생각이지만, 글은 활동 자체 때문이 아니라고 해요(less from the activity itself)."],["사람 만나는 일 → 건강 좋아짐","봉사하며 사람을 만나 건강해진다는 말도 그럴듯하지만 글에는 만남 이야기가 없어요."],["남 돕는 일 → 건강 좋아짐","봉사가 남을 도와서 건강해진다는 흔한 생각이지만, 글은 그 이로움이 활동 자체보다(less from the activity itself) 스스로 골랐다는 느낌(a sense of autonomy)에서 온다고 해요."]],"ctx":"In one survey of retirees, volunteering was linked to better health, but only among those who had chosen their roles."},{"id":"S4-5","k":4,"dev":"In much the same way, ~ (비유 예시)","s":"In much the same way, parents, who cannot hand a child confidence directly, can only arrange the conditions under which small successes accumulate.","a":"여건 마련해 주면 → 자신감 자람","why":"In much the same way는 앞 문장(치즈 만드는 사람)과 같은 이치를 다른 데 옮기는 신호예요. 치즈 만드는 사람이 맛을 넣기보다 미생물이 일할 여건을 맞추듯(adjust the conditions under which microbes inside it work), 부모도 자신감을 직접 줄 수는 없고 작은 성공이 쌓일 여건을 마련할 수 있을 뿐이라는 것(can only arrange the conditions under which small successes accumulate)이 요점이에요.","tr":[["칭찬해 주면 → 자신감 자람","흔한 교훈이지만 글은 자신감을 직접 건넬 수 없다고 해요(cannot hand a child confidence directly). 칭찬 이야기는 없어요."],["본보기 보여 주면 → 자신감 자람","그럴듯한 육아 교훈이지만 글에 없어요. 글이 말한 부모의 몫은 여건 마련뿐이에요."],["큰 과제 맡기면 → 자신감 자람","글은 큰 일이 아니라 작은 성공이 쌓이는 것(small successes accumulate)을 말해요."]],"ctx":"A cheesemaker does not so much add flavor to an aging cheese as adjust the conditions under which microbes inside it work."},{"id":"S4-6","k":4,"dev":"두 문장 앞 받기 (ctx에 두 문장, This가 첫 문장을 가리킴 — 리듬 깨기)","s":"This, a limitation of the observers rather than of the forest, is probably why early estimates of canopy insect diversity were so low.","a":"땅에서만 관찰 → 곤충 적게 셈","why":"This는 바로 앞 문장이 아니라 두 문장 앞을 받아요. 실마리는 This 뒤에 붙은 말이에요. 숲의 한계가 아니라 관찰하는 사람의 한계(a limitation of the observers rather than of the forest)라고 했으니, This는 땅에서만 연구했다는 첫 문장(worked mostly from the ground)이에요. 그래서 요점은 땅에서만 본 탓에 곤충 종류를 적게 셌다는 거예요.","tr":[["밤에만 활동 → 곤충 적게 셈","This를 바로 앞 문장(feed only at night)으로 받은 답이에요. 곤충의 습성은 숲 쪽의 사정이라 관찰자의 한계라는 말(a limitation of the observers rather than of the forest)과 맞지 않아요."],["실제로 종 적음 → 곤충 적게 셈","This 뒤에 붙은 말이 막아요. 낮은 추정치는 숲이 아니라 관찰하는 사람 쪽의 한계 탓이라고 했어요(a limitation of the observers rather than of the forest)."],["연구비 부족 → 곤충 적게 셈","그럴듯한 까닭이지만 글에는 돈 이야기가 없어요."]],"ctx":"For decades, rainforest scientists worked mostly from the ground, since the canopy far overhead was nearly impossible to reach. Some canopy insects, moreover, feed only at night and spend the daylight hours hidden beneath leaves."},{"id":"S4-7","k":4,"dev":"To take one case, ~","s":"To take one case, when a city stopped charging bus fares, ridership jumped by a third, a rise which officials celebrated and which surveys traced mostly to people who had previously walked.","a":"무료 버스 → 걷던 사람 끌어옴","why":"To take one case는 앞 문장(원리)의 사례를 드는 신호예요. 앞 문장이 중요한 것은 몇 명이 더 타느냐가 아니라 어디서 왔느냐라고 했으니(not how many more people ride but where they come from), 이 사례의 요점은 주절의 승객 증가가 아니라 문장 끝 관계절, 늘어난 승객 대부분이 원래 걷던 사람이었다는 것(traced mostly to people who had previously walked)이에요.","tr":[["무료 버스 → 승객 수 늘어남","주절(ridership jumped by a third)에 끌린 답이에요. 글에 있는 사실이지만 앞 문장이 중요하지 않다고 한 쪽(how many more people ride)이에요."],["무료 버스 → 차 타던 사람 끌어옴","무료 교통이라면 흔히 기대하는 결과지만, 늘어난 승객은 대부분 걷던 사람이었어요(people who had previously walked)."],["무료 버스 → 자전거족 끌어옴","걷던 사람과 함께 떠올리기 쉬운 쪽이지만 글에는 자전거 이야기가 없어요. 늘어난 승객은 대부분 원래 걷던 사람이었어요(people who had previously walked)."]],"ctx":"What matters in a fare-free transit experiment, some planners argue, is not how many more people ride but where they come from."},{"id":"S4-8","k":4,"dev":"the phenomenon (범주 명사로 받기)","s":"The phenomenon, familiar to anyone who maintains old software, often arises when other parts of a program have quietly come to rely on the original error.","a":"수정 뒤 오류 → 옛 실수에 기댄 탓","why":"The phenomenon은 앞 문장의 일, 곧 작은 실수를 고쳤더니 멀쩡하던 보고서가 망가진 일을 하나의 「현상」으로 묶어 받아요. 요점은 그 까닭, 프로그램의 다른 부분이 원래의 실수에 기대어 있었다는 것(other parts of a program have quietly come to rely on the original error)이에요.","tr":[["수정 뒤 오류 → 작다고 방심한 탓","앞 문장의 tiny에서 끌어낸 그럴듯한 까닭이지만, 글은 고친 사람의 방심을 말하지 않아요."],["수정 뒤 오류 → 시험 안 해 본 탓","프로그램 오류에 흔히 떠올리는 까닭이지만 글에 없어요. 글이 든 까닭은 다른 부분이 옛 실수에 기댄 것이에요."],["수정 뒤 오류 → 다른 곳 건드린 탓","other parts of a program을 빌렸지만 관계를 뒤집은 말이에요. 고칠 때 다른 곳을 건드린 것이 아니라, 다른 곳이 원래의 실수에 기대고 있었어요(have quietly come to rely on the original error)."]],"ctx":"After a programmer fixed a tiny rounding error in a salary program, several reports that had worked for years began to fail."},{"id":"S4-9","k":4,"dev":"Which is why ~ (문장 머리)","s":"Which is why some engineers, when asked whether roundabouts reduce accidents, reply that their main benefit lies in how mild the remaining crashes become.","a":"회전 교차로 → 사고가 가벼워짐","why":"Which is why는 「그래서 ~하다」라며 앞 문장 전체를 까닭으로 받아요. 앞 문장(사고가 나도 옆으로 스치는 정도라는 것)이 까닭이고, 요점은 엔지니어들이 꼽는 가장 큰 이점이 남은 사고가 가벼워진다는 것(their main benefit lies in how mild the remaining crashes become)이에요.","tr":[["회전 교차로 → 사고가 줄어듦","질문(whether roundabouts reduce accidents)에 끌린 답이에요. 엔지니어들은 사고 수가 아니라 사고가 얼마나 가벼워지는지로 답해요."],["회전 교차로 → 차 속도가 느려짐","회전 교차로의 장점으로 흔히 드는 말이지만 글에는 속도 이야기가 없어요."],["회전 교차로 → 큰 사고 잦아짐","글은 큰 충돌이 아니라 옆으로 스치는 사고가 난다고 했어요(rather than violent right-angle impacts)."]],"ctx":"Because all cars at a roundabout move in one direction, the crashes that occur tend to be side scrapes rather than violent right-angle impacts."},{"id":"S4-10","k":4,"dev":"By way of illustration, ~","s":"By way of illustration, children at one forest kindergarten, where sticks and stones replaced store-bought toys, quarreled far less over playthings, apparently because no single object had an obvious use.","a":"정해진 쓰임 없으면 → 덜 다툼","why":"By way of illustration은 「예를 들어 보이자면」이라는 신호예요. 사서 쓰는 장난감 대신 나뭇가지와 돌로 논 숲 유치원 아이들이 덜 다퉜다는 사례(sticks and stones replaced store-bought toys, quarreled far less over playthings)를, because 뒤의 까닭(no single object had an obvious use)과 함께 쓰임이 정해지지 않은 놀잇감이면 덜 다툰다는 원리로 끌어올려야 해요.","tr":[["자연 속에서 놀면 → 덜 다툼","숲이라는 장면에 끌린 흔한 생각이에요. 글이 든 까닭은 자연의 힘이 아니라 놀잇감의 쓰임이 정해지지 않았다는 것(no single object had an obvious use)이에요."],["모양 단순하면 → 덜 다툼","나뭇가지와 돌의 겉모습에 끌린 답이에요. 글이 든 까닭은 모양이 아니라 어느 것도 쓰임이 정해지지 않았다는 것(no single object had an obvious use)이에요."],["장난감 넉넉하면 → 덜 다툼","store-bought toys를 비튼 말이에요. 글은 장난감이 많아서가 아니라, 사서 쓰는 장난감을 나뭇가지와 돌로 바꾸어 쓰임이 정해지지 않아서라고 해요."]]},{"id":"S5-1","k":5,"dev":"두 문장에 걸친 확장 은유 (풀이 없이)","s":"A translator spends her working life moving furniture between two houses whose doorways were built to different sizes. Guests who later relax in the second house rarely notice which legs she quietly trimmed so that each piece would fit.","a":"번역가 → 남몰래 손봐 맞춤","why":"번역가의 일을 문 크기가 다른 두 집 사이로 가구를 옮기는 일에 빗대고, 풀이 없이 둘째 문장까지 비유를 이어 갔어요. 두 집은 두 언어, 가구는 글, 손님은 독자예요. 문에 맞게 들어가도록 다리를 몰래 깎았다(which legs she quietly trimmed so that each piece would fit)는 것은, 언어의 틀이 달라서 번역가가 독자 모르게 글을 손봐 맞춘다는 속뜻이에요.","tr":[["번역가 → 평생 고된 일을 함","첫 문장의 겉뜻(spends her working life moving furniture)만 읽은 답이에요. 가구를 옮기는 것은 번역을 빗댄 말이고, 글은 일이 힘들다는 데 무게를 두지 않아요."],["번역 → 원문을 그대로 살림","좋은 번역에 대한 흔한 생각이지만 글과 반대예요. 문에 맞추려고 다리를 깎았다는 것은 원문을 그대로 두지 않고 고쳤다는 뜻이에요."],["독자 → 번역서를 편히 즐김","관계사절의 배경(who later relax in the second house)을 옮긴 답이에요. 문장이 하려는 말은 그 손님들이 어느 다리를 깎았는지 알아채지 못한다(rarely notice)는 것, 곧 번역가가 남몰래 손봤다는 것이에요."]]},{"id":"S5-2","k":5,"dev":"완곡어 (let go = 해고 같은 꼴)","s":"Shortly after the two firms merged, roughly forty employees, most of whom had worked in overlapping departments, were encouraged to pursue opportunities elsewhere.","a":"합병 → 직원들을 내보냄","why":"pursue opportunities elsewhere(다른 곳에서 기회를 찾다)는 해고를 부드럽게 돌려 말하는 완곡어예요. 합병하자마자 마흔 명쯤이 이런 권유를 받았다(roughly forty employees ... were encouraged to pursue opportunities elsewhere)는 것은 회사가 그들을 내보냈다는 뜻이에요.","tr":[["직원들 → 더 나은 자리로 옮김","완곡어(were encouraged to pursue opportunities elsewhere)를 겉뜻대로 「다른 곳에서 더 나은 기회를 찾아갔다」고 읽은 답이에요. 합병하자마자 겹치는 부서의 마흔 명쯤이 한꺼번에 이런 권유를 받았다는 것은, 회사가 떠나 달라고 한 것을 부드럽게 바꿔 말한 것이에요."],["합병 → 겹치는 부서가 생김","관계사절의 세부(most of whom had worked in overlapping departments)예요. 누가 나가게 됐는지를 덧붙인 말일 뿐, 문장이 하려는 말은 아니에요."],["합병 → 두 회사 문화 충돌","합병에 대해 흔히 하는 말이지만 글에 없어요."]]},{"id":"S5-3","k":5,"dev":"모순어법 (a deafening silence 같은 꼴)","s":"Since the conductor turned seventy, the orchestra's rehearsals have been guided by an eloquent stillness, which younger conductors, when asked, acknowledge they cannot imitate.","a":"지휘자 → 몸짓 없이도 잘 이끎","why":"eloquent stillness(많은 것을 말해 주는 고요함)는 서로 어긋나는 낱말을 붙인 모순어법이에요. 가만히 있는데도 많은 것을 전한다는 뜻이라, 지휘자가 큰 몸짓 없이 연습을 이끈다(the orchestra's rehearsals have been guided by an eloquent stillness)는 말이에요. 젊은 지휘자들이 따라 하지 못한다(acknowledge they cannot imitate)는 것은 그 고요함이 쇠약이 아니라 솜씨라는 뜻이에요.","tr":[["지휘자 → 나이 들어 기운 빠짐","일흔이 넘었다는 것(Since the conductor turned seventy)과 고요함(stillness)을 겉뜻대로 이어 「늙어서 덜 움직인다」로 읽은 답이에요. eloquent가 붙어 그 고요함이 오히려 많은 것을 전한다는 뜻이고, 젊은 지휘자들도 따라 하지 못한다고 해요."],["단원들 → 지휘를 따르기 힘듦","몸짓이 적으면 따르기 어렵겠다는 짐작이지만 글에 없어요. 연습은 그 고요함으로 이끌려 왔어요(have been guided by an eloquent stillness)."],["지휘 → 단원과의 믿음이 바탕","지휘에 대해 흔히 하는 교훈이지만 글에 없어요."]]},{"id":"S5-4","k":5,"dev":"상황의 아이러니 (소방서가 불탐 같은 꼴)","s":"The committee formed last year to reduce paperwork has so far produced a 300-page report, which every department is now required to read and sign.","a":"위원회 → 서류 일을 더 늘림","why":"서류를 줄이려고 만든 위원회(The committee formed last year to reduce paperwork)가 300쪽 보고서를 내어, 이제 모든 부서가 그것을 읽고 서명해야 해요(every department is now required to read and sign). 목적과 정반대 결과가 나온 상황의 아이러니로, 위원회가 서류 일을 더 늘렸다는 속뜻이에요.","tr":[["위원회 → 꼼꼼한 보고서를 냄","겉뜻만 보면 300쪽 보고서는 꼼꼼한 성과처럼 보여요. 하지만 이 위원회는 서류를 줄이려고 만든 것(formed last year to reduce paperwork)이라, 두꺼운 보고서는 칭찬이 아니라 꼬집는 말이에요."],["부서들 → 보고서에 불만이 큼","그럴듯한 짐작이지만 부서들이 불만을 말했다는 내용은 없어요. 글은 읽고 서명해야 한다(is now required to read and sign)고만 해요."],["행정 → 절차 줄여야 빨라짐","위원회를 만든 목적에서 끌어낸 흔한 교훈이에요. 글이 말하는 것은 그 목적과 반대로 된 결과예요."]]},{"id":"S5-5","k":5,"dev":"제유 (all hands = 일손 같은 꼴)","s":"The village festival drew so many visitors that its organizers, who had anticipated half as many, found themselves with too many mouths to feed and too few hands.","a":"축제 → 일할 사람이 모자람","why":"mouths(입)는 먹을 사람, hands(손)는 일할 사람을 몸의 한 부분으로 가리킨 제유예요. 먹일 입은 너무 많고 시중들 손은 너무 적었다(too many mouths to feed and too few hands)는 것은 손님에 비해 일할 사람이 모자랐다는 뜻이에요.","tr":[["주최 측 → 음식을 덜 준비함","mouths to feed를 겉뜻대로 음식 이야기로 읽은 답이에요. 모자란 쪽은 손(too few hands), 곧 일할 사람이에요. 음식이 모자랐다는 말은 없어요."],["주최 측 → 손님 수를 잘못 짐작함","관계사절의 세부(who had anticipated half as many)예요. 일이 벌어진 까닭일 뿐, 문장이 말하려는 결과는 일손이 모자랐다는 것이에요."],["축제 → 클수록 마을에 이득","축제에 대해 흔히 하는 말이지만 글에 없어요."]]},{"id":"S5-6","k":5,"dev":"온도 비유 (a chilly reception 같은 꼴)","s":"On her first morning, the new manager received a chilly welcome that, as she later learned, came from the office heater, which had apparently stopped functioning over the long weekend.","a":"첫 출근날 → 사무실이 추웠음","why":"chilly welcome은 흔히 「쌀쌀한 대접」이라는 온도 비유로 쓰이지만, 여기서 추위는 진짜 추위예요. 차가운 환영은 사람이 아니라 사무실 난방기에서 왔고(came from the office heater), 그 난방기는 긴 연휴 동안 멈춰 버렸어요(had apparently stopped functioning over the long weekend). 난방기를 사람처럼 「맞이했다」고 재치 있게 말했을 뿐, 첫 출근날 사무실이 정말 추웠다는 뜻이에요.","tr":[["직원들 → 새 관리자를 꺼림","chilly welcome을 무조건 「쌀쌀한 대접」이라는 속뜻으로 읽은 답이에요. 이 차가운 환영은 사람이 아니라 난방기에서 왔어요(came from the office heater). 직원들 이야기는 글에 없어요."],["관리자 → 긴 연휴 뒤 첫 출근","때를 나타내는 덧붙은 세부(over the long weekend)예요. 난방기가 언제 멈췄는지를 말할 뿐, 문장이 하려는 말은 첫날 사무실이 추웠다는 것이에요."],["새 직장 → 첫날은 어색하기 마련","새 직장 첫날에 대한 흔한 이야기지만 글에 없어요."]]},{"id":"S5-7","k":5,"dev":"전이 수식어 (a sleepless night 같은 꼴)","s":"After nineteen days of talks that had collapsed twice, the two delegations signed the agreement over a weary breakfast, which neither side bothered to finish.","a":"양측 → 지친 끝에 서명함","why":"a weary breakfast(지친 아침 식사)는 사람의 상태(지침)를 곁에 있는 물건(아침 식사)에 옮겨 붙인 전이 수식어예요. 열아흐레 협상 끝에(After nineteen days of talks) 양쪽 대표단이 지친 채 서명했고, 아침을 다 먹을 마음도 없었다(which neither side bothered to finish)는 속뜻이에요.","tr":[["양측 → 서명하며 함께 축하함","서명 자리에 아침 식사가 있다고 축하하는 자리로 읽은 답이에요. weary(지친)와, 아무도 아침을 다 먹지 않았다(which neither side bothered to finish)는 모습은 축하와 거리가 멀어요."],["협상 → 두 번이나 깨졌었음","관계사절의 세부(that had collapsed twice)예요. 지금까지의 사정일 뿐, 문장의 중심은 마침내 서명한 장면과 그때의 모습이에요."],["협상 → 양보해야 타결됨","협상에 대해 흔히 하는 교훈이지만 글에 없어요."]]},{"id":"S5-8","k":5,"dev":"역설 (the more ~, the less ~)","s":"The more cautiously the veteran runner, who turned forty last spring, approaches the opening laps, the less often younger rivals finish ahead of her.","a":"노장 → 천천히 시작해 덜 밀림","why":"「The more ~, the less ~」 꼴의 역설이에요. 처음 몇 바퀴를 조심스럽게 달릴수록(The more cautiously the veteran runner ... approaches the opening laps) 젊은 선수들이 그보다 먼저 들어오는 일이 줄어든다(the less often younger rivals finish ahead of her)는 말이에요. 느려 보이는 출발이 오히려 앞서는 길이라는 속뜻이에요.","tr":[["노장 → 나이 들어 조심스러워짐","관계사절(who turned forty last spring)과 cautiously를 겉뜻대로 이은 답이에요. 글은 그 조심스러움이 약점이 아니라 젊은 선수들을 앞서는 길이라고 말해요."],["노장 → 젊은 선수에게 밀려남","나이가 많으면 밀린다는 흔한 짐작이에요. 글은 젊은 선수들이 그를 앞서는 일이 줄어든다(younger rivals finish ahead of her)고, 곧 반대로 말해요."],["노장 → 조심할수록 더 밀림","같은 「~할수록」 꼴에서 방향을 거꾸로 잡았어요. 글은 조심스럽게 시작할수록 젊은 선수들이 그를 앞서는 일이 줄어든다(the less often younger rivals finish ahead of her)고 해요."]]},{"id":"S5-9","k":5,"dev":"우화 인용 (sour grapes · the boy who cried wolf 같은 꼴, 문장 안에서 비유로)","s":"The older lab, which had abandoned the experiment years before its rival finally succeeded, dismissed the result as minor, a reaction colleagues privately called sour grapes.","a":"포기한 쪽 → 샘이 나서 깎아내림","why":"sour grapes(신 포도)는 여우가 닿지 않는 포도를 「어차피 실 거야」 하고 깎아내린 우화에서 온 말이에요. 오래전에 실험을 그만둔 연구실(which had abandoned the experiment years before its rival finally succeeded)이 상대의 성공을 하찮다고 했고(dismissed the result as minor), 동료들이 그 반응을 신 포도라 불렀으니, 자기가 못 해낸 것이 샘나서 깎아내렸다는 속뜻이에요.","tr":[["새 결과 → 학계에 의미가 적음","오래된 연구실의 평가(dismissed the result as minor)를 그대로 믿은 답이에요. 동료들이 그 반응을 신 포도라고 불렀다는 것은, 그 평가가 공정한 판단이 아니라 샘에서 나온 말이라는 뜻이에요."],["경쟁 → 서로를 성장하게 함","두 연구실의 경쟁에 대해 흔히 하는 좋은 교훈이지만 글에 없어요."],["포기한 쪽 → 다시 실험에 나섬","그럴듯한 다음 이야기지만 글에 없어요. 그 연구실이 한 일은 상대의 결과를 하찮다고 한 것(dismissed the result as minor)뿐이에요."]]},{"id":"S5-10","k":5,"dev":"행동으로 드러나는 속뜻 (감정 낱말 없이 행동만으로)","s":"When our team lost the debate final, the captain, who had insisted all season that outcomes hardly mattered, sat alone in the empty hall until dark.","a":"주장 → 실은 패배에 낙담함","why":"슬프다는 낱말 없이 행동만으로 마음을 보여 주는 문장이에요. 시즌 내내 결과는 별것 아니라고 했지만(insisted all season that outcomes hardly mattered), 결승에서 지자 빈 강당에 어두워질 때까지 혼자 앉아 있었어요(sat alone in the empty hall until dark). 겉으로 한 말과 달리 실은 패배에 낙담했다는 속뜻이에요.","tr":[["주장 → 결과에 전혀 개의치 않음","관계사절에 나온 주장의 말(who had insisted all season that outcomes hardly mattered)을 그대로 믿은 답이에요. 진 뒤에 한 행동은 그 말과 다른 속마음을 보여 줘요."],["주장 → 팀원들을 다독여 줌","주장이 할 법한 일이지만 글에 없어요. 주장은 혼자 앉아 있었어요(sat alone)."],["토론 → 결과보다 과정이 중요","주장이 늘 하던 말이자 흔한 교훈이지만, 이 문장이 보여 주는 것은 그 말과 다른 주장의 모습이에요."]]}],"write":[{"id":"S1-W1","k":1,"dev":"by virtue of","s":"By virtue of staying open on Friday nights, one small museum has become a meeting place for teenagers, who had seldom visited it before.","model":"작은 박물관 → 십대 모임터 됨","accept":"야간 개장 박물관 → 십대 만남의 장소, 금요일 밤 개장 → 십대가 모임, 박물관 → 십대가 찾아옴(반만 맞음: 모이는 장소가 됐다는 말이 빠짐)","no":"금요일 밤에 문 엶(by virtue of 뒤 까닭만), 예전엔 십대가 잘 안 옴(who 뒤 세부만), 야간 개장 → 관람료 수입 늘어남(글에 없음)"},{"id":"S1-W2","k":1,"dev":"if only because","s":"Teachers in one district now let pupils answer in dialect, if only because children who are constantly corrected often stop raising their hands.","model":"교사들 → 사투리 대답 허용","accept":"교실에서 사투리로 대답해도 됨, 선생님이 사투리 대답 받아 줌","no":"자꾸 고치면 손 안 듦(if only because 뒤 까닭만), 사투리 → 지켜야 할 문화(글에 없는 교훈), 사투리 → 고쳐 줘야 함(글과 반대)"},{"id":"S1-W3","k":1,"dev":"과거분사 수식 (관계사 생략된 꼴)","s":"Plastic fibers shed by washing machines, small enough to slip through some treatment plants, were detected at nearly every bend of one river sampled by students.","model":"세탁 미세섬유 → 강 곳곳에서 나옴","accept":"강 거의 모든 곳에서 플라스틱 섬유 발견, 세탁기 미세 플라스틱 → 강 전체에 퍼짐, 강에서 미세 플라스틱 나옴(반만 맞음: 거의 모든 곳이라는 범위가 빠짐)","no":"처리장을 빠져나감(덧붙은 세부만), 학생들이 강물 조사(과거분사 꾸밈말만), 세탁기 → 강 오염의 주범(글에 없는 단정)"},{"id":"S1-W4","k":1,"dev":"so + 형용사 + that (결과)","s":"The sign language of one isolated village became so widespread that even hearing residents who had no deaf relatives used it in the fields.","model":"마을 수어 → 듣는 주민도 씀","accept":"외딴 마을 수어 → 마을 전체로 퍼짐, 청인 주민까지 수어 사용, 마을 수어가 널리 퍼짐(반만 맞음: 얼마나 퍼졌는지 결과가 빠짐)","no":"농인 가족이 없음(who 뒤 세부만), 들에서 씀(세부만), 수어 → 외딴 마을에서 생김(화제만)"},{"id":"S2-W1","k":2,"dev":"Once considered ~, X now ~","s":"Once considered little more than places of entertainment, some zoos now run breeding programs that have helped restore endangered species, such as the Arabian oryx, to the wild.","model":"일부 동물원 → 멸종 위기종 되살림","accept":"동물원이 번식시켜 야생으로 돌려보냄, 동물원 → 위기종 보전에 이바지, 동물원 → 구경거리 이상(반만 맞음: 무엇을 하는지 빠짐)","no":"동물원 → 오락 장소(Once considered 쪽의 옛 생각), 아라비아오릭스 → 야생 복귀(예시 세부만), 동물원 → 모든 동물을 야생으로(멸종 위기종을 모든 동물로 키운 말)"},{"id":"S2-W2","k":2,"dev":"Much as ~, ~","s":"Much as adults like to credit the revival of handwritten letters to nostalgia, teenage letter writers in one survey cited another motive: owning something that cannot be deleted.","model":"십대 손편지 → 지울 수 없어서 씀","accept":"십대는 지워지지 않는 물건이라 손편지를 씀, 손편지 → 향수 말고 다른 까닭(반만 맞음: 그 까닭이 빠짐)","no":"손편지 부활 → 향수 때문(Much as 쪽 어른들의 흔한 설명), 십대 → 디지털 싫어함(지울 수 없다는 말을 키운 것), 손편지 → 다시 유행(화제만 있고 하는 말이 빠짐)"},{"id":"S2-W3","k":2,"dev":"Whereas ~, ~","s":"Whereas shared e-scooters are promoted as a green substitute for cars, one lifecycle study found that most riders surveyed would otherwise have walked, cycled or taken a bus.","model":"킥보드 → 차보다 걷기·버스를 대신","accept":"킥보드 이용자 → 원래는 걷거나 버스 탐, 킥보드는 주로 걷기·자전거·버스를 대신함, 킥보드 → 차 대신은 적음(반만 맞음: 무엇을 대신하는지 빠짐)","no":"킥보드 → 친환경 교통(Whereas 쪽의 홍보 문구), 킥보드 → 배출 더 많음(글이 말하지 않은 결론까지 감), 킥보드 → 자동차 줄임(Whereas 쪽을 그대로 믿은 말)"},{"id":"S2-W4","k":2,"dev":"That said, ~","s":"Rooftop farms, which often grow leafy greens in carefully controlled conditions, can achieve remarkable yields per square meter. That said, because in most cities their combined output remains tiny relative to demand, their value may lie mainly in education.","model":"옥상 농장 → 가치는 주로 교육","accept":"옥상 농장은 양이 적어 교육에 쓸모, 옥상 농장 → 도시 수요엔 턱없이 적음(반만 맞음: 결론인 교육이 빠짐)","no":"옥상 농장 → 수확량 놀라움(That said 앞 문장), 옥상 농장 → 도시 식량 해결(앞 문장을 키운 말), 잎채소 → 옥상에서 잘 자람(앞 문장 세부)"},{"id":"S3-W1","k":3,"dev":"no longer ~; ~ now ~","s":"Many historians no longer treat errors on old maps as carelessness; they now read them as evidence of what mapmakers, who relied on sailors' reports, believed.","model":"옛 지도 오류 → 당시 믿음의 증거","accept":"지도의 틀린 곳 → 그때 생각을 보여 줌, 오류 → 지도 만든 이의 믿음 드러냄, 옛 지도 오류 → 부주의 탓 아님(반만 맞음: 무엇의 증거인지가 빠짐)","no":"옛 지도 → 부주의한 실수(no longer 쪽을 옮김), 선원 보고 → 믿을 수 없음(who절을 비튼 말), 선원 보고에 기댄 믿음(who절 곁가지만), 옛 지도 → 틀린 곳이 많음(새 해석이 빠짐)"},{"id":"S3-W2","k":3,"dev":"It would be a mistake to ~; ~","s":"It would be a mistake to read a nutrition label's calorie figure as exact; derived from averages, it may differ noticeably from the actual amount.","model":"표시 열량 → 평균값이라 오차 있음","accept":"열량 숫자 → 실제와 다를 수 있음, 성분표 열량은 정확하지 않음, 표시 열량 → 평균에서 나옴(반만 맞음: 실제와 다를 수 있다는 말이 빠짐)","no":"성분표 열량 → 정확함(mistake라고 한 쪽을 옮김), 열량 → 살찌는 원인(글에 없는 흔한 말), 성분표 → 꼭 읽어야 함(글에 없는 흔한 교훈)"},{"id":"S3-W3","k":3,"dev":"in place of ~","s":"In place of a word-for-word translation, which would have kept every term but lost the joke, the translator invented a Korean pun with an equivalent effect.","model":"번역가 → 같은 효과의 말장난 지음","accept":"직역 대신 우리말 말장난, 번역 → 농담의 효과를 살림, 우리말 말장난을 새로 지음(반만 맞음: 같은 효과라는 점이 빠짐)","no":"번역 → 낱말 하나하나 살림(in place of 쪽을 옮김), 직역 → 농담을 잃음(which절의 곁가지만), 번역은 원문에 충실해야 함(글에 없는 흔한 교훈)"},{"id":"S3-W4","k":3,"dev":"A in name only","s":"In one valley, a flower once classified as an alien species proved foreign in name only, since ancient pollen suggests it had long grown there.","model":"외래종이라던 꽃 → 사실은 토종","accept":"그 꽃 → 이름만 외래종, 외래종 꽃 → 본디 그곳 식물, 오래된 꽃가루 → 오래 자란 증거(반만 맞음: 결론인 토종이 빠짐)","no":"그 꽃 → 외래종(in name only를 놓침), 외래종 → 생태계를 해침(글에 없는 흔한 말), 꽃가루 → 오래 남음(since절 세부만)"},{"id":"S4-W1","k":4,"dev":"~ illustrates the point","s":"One open-source program illustrates the point: after its maintainers began labeling simple bugs as good first tasks, the number of regular contributors, which had been shrinking, roughly doubled.","model":"쉬운 첫 일 → 참여자 늘어남","accept":"쉬운 첫 기여 → 기여자 늘어남, 쉬운 일 표시 → 공동체 살아남, 쉬운 버그 표시 → 기여자 두 배(사례 그대로라 반만 맞음)","no":"기여자 → 줄어듦(관계절 which had been shrinking에 끌림), 관리자 → 버그 표시함(원인만 있고 결과가 빠짐), 실력 있는 사람 → 공동체 살림(글에 없는 흔한 생각)","ctx":"A volunteer project tends to last only as long as newcomers can find a small, safe first contribution to make."},{"id":"S4-W2","k":4,"dev":"This is nowhere more evident than in ~ (도치 없이)","s":"This is nowhere more evident than in a concert hall, where a full audience, soaking up sound, can make the music echo far less than at an empty rehearsal.","model":"청중 → 소리 흡수해 덜 울림","accept":"꽉 찬 객석 → 소리 덜 울림, 흡수하는 것 → 방 소리 바꿈, 청중 → 소리 빨아들여 울림 바꿈","no":"벽 → 소리 반사(앞 문장의 반쪽만), 콘서트홀 → 음악 연주(화제만), 빈 연습실 → 울림 적음(거꾸로)","ctx":"How a room sounds depends as much on the surfaces that absorb sound as on those that reflect it."},{"id":"S4-W3","k":4,"dev":"One need only look at ~","s":"One need only look at the medieval churches whose walls some nineteenth-century restorers scraped clean, destroying faded paintings, to see how restoration can erase what it is meant to protect.","model":"복원 → 지키려던 것을 지움","accept":"잘못된 복원 → 문화재 망침, 벽 긁어낸 복원 → 옛 그림 없앰(사례 그대로라 반만 맞음)","no":"복원 → 문화재 지킴(protect만 보고 끌림), 중세 교회 → 그림이 바램(faded에 끌림), 19세기 → 교회 고침(결과가 빠짐)"},{"id":"S4-W4","k":4,"dev":"The same holds for ~","s":"The same holds for many plant diseases, which, if left undisturbed, can linger in the soil, waiting for the next planting of a host that rotation would have kept away.","model":"같은 작물 계속 → 병도 쌓임","accept":"돌려짓기 → 병도 막음, 해충처럼 병도 늘어남, 병균 → 땅속에서 오래 버팀(돌려짓기와 이어지지 않아 반만 맞음)","no":"해충 → 늘어남(앞 문장만), 농부 → 작물 돌림(까닭과 결과가 빠짐), 식물 병 → 저절로 사라짐(거꾸로)","ctx":"Growing one crop in the same field every year allows the pests that feed on it to multiply."},{"id":"S5-W1","k":5,"dev":"환유 (the kitchen = 요리사들 같은 꼴)","s":"When the owner hired a celebrity chef who seldom appeared, the kitchen, which had run smoothly for a decade, fell apart within weeks.","model":"자리 비운 주방장 → 주방 팀 무너짐","accept":"주방 사람들 → 몇 주 만에 무너짐, 요리사들 → 손발이 안 맞게 됨, 새 주방장 뒤 → 요리사들 흐트러짐, 주방 → 엉망이 됨(사람인지 장소인지 드러나지 않아 반만 맞음)","no":"주방 → 설비가 망가짐(kitchen을 겉뜻대로 장소로 읽음), 유명 요리사 → 식당을 살림(글과 반대), 주방 → 10년간 잘 돌아감(관계사절 곁가지)"},{"id":"S5-W2","k":5,"dev":"A is a B, not a C (대조 은유)","s":"My grandfather's watch, which has never been accurate, is a letter, not a clock, and I reread it whenever I wind it.","model":"물려받은 시계 → 할아버지 기억을 전함","accept":"시계 → 시간보다 할아버지 추억, 시계 → 태엽 감을 때마다 할아버지 생각, 시계 → 쓰임보다 마음이 소중(무엇을 전하는지가 빠져 반만 맞음)","no":"시계 → 편지 같음(비유 겉말만 옮김), 시계 → 시간이 안 맞음(관계사절 곁가지), 시계 → 고쳐 써야 함(글에 없음)"},{"id":"S5-W3","k":5,"dev":"양 비유 (a mountain of ~ / a flood of ~)","s":"When the retired teacher was hospitalized, a flood of letters arrived from former students whom she had not heard from in decades.","model":"은퇴한 선생님 → 제자들이 잊지 않음","accept":"제자들 → 오래도록 선생님을 기억함, 선생님 → 많은 제자 마음에 남음, 편지가 많이 옴 · 편지 → 홍수처럼 넘침(양만 쓰고 제자들이 잊지 않았다는 속뜻이 빠져 반만 맞음)","no":"선생님 → 병원에 입원함(때를 나타내는 절의 곁가지), 제자들 → 오래 연락 끊음(관계사절만 옮겨 속뜻과 반대)"},{"id":"S5-W4","k":5,"dev":"동물 비유 (a lone wolf · a guinea pig 같은 꼴)","s":"Unable to afford proper testing, the founder made her own family the guinea pigs for her app's first version, which crashed almost daily.","model":"창업자 → 가족을 시험 대상 삼음","accept":"창업자 → 가족에게 먼저 써 보게 함, 가족 → 첫 앱을 시험해 줌, 돈 없어 → 가족으로 시험함, 돈이 없어 제대로 시험 못 함(앞쪽 까닭만 써서 반만 맞음)","no":"가족 → 기니피그를 키움(비유 겉말), 앱 → 날마다 멈춤(관계사절 곁가지), 창업자 → 가족을 아낌(속뜻을 지어냄)"}],"paras":[{"id":"Q1","title":"발표되지 않은 결과","sents":[["Most of us assume that what appears in scientific journals is a fair sample of what researchers have actually found.","반대쪽","학술지 → 연구 전체 대표(통념)"],["In practice, studies reporting striking effects are considerably more likely to be published than those that find no effect, a pattern known as publication bias.","주장","눈에 띄는 결과 → 훨씬 잘 실림"],["A trial suggesting that a new treatment works may appear in a prominent journal within months, whereas an equally rigorous trial showing no benefit is often left unpublished.","예시","효과 있음 → 실림 · 없음 → 묻힘",["근거"]],["Over time, the published record, which readers naturally trust, comes to resemble a highlight reel rather than a complete recording of the game.","근거","기록 → 하이라이트만",["결론"]],["Missing results, in other words, are not a minor gap but a distortion that shapes what doctors and the public come to believe.","결론","빠진 결과 → 믿음을 비틂(핵심)",["주장"]],["Admittedly, journals have limited space, and editors understandably favor findings that readers are likely to notice.","반대쪽","지면 좁음 → 눈에 띌 결과 고름"],["Some fields have responded by asking researchers to register their studies before collecting data, so that a disappointing outcome cannot quietly vanish.","근거","미리 등록 → 사라짐 막기",["예시"]],["Registration does not guarantee publication, yet it at least renders the absence of a result visible.","근거","등록 → 빠진 것이 보임"],["Knowledge built only from successes, however impressive, is knowledge with its failures quietly erased.","결론","성공만 모은 지식 → 실패가 지워짐"]],"line":"학술지에 실린 것이 연구 전체를 대표한다고들 여기지만, 실은 눈에 띄는 결과가 훨씬 잘 실려, 빠진 결과가 우리의 믿음을 비튼다. 미리 등록하게 하면 빠진 것이 보인다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["why journals should publish fewer but more careful studies","how registration ensures that disappointing results get published","how competition among researchers lowers the quality of studies","how unpublished results distort what we come to believe","how editors decide which findings readers will notice"],"ans":3,"why":"한 줄의 「빠진 결과가 우리의 믿음을 비튼다」가 정답(how unpublished results distort what we come to believe)과 같아요. 「publish fewer but more careful studies」와 「competition among researchers lowers the quality」는 연구 이야기에 흔한 주장이지만, 글은 연구가 서툴다는 게 아니라 똑같이 꼼꼼한 연구도 효과가 없으면 묻힌다(an equally rigorous trial showing no benefit is often left unpublished)는 거예요. 「registration ensures that disappointing results get published」는 (8)의 「Registration does not guarantee publication」과 어긋나요. 등록은 빠진 것을 보이게 할 뿐(renders the absence of a result visible)이에요. 「how editors decide which findings readers will notice」는 (6)에서 잠깐 인정한 사정(Admittedly)을 키운 말이에요.","tip":"핵심 문장 (5)가 글 가운데에 있어요. (5)의 in other words는 앞의 예시와 비유를 한마디로 묶는 신호예요. 끝 문장만 결론이라고 여기면 놓쳐요."},{"id":"Q2","title":"거꾸로 간 해결책","sents":[["In 1935, about a hundred cane toads were brought to northeastern Australia in the hope that they would eat the beetles damaging the sugar cane crops.","예시","두꺼비 들여옴 → 해충 잡기 기대"],["The toads did little to control the beetles and instead spread across the region, poisoning many native animals that tried to eat them.","예시","해충은 못 잡고 → 퍼져 토종 동물 해침"],["The episode is often cited by ecologists, who see it as a warning about interventions designed with only one goal in mind.","주장","두꺼비 일 = 한 목표 개입의 경고"],["A remedy that solves the problem in front of us can create new ones elsewhere, precisely because complex systems respond in ways that no single plan anticipates.","근거","해결책 → 딴 곳에 새 문제",["주장"]],["Antibiotics given routinely to healthy farm animals, for instance, have been linked to the spread of bacteria that the drugs can no longer kill.","예시","가축 항생제 → 내성균"],["Of course, this does not mean that every intervention is doomed or that doing nothing is the safer choice.","반대쪽","개입 → 다 실패는 아님(손 놓기도 답 아님)"],["Many carefully tested programs have worked well, often because their designers monitored side effects from the very beginning.","근거","부작용 살핀 계획 → 성공",["반대쪽"]],["The lesson, then, is not to stop acting but to treat every solution as an experiment whose results must be monitored.","결론","해결책 = 지켜볼 실험(핵심)"],["A plan that cannot be adjusted once its consequences appear has stopped being a solution and become a gamble.","결론","고칠 수 없는 계획 → 도박"]],"line":"한 목표만 보고 들여온 두꺼비는 해충은 못 잡고 토종 동물을 해쳤다. 복잡한 체계는 예상 밖으로 반응하니, 해결책은 결과를 지켜보며 고치는 실험으로 다뤄야 한다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["the danger of relying on nature to solve human problems","why simple solutions work better than complex plans","the need to monitor solutions for unintended effects","the importance of giving each plan a single clear goal","how farm practices spread bacteria that resist antibiotics"],"ans":2,"why":"한 줄의 「해결책은 결과를 지켜보며 고치는 실험」이 정답(the need to monitor solutions for unintended effects)과 같아요. 「relying on nature to solve human problems」는 두꺼비 사례만 보고 넓힌 말이에요. 글은 가축 항생제(5)까지 들어 자연이 아니라 한 목표만 본 개입을 문제 삼아요. 「simple solutions work better than complex plans」는 (4)의 complex를 빌렸지만, 글이 말한 것은 복잡한 체계가 예상 밖으로 반응한다는 것이지 단순한 해결책이 낫다는 게 아니에요. 「giving each plan a single clear goal」은 거꾸로예요. (3)은 한 목표만 본 개입(interventions designed with only one goal in mind)을 경고했어요. 「farm practices spread bacteria」는 사례 (5)의 세부만 키운 말이에요.","tip":"글이 사례로 시작하면 (3)처럼 사례를 묶는 문장을 찾아요. (8)의 not A but B에서 B가 핵심이고, (9)는 그것을 비유로 다시 말해요. (3)은 생태학자의 말을 빌렸지만 글쓴이가 받아들이는 생각이라 반대쪽이 아니라 주장이에요."},{"id":"Q3","title":"지도가 심는 생각","sents":[["No flat map can sh
