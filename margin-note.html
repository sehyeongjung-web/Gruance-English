요.","(1)에 이어 그 서점에서 일어난 장면을 보여 줘요. 같은 사례라 예시예요.","Many people believe(많은 사람은 ~라고 믿는다)는 남들 생각(통념)이에요. 다음 문장의 Yet이 이것을 뒤집으니 반대쪽이에요.","Yet(하지만) 뒤가 글쓴이가 하고 싶은 말이에요. (3)의 「살아남을 수 없다」를 뒤집으니 주장이에요.","온라인이 못 주는 것, 곧 사람과의 대화를 들어 서점이 만나는 곳으로 살아남는 까닭을 말해요. 주장을 받치니 근거예요.","행사가 사람을 불러오고 물건도 팔리게 한다는 까닭을 보태요. 주장을 받치니 근거예요. 행사들을 보기로 늘어놓은 것이라 예시로 골라도 맞아요.","also(또한)로 서점이 살아남는 까닭을 하나 더 보태요. 주장을 받치니 근거예요.","then(그러니)으로 끝에서 (4)를 다시 말하며 정리하니 결론이에요. less A than B에서 B(모이는 사람)가 글쓴이의 생각이라 주장으로 골라도 맞아요."]},{"id":"P7","title":"동네 하천 되살리기","sents":[["For much of the last century, many towns covered their small streams with concrete, because a hidden stream seemed cleaner and safer.","반대쪽","하천 덮기 → 깨끗·안전해 보임"],["Covering a stream also made room for roads and parking lots, which growing towns badly needed.","반대쪽","덮으면 → 길·주차장 생김",["근거"]],["But when one town tore up the pavement and let its stream run in the open again, ducks and fish returned within a few years.","예시","덮개 걷은 하천 → 오리·물고기 돌아옴",["근거"]],["Opening a stream is expensive, of course, and some shopkeepers in that town worried about losing their parking spaces.","반대쪽","하천 열기 → 돈 듦·주차 걱정"],["Still, bringing a stream back into the open may give a neighborhood far more than the parking spaces it takes away.","주장","하천 되살리기 → 잃는 것보다 얻는 것 큼"],["An open stream can also hold more rainwater than a narrow underground pipe, so heavy rain may flood fewer nearby streets.","근거","열린 하천 → 큰비에도 덜 넘침"],["In that town, a new footpath along the water soon filled with walkers, and shops that had feared losing parking gained customers.","예시","물가 길 → 걷는 사람·가게 손님 늚",["근거"]],["A stream under concrete is only a drain, but a stream in the open can become the heart of a neighborhood.","결론","열린 하천 → 배수로 아닌 동네 중심",["주장"]]],"line":"흔히 하천은 덮는 편이 깨끗하고 쓸모 있다고 여겼고 되살리는 데는 돈과 주차 걱정이 따르지만, 하천을 되살리면 잃는 것보다 얻는 것이 크다. 오리와 물고기가 돌아오고 큰비에도 덜 넘치며, 열린 하천은 동네의 중심이 된다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["open streams as a cheaper choice than pipes under the street","open streams as a win for nature at a cost to local shops","new parking areas as the key to winning shop owners' support","flood control as a reason to open buried streams","uncovered streams as a gain for a whole neighborhood"],"ans":4,"why":"한 줄의 「하천을 되살리면 잃는 것보다 얻는 것이 크다」가 정답(uncovered streams as a gain for a whole neighborhood)과 같아요. 「a cheaper choice than pipes under the street」는 (6)의 underground pipe에 끌린 말이지만 (4)와 어긋나요(Opening a stream is expensive). 「a win for nature at a cost to local shops」는 (3)의 오리와 물고기, (4)의 가게 걱정에 끌린 말인데, (7)에서 가게들은 오히려 손님을 얻었고(gained customers) (8)은 열린 하천이 동네의 중심이 된다고 해요(the heart of a neighborhood). 「new parking areas」는 (4)의 주차 걱정에 끌린 말인데, 글의 가게들은 새 주차장이 아니라 물가 길을 걷는 사람들 덕에 손님이 늘었어요. 「flood control」은 근거 (6) 하나만 키운 말이에요. 글은 돌아온 오리와 물고기(ducks and fish returned), 걷는 사람과 가게 손님까지 함께 들어요.","tip":"통념이 두 번 나오는 글이에요. (1)(2)는 하천을 덮던 까닭, (4)는 되살릴 때의 걱정이고, 주장은 다섯째 문장 (5) Still에서야 나와요. 주장이 늦게 나와도 (8)이 비유로 다시 말해 줘요. (3)의 But 뒤는 주장이 아니라 한 마을의 사례(예시)예요.","ko":["지난 세기의 대부분 동안 많은 마을이 작은 하천을 콘크리트로 덮었다. 가려진 하천이 더 깨끗하고 안전해 보였기 때문이다.","하천을 덮으면 도로와 주차장을 놓을 자리도 생겼는데, 커 가는 마을에는 그것이 몹시 필요했다.","그러나 한 마을이 포장을 뜯어내고 하천이 다시 드러난 채 흐르게 하자, 몇 해 안에 오리와 물고기가 돌아왔다.","물론 하천을 여는 데는 돈이 많이 들고, 그 마을의 몇몇 가게 주인은 주차 자리를 잃을까 걱정했다.","그래도 하천을 다시 드러내면 동네는 그것이 앗아 가는 주차 자리보다 훨씬 많은 것을 얻을 수 있다.","열린 하천은 좁은 지하 관보다 빗물을 더 많이 담을 수도 있어서, 큰비가 와도 물에 잠기는 근처 거리가 줄어들 수 있다.","그 마을에서는 물가를 따라 새로 난 산책길이 곧 걷는 사람들로 붐볐고, 주차 자리를 잃을까 두려워하던 가게들은 손님이 늘었다.","콘크리트 밑의 하천은 배수로일 뿐이지만, 드러난 하천은 동네의 중심이 될 수 있다."],"words":[[["century","세기(100년)"],["streams","시내, 하천"],["concrete","콘크리트"]],[["made room for","~을 놓을 자리를 만들었다"],["parking lots","주차장"],["badly","몹시"]],[["tore up","뜯어냈다"],["pavement","(도로) 포장"],["in the open","드러난 채, 바깥에"]],[["expensive","돈이 많이 드는"],["shopkeepers","가게 주인들"],["parking spaces","주차 자리"]],[["Still","그래도"],["back into the open","다시 드러난 곳으로"],["takes away","앗아 가다, 없애다"]],[["underground","땅속의, 지하의"],["pipe","관"],["flood","물에 잠기게 하다"],["nearby","근처의"]],[["footpath","걷는 길, 산책길"],["along","~을 따라"],["feared","두려워했던"],["gained","얻었다, 늘었다"]],[["drain","배수로(물 빠지는 길)"],["heart","중심, 한가운데"]]],"rwhy":["예전에 많은 마을이 하던 일과 그 까닭, 곧 남들 생각이에요. 글쓴이는 (5)의 Still에서 이것을 뒤집으니 반대쪽이에요.","하천을 덮은 까닭을 하나 더 보태요. 글쓴이가 뒤집으려는 쪽의 이야기라 반대쪽이에요. 그쪽 생각을 받치는 까닭이라 근거로 골라도 맞아요.","But 뒤에 나오지만 주장이 아니라 one town(한 마을)에서 일어난 일이에요. 눈에 보이는 사례라 예시이고, 하천을 되살리면 좋다는 것을 받치니 근거로 골라도 맞아요.","of course(물론)로 하천을 되살릴 때의 걱정을 잠깐 인정해요(양보). 바로 뒤 (5)의 Still이 뒤집으니 반대쪽이에요.","Still(그래도)로 (1)(2)의 통념과 (4)의 걱정을 넘어 글쓴이가 하고 싶은 말을 해요. 다섯째 문장에야 나오지만 이것이 주장이에요.","also(또한)로 하천을 되살려 얻는 것을 하나 보태요. 주장을 받치는 까닭이라 근거예요.","In that town(그 마을에서)으로 같은 마을의 장면을 다시 보여 주니 예시예요. 걱정하던 가게도 손님을 얻었다는 것이 주장을 받치니 근거로 골라도 맞아요.","「배수로 ↔ 동네의 중심」이라는 비유로 끝에서 (5)를 다시 말하니 결론이에요. 글쓴이의 생각을 다시 밝히는 문장이라 주장으로 골라도 맞아요."]},{"id":"P8","title":"모둠 과제의 무임승차","sents":[["In group projects, one student often stays up late finishing the slides while the others simply add their names at the end.","예시","모둠 과제 → 한 명만 일함(문제)",["근거"]],["A common answer is to grade each member separately or let classmates rate one another in secret, so that free riders lose points.","반대쪽","흔한 해결 → 따로 채점·서로 평가"],["There may be a simpler fix that works better: keeping groups small, with three members instead of five or six.","주장","더 나은 해결 → 모둠을 작게"],["In a group of six, one member can easily stay silent and go unnoticed, since the other five can finish without help.","근거","6명 → 한 명 빠져도 티 안 남"],["In a group of three, however, every missing part is obvious, and even shy members are more likely to be heard.","근거","3명 → 빠지면 바로 보임·말도 들림"],["One teacher who switched from groups of six to groups of three found that nearly every student took part, not just the usual leaders.","예시","3명 모둠 반 → 거의 모두 참여",["근거"]],["Separate grades, by contrast, may catch free riders after a project ends but do little to bring them into the work.","근거","따로 채점 → 참여는 못 끌어냄"],["In other words, free riding is often a sign not of lazy students but of groups in which hiding is too easy.","결론","무임승차 = 게으름 아닌 숨기 쉬운 모둠 탓",["주장"]]],"line":"모둠 과제에서는 흔히 한 명만 일한다. 따로 채점하거나 서로 평가하게 하는 것이 흔한 해결책이지만 모둠을 작게 하는 편이 낫다. 작으면 빠진 몫이 바로 보이고 모두 참여하게 되니, 무임승차는 게으른 학생이 아니라 숨기 쉬운 모둠의 문제인 때가 많다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["mixing shy and outgoing students as a cure for free riding","clear roles for each member as a cure for free riding","small groups as a simple fix for free riding in projects","teacher-chosen groups as a cure for free riding in class projects","strong leaders as the answer to free riding in projects"],"ans":2,"why":"한 줄의 「모둠을 작게 하는 편이 낫다」가 정답(small groups as a simple fix for free riding in projects)과 같아요. 「mixing shy and outgoing students」는 (5)의 shy members에 끌린 말인데, 글은 어떤 학생을 섞느냐가 아니라 모둠의 크기를 말해요. 「clear roles for each member」와 「teacher-chosen groups」는 모둠 과제에서 흔히 떠올리는 해결책일 뿐, 글은 역할이나 누가 모둠을 짜느냐가 아니라 모둠의 크기를 말해요(keeping groups small). 「strong leaders」는 (6)의 (not just the usual leaders)에 끌린 말인데, 글은 이끄는 몇 명이 아니라 거의 모두가 참여하는 것(nearly every student took part)을 말해요.","tip":"문제 → 흔한 해결책 → 다른 해결책 꼴이에요. (2) A common answer는 남들이 쓰는 방법(반대쪽)이고, 주장 (3)에는 but · yet 같은 신호 말이 없어요. (7)은 흔한 해결책을 다시 꺼내지만 그 한계를 짚는 근거예요. (1)은 문제를 보여 주는 장면이에요(예시 · 근거 둘 다 인정).","ko":["모둠 과제에서는 한 학생이 늦게까지 깨어 발표 자료를 마무리하는 동안 나머지는 끝에 자기 이름만 올리는 일이 흔하다.","흔한 해결책은 모둠원마다 따로 점수를 매기거나 반 친구끼리 몰래 서로 평가하게 해서, 무임승차한 학생이 점수를 잃게 하는 것이다.","더 간단하면서도 더 잘 통하는 해결책이 있을지 모른다. 모둠을 다섯이나 여섯이 아니라 셋으로 작게 꾸리는 것이다.","여섯 명 모둠에서는 한 명이 쉽게 입을 다물고도 눈에 띄지 않을 수 있다. 나머지 다섯이 도움 없이도 끝낼 수 있기 때문이다.","그러나 세 명 모둠에서는 빠진 몫이 모두 뻔히 드러나고, 수줍은 모둠원의 말도 들릴 가능성이 더 크다.","여섯 명 모둠에서 세 명 모둠으로 바꾼 한 선생님은 늘 앞장서던 학생만이 아니라 거의 모든 학생이 참여한다는 것을 알게 되었다.","이와 달리 따로 매기는 점수는 과제가 끝난 뒤 무임승차한 학생을 잡아낼 수는 있어도, 그들을 일에 끌어들이는 데는 별 도움이 안 된다.","다시 말해, 무임승차는 게으른 학생이 아니라 숨기가 너무 쉬운 모둠을 보여 주는 표시인 때가 많다."],"words":[[["group projects","모둠 과제"],["stays up late","늦게까지 깨어 있다"],["slides","(발표용) 화면 자료"]],[["grade","점수를 매기다"],["separately","따로"],["rate","평가하다"],["free riders","무임승차자(일은 안 하고 덕만 보는 사람)"]],[["fix","해결책"],["works better","더 잘 통하다(효과가 더 있다)"],["instead of","~ 대신에"]],[["silent","말이 없는"],["go unnoticed","눈에 띄지 않고 넘어가다"]],[["missing","빠진"],["obvious","뻔히 보이는, 분명한"],["more likely to","~할 가능성이 더 큰"]],[["switched from","(switch from A to B) A에서 B로 바꾸다"],["took part","참여했다"],["usual","늘 하던, 평소의"]],[["by contrast","이와 달리"],["catch","잡아내다"],["do little","(do little to ~) ~하는 데 별 도움이 안 되다"]],[["In other words","다시 말해"],["free riding","무임승차"],["sign","표시, 징후"],["lazy","게으른"]]],"rwhy":["모둠 과제에서 흔히 보는 장면 하나로 문제를 보여 주니 예시예요. 글이 다룰 문제를 알려 주는 사실이라 근거로 골라도 맞아요.","A common answer(흔한 해결책)는 남들이 쓰는 방법이에요. 글쓴이는 (3)에서 더 나은 방법을 내놓으니 반대쪽이에요.","but · yet 같은 신호 말은 없지만, (2)의 흔한 방법보다 a simpler fix that works better(더 간단하고 더 잘 통하는 해결책)를 내놓아요. 이것이 글쓴이가 하고 싶은 말이라 주장이에요.","큰 모둠에서는 왜 숨기 쉬운지 까닭을 말해요. 작은 모둠이 낫다는 (3)을 받치니 근거예요.","however는 (4)의 여섯 명과 세 명을 견주는 말이에요. 작은 모둠의 좋은 점을 들어 (3)을 받치니 근거예요.","One teacher(한 선생님)가 겪은 일 하나로 보여 주니 예시예요. 작은 모둠이 통한다는 것을 받치니 근거로 골라도 맞아요.","(2)의 흔한 해결책을 다시 꺼내지만, 그 한계를 짚어 작은 모둠이 낫다는 (3)을 받쳐요. 그래서 반대쪽이 아니라 근거예요.","In other words(다시 말해)로 끝에서 글 전체를 묶으니 결론이에요. not A but B에서 B(숨기 쉬운 모둠)가 글쓴이의 생각이라 주장으로 골라도 맞아요."]},{"id":"P9","title":"쉬는 시간 늘리기","sents":[["A five-minute break between classes is too short, and schools that stretch it to ten or fifteen minutes may find their students learning more, not less.","주장","쉬는 시간 늘리기 → 더 잘 배움"],["Of course, longer breaks take minutes away from lessons, and over a whole year those minutes can add up to several school days.","반대쪽","긴 쉬는 시간 → 수업 시간 줄어듦"],["Yet a tired brain does not take in new material well, so extra minutes of teaching do not always turn into extra learning.","근거","지친 뇌 → 더 가르쳐도 더 배우진 않음"],["In just five minutes, most students can only hurry to the restroom or carry their books to the next room, with no time to rest.","예시","5분 → 화장실·교실 이동뿐",["근거"]],["A longer break leaves time to walk outside, chat with friends, or simply sit quietly, and each of these helps a tired mind recover.","근거","긴 쉬는 시간 → 지친 머리 회복",["예시"]],["When one middle school added ten minutes between morning classes, its teachers reported that students settled down faster at the start of each lesson.","예시","쉬는 시간 늘린 학교 → 수업 시작 때 빨리 차분해짐",["근거"]],["The minutes those teachers had once spent calming the class were, in a sense, given back to the lesson.","근거","반 달래던 시간 → 수업에 돌아옴",["예시"]],["A break, then, is not time taken away from learning but part of what makes learning possible.","결론","쉬는 시간 = 배움의 일부",["주장"]]],"line":"쉬는 시간을 늘리면 수업 시간이 줄지만, 지친 뇌는 덜 배우니 오히려 더 잘 배울 수 있다. 쉬는 시간은 배움을 빼앗는 시간이 아니라 배움의 일부다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["tired minds as the main obstacle to classroom learning","careful use of every minute of lesson time","student stress as a reason for longer class breaks","longer breaks between classes as an aid to learning","outdoor activity as a key part of the school day"],"ans":3,"why":"한 줄의 「쉬는 시간을 늘리면 오히려 더 잘 배울 수 있다」가 정답(longer breaks between classes as an aid to learning)과 같아요. 「tired minds as the main obstacle to classroom learning」는 (3)의 Yet 뒤에 끌린 말인데, 지친 뇌 이야기는 쉬는 시간을 늘려야 하는 까닭(근거) 하나일 뿐이에요. 「careful use of every minute of lesson time」는 양보 (2)의 걱정 쪽 말인데, (3)의 Yet이 뒤집고 (7)에서 그 시간이 수업에 돌아온다고(given back to the lesson) 해요. 「student stress as a reason for longer class breaks」는 그럴듯하지만 글은 스트레스가 아니라 배움을 말해요(part of what makes learning possible). 「outdoor activity as a key part of the school day」는 (5)의 walk outside에 끌린 말인데, 밖을 걷기는 쉬는 방법 셋 가운데 하나일 뿐이에요.","tip":"이 글은 첫 문장이 바로 주장이에요. (2)의 Of course는 반대쪽을 잠깐 인정하는 말이고, (3)의 Yet 뒤는 새 주장이 아니라 (1)을 받치는 근거예요. 맨 끝 (8)이 (1)을 다시 말해 줘요.","ko":["수업 사이 쉬는 시간 5분은 너무 짧다. 이것을 10분이나 15분으로 늘리는 학교는 학생들이 덜이 아니라 오히려 더 많이 배우는 것을 보게 될지도 모른다.","물론 쉬는 시간이 길어지면 수업에서 몇 분씩 빠지고, 한 해 동안 그 시간이 모이면 수업 며칠 치가 될 수 있다.","하지만 지친 뇌는 새로운 내용을 잘 받아들이지 못하므로, 몇 분 더 가르친다고 늘 그만큼 더 배우는 것은 아니다.","5분밖에 없으면 대부분의 학생은 화장실에 서둘러 다녀오거나 다음 교실로 책을 옮기는 것밖에 못 하고, 쉴 틈은 없다.","쉬는 시간이 길면 밖을 걷거나 친구와 이야기하거나 그냥 조용히 앉아 있을 시간이 생기고, 이 하나하나가 지친 머리를 회복시키는 데 도움이 된다.","한 중학교가 오전 수업 사이에 쉬는 시간을 10분 늘렸을 때, 교사들은 학생들이 수업이 시작될 때마다 더 빨리 차분해졌다고 전했다.","그 교사들이 전에 반을 진정시키느라 쓰던 몇 분은, 말하자면 수업으로 되돌아온 셈이었다.","그러니 쉬는 시간은 배움에서 빼앗긴 시간이 아니라, 배움을 가능하게 하는 것의 일부다."],"words":[[["stretch","늘리다, 늘이다"],["not less","(more, not less) 덜이 아니라 더"]],[["Of course","물론"],["take minutes away from","~에서 몇 분을 빼앗다"],["add up to","모여서 ~이 되다"]],[["Yet","하지만"],["take in","받아들이다, 머리에 넣다"],["material","(배울) 내용, 자료"],["turn into","~이 되다, ~으로 바뀌다"]],[["hurry","서둘러 가다"],["restroom","화장실"]],[["leaves time to","~할 시간을 남기다"],["chat","수다를 떨다, 이야기하다"],["recover","회복하다"]],[["reported","알렸다, 전했다"],["settled down","차분해졌다, 자리 잡았다"]],[["calming","진정시키는, 가라앉히는"],["in a sense","말하자면, 어떤 면에서"],["given back to","~에 되돌려진"]],[["then","그러니, 그렇다면"],["taken away from","~에서 빼앗긴"],["makes learning possible","배움을 가능하게 하다"]]],"rwhy":["첫 문장부터 글쓴이의 생각(쉬는 시간을 늘리면 더 잘 배운다)을 바로 말해요. 앞에 남들 생각이 없고, 뒤 문장들이 이 말을 받치거나 따지니 주장이에요.","Of course(물론)로 쉬는 시간을 늘릴 때 잃는 것을 잠깐 인정해요(양보). 바로 다음 (3)의 Yet이 이것을 뒤집으니 반대쪽이에요.","Yet(하지만) 뒤에 나오지만 새 주장이 아니에요. (2)의 걱정에 답하며 「지친 뇌는 덜 배운다」는 까닭을 대어 (1)을 받치니 근거예요.","5분 동안 학생들이 실제로 하는 일(화장실 다녀오기 · 교실 옮기기)을 장면으로 보여 주니 예시예요. 5분으로는 쉴 수 없다는 것이 주장을 받치니 근거로 골라도 맞아요.","긴 쉬는 시간이 왜 좋은지(지친 머리가 회복된다) 까닭을 대어 주장을 받쳐요. 그래서 근거예요. 밖을 걷기 · 친구와 이야기하기처럼 할 일을 늘어놓은 문장으로 읽으면 예시로 골라도 맞아요.","When one middle school(한 중학교가 ~했을 때)로 실제로 있었던 일 하나를 들어요. 사례라 예시예요. 쉬는 시간을 늘리니 좋아졌다는 것이 주장을 받치니 근거로 골라도 맞아요.","(2)의 걱정(수업 시간이 빠진다)에 답해요. 반을 달래던 시간이 수업으로 돌아오니 실제로 잃는 시간은 적다는 까닭이라 근거예요. (6)의 학교 이야기가 이어지는 문장으로 읽으면 예시로 골라도 맞아요.","then(그러니)으로 글을 맺으며 「쉬는 시간 = 배움의 일부」라고 (1)을 다시 말해요. 그래서 결론이에요. 글쓴이의 생각을 다시 밝히는 문장이라 주장으로 골라도 맞아요."]},{"id":"P10","title":"모둠 역할 돌아가며 맡기","sents":[["In one class, the same three students led every group project last year, while the rest mostly waited to be told what to do.","예시","한 반 → 같은 셋만 이끌고 나머지는 기다림",["근거"]],["Classes would do better to rotate jobs such as group leader, note taker, and presenter, so that every student takes a turn at each one.","주장","모둠 역할 → 돌아가며 맡기"],["Leading a group is a skill that grows only with practice, and students who never get the chance have no way to develop it.","근거","이끄는 힘 → 해 봐야 자람"],["A quiet student who has to present just once may discover that she can speak in front of others far better than she expected.","예시","조용한 학생 발표 → 생각보다 잘함",["근거"]],["Admittedly, a group usually finishes its work faster when its most confident member is always in charge of it.","반대쪽","늘 같은 리더 → 빨리 끝남"],["Some strong students may also feel that sharing the lead slows them down and lowers the quality of the final project.","반대쪽","잘하는 학생 → 느려지고 결과 나빠질까 걱정"],["But a school project is meant to build abilities rather than to produce the best possible poster, so a slower first try is part of the point.","근거","학교 과제 → 결과보다 능력 기르기",["주장"]],["When the roles move around, the class may lose a little speed but gain many more students who know how to lead.","결론","역할 돌리기 → 속도 조금 잃고 이끄는 학생 늘어남",["주장"]]],"line":"모둠 일을 늘 같은 몇 명만 이끌기보다 역할을 돌아가며 맡게 해야 한다. 이끄는 힘은 해 봐야 자라니, 조금 느려져도 이끌 줄 아는 학생이 많아진다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["rotating group roles as leadership practice for all","skill building as the real aim of every school project","teamwork skills as preparation for later working life","group grades that reward each member's effort","efficient groups led by their most able members"],"ans":0,"why":"한 줄의 「역할을 돌아가며 맡게 해야 한다」가 정답(rotating group roles as leadership practice for all)과 같아요. 「skill building as the real aim of every school project」는 (7)의 But 뒤에 끌린 말인데, (7)은 (5)(6)의 걱정에 답하는 근거일 뿐 글은 모둠 역할을 돌리자고 해요(rotate jobs). 「teamwork skills as preparation for later working life」는 그럴듯하지만 글에 없어요. 글은 나중의 직업이 아니라 지금 이끄는 힘을 연습하는 것을 말해요(a skill that grows only with practice). 「group grades that reward each member's effort」도 모둠 과제 하면 떠오르는 말이지만 글에 점수 이야기는 없어요. 「efficient groups led by their most able members」는 양보 (5)를 주제로 잡은 말인데, (8)에서 속도는 조금 잃어도(lose a little speed) 얻는 것이 더 크다고 해요.","tip":"사례 (1)로 시작하고 주장은 둘째 문장에 바로 나와요. (5)(6)은 걱정을 인정하는 반대쪽이고, (7)의 But 뒤는 새 주장이 아니라 그 걱정에 답하는 근거예요.","ko":["한 반에서는 지난해 같은 세 학생이 모든 모둠 과제를 이끌었고, 나머지는 대개 무엇을 할지 말해 주기를 기다리기만 했다.","각 반은 모둠장, 기록하는 사람, 발표자 같은 일을 돌아가며 맡겨, 모든 학생이 하나하나를 차례로 해 보게 하는 편이 낫다.","모둠을 이끄는 것은 연습해야만 자라는 능력이어서, 기회를 한 번도 얻지 못한 학생은 그 능력을 키울 길이 없다.","조용한 학생도 한 번만 발표를 맡아 보면, 자기가 남 앞에서 생각보다 훨씬 말을 잘한다는 것을 알게 될 수도 있다.","물론 가장 자신 있는 사람이 늘 맡으면 모둠은 대개 일을 더 빨리 끝낸다.","몇몇 잘하는 학생은 이끄는 일을 나누면 자기가 느려지고 최종 과제의 질도 떨어진다고 느낄 수도 있다.","그러나 학교 과제는 최고의 포스터를 만들기보다 능력을 기르기 위한 것이므로, 처음에 좀 느린 것도 과제가 노리는 것의 하나다.","역할이 돌아가면 반은 속도를 조금 잃을지 몰라도, 이끌 줄 아는 학생을 훨씬 많이 얻게 된다."],"words":[[["led","이끌었다(lead의 과거)"],["the rest","나머지(사람들)"],["waited to be told","말해 주기를 기다렸다"]],[["would do better to","~하는 편이 낫다"],["rotate","돌아가며 맡기다, 교대하다"],["note taker","기록하는 사람"],["takes a turn","차례로 맡다"]],[["skill","능력, 솜씨"],["practice","연습"],["develop","키우다, 기르다"]],[["present","발표하다"],["discover","알게 되다, 발견하다"],["in front of","~ 앞에서"],["expected","예상했다"]],[["Admittedly","물론, 인정하건대"],["confident","자신 있는"],["in charge of","~을 맡은"]],[["sharing the lead","이끄는 일을 나누는 것"],["slows them down","그들을 느리게 하다"],["quality","질, 품질"],["final","마지막의, 최종의"]],[["is meant to","~하기 위한 것이다"],["rather than","~보다는, ~ 대신"],["the best possible","할 수 있는 한 가장 좋은"],["part of the point","노리는 것의 하나, 목적의 일부"]],[["move around","돌아가다, 옮겨 다니다"],["gain","얻다"]]],"rwhy":["In one class(한 반에서)로 한 반의 장면을 보여 주며 글을 열어요. 구체적인 사례라 예시예요. 이런 일이 있으니 역할을 돌리자는 (2)의 까닭으로 읽으면 근거로 골라도 맞아요.","would do better to(~하는 편이 낫다)로 글쓴이가 바라는 것을 밝혀요. (1)의 문제에 대한 글쓴이의 답이고 뒤 문장들이 이것을 받치니 주장이에요.","역할을 돌려야 하는 까닭(이끄는 힘은 해 봐야 자란다)을 대어 (2)를 받치니 근거예요.","조용한 학생 한 명의 장면으로 역할을 맡으면 생기는 일을 보여 줘요. 그래서 예시예요. 해 봐야 는다는 (3)을 받치니 근거로 골라도 맞아요.","Admittedly(물론)로 늘 같은 사람이 맡을 때의 좋은 점을 잠깐 인정해요(양보). 글쓴이가 넘으려는 쪽의 생각이라 반대쪽이에요.","also(또한)로 역할을 돌리는 데 대한 걱정을 하나 더 들어요. (5)와 같은 쪽 생각이고 (7)의 But이 뒤집으니 반대쪽이에요.","But 뒤에 나오지만 (2)를 새로 말하는 게 아니라 (5)(6)의 걱정에 답하는 까닭이에요(과제는 능력을 기르기 위한 것). 그래서 근거예요. 글쓴이의 생각을 밝히는 말로 읽으면 주장으로 골라도 맞아요.","앞의 이야기를 「속도는 조금 잃어도 이끌 줄 아는 학생이 늘어난다」로 정리하며 끝맺어요. 그래서 결론이에요. 역할을 돌리자는 (2)를 다시 밝히는 말이라 주장으로 골라도 맞아요."]},{"id":"P11","title":"도서관 연체료 없애기","sents":[["For a long time, libraries charged a small fine for every late book, on the belief that the fear of paying would bring books back on time.","반대쪽","연체료 → 책 제때 돌아온다는 믿음"],["Yet when one city library stopped charging fines, more of its books came back, not fewer, within the first year.","예시","연체료 없앤 도서관 → 책 더 돌아옴",["근거"]],["Many people who had stayed away for years because of unpaid fines also returned, some carrying books they had kept out of embarrassment.","예시","밀린 연체료로 끊겼던 사람 → 다시 옴",["근거"]],["A fine rarely stops a careless reader from returning books late, but it can easily keep a family that cannot spare the money from ever coming back.","근거","연체료 → 형편 어려운 가족 막음"],["Collecting the small coins also took up staff time that could have gone into helping readers find books.","근거","연체료 걷기 → 직원 시간 뺏음"],["Libraries may therefore serve their towns better by dropping late fines than by keeping them.","주장","연체료 없애기 → 도서관이 마을에 더 도움"],["This does not mean that books can be kept forever, and most libraries still ask readers to pay for the books they lose.","반대쪽","책 영원히 갖기 X → 잃은 책은 물어냄"],["A library's goal, after all, is to keep books moving between readers, not to collect coins at the front desk.","결론","도서관 목표 = 책 돌기(돈 걷기 아님)",["주장"]]],"line":"도서관은 연체료가 있어야 책이 돌아온다고 믿었지만, 한 도시 도서관이 연체료를 없애자 책도 사람도 더 돌아왔다. 연체료는 형편이 어려운 가족을 막고 직원 시간을 뺏으니, 없애는 편이 마을에 더 도움이 된다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["fear of paying as a spur to returning books on time","surprising results at one fine-free city library","free public programs as a way to draw in families","staff time as a library's most precious resource","dropping late fines as a gain for libraries and towns"],"ans":4,"why":"한 줄의 「연체료는 형편이 어려운 가족을 막고 직원 시간을 뺏으니, 없애는 편이 마을에 더 도움이 된다」가 정답(dropping late fines as a gain for libraries and towns)과 같아요. 「fear of paying as a spur to returning books on time」는 통념 (1)을 주제로 잡은 말인데, (2)에서 연체료를 없애자 책이 더 돌아왔어요(more of its books came back). 「surprising results at one fine-free city library」는 (2)의 Yet 뒤에 끌린 말인데, (2)(3)은 한 도서관의 사례일 뿐이고 (6)의 therefore가 이 사례를 모아 도서관 전체의 이야기로 넓혀요. 「free public programs as a way to draw in families」는 그럴듯하지만 글에 없어요. 글은 새 행사가 아니라 연체료를 없애자고 해요(dropping late fines). 「staff time as a library's most precious resource」는 (5)에 끌린 말인데, 직원 시간은 연체료를 없앨 까닭 하나일 뿐이에요.","tip":"(2)의 Yet 뒤가 주장일 것 같지만 한 도서관의 사례예요. 주장은 여섯째 문장 (6)의 therefore에서 나오고, (7)은 지나친 해석을 막는 반대쪽, (8)은 (6)을 다시 말하는 결론이에요.","ko":["오랫동안 도서관은 늦게 돌려준 책마다 적은 연체료를 물렸는데, 돈을 내야 한다는 두려움이 책을 제때 돌아오게 할 거라고 믿었기 때문이다.","그런데 한 도시의 도서관이 연체료를 없애자, 첫해 안에 책이 덜이 아니라 오히려 더 많이 돌아왔다.","밀린 연체료 때문에 여러 해 동안 발길을 끊었던 많은 사람도 다시 왔는데, 그중에는 창피해서 갖고만 있던 책을 들고 온 사람도 있었다.","연체료가 있다고 덤벙대는 독자가 책을 늦게 내지 않게 되는 일은 드물지만, 그 돈을 낼 여유가 없는 가족은 다시는 오지 못하게 막기 쉽다.","또 그 작은 동전들을 걷는 데 직원들의 시간이 들었는데, 그 시간은 독자가 책을 찾도록 돕는 데 쓰일 수도 있었다.","그러므로 도서관은 연체료를 두기보다 없애는 편이 마을에 더 도움이 될 수 있다.","그렇다고 책을 영원히 가지고 있어도 된다는 뜻은 아니며, 대부분의 도서관은 여전히 잃어버린 책값은 물어내게 한다.","결국 도서관의 목표는 책이 독자들 사이를 계속 오가게 하는 것이지, 대출 창구에서 동전을 걷는 것이 아니다."],"words":[[["charged","(돈을) 물렸다, 받았다"],["fine","벌금, 연체료"],["on the belief that","~라는 믿음으로"],["on time","제때"]],[["Yet","그런데, 하지만"],["charging","(돈을) 물리는"],["came back","돌아왔다"],["within","~ 안에"]],[["stayed away","발길을 끊었다, 오지 않았다"],["unpaid","내지 않은, 밀린"],["out of embarrassment","창피해서"]],[["rarely","좀처럼 ~ 않는"],["careless","부주의한, 덤벙대는"],["spare","(돈 · 시간을) 내다, 떼어 주다"],["from ever coming back","(keep A from ~ing) A가 다시는 오지 못하게"]],[["took up","(시간을) 차지했다"],["staff","직원"],["could have gone into","~에 쓰일 수도 있었다"]],[["therefore","그러므로"],["serve","(~에) 도움이 되다, 봉사하다"],["dropping","없애는, 그만두는"]],[["This does not mean","그렇다고 ~라는 뜻은 아니다"],["forever","영원히"],["pay for","~의 값을 치르다"]],[["after all","결국, 어쨌든"],["keep books moving","책이 계속 돌게 하다"],["front desk","안내 창구, 대출대"]]],"rwhy":["오랫동안 도서관이 믿어 온 생각(연체료가 있어야 책이 제때 돌아온다)이에요. 바로 다음 (2)의 Yet에서 뒤집히니 반대쪽이에요.","Yet 뒤에 나오지만 글쓴이의 주장이 아니라 one city library(한 도시의 도서관)에서 일어난 일이에요. 사례라 예시예요. (1)의 믿음을 뒤집는 사실이라 근거로 골라도 맞아요.","also(또한)로 같은 도서관에서 생긴 일을 하나 더 보여 줘요. 사례라 예시예요. 연체료를 없애면 좋다는 것을 받치니 근거로 골라도 맞아요.","앞의 사례가 왜 그런지 까닭을 대요. 연체료는 정작 막을 사람은 못 막고 형편이 어려운 가족을 막는다는 것이라 근거예요.","also(또)로 연체료의 손해를 하나 더 보태요. 주장을 받치는 까닭이라 근거예요.","therefore(그러므로)로 앞의 사례와 까닭을 모아 글쓴이의 생각을 밝혀요. 여섯째 문장에야 나오지만 이것이 주장이에요.","This does not mean(그렇다고 ~라는 뜻은 아니에요)으로 「연체료가 없으면 책을 아예 안 돌려줘도 되나」라는 걱정을 짚고, 잃은 책값은 여전히 문다고 인정해요. 주장이 지나치게 읽히지 않게 선을 긋는 말이라 반대쪽이에요.","after all(결국)로 도서관이 정말 하려는 일을 밝히며 끝맺어요. (6)을 다른 말로 다시 하니 결론이에요. 글쓴이의 생각을 다시 밝히는 문장이라 주장으로 골라도 맞아요."]},{"id":"P12","title":"위험해 보이는 놀이터","sents":[["Many people believe the best playground is one with soft ground, low equipment, and nothing that a child could fall from.","반대쪽","좋은 놀이터 = 낮고 푹신함(남들 생각)"],["Such playgrounds do cut down on broken arms, and few parents want to see their children carried off in an ambulance.","반대쪽","낮은 놀이터 → 팔 부러짐 줄어듦",["근거"]],["In one city that replaced its tall climbing structures with low ones, however, the playgrounds were soon used mostly by very young children.","예시","높은 기구 없앤 도시 → 어린아이만 놂",["근거"]],["Older children, finding nothing to challenge them, began climbing fences and trees outside the playground instead, where no one had made the ground soft.","예시","큰 아이들 → 놀이터 밖 담·나무 오름",["근거"]],["Children also seem to learn how high is too high only by trying low heights first and sometimes getting a few bruises.","근거","낮은 높이부터 해 봄 → 너무 높은 것을 앎"],["A child who has never faced any risk may be less prepared to judge a real danger later on.","근거","위험 없이 자람 → 진짜 위험 못 가늠"],["A good playground, then, should not remove every risk but offer risks that children can see and manage.","주장","좋은 놀이터 → 보이고 감당할 위험 주기"],["Keeping children from small falls today may only move their bigger falls to somewhere less safe tomorrow.","결론","작은 넘어짐 막기 → 큰 넘어짐을 더 위험한 곳으로 옮김",["주장"]]],"line":"흔히 놀이터는 낮고 푹신해야 안전하다고 여기지만, 한 도시가 높은 기구를 없애자 큰 아이들은 놀이터 밖 더 위험한 곳으로 갔다. 아이는 작은 위험으로 배우니, 좋은 놀이터는 감당할 수 있는 위험을 주어야 한다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["taller equipment as a way to reduce child injuries","small risks in play as practice for judging danger","unstructured outdoor play as every child's right","adult supervision as the key to safe play","older children's need for play spaces of their own"],"ans":1,"why":"한 줄의 「아이는 작은 위험으로 배우니, 좋은 놀이터는 감당할 수 있는 위험을 주어야 한다」가 정답(small risks in play as practice for judging danger)과 같아요. 「taller equipment as a way to reduce child injuries」는 그럴듯한 반전처럼 들리지만 글과 어긋나요. (2)는 오히려 낮은 놀이터가 팔 부러지는 일을 줄인다고(do cut down on broken arms) 인정하고, 글은 다칠 일을 줄이자는 것이 아니라 감당할 위험을 주자는 거예요. 「unstructured outdoor play as every child's right」는 놀이 하면 떠오르는 그럴듯한 말이지만 글에 없어요. 「adult supervision as the key to safe play」도 글에 없어요. 글은 어른이 지켜보자는 게 아니라 아이가 스스로 위험을 보고 다루게 하자고 해요(risks that children can see and manage). 「older children's need for play spaces of their own」는 (3)(4)의 사례에 끌린 말인데, 큰 아이들이 떠난 까닭은 따로 놀 곳이 없어서가 아니라 도전할 것이 없어서예요(finding nothing to challenge them).","tip":"남들 생각 (1)과 그 생각이 옳은 면 (2)를 먼저 인정하는 글이에요. (3)의 however 뒤는 주장이 아니라 사례이고, 주장은 일곱째 문장 (7)의 then에서야 나와요. (8)은 그것을 다시 말하는 결론이에요.","ko":["많은 사람은 가장 좋은 놀이터란 바닥이 푹신하고 기구가 낮으며 아이가 떨어질 만한 것이 하나도 없는 곳이라고 믿는다.","그런 놀이터는 실제로 팔이 부러지는 일을 줄여 주고, 아이가 구급차에 실려 가는 것을 보고 싶은 부모는 거의 없다.","그러나 높은 오르기 기구를 낮은 것으로 바꾼 한 도시에서는 곧 놀이터에는 주로 아주 어린아이들만 오게 되었다.","더 큰 아이들은 도전할 만한 것을 찾지 못하자 대신 놀이터 밖의 담장과 나무를 오르기 시작했는데, 그곳은 아무도 바닥을 푹신하게 해 두지 않은 곳이었다.","아이들은 또 낮은 높이부터 해 보고 가끔 멍도 몇 번 들어 봐야만 어디까지가 너무 높은지 배우는 것 같다.","어떤 위험도 겪어 보지 못한 아이는 나중에 진짜 위험을 가늠할 준비가 덜 되어 있을 수 있다.","그러니 좋은 놀이터는 모든 위험을 없앨 것이 아니라, 아이들이 눈으로 보고 감당할 수 있는 위험을 주어야 한다.","오늘 아이들이 작게 넘어지는 것을 막으면, 더 크게 넘어지는 일을 내일 덜 안전한 어딘가로 옮겨 놓을 뿐일지도 모른다."],"words":[[["playground","놀이터"],["equipment","기구, 장비"],["fall from","~에서 떨어지다"]],[["cut down on","~을 줄이다"],["few","(a 없이) 거의 없는"],["carried off","실려 가는"],["ambulance","구급차"]],[["replaced","(replace A with B) A를 B로 바꿨다"],["climbing structures","오르기 기구(정글짐 같은 것)"],["mostly","주로, 대부분"]],[["challenge","도전 의식을 불러일으키다, 시험하다"],["fences","담장, 울타리"],["instead","대신"]],[["how high is too high","어디까지가 너무 높은지"],["heights","높이, 높은 곳"],["bruises","멍"]],[["faced","맞닥뜨렸다, 겪었다"],["prepared","준비가 된"],["judge","가늠하다, 판단하다"],["later on","나중에"]],[["then","그러니"],["remove","없애다"],["manage","감당하다, 다루다"]],[["Keeping children from","(keep A from ~) A를 ~에서 막다"],["falls","넘어짐, 떨어짐"]]],"rwhy":["Many people believe(많은 사람은 ~라고 믿는다)로 남들 생각을 먼저 내놓아요. 글쓴이가 뒤에서 뒤집으려는 생각이라 반대쪽이에요.","do cut down(실제로 줄여 준다)으로 (1)의 생각이 옳은 면을 인정해요. 글쓴이가 넘으려는 쪽의 이야기라 반대쪽이에요. 그쪽 생각을 받치는 까닭이라 근거로 골라도 맞아요.","however가 있지만 주장이 아니라 In one city(한 도시에서) 일어난 일이에요. 사례라 예시예요. (1)의 생각대로 했을 때 생긴 문제를 보여 주니 근거로 골라도 맞아요.","같은 도시에서 이어진 장면이라 예시예요. 낮은 기구가 오히려 아이들을 더 위험한 곳으로 보냈다는 것이 주장을 받치니 근거로 골라도 맞아요.","also(또)로 위험이 아이에게 왜 필요한지 까닭을 대요. 주장을 받치는 이유라 근거예요.","(5)에 이어 위험을 다 없애면 생기는 문제를 대어 주장을 받쳐요. 그래서 근거예요.","then(그러니)으로 앞의 사례와 까닭을 모아 글쓴이의 생각을 밝혀요. not A but B에서 B(감당할 수 있는 위험 주기)가 핵심이에요. 일곱째 문장에야 나오지만 이것이 주장이에요.","「작은 넘어짐을 막으면 큰 넘어짐이 다른 곳으로 옮겨 간다」는 말로 (4)의 장면과 (7)을 묶어 끝맺어요. 그래서 결론이에요. 글쓴이의 생각을 다시 밝히는 말이라 주장으로 골라도 맞아요."]}]},"mid":{"choose":[{"id":"M1-1","k":1,"dev":"thanks largely to (까닭)","s":"One clinic moved its hand sanitizer bottles from the hallway to each patient's bed, and staff now clean their hands twice as often, thanks largely to the visual reminder.","a":"세정제 병상 곁으로 옮김 → 직원 손 위생 잦아짐","why":"thanks largely to 뒤는 까닭을 덧붙인 말이에요. 요점은 그 앞의 두 주절이에요. 한 병원이 손 세정제 통을 복도에서 침대(병상) 곁으로 옮기자(moved its hand sanitizer bottles from the hallway to each patient's bed) 직원들이 손을 두 배로 자주 닦게 됐어요(staff now clean their hands twice as often). 눈에 보여 일깨워 준다는 것(the visual reminder)은 그 까닭일 뿐이에요. 그래서 요점은 세정제를 병상 곁으로 옮기자 직원의 손 위생이 잦아졌다는 거예요.","tr":[["세정제 병상 곁으로 옮김 → 방문객 손 소독 잦아짐","세정제를 병상 곁으로 옮긴 것은 맞지만 누가 달라졌는지를 바꿨어요. 방문객 이야기는 글에 없고, 손을 두 배로 자주 닦게 된 사람은 직원들이에요(staff now clean their hands twice as often)."],["복도에 세정제 더 놓음 → 직원 손 위생 잦아짐","hallway 낱말은 같지만 한 일이 달라요. 복도에 더 놓은 것이 아니라 복도에 있던 것을 병상 곁으로 옮겼어요(from the hallway to each patient's bed)."],["복도에 세정제 더 놓음 → 방문객 손 소독 잦아짐","복도에 세정제를 두면 오가는 방문객이 쓴다는 그럴듯한 말이지만 앞뒤가 다 글과 달라요. 세정제는 복도에서 병상 곁으로 옮겼고(from the hallway to each patient's bed), 손을 더 자주 닦게 된 사람은 직원들이에요(staff now clean their hands twice as often)."],["눈에 잘 띄는 세정제 → 손 닦으라고 일깨워 줌","thanks largely to 뒤의 까닭(the visual reminder)만 옮겼어요. 왜 그렇게 됐는지일 뿐, 요점은 옮기고 나서 직원들이 손을 두 배로 자주 닦는다는 거예요(staff now clean their hands twice as often)."]],"dg":"thanks largely to"},{"id":"M1-2","k":1,"dev":"according to ~ (출처를 덧붙임)","s":"A small airport replaced its boarding announcements with display screens, and passengers now describe the building as far calmer, according to a survey the airport carried out.","a":"탑승 방송을 화면으로 → 공항이 한결 차분해짐","why":"according to 뒤는 누가 알아봤는지 출처를 덧붙인 말이에요. 요점은 그 앞의 두 주절이에요. 한 작은 공항이 탑승 안내 방송을 화면으로 바꾸자(replaced its boarding announcements with display screens) 승객들이 공항 건물이 훨씬 차분해졌다고 말해요(passengers now describe the building as far calmer). 공항이 한 설문이라는 것(a survey the airport carried out)은 출처일 뿐이에요. 그래서 요점은 탑승 방송을 화면으로 바꾸자 공항이 한결 차분해졌다는 거예요.","tr":[["탑승 방송을 화면으로 → 비행기 놓치는 일 잦아짐","방송을 화면으로 바꾼 것은 맞지만 결과를 바꿨어요. 비행기를 놓친다는 걱정은 글에 없고, 승객들이 전한 변화는 건물이 훨씬 차분해졌다는 거예요(describe the building as far calmer)."],["탑승 안내 화면 늘림 → 공항이 한결 차분해짐","screens 낱말은 같지만 한 일이 달라요. 화면을 더 단 것이 아니라 탑승 방송을 화면으로 바꿨어요(replaced its boarding announcements with display screens)."],["탑승 안내 화면 늘림 → 비행기 놓치는 일 잦아짐","공항 글에서 떠올릴 만한 말이지만 앞뒤가 다 글과 달라요. 공항은 화면을 늘린 것이 아니라 방송을 화면으로 바꿨고(replaced its boarding announcements with display screens), 승객들은 건물이 훨씬 차분해졌다고 해요(far calmer)."],["작은 공항 → 이용객에게 직접 설문 조사함","according to 뒤의 출처(a survey the airport carried out)만 옮겼어요. 누가 알아봤는지일 뿐, 요점은 방송을 화면으로 바꾸자 승객들이 건물이 더 차분해졌다고 여긴다는 거예요(describe the building as far calmer)."]],"dg":"according to"},{"id":"M1-3","k":1,"dev":"regardless of ~ (뒤집지 않고 「가리지 않고」)","s":"One supermarket chain began displaying the distance each vegetable had traveled, and sales of local produce rose at every branch, regardless of the neighborhood's average income.","a":"채소 이동 거리 표시 → 가까운 데서 난 것 잘 팔림","why":"regardless of는 앞말을 뒤집는 말이 아니라 「~을 가리지 않고」라는 덧붙임이에요. 요점은 그 앞의 두 주절이에요. 한 슈퍼마켓 체인이 채소마다 얼마나 먼 길을 왔는지 보여 주기 시작하자(began displaying the distance each vegetable had traveled) 지역 농산물 판매가 올랐어요(sales of local produce rose). 동네의 평균 소득을 가리지 않고 모든 지점에서 그랬다는 것(at every branch, regardless of the neighborhood's average income)은 범위를 덧붙인 말이에요. 그래서 요점은 이동 거리를 표시하자 가까운 데서 난 것이 잘 팔렸다는 거예요.","tr":[["채소 이동 거리 표시 → 잘사는 동네서만 통함","income 낱말은 같지만 거꾸로 읽었어요. regardless of는 소득을 가리지 않는다는 말이고, 판매는 모든 지점에서 올랐어요(at every branch, regardless of the neighborhood's average income)."],["채소 수확 날짜 표시 → 잘사는 동네서만 통함","displaying · income 낱말은 같지만 앞뒤가 다 글과 달라요. 보여 준 것은 채소가 온 거리이고(displaying the distance each vegetable had traveled), 판매는 소득을 가리지 않고 모든 지점에서 올랐어요(at every branch)."],["채소 수확 날짜 표시 → 가까운 데서 난 것 잘 팔림","displaying 낱말은 같지만 보여 준 것이 달라요. 언제 거뒀는지가 아니라 채소마다 얼마나 먼 길을 왔는지를 보여 줬어요(began displaying the distance each vegetable had traveled)."],["동네 평균 소득 → 지역 채소 판매를 좌우함","regardless of 뒤 낱말(the neighborhood's average income)을 옮겼지만 뜻이 반대예요. 소득을 가리지 않고 모든 지점에서 올랐으니(at every branch) 소득이 판매를 가른 것이 아니에요."]],"dg":"regardless of"},{"id":"M1-4","k":1,"dev":"whose 관계절 (끼워 넣은 사정)","s":"One city, whose downtown streets carry forty bus routes, painted its bus lanes bright red, and private cars now stray into them far less often.","a":"버스 차로 색 입힘 → 승용차 침범 뜸해짐","why":"쉼표 사이의 whose 절은 그 도시의 사정을 끼워 넣은 말이에요(whose downtown streets carry forty bus routes). 걷어 내면 두 주절이 남아요. 도시가 버스 전용 차로를 새빨갛게 칠하자(painted its bus lanes bright red) 승용차가 그 차로로 잘못 들어서는 일이 훨씬 줄었어요(private cars now stray into them far less often). 그래서 요점은 버스 차로에 색을 입히자 승용차의 침범이 뜸해졌다는 거예요.","tr":[["버스 차로 색 입힘 → 버스 승객 늘어남","차로를 칠한 것은 맞지만 결과를 바꿨어요. 버스 승객이 늘었다는 말은 글에 없고, 줄어든 것은 승용차가 차로로 들어서는 일이에요(private cars now stray into them far less often)."],["버스 노선 수 늘림 → 승용차 침범 뜸해짐","bus routes 낱말은 같지만 한 일이 달라요. 노선 마흔 개는 원래 있던 사정이고(carry forty bus routes), 도시가 한 일은 버스 차로를 새빨갛게 칠한 거예요(painted its bus lanes bright red)."],["버스 노선 수 늘림 → 버스 승객 늘어남","버스 글에서 떠올릴 만한 말이지만 앞뒤가 다 글과 달라요. 도시는 차로를 칠했고(painted its bus lanes bright red), 달라진 것은 승용차예요(private cars now stray into them far less often)."],["도심 도로 → 버스 노선 마흔 개 지남","쉼표 사이에 끼운 사정(whose downtown streets carry forty bus routes)만 옮겼어요. 요점은 차로를 칠하자 승용차가 덜 들어선다는 거예요(private cars now stray into them far less often)."]],"dg":"whose 관계절"},{"id":"M1-5","k":1,"dev":"In an effort to ~ (목적)","s":"In an effort to reduce absences, one factory allowed workers over sixty to choose their own shifts, and resignations in that group have nearly stopped.","a":"고령 직원 근무조 직접 고름 → 그만두는 이 드물어짐","why":"In an effort to는 왜 그 일을 했는지 목적을 앞에 붙인 말이에요(In an effort to reduce absences). 요점은 그 뒤의 두 주절이에요. 한 공장이 예순이 넘은 직원에게 일할 시간대(근무조)를 스스로 고르게 하자(allowed workers over sixty to choose their own shifts) 그 무리에서 일을 그만두는 사람이 거의 없어졌어요(resignations in that group have nearly stopped). 그래서 요점은 고령 직원이 근무조를 직접 고르게 하자 그만두는 이가 드물어졌다는 거예요.","tr":[["고령 직원 근무조 직접 고름 → 결근 눈에 띄게 줄어듦","absences 낱말은 같지만 그것은 바란 목적이에요(In an effort to reduce absences). 결근이 실제로 줄었다는 말은 없고, 글이 전하는 결과는 그만두는 사람이 거의 없어졌다는 점이에요(resignations in that group have nearly stopped)."],["고령 직원 근무 시간 줄임 → 그만두는 이 드물어짐","shifts 낱말은 같지만 한 일이 달라요. 일하는 시간을 줄여 준 것이 아니라 시간대를 스스로 고르게 했어요(to choose their own shifts)."],["고령 직원 근무 시간 줄임 → 결근 눈에 띄게 줄어듦","일하는 시간을 줄이면 결근이 준다는 그럴듯한 말이지만 앞뒤가 다 글과 달라요. 공장은 시간대를 고르게 했고(to choose their own shifts), 글이 전하는 결과는 그만두는 사람이 거의 없어졌다는 거예요(resignations in that group have nearly stopped)."],["어느 공장 측 → 직원들의 결근 일수를 줄이고자 함","In an effort to 뒤의 목적(reduce absences)만 옮겼어요. 왜 했는지일 뿐, 요점은 근무조를 고르게 하자 그만두는 사람이 거의 없어졌다는 거예요(resignations in that group have nearly stopped)."]],"dg":"In an effort to"},{"id":"M1-6","k":1,"dev":"not to mention ~ (뒤집지 않고 하나 더 보탬)","s":"A packing warehouse began switching workers between tasks every two hours, and injuries from repeated movements have dropped by half, not to mention complaints about boredom.","a":"일 돌려 가며 맡김 → 같은 동작 탓 부상 반으로 줆","why":"not이 보여도 뒤집는 말이 아니에요. not to mention은 「~은 말할 것도 없고」라며 하나를 더 보태는 말이에요. 요점은 그 앞의 두 주절이에요. 한 포장 창고가 두 시간마다 직원들이 맡는 일을 바꿔 주기 시작하자(began switching workers between tasks every two hours) 같은 동작을 되풀이해서 생기는 부상이 절반으로 줄었어요(injuries from repeated movements have dropped by half). 지루하다는 불평(complaints about boredom)은 덤으로 보탠 말이에요. 그래서 요점은 일을 돌려 가며 맡기자 같은 동작 탓 부상이 반으로 줄었다는 거예요.","tr":[["일 돌려 가며 맡김 → 잘못 포장하는 일 반으로 줆","by half 낱말은 같지만 줄어든 것이 달라요. 포장 실수 이야기는 글에 없고, 절반으로 준 것은 같은 동작을 되풀이해 생기는 부상이에요(injuries from repeated movements have dropped by half)."],["두 시간마다 몸풀기 → 같은 동작 탓 부상 반으로 줆","every two hours 낱말은 같지만 한 일이 달라요. 두 시간마다 몸을 풀게 한 것이 아니라 맡는 일을 바꿔 줬어요(switching workers between tasks every two hours)."],["두 시간마다 몸풀기 → 잘못 포장하는 일 반으로 줆","몸을 풀면 실수가 준다는 그럴듯한 말이지만 앞뒤가 다 글과 달라요. 창고는 맡는 일을 바꿔 줬고(switching workers between tasks), 절반으로 준 것은 부상이에요(injuries from repeated movements have dropped by half)."],["일이 지루하다는 불평 → 이것도 함께 줄어듦","not 뒤가 답이라는 요령에 끌린 답이에요. not to mention 뒤(complaints about boredom)는 하나 더 보탠 덤일 뿐이고, 글이 앞세운 요점은 부상이 절반으로 줄었다는 거예요(injuries from repeated movements have dropped by half)."]],"dg":"not to mention"},{"id":"M1-7","k":1,"dev":"including ~ (보기를 덧붙임)","s":"Free repair workshops at one community center have sharply reduced the electronic waste collected in its neighborhood, including the broken kettles and toasters that once filled the local bins.","a":"무료 수리 모임 → 버려지는 가전 크게 줆","why":"including 뒤는 어떤 것들인지 보기를 덧붙인 말이에요. 요점은 그 앞의 주절이에요. 한 주민 센터에서 여는 무료 수리 모임이(Free repair workshops at one community center) 그 동네에서 거둬 가는 전자 폐기물을 크게 줄였어요(have sharply reduced the electronic waste collected in its neighborhood). 고장 난 주전자와 토스터(the broken kettles and toasters that once filled the local bins)는 그 폐기물의 보기일 뿐이에요. 그래서 요점은 무료 수리 모임이 버려지는 가전을 크게 줄였다는 거예요.","tr":[["무료 수리 모임 → 새 가전 판매 크게 줆","sharply reduced 낱말은 같지만 줄어든 것이 달라요. 새 물건 판매 이야기는 글에 없고, 줄어든 것은 동네에서 거둬 가는 전자 폐기물이에요(reduced the electronic waste collected in its neighborhood)."],["폐가전 무료 수거 → 버려지는 가전 크게 줆","Free · collected 낱말은 같지만 한 일이 달라요. 공짜로 해 준 것은 거둬 가기가 아니라 고쳐 주기예요(Free repair workshops at one community center)."],["폐가전 무료 수거 → 새 가전 판매 크게 줆","가전 글에서 떠올릴 만한 말이지만 앞뒤가 다 글과 달라요. 센터가 연 것은 수리 모임이고(Free repair workshops), 줄어든 것은 전자 폐기물이에요(reduced the electronic waste collected in its neighborhood)."],["주전자와 토스터 → 한때 수거함 채움","including 뒤의 보기(the broken kettles and toasters that once filled the local bins)만 옮겼어요. 어떤 폐기물인지일 뿐, 요점은 수리 모임이 전자 폐기물을 크게 줄였다는 거예요(have sharply reduced the electronic waste collected in its neighborhood)."]],"dg":"including"},{"id":"M1-8","k":1,"dev":"unlike ~ (견줄 곳을 덧붙임)","s":"A language school began texting students a reminder the evening before each lesson, and absences have fallen by half, unlike at its rival across the street.","a":"수업 전날 문자 알림 → 빠지는 수강생 반으로 줆","why":"unlike가 보여도 요점이 뒤집히지 않아요. unlike 뒤는 견줄 곳을 덧붙인 말이에요(unlike at its rival across the street). 요점은 그 앞의 두 주절이에요. 한 어학원이 수업 전날 저녁마다 수강생에게 문자로 알림을 보내기 시작하자(began texting students a reminder the evening before each lesson) 결석이 절반으로 줄었어요(absences have fallen by half). 그래서 요점은 수업 전날 문자로 알리자 빠지는 수강생이 반으로 줄었다는 거예요.","tr":[["수업 전날 문자 알림 → 늦는 수강생 반으로 줆","by half 낱말은 같지만 줄어든 것이 달라요. 절반으로 준 것은 지각이 아니라 결석이에요(absences have fallen by half)."],["저녁 수업 새로 엶 → 빠지는 수강생 반으로 줆","evening · lesson 낱말은 같지만 한 일이 달라요. 저녁 수업을 연 것이 아니라 수업 전날 저녁에 알림 문자를 보냈어요(texting students a reminder the evening before each lesson)."],["저녁 수업 새로 엶 → 늦는 수강생 반으로 줆","학원 글에서 떠올릴 만한 말이지만 앞뒤가 다 글과 달라요. 학원이 한 일은 알림 문자이고(began texting students a reminder), 줄어든 것은 결석이에요(absences have fallen by half)."],["길 건너 경쟁 학원 → 예전과 달라진 것 없음","unlike 뒤가 답이라는 요령에 끌린 답이에요. 길 건너 경쟁 학원(its rival across the street)은 견주려고 덧붙인 곳일 뿐이고, 요점은 알림을 보낸 이 학원의 결석이 절반으로 줄었다는 거예요(absences have fallen by half)."]],"dg":"unlike"},{"id":"M1-9","k":1,"dev":"particularly among ~ (효과가 큰 무리를 덧붙임)","s":"One gym began emailing members a weekly summary of their visits, and attendance has risen noticeably, particularly among those who joined within the past year.","a":"주간 방문 기록 발송 → 운동하러 오는 발길 늚","why":"particularly among 뒤는 효과가 특히 큰 무리를 덧붙인 말이에요. 요점은 그 앞의 두 주절이에요. 한 체육관이 회원들에게 한 주 동안 몇 번 왔는지 간추려 이메일로 보내기 시작하자(began emailing members a weekly summary of their visits) 나오는 사람이 눈에 띄게 늘었어요(attendance has risen noticeably). 가입한 지 일 년이 안 된 회원들(those who joined within the past year)은 그 효과가 더 큰 무리일 뿐이에요. 그래서 요점은 주간 방문 기록을 보내자 운동하러 오는 발길이 늘었다는 거예요.","tr":[["주간 방문 기록 발송 → 새로 가입하는 회원 늚","joined 낱말은 같지만 뜻이 달라요. 새로 가입한 사람이 늘었다는 말이 아니라, 이미 가입한 회원들이 더 자주 나온다는 말이에요(attendance has risen noticeably)."],["주간 무료 체험 안내 → 운동하러 오는 발길 늚","weekly 낱말은 같지만 보낸 것이 달라요. 무료 체험 안내가 아니라 그 주에 다녀간 기록을 간추린 것이에요(a weekly summary of their visits)."],["주간 무료 체험 안내 → 새로 가입하는 회원 늚","무료 체험을 알리면 새 회원이 는다는 그럴듯한 말이지만 앞뒤가 다 글과 달라요. 보낸 것은 다녀간 기록이고(a weekly summary of their visits), 늘어난 것은 나오는 횟수예요(attendance has risen noticeably)."],["가입 일 년 안 된 회원 → 효과 더 뚜렷함","particularly among 뒤의 덧붙임(those who joined within the past year)만 옮겼어요. 누구에게 더 컸는지일 뿐, 요점은 기록을 보내자 나오는 사람이 눈에 띄게 늘었다는 거예요(attendance has risen noticeably)."]],"dg":"particularly among"},{"id":"M1-10","k":1,"dev":"동격 명사구 (a saving ~ : 잰 기간을 덧붙임)","s":"One greenhouse began storing daytime heat in water tanks beneath its floor, and its heating fuel consumption has fallen by a third, a saving recorded over two winters.","a":"낮의 열 물탱크에 저장 → 난방 연료 3분의 1 절감","why":"쉼표 뒤의 a saving ~은 앞말을 한 번 더 받아 얼마 동안 기록했는지를 덧붙인 말이에요. 요점은 그 앞의 두 주절이에요. 한 온실이 낮 동안의 열을 바닥 밑 물탱크에 모아 두기 시작하자(began storing daytime heat in water tanks beneath its floor) 난방 연료 쓰는 양이 3분의 1 줄었어요(its heating fuel consumption has fallen by a third). 두 번의 겨울에 걸쳐 기록했다는 것(a saving recorded over two winters)은 잰 기간일 뿐이에요. 그래서 요점은 낮의 열을 물탱크에 저장하자 난방 연료가 3분의 1 절감됐다는 거예요.","tr":[["낮의 열 물탱크에 저장 → 작물 수확 3분의 1 증가","a third 낱말은 같지만 달라진 것이 달라요. 수확 이야기는 글에 없고, 3분의 1 줄어든 것은 난방 연료 쓰는 양이에요(its heating fuel consumption has fallen by a third)."],["바닥 밑에 온수관 설치 → 난방 연료 3분의 1 절감","beneath its floor 낱말은 같지만 한 일이 달라요. 바닥 밑에 있는 것은 온수관이 아니라 낮의 열을 모아 두는 물탱크예요(storing daytime heat in water tanks beneath its floor)."],["바닥 밑에 온수관 설치 → 작물 수확 3분의 1 증가","온실 글에서 떠올릴 만한 말이지만 앞뒤가 다 글과 달라요. 온실은 낮의 열을 물탱크에 모았고(storing daytime heat in water tanks), 달라진 것은 난방 연료예요(its heating fuel consumption has fallen by a third)."],["두 번의 겨울 → 달라진 양을 기록해 본 기간","쉼표 뒤의 덧붙임(a saving recorded over two winters)만 옮겼어요. 얼마 동안 재었는지일 뿐, 요점은 열을 모아 두자 난방 연료가 3분의 1 줄었다는 거예요(its heating fuel consumption has fallen by a third)."]],"dg":"쉼표 뒤 동격"},{"id":"M2-1","k":2,"dev":"짐작과 실제 기록 (이음말 없음)","s":"Managers at one delivery company assumed that drivers who took longer breaks would complete fewer deliveries. Over three months, those drivers handled as many packages as their colleagues and were involved in far fewer collisions.","a":"긴 휴식 → 손해 없이 사고 줄임","why":"이음말 없이 관리자들의 짐작과 석 달의 기록이 나란히 있어요. 첫 문장은 오래 쉬는 기사는 배달을 덜 해낼 거라는 짐작이에요(assumed that drivers who took longer breaks would complete fewer deliveries). 둘째 문장은 실제 기록이에요. 그 기사들이 나른 물건은 동료들과 같은 만큼이었고(handled as many packages as their colleagues), 사고에 얽힌 일은 훨씬 적었어요(were involved in far fewer collisions). 짐작한 손해는 없었고 달라진 것은 사고가 줄었다는 점이에요. 그래서 요점은 긴 휴식이 손해 없이 사고를 줄였다는 거예요.","tr":[["긴 휴식 → 처리 물량까지 늘림","packages 낱말은 같지만 정도를 부풀렸어요. 오래 쉰 기사들이 나른 물건은 더 많은 게 아니라 동료 기사들과 같은 만큼이에요(handled as many packages as their colleagues)."],["긴 휴식 → 물량 줄이고 사고 줄임","fewer 낱말은 같지만 사고에만 붙는 말이에요. 사고는 훨씬 적었지만(were involved in far fewer collisions) 나른 물건은 줄지 않고 동료들과 같은 만큼이었어요(handled as many packages as their colleagues)."],["긴 휴식 → 배달 건수 떨어뜨림","첫 문장의 관리자들 짐작(would complete fewer deliveries)을 옮긴 답이에요. 석 달의 기록은 나른 물건이 동료들과 같은 만큼이었다고 해요(as many packages as their colleagues)."],["긴 휴식 → 그만두는 기사 줄임","쉬는 시간을 두고 흔히 하는 말이지만 글에 없어요. 기록이 보여 준 것은 그만둔 사람 수가 아니라 나른 물건과 사고예요(were involved in far fewer collisions)."]],"dg":"짐작 ↔ 실제 기록"},{"id":"M2-2","k":2,"dev":"however 뒤가 남들 예상 (요점은 앞 문장)","s":"Complaints to one call center declined after it stopped restricting each call to five minutes. Its managers, however, had predicted that lengthier calls would leave more customers waiting and frustrated.","a":"통화 시간 제한 풀기 → 고객 원성 줄어듦","why":"however가 있지만 그 뒤는 요점이 아니라 관리자들이 미리 했던 예상이에요(had predicted). 통화가 길어지면 기다리다 화나는 고객이 늘 거라고 내다봤어요(lengthier calls would leave more customers waiting and frustrated). 실제로 일어난 일은 앞 문장에 있어요. 통화마다 5분으로 묶던 것을 그만두자(stopped restricting each call to five minutes) 불만이 줄었어요(Complaints to one call center declined). 예상과 실제가 맞서고, 글쓴이가 전하는 쪽은 실제 일, 곧 제한을 풀자 고객의 원성이 줄었다는 거예요.","tr":[["통화 시간 제한 풀기 → 화난 고객 늘어남","however 뒤의 예상(more customers waiting and frustrated)을 옮긴 답이에요. had predicted는 미리 내다본 것일 뿐이고, 실제로 화난 고객은 오히려 줄었어요(Complaints to one call center declined)."],["통화 시간 제한 두기 → 불만 전화 줄어듦","Complaints · declined 낱말은 같지만 앞뒤가 뒤바뀌었어요. 불만이 준 것은 제한을 둔 때가 아니라 제한을 그만둔 뒤예요(declined after it stopped restricting each call to five minutes)."],["통화 시간 제한 풀기 → 통화 더 짧아짐","calls 낱말은 같지만 거꾸로예요. 글에 나오는 것은 더 길어진 통화(lengthier calls)이고, 통화가 짧아졌다는 말은 없어요."],["통화 시간 제한 풀기 → 상담원 덜 지침","상담 일을 두고 흔히 하는 말이지만 글에 없어요. 글이 견준 것은 상담원의 피로가 아니라 고객의 불만이에요(Complaints to one call center declined)."]],"dg":"however 뒤가 남들 예상"},{"id":"M2-3","k":2,"dev":"Contrary to ~","s":"Contrary to many gardeners' assumptions, watering plants lightly every day can leave them vulnerable to drought, since roots that find moisture near the surface have little reason to grow deeper.","a":"날마다 조금씩 물 주기 → 마른 날에 약해짐","why":"Contrary to(~와 달리)로 정원 가꾸는 사람들의 짐작을 먼저 밀어내요(Contrary to many gardeners' assumptions). 글쓴이의 말은 그 뒤예요. 날마다 조금씩 물을 주면 식물이 오히려 가뭄에 약해질 수 있어요(can leave them vulnerable to drought). 까닭은 since 뒤에 있어요. 겉흙 가까이에서 물을 찾는 뿌리는 더 깊이 뻗을 까닭이 거의 없어요(have little reason to grow deeper). 뿌리가 얕게 머무니 겉흙이 마르는 날에는 버티기 어려워요. 그래서 요점은 날마다 조금씩 물을 주면 식물이 마른 날에 약해진다는 거예요.","tr":[["날마다 조금씩 물 주기 → 뿌리 깊게 키움","grow deeper 낱말은 같지만 little을 빠뜨려 거꾸로 읽었어요. 겉흙에서 물을 찾는 뿌리는 깊이 뻗을 까닭이 거의 없어요(have little reason to grow deeper)."],["날마다 조금씩 물 주기 → 겉흙 마르게 함","near the surface 낱말은 같지만 거꾸로예요. 뿌리는 겉흙 가까이에서 물을 찾아요(roots that find moisture near the surface). 겉흙에 물이 있다는 말이지 마른다는 말이 아니에요."],["날마다 조금씩 물 주기 → 식물 튼튼히 함","정원 가꾸는 사람들의 짐작 쪽을 옮긴 답이에요(Contrary to many gardeners' assumptions). 글쓴이는 식물이 오히려 가뭄에 약해질 수 있다고 해요(can leave them vulnerable to drought)."],["날마다 조금씩 물 주기 → 뿌리 썩게 만듦","물을 자주 주면 뿌리가 썩는다는 흔한 말이지만 글에 없어요. 글이 든 까닭은 썩는 것이 아니라 뿌리가 깊이 뻗지 않는다는 점이에요(have little reason to grow deeper)."]],"dg":"Contrary to ~"},{"id":"M2-4","k":2,"dev":"겉보기와 실제 까닭 (이음말 없음)","s":"The longest line at one night market belongs to the vendor selling the fewest dishes per hour. Each order is prepared from scratch, so even a handful of customers can slow the line to a crawl.","a":"가장 긴 줄 → 손 많이 가는 조리 탓","why":"긴 줄은 장사가 가장 잘되는 가게처럼 보이지만, 글은 이음말 없이 그 겉보기와 실제를 맞세워요. 가장 긴 줄이 선 곳은 한 시간에 가장 적게 파는 가게예요(selling the fewest dishes per hour). 둘째 문장이 까닭을 대요. 주문마다 처음부터 새로 조리하기 때문에(Each order is prepared from scratch) 손님 몇 사람만으로도 줄이 기어가듯 느려져요(even a handful of customers can slow the line to a crawl). 줄이 긴 것은 손님이 많아서가 아니라 조리에 손이 많이 가서예요.","tr":[["가장 긴 줄 → 가장 많이 파는 가게","selling · dishes 낱말은 같지만 거꾸로예요. 가장 긴 줄이 선 가게는 한 시간에 가장 적게 팔아요(selling the fewest dishes per hour)."],["가장 긴 줄 → 손님을 몇 명만 받음","a handful of customers 낱말은 같지만 뜻이 달라요. 손님 수를 정해 두고 받는다는 말이 아니라, 몇 사람만 있어도 줄이 기어가듯 느려진다는 말이에요(even a handful of customers can slow the line to a crawl)."],["가장 긴 줄 → 입소문 난 맛집 표시","긴 줄을 보면 흔히 하는 생각이지만 글에 없어요. 글이 든 까닭은 입소문이 아니라 주문마다 새로 하는 조리예요(Each order is prepared from scratch)."],["가장 긴 줄 → 좁은 가게 자리 탓","야시장에서 떠올릴 만한 까닭이지만 글에 없어요. 줄이 느린 것은 자리가 좁아서가 아니라 주문마다 처음부터 새로 조리해서예요(Each order is prepared from scratch)."]],"dg":"겉보기 ↔ 실제 까닭"},{"id":"M2-5","k":2,"dev":"내세운 말과 실험 결과 (이음말 없음)","s":"The label on one brand of eco-friendly paper cups claims that they decompose in soil. After a consumer group buried them for a year, the paper had vanished and the plastic lining came out almost unchanged.","a":"친환경 종이컵 → 반쪽만 분해됨","why":"이음말 없이 상표가 내세운 말과 묻어 본 결과가 나란히 있어요. 첫 문장은 흙에서 분해된다는 주장이에요(claims that they decompose in soil). 둘째 문장은 소비자 단체가 컵을 한 해 동안 묻어 본 결과예요. 종이는 사라졌고(the paper had vanished), 안쪽 플라스틱 막은 거의 그대로 나왔어요(the plastic lining came out almost unchanged). 주장대로 된 것은 종이뿐이에요. 그래서 요점은 이 컵이 반쪽만 분해된다는 거예요.","tr":[["친환경 종이컵 → 안쪽 막만 분해됨","plastic lining 낱말은 같지만 무엇이 남았는지가 바뀌었어요. 종이는 사라졌고(the paper had vanished), 거의 그대로 나온 것은 플라스틱 막이에요(the plastic lining came out almost unchanged)."],["친환경 종이컵 → 썩는 데 한 해 걸림","a year 낱말은 같지만 뜻이 달라요. 한 해는 다 썩는 데 걸린 시간이 아니라 묻어 둔 기간이고(buried them for a year), 그 뒤에도 플라스틱 막은 거의 그대로였어요(came out almost unchanged)."],["친환경 종이컵 → 흙에서 분해됨","첫 문장의 상표 주장(claims that they decompose in soil)을 옮긴 답이에요. 묻어 보니 플라스틱 막은 거의 그대로 나왔어요(the plastic lining came out almost unchanged)."],["친환경 종이컵 → 값만 더 비쌈","친환경 제품을 두고 흔히 하는 말이지만 글에 없어요. 글이 따진 것은 값이 아니라 흙에서 분해되는지예요(decompose in soil)."]],"dg":"내세운 말 ↔ 실험 결과"},{"id":"M2-6","k":2,"dev":"All but two (「둘만 빼고 모두」 — 맞섬 신호 아님)","s":"All but two engineers at one firm predicted that trying a four-day week would delay their projects. A year into the trial, projects were finishing on schedule, with the saved hours coming mostly from shorter meetings.","a":"주 4일 근무 → 과제 일정 지켜 냄","why":"All but two는 「둘만 빼고 모두」라는 뜻이에요. 여기서 but은 앞뒤를 맞세우는 말이 아니에요. 첫 문장은 거의 모든 기술자가 한 예상, 곧 주 4일 근무가 과제를 늦출 거라는 생각이에요(predicted that trying a four-day week would delay their projects). 맞섬은 이음말 없이 두 문장 사이에 있어요. 시험 삼아 해 본 지 한 해가 되었을 때 과제는 일정대로 끝나고 있었어요(projects were finishing on schedule). 줄어든 시간은 주로 짧아진 회의에서 나왔고요(coming mostly from shorter meetings). 예상과 달리 과제 일정을 지켜 냈다는 것이 요점이에요.","tr":[["주 4일 근무 → 과제 일정 늦춤","but 뒤 낱말을 맞춘 답이지만, 이것은 기술자들이 미리 한 예상이에요(predicted that trying a four-day week would delay their projects). 실제로는 과제가 일정대로 끝났어요(projects were finishing on schedule)."],["주 4일 근무 → 과제 앞당겨 끝냄","finishing · schedule 낱말은 같지만 정도를 부풀렸어요. 과제는 일정보다 일찍이 아니라 일정대로 끝나고 있었어요(projects were finishing on schedule)."],["주 4일 근무 → 회의 시간 늘림","meetings 낱말은 같지만 거꾸로예요. 줄어든 시간은 주로 더 짧아진 회의에서 나왔어요(the saved hours coming mostly from shorter meetings)."],["주 4일 근무 → 직원 만족 높임","주 4일 근무를 두고 흔히 하는 말이지만 글에 없어요. 글이 살핀 것은 직원의 기분이 아니라 과제 일정이에요(projects were finishing on schedule)."]],"dg":"all but (= ~만 빼고 모두)"},{"id":"M2-7","k":2,"dev":"In theory, ~. In practice, ~","s":"In theory, expanding roads should ease a growing town's congestion. In practice, one town that added two lanes saw travel times return to their old level within three years, as the extra capacity attracted more cars.","a":"도로 넓히기 → 효과 오래 못 감","why":"In theory(이론으로는)와 In practice(실제로는)가 두 문장을 맞세워요. 이론 쪽은 길을 넓히면 커 가는 도시의 교통이 풀린다는 생각이에요(expanding roads should ease a growing town's congestion). 글쓴이가 전하는 쪽은 실제예요. 차로 둘을 늘린 한 도시에서 이동 시간은 3년 안에 예전 수준으로 돌아갔어요(saw travel times return to their old level within three years). 늘어난 자리가 차를 더 끌어들였기 때문이에요(as the extra capacity attracted more cars). 예전보다 나빠진 것이 아니라 예전으로 되돌아간 것이니, 요점은 넓힌 효과가 오래가지 못했다는 거예요.","tr":[["도로 넓히기 → 3년 뒤 더 막힘","three years · travel times 낱말은 같지만 정도를 부풀렸어요. 3년 안에 이동 시간은 예전보다 길어진 게 아니라 예전 수준으로 돌아갔어요(return to their old level within three years)."],["도로 넓히기 → 차 수는 그대로임","cars 낱말은 같지만 거꾸로예요. 늘어난 자리는 차를 더 끌어들였어요(the extra capacity attracted more cars)."],["도로 넓히기 → 교통 흐름 풀림","In theory 쪽의 생각(expanding roads should ease a growing town's congestion)을 옮긴 답이에요. 글쓴이는 In practice 뒤의 실제 일로 이 생각에 맞서요."],["도로 넓히기 → 사고 위험 키움","넓은 길을 두고 흔히 하는 말이지만 글에 없어요. 글이 잰 것은 사고가 아니라 이동 시간이에요(saw travel times return to their old level within three years)."]],"dg":"In theory ~. In practice ~"},{"id":"M2-8","k":2,"dev":"두 도시의 방법과 결과 (이음말 없음)","s":"During one dry summer, a town that fined residents for watering lawns saw water use barely fall. A neighboring town that mailed each household a comparison with its neighbors' use reduced consumption by about 5 percent.","a":"물 절약 → 남들 쓰는 양 알려 주기","why":"이음말 없이 두 도시의 방법과 결과가 나란히 있어요. 물을 아끼게 하려면 벌금이 가장 잘 들을 것 같지만, 잔디에 물을 주면 벌금을 물린 도시는 물 사용이 거의 줄지 않았어요(saw water use barely fall). 이웃 도시는 집집마다 이웃들의 사용량과 견준 것을 우편으로 보냈고(mailed each household a comparison with its neighbors' use), 사용량을 5퍼센트쯤 줄였어요(reduced consumption by about 5 percent). 그럴듯해 보이는 벌금과 실제로 통한 방법이 맞서고, 글이 손을 들어 주는 쪽은 남들이 쓰는 양을 알려 주어 제 것과 견주게 하는 방법이에요.","tr":[["물 절약 → 이웃끼리 서로 지켜보기","neighbors 낱말은 같지만 한 일이 달라요. 이웃이 서로 지켜본 것이 아니라, 도시가 이웃들의 사용량과 견준 것을 보내 주었어요(a comparison with its neighbors' use)."],["물 절약 → 집집마다 벌금 고지서","mailed each household 낱말은 같지만 보낸 것이 달라요. 집집마다 보낸 것은 벌금이 아니라 견준 것이에요(mailed each household a comparison with its neighbors' use)."],["물 절약 → 잔디 물 주기에 벌금","첫 문장의 방법을 옮긴 답이에요. 벌금을 물린 도시는 물 사용이 거의 줄지 않았어요(a town that fined residents for watering lawns saw water use barely fall)."],["물 절약 → 가뭄 심각성 알리기","물 아끼기를 두고 흔히 하는 말이지만 글에 없어요. 사용량을 줄인 도시가 보낸 것은 가뭄 소식이 아니라 이웃과 견준 것이에요(a comparison with its neighbors' use)."]],"dg":"두 방법 ↔ 결과"},{"id":"M2-9","k":2,"dev":"as though (「마치 ~인 것처럼」 — 양보 아님)","s":"Aquarium visitors often tap on the glass as though fish could not detect it. Recordings from inside one tank reveal each tap arriving as a loud boom, after which nearby fish stop feeding for minutes.","a":"수조 유리 두드리기 → 물고기에 큰 방해","why":"as though는 「마치 ~인 것처럼」이라는 뜻이에요. 여기서 though는 양보가 아니에요. 그 뒤(fish could not detect it)는 사실이 아니라 관람객들이 그렇게 여기며 행동한다는 말이에요. 맞섬은 이음말 없이 두 문장 사이에 있어요. 수조 안에서 녹음해 보니 한 번 두드릴 때마다 큰 쿵 소리로 들어오고(each tap arriving as a loud boom), 그 뒤 가까이 있던 물고기들은 몇 분 동안 먹기를 멈춰요(nearby fish stop feeding for minutes). 안 들릴 거라는 겉보기와 달리 물고기에게는 크게 들리고 먹이도 못 먹게 하니, 요점은 유리 두드리기가 물고기에게 큰 방해가 된다는 거예요.","tr":[["수조 유리 두드리기 → 물고기엔 안 들림","though 뒤 낱말을 맞춘 답이지만, as though 뒤는 관람객들이 그렇게 여긴다는 말일 뿐이에요(as though fish could not detect it). 녹음은 두드릴 때마다 큰 소리가 들어온다고 해요(each tap arriving as a loud boom)."],["수조 유리 두드리기 → 먹이 먹게 부추김","feeding 낱말은 같지만 거꾸로예요. 두드린 뒤 가까이 있던 물고기들은 먹기를 멈춰요(nearby fish stop feeding for minutes)."],["수조 유리 두드리기 → 물고기 불러 모음","nearby fish 낱말은 같지만 뜻이 달라요. 물고기가 가까이 모여든 게 아니라, 가까이 있던 물고기가 먹기를 멈춘 거예요(nearby fish stop feeding for minutes)."],["수조 유리 두드리기 → 유리에 금 가게 함","수족관에서 흔히 듣는 말이지만 글에 없어요. 글이 살핀 것은 유리가 아니라 수조 안의 소리와 물고기예요(Recordings from inside one tank)."]],"dg":"as though (= 마치 ~처럼)"},{"id":"M2-10","k":2,"dev":"전문가 예측과 매출 기록 (이음말 없음)","s":"One city's economists predicted that a new stadium would boost nearby shops' revenue. Five seasons of sales records showed most of them earning less on game days than on other days, as regular customers stayed away.","a":"새 경기장 → 주변 가게 덕 못 봄","why":"이음말 없이 예측과 기록이 나란히 있어요. 첫 문장은 한 시의 경제학자들이 한 예측이에요. 새 경기장이 가까운 가게들의 장사를 키울 거라고 했어요(predicted that a new stadium would boost nearby shops' revenue). 둘째 문장은 그 뒤 다섯 시즌의 매출 기록이에요. 그 가게들 대부분은 경기가 있는 날에 다른 날보다 덜 벌었어요(earning less on game days than on other days). 그런 날에는 단골들이 발길을 끊었거든요(as regular customers stayed away). 도움이 될 거라던 경기장의 덕을 주변 가게들은 보지 못했다는 것이 요점이에요.","tr":[["새 경기장 → 경기 없는 날 한산함","game days 낱말은 같지만 어느 날인지가 바뀌었어요. 가게들이 덜 번 날은 경기가 없는 날이 아니라 경기가 있는 날이에요(earning less on game days than on other days)."],["새 경기장 → 단골 더 자주 오게 함","regular customers 낱말은 같지만 거꾸로예요. 경기가 있는 날에 단골들은 발길을 끊었어요(as regular customers stayed away)."],["새 경기장 → 주변 가게 장사 살림","첫 문장의 예측(predicted that a new stadium would boost nearby shops' revenue)을 옮긴 답이에요. 매출 기록은 그 가게들 대부분이 경기 날에 덜 벌었다고 해요(most of them earning less on game days)."],["새 경기장 → 주변 교통 마비시킴","경기장을 두고 흔히 하는 말이지만 글에 없어요. 글이 내놓은 것은 교통이 아니라 가게들의 매출 기록이에요(Five seasons of sales records)."]],"dg":"예측 ↔ 매출 기록"},{"id":"M3-1","k":3,"dev":"Far from ~ing (~하기는커녕)","s":"Far from relying on advertising, one small publisher has built a loyal readership through book clubs that its readers host in their own homes.","a":"독자가 여는 독서 모임 → 단골 독자층 쌓음","why":"Far from ~ing는 「~하기는커녕」이라며 앞의 것을 밀어내는 말이에요. 밀려난 것은 광고에 기대는 일이에요(Far from relying on advertising). 글이 택한 쪽은 그 뒤에 있어요. 한 작은 출판사는 독자들이 자기 집에서 여는 독서 모임을 통해(through book clubs that its readers host in their own homes) 꾸준히 찾아 주는 독자층을 쌓았어요(has built a loyal readership). 그래서 요점은 독자가 여는 독서 모임이 단골 독자층을 쌓았다는 거예요.","tr":[["광고에 크게 기대기 → 단골 독자층 쌓음","Far from이 밀어낸 쪽을 옮긴 답이에요. 이 출판사는 광고에 기대지 않았어요(Far from relying on advertising)."],["저자 초청 강연회 → 단골 독자층 쌓음","출판사 글에서 떠올릴 만한 방법이지만 글에 없어요. 독자층을 쌓은 길은 독자들이 집에서 여는 독서 모임이에요(through book clubs that its readers host in their own homes)."],["출판사가 여는 독서 모임 → 단골 독자층 쌓음","book clubs 낱말은 같지만 누가 여는지가 달라요. 모임을 여는 쪽은 출판사가 아니라 독자들이고, 장소도 독자의 집이에요(book clubs that its readers host in their own homes)."],["출판사가 여는 독서 모임 → 광고 수입 늘어남","book clubs · advertising 낱말은 같지만 앞뒤가 다 글과 달라요. 모임은 독자들이 열고(its readers host in their own homes), 광고는 이 출판사가 기대지 않은 것이에요(Far from relying on advertising)."]],"dg":"Far from ~ing"},{"id":"M3-2","k":3,"dev":"abandoned A in favor of B (부정 말 없이 대체)","s":"One bakery abandoned its evening discounts in favor of baking smaller batches throughout the afternoon. Far fewer loaves now go unsold.","a":"조금씩 여러 번 굽기 → 남는 빵 크게 줆","why":"not이나 instead 같은 말 없이, abandoned A in favor of B가 옛 방법을 버리고 새 방법을 택했다고 알려요. 버린 것은 저녁 무렵의 할인이에요(abandoned its evening discounts). 택한 것은 오후 내내 조금씩 나눠 굽는 일이에요(baking smaller batches throughout the afternoon). 그 결과 팔리지 않고 남는 빵이 훨씬 줄었어요(Far fewer loaves now go unsold). 그래서 요점은 조금씩 여러 번 굽자 남는 빵이 크게 줄었다는 거예요.","tr":[["저녁 무렵 떨이 할인 → 남는 빵 크게 줆","빵집이 버린 쪽을 옮긴 답이에요. 저녁 할인은 그만둔 방법이에요(abandoned its evening discounts)."],["오후에 한꺼번에 굽기 → 남는 빵 크게 줆","afternoon 낱말은 같지만 굽는 방식이 거꾸로예요. 한꺼번에가 아니라 오후 내내 조금씩 나눠 구워요(baking smaller batches throughout the afternoon)."],["조금씩 여러 번 굽기 → 파는 빵 크게 줆","fewer · loaves 낱말은 같지만 뜻이 달라요. 줄어든 것은 파는 빵이 아니라 안 팔리고 남는 빵이에요(Far fewer loaves now go unsold)."],["오후에 한꺼번에 굽기 → 파는 빵 크게 줆","afternoon · fewer 낱말은 같지만 앞뒤가 다 글과 달라요. 빵집은 조금씩 나눠 굽고(baking smaller batches throughout the afternoon), 줄어든 것은 남는 빵이에요(Far fewer loaves now go unsold)."]],"dg":"abandoned A in favor of B"},{"id":"M3-3","k":3,"dev":"Nothing but ~ (nothing이 있어도 「오직 ~만」)","s":"For years one cafe relied on discount coupons to fill its tables on weekday afternoons. Nothing but free meeting rooms, its owner now admits, has ever achieved that.","a":"모임방 무료 개방 → 평일 낮 자리 채움","why":"Nothing이 보여도 「아무것도 안 됐다」는 말이 아니에요. Nothing but ~은 「오직 ~만」이라는 뜻이에요. 첫 문장은 이 카페가 여러 해 동안 기댄 방법이에요. 할인 쿠폰으로 평일 오후 자리를 채우려 했어요(relied on discount coupons to fill its tables on weekday afternoons). 둘째 문장이 그것을 밀어내요. 그 일을 해낸 것은 오직 무료 모임방뿐이라고 주인이 인정해요(Nothing but free meeting rooms ... has ever achieved that). 쿠폰은 버려지고 모임방이 남아요. 그래서 요점은 모임방을 무료로 열자 평일 낮 자리가 찼다는 거예요.","tr":[["할인 쿠폰 돌리기 → 평일 낮 자리 채움","첫 문장의 옛 방법을 옮긴 답이에요. 쿠폰에 기댔지만(relied on discount coupons), 자리를 채운 것은 오직 무료 모임방뿐이에요(Nothing but free meeting rooms)."],["모임방 유료 대여 → 평일 낮 자리 채움","meeting rooms 낱말은 같지만 돈을 받는지가 달라요. 자리를 채운 것은 돈을 받지 않는 모임방이에요(Nothing but free meeting rooms)."],["모임방 무료 개방 → 아무 효과도 못 봄","Nothing 낱말에 끌려 거꾸로 읽었어요. Nothing but ~은 「오직 ~만」이라, 무료 모임방만이 그 일을 해냈다는 말이에요(has ever achieved that)."],["모임방 유료 대여 → 아무 효과도 못 봄","meeting rooms · Nothing 낱말은 같지만 앞뒤가 다 글과 달라요. 글에 나오는 것은 무료 모임방이고(free meeting rooms), 그것만이 자리를 채웠어요(has ever achieved that)."]],"dg":"Nothing but"},{"id":"M3-4","k":3,"dev":"as opposed to ~ (~이 아니라)","s":"One orchestra sold out its weekday concerts by starting them at half past six, as opposed to lowering ticket prices.","a":"이른 저녁에 막 올리기 → 평일 공연 매진","why":"as opposed to는 「~이 아니라」라며 뒤의 것을 밀어내는 말이에요. 밀려난 것은 표값을 내리는 일이에요(as opposed to lowering ticket prices). 글이 택한 쪽은 그 앞에 있어요. 한 관현악단은 평일 공연을 여섯 시 반에 시작해서(by starting them at half past six) 표를 다 팔았어요(sold out its weekday concerts). 여섯 시 반은 이른 저녁이에요. 그래서 요점은 이른 저녁에 막을 올리자(공연을 시작하자) 평일 공연이 매진됐다는 거예요.","tr":[["입장권 값 내리기 → 평일 공연 매진","as opposed to가 밀어낸 쪽을 옮긴 답이에요. 표값은 내리지 않았어요(as opposed to lowering ticket prices)."],["이름난 협연자 초청 → 평일 공연 매진","공연 글에서 떠올릴 만한 방법이지만 글에 없어요. 표를 다 판 길은 여섯 시 반에 시작한 것이에요(by starting them at half past six)."],["여섯 시 반에 막 내리기 → 평일 공연 매진","half past six 낱말은 같지만 뜻이 달라요. 여섯 시 반은 공연을 끝내는 때가 아니라 시작하는 때예요(by starting them at half past six)."],["여섯 시 반에 막 내리기 → 입장권 값 내림","half past six · ticket prices 낱말은 같지만 앞뒤가 다 글과 달라요. 여섯 시 반은 시작하는 때이고(by starting them at half past six), 표값은 내리지 않았어요(as opposed to lowering ticket prices)."]],"dg":"as opposed to"},{"id":"M3-5","k":3,"dev":"switched from A to B (부정 말 없이 대체)","s":"One fishing cooperative switched from selling its catch at the dawn auction to delivering boxes directly to households. Its members now earn nearly twice as much per kilogram.","a":"가정에 바로 보내기 → 같은 양에 벌이 거의 갑절","why":"not 같은 말 없이, switched from A to B가 옛 방법에서 새 방법으로 갈아탔다고 알려요. 떠난 쪽은 새벽 경매에 잡은 것을 파는 일이에요(selling its catch at the dawn auction). 옮겨 간 쪽은 상자에 담아 집집으로 바로 보내는 일이에요(delivering boxes directly to households). 그 결과 조합원들은 킬로그램당 거의 두 배를 벌어요(now earn nearly twice as much per kilogram). 그래서 요점은 가정에 바로 보내자 같은 양에 벌이가 거의 갑절이 됐다는 거예요.","tr":[["새벽 경매에 넘기기 → 같은 양에 벌이 거의 갑절","조합이 떠난 쪽을 옮긴 답이에요. 새벽 경매는 그만둔 방법이에요(switched from selling its catch at the dawn auction)."],["식당에 상자째 팔기 → 같은 양에 벌이 거의 갑절","boxes 낱말은 같지만 보내는 곳이 달라요. 상자를 받는 곳은 식당이 아니라 가정집이에요(delivering boxes directly to households)."],["가정에 바로 보내기 → 잡는 양이 거의 갑절","twice · catch 낱말은 같지만 뜻이 달라요. 두 배가 된 것은 잡는 양이 아니라 킬로그램당 버는 돈이에요(earn nearly twice as much per kilogram)."],["새벽 경매에 넘기기 → 잡는 양이 거의 갑절","dawn auction · twice 낱말은 같지만 앞뒤가 다 글과 달라요. 새벽 경매는 조합이 떠난 곳이고(switched from selling its catch at the dawn auction), 두 배가 된 것은 킬로그램당 버는 돈이에요(earn nearly twice as much per kilogram)."]],"dg":"switched from A to B"},{"id":"M3-6","k":3,"dev":"wasted no time in ~ing (no가 있어도 「곧바로 ~했다」)","s":"The new manager of one print shop wasted no time in scrapping the weekly staff meeting. Brief written updates each morning now keep everyone informed, and orders are processed faster.","a":"아침마다 짧은 글 알림 → 주문 처리 빨라짐","why":"no가 보여도 「하지 않았다」는 말이 아니에요. wasted no time in ~ing은 「곧바로 ~했다」는 뜻이에요. 새 관리자가 곧바로 한 일은 주간 직원 회의를 없앤 거예요(wasted no time in scrapping the weekly staff meeting). 회의가 버려진 쪽이에요. 그 자리를 채운 것은 아침마다 돌리는 짧은 글 소식이에요(Brief written updates each morning now keep everyone informed). 그 결과 주문이 더 빨리 처리돼요(orders are processed faster). 그래서 요점은 아침마다 짧은 글로 알리자 주문 처리가 빨라졌다는 거예요.","tr":[["주마다 여는 직원 회의 → 주문 처리 빨라짐","관리자가 없앤 쪽을 옮긴 답이에요. 주간 회의는 곧바로 없앴어요(wasted no time in scrapping the weekly staff meeting)."],["아침마다 짧은 회의 → 주문 처리 빨라짐","each morning · meeting 낱말은 같지만 한 일이 달라요. 아침마다 하는 것은 회의가 아니라 글로 쓴 짧은 소식이에요(Brief written updates each morning)."],["주마다 여는 직원 회의 → 시간 낭비 없어짐","wasted no time 낱말에 끌려 잘못 읽었어요. 회의에서 시간을 아꼈다는 말이 아니라, 회의를 곧바로 없앴다는 말이에요(wasted no time in scrapping the weekly staff meeting)."],["아침마다 짧은 회의 → 시간 낭비 없어짐","each morning · wasted no time 낱말은 같지만 앞뒤가 다 글과 달라요. 아침마다 하는 것은 글로 쓴 소식이고(Brief written updates each morning), 글이 말한 결과는 주문이 더 빨리 처리된다는 거예요(orders are processed faster)."]],"dg":"wasted no time in ~ing"},{"id":"M3-7","k":3,"dev":"has little to do with A and much to do with B","s":"According to one survey of commuters, the choice to cycle to work has little to do with fitness goals and much to do with whether the office provides showers.","a":"회사에 씻을 곳 있는지 → 자전거 출근 크게 좌우","why":"has little to do with A는 A를 밀어내고, much to do with B는 B를 내세워요. 밀려난 것은 체력을 기르려는 목표예요(has little to do with fitness goals). 내세운 것은 사무실에 샤워실이 있느냐예요(much to do with whether the office provides showers). 자전거로 출근할지와(the choice to cycle to work) 크게 얽힌 것은 뒤쪽이에요. 그래서 요점은 회사에 씻을 곳이 있는지가 자전거 출근을 크게 좌우한다는 거예요.","tr":[["체력 기르려는 목표 → 자전거 출근 크게 좌우","little이 밀어낸 쪽을 옮긴 답이에요. 체력 목표는 거의 상관이 없어요(has little to do with fitness goals)."],["집에서 회사까지 거리 → 자전거 출근 크게 좌우","출근 글에서 떠올릴 만한 까닭이지만 글에 없어요. 글이 내세운 것은 사무실에 샤워실이 있느냐예요(whether the office provides showers)."],["체력 기르려는 목표 → 회사 샤워실 쓰게 함","fitness goals · showers 낱말은 같지만 잘못 이었어요. 글은 샤워실을 누가 쓰는지가 아니라 무엇이 자전거 출근을 가르는지를 말해요(the choice to cycle to work)."],["회사에 씻을 곳 있는지 → 체력 목표 크게 좌우","showers · fitness goals 낱말은 같지만 잘못 이었어요. 샤워실이 가르는 것은 체력 목표가 아니라 자전거로 출근할지예요(the choice to cycle to work)."]],"dg":"little to do with A, much to do with B"},{"id":"M3-8","k":3,"dev":"ruled out A and settled on B (부정 말 없이 대체)","s":"One ferry company ruled out purchasing a larger vessel and settled on running its small boat every twenty minutes. Passengers left waiting on the pier are now rare.","a":"작은 배 자주 띄우기 → 못 타는 손님 드묾","why":"not 같은 말 없이, ruled out A and settled on B가 하나를 제쳐 두고 다른 하나로 정했다고 알려요. 제쳐 둔 것은 더 큰 배예요(ruled out purchasing a larger vessel). 정한 것은 작은 배를 20분마다 띄우는 일이에요(settled on running its small boat every twenty minutes). 그 결과 부두에 남아 기다리는 승객이 이제 드물어요(Passengers left waiting on the pier are now rare). 그래서 요점은 작은 배를 자주 띄우자 못 타는 손님이 드물어졌다는 거예요.","tr":[["더 큰 배 들여오기 → 못 타는 손님 드묾","회사가 제쳐 둔 쪽을 옮긴 답이에요. 더 큰 배는 사지 않기로 했어요(ruled out purchasing a larger vessel)."],["작은 배 더 사들이기 → 못 타는 손님 드묾","purchasing · small boat 낱말은 같지만 한 일이 달라요. 배를 더 산 것이 아니라 있던 작은 배를 20분마다 띄웠어요(running its small boat every twenty minutes)."],["작은 배 자주 띄우기 → 타는 손님 드묾","Passengers · rare 낱말은 같지만 뜻이 달라요. 드물어진 것은 배를 타는 손님이 아니라 부두에 남아 기다리는 손님이에요(Passengers left waiting on the pier are now rare)."],["더 큰 배 들여오기 → 타는 손님 드묾","larger vessel · rare 낱말은 같지만 앞뒤가 다 글과 달라요. 더 큰 배는 제쳐 뒀고(ruled out purchasing a larger vessel), 드물어진 것은 부두에 남는 손님이에요(Passengers left waiting on the pier are now rare)."]],"dg":"ruled out A, settled on B"},{"id":"M3-9","k":3,"dev":"had no shortage of ~ (no가 있어도 「넉넉했다」)","s":"One animal shelter had no shortage of volunteers; what it lacked was storage. A single donation of shelves did more for its daily work than any recruitment campaign had.","a":"선반 한 번 기증 → 하루 일 한결 수월","why":"no가 보여도 「없었다」는 말이 아니에요. had no shortage of ~는 「~이 모자라지 않았다」, 곧 넉넉했다는 뜻이에요. 봉사자는 넉넉했고(had no shortage of volunteers), 모자란 것은 물건 둘 곳이었어요(what it lacked was storage). 둘째 문장이 두 방법을 견줘요. 선반을 한 번 기증받은 것이 어떤 봉사자 모집 운동보다 날마다의 일에 더 도움이 됐어요(did more for its daily work than any recruitment campaign had). 모집 운동은 밀려나고 선반이 남아요. 그래서 요점은 선반 한 번 기증이 하루 일을 한결 수월하게 했다는 거예요.","tr":[["봉사자 모집 운동 → 하루 일 한결 수월","글이 밀어낸 쪽을 옮긴 답이에요. 선반 기증이 어떤 모집 운동보다 더 도움이 됐어요(did more for its daily work than any recruitment campaign had)."],["선반값 모금 운동 → 하루 일 한결 수월","donation · campaign 낱말은 같지만 한 일이 달라요. 돈을 모으는 운동을 벌인 것이 아니라 선반을 한 번 기증받았어요(A single donation of shelves)."],["선반값 모금 운동 → 봉사자 모집 도움","campaign · recruitment 낱말은 같지만 앞뒤가 다 글과 달라요. 받은 것은 선반 기증이고(A single donation of shelves), 그것이 도운 것은 날마다의 일이에요(did more for its daily work)."],["선반 한 번 기증 → 봉사자 모자람 풀림","volunteers · shortage 낱말에 끌려 잘못 읽었어요. 봉사자는 처음부터 모자라지 않았고(had no shortage of volunteers), 모자란 것은 물건 둘 곳이었어요(what it lacked was storage)."]],"dg":"no shortage of"},{"id":"M3-10","k":3,"dev":"gave up on A and turned to B (부정 말 없이 대체)","s":"One mountain hostel gave up on warning signs and turned to renting out proper boots at the foot of the trail. Rescue calls from the ridge have since declined by half.","a":"산길 어귀 등산화 대여 → 구조 요청 반으로 줆","why":"not 같은 말 없이, gave up on A and turned to B가 하나를 접고 다른 하나로 돌아섰다고 알려요. 접은 것은 경고 표지판이에요(gave up on warning signs). 돌아선 쪽은 산길이 시작되는 어귀에서 제대로 된 등산화를 빌려주는 일이에요(renting out proper boots at the foot of the trail). 그 뒤로 능선에서 오는 구조 요청이 절반으로 줄었어요(Rescue calls from the ridge have since declined by half). 그래서 요점은 산길 어귀에서 등산화를 빌려주자 구조 요청이 반으로 줄었다는 거예요.","tr":[["산길 곳곳 경고 표지판 → 구조 요청 반으로 줆","산장이 접은 쪽을 옮긴 답이에요. 경고 표지판은 그만둔 방법이에요(gave up on warning signs)."],["산길 어귀 등산화 판매 → 구조 요청 반으로 줆","boots 낱말은 같지만 한 일이 달라요. 등산화를 판 것이 아니라 빌려줬어요(renting out proper boots at the foot of the trail)."],["산길 어귀 등산화 대여 → 등산객 반으로 줆","by half 낱말은 같지만 줄어든 것이 달라요. 절반으로 준 것은 등산객이 아니라 구조 요청이에요(Rescue calls from the ridge have since declined by half)."],["산길 어귀 등산화 판매 → 등산객 반으로 줆","boots · by half 낱말은 같지만 앞뒤가 다 글과 달라요. 등산화는 빌려줬고(renting out proper boots), 절반으로 준 것은 구조 요청이에요(Rescue calls from the ridge have since declined by half)."]],"dg":"gave up on A, turned to B"},{"id":"M4-1","k":4,"dev":"Take ~ (사례를 들이밂)","s":"Take one insurance office. After its printers were set to print on both sides unless a user altered the setting, paper consumption fell by a third within a month.","a":"처음 값을 맞춰 두면 → 아껴 쓰게 됨","why":"Take ~는 「~을 보자」라며 사례를 꺼내는 말이에요. 한 보험 사무실의 프린터를, 쓰는 사람이 설정을 바꾸지 않는 한 양면으로 찍히게 맞춰 두었어요(set to print on both sides unless a user altered the setting). 그러자 한 달 안에 종이 쓰는 양이 3분의 1 줄었어요(paper consumption fell by a third within a month). 바꿀 수 있었는데도 줄었다는 것은 대부분이 맞춰 둔 대로 그냥 썼다는 뜻이에요. 프린터 · 종이라는 겉을 걷어 내면, 처음 값을 아끼는 쪽으로 맞춰 두면 아껴 쓰게 된다는 원리가 남아요.","tr":[["쓴 만큼 값을 물리면 → 아껴 쓰게 됨","그럴듯한 원리지만 글에 돈을 물렸다는 말은 없어요. 사무실이 한 일은 프린터를 양면으로 맞춰 둔 것뿐이에요(its printers were set to print on both sides)."],["쓴 양을 알려 주면 → 아껴 쓰게 됨","그럴듯한 원리지만 글에 쓴 양을 알려 줬다는 말은 없어요. 사무실이 한 일은 프린터를 양면으로 맞춰 둔 것뿐이에요(its printers were set to print on both sides)."],["설정을 손수 바꾸면 → 아껴 쓰게 됨","altered the setting 낱말은 같지만 거꾸로예요. 종이가 준 것은 사람들이 설정을 바꿔서가 아니라, 바꾸지 않고 맞춰 둔 양면 그대로 썼기 때문이에요(set to print on both sides unless a user altered the setting)."],["프린터 수 줄이면 → 한 달 만에 익숙해짐","printers · within a month 낱말은 같지만 앞뒤가 다 글과 달라요. 프린터를 줄였다는 말은 없고, 한 달 안에 일어난 일은 종이 쓰는 양이 3분의 1 준 것이에요(paper consumption fell by a third within a month)."]],"dg":"Take ~"},{"id":"M4-2","k":4,"dev":"장면만 두 문장 (신호 말 없음)","s":"One bookstore printed coupons valid for a full year, and most were never used. When it shortened the period to two weeks, more than half came back.","a":"기한이 빠듯하면 → 더 챙겨 씀","why":"For example 같은 말 없이 한 서점의 장면만 두 문장으로 나와요. 한 해 동안 쓸 수 있는 쿠폰은 대부분 끝내 쓰이지 않았어요(valid for a full year, and most were never used). 쓸 수 있는 기간을 두 주로 줄이자(shortened the period to two weeks) 절반 넘게 돌아왔어요(more than half came back). 바뀐 것은 기간 하나예요. 넉넉하면 미루다 잊고, 빠듯하면 곧 쓴다는 거예요. 쿠폰이라는 겉을 걷어 내면, 기한이 빠듯하면 더 챙겨 쓴다는 원리가 남아요.","tr":[["혜택이 커지면 → 더 챙겨 씀","그럴듯한 원리지만 글에 할인 폭을 키웠다는 말은 없어요. 서점이 바꾼 것은 쓸 수 있는 기간이에요(shortened the period to two weeks)."],["쓸 곳이 늘면 → 더 챙겨 씀","그럴듯한 원리지만 글에 쓸 수 있는 곳을 늘렸다는 말은 없어요. 서점이 바꾼 것은 쓸 수 있는 기간이에요(shortened the period to two weeks)."],["기한이 넉넉하면 → 더 챙겨 씀","a full year 낱말은 같지만 거꾸로예요. 한 해짜리 쿠폰은 대부분 끝내 쓰이지 않았어요(valid for a full year, and most were never used)."],["덜 찍어 내면 → 절반은 남음","printed · half 낱말은 같지만 앞뒤가 다 글과 달라요. 찍는 수를 줄였다는 말은 없고, 절반 넘게는 남은 것이 아니라 돌아온 쿠폰이에요(more than half came back)."]],"dg":"장면만 두 문장"},{"id":"M4-3","k":4,"dev":"the latter (뒤의 것 — 먼저 나온 쪽이 아님)","s":"One shop that chose the latter found that vehicles were finished sooner but returned with the same fault far more often.","a":"끝낸 차 수로 품삯 주면 → 꼼꼼함이 밀려남","why":"the latter는 앞 문장에 나온 둘 가운데 뒤의 것을 받아요. 앞 문장의 둘은 시간으로 주기(by the hour)와 끝낸 차 수로 주기(by the number of cars they finish)예요. 뒤의 것, 곧 끝낸 수로 주는 쪽을 고른 정비소에서(One shop that chose the latter) 차는 더 빨리 끝났지만(vehicles were finished sooner) 같은 고장으로 되돌아오는 일이 훨씬 잦아졌어요(returned with the same fault far more often). 빨리 끝내는 데 마음이 쏠려 제대로 고치는 일이 밀려난 거예요. 정비소라는 겉을 걷어 내면, 끝낸 차 수로 품삯 주면 꼼꼼함이 밀려난다는 원리가 남아요.","tr":[["일한 시간으로 품삯 주면 → 꼼꼼함이 밀려남","the latter를 앞의 것으로 잘못 받았어요. the latter는 뒤의 것, 곧 끝낸 차 수로 주는 쪽이에요(by the number of cars they finish)."],["여럿이 나눠 맡게 하면 → 꼼꼼함이 밀려남","그럴듯한 원리지만 글에 일을 나눠 맡겼다는 말은 없어요. 달라진 것은 무엇을 세어 돈을 주느냐예요(by the hour or by the number of cars they finish)."],["차를 빨리 끝내 주면 → 같은 고장 사라짐","sooner · the same fault 낱말은 같지만 거꾸로예요. 차는 더 빨리 끝났지만 같은 고장으로 되돌아오는 일은 훨씬 잦아졌어요(returned with the same fault far more often)."],["일을 빨리 끝내게 하면 → 손님 만족이 커짐","sooner · returned 낱말에 끌려 좋게 읽었어요. 차가 되돌아온 것은 만족해서가 아니라 같은 고장이 또 나서예요(returned with the same fault far more often)."]],"ctx":"A repair shop can pay its mechanics by the hour or by the number of cars they finish.","dg":"the latter"},{"id":"M4-4","k":4,"dev":"A case in point is ~ (딱 맞는 사례)","s":"A case in point is the shared kitchen at one design firm, which stayed clean only after a weekly cleaning list with each employee's name was posted on the door.","a":"누구 차례인지 밝히면 → 함께 쓰는 곳 돌봄","why":"A case in point is ~는 「딱 맞는 사례는 ~이다」라며 사례를 꺼내는 말이에요. 한 디자인 회사의 함께 쓰는 주방은 직원 한 사람 한 사람의 이름이 적힌 주간 청소 명단이 문에 붙은 뒤에야(only after a weekly cleaning list with each employee's name was posted on the door) 깨끗하게 유지됐어요(stayed clean). 모두의 일일 때는 아무도 안 하다가, 이번 주가 누구 차례인지 이름으로 드러나자 한 거예요. 주방이라는 겉을 걷어 내면, 누구 차례인지 밝히면 함께 쓰는 곳을 돌보게 된다는 원리가 남아요.","tr":[["어기면 벌금 물리면 → 함께 쓰는 곳 돌봄","그럴듯한 원리지만 글에 벌금은 없어요. 문에 붙은 것은 직원 이름이 적힌 청소 명단뿐이에요(a weekly cleaning list with each employee's name)."],["쓰는 사람 줄이면 → 함께 쓰는 곳 돌봄","그럴듯한 원리지만 글에 사람이 줄었다는 말은 없어요. 주방은 여전히 함께 쓰는 곳이고(the shared kitchen), 달라진 것은 이름이 적힌 명단이에요(with each employee's name)."],["청소 업체에 맡기면 → 함께 쓰는 곳 돌봄","weekly cleaning 낱말은 같지만 누가 하는지가 달라요. 업체에 맡긴 것이 아니라 직원들의 이름을 적은 주간 명단을 붙였어요(a weekly cleaning list with each employee's name)."],["주방 문 닫아 두면 → 깨끗함 오래감","door · clean 낱말은 같지만 까닭을 지어냈어요. 문은 닫은 것이 아니라 명단을 붙인 자리예요(was posted on the door)."]],"dg":"A case in point is ~"},{"id":"M4-5","k":4,"dev":"장면 하나 (원리를 스스로 끌어냄)","s":"At one used-car dealership, buyers who were shown a high sticker price first ended up paying considerably more than those who were simply asked to make an offer.","a":"비싼 값부터 보여 주면 → 값을 더 쳐줌","why":"신호 말 없이 한 중고차 매장의 장면 하나만 나와요. 높은 가격표를 먼저 본 사람들은(buyers who were shown a high sticker price first) 그냥 값을 불러 보라는 말만 들은 사람들보다(those who were simply asked to make an offer) 결국 돈을 더 냈어요(ended up paying considerably more). 같은 매장에서 달라진 것은 먼저 본 숫자 하나예요. 처음 본 값이 기준이 되어 그 둘레에서 값을 매기게 된 거예요. 중고차라는 겉을 걷어 내면, 비싼 값부터 보여 주면 값을 더 쳐준다는 원리가 남아요.","tr":[["살 사람이 여럿 몰리면 → 값을 더 쳐줌","그럴듯한 원리지만 글에 다른 구매자 이야기는 없어요. 두 무리를 가른 것은 높은 가격표를 먼저 봤느냐예요(shown a high sticker price first)."],["곧 팔릴 듯해 보이면 → 값을 더 쳐줌","그럴듯한 원리지만 글에 서둘러야 한다는 말은 없어요. 두 무리를 가른 것은 높은 가격표를 먼저 봤느냐예요(shown a high sticker price first)."],["스스로 값을 부르게 하면 → 값을 더 쳐줌","make an offer 낱말은 같지만 거꾸로예요. 값을 불러 보라는 말만 들은 쪽이 오히려 덜 냈어요(paying considerably more than those who were simply asked to make an offer)."],["가격표를 먼저 보이면 → 값을 깎게 됨","sticker price · first 낱말은 같지만 거꾸로예요. 높은 가격표를 먼저 본 쪽은 깎은 것이 아니라 결국 더 냈어요(ended up paying considerably more)."]],"dg":"장면 하나"},{"id":"M4-6","k":4,"dev":"The reverse was true of ~ (요점은 앞 문장이 아니라 반대쪽인 이 문장)","s":"The reverse was true of a single large block one bartender used: with far less surface in contact with the liquid, it lasted nearly an hour.","a":"닿는 면이 좁을수록 → 더디게 녹음","why":"The reverse was true of ~는 「~은 그 반대였다」라는 말이에요. 앞 문장은 잘게 부순 얼음이 몇 분이면 사라진다는 것이고(gone within minutes), 이 문장은 그 반대쪽 사례예요. 한 바텐더가 쓴 큰 얼음 한 덩이는(a single large block) 음료에 닿는 겉면이 훨씬 적어서(with far less surface in contact with the liquid) 거의 한 시간을 버텼어요(it lasted nearly an hour). 쌍점(:) 뒤가 까닭을 알려 줘요. 얼음이라는 겉을 걷어 내면, 닿는 면이 좁을수록 더디게 녹는다는 원리가 남아요.","tr":[["잘게 부술수록 → 더디게 녹음","앞 문장의 crushed ice를 옮겼지만 거꾸로예요. 부순 얼음은 몇 분이면 사라지고(gone within minutes), 오래 버틴 것은 큰 덩이예요(a single large block)."],["덩이가 차가울수록 → 더디게 녹음","그럴듯한 원리지만 글에 얼음의 온도 이야기는 없어요. 글이 든 까닭은 음료에 닿는 겉면이 적다는 점이에요(with far less surface in contact with the liquid)."],["음료가 차가울수록 → 더디게 녹음","그럴듯한 원리지만 글에 음료의 온도 이야기는 없어요. 글이 든 까닭은 음료에 닿는 겉면이 적다는 점이에요(with far less surface in contact with the liquid)."],["덩이가 큼직할수록 → 금세 사라짐","large block · gone 낱말은 같지만 거꾸로예요. 큰 덩이는 금세 사라진 것이 아니라 거의 한 시간을 버텼어요(it lasted nearly an hour)."]],"ctx":"Most crushed ice in a drink is gone within minutes.","dg":"The reverse was true of ~"},{"id":"M4-7","k":4,"dev":"Suppose ~ (장면 떠올려 보기)","s":"Suppose two identical sheds stand side by side in the sun, one with a dark roof and one with a white roof. By noon, the white one is several degrees cooler inside.","a":"겉이 밝은 빛깔이면 → 볕에 덜 달궈짐","why":"Suppose ~는 「~라고 해 보자」라며 장면을 떠올리게 하는 말이에요. 똑같은 헛간 둘이 볕 아래 나란히 있어요(two identical sheds stand side by side in the sun). 다른 것은 지붕 빛깔 하나예요. 하나는 어둡고 하나는 하얘요(one with a dark roof and one with a white roof). 한낮이 되면 하얀 쪽이 안이 몇 도 더 시원해요(the white one is several degrees cooler inside). 헛간이라는 겉을 걷어 내면, 겉이 밝은 빛깔이면 볕에 덜 달궈진다는 원리가 남아요.","tr":[["바람이 잘 드나들면 → 볕에 덜 달궈짐","그럴듯한 원리지만 글의 두 헛간은 똑같아요(two identical sheds). 다른 것은 바람길이 아니라 지붕 빛깔뿐이에요(one with a dark roof and one with a white roof)."],["지붕이 두툼할수록 → 볕에 덜 달궈짐","그럴듯한 원리지만 글의 두 헛간은 똑같아요(two identical sheds). 다른 것은 지붕 두께가 아니라 빛깔뿐이에요(one with a dark roof and one with a white roof)."],["지붕이 어두울수록 → 안이 더 시원함","dark roof · cooler 낱말은 같지만 거꾸로예요. 더 시원한 쪽은 어두운 지붕이 아니라 지붕이 하얀 쪽이에요(the white one is several degrees cooler inside)."],["나란히 붙여 지으면 → 안이 더 시원함","side by side · cooler 낱말은 같지만 까닭을 지어냈어요. 나란히 선 것은 두 헛간을 견주려는 장치일 뿐이고, 시원함을 가른 것은 지붕 빛깔이에요(one with a dark roof and one with a white roof)."]],"dg":"Suppose ~"},{"id":"M4-8","k":4,"dev":"앞 문장 + 장면 (이음말 없음)","s":"Since a roadside display began flashing each driver's own speed, the majority have slowed down well before reaching the village school.","a":"제 행동 바로 보여 주면 → 스스로 고침","why":"이음말 없이 앞 문장과 이 문장이 옛 모습과 지금 모습으로 나란히 있어요. 앞 문장에서 운전자들은 속도 제한 표지판을 무시하곤 했어요(used to ignore the speed limit sign). 이 문장에서는 길가 화면이 운전자마다 자기 속도를 번쩍여 보여 주기 시작한 뒤로(began flashing each driver's own speed) 대부분이 학교에 닿기 한참 전에 속도를 줄여요(the majority have slowed down well before reaching the village school). 규칙을 알리는 표지판은 안 통했고, 지금 내가 어떻게 하고 있는지 바로 보여 주자 통한 거예요. 도로라는 겉을 걷어 내면, 제 행동을 바로 보여 주면 스스로 고친다는 원리가 남아요.","tr":[["지킬 규칙 써 붙이면 → 스스로 고침","앞 문장의 표지판 쪽을 옮긴 답이에요. 규칙을 적은 표지판은 무시당했어요(used to ignore the speed limit sign)."],["남과 견줘 보여 주면 → 스스로 고침","그럴듯한 원리지만 화면이 보여 준 것은 남의 속도가 아니라 운전자 자기 속도예요(each driver's own speed)."],["학교가 가까워지면 → 속도를 줄임","school · slowed down 낱말은 같지만 까닭이 달라요. 속도를 줄이게 한 것은 학교가 아니라 자기 속도를 보여 주는 화면이에요(Since a roadside display began flashing each driver's own speed)."],["화면이 번쩍거리면 → 눈길 빼앗김","flashing 낱말은 같지만 결과를 지어냈어요. 화면이 번쩍인 뒤 일어난 일은 대부분이 속도를 줄인 것이에요(the majority have slowed down)."]],"ctx":"Drivers on one village road used to ignore the speed limit sign.","dg":"앞 문장 + 장면"},{"id":"M4-9","k":4,"dev":"앞뒤 두 장면 견주기 (신호 말 없음)","s":"Visitors at one theme park used to abandon long lines after about twenty minutes. Once signs showed the remaining wait at every bend in the line, they stayed far longer.","a":"끝이 어디쯤인지 알면 → 더 참고 견딤","why":"신호 말 없이 한 놀이공원의 앞뒤 두 장면이 나란히 있어요. 예전에는 긴 줄에 선 사람들이 20분쯤 지나면 줄을 떠나곤 했어요(used to abandon long lines after about twenty minutes). 굽이마다 남은 대기 시간을 알리는 표지가 생기자(Once signs showed the remaining wait at every bend in the line) 훨씬 오래 머물렀어요(they stayed far longer). 줄은 그대로 길고, 달라진 것은 얼마나 남았는지 알게 된 일 하나예요. 놀이공원이라는 겉을 걷어 내면, 끝이 어디쯤인지 알면 더 참고 견딘다는 원리가 남아요.","tr":[["그사이 할 거리 있으면 → 더 참고 견딤","그럴듯한 원리지만 글에 기다리며 할 거리 이야기는 없어요. 새로 생긴 것은 남은 시간을 알리는 표지예요(signs showed the remaining wait at every bend in the line)."],["곁에 일행이 함께면 → 더 참고 견딤","그럴듯한 원리지만 글에 일행 이야기는 없어요. 새로 생긴 것은 남은 시간을 알리는 표지예요(signs showed the remaining wait at every bend in the line)."],["남은 시간을 알려 주면 → 줄이 짧아짐","remaining wait · lines 낱말은 같지만 결과를 지어냈어요. 줄이 짧아졌다는 말은 없고, 달라진 것은 사람들이 훨씬 오래 머문 것이에요(they stayed far longer)."],["줄이 길게 늘어설수록 → 더 오래 머묾","long lines · stayed far longer 낱말은 같지만 잘못 이었어요. 긴 줄은 예전에 사람들이 떠나던 까닭이에요(used to abandon long lines after about twenty minutes)."]],"dg":"두 장면 견주기"},{"id":"M4-10","k":4,"dev":"The exception was ~ (요점은 앞 문장의 흐름이 아니라 예외 쪽)","s":"The exception was a wall whose owner repainted it the very next morning each time; after a month, the vandals gave up.","a":"생긴 자국 그때그때 지우면 → 되풀이 그침","why":"The exception was ~는 「예외는 ~였다」라며 앞 문장의 흐름에서 벗어난 사례를 꺼내요. 앞 문장에서는 낙서를 지운 벽 대부분이 한 주 안에 다시 덮였어요(covered again within a week). 예외는 주인이 낙서가 생길 때마다 바로 다음 날 아침에 다시 칠한 벽이에요(repainted it the very next morning each time). 한 달 뒤 낙서하던 사람들이 손을 뗐어요(after a month, the vandals gave up). 지우는 것만으로는 안 됐고, 생길 때마다 곧바로 지우자 그친 거예요. 벽이라는 겉을 걷어 내면, 생긴 자국을 그때그때 지우면 되풀이가 그친다는 원리가 남아요.","tr":[["지켜보는 눈 늘려 두면 → 되풀이 그침","그럴듯한 원리지만 글에 지켜보는 사람이나 카메라 이야기는 없어요. 예외를 만든 것은 바로 다음 날 아침의 덧칠이에요(repainted it the very next morning each time)."],["그릴 자리 따로 내주면 → 되풀이 그침","그럴듯한 원리지만 글에 낙서할 자리를 내줬다는 말은 없어요. 예외를 만든 것은 바로 다음 날 아침의 덧칠이에요(repainted it the very next morning each time)."],["낡은 벽 새로 칠해 두면 → 되풀이 그침","repainted 낱말은 같지만 뜻이 달라요. 한 번 새로 칠한 것이 아니라 낙서가 생길 때마다 바로 다음 날 아침에 덧칠했어요(repainted it the very next morning each time). 그냥 지운 벽 대부분은 다시 덮였어요(covered again within a week)."],["한 달 지나 덧칠해 주면 → 한 주 안에 덮임","after a month · within a week 낱말은 같지만 잘못 이었어요. 한 달은 덧칠을 미룬 기간이 아니라 낙서하던 사람들이 손을 떼기까지 걸린 기간이에요(after a month, the vandals gave up)."]],"ctx":"Along one shopping street, most walls cleaned of graffiti were covered again within a week.","dg":"The exception was ~"},{"id":"M5-1","k":5,"dev":"was like ~ing (동명사 직유)","s":"For the director of one clinic, hiring nurses was like pouring water into a bucket with a hole in it; each month, as many left as arrived.","a":"간호사 채용 → 애써도 제자리걸음","why":"was like ~ing은 「~하는 것과 같았다」라며 비유를 알리는 말이에요. 간호사를 뽑는 일이 구멍 난 양동이에 물을 붓는 것 같았다고 했어요(like pouring water into a bucket with a hole in it). 부어도 부어도 차지 않는다는 그림이에요. 쌍반점(;) 뒤가 그 까닭을 보여 줘요. 달마다 들어오는 만큼 나갔어요(as many left as arrived). 그래서 속뜻은 간호사 채용이 애써도 제자리걸음이었다는 거예요.","tr":[["간호사 채용 → 지원자가 통 없음","힘들었다는 쪽은 같지만 까닭이 달라요. 오는 사람이 없던 것이 아니라, 들어오는 만큼 나갔어요(as many left as arrived)."],["간호사 채용 → 달마다 수월해짐","each month 낱말은 같지만 뜻이 반대예요. 달마다 들어오는 만큼 나가서(each month, as many left as arrived) 채워지지 않았어요."],["병원 원장 → 간호사를 내보냄","director · left 낱말은 같지만 일을 지어냈어요. 원장이 내보낸 것이 아니라 간호사들이 떠난 것이고, 원장은 뽑으려 애쓰는 쪽이에요(For the director of one clinic, hiring nurses)."],["병원 원장 → 달마다 인원 늘림","each month · arrived 낱말은 같지만 결과가 달라요. 들어오는 만큼 나가서 인원은 늘지 않았어요(as many left as arrived)."]],"dg":"was like ~ing"},{"id":"M5-2","k":5,"dev":"길 비유 (hit a wall)","s":"After three smooth rounds, the wage talks at the shipyard hit a wall when the union asked to see the full accounts.","a":"임금 협상 → 더 나아가지 못함","why":"비유를 알리는 말 없이 hit a wall(벽에 부딪혔다)이라는 낱말 자체가 비유예요. 진짜 벽이 아니라, 잘 가던 길이 막혔다는 뜻이에요. 세 차례는 순조로웠는데(After three smooth rounds), 노동조합이 장부를 모두 보여 달라고 하자(when the union asked to see the full accounts) 임금 협상이 막혔어요. 그래서 속뜻은 임금 협상이 더 나아가지 못했다는 거예요.","tr":[["임금 협상 → 세 차례 만에 타결","three rounds 낱말은 같지만 결과를 지어냈어요. 세 차례는 순조로웠을 뿐이고(After three smooth rounds), 그 뒤 벽에 부딪혔어요(hit a wall)."],["임금 협상 → 회사 쪽이 이김","그럴듯하지만 글에 누가 이겼다는 말은 없어요. 협상은 끝난 것이 아니라 막혔어요(hit a wall)."],["노동조합 → 회사 장부 받아 봄","accounts 낱말은 같지만 일을 지어냈어요. 조합은 장부를 보여 달라고 했을 뿐이고(asked to see the full accounts), 그 요구에서 협상이 막혔어요."],["노동조합 → 조선소 담을 넘음","wall · shipyard 낱말을 글자 그대로 옮겼어요. hit a wall은 진짜 담이 아니라 협상이 막혔다는 비유예요(the wage talks at the shipyard hit a wall)."]],"dg":"길 비유"},{"id":"M5-3","k":5,"dev":"딴 것만 칭찬하기 (the font is lovely)","s":"'Well, the font is lovely,' the editor said, sliding all forty pages of the proposal back across the desk without turning another page.","a":"편집자 → 알맹이는 마음에 안 참","why":"칭찬처럼 들리지만 속뜻은 달라요. 편집자가 칭찬한 것은 글꼴 하나뿐이에요('Well, the font is lovely'). 그러면서 마흔 쪽짜리 제안서를 한 장도 더 넘기지 않고(without turning another page) 책상 너머로 되밀었어요(sliding all forty pages of the proposal back across the desk). 내용에 대해서는 좋은 말을 하나도 하지 않고 돌려준 거예요. 그래서 속뜻은 편집자가 제안서의 알맹이는 마음에 차지 않았다는 거예요.","tr":[["편집자 → 꾸밈새에 흠뻑 반함","따옴표 속 말('Well, the font is lovely')을 겉뜻대로 믿은 답이에요. 반했다면 더 읽었을 텐데 한 장도 더 넘기지 않고 되밀었어요(without turning another page)."],["편집자 → 알맹이도 썩 마음에 듦","그럴듯하지만 행동과 맞지 않아요. 마음에 들었다면 더 읽었을 텐데, 한 장도 더 넘기지 않고(without turning another page) 책상 너머로 되밀었어요(back across the desk)."],["제안서 → 끝 쪽까지 다 읽힘","page 낱말은 같지만 거꾸로예요. 편집자는 한 장도 더 넘기지 않았어요(without turning another page)."],["제안서 → 마흔 쪽으로 불어남","forty pages 낱말은 같지만 일을 지어냈어요. 마흔 쪽은 제안서의 분량일 뿐이고(all forty pages of the proposal), 늘어났다는 말은 없어요."]],"dg":"딴 것만 칭찬"},{"id":"M5-4","k":5,"dev":"the way ~ (~가 하듯이)","s":"The veteran mechanic listens to an engine the way a doctor listens to a chest, saying nothing until the noise has told him enough.","a":"노련한 정비사 → 소리로 탈을 가려냄","why":"the way ~는 「~가 하듯이」라며 두 일을 견주는 말이에요. 노련한 정비사가 엔진 소리를 듣는 모습을,
