lax in the second house rarely notice which legs she quietly trimmed so that each piece would fit.","a":"번역가 → 남몰래 손봐 맞춤","why":"번역가의 일을 문 크기가 다른 두 집 사이로 가구를 옮기는 일에 빗대고, 풀이 없이 둘째 문장까지 비유를 이어 갔어요. 두 집은 두 언어, 가구는 글, 손님은 독자예요. 문에 맞게 들어가도록 다리를 몰래 깎았다(which legs she quietly trimmed so that each piece would fit)는 것은, 언어의 틀이 달라서 번역가가 독자 모르게 글을 손봐 맞춘다는 속뜻이에요.","tr":[["번역가 → 평생 고된 일을 함","첫 문장의 겉뜻(spends her working life moving furniture)만 읽은 답이에요. 가구를 옮기는 것은 번역을 빗댄 말이고, 글은 일이 힘들다는 데 무게를 두지 않아요."],["번역 → 원문을 그대로 살림","좋은 번역에 대한 흔한 생각이지만 글과 반대예요. 문에 맞추려고 다리를 깎았다는 것은 원문을 그대로 두지 않고 고쳤다는 뜻이에요."],["독자 → 번역서를 편히 즐김","관계사절의 배경(who later relax in the second house)을 옮긴 답이에요. 문장이 하려는 말은 그 손님들이 어느 다리를 깎았는지 알아채지 못한다(rarely notice)는 것, 곧 번역가가 남몰래 손봤다는 것이에요."]]},{"id":"S5-2","k":5,"dev":"완곡어 (let go = 해고 같은 꼴)","s":"Shortly after the two firms merged, roughly forty employees, most of whom had worked in overlapping departments, were encouraged to pursue opportunities elsewhere.","a":"합병 → 직원들을 내보냄","why":"pursue opportunities elsewhere(다른 곳에서 기회를 찾다)는 해고를 부드럽게 돌려 말하는 완곡어예요. 합병하자마자 마흔 명쯤이 이런 권유를 받았다(roughly forty employees ... were encouraged to pursue opportunities elsewhere)는 것은 회사가 그들을 내보냈다는 뜻이에요.","tr":[["직원들 → 더 나은 자리로 옮김","완곡어(were encouraged to pursue opportunities elsewhere)를 겉뜻대로 「다른 곳에서 더 나은 기회를 찾아갔다」고 읽은 답이에요. 합병하자마자 겹치는 부서의 마흔 명쯤이 한꺼번에 이런 권유를 받았다는 것은, 회사가 떠나 달라고 한 것을 부드럽게 바꿔 말한 것이에요."],["합병 → 겹치는 부서가 생김","관계사절의 세부(most of whom had worked in overlapping departments)예요. 누가 나가게 됐는지를 덧붙인 말일 뿐, 문장이 하려는 말은 아니에요."],["합병 → 두 회사 문화 충돌","합병에 대해 흔히 하는 말이지만 글에 없어요."]]},{"id":"S5-3","k":5,"dev":"모순어법 (a deafening silence 같은 꼴)","s":"Since the conductor turned seventy, the orchestra's rehearsals have been guided by an eloquent stillness, which younger conductors, when asked, acknowledge they cannot imitate.","a":"지휘자 → 몸짓 없이도 잘 이끎","why":"eloquent stillness(많은 것을 말해 주는 고요함)는 서로 어긋나는 낱말을 붙인 모순어법이에요. 가만히 있는데도 많은 것을 전한다는 뜻이라, 지휘자가 큰 몸짓 없이 연습을 이끈다(the orchestra's rehearsals have been guided by an eloquent stillness)는 말이에요. 젊은 지휘자들이 따라 하지 못한다(acknowledge they cannot imitate)는 것은 그 고요함이 쇠약이 아니라 솜씨라는 뜻이에요.","tr":[["지휘자 → 나이 들어 기운 빠짐","일흔이 넘었다는 것(Since the conductor turned seventy)과 고요함(stillness)을 겉뜻대로 이어 「늙어서 덜 움직인다」로 읽은 답이에요. eloquent가 붙어 그 고요함이 오히려 많은 것을 전한다는 뜻이고, 젊은 지휘자들도 따라 하지 못한다고 해요."],["단원들 → 지휘를 따르기 힘듦","몸짓이 적으면 따르기 어렵겠다는 짐작이지만 글에 없어요. 연습은 그 고요함으로 이끌려 왔어요(have been guided by an eloquent stillness)."],["지휘 → 단원과의 믿음이 바탕","지휘에 대해 흔히 하는 교훈이지만 글에 없어요."]]},{"id":"S5-4","k":5,"dev":"상황의 아이러니 (소방서가 불탐 같은 꼴)","s":"The committee formed last year to reduce paperwork has so far produced a 300-page report, which every department is now required to read and sign.","a":"위원회 → 서류 일을 더 늘림","why":"서류를 줄이려고 만든 위원회(The committee formed last year to reduce paperwork)가 300쪽 보고서를 내어, 이제 모든 부서가 그것을 읽고 서명해야 해요(every department is now required to read and sign). 목적과 정반대 결과가 나온 상황의 아이러니로, 위원회가 서류 일을 더 늘렸다는 속뜻이에요.","tr":[["위원회 → 꼼꼼한 보고서를 냄","겉뜻만 보면 300쪽 보고서는 꼼꼼한 성과처럼 보여요. 하지만 이 위원회는 서류를 줄이려고 만든 것(formed last year to reduce paperwork)이라, 두꺼운 보고서는 칭찬이 아니라 꼬집는 말이에요."],["부서들 → 보고서에 불만이 큼","그럴듯한 짐작이지만 부서들이 불만을 말했다는 내용은 없어요. 글은 읽고 서명해야 한다(is now required to read and sign)고만 해요."],["행정 → 절차 줄여야 빨라짐","위원회를 만든 목적에서 끌어낸 흔한 교훈이에요. 글이 말하는 것은 그 목적과 반대로 된 결과예요."]]},{"id":"S5-5","k":5,"dev":"제유 (all hands = 일손 같은 꼴)","s":"The village festival drew so many visitors that its organizers, who had anticipated half as many, found themselves with too many mouths to feed and too few hands.","a":"축제 → 일할 사람이 모자람","why":"mouths(입)는 먹을 사람, hands(손)는 일할 사람을 몸의 한 부분으로 가리킨 제유예요. 먹일 입은 너무 많고 시중들 손은 너무 적었다(too many mouths to feed and too few hands)는 것은 손님에 비해 일할 사람이 모자랐다는 뜻이에요.","tr":[["주최 측 → 음식을 덜 준비함","mouths to feed를 겉뜻대로 음식 이야기로 읽은 답이에요. 모자란 쪽은 손(too few hands), 곧 일할 사람이에요. 음식이 모자랐다는 말은 없어요."],["주최 측 → 손님 수를 잘못 짐작함","관계사절의 세부(who had anticipated half as many)예요. 일이 벌어진 까닭일 뿐, 문장이 말하려는 결과는 일손이 모자랐다는 것이에요."],["축제 → 클수록 마을에 이득","축제에 대해 흔히 하는 말이지만 글에 없어요."]]},{"id":"S5-6","k":5,"dev":"온도 비유 (a chilly reception 같은 꼴)","s":"On her first morning, the new manager received a chilly welcome that, as she later learned, came from the office heater, which had apparently stopped functioning over the long weekend.","a":"첫 출근날 → 사무실이 추웠음","why":"chilly welcome은 흔히 「쌀쌀한 대접」이라는 온도 비유로 쓰이지만, 여기서 추위는 진짜 추위예요. 차가운 환영은 사람이 아니라 사무실 난방기에서 왔고(came from the office heater), 그 난방기는 긴 연휴 동안 멈춰 버렸어요(had apparently stopped functioning over the long weekend). 난방기를 사람처럼 「맞이했다」고 재치 있게 말했을 뿐, 첫 출근날 사무실이 정말 추웠다는 뜻이에요.","tr":[["직원들 → 새 관리자를 꺼림","chilly welcome을 무조건 「쌀쌀한 대접」이라는 속뜻으로 읽은 답이에요. 이 차가운 환영은 사람이 아니라 난방기에서 왔어요(came from the office heater). 직원들 이야기는 글에 없어요."],["관리자 → 긴 연휴 뒤 첫 출근","때를 나타내는 덧붙은 세부(over the long weekend)예요. 난방기가 언제 멈췄는지를 말할 뿐, 문장이 하려는 말은 첫날 사무실이 추웠다는 것이에요."],["새 직장 → 첫날은 어색하기 마련","새 직장 첫날에 대한 흔한 이야기지만 글에 없어요."]]},{"id":"S5-7","k":5,"dev":"전이 수식어 (a sleepless night 같은 꼴)","s":"After nineteen days of talks that had collapsed twice, the two delegations signed the agreement over a weary breakfast, which neither side bothered to finish.","a":"양측 → 지친 끝에 서명함","why":"a weary breakfast(지친 아침 식사)는 사람의 상태(지침)를 곁에 있는 물건(아침 식사)에 옮겨 붙인 전이 수식어예요. 열아흐레 협상 끝에(After nineteen days of talks) 양쪽 대표단이 지친 채 서명했고, 아침을 다 먹을 마음도 없었다(which neither side bothered to finish)는 속뜻이에요.","tr":[["양측 → 서명하며 함께 축하함","서명 자리에 아침 식사가 있다고 축하하는 자리로 읽은 답이에요. weary(지친)와, 아무도 아침을 다 먹지 않았다(which neither side bothered to finish)는 모습은 축하와 거리가 멀어요."],["협상 → 두 번이나 깨졌었음","관계사절의 세부(that had collapsed twice)예요. 지금까지의 사정일 뿐, 문장의 중심은 마침내 서명한 장면과 그때의 모습이에요."],["협상 → 양보해야 타결됨","협상에 대해 흔히 하는 교훈이지만 글에 없어요."]]},{"id":"S5-8","k":5,"dev":"역설 (the more ~, the less ~)","s":"The more cautiously the veteran runner, who turned forty last spring, approaches the opening laps, the less often younger rivals finish ahead of her.","a":"노장 → 천천히 시작해 덜 밀림","why":"「The more ~, the less ~」 꼴의 역설이에요. 처음 몇 바퀴를 조심스럽게 달릴수록(The more cautiously the veteran runner ... approaches the opening laps) 젊은 선수들이 그보다 먼저 들어오는 일이 줄어든다(the less often younger rivals finish ahead of her)는 말이에요. 느려 보이는 출발이 오히려 앞서는 길이라는 속뜻이에요.","tr":[["노장 → 나이 들어 조심스러워짐","관계사절(who turned forty last spring)과 cautiously를 겉뜻대로 이은 답이에요. 글은 그 조심스러움이 약점이 아니라 젊은 선수들을 앞서는 길이라고 말해요."],["노장 → 젊은 선수에게 밀려남","나이가 많으면 밀린다는 흔한 짐작이에요. 글은 젊은 선수들이 그를 앞서는 일이 줄어든다(younger rivals finish ahead of her)고, 곧 반대로 말해요."],["노장 → 조심할수록 더 밀림","같은 「~할수록」 꼴에서 방향을 거꾸로 잡았어요. 글은 조심스럽게 시작할수록 젊은 선수들이 그를 앞서는 일이 줄어든다(the less often younger rivals finish ahead of her)고 해요."]]},{"id":"S5-9","k":5,"dev":"우화 인용 (sour grapes · the boy who cried wolf 같은 꼴, 문장 안에서 비유로)","s":"The older lab, which had abandoned the experiment years before its rival finally succeeded, dismissed the result as minor, a reaction colleagues privately called sour grapes.","a":"포기한 쪽 → 샘이 나서 깎아내림","why":"sour grapes(신 포도)는 여우가 닿지 않는 포도를 「어차피 실 거야」 하고 깎아내린 우화에서 온 말이에요. 오래전에 실험을 그만둔 연구실(which had abandoned the experiment years before its rival finally succeeded)이 상대의 성공을 하찮다고 했고(dismissed the result as minor), 동료들이 그 반응을 신 포도라 불렀으니, 자기가 못 해낸 것이 샘나서 깎아내렸다는 속뜻이에요.","tr":[["새 결과 → 학계에 의미가 적음","오래된 연구실의 평가(dismissed the result as minor)를 그대로 믿은 답이에요. 동료들이 그 반응을 신 포도라고 불렀다는 것은, 그 평가가 공정한 판단이 아니라 샘에서 나온 말이라는 뜻이에요."],["경쟁 → 서로를 성장하게 함","두 연구실의 경쟁에 대해 흔히 하는 좋은 교훈이지만 글에 없어요."],["포기한 쪽 → 다시 실험에 나섬","그럴듯한 다음 이야기지만 글에 없어요. 그 연구실이 한 일은 상대의 결과를 하찮다고 한 것(dismissed the result as minor)뿐이에요."]]},{"id":"S5-10","k":5,"dev":"행동으로 드러나는 속뜻 (감정 낱말 없이 행동만으로)","s":"When our team lost the debate final, the captain, who had insisted all season that outcomes hardly mattered, sat alone in the empty hall until dark.","a":"주장 → 실은 패배에 낙담함","why":"슬프다는 낱말 없이 행동만으로 마음을 보여 주는 문장이에요. 시즌 내내 결과는 별것 아니라고 했지만(insisted all season that outcomes hardly mattered), 결승에서 지자 빈 강당에 어두워질 때까지 혼자 앉아 있었어요(sat alone in the empty hall until dark). 겉으로 한 말과 달리 실은 패배에 낙담했다는 속뜻이에요.","tr":[["주장 → 결과에 전혀 개의치 않음","관계사절에 나온 주장의 말(who had insisted all season that outcomes hardly mattered)을 그대로 믿은 답이에요. 진 뒤에 한 행동은 그 말과 다른 속마음을 보여 줘요."],["주장 → 팀원들을 다독여 줌","주장이 할 법한 일이지만 글에 없어요. 주장은 혼자 앉아 있었어요(sat alone)."],["토론 → 결과보다 과정이 중요","주장이 늘 하던 말이자 흔한 교훈이지만, 이 문장이 보여 주는 것은 그 말과 다른 주장의 모습이에요."]]}],"write":[{"id":"S1-W1","k":1,"dev":"by virtue of","s":"By virtue of staying open on Friday nights, one small museum has become a meeting place for teenagers, who had seldom visited it before.","model":"작은 박물관 → 십대 모임터 됨","accept":"야간 개장 박물관 → 십대 만남의 장소, 금요일 밤 개장 → 십대가 모임, 박물관 → 십대가 찾아옴(반만 맞음: 모이는 장소가 됐다는 말이 빠짐)","no":"금요일 밤에 문 엶(by virtue of 뒤 까닭만), 예전엔 십대가 잘 안 옴(who 뒤 세부만), 야간 개장 → 관람료 수입 늘어남(글에 없음)"},{"id":"S1-W2","k":1,"dev":"if only because","s":"Teachers in one district now let pupils answer in dialect, if only because children who are constantly corrected often stop raising their hands.","model":"교사들 → 사투리 대답 허용","accept":"교실에서 사투리로 대답해도 됨, 선생님이 사투리 대답 받아 줌","no":"자꾸 고치면 손 안 듦(if only because 뒤 까닭만), 사투리 → 지켜야 할 문화(글에 없는 교훈), 사투리 → 고쳐 줘야 함(글과 반대)"},{"id":"S1-W3","k":1,"dev":"과거분사 수식 (관계사 생략된 꼴)","s":"Plastic fibers shed by washing machines, small enough to slip through some treatment plants, were detected at nearly every bend of one river sampled by students.","model":"세탁 미세섬유 → 강 곳곳에서 나옴","accept":"강 거의 모든 곳에서 플라스틱 섬유 발견, 세탁기 미세 플라스틱 → 강 전체에 퍼짐, 강에서 미세 플라스틱 나옴(반만 맞음: 거의 모든 곳이라는 범위가 빠짐)","no":"처리장을 빠져나감(덧붙은 세부만), 학생들이 강물 조사(과거분사 꾸밈말만), 세탁기 → 강 오염의 주범(글에 없는 단정)"},{"id":"S1-W4","k":1,"dev":"so + 형용사 + that (결과)","s":"The sign language of one isolated village became so widespread that even hearing residents who had no deaf relatives used it in the fields.","model":"마을 수어 → 듣는 주민도 씀","accept":"외딴 마을 수어 → 마을 전체로 퍼짐, 청인 주민까지 수어 사용, 마을 수어가 널리 퍼짐(반만 맞음: 얼마나 퍼졌는지 결과가 빠짐)","no":"농인 가족이 없음(who 뒤 세부만), 들에서 씀(세부만), 수어 → 외딴 마을에서 생김(화제만)"},{"id":"S2-W1","k":2,"dev":"Once considered ~, X now ~","s":"Once considered little more than places of entertainment, some zoos now run breeding programs that have helped restore endangered species, such as the Arabian oryx, to the wild.","model":"일부 동물원 → 멸종 위기종 되살림","accept":"동물원이 번식시켜 야생으로 돌려보냄, 동물원 → 위기종 보전에 이바지, 동물원 → 구경거리 이상(반만 맞음: 무엇을 하는지 빠짐)","no":"동물원 → 오락 장소(Once considered 쪽의 옛 생각), 아라비아오릭스 → 야생 복귀(예시 세부만), 동물원 → 모든 동물을 야생으로(멸종 위기종을 모든 동물로 키운 말)"},{"id":"S2-W2","k":2,"dev":"Much as ~, ~","s":"Much as adults like to credit the revival of handwritten letters to nostalgia, teenage letter writers in one survey cited another motive: owning something that cannot be deleted.","model":"십대 손편지 → 지울 수 없어서 씀","accept":"십대는 지워지지 않는 물건이라 손편지를 씀, 손편지 → 향수 말고 다른 까닭(반만 맞음: 그 까닭이 빠짐)","no":"손편지 부활 → 향수 때문(Much as 쪽 어른들의 흔한 설명), 십대 → 디지털 싫어함(지울 수 없다는 말을 키운 것), 손편지 → 다시 유행(화제만 있고 하는 말이 빠짐)"},{"id":"S2-W3","k":2,"dev":"Whereas ~, ~","s":"Whereas shared e-scooters are promoted as a green substitute for cars, one lifecycle study found that most riders surveyed would otherwise have walked, cycled or taken a bus.","model":"킥보드 → 차보다 걷기·버스를 대신","accept":"킥보드 이용자 → 원래는 걷거나 버스 탐, 킥보드는 주로 걷기·자전거·버스를 대신함, 킥보드 → 차 대신은 적음(반만 맞음: 무엇을 대신하는지 빠짐)","no":"킥보드 → 친환경 교통(Whereas 쪽의 홍보 문구), 킥보드 → 배출 더 많음(글이 말하지 않은 결론까지 감), 킥보드 → 자동차 줄임(Whereas 쪽을 그대로 믿은 말)"},{"id":"S2-W4","k":2,"dev":"That said, ~","s":"Rooftop farms, which often grow leafy greens in carefully controlled conditions, can achieve remarkable yields per square meter. That said, because in most cities their combined output remains tiny relative to demand, their value may lie mainly in education.","model":"옥상 농장 → 가치는 주로 교육","accept":"옥상 농장은 양이 적어 교육에 쓸모, 옥상 농장 → 도시 수요엔 턱없이 적음(반만 맞음: 결론인 교육이 빠짐)","no":"옥상 농장 → 수확량 놀라움(That said 앞 문장), 옥상 농장 → 도시 식량 해결(앞 문장을 키운 말), 잎채소 → 옥상에서 잘 자람(앞 문장 세부)"},{"id":"S3-W1","k":3,"dev":"no longer ~; ~ now ~","s":"Many historians no longer treat errors on old maps as carelessness; they now read them as evidence of what mapmakers, who relied on sailors' reports, believed.","model":"옛 지도 오류 → 당시 믿음의 증거","accept":"지도의 틀린 곳 → 그때 생각을 보여 줌, 오류 → 지도 만든 이의 믿음 드러냄, 옛 지도 오류 → 부주의 탓 아님(반만 맞음: 무엇의 증거인지가 빠짐)","no":"옛 지도 → 부주의한 실수(no longer 쪽을 옮김), 선원 보고 → 믿을 수 없음(who절을 비튼 말), 선원 보고에 기댄 믿음(who절 곁가지만), 옛 지도 → 틀린 곳이 많음(새 해석이 빠짐)"},{"id":"S3-W2","k":3,"dev":"It would be a mistake to ~; ~","s":"It would be a mistake to read a nutrition label's calorie figure as exact; derived from averages, it may differ noticeably from the actual amount.","model":"표시 열량 → 평균값이라 오차 있음","accept":"열량 숫자 → 실제와 다를 수 있음, 성분표 열량은 정확하지 않음, 표시 열량 → 평균에서 나옴(반만 맞음: 실제와 다를 수 있다는 말이 빠짐)","no":"성분표 열량 → 정확함(mistake라고 한 쪽을 옮김), 열량 → 살찌는 원인(글에 없는 흔한 말), 성분표 → 꼭 읽어야 함(글에 없는 흔한 교훈)"},{"id":"S3-W3","k":3,"dev":"in place of ~","s":"In place of a word-for-word translation, which would have kept every term but lost the joke, the translator invented a Korean pun with an equivalent effect.","model":"번역가 → 같은 효과의 말장난 지음","accept":"직역 대신 우리말 말장난, 번역 → 농담의 효과를 살림, 우리말 말장난을 새로 지음(반만 맞음: 같은 효과라는 점이 빠짐)","no":"번역 → 낱말 하나하나 살림(in place of 쪽을 옮김), 직역 → 농담을 잃음(which절의 곁가지만), 번역은 원문에 충실해야 함(글에 없는 흔한 교훈)"},{"id":"S3-W4","k":3,"dev":"A in name only","s":"In one valley, a flower once classified as an alien species proved foreign in name only, since ancient pollen suggests it had long grown there.","model":"외래종이라던 꽃 → 사실은 토종","accept":"그 꽃 → 이름만 외래종, 외래종 꽃 → 본디 그곳 식물, 오래된 꽃가루 → 오래 자란 증거(반만 맞음: 결론인 토종이 빠짐)","no":"그 꽃 → 외래종(in name only를 놓침), 외래종 → 생태계를 해침(글에 없는 흔한 말), 꽃가루 → 오래 남음(since절 세부만)"},{"id":"S4-W1","k":4,"dev":"~ illustrates the point","s":"One open-source program illustrates the point: after its maintainers began labeling simple bugs as good first tasks, the number of regular contributors, which had been shrinking, roughly doubled.","model":"쉬운 첫 일 → 참여자 늘어남","accept":"쉬운 첫 기여 → 기여자 늘어남, 쉬운 일 표시 → 공동체 살아남, 쉬운 버그 표시 → 기여자 두 배(사례 그대로라 반만 맞음)","no":"기여자 → 줄어듦(관계절 which had been shrinking에 끌림), 관리자 → 버그 표시함(원인만 있고 결과가 빠짐), 실력 있는 사람 → 공동체 살림(글에 없는 흔한 생각)","ctx":"A volunteer project tends to last only as long as newcomers can find a small, safe first contribution to make."},{"id":"S4-W2","k":4,"dev":"This is nowhere more evident than in ~ (도치 없이)","s":"This is nowhere more evident than in a concert hall, where a full audience, soaking up sound, can make the music echo far less than at an empty rehearsal.","model":"청중 → 소리 흡수해 덜 울림","accept":"꽉 찬 객석 → 소리 덜 울림, 흡수하는 것 → 방 소리 바꿈, 청중 → 소리 빨아들여 울림 바꿈","no":"벽 → 소리 반사(앞 문장의 반쪽만), 콘서트홀 → 음악 연주(화제만), 빈 연습실 → 울림 적음(거꾸로)","ctx":"How a room sounds depends as much on the surfaces that absorb sound as on those that reflect it."},{"id":"S4-W3","k":4,"dev":"One need only look at ~","s":"One need only look at the medieval churches whose walls some nineteenth-century restorers scraped clean, destroying faded paintings, to see how restoration can erase what it is meant to protect.","model":"복원 → 지키려던 것을 지움","accept":"잘못된 복원 → 문화재 망침, 벽 긁어낸 복원 → 옛 그림 없앰(사례 그대로라 반만 맞음)","no":"복원 → 문화재 지킴(protect만 보고 끌림), 중세 교회 → 그림이 바램(faded에 끌림), 19세기 → 교회 고침(결과가 빠짐)"},{"id":"S4-W4","k":4,"dev":"The same holds for ~","s":"The same holds for many plant diseases, which, if left undisturbed, can linger in the soil, waiting for the next planting of a host that rotation would have kept away.","model":"같은 작물 계속 → 병도 쌓임","accept":"돌려짓기 → 병도 막음, 해충처럼 병도 늘어남, 병균 → 땅속에서 오래 버팀(돌려짓기와 이어지지 않아 반만 맞음)","no":"해충 → 늘어남(앞 문장만), 농부 → 작물 돌림(까닭과 결과가 빠짐), 식물 병 → 저절로 사라짐(거꾸로)","ctx":"Growing one crop in the same field every year allows the pests that feed on it to multiply."},{"id":"S5-W1","k":5,"dev":"환유 (the kitchen = 요리사들 같은 꼴)","s":"When the owner hired a celebrity chef who seldom appeared, the kitchen, which had run smoothly for a decade, fell apart within weeks.","model":"자리 비운 주방장 → 주방 팀 무너짐","accept":"주방 사람들 → 몇 주 만에 무너짐, 요리사들 → 손발이 안 맞게 됨, 새 주방장 뒤 → 요리사들 흐트러짐, 주방 → 엉망이 됨(사람인지 장소인지 드러나지 않아 반만 맞음)","no":"주방 → 설비가 망가짐(kitchen을 겉뜻대로 장소로 읽음), 유명 요리사 → 식당을 살림(글과 반대), 주방 → 10년간 잘 돌아감(관계사절 곁가지)"},{"id":"S5-W2","k":5,"dev":"A is a B, not a C (대조 은유)","s":"My grandfather's watch, which has never been accurate, is a letter, not a clock, and I reread it whenever I wind it.","model":"물려받은 시계 → 할아버지 기억을 전함","accept":"시계 → 시간보다 할아버지 추억, 시계 → 태엽 감을 때마다 할아버지 생각, 시계 → 쓰임보다 마음이 소중(무엇을 전하는지가 빠져 반만 맞음)","no":"시계 → 편지 같음(비유 겉말만 옮김), 시계 → 시간이 안 맞음(관계사절 곁가지), 시계 → 고쳐 써야 함(글에 없음)"},{"id":"S5-W3","k":5,"dev":"양 비유 (a mountain of ~ / a flood of ~)","s":"When the retired teacher was hospitalized, a flood of letters arrived from former students whom she had not heard from in decades.","model":"은퇴한 선생님 → 제자들이 잊지 않음","accept":"제자들 → 오래도록 선생님을 기억함, 선생님 → 많은 제자 마음에 남음, 편지가 많이 옴 · 편지 → 홍수처럼 넘침(양만 쓰고 제자들이 잊지 않았다는 속뜻이 빠져 반만 맞음)","no":"선생님 → 병원에 입원함(때를 나타내는 절의 곁가지), 제자들 → 오래 연락 끊음(관계사절만 옮겨 속뜻과 반대)"},{"id":"S5-W4","k":5,"dev":"동물 비유 (a lone wolf · a guinea pig 같은 꼴)","s":"Unable to afford proper testing, the founder made her own family the guinea pigs for her app's first version, which crashed almost daily.","model":"창업자 → 가족을 시험 대상 삼음","accept":"창업자 → 가족에게 먼저 써 보게 함, 가족 → 첫 앱을 시험해 줌, 돈 없어 → 가족으로 시험함, 돈이 없어 제대로 시험 못 함(앞쪽 까닭만 써서 반만 맞음)","no":"가족 → 기니피그를 키움(비유 겉말), 앱 → 날마다 멈춤(관계사절 곁가지), 창업자 → 가족을 아낌(속뜻을 지어냄)"}],"paras":[{"id":"Q1","title":"발표되지 않은 결과","sents":[["Most of us assume that what appears in scientific journals is a fair sample of what researchers have actually found.","반대쪽","학술지 → 연구 전체 대표(통념)"],["In practice, studies reporting striking effects are considerably more likely to be published than those that find no effect, a pattern known as publication bias.","주장","눈에 띄는 결과 → 훨씬 잘 실림"],["A trial suggesting that a new treatment works may appear in a prominent journal within months, whereas an equally rigorous trial showing no benefit is often left unpublished.","예시","효과 있음 → 실림 · 없음 → 묻힘",["근거"]],["Over time, the published record, which readers naturally trust, comes to resemble a highlight reel rather than a complete recording of the game.","근거","기록 → 하이라이트만",["결론"]],["Missing results, in other words, are not a minor gap but a distortion that shapes what doctors and the public come to believe.","결론","빠진 결과 → 믿음을 비틂(핵심)",["주장"]],["Admittedly, journals have limited space, and editors understandably favor findings that readers are likely to notice.","반대쪽","지면 좁음 → 눈에 띌 결과 고름"],["Some fields have responded by asking researchers to register their studies before collecting data, so that a disappointing outcome cannot quietly vanish.","근거","미리 등록 → 사라짐 막기",["예시"]],["Registration does not guarantee publication, yet it at least renders the absence of a result visible.","근거","등록 → 빠진 것이 보임"],["Knowledge built only from successes, however impressive, is knowledge with its failures quietly erased.","결론","성공만 모은 지식 → 실패가 지워짐"]],"line":"학술지에 실린 것이 연구 전체를 대표한다고들 여기지만, 실은 눈에 띄는 결과가 훨씬 잘 실려, 빠진 결과가 우리의 믿음을 비튼다. 미리 등록하게 하면 빠진 것이 보인다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["why journals should publish fewer but more careful studies","how registration ensures that disappointing results get published","how competition among researchers lowers the quality of studies","how unpublished results distort what we come to believe","how editors decide which findings readers will notice"],"ans":3,"why":"한 줄의 「빠진 결과가 우리의 믿음을 비튼다」가 정답(how unpublished results distort what we come to believe)과 같아요. 「publish fewer but more careful studies」와 「competition among researchers lowers the quality」는 연구 이야기에 흔한 주장이지만, 글은 연구가 서툴다는 게 아니라 똑같이 꼼꼼한 연구도 효과가 없으면 묻힌다(an equally rigorous trial showing no benefit is often left unpublished)는 거예요. 「registration ensures that disappointing results get published」는 (8)의 「Registration does not guarantee publication」과 어긋나요. 등록은 빠진 것을 보이게 할 뿐(renders the absence of a result visible)이에요. 「how editors decide which findings readers will notice」는 (6)에서 잠깐 인정한 사정(Admittedly)을 키운 말이에요.","tip":"핵심 문장 (5)가 글 가운데에 있어요. (5)의 in other words는 앞의 예시와 비유를 한마디로 묶는 신호예요. 끝 문장만 결론이라고 여기면 놓쳐요."},{"id":"Q2","title":"거꾸로 간 해결책","sents":[["In 1935, about a hundred cane toads were brought to northeastern Australia in the hope that they would eat the beetles damaging the sugar cane crops.","예시","두꺼비 들여옴 → 해충 잡기 기대"],["The toads did little to control the beetles and instead spread across the region, poisoning many native animals that tried to eat them.","예시","해충은 못 잡고 → 퍼져 토종 동물 해침"],["The episode is often cited by ecologists, who see it as a warning about interventions designed with only one goal in mind.","주장","두꺼비 일 = 한 목표 개입의 경고"],["A remedy that solves the problem in front of us can create new ones elsewhere, precisely because complex systems respond in ways that no single plan anticipates.","근거","해결책 → 딴 곳에 새 문제",["주장"]],["Antibiotics given routinely to healthy farm animals, for instance, have been linked to the spread of bacteria that the drugs can no longer kill.","예시","가축 항생제 → 내성균"],["Of course, this does not mean that every intervention is doomed or that doing nothing is the safer choice.","반대쪽","개입 → 다 실패는 아님(손 놓기도 답 아님)"],["Many carefully tested programs have worked well, often because their designers monitored side effects from the very beginning.","근거","부작용 살핀 계획 → 성공",["반대쪽"]],["The lesson, then, is not to stop acting but to treat every solution as an experiment whose results must be monitored.","결론","해결책 = 지켜볼 실험(핵심)"],["A plan that cannot be adjusted once its consequences appear has stopped being a solution and become a gamble.","결론","고칠 수 없는 계획 → 도박"]],"line":"한 목표만 보고 들여온 두꺼비는 해충은 못 잡고 토종 동물을 해쳤다. 복잡한 체계는 예상 밖으로 반응하니, 해결책은 결과를 지켜보며 고치는 실험으로 다뤄야 한다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["the danger of relying on nature to solve human problems","why simple solutions work better than complex plans","the need to monitor solutions for unintended effects","the importance of giving each plan a single clear goal","how farm practices spread bacteria that resist antibiotics"],"ans":2,"why":"한 줄의 「해결책은 결과를 지켜보며 고치는 실험」이 정답(the need to monitor solutions for unintended effects)과 같아요. 「relying on nature to solve human problems」는 두꺼비 사례만 보고 넓힌 말이에요. 글은 가축 항생제(5)까지 들어 자연이 아니라 한 목표만 본 개입을 문제 삼아요. 「simple solutions work better than complex plans」는 (4)의 complex를 빌렸지만, 글이 말한 것은 복잡한 체계가 예상 밖으로 반응한다는 것이지 단순한 해결책이 낫다는 게 아니에요. 「giving each plan a single clear goal」은 거꾸로예요. (3)은 한 목표만 본 개입(interventions designed with only one goal in mind)을 경고했어요. 「farm practices spread bacteria」는 사례 (5)의 세부만 키운 말이에요.","tip":"글이 사례로 시작하면 (3)처럼 사례를 묶는 문장을 찾아요. (8)의 not A but B에서 B가 핵심이고, (9)는 그것을 비유로 다시 말해요. (3)은 생태학자의 말을 빌렸지만 글쓴이가 받아들이는 생각이라 반대쪽이 아니라 주장이에요."},{"id":"Q3","title":"지도가 심는 생각","sents":[["No flat map can show the round Earth without some distortion, because a curved surface cannot be flattened without stretching.","근거","평면 지도 → 왜곡은 피할 수 없음"],["The Mercator projection, created in the sixteenth century for sailors, preserves the angles that navigators needed but greatly enlarges regions far from the equator.","근거","메르카토르 → 방향은 정확 · 적도에서 먼 곳 부풀림",["예시"]],["On such a map, Greenland appears roughly as large as Africa, although Africa is in fact about fourteen times larger.","예시","그린란드 ≈ 아프리카처럼 보임"],["For navigation, where accurate direction mattered more than accurate size, this trade-off was entirely reasonable.","반대쪽","항해에는 합리적"],["The trouble began when the same map was hung on classroom walls as a general picture of the world.","주장","교실 벽에 걸면서 문제(핵심)"],["Students who grow up with it may come to regard northern countries as larger, and perhaps more important, than they actually are.","근거","학생 → 북쪽 나라를 크게 · 중요하게 봄"],["Some teachers now pair it with equal-area maps, which show sizes accurately at the cost of distorting shapes.","예시","일부 교사 → 넓이 맞는 지도도 함께 걺",["근거"]],["A map is thus never just a picture; it carries the purposes of the people who designed it.","결론","지도 = 만든 이의 목적"],["Choosing a map for a classroom, therefore, means deciding which impressions students will absorb without noticing, not merely settling a technical detail.","결론","지도 고르기 → 무엇을 심을지 결정"]],"line":"평면 지도는 왜곡을 피할 수 없고 항해용 지도는 적도에서 먼 곳을 부풀린다. 항해에는 합리적이었지만, 그 지도를 교실에 걸면 학생이 세상을 비틀어 보게 되니, 지도 고르기는 무엇을 심을지 정하는 일이다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["how modern technology has corrected the errors of old maps","why flat maps cannot avoid distorting the Earth's surface","how a map made for sailors can shape our view of the world","why students should learn to draw their own world maps","how equal-area maps show students the true shapes of nations"],"ans":2,"why":"한 줄의 「항해용 지도를 교실에 걸면 학생이 세상을 비틀어 보게 된다」가 정답(how a map made for sailors can shape our view of the world)과 같아요. 「modern technology has corrected the errors」는 (1)과 어긋나요. 어떤 평면 지도도 왜곡을 피할 수 없다(No flat map can show the round Earth without some distortion)고 했으니 「바로잡았다」고 할 수 없어요. 「students should learn to draw their own world maps」는 지도 이야기에 그럴듯하지만, 글은 학생이 무엇을 할지가 아니라 교실에 어떤 지도를 거느냐를 말해요. 「flat maps cannot avoid distorting」은 첫 문장 (1)의 사실 설명으로, 글은 여기서 시작할 뿐이고 (5) The trouble began에서 교실 이야기로 방향을 틀어요. 「equal-area maps show students the true shapes」는 (7)과 어긋나요. 그 지도는 넓이는 맞지만 모양을 비틀어요(at the cost of distorting shapes).","tip":"(4)처럼 짧게 인정하는 문장 바로 뒤의 (5) The trouble began이 방향을 트는 곳이에요. 앞의 (1)~(3)은 사실 설명일 뿐 핵심이 아니에요."},{"id":"Q4","title":"사라지는 언어","sents":[["Some argue that the disappearance of small languages, although regrettable, is a natural and even convenient result of a connected world.","반대쪽","작은 언어 소멸 → 자연스럽다(남들 생각)"],["If everyone shares a few major languages, the reasoning goes, commerce, scientific collaboration and friendship across borders all become easier.","반대쪽","큰 언어 몇 개 → 교류 쉬움"],["Yet a language is not merely a tool for exchanging messages; it also stores knowledge that may exist nowhere else.","주장","언어 = 지식 창고(핵심)"],["Communities that have lived in one place for centuries often have precise vocabulary for local vegetation, weather patterns and seasonal shifts that outsiders never needed to name.","근거","오래 산 공동체 → 자연을 가리키는 정밀한 말",["예시"]],["When the last fluent speakers die, much of that knowledge can vanish with them, since it was seldom documented.","근거","마지막 화자 죽음 → 지식도 사라짐"],["Linguists estimate that a large share of the world's roughly 7,000 languages, some of which have only a few elderly speakers, could fall silent within this century.","근거","언어 다수 → 이번 세기에 소멸 위기"],["Recording and teaching these languages takes time and money, and not every community wants outside help.","반대쪽","기록 → 돈·시간 들고 원치 않는 곳도"],["Even so, where speakers themselves ask for support, documentation projects can preserve at least part of what would otherwise be lost.","근거","원하는 곳 → 기록으로 일부 지킴",["주장"]],["Losing a language, then, is less like retiring an old tool than like closing a library whose books were never copied.","결론","언어 소멸 = 사본 없는 도서관 닫기"]],"line":"작은 언어가 사라지는 것을 자연스럽다고 보는 이도 있지만, 언어는 그곳에만 있는 지식을 담고 있어 사라지면 지식도 사라진다. 원하는 곳에서는 기록으로 일부를 지킬 수 있다. 언어를 잃는 것은 사본 없는 도서관을 닫는 일이다.","q":"윗글의 주제로 가장 적절한 것은?","opts":["why a few major languages will dominate the future","the knowledge that is lost when small languages disappear","how learning a second language changes the way we think","why communities need outside help to record their languages","how local vocabulary reflects the climate of a region"],"ans":1,"why":"한 줄의 「언어는 그곳에만 있는 지식을 담고 있어 사라지면 지식도 사라진다」가 정답(the knowledge that is lost when small languages disappear)과 같아요. 「a few major languages will dominate」는 (1)(2)의 낱말을 빌린 앞날 예측이에요. 글은 큰 언어가 퍼질지를 다투지 않고, 작은 언어에 담긴 지식(stores knowledge that may exist nowhere else)을 말해요. 「learning a second language changes the way we think」는 언어 이야기에 흔한 주장이지만, 글은 외국어를 배우는 사람이 아니라 사라지는 언어를 말해요. 「communities need outside help」는 (7)(8)의 곁가지이고, (7)은 모두가 바깥 도움을 원하지는 않는다(not every community wants outside help)고, (8)은 화자가 청하는 곳(where speakers themselves ask)에서만 돕는다고 했어요. 「local vocabulary reflects the climate」는 근거 (4)의 세부만 키운 말이에요.","tip":"반대쪽이 두 문장(1)(2)이나 이어져도 (3) Yet에서 방향이 바뀌어요. 뒤의 (7)도 반대쪽이지만, (8) Even so가 다시 주장 쪽으로 돌려놓아요."}]}};

async function sumLoad() {

  try { const r = await appStorage.get(k, true); if (r && r.value) Object.assign(sumState, JSON.parse(r.value)); } catch (e) { /* 기록 없음 — 처음 시작 */ }
  sumState.c = sumState.c || {}; sumState.w = sumState.w || {}; sumState.p = sumState.p || {};

function sumStat(list, rec) {
  const s = list.filter(it => rec[it.id]);
  const ok = s.filter(it => rec[it.id].c).length;
  return { total: list.length, done: s.length, rate: s.length ? Math.round(ok / s.length * 100) : 0 };
}
// 안 푼 문항 먼저, 그다음 틀린 문항, 그다음 맞힌 문항. 같은 묶음 안에서는 깊이를 가리지 않고 섞는다.
function sumPick(list, rec, n) {
  const unseen = shuffleArr(list.filter(it => !rec[it.id]));
  const wrong = shuffleArr(list.filter(it => rec[it.id] && !rec[it.id].c));
  const right = shuffleArr(list.filter(it => rec[it.id] && rec[it.id].c));
  return unseen.concat(wrong, right).slice(0, n);
}

function sumStartRound(kind) {
  const list = kind === 'c' ? sumBank().choose : sumBank().write;
  const rec = kind === 'c' ? sumState.c : sumState.w;
  sumRound = { kind, list: sumPick(list, rec, SUM_ROUND), i: 0, score: 0, half: 0, miss: {} };
  if (!sumRound.list.length) { renderSumMenu(); return; }
  sumRenderItem();
}
function sumRenderItem() {
  const R = sumRound;
  if (R.i >= R.list.length) { sumRenderEnd(); return; }
  if (R.kind === 'c') sumRenderChoose(R.list[R.i]); else sumRenderWrite(R.list[R.i]);
}
function sumNextButtons(card) {
  const R = sumRound;
  const wrap = myEl('div', 'display:flex;gap:8px;margin-top:14px;');
  const last = R.i + 1 >= R.list.length;
  const next = myEl('button', null, last ? '결과 보기' : '다음 문제'); next.className = 'primary'; next.style.margin = '0';
  next.onclick = () => { R.i++; sumRenderItem(); };
  const menu = myEl('button', null, '목록'); menu.className = 'secondary'; menu.style.cssText = 'margin:0;width:auto;padding:0 16px;white-space:nowrap;flex:none;'; menu.onclick = renderSumMenu;
  wrap.append(next, menu); card.append(wrap);

}

function sumRenderChoose(it) {
  const R = sumRound;
  const { app, card } = sumShell(`여백 노트 ${SUM_SET_NAME[sumSet]} · 고르기`, `${R.i + 1} / ${R.list.length}`);
  card.append(myEl('p', 'font-size:13.5px;font-weight:600;color:#111827;margin:0 0 10px;', '문장의 요점을 가장 잘 줄인 것을 고르세요.'));
  sumSentenceBox(card, it);
  const opts = shuffleArr([{ t: it.a, ok: true, why: '' }].concat(it.tr.map(x => ({ t: x[0], ok: false, why: x[1] }))));
  const btns = [];
  const list = myEl('div');
  opts.forEach((o, k) => {
    const b = myEl('button', 'display:block;width:100%;text-align:left;background:#fff;border:1px solid #D1D5DB;border-radius:10px;padding:11px 12px;margin-bottom:7px;cursor:pointer;font-size:14px;color:#111827;', `${SUM_CIRC[k]} ${o.t}`);
    b.onclick = () => pick(k); btns.push(b); list.append(b);
  });
  card.append(list);
  const fb = myEl('div'); card.append(fb);
  function pick(k) {
    btns.forEach(b => { b.disabled = true; b.style.cursor = 'default'; });
    const chosen = opts[k], ok = chosen.ok;
    opts.forEach((o, j) => {
      if (o.ok) { btns[j].style.background = '#E7F6EC'; btns[j].style.borderColor = '#34A853'; }
      else if (j === k) { btns[j].style.background = '#FDECEC'; btns[j].style.borderColor = '#E06666'; }
    });
    const prev = sumState.c[it.id];
    sumState.c[it.id] = { c: ok, n: ((prev && prev.n) || 0) + 1, t: Date.now() }; sumSave();
    if (ok) R.score++; else R.miss[it.k] = (R.miss[it.k] || 0) + 1;
    const box = myEl('div', `margin-top:6px;border-radius:10px;padding:12px 13px;line-height:1.7;font-size:13.5px;color:#1F2937;background:${ok ? '#F0FAF3' : '#FFF6F6'};border:1px solid ${ok ? '#B7E1C3' : '#F3C2C2'};`);
    box.append(myEl('div', `font-weight:700;margin-bottom:4px;color:${ok ? '#1E7B3A' : '#B42318'};`, ok ? '맞았어요!' : `아쉬워요. 정답은 「${it.a}」예요.`));
    box.append(myEl('div', 'font-size:12px;color:#6B7280;margin-bottom:6px;', `이 문장의 신호: ${it.dev}`));
    box.append(myEl('div', 'margin-bottom:8px;', it.why));
    opts.filter(o => !o.ok).forEach(o => {
      const row = myEl('div', `margin-top:4px;${o === chosen ? 'font-weight:600;' : ''}`);
      row.textContent = `「${o.t}」 — ${o.why}`; box.append(row);
    });
    fb.append(box);
    const next = sumNextButtons(card);
    try { next.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) { /* 오래된 브라우저 */ }
  }
  sumNavCard(app);
}

function sumRenderWrite(it) {
  const R = sumRound;
  const { app, card } = sumShell(`여백 노트 ${SUM_SET_NAME[sumSet]} · 직접 쓰기`, `${R.i + 1} / ${R.list.length}`);
  card.append(myEl('p', 'font-size:13.5px;font-weight:600;color:#111827;margin:0 0 10px;', '문장의 요점을 우리말 낱말 1~3개로 쓰세요. 화살표(→)를 써도 됩니다.'));
  sumSentenceBox(card, it);
  const ta = myEl('input', 'width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #D1D5DB;border-radius:10px;font-size:15px;margin-bottom:4px;');
  ta.type = 'text'; ta.maxLength = 40; ta.placeholder = '예: 운동 → 숙면';
  const arrow = myEl('button', 'background:#F3F4F6;border:1px solid #D1D5DB;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;margin:2px 0 8px;', '→ 넣기');
  arrow.onclick = () => { ta.value = (ta.value.trim() + ' → ').replace(/^ → $/, '→ '); ta.focus(); };
  card.append(ta, arrow);
  const show = myEl('button', null, '모범 답 보기'); show.className = 'primary'; show.style.marginTop = '6px';
  const fb = myEl('div'); card.append(show, fb);
  show.onclick = () => {
    if (!ta.value.trim() && !show.dataset.warned) { show.dataset.warned = '1'; show.textContent = '먼저 써 보세요 (그래도 보려면 한 번 더 누르기)'; ta.focus(); return; }
    show.remove(); ta.disabled = true; arrow.remove();
    const box = myEl('div', 'margin-top:8px;border-radius:10px;padding:12px 13px;line-height:1.7;font-size:13.5px;color:#1F2937;background:#F8FAFC;border:1px solid #CBD5E1;');
    const row = (label, text, color) => { const d = myEl('div', 'margin-bottom:6px;'); d.append(myEl('span', `font-weight:700;color:${color};`, label + ' '), myEl('span', null, text)); box.append(d); };
    if (ta.value.trim()) row('내 답:', ta.value.trim(), '#374151');
    row('모범 답:', it.model, '#1E7B3A');
    row('이 정도면 인정:', it.accept, '#1D4ED8');
    row('이렇게 쓰면 안 됨:', it.no, '#B42318');
    box.append(myEl('div', 'font-size:12px;color:#6B7280;margin-top:4px;', `이 문장의 신호: ${it.dev}`));
    fb.append(box);
    fb.append(myEl('p', 'font-size:13px;font-weight:600;color:#111827;margin:12px 0 6px;', '내 답은 어땠나요?'));
    const g = myEl('div', 'display:flex;gap:6px;flex-wrap:wrap;');
    [['맞게 썼어요', 2, '#E7F6EC', '#1E7B3A'], ['반만 맞았어요', 1, '#FEF7E6', '#92400E'], ['다시 볼래요', 0, '#FDECEC', '#B42318']].forEach(([label, v, bg, fg]) => {
      const b = myEl('button', `flex:1;min-width:92px;background:${bg};color:${fg};border:1px solid ${fg}33;border-radius:10px;padding:10px 8px;font-size:13px;font-weight:600;cursor:pointer;`, label);
      b.onclick = () => {
        const prev = sumState.w[it.id];
        sumState.w[it.id] = { c: v === 2, g: v, n: ((prev && prev.n) || 0) + 1, t: Date.now() }; sumSave();
        if (v === 2) R.score++; else { if (v === 1) R.half++; R.miss[it.k] = (R.miss[it.k] || 0) + 1; }
        R.i++; sumRenderItem();
      };
      g.append(b);
    });
    fb.append(g);
  };
  sumNavCard(app);
}

function sumRenderEnd() {
  const R = sumRound;
  const { app, card } = sumShell(R.kind === 'c' ? `여백 노트 ${SUM_SET_NAME[sumSet]} · 고르기 결과` : `여백 노트 ${SUM_SET_NAME[sumSet]} · 직접 쓰기 결과`, '');
  card.append(myEl('p', 'font-size:18px;font-weight:700;color:#16324F;margin:4px 0 6px;', `${R.list.length}문항 중 ${R.score}문항 맞음${R.half ? ` · 반만 맞음 ${R.half}` : ''}`));
  const steps = Object.keys(R.miss).sort();
  if (steps.length) {
    card.append(myEl('p', 'font-size:13px;color:#374151;margin:8px 0 4px;', '놓친 문장은 핵심이 이런 깊이에 숨어 있었어요.'));
    steps.forEach(k => card.append(myEl('div', 'font-size:13px;color:#374151;margin:2px 0;', `· ${SUM_STEP_NAME[k] || k} — ${R.miss[k]}문항`)));
  } else {
    card.append(myEl('p', 'font-size:13px;color:#374151;margin:8px 0 4px;', '모두 맞혔어요. 다음 판에서는 아직 안 푼 문장이 먼저 나와요.'));
  }
  const again = myEl('button', null, `한 판 더 (${SUM_ROUND}문항)`); again.className = 'primary'; again.onclick = () => sumStartRound(R.kind);
  const menu = myEl('button', null, '목록'); menu.className = 'secondary'; menu.onclick = renderSumMenu;
  card.append(again, menu);
  sumNavCard(app);
}

function renderSumParaMenu() {
  const { app, card } = sumShell(`여백 노트 ${SUM_SET_NAME[sumSet]} · 단락`, '');
  card.append(myEl('p', 'font-size:13px;color:#374151;margin:0 0 12px;line-height:1.65;', '단락의 문장마다 역할(반대쪽 · 주장 · 근거 · 예시 · 결론)을 고르고 축약어를 씁니다. 모범 답과 견준 뒤, 축약어만 이어 한 줄로 만들고 주제 문제를 풉니다.'));
  sumBank().paras.forEach((P, idx) => {
    const r = sumState.p[P.id];
    const sub = r ? `${r.c ? '주제 맞힘' : '주제 틀림'} · 역할 ${r.roles}/${P.sents.length} 맞음` : '아직 안 풀었어요';
    const b = myEl('button', 'display:block;width:100%;text-align:left;background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:12px 13px;margin-bottom:8px;cursor:pointer;');
    b.append(myEl('div', 'font-size:14px;font-weight:700;color:#111827;', `단락 ${idx + 1} — ${P.title}`), myEl('div', 'font-size:12px;color:#6B7280;margin-top:3px;', `${P.sents.length}문장 · ${sub}`));
    b.onclick = () => sumRenderPara(P, idx); card.append(b);
  });
  const menu = myEl('button', null, '목록'); menu.className = 'secondary'; menu.onclick = renderSumMenu; card.append(menu);
  sumNavCard(app);
}

function sumRenderPara(P, idx) {
  const { app, card } = sumShell(`여백 노트 ${SUM_SET_NAME[sumSet]} · 단락 ${idx + 1}`, P.title);
  card.append(myEl('p', 'font-size:13.5px;font-weight:600;color:#111827;margin:0 0 10px;', '문장마다 역할을 고르고, 축약어를 쓰세요.'));
  const rows = P.sents.map((sn, k) => {
    const wrap = myEl('div', 'border:1px solid #E5E7EB;border-radius:10px;padding:10px 12px;margin-bottom:8px;');
    wrap.append(myEl('div', 'font-size:14.5px;color:#111827;line-height:1.7;margin-bottom:8px;', `(${k + 1}) ${sn[0]}`));
    const chips = myEl('div', 'display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;');
    const state = { role: '', chips: [] };
    SUM_ROLES.forEach(rl => {
      const c = myEl('button', 'width:auto;margin:0;padding:6px 10px;font-size:12.5px;border-radius:999px;border:1px solid #C7D2E0;background:#fff;color:#16324F;cursor:pointer;', rl);
      c.onclick = () => { if (state.locked) return; state.role = rl; state.chips.forEach(x => { const on = x.textContent === rl; x.style.background = on ? '#16324F' : '#fff'; x.style.color = on ? '#fff' : '#16324F'; }); };
      state.chips.push(c); chips.append(c);
    });
    const inp = myEl('input', 'width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #D1D5DB;border-radius:9px;font-size:14px;');
    inp.type = 'text'; inp.maxLength = 40; inp.placeholder = '축약어 (예: 앱 → 편리)';
    const out = myEl('div');
    wrap.append(chips, inp, out); card.append(wrap);
    return { sn, state, inp, out };
  });
  const check = myEl('button', null, '모범 답과 견주기'); check.className = 'primary';
  const after = myEl('div');
  card.append(check, after);
  check.onclick = () => {
    check.remove();
    let roleOk = 0;
    rows.forEach(r => {
      r.state.locked = true; r.inp.disabled = true;
      const alt = r.sn[3] || []; const ok = r.state.role === r.sn[1] || alt.indexOf(r.state.role) >= 0; if (ok) roleOk++;
      const d = myEl('div', 'margin-top:7px;font-size:13px;line-height:1.6;background:#F8FAFC;border-radius:8px;padding:7px 9px;');
      d.append(myEl('span', `font-weight:700;color:${ok ? '#1E7B3A' : '#B42318'};`, `${ok ? '✓' : '✗'} 역할: ${r.sn[1]}${alt.length ? ` (${alt.join(' · ')}도 인정)` : ''}`), myEl('span', 'color:#374151;', `　모범 축약어: ${r.sn[2]}`));
      r.out.append(d);
    });
    after.append(myEl('p', 'font-size:13.5px;font-weight:600;color:#111827;margin:14px 0 6px;', `역할 ${roleOk}/${rows.length} 맞음. 이제 축약어만 이어 한 줄로 써 보세요.`));
    const lineIn = myEl('textarea', 'width:100%;box-sizing:border-box;min-height:64px;padding:10px 11px;border:1px solid #D1D5DB;border-radius:9px;font-size:14px;line-height:1.6;');
    lineIn.placeholder = '예: 앱은 편하지만 ~ 하게 된다.';
    const showLine = myEl('button', null, '모범 한 줄 보기'); showLine.className = 'secondary';
    const lineOut = myEl('div');
    after.append(lineIn, showLine, lineOut);
    showLine.onclick = () => {
      showLine.remove(); lineIn.disabled = true;
      const box = myEl('div', 'margin-top:8px;background:#F0F7FF;border:1px solid #C7DBF2;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.7;color:#16324F;');
      box.append(myEl('div', 'font-weight:700;margin-bottom:3px;', '모범 한 줄'), myEl('div', null, P.line), myEl('div', 'font-size:12.5px;color:#475569;margin-top:6px;', P.tip));
      lineOut.append(box);
      sumParaQuestion(after, P, roleOk);
    };
  };
  const back = myEl('button', null, '단락 목록'); back.className = 'secondary'; back.onclick = renderSumParaMenu;
  app.append(back);
  sumNavCard(app);
}

function sumParaQuestion(host, P, roleOk) {
  host.append(myEl('p', 'font-size:13.5px;font-weight:600;color:#111827;margin:16px 0 8px;', P.q));
  const opts = shuffleArr(P.opts.map((t, j) => ({ t, ok: j === P.ans })));
  const btns = [];
  opts.forEach((o, k) => {
    const b = myEl('button', 'display:block;width:100%;text-align:left;background:#fff;border:1px solid #D1D5DB;border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:pointer;font-size:14px;color:#111827;', `${SUM_CIRC[k]} ${o.t}`);
    b.onclick = () => {
      btns.forEach(x => { x.disabled = true; x.style.cursor = 'default'; });
      opts.forEach((p, j) => {
        if (p.ok) { btns[j].style.background = '#E7F6EC'; btns[j].style.borderColor = '#34A853'; }
        else if (j === k) { btns[j].style.background = '#FDECEC'; btns[j].style.borderColor = '#E06666'; }
      });
      const ok = o.ok;
      sumState.p[P.id] = { c: ok, roles: roleOk, n: (((sumState.p[P.id] || {}).n) || 0) + 1, t: Date.now() }; sumSave();
      const box = myEl('div', `margin-top:6px;border-radius:10px;padding:12px 13px;line-height:1.7;font-size:13.5px;color:#1F2937;background:${ok ? '#F0FAF3' : '#FFF6F6'};border:1px solid ${ok ? '#B7E1C3' : '#F3C2C2'};`);
      box.append(myEl('div', `font-weight:700;margin-bottom:4px;color:${ok ? '#1E7B3A' : '#B42318'};`, ok ? '맞았어요!' : `아쉬워요. 정답은 「${P.opts[P.ans]}」예요.`), myEl('div', null, P.why));
      host.append(box);
      const wrap = myEl('div', 'display:flex;gap:8px;margin-top:14px;');
      const more = myEl('button', null, '다른 단락'); more.className = 'primary'; more.style.margin = '0'; more.onclick = renderSumParaMenu;
      const menu = myEl('button', null, '목록'); menu.className = 'secondary'; menu.style.cssText = 'margin:0;width:auto;padding:0 16px;white-space:nowrap;flex:none;'; menu.onclick = renderSumMenu;
      wrap.append(more, menu); host.append(wrap);
    };
    btns.push(b); host.append(b);
  });
}
mnStart();
</script>
</body>
</html>
